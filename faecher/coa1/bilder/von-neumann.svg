<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="380" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Von-Neumann-Architektur</text>

  <!-- CPU -->
  <rect x="12" y="44" width="160" height="164" rx="12" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="92" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">CPU</text>
  <rect x="26" y="74" width="132" height="54" rx="8" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="92" y="97" text-anchor="middle" font-size="15" font-weight="700">Steuerwerk</text>
  <text x="92" y="116" text-anchor="middle" font-size="12" fill="#555">steuert alle Abläufe</text>
  <rect x="26" y="142" width="132" height="54" rx="8" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="92" y="165" text-anchor="middle" font-size="15" font-weight="700">Rechenwerk</text>
  <text x="92" y="184" text-anchor="middle" font-size="12" fill="#555">rechnet (ALU)</text>
  <line x1="92" y1="129" x2="92" y2="141" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Speicher -->
  <rect x="190" y="44" width="178" height="72" rx="12" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
  <text x="279" y="70" text-anchor="middle" font-size="15" font-weight="700">Speicher</text>
  <text x="279" y="90" text-anchor="middle" font-size="12" fill="#333">EIN gemeinsamer Speicher</text>
  <text x="279" y="106" text-anchor="middle" font-size="12" fill="#333">für Daten UND Programme</text>

  <!-- E/A -->
  <rect x="190" y="136" width="178" height="72" rx="12" fill="#f6e4e8" stroke="#D4607A" stroke-width="2"/>
  <text x="279" y="162" text-anchor="middle" font-size="15" font-weight="700">Ein-/Ausgabeeinheit</text>
  <text x="279" y="182" text-anchor="middle" font-size="12" fill="#333">Verbindung zur Außenwelt</text>
  <text x="279" y="198" text-anchor="middle" font-size="12" fill="#333">(Tastatur, Monitor, Laufwerke …)</text>

  <!-- Systembus -->
  <rect x="12" y="236" width="376" height="102" rx="12" fill="#f4f1ee" stroke="#999"/>
  <text x="22" y="254" font-size="13" font-weight="700">Systembus</text>
  <!-- Datenbus -->
  <line x1="22" y1="272" x2="378" y2="272" stroke="#333" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="240" y="266" text-anchor="middle" font-size="12">Datenbus · bidirektional (beide Richtungen)</text>
  <!-- Adressbus -->
  <line x1="22" y1="298" x2="378" y2="298" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="292" text-anchor="middle" font-size="12">Adressbus · nur von der CPU weg</text>
  <!-- Steuerbus -->
  <line x1="22" y1="324" x2="378" y2="324" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="318" text-anchor="middle" font-size="12">Steuerbus · nur von der CPU weg</text>

  <!-- Anschlüsse an den Bus -->
  <line x1="92" y1="208" x2="92" y2="236" stroke="#333" stroke-width="2.5"/>
  <path d="M368,80 h16 v156" fill="none" stroke="#333" stroke-width="2.5"/>
  <line x1="279" y1="208" x2="279" y2="236" stroke="#333" stroke-width="2.5"/>

  <text x="200" y="360" text-anchor="middle" font-size="12" fill="#555">Arbeitet nach dem EVA-Prinzip, streng nacheinander (sequenziell).</text>
  <text x="200" y="375" text-anchor="middle" font-size="12" fill="#555">Der gemeinsame Bus ist der Flaschenhals. · Buch S. 5–7</text>
</svg>
