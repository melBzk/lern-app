<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <rect width="400" height="420" fill="#fff"/>
  <g stroke="#555" stroke-width="2" fill="none">
    <!-- Baum -->
    <line x1="200" y1="72" x2="200" y2="92"/>
    <line x1="200" y1="122" x2="200" y2="134"/>
    <line x1="70" y1="134" x2="330" y2="134"/>
    <line x1="70" y1="134" x2="70" y2="150"/>
    <line x1="200" y1="134" x2="200" y2="150"/>
    <line x1="330" y1="134" x2="330" y2="150"/>
    <line x1="330" y1="180" x2="330" y2="192"/>
    <line x1="270" y1="192" x2="380" y2="192"/>
    <line x1="270" y1="192" x2="270" y2="206"/>
    <line x1="380" y1="192" x2="380" y2="206"/>
    <!-- Kette -->
    <line x1="88" y1="321" x2="104" y2="321"/>
    <line x1="168" y1="321" x2="184" y2="321"/>
    <line x1="248" y1="321" x2="264" y2="321"/>
    <line x1="328" y1="321" x2="344" y2="321"/>
  </g>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">USB: Baum · Thunderbolt: Kette</text>

  <text x="12" y="56" font-size="14" font-weight="700" fill="#3a6ed8">USB / USB4 – Baum- bzw. Hubstruktur</text>
  <rect x="140" y="62" width="120" height="30" rx="7" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" font-size="12.5" font-weight="700">PC: Host-Controller</text>
  <rect x="160" y="92" width="80" height="30" rx="7" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="200" y="112" text-anchor="middle" font-size="12.5">Root-Hub</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="150" width="80" height="30" rx="7" fill="#f4f1ee" stroke="#555"/><text x="70" y="170">Maus</text>
    <rect x="160" y="150" width="80" height="30" rx="7" fill="#f4f1ee" stroke="#555"/><text x="200" y="170">Drucker</text>
    <rect x="290" y="150" width="80" height="30" rx="7" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><text x="330" y="170">Hub</text>
    <rect x="232" y="206" width="76" height="30" rx="7" fill="#f4f1ee" stroke="#555"/><text x="270" y="226">Stick</text>
    <rect x="344" y="206" width="52" height="30" rx="7" fill="#f4f1ee" stroke="#555"/><text x="370" y="226">Cam</text>
  </g>
  <text x="12" y="216" font-size="12.5">bis zu <tspan font-weight="700">127 Geräte</tspan></text>
  <text x="12" y="232" font-size="12.5">je Controller, über Hubs</text>
  <text x="12" y="248" font-size="12.5">beliebig verzweigt</text>

  <line x1="12" y1="268" x2="388" y2="268" stroke="#ddd"/>

  <text x="12" y="294" font-size="14" font-weight="700" fill="#D4607A">Thunderbolt – Kette (Daisy-Chain)</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="12" y="306" width="76" height="30" rx="7" fill="#f6e4e8" stroke="#D4607A" stroke-width="2"/><text x="50" y="326" font-weight="700">PC</text>
    <rect x="104" y="306" width="64" height="30" rx="7" fill="#f4f1ee" stroke="#555"/><text x="136" y="326">Gerät 1</text>
    <rect x="184" y="306" width="64" height="30" rx="7" fill="#f4f1ee" stroke="#555"/><text x="216" y="326">Gerät 2</text>
    <rect x="264" y="306" width="64" height="30" rx="7" fill="#f4f1ee" stroke="#555"/><text x="296" y="326">Gerät 3</text>
    <text x="368" y="326">…</text>
  </g>
  <text x="12" y="360" font-size="12.5">Jedes Gerät reicht die Verbindung an das nächste weiter.</text>
  <text x="12" y="376" font-size="12.5">Thunderbolt: bis <tspan font-weight="700">7 Geräte</tspan> (laut Buch) · FireWire: Kette bis <tspan font-weight="700">63</tspan></text>
  <text x="200" y="408" text-anchor="middle" font-size="11" fill="#666">Buch S. 94–100</text>
</svg>
