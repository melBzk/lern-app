<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <style>
    .t{font-size:13.5px;font-weight:700}
    .s{font-size:11.5px;fill:#444}
    .n{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
    .ar{stroke:#555;stroke-width:2;marker-end:url(#a)}
  </style>
  <rect width="400" height="640" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Startvorgang des PCs</text>

  <!-- Phase BIOS/UEFI -->
  <rect x="8" y="38" width="384" height="330" rx="12" fill="#e8f0fe" stroke="#3a6ed8"/>
  <text x="18" y="57" font-size="12.5" font-weight="700" fill="#3a6ed8">BIOS / UEFI (Firmware auf dem Mainboard) · Buch S. 147</text>

  <g>
    <rect x="18" y="66" width="364" height="40" rx="8" fill="#fff" stroke="#3a6ed8"/>
    <circle cx="36" cy="86" r="11" fill="#3a6ed8"/><text x="36" y="91" class="n">1</text>
    <text x="54" y="83" class="t">Einschalten</text>
    <text x="54" y="99" class="s">CPU startet das BIOS aus dem Flash-Baustein</text>
  </g>
  <line x1="200" y1="106" x2="200" y2="116" class="ar"/>
  <g>
    <rect x="18" y="118" width="364" height="54" rx="8" fill="#fff" stroke="#3a6ed8"/>
    <circle cx="36" cy="145" r="11" fill="#3a6ed8"/><text x="36" y="150" class="n">2</text>
    <text x="54" y="136" class="t">POST (Power-On Self-Test)</text>
    <text x="54" y="152" class="s">Hardware initialisieren und prüfen · kritischer Fehler</text>
    <text x="54" y="166" class="s">(z. B. Mainboard) = sofortiger Abbruch, oft Pieptöne</text>
  </g>
  <line x1="200" y1="172" x2="200" y2="182" class="ar"/>
  <g>
    <rect x="18" y="184" width="364" height="40" rx="8" fill="#fff" stroke="#3a6ed8"/>
    <circle cx="36" cy="204" r="11" fill="#3a6ed8"/><text x="36" y="209" class="n">3</text>
    <text x="54" y="201" class="t">CMOS-Einstellungen laden</text>
    <text x="54" y="217" class="s">Systemkonfiguration prüfen</text>
  </g>
  <line x1="200" y1="224" x2="200" y2="234" class="ar"/>
  <g>
    <rect x="18" y="236" width="364" height="40" rx="8" fill="#fff" stroke="#3a6ed8"/>
    <circle cx="36" cy="256" r="11" fill="#3a6ed8"/><text x="36" y="261" class="n">4</text>
    <text x="54" y="253" class="t">Plug &amp; Play</text>
    <text x="54" y="269" class="s">Ressourcen zuweisen (Adressen, I/O-Ports, IRQs, DMA)</text>
  </g>
  <line x1="200" y1="276" x2="200" y2="286" class="ar"/>
  <g>
    <rect x="18" y="288" width="364" height="70" rx="8" fill="#fff" stroke="#3a6ed8"/>
    <circle cx="36" cy="323" r="11" fill="#3a6ed8"/><text x="36" y="328" class="n">5</text>
    <text x="54" y="306" class="t">Bootmedium suchen und starten</text>
    <text x="54" y="322" class="s">in der eingestellten Bootreihenfolge (SSD, USB …)</text>
    <text x="54" y="336" class="s">Boot Record laden → Bootloader übernimmt</text>
    <text x="54" y="350" class="s">(Windows Boot Manager, bei Linux z. B. GRUB)</text>
  </g>

  <line x1="200" y1="368" x2="200" y2="384" class="ar"/>

  <!-- Phase Windows -->
  <rect x="8" y="386" width="384" height="222" rx="12" fill="#f6e4e8" stroke="#D4607A"/>
  <text x="18" y="405" font-size="12.5" font-weight="700" fill="#D4607A">Windows · Buch S. 160–162</text>
  <g>
    <rect x="18" y="414" width="364" height="40" rx="8" fill="#fff" stroke="#D4607A"/>
    <circle cx="36" cy="434" r="11" fill="#D4607A"/><text x="36" y="439" class="n">6</text>
    <text x="54" y="431" class="t">Boot Manager liest den BCD-Speicher</text>
    <text x="54" y="447" class="s">Startkonfiguration · bearbeiten mit bcdedit (als Admin)</text>
  </g>
  <line x1="200" y1="454" x2="200" y2="464" class="ar"/>
  <g>
    <rect x="18" y="466" width="364" height="54" rx="8" fill="#fff" stroke="#D4607A"/>
    <circle cx="36" cy="493" r="11" fill="#D4607A"/><text x="36" y="498" class="n">7</text>
    <text x="54" y="484" class="t">Phase 1: Winload.exe</text>
    <text x="54" y="500" class="s">lädt wichtige Treiber und den Kernel,</text>
    <text x="54" y="514" class="s">verarbeitet die Registry</text>
  </g>
  <line x1="200" y1="520" x2="200" y2="530" class="ar"/>
  <g>
    <rect x="18" y="532" width="364" height="66" rx="8" fill="#fff" stroke="#D4607A"/>
    <circle cx="36" cy="565" r="11" fill="#D4607A"/><text x="36" y="570" class="n">8</text>
    <text x="54" y="550" class="t">Phase 2: Kernel startet das System</text>
    <text x="54" y="566" class="s">Plug &amp; Play → Smss.exe → Subsysteme, Dienste</text>
    <text x="54" y="582" class="s">→ <tspan font-weight="700">Winlogon.exe</tspan>: Anmeldung</text>
  </g>

  <text x="200" y="628" text-anchor="middle" font-size="11.5" fill="#666">Merke: Smss = Subsysteme · Winlogon = Anmeldung</text>
</svg>
