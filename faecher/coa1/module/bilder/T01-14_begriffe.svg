<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Die acht neuen Wörter als Bildliste mit Symbolen. Router: Kasten mit Antennen, verbindet zwei Netze. WLAN: Funkwellen, Netz per Funk ohne Kabel. Access Point: Funk-Zugangspunkt, zu dem die Geräte funken. Modem: Daten werden zu Signalen für die Leitung und zurück. Kupferkabel und Lichtwellenleiter: Kabel aus Metall oder Glasfaser. NAS: Festplattenspeicher im eigenen Netz. Cloud: Online-Speicher bei einem Anbieter im Internet. Gastnetz: Besuch bekommt nur Internet, kein Heimnetz.</title>
<rect width="400" height="560" fill="#fff"/>
<g stroke="#ddd" stroke-width="1"><line x1="15" y1="68" x2="385" y2="68"/><line x1="15" y1="130" x2="385" y2="130"/><line x1="15" y1="192" x2="385" y2="192"/><line x1="15" y1="254" x2="385" y2="254"/><line x1="15" y1="316" x2="385" y2="316"/><line x1="15" y1="378" x2="385" y2="378"/><line x1="15" y1="440" x2="385" y2="440"/><line x1="15" y1="502" x2="385" y2="502"/></g>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">8 neue Wörter</text>
<text x="200" y="52" text-anchor="middle" font-size="13" fill="#555">Provider = dein Internetanbieter</text>
<!-- Router -->
<g transform="translate(50,100)"><line x1="-12" y1="-2" x2="-16" y2="-20" stroke="#333" stroke-width="2.5"/><line x1="12" y1="-2" x2="16" y2="-20" stroke="#333" stroke-width="2.5"/><rect x="-24" y="-4" width="48" height="18" rx="4" fill="#3a3f4a"/><circle cx="-12" cy="5" r="2.5" fill="#7fe08a"/><circle cx="-4" cy="5" r="2.5" fill="#7fe08a"/></g>
<text x="95" y="95" font-size="16" font-weight="700" fill="#1d3f8a">Router</text>
<text x="95" y="115">verbindet zwei Netze</text>
<!-- WLAN -->
<g transform="translate(50,174)" fill="none" stroke="#E07B00" stroke-width="3" stroke-linecap="round"><path d="M-6,-2 A8,8 0 0 1 6,-2"/><path d="M-13,-9 A17,17 0 0 1 13,-9"/><path d="M-20,-16 A26,26 0 0 1 20,-16"/><circle cx="0" cy="4" r="3" fill="#E07B00" stroke="none"/></g>
<text x="95" y="157" font-size="16" font-weight="700" fill="#a85a00">WLAN</text>
<text x="95" y="177">Netz per Funk, ohne Kabel</text>
<!-- Access Point -->
<g transform="translate(50,226)"><ellipse cx="0" cy="8" rx="20" ry="7" fill="#dfe3ea" stroke="#333" stroke-width="1.5"/><g fill="none" stroke="#E07B00" stroke-width="2" stroke-linecap="round"><path d="M-8,-6 A10,10 0 0 1 8,-6"/><path d="M-15,-13 A19,19 0 0 1 15,-13"/></g></g>
<text x="95" y="219" font-size="16" font-weight="700" fill="#1d3f8a">Access Point</text>
<text x="95" y="239">Funk-Zugangspunkt</text>
<!-- Modem -->
<g transform="translate(50,285)"><text x="-30" y="5" font-size="14" font-weight="700" fill="#1d3f8a">01</text><text x="-1" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#555">↔</text><path d="M8,0 q3,-9 6,0 t6,0 t6,0" fill="none" stroke="#2e9d5b" stroke-width="2.5"/></g>
<text x="95" y="281" font-size="16" font-weight="700" fill="#1d3f8a">Modem</text>
<text x="95" y="301">Daten ↔ Signale für die Leitung</text>
<!-- Kabel -->
<g transform="translate(50,347)"><path d="M-26,-8 H26" stroke="#b5651d" stroke-width="5" stroke-linecap="round"/><path d="M-26,8 H26" stroke="#2f8fd8" stroke-width="5" stroke-linecap="round"/><circle cx="26" cy="8" r="5" fill="#ffd54a"/></g>
<text x="95" y="343" font-size="16" font-weight="700" fill="#1d3f8a">Kupfer / Lichtwellenleiter</text>
<text x="95" y="363">Kabel aus Metall / aus Glasfaser</text>
<!-- NAS -->
<g transform="translate(50,409)"><rect x="-16" y="-20" width="32" height="40" rx="3" fill="#3a3f4a"/><rect x="-11" y="-14" width="22" height="7" fill="#9aa3ad"/><rect x="-11" y="-4" width="22" height="7" fill="#9aa3ad"/><circle cx="8" cy="12" r="2.5" fill="#7fe08a"/></g>
<text x="95" y="405" font-size="16" font-weight="700" fill="#1d3f8a">NAS</text>
<text x="95" y="425">Speicher im eigenen Netz</text>
<!-- Cloud -->
<g transform="translate(50,472)"><path d="M-22,10 a10,10 0 0 1 2,-19 a13,13 0 0 1 24,-4 a10,10 0 0 1 16,10 a8,8 0 0 1 -2,13 z" fill="#dbe7fb" stroke="#3a6ed8" stroke-width="2"/></g>
<text x="95" y="467" font-size="16" font-weight="700" fill="#1d3f8a">Cloud</text>
<text x="95" y="487">Speicher beim Anbieter im Internet</text>
<!-- Gastnetz -->
<g transform="translate(50,532)"><circle cx="-10" cy="-10" r="6" fill="#555"/><path d="M-20,12 Q-20,-2 -10,-2 Q0,-2 0,12 Z" fill="#555"/><circle cx="14" cy="0" r="10" fill="#9cc3f5" stroke="#3a6ed8" stroke-width="1.5"/><ellipse cx="14" cy="0" rx="4" ry="10" fill="none" stroke="#3a6ed8" stroke-width="1.2"/></g>
<text x="95" y="529" font-size="16" font-weight="700" fill="#1d3f8a">Gastnetz</text>
<text x="95" y="549">Besuch: nur Internet, kein Heimnetz</text>
</svg>
