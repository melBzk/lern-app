<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Die 8 neuen Wörter mit kleinen Symbolen. ATX-Anschlussfeld: Reihe Buchsen hinten am PC, am Rand des Mainboards. Analog: stufenlose Spannung, digital: nur 0 und 1. VGA: alter analoger Bildschirm-Anschluss, blau. DVI: digitaler Bildschirm-Anschluss, breit und weiß. HDMI und DisplayPort: zwei aktuelle digitale Anschlüsse. S/PDIF: digitaler Ton-Ausgang, oft optisch mit Licht. RJ45: Buchse fürs Netzwerkkabel. PS/2: runde Buchse für Tastatur und Maus.</title>
<rect width="400" height="452" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">8 Wörter auf einen Blick</text>
<g fill="#f4f1ee"><rect x="8" y="38" width="384" height="48" rx="9"/><rect x="8" y="90" width="384" height="48" rx="9"/><rect x="8" y="142" width="384" height="48" rx="9"/><rect x="8" y="194" width="384" height="48" rx="9"/><rect x="8" y="246" width="384" height="48" rx="9"/><rect x="8" y="298" width="384" height="48" rx="9"/><rect x="8" y="350" width="384" height="48" rx="9"/><rect x="8" y="402" width="384" height="48" rx="9"/></g>
<!-- 1 ATX-Anschlussfeld -->
<rect x="20" y="46" width="68" height="32" rx="3" fill="#cfd8dc" stroke="#555" stroke-width="1.5"/>
<g fill="#555"><rect x="26" y="52" width="10" height="8"/><rect x="40" y="52" width="10" height="8"/><rect x="54" y="52" width="12" height="9"/><circle cx="76" cy="57" r="4"/><rect x="26" y="64" width="18" height="8"/><circle cx="54" cy="68" r="4" fill="#2e9d5b"/><circle cx="66" cy="68" r="4" fill="#D4607A"/><circle cx="78" cy="68" r="4" fill="#3a6ed8"/></g>
<text x="102" y="60" font-size="15" font-weight="700">ATX-Anschlussfeld</text>
<text x="102" y="78" font-size="13">Buchsen hinten, am Mainboard-Rand</text>
<!-- 2 analog/digital -->
<path d="M20,116 q8,-16 16,0 t16,0" fill="none" stroke="#777" stroke-width="2.5"/>
<path d="M58,124 V108 H66 V124 H74 V108 H82 V124 H88" fill="none" stroke="#2e9d5b" stroke-width="2.5"/>
<text x="102" y="112" font-size="15" font-weight="700">analog / digital</text>
<text x="102" y="130" font-size="13">stufenlose Spannung / nur 0 und 1</text>
<!-- 3 VGA -->
<path d="M28,152 H80 L74,180 H34 Z" fill="#3a6ed8" stroke="#2550a8" stroke-width="1.5"/>
<g fill="#fff"><circle cx="40" cy="160" r="2"/><circle cx="48" cy="160" r="2"/><circle cx="56" cy="160" r="2"/><circle cx="64" cy="160" r="2"/><circle cx="72" cy="160" r="2"/><circle cx="42" cy="167" r="2"/><circle cx="50" cy="167" r="2"/><circle cx="58" cy="167" r="2"/><circle cx="66" cy="167" r="2"/><circle cx="44" cy="174" r="2"/><circle cx="52" cy="174" r="2"/><circle cx="60" cy="174" r="2"/><circle cx="68" cy="174" r="2"/></g>
<text x="102" y="164" font-size="15" font-weight="700">VGA</text>
<text x="102" y="182" font-size="13">alt, <tspan font-weight="700">analog</tspan>, blau</text>
<!-- 4 DVI -->
<rect x="20" y="204" width="70" height="28" rx="3" fill="#fff" stroke="#555" stroke-width="1.5"/>
<g fill="#555"><rect x="25" y="209" width="4" height="4"/><rect x="32" y="209" width="4" height="4"/><rect x="39" y="209" width="4" height="4"/><rect x="46" y="209" width="4" height="4"/><rect x="53" y="209" width="4" height="4"/><rect x="60" y="209" width="4" height="4"/><rect x="25" y="216" width="4" height="4"/><rect x="32" y="216" width="4" height="4"/><rect x="39" y="216" width="4" height="4"/><rect x="46" y="216" width="4" height="4"/><rect x="53" y="216" width="4" height="4"/><rect x="60" y="216" width="4" height="4"/><rect x="25" y="223" width="4" height="4"/><rect x="32" y="223" width="4" height="4"/><rect x="39" y="223" width="4" height="4"/><rect x="46" y="223" width="4" height="4"/><rect x="53" y="223" width="4" height="4"/><rect x="60" y="223" width="4" height="4"/><rect x="71" y="216" width="13" height="3"/><rect x="76" y="211" width="3" height="13"/></g>
<text x="102" y="216" font-size="15" font-weight="700">DVI</text>
<text x="102" y="234" font-size="13"><tspan font-weight="700">digital</tspan>, breit und weiß</text>
<!-- 5 HDMI / DP -->
<path d="M18,258 H50 V266 L44,272 H24 L18,266 Z" fill="#333"/>
<path d="M58,258 H90 V274 H64 L58,268 Z" fill="#333"/>
<text x="102" y="268" font-size="15" font-weight="700">HDMI / DisplayPort</text>
<text x="102" y="286" font-size="13">aktuell, <tspan font-weight="700">digital</tspan> – Monitor, Fernseher</text>
<!-- 6 S/PDIF -->
<rect x="34" y="306" width="34" height="32" rx="3" fill="#333"/>
<rect x="43" y="315" width="16" height="14" rx="2" fill="#D4607A"/>
<text x="102" y="320" font-size="15" font-weight="700">S/PDIF</text>
<text x="102" y="338" font-size="13">digitaler Ton, oft optisch (Licht)</text>
<!-- 7 RJ45 -->
<path d="M34,358 H70 V382 H62 V388 H42 V382 H34 Z" fill="#fff" stroke="#555" stroke-width="2"/>
<g stroke="#d4a017" stroke-width="2"><line x1="40" y1="362" x2="40" y2="370"/><line x1="45" y1="362" x2="45" y2="370"/><line x1="50" y1="362" x2="50" y2="370"/><line x1="55" y1="362" x2="55" y2="370"/><line x1="60" y1="362" x2="60" y2="370"/><line x1="65" y1="362" x2="65" y2="370"/></g>
<text x="102" y="372" font-size="15" font-weight="700">RJ45</text>
<text x="102" y="390" font-size="13">Buchse fürs Netzwerkkabel</text>
<!-- 8 PS/2 -->
<circle cx="38" cy="426" r="15" fill="#3fa34d" stroke="#2d7a38" stroke-width="2"/>
<circle cx="72" cy="426" r="15" fill="#8e5cc4" stroke="#6b4196" stroke-width="2"/>
<g fill="#222"><circle cx="32" cy="421" r="2"/><circle cx="44" cy="421" r="2"/><circle cx="33" cy="431" r="2"/><circle cx="43" cy="431" r="2"/><circle cx="66" cy="421" r="2"/><circle cx="78" cy="421" r="2"/><circle cx="67" cy="431" r="2"/><circle cx="77" cy="431" r="2"/></g>
<text x="102" y="424" font-size="15" font-weight="700">PS/2</text>
<text x="102" y="442" font-size="13">rund: <tspan fill="#2d7a38" font-weight="700">Maus</tspan> und <tspan fill="#6b4196" font-weight="700">Tastatur</tspan></text>
</svg>
