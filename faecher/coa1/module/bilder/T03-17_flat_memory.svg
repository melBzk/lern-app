<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Flat Memory: eine Straße von 0 bis 4 GB mit Programmcode, Daten, Stack; Schutz vor Überschreiben; an Daten und Stack: NX-Bit – hier nichts ausführen (64 Bit)</title>
<defs>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="400" height="400" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="700">Ein langer Speicher für alle</text>

<!-- Grundstücke -->
<rect x="10" y="128" width="120" height="126" fill="#e8f0fe" stroke="#555" stroke-width="2.5" stroke-dasharray="8 4"/>
<rect x="140" y="128" width="120" height="126" fill="#e8f5e9" stroke="#555" stroke-width="2.5" stroke-dasharray="8 4"/>
<rect x="270" y="128" width="120" height="126" fill="#fff4e0" stroke="#555" stroke-width="2.5" stroke-dasharray="8 4"/>
<text x="70" y="186" text-anchor="middle" font-size="15" font-weight="700">Programm-</text>
<text x="70" y="204" text-anchor="middle" font-size="15" font-weight="700">code</text>
<text x="200" y="176" text-anchor="middle" font-size="15" font-weight="700">Daten</text>
<text x="330" y="150" text-anchor="middle" font-size="15" font-weight="700">Stack</text>
<text x="330" y="166" text-anchor="middle" font-size="13">(Ablage für</text>
<text x="330" y="182" text-anchor="middle" font-size="13">Zwischenwerte)</text>

<!-- NX-Bit-Schilder an Daten und Stack (64 Bit) -->
<rect x="146" y="190" width="108" height="58" rx="4" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="200" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">NX-Bit:</text>
<text x="200" y="224" text-anchor="middle" font-size="13" fill="#3a6ed8">hier nichts</text>
<text x="200" y="241" text-anchor="middle" font-size="13" fill="#3a6ed8">ausführen</text>
<rect x="276" y="190" width="108" height="58" rx="4" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="330" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">NX-Bit:</text>
<text x="330" y="224" text-anchor="middle" font-size="13" fill="#3a6ed8">hier nichts</text>
<text x="330" y="241" text-anchor="middle" font-size="13" fill="#3a6ed8">ausführen</text>

<!-- Pfeil Daten -> Code -->
<path d="M200,158 C200,96 120,84 84,120" fill="none" stroke="#c62828" stroke-width="3.5" stroke-dasharray="7 4" marker-end="url(#r)"/>
<!-- Stoppschild -->
<path d="M127,74 L143,74 L154,85 L154,101 L143,112 L127,112 L116,101 L116,85 Z" fill="#c62828" stroke="#fff" stroke-width="2"/>
<text x="135" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">STOP</text>
<text x="166" y="60" font-size="14" font-weight="700" fill="#c62828">Schutz:</text>
<text x="166" y="78" font-size="14" font-weight="700" fill="#c62828">nicht überschreiben!</text>

<!-- Straße -->
<rect x="0" y="270" width="400" height="40" fill="#9aa5b1"/>
<line x1="6" y1="290" x2="394" y2="290" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>
<g font-size="14" font-weight="700">
<rect x="6" y="316" width="22" height="22" rx="3" fill="#555"/><text x="17" y="332" text-anchor="middle" fill="#fff">0</text>
<rect x="346" y="316" width="48" height="22" rx="3" fill="#555"/><text x="370" y="332" text-anchor="middle" fill="#fff">4 GB</text>
</g>
<text x="190" y="332" text-anchor="middle" font-size="13" fill="#444">Adresse 1, 2, 3 … →</text>
<text x="200" y="364" text-anchor="middle" font-size="15" font-weight="700">Flat Memory:</text>
<text x="200" y="384" text-anchor="middle" font-size="15" font-weight="700">eine durchgehende Adressreihe (ab 386er)</text>
</svg>
