<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Nachgezeichnetes Fenster Leistungsüberwachung. Schritt 1: das grüne Plus, Indikatoren hinzufügen. Schritt 2: in der Liste Arbeitsspeicher den Eintrag Seiten/s (gelesene und geschriebene Seiten) oder Seitenschreibvorgänge/s (nur Schreiben, also Auslagern) markieren. Schritt 3: Hinzufügen und OK. Unten ein Diagramm: eine flache Linie bei 0 bedeutet kein Auslagern, gut; eine gestrichelte, dauernd hohe Zacken-Linie bedeutet RAM zu knapp.</title>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Wird ausgelagert? So prüfst du es</text>
<rect x="10" y="40" width="380" height="450" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M10,48 a8,8 0 0 1 8,-8 h364 a8,8 0 0 1 8,8 v20 h-380 z" fill="#3b4a5c"/>
<text x="24" y="60" font-size="15" font-weight="700" fill="#fff">Leistungsüberwachung</text>
<!-- Schritt 1 -->
<rect x="22" y="78" width="32" height="30" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/>
<path d="M38,84 v18 M29,93 h18" stroke="#2f9e44" stroke-width="5" stroke-linecap="round"/>
<text x="64" y="99" font-size="14" font-weight="700">Indikatoren hinzufügen</text>
<circle cx="364" cy="93" r="12" fill="#E07B00"/><text x="364" y="98" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<!-- Liste -->
<rect x="22" y="118" width="356" height="184" rx="6" fill="#f4f1ee" stroke="#aaa" stroke-width="1.5"/>
<rect x="32" y="128" width="336" height="128" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
<text x="42" y="150" font-size="14" font-weight="700">▾ Arbeitsspeicher</text>
<text x="58" y="174" font-size="14" fill="#999">…</text>
<rect x="36" y="182" width="290" height="24" fill="#cfe0fa" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="58" y="199" font-size="14" font-weight="700">Seiten/s</text>
<text x="320" y="199" font-size="12" text-anchor="end" fill="#555">lesen + schreiben</text>
<rect x="36" y="208" width="290" height="24" fill="#cfe0fa" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="58" y="225" font-size="14" font-weight="700">Seitenschreibvorgänge/s</text>
<text x="322" y="225" font-size="11" text-anchor="end" fill="#555">nur schreiben</text>
<text x="58" y="248" font-size="14" fill="#999">…</text>
<circle cx="348" cy="207" r="12" fill="#E07B00"/><text x="348" y="212" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<rect x="32" y="266" width="130" height="26" rx="4" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="97" y="284" font-size="14" text-anchor="middle" font-weight="700">Hinzufügen</text>
<rect x="250" y="266" width="70" height="26" rx="4" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="285" y="284" font-size="14" text-anchor="middle" font-weight="700">OK</text>
<circle cx="348" cy="279" r="12" fill="#E07B00"/><text x="348" y="284" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<line x1="170" y1="279" x2="242" y2="279" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
<!-- Diagramm -->
<rect x="50" y="318" width="326" height="152" fill="#fbfbfb" stroke="#888" stroke-width="1.5"/>
<g stroke="#e3e3e3" stroke-width="1"><line x1="50" y1="356" x2="376" y2="356"/><line x1="50" y1="394" x2="376" y2="394"/><line x1="50" y1="432" x2="376" y2="432"/></g>
<text x="42" y="474" font-size="14" text-anchor="end" font-weight="700">0</text>
<polyline points="50,392 70,366 88,384 106,360 124,378 144,354 162,372 182,358 200,380 220,356 240,374 258,362 278,384 298,358 318,370 338,356 356,378 376,362" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="62" y="340" font-size="13" font-weight="700" fill="#c62828">dauernd hoch = RAM zu knapp</text>
<line x1="50" y1="468" x2="376" y2="468" stroke="#2f6b4f" stroke-width="4"/>
<text x="62" y="458" font-size="14" font-weight="700" fill="#2f6b4f">0 = kein Auslagern, gut</text>
</svg>
