<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="system-ui, sans-serif" role="img">
  <title>Der Weg des Tons von links nach rechts: Die Datei Musik.mp3 besteht aus digitalen Zahlen. Die Soundkarte, meist auf dem Mainboard, wandelt digital in analog um. Über ein Kabel läuft das analoge Signal als Welle zum Lautsprecher, der daraus Ton macht. Anschluss am Lautsprecher: Bananenstecker oder USB.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="330" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Der Weg des Tons</text>

  <!-- Datei -->
  <path d="M28,52 H64 L78,66 V124 H28 Z" fill="#fff" stroke="#555" stroke-width="2"/>
  <path d="M64,52 V66 H78" fill="none" stroke="#555" stroke-width="2"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#3a6ed8" text-anchor="middle">
    <text x="53" y="86">0101</text>
    <text x="53" y="102">1100</text>
    <text x="53" y="118">0110</text>
  </g>
  <text x="53" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Musik.mp3</text>
  <text x="53" y="164" text-anchor="middle" font-size="13" fill="#3a6ed8">digital</text>

  <!-- Pfeil 1 -->
  <line x1="82" y1="90" x2="106" y2="90" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

  <!-- Soundkarte -->
  <rect x="110" y="66" width="80" height="44" rx="3" fill="#3c8d5a" stroke="#2b6b43" stroke-width="1.5"/>
  <rect x="124" y="76" width="22" height="18" rx="2" fill="#222"/>
  <rect x="120" y="110" width="60" height="6" fill="#d4a017"/>
  <circle cx="182" cy="76" r="3.5" fill="#94d82d"/><circle cx="182" cy="88" r="3.5" fill="#f783ac"/><circle cx="182" cy="100" r="3.5" fill="#74c0fc"/>
  <text x="150" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Soundkarte</text>
  <text x="150" y="164" text-anchor="middle" font-size="13" fill="#444">meist auf dem</text>
  <text x="150" y="180" text-anchor="middle" font-size="13" fill="#444">Mainboard</text>
  <rect x="84" y="194" width="132" height="28" rx="6" fill="#fff4ec" stroke="#e8590c" stroke-width="2"/>
  <text x="150" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#e8590c">digital → analog</text>

  <!-- Kabel mit Welle -->
  <line x1="190" y1="90" x2="322" y2="90" stroke="#555" stroke-width="4"/>
  <path d="M205,70 q12.5,-16 25,0 t25,0 t25,0 t25,0" fill="none" stroke="#e8590c" stroke-width="2.5"/>
  <text x="256" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Kabel</text>
  <text x="256" y="164" text-anchor="middle" font-size="13" fill="#444">analoges</text>
  <text x="256" y="180" text-anchor="middle" font-size="13" fill="#444">Signal</text>

  <!-- Lautsprecher -->
  <rect x="322" y="50" width="54" height="80" rx="6" fill="#3a3f4a"/>
  <circle cx="349" cy="70" r="8" fill="#868e96"/>
  <circle cx="349" cy="105" r="17" fill="#868e96"/>
  <circle cx="349" cy="105" r="6" fill="#495057"/>
  <path d="M382,80 q7,10 0,20 M389,72 q12,18 0,36" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="349" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Lautsprecher</text>
  <text x="349" y="164" text-anchor="middle" font-size="13" fill="#444">macht Ton</text>

  <!-- Anschluss -->
  <line x1="20" y1="238" x2="380" y2="238" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="200" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Anschluss am Lautsprecher:</text>
  <line x1="62" y1="285" x2="90" y2="285" stroke="#555" stroke-width="3"/>
  <rect x="90" y="277" width="32" height="16" rx="5" fill="#d63c3c"/>
  <rect x="122" y="282" width="24" height="6" rx="3" fill="#9aa0a6" stroke="#666" stroke-width="1"/>
  <text x="104" y="316" text-anchor="middle" font-size="14" fill="#222">Bananenstecker</text>
  <text x="200" y="290" text-anchor="middle" font-size="14" fill="#444">oder</text>
  <line x1="240" y1="285" x2="262" y2="285" stroke="#555" stroke-width="3"/>
  <rect x="262" y="276" width="30" height="18" rx="3" fill="#555"/>
  <rect x="292" y="278" width="22" height="14" fill="#ced4da" stroke="#555" stroke-width="1.5"/>
  <rect x="296" y="282" width="14" height="5" fill="#555"/>
  <text x="288" y="316" text-anchor="middle" font-size="14" fill="#222">USB</text>
</svg>
