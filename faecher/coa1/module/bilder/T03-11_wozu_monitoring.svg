<rect x="18.0" y="269.76" width="52" height="32.24" rx="4" fill="#333" stroke="#333" stroke-width="1"/><rect x="22.0" y="273.76" width="44" height="24.240000000000002" rx="2" fill="#eef2f7" stroke="none" stroke-width="0"/><path d="M10.0,310 L18.0,302 L70.0,302 L78.0,310 Z" fill="#9aa3ad" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
