<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, sans-serif" fill="#222">
<title>Wozu: In der AP1 sind Speicher- und Übertragungsrechnungen mit Binärpräfixen eine typische Aufgabe. In der AP2 rechnest du die Übertragungsdauer mit Bit und Byte sowie 1000 und 1024.</title>
<rect width="400" height="300" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Wo du das rechnen musst</text>
<!-- AP1 -->
<rect x="10" y="42" width="380" height="116" rx="10" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="22" y="68" font-size="16" font-weight="700" fill="#3a6ed8">AP1</text>
<text x="70" y="68" font-size="14">Speicher- und Übertragungs-</text>
<text x="70" y="88" font-size="14">rechnungen mit Binärpräfixen</text>
<g text-anchor="middle" font-size="15" font-weight="700">
<rect x="70" y="104" width="90" height="38" rx="6" fill="#fff"/><text x="115" y="129">KiB</text>
<rect x="170" y="104" width="90" height="38" rx="6" fill="#fff"/><text x="215" y="129">MiB</text>
<rect x="270" y="104" width="90" height="38" rx="6" fill="#fff"/><text x="315" y="129">GiB</text>
</g>
<!-- AP2 -->
<rect x="10" y="170" width="380" height="120" rx="10" fill="#f3e9f8" stroke="#7b3fa0" stroke-width="2"/>
<text x="22" y="196" font-size="16" font-weight="700" fill="#7b3fa0">AP2</text>
<text x="70" y="196" font-size="14">Übertragungsdauer rechnen</text>
<circle cx="46" cy="246" r="20" fill="#fff" stroke="#333" stroke-width="2"/>
<line x1="46" y1="246" x2="46" y2="232" stroke="#333" stroke-width="2.5"/><line x1="46" y1="246" x2="57" y2="251" stroke="#333" stroke-width="2.5"/>
<g text-anchor="middle" font-size="15" font-weight="700">
<rect x="80" y="214" width="140" height="30" rx="6" fill="#fff"/><text x="150" y="235">Bit ↔ Byte</text>
<rect x="80" y="250" width="140" height="30" rx="6" fill="#fff"/><text x="150" y="271">1000 ↔ 1024</text>
</g>
<text x="236" y="252" font-size="22" font-weight="700" fill="#7b3fa0">→ ? s</text>
</svg>
