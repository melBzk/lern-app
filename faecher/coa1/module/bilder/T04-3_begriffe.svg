<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 472" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vier neue Begriffe und ein Verbot. Kompatibilität: zwei Puzzleteile greifen ineinander. Komponentenliste: Zettel mit den Spalten Teil, Fundort, Preis. Datenblatt: Steckbrief des Herstellers zu einem Bauteil mit Maßen, Anschlüssen und Leistungswerten, als Beispiel ein Gehäuse-Datenblatt mit „passt: Mini-ITX, microATX, ATX“. Mindestanforderungen: Spielpackung mit Häkchenliste „mind.“. PC-Konfigurator: Browserfenster mit Baukasten, rot durchgestrichen, im Auftrag verboten.</title>
<rect width="400" height="472" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">4 neue Wörter + 1 Verbot</text>

<!-- Karte 1: Kompatibilität -->
<rect x="10" y="42" width="185" height="140" rx="10" fill="#eceff1"/>
<path d="M46,62 h40 v12 a8,8 0 0 1 0,16 v12 h-40 z" fill="#3a6ed8"/>
<path d="M86,62 h40 v40 h-40 v-12 a8,8 0 0 0 0,-16 z" fill="#2e7d32"/>
<path d="M136,74 l7,7 l13,-14" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102" y="134" text-anchor="middle" font-size="15" font-weight="700">Kompatibilität</text>
<text x="102" y="154" text-anchor="middle" font-size="13" fill="#444">Teile passen zusammen</text>
<text x="102" y="171" text-anchor="middle" font-size="13" fill="#444">und arbeiten zusammen</text>

<!-- Karte 2: Komponentenliste -->
<rect x="205" y="42" width="185" height="140" rx="10" fill="#eceff1"/>
<rect x="222" y="54" width="151" height="70" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="222" y="54" width="151" height="22" rx="4" fill="#e8f0fe" stroke="#555" stroke-width="2"/>
<g font-size="13" font-weight="700"><text x="228" y="70">Teil</text><text x="263" y="70">Fundort</text><text x="331" y="70">Preis</text></g>
<g stroke="#9aa5b1" stroke-width="2"><line x1="258" y1="54" x2="258" y2="124"/><line x1="326" y1="54" x2="326" y2="124"/><line x1="222" y1="94" x2="373" y2="94"/><line x1="222" y1="110" x2="373" y2="110"/></g>
<text x="297" y="150" text-anchor="middle" font-size="15" font-weight="700">Komponentenliste</text>
<text x="297" y="171" text-anchor="middle" font-size="13" fill="#444">jedes Einzelteil + Preis</text>

<!-- Karte 3: Datenblatt (breit) -->
<rect x="10" y="192" width="380" height="120" rx="10" fill="#eceff1"/>
<rect x="24" y="204" width="136" height="96" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="24" y="204" width="136" height="20" rx="4" fill="#e8f0fe" stroke="#555" stroke-width="2"/>
<text x="92" y="219" text-anchor="middle" font-size="12" font-weight="700">Gehäuse X</text>
<g font-size="11" fill="#333"><text x="32" y="241">Maße: …</text><text x="32" y="258">passt:</text><text x="32" y="273">Mini-ITX, microATX,</text><text x="32" y="288">ATX</text></g>
<text x="270" y="232" text-anchor="middle" font-size="15" font-weight="700">Datenblatt</text>
<text x="270" y="254" text-anchor="middle" font-size="13" fill="#444">Steckbrief des Herstellers</text>
<text x="270" y="272" text-anchor="middle" font-size="13" fill="#444">zu einem Bauteil: Maße,</text>
<text x="270" y="290" text-anchor="middle" font-size="13" fill="#444">Anschlüsse, Leistungswerte</text>

<!-- Karte 4: Mindestanforderungen -->
<rect x="10" y="322" width="185" height="140" rx="10" fill="#eceff1"/>
<rect x="28" y="336" width="48" height="64" rx="4" fill="#3a6ed8"/>
<path d="M45,355 L45,381 L64,368 Z" fill="#fff"/>
<rect x="88" y="336" width="90" height="64" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="96" y="354" font-size="13" font-weight="700">mind. …</text>
<g fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M96,368 l4,4 l8,-8"/><path d="M96,386 l4,4 l8,-8"/></g>
<g stroke="#9aa5b1" stroke-width="2.5"><line x1="116" y1="369" x2="168" y2="369"/><line x1="116" y1="387" x2="168" y2="387"/></g>
<text x="102" y="430" text-anchor="middle" font-size="14" font-weight="700">Mindest-</text>
<text x="102" y="448" text-anchor="middle" font-size="14" font-weight="700">anforderungen</text>

<!-- Karte 5: PC-Konfigurator (Verbot) -->
<rect x="205" y="322" width="185" height="140" rx="10" fill="#eceff1"/>
<rect x="240" y="334" width="115" height="70" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<line x1="240" y1="348" x2="355" y2="348" stroke="#555" stroke-width="2"/>
<g fill="#9aa5b1"><circle cx="248" cy="341" r="2.5"/><circle cx="256" cy="341" r="2.5"/><circle cx="264" cy="341" r="2.5"/></g>
<g fill="#cfd8dc" stroke="#9aa5b1" stroke-width="1.5"><rect x="250" y="356" width="26" height="18"/><rect x="284" y="356" width="26" height="18"/><rect x="318" y="356" width="26" height="18"/><rect x="250" y="380" width="26" height="18"/><rect x="284" y="380" width="26" height="18"/></g>
<line x1="236" y1="408" x2="359" y2="330" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<text x="297" y="430" text-anchor="middle" font-size="15" font-weight="700">PC-Konfigurator</text>
<text x="297" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">im Auftrag verboten</text>
</svg>
