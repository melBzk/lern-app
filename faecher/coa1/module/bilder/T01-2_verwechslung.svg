<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 472" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Vier Paare: Scanner bringt Papier in den PC (Eingabe), Drucker bringt es aus dem PC aufs Papier (Ausgabe). Touchpad ist nur Eingabe, Touchscreen ist Ein- und Ausgabe. RAM kann lesen und verändern, ROM nur lesen und behält die Daten ohne Strom. RAM gehört zur Verarbeitung, die SSD zu Sonstiges (Speicher).</title>
