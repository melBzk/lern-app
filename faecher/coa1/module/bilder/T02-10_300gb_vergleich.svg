<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <title>300 GB Fotos sichern: Man bräuchte einen hohen Stapel aus 64 DVDs (je 4,7 GB) oder einen kleinen Stapel aus 12 Blu-rays (je 25 GB) oder nur eine einzige externe Festplatte.</title>
  <defs>
    <pattern id="dvd" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#e9a35a"/><rect y="3" width="4" height="1" fill="#fff"/>
    </pattern>
    <pattern id="br" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#7d9fe6"/><rect y="3" width="4" height="1" fill="#fff"/>
    </pattern>
  </defs>
  <rect width="400" height="460" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700">300 GB Fotos sichern</text>

  <!-- DVD-Stapel: 64 Scheiben à 4 px = 256 px -->
  <rect x="25" y="104" width="90" height="256" fill="url(#dvd)" stroke="#b5651d" stroke-width="1.5"/>
  <text x="70" y="94" text-anchor="middle" font-size="13" fill="#8a4a0f">64 Scheiben</text>
  <!-- Blu-ray-Stapel: 12 Scheiben à 4 px = 48 px -->
  <rect x="155" y="312" width="90" height="48" fill="url(#br)" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="200" y="302" text-anchor="middle" font-size="13" fill="#24489a">12 Scheiben</text>
  <!-- HDD -->
  <rect x="295" y="318" width="70" height="42" rx="7" fill="#3a3f4a"/>
  <circle cx="352" cy="330" r="3" fill="#2e9e5b"/>
  <rect x="305" y="345" width="30" height="4" rx="2" fill="#888"/>

  <!-- Grundlinie -->
  <line x1="10" y1="361" x2="390" y2="361" stroke="#333" stroke-width="2"/>

  <!-- Etiketten -->
  <g text-anchor="middle">
    <text x="70" y="388" font-size="17" font-weight="700">64 DVDs</text>
    <text x="70" y="408" font-size="14">je 4,7 GB</text>
    <text x="200" y="388" font-size="17" font-weight="700">12 Blu-rays</text>
    <text x="200" y="408" font-size="14">je 25 GB</text>
    <text x="330" y="388" font-size="17" font-weight="700" fill="#1c6b3c">1 HDD</text>
    <text x="330" y="408" font-size="14">extern</text>
  </g>
  <text x="200" y="446" text-anchor="middle" font-size="14" fill="#333">Stapelhöhe passt zur Anzahl der Scheiben</text>
</svg>
