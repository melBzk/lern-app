<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Wer steckt wo? Links PC und Laptop: Familie x86/x64 von Intel und AMD, nach außen CISC, innen RISC-artig. Rechts Smartphone und Tablet: Familie ARM, RISC, überwiegend, auch ARM hat heute mehr Befehle. Unten ein Hinweis zum Mac: Das Buch (Stand 2020) nennt x86 im Mac seit 2006; neuere Macs nutzen Apple-Chips mit ARM-Architektur.</title>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Wer steckt wo?</text>
<rect x="10" y="44" width="185" height="270" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<rect x="44" y="62" width="58" height="40" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><rect x="66" y="102" width="14" height="8" fill="#555"/>
<rect x="114" y="74" width="50" height="30" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M106,110 h66" stroke="#555" stroke-width="3"/>
<text x="102" y="136" text-anchor="middle" font-size="14">PC, Laptop</text>
<text x="102" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#c25e00">x86/x64</text>
<text x="102" y="194" text-anchor="middle" font-size="14">Intel, AMD</text>
<text x="102" y="236" text-anchor="middle" font-size="15" font-weight="700">außen CISC,</text>
<text x="102" y="258" text-anchor="middle" font-size="15" font-weight="700">innen RISC-artig</text>
<text x="102" y="292" text-anchor="middle" font-size="14" fill="#555">= Mischform</text>
<rect x="205" y="44" width="185" height="270" rx="10" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="2"/>
<rect x="250" y="58" width="28" height="52" rx="5" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="290" y="62" width="48" height="48" rx="5" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="297" y="136" text-anchor="middle" font-size="14">Smartphone, Tablet</text>
<text x="297" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#3a6ed8">ARM</text>
<text x="297" y="236" text-anchor="middle" font-size="15" font-weight="700">RISC</text>
<text x="297" y="258" text-anchor="middle" font-size="14">(überwiegend – auch</text>
<text x="297" y="276" text-anchor="middle" font-size="14">ARM hat heute mehr Befehle)</text>
<rect x="10" y="328" width="380" height="100" rx="10" fill="#f4f5f7"/>
<text x="24" y="354" font-size="14" font-weight="700">Mac:</text>
<text x="24" y="376" font-size="14">Buch (Stand 2020): x86 seit 2006 im Mac</text>
<text x="24" y="400" font-size="14">Neuere Macs: Apple-Chips mit</text>
<text x="24" y="420" font-size="14" font-weight="700" fill="#3a6ed8">ARM-Architektur</text>
</svg>
