<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Die AMD-Reihen, geordnet nach Anwendertyp: Ryzen 3, 5, 7, 9 für den Desktop, als Mobile auch im Notebook. Athlon für Desktop und Notebook. Ryzen Threadripper für Desktop und Workstation, sehr viele Kerne, z. B. 32, der 3990X sogar 64. EPYC für Server. Ryzen und EPYC Embedded für eingebaute Geräte. Unten: Intel-Gegenstück finden über Beschreibungen oder Benchmarks.</title>
<rect width="400" height="480" fill="#fff"/>
