<rect x="24" y="58" width="44" height="30" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><rect x="38" y="88" width="16" height="10" fill="#555"/><rect x="88" y="66" width="36" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M82,92 H130" stroke="#555" stroke-width="3"/>
