<text x="140" y="150" font-size="16" font-weight="700">Athlon</text>
<text x="140" y="172" font-size="14">Desktop und Notebook</text>
<rect x="10" y="190" width="380" height="98" rx="10" fill="#fbe3e3" stroke="#c62828" stroke-width="2"/>
<g fill="#c62828"><rect x="24" y="206" width="12" height="12"/><rect x="40" y="206" width="12" height="12"/><rect x="56" y="206" width="12" height="12"/><rect x="72" y="206" width="12" height="12"/><rect x="24" y="222" width="12" height="12"/><rect x="40" y="222" width="12" height="12"/><rect x="56" y="222" width="12" height="12"/><rect x="72" y="222" width="12" height="12"/><rect x="24" y="238" width="12" height="12"/><rect x="40" y="238" width="12" height="12"/><rect x="56" y="238" width="12" height="12"/><rect x="72" y="238" width="12" height="12"/><rect x="24" y="254" width="12" height="12"/><rect x="40" y="254" width="12" height="12"/><rect x="56" y="254" width="12" height="12"/><rect x="72" y="254" width="12" height="12"/></g>
<text x="100" y="214" font-size="16" font-weight="700">Ryzen Threadripper</text>
<text x="100" y="236" font-size="14">Desktop und Workstation</text>
<text x="100" y="258" font-size="14" font-weight="700" fill="#c62828">sehr viele Kerne: z. B. 32,</text>
<text x="100" y="277" font-size="14" font-weight="700" fill="#c62828">3990X sogar 64</text>
