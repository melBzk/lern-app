<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Alltagsvergleich Mehrfamilienhaus im Querschnitt: Das ganze Haus ist der Host, der echte PC. Drei Wohnungen VM 1, VM 2 und VM 3 haben jeweils andere Möbel, also ein eigenes Betriebssystem. Im Keller sitzt die Hausverwaltung, der Hypervisor. Von dort führt eine Leitung zu allen Wohnungen und verteilt RAM, Kerne und Festplatte.</title>
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
</defs>
<rect width="400" height="460" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Das Mehrfamilienhaus</text>

<!-- Dach -->
<polygon points="6,150 200,44 394,150" fill="#f4f1ee" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
<text x="200" y="118" font-size="17" text-anchor="middle" font-weight="700">Host (echter PC)</text>
<text x="200" y="139" font-size="13" text-anchor="middle" fill="#555">= das ganze Haus</text>

<!-- Wohnungen -->
<rect x="6" y="150" width="288" height="70" fill="#fdf0e0" stroke="#555" stroke-width="2"/>
<rect x="6" y="220" width="288" height="70" fill="#e3f0e9" stroke="#555" stroke-width="2"/>
<rect x="6" y="290" width="288" height="70" fill="#e8f0fe" stroke="#555" stroke-width="2"/>
<!-- Schacht -->
<rect x="294" y="150" width="100" height="210" fill="#fff" stroke="#555" stroke-width="2"/>

<!-- VM 3: Tisch mit Stühlen -->
<text x="18" y="180" font-size="16" font-weight="700">VM 3</text>
<text x="18" y="204" font-size="13" fill="#555">eigenes Betriebssystem</text>
<rect x="196" y="186" width="56" height="8" rx="2" fill="#8d6e63"/>
<rect x="202" y="194" width="5" height="22" fill="#8d6e63"/>
<rect x="241" y="194" width="5" height="22" fill="#8d6e63"/>
<rect x="180" y="190" width="5" height="26" fill="#a1887f"/><rect x="180" y="200" width="14" height="4" fill="#a1887f"/>
<rect x="263" y="190" width="5" height="26" fill="#a1887f"/><rect x="254" y="200" width="14" height="4" fill="#a1887f"/>

<!-- VM 2: Bett -->
<text x="18" y="250" font-size="16" font-weight="700">VM 2</text>
<text x="18" y="274" font-size="13" fill="#555">eigenes Betriebssystem</text>
<rect x="190" y="256" width="86" height="20" rx="3" fill="#2f6b4f"/>
<rect x="194" y="248" width="22" height="10" rx="4" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
<rect x="186" y="244" width="6" height="40" fill="#2f6b4f"/>
<rect x="190" y="276" width="4" height="8" fill="#2f6b4f"/><rect x="272" y="276" width="4" height="8" fill="#2f6b4f"/>

<!-- VM 1: Sofa -->
<text x="18" y="320" font-size="16" font-weight="700">VM 1</text>
<text x="18" y="344" font-size="13" fill="#555">eigenes Betriebssystem</text>
<rect x="192" y="312" width="80" height="20" rx="5" fill="#3a6ed8"/>
<rect x="186" y="322" width="12" height="28" rx="4" fill="#3a6ed8"/>
<rect x="266" y="322" width="12" height="28" rx="4" fill="#3a6ed8"/>
<rect x="196" y="332" width="72" height="16" rx="3" fill="#7da1ea"/>

<!-- Boden -->
<line x1="0" y1="360" x2="400" y2="360" stroke="#2f6b4f" stroke-width="4"/>

<!-- Keller -->
<rect x="6" y="362" width="388" height="86" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
<text x="18" y="392" font-size="16" font-weight="700">Hausverwaltung</text>
<text x="18" y="414" font-size="16" font-weight="700" fill="#b35f00">= Hypervisor</text>
<!-- Schreibtisch -->
<rect x="190" y="400" width="70" height="7" rx="2" fill="#8d6e63"/>
<rect x="194" y="407" width="5" height="30" fill="#8d6e63"/>
<rect x="251" y="407" width="5" height="30" fill="#8d6e63"/>
<rect x="208" y="380" width="30" height="20" rx="2" fill="#333"/>
<rect x="211" y="383" width="24" height="14" fill="#cfe0fb"/>

<!-- Leitung -->
<polyline points="268,404 306,404 306,185" fill="none" stroke="#E07B00" stroke-width="4" stroke-linejoin="round"/>
<line x1="306" y1="185" x2="280" y2="185" stroke="#E07B00" stroke-width="3.5" marker-end="url(#o)"/>
<line x1="306" y1="255" x2="280" y2="255" stroke="#E07B00" stroke-width="3.5" marker-end="url(#o)"/>
<line x1="306" y1="325" x2="280" y2="325" stroke="#E07B00" stroke-width="3.5" marker-end="url(#o)"/>
<text x="316" y="232" font-size="13" font-weight="700" fill="#b35f00">RAM,</text>
<text x="316" y="250" font-size="13" font-weight="700" fill="#b35f00">Kerne,</text>
<text x="316" y="268" font-size="13" font-weight="700" fill="#b35f00">Festplatte</text>
</svg>
