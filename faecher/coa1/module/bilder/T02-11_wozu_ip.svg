<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, sans-serif" fill="#222">
<title>Wo dir das wieder begegnet: In der AP1 kommen Speicher- und Übertragungsrechnungen vor, dafür brauchst du Bit, Byte und Zweierpotenzen. Später bei Netzwerken: Die IP-Adresse 192.168.1.10 hat vier Blöcke, jeder Block ist 1 Byte, also 0 bis 255.</title>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Wo dir das wieder begegnet</text>
<!-- AP1 -->
<rect x="10" y="42" width="380" height="110" rx="10" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="22" y="68" font-size="16" font-weight="700" fill="#3a6ed8">AP1 (IHK-Prüfung Teil 1)</text>
<text x="22" y="92" font-size="14">Speicher- und Übertragungsrechnungen</text>
<g text-anchor="middle" font-size="14" font-weight="700">
<rect x="22" y="104" width="100" height="34" rx="6" fill="#fff"/><text x="72" y="126">Bit</text>
<rect x="132" y="104" width="100" height="34" rx="6" fill="#fff"/><text x="182" y="126">Byte</text>
<rect x="242" y="104" width="136" height="34" rx="6" fill="#fff"/><text x="310" y="126">Zweierpotenzen</text>
</g>
<!-- IP -->
<rect x="10" y="166" width="380" height="184" rx="10" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<text x="22" y="192" font-size="16" font-weight="700" fill="#2f6b4f">Später: Netzwerke</text>
<text x="22" y="216" font-size="14">IP-Adresse – vier Blöcke:</text>
<g font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
<rect x="22" y="232" width="78" height="44" rx="6" fill="#fff" stroke="#2f6b4f" stroke-width="2"/><text x="61" y="261">192</text>
<text x="108" y="261">.</text>
<rect x="116" y="232" width="78" height="44" rx="6" fill="#fff" stroke="#2f6b4f" stroke-width="2"/><text x="155" y="261">168</text>
<text x="202" y="261">.</text>
<rect x="210" y="232" width="78" height="44" rx="6" fill="#fff" stroke="#2f6b4f" stroke-width="2"/><text x="249" y="261">1</text>
<text x="296" y="261">.</text>
<rect x="304" y="232" width="78" height="44" rx="6" fill="#fff" stroke="#2f6b4f" stroke-width="2"/><text x="343" y="261">10</text>
</g>
<g font-size="13" fill="#2f6b4f" text-anchor="middle" font-weight="700"><text x="61" y="296">1 Byte</text><text x="155" y="296">1 Byte</text><text x="249" y="296">1 Byte</text><text x="343" y="296">1 Byte</text></g>
<text x="200" y="330" text-anchor="middle" font-size="15" font-weight="700">jeder Block: 0 bis 255</text>
</svg>
