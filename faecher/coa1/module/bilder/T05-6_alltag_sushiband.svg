<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich Sushi-Laufband. Ein rundes Laufband mit Tellern dreht sich: das ist die Drehzahl. Ein Gast streckt den Arm zur richtigen Bahn aus: die Zeit bis dahin ist die Suchzeit. Neben dem Gast ein Tablett mit schon geholten Tellern: das ist der Cache. Kasten: Wo der Vergleich hinkt – der Kopf berührt die Platte nie, er schwebt darüber und liest magnetisch.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="400" height="554" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Wie ein Sushi-Laufband</text>

<!-- Laufband -->
<ellipse cx="160" cy="170" rx="140" ry="90" fill="#eceff1" stroke="#555" stroke-width="2"/>
<ellipse cx="160" cy="170" rx="100" ry="56" fill="#fff" stroke="#555" stroke-width="2"/>
<g fill="#fff" stroke="#555" stroke-width="1.5">
<ellipse cx="160" cy="94" rx="15" ry="9"/><ellipse cx="260" cy="118" rx="15" ry="9"/><ellipse cx="282" cy="186" rx="15" ry="9"/><ellipse cx="200" cy="245" rx="15" ry="9"/><ellipse cx="92" cy="238" rx="15" ry="9"/><ellipse cx="42" cy="168" rx="15" ry="9"/><ellipse cx="70" cy="110" rx="15" ry="9"/>
</g>
<g fill="#e57373"><rect x="153" y="90" width="14" height="7" rx="3"/><rect x="253" y="114" width="14" height="7" rx="3"/><rect x="193" y="241" width="14" height="7" rx="3"/><rect x="35" y="164" width="14" height="7" rx="3"/></g>
<g fill="#81c784"><rect x="275" y="182" width="14" height="7" rx="3"/><rect x="85" y="234" width="14" height="7" rx="3"/><rect x="63" y="106" width="14" height="7" rx="3"/></g>
<path d="M110,140 A60,32 0 0 1 220,146" fill="none" stroke="#3a6ed8" stroke-width="4" marker-end="url(#k)"/>
<text x="160" y="178" text-anchor="middle" font-weight="700" fill="#3a6ed8" font-size="16">Drehzahl</text>
<text x="160" y="196" text-anchor="middle" font-size="13" fill="#444">schneller = Teller früher da</text>

<!-- Gast -->
<circle cx="350" cy="300" r="16" fill="#fff" stroke="#222" stroke-width="2.5"/>
<path d="M326,370 v-30 a24,24 0 0 1 48,0 v30" fill="#fff" stroke="#222" stroke-width="2.5"/>
<path d="M334,334 L290,222" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
<text x="296" y="292" font-weight="700" fill="#c62828" font-size="16" text-anchor="end">Suchzeit</text>
<text x="296" y="310" font-size="13" fill="#444" text-anchor="end">bis der Arm an</text>
<text x="296" y="326" font-size="13" fill="#444" text-anchor="end">der richtigen Bahn ist</text>

<!-- Tablett -->
<rect x="196" y="352" width="110" height="34" rx="6" fill="#F2B100" stroke="#b38300" stroke-width="2"/>
<g fill="#fff" stroke="#555" stroke-width="1.5"><ellipse cx="222" cy="368" rx="15" ry="9"/><ellipse cx="258" cy="368" rx="15" ry="9"/></g>
<rect x="215" y="364" width="14" height="7" rx="3" fill="#e57373"/><rect x="251" y="364" width="14" height="7" rx="3" fill="#81c784"/>
<text x="196" y="410" font-weight="700" font-size="16" fill="#b36b00">Cache</text>
<text x="196" y="428" font-size="13" fill="#444">schon geholt, griffbereit</text>

<!-- Hinkt -->
<rect x="10" y="450" width="380" height="92" rx="10" fill="#FFF6D6" stroke="#F2B100" stroke-width="2"/>
<text x="24" y="476" font-weight="700">Wo der Vergleich hinkt:</text>
<text x="24" y="500">Der Kopf <tspan font-weight="700">berührt die Platte nie</tspan>.</text>
<text x="24" y="522" font-size="13" fill="#444">Er schwebt darüber und liest magnetisch.</text>
</svg>
