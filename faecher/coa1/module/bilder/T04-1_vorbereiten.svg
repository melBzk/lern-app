<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vorbereiten, bevor das Gehäuse aufgeht: Arbeitstisch von oben mit rutschfester Unterlage. Darauf der gezogene Netzstecker mit Warnung: Netzteil lebensgefährlich. Ein Handy mit Foto der Kabel. Eine externe Festplatte für das Backup. Eine Box für die Schrauben. Ein Notizblock: Was ist wo?</title>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">Vorbereiten – vor dem Öffnen</text>
<rect x="8" y="42" width="384" height="420" rx="8" fill="#f3e5d0" stroke="#8a6b4b" stroke-width="2"/>
<rect x="22" y="56" width="356" height="372" rx="8" fill="#e3e8ec" stroke="#9aa5b1" stroke-width="2"/>
<text x="200" y="450" text-anchor="middle" font-size="14" fill="#5d4630">großer Tisch, rutschfeste Unterlage</text>

<!-- Stecker + Warnung -->
<rect x="34" y="68" width="332" height="104" rx="8" fill="#fff" stroke="#c62828" stroke-width="2"/>
<rect x="46" y="90" width="38" height="50" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="65" cy="106" r="4" fill="#555"/><circle cx="65" cy="124" r="4" fill="#555"/>
<g stroke="#555" stroke-width="4"><line x1="100" y1="106" x2="110" y2="106"/><line x1="100" y1="124" x2="110" y2="124"/></g>
<rect x="110" y="98" width="22" height="34" rx="4" fill="#555"/>
<path d="M132,115 C146,115 142,140 156,140" fill="none" stroke="#555" stroke-width="3"/>
<text x="98" y="162" text-anchor="middle" font-size="14" font-weight="700">Stecker ziehen</text>
<path d="M204,80 L232,128 L176,128 Z" fill="#c62828"/>
<path d="M207,90 L197,108 L205,108 L199,122 L213,102 L205,102 L211,90 Z" fill="#fff"/>
<text x="244" y="104" font-size="15" font-weight="700" fill="#c62828">Netzteil:</text>
<text x="244" y="124" font-size="15" font-weight="700" fill="#c62828">lebens-</text>
<text x="244" y="144" font-size="15" font-weight="700" fill="#c62828">gefährlich!</text>

<!-- Handy -->
<rect x="72" y="190" width="56" height="92" rx="8" fill="#555"/>
<rect x="77" y="200" width="46" height="70" rx="2" fill="#fff"/>
<g fill="none" stroke-width="3"><path d="M80,214 C96,214 100,236 120,236" stroke="#3a6ed8"/><path d="M80,230 C92,230 104,252 120,252" stroke="#E07B00"/><path d="M80,248 C96,248 100,262 120,262" stroke="#2e7d32"/></g>
<text x="100" y="302" text-anchor="middle" font-size="14" font-weight="700">Kabel fotografieren</text>

<!-- Festplatte -->
<rect x="244" y="196" width="76" height="84" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
<circle cx="282" cy="232" r="20" fill="none" stroke="#3a6ed8" stroke-width="2.5"/><circle cx="282" cy="232" r="4" fill="#3a6ed8"/>
<circle cx="306" cy="268" r="3" fill="#2e7d32"/>
<text x="282" y="302" text-anchor="middle" font-size="14" font-weight="700">Backup</text>

<!-- Schrauben-Box -->
<rect x="44" y="322" width="112" height="66" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="50" y="328" width="100" height="54" rx="4" fill="#fff" fill-opacity="0" stroke="#9aa5b1" stroke-width="1.5"/>
<g fill="#555"><circle cx="72" cy="348" r="5"/><circle cx="92" cy="360" r="5"/><circle cx="114" cy="346" r="5"/><circle cx="130" cy="364" r="5"/><circle cx="76" cy="368" r="5"/></g>
<g stroke="#fff" stroke-width="1.5"><line x1="69" y1="348" x2="75" y2="348"/><line x1="89" y1="360" x2="95" y2="360"/><line x1="111" y1="346" x2="117" y2="346"/><line x1="127" y1="364" x2="133" y2="364"/><line x1="73" y1="368" x2="79" y2="368"/></g>
<text x="100" y="410" text-anchor="middle" font-size="14" font-weight="700">Schrauben-Box</text>

<!-- Notizblock -->
<rect x="226" y="318" width="112" height="74" rx="3" fill="#fffde7" stroke="#8a6b00" stroke-width="2"/>
<g stroke="#8a6b00" stroke-width="2"><line x1="240" y1="314" x2="240" y2="324"/><line x1="262" y1="314" x2="262" y2="324"/><line x1="284" y1="314" x2="284" y2="324"/><line x1="306" y1="314" x2="306" y2="324"/><line x1="326" y1="314" x2="326" y2="324"/></g>
<text x="282" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#5d4630">Was ist</text>
<text x="282" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#5d4630">wo?</text>
<text x="282" y="410" text-anchor="middle" font-size="14" font-weight="700">aufschreiben</text>
</svg>
