<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Prozessor einsetzen: 1 das goldene Dreieck am Prozessor und am Sockel liegen in derselben Ecke, der Prozessor wird ohne Druck eingelegt, der Hebel ist offen. 2 Hebel und Klammer zu: Prozessor ist fixiert.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker></defs>
<rect width="400" height="570" fill="#fff"/>
<text x="200.0" y="26" font-size="17" text-anchor="middle" font-weight="700" >Prozessor einsetzen</text>
<circle cx="22" cy="52" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="22" y="57" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >1</text>
<text x="42" y="57" font-size="15" font-weight="700" >Einlegen</text>
<rect x="120" y="70" width="120" height="120" rx="5" fill="#4f9a6e" stroke="#2f6b4f" stroke-width="2" />
<rect x="136" y="86" width="88" height="88" rx="4" fill="#c9ced6" stroke="#7a828c" stroke-width="1.5" />
<polygon points="124,186 124,166 144,186" fill="#d4a017" stroke="#8a6a00"/>
<text x="180" y="134" font-size="13" text-anchor="middle" font-weight="700" >Prozessor</text>
<rect x="110" y="228" width="140" height="140" rx="4" fill="#d9d9d9" stroke="#888" stroke-width="2" />
<rect x="126" y="244" width="108" height="108" rx="2" fill="#eee" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
<polygon points="114,364 114,344 134,364" fill="#d4a017" stroke="#8a6a00"/>
<text x="180" y="302" font-size="13" text-anchor="middle" fill="#555" >Sockel</text>
<line x1="130" y1="180" x2="120" y2="356" stroke="#E07B00" stroke-width="2" stroke-dasharray="5 4"/>
<text x="8" y="262" font-size="14" font-weight="700" fill="#E07B00" >Markierungen</text>
<text x="8" y="280" font-size="14" font-weight="700" fill="#E07B00" >übereinander</text>
<line x1="180" y1="194" x2="180" y2="224" stroke="#222" stroke-width="2.5" marker-end="url(#a)" />
<text x="190" y="214" font-size="14" font-weight="700" >ohne Druck einlegen</text>
<line x1="266" y1="366" x2="266" y2="236" stroke="#666" stroke-width="4" />
<circle cx="266" cy="232" r="6" fill="#666" stroke="none" stroke-width="1.5" />
<text x="276" y="300" font-size="14" fill="#555" >Hebel offen</text>
<line x1="10" y1="392" x2="390" y2="392" stroke="#ddd" stroke-width="1" />
<circle cx="22" cy="418" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="22" y="423" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >2</text>
<text x="42" y="423" font-size="15" font-weight="700" >Festklemmen</text>
<rect x="40" y="440" width="100" height="100" rx="4" fill="#d9d9d9" stroke="#888" stroke-width="2" />
<rect x="50" y="450" width="80" height="80" rx="4" fill="#4f9a6e" stroke="#2f6b4f" stroke-width="2" />
<rect x="58" y="458" width="64" height="64" rx="3" fill="#c9ced6" stroke="#7a828c" stroke-width="1.5" />
<rect x="46" y="446" width="88" height="88" rx="3" fill="none" stroke="#444" stroke-width="4" />
<line x1="40" y1="552" x2="146" y2="552" stroke="#666" stroke-width="4" />
<circle cx="150" cy="552" r="6" fill="#666" stroke="none" stroke-width="1.5" />
<text x="166" y="478" font-size="15" font-weight="700" >Hebel / Klammer zu</text>
<text x="166" y="498" font-size="15" >= Prozessor fixiert,</text>
<text x="166" y="518" font-size="15" >er kann nicht mehr</text>
<text x="166" y="538" font-size="15" >herausfallen</text>
</svg>
