<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, sans-serif">
  <title>Kauf-Checkliste als Beispiel-Datenblatt eines Monitors mit Häkchen: Größe 27 Zoll, nach Bedarf. Auflösung 2560 mal 1440, gleich der nativen Auflösung. Reaktionszeit 5 Millisekunden, gut ist unter 12. Pixelfehlerklasse 0, gut ist 0 oder I. Helligkeit 350 Candela, gut ist über 300. Kontrast 1000 zu 1, gut ist ab 800 zu 1. Blickwinkel 178 Grad, gut ist über 170. Anschluss HDMI und DisplayPort, digital. Pivot ja. Unten: Ein Monitor wird von quer auf hochkant gedreht, 90 Grad, das heißt Pivot.</title>
  <defs>
    <marker id="pb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a6ed8"/>
    </marker>
  </defs>
  <rect width="400" height="560" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Die Kauf-Checkliste</text>

  <!-- Datenblatt -->
  <path d="M10,42 H364 L390,68 V392 H10 Z" fill="#fff" stroke="#888" stroke-width="2"/>
  <path d="M364,42 V68 H390" fill="#eee" stroke="#888" stroke-width="2"/>
  <text x="26" y="66" font-size="15" font-weight="700" fill="#222">Beispiel-Datenblatt</text>
  <text x="26" y="92" font-size="13" fill="#555">Merkmal</text>
  <text x="150" y="92" font-size="13" fill="#555">Wert</text>
  <text x="276" y="92" font-size="13" font-weight="700" fill="#2e9d5b">gut ist …</text>
  <rect x="18" y="105" width="364" height="30" fill="#f4f6fa"/>
  <text x="26" y="124" font-size="14" fill="#222">Größe</text>
  <text x="150" y="124" font-size="14" font-weight="700" fill="#222">27 Zoll</text>
  <text x="276" y="124" font-size="13" fill="#555">nach Bedarf</text>
  <circle cx="374" cy="119" r="9" fill="#2e9d5b"/><path d="M369,119 L373,123 L379,114" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="26" y="154" font-size="14" fill="#222">Auflösung</text>
  <text x="150" y="154" font-size="14" font-weight="700" fill="#222">2560 × 1440</text>
  <text x="276" y="154" font-size="13" fill="#555">= nativ</text>
  <circle cx="374" cy="149" r="9" fill="#2e9d5b"/><path d="M369,149 L373,153 L379,144" fill="none" stroke="#fff" stroke-width="2.2"/>
  <rect x="18" y="165" width="364" height="30" fill="#f4f6fa"/>
  <text x="26" y="184" font-size="14" fill="#222">Reaktionszeit</text>
  <text x="150" y="184" font-size="14" font-weight="700" fill="#222">5 ms</text>
  <text x="276" y="184" font-size="13" fill="#555">unter 12 ms</text>
  <circle cx="374" cy="179" r="9" fill="#2e9d5b"/><path d="M369,179 L373,183 L379,174" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="26" y="214" font-size="14" fill="#222">Pixelfehlerklasse</text>
  <text x="150" y="214" font-size="14" font-weight="700" fill="#222">0</text>
  <text x="276" y="214" font-size="13" fill="#555">0 oder I</text>
  <circle cx="374" cy="209" r="9" fill="#2e9d5b"/><path d="M369,209 L373,213 L379,204" fill="none" stroke="#fff" stroke-width="2.2"/>
  <rect x="18" y="225" width="364" height="30" fill="#f4f6fa"/>
  <text x="26" y="244" font-size="14" fill="#222">Helligkeit</text>
  <text x="150" y="244" font-size="14" font-weight="700" fill="#222">350 cd</text>
  <text x="276" y="244" font-size="13" fill="#555">über 300 cd</text>
  <circle cx="374" cy="239" r="9" fill="#2e9d5b"/><path d="M369,239 L373,243 L379,234" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="26" y="274" font-size="14" fill="#222">Kontrast</text>
  <text x="150" y="274" font-size="14" font-weight="700" fill="#222">1000:1</text>
  <text x="276" y="274" font-size="13" fill="#555">ab 800:1</text>
  <circle cx="374" cy="269" r="9" fill="#2e9d5b"/><path d="M369,269 L373,273 L379,264" fill="none" stroke="#fff" stroke-width="2.2"/>
  <rect x="18" y="285" width="364" height="30" fill="#f4f6fa"/>
  <text x="26" y="304" font-size="14" fill="#222">Blickwinkel</text>
  <text x="150" y="304" font-size="14" font-weight="700" fill="#222">178°</text>
  <text x="276" y="304" font-size="13" fill="#555">über 170°</text>
  <circle cx="374" cy="299" r="9" fill="#2e9d5b"/><path d="M369,299 L373,303 L379,294" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="26" y="334" font-size="14" fill="#222">Anschluss</text>
  <text x="150" y="334" font-size="13" font-weight="700" fill="#222">HDMI, DisplayPort</text>
  <text x="288" y="334" font-size="13" fill="#555">digital</text>
  <circle cx="374" cy="329" r="9" fill="#2e9d5b"/><path d="M369,329 L373,333 L379,324" fill="none" stroke="#fff" stroke-width="2.2"/>
  <rect x="18" y="345" width="364" height="30" fill="#f4f6fa"/>
  <text x="26" y="364" font-size="14" fill="#222">Pivot</text>
  <text x="150" y="364" font-size="14" font-weight="700" fill="#222">ja</text>
  <text x="276" y="364" font-size="13" fill="#555">Extra</text>
  <circle cx="374" cy="359" r="9" fill="#2e9d5b"/><path d="M369,359 L373,363 L379,354" fill="none" stroke="#fff" stroke-width="2.2"/>

  <!-- Pivot -->
  <text x="200" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Pivot</text>
  <rect x="28" y="444" width="120" height="72" rx="5" fill="#333"/>
  <rect x="34" y="450" width="108" height="60" fill="#dfe8f6"/>
  <rect x="80" y="516" width="16" height="16" fill="#555"/>
  <rect x="62" y="530" width="52" height="6" rx="2" fill="#555"/>

  <path d="M156,470 Q200,420 244,470" fill="none" stroke="#3a6ed8" stroke-width="3.5" marker-end="url(#pb)"/>

  <rect x="276" y="420" width="72" height="104" rx="5" fill="#333"/>
  <rect x="282" y="426" width="60" height="92" fill="#dfe8f6"/>
  <rect x="304" y="524" width="16" height="8" fill="#555"/>
  <rect x="286" y="530" width="52" height="6" rx="2" fill="#555"/>

  <text x="88" y="554" text-anchor="middle" font-size="13" fill="#555">quer</text>
  <text x="312" y="554" text-anchor="middle" font-size="13" fill="#555">hochkant</text>
  <text x="200" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">um 90° drehbar</text>
</svg>
