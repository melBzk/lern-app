<title>Entscheidungsbaum: Neue Tastatur. Frage: Hat sie programmierbare Zusatztasten? Nein: einstecken, fertig – kein Treiber nötig. Ja: Hersteller-Treiber installieren, von CD oder per Download; danach funktionieren die Zusatztasten.</title>
