<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" font-family="system-ui, sans-serif">
  <title>Vier Wege, wie Tastatur und Maus zum PC kommen. In der Mitte ein PC. Erstens PS/2: Kabel in eine runde Buchse, veraltet. Zweitens USB: Kabel in eine rechteckige Buchse, heute Standard. Drittens Bluetooth: Funk direkt zum PC, ohne Kabel. Viertens Funkempfänger: ein kleiner USB-Stick, der Dongle, steckt im PC, die Maus funkt zum Stick; ohne Kabel, aber nicht Bluetooth.</title>
  <defs>
    <g id="tast">
      <rect x="0" y="0" width="80" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
      <g fill="#333">
        <rect x="7" y="7" width="8" height="6"/><rect x="18" y="7" width="8" height="6"/><rect x="29" y="7" width="8" height="6"/><rect x="40" y="7" width="8" height="6"/><rect x="51" y="7" width="8" height="6"/><rect x="62" y="7" width="8" height="6"/>
        <rect x="7" y="16" width="8" height="6"/><rect x="18" y="16" width="8" height="6"/><rect x="29" y="16" width="8" height="6"/><rect x="40" y="16" width="8" height="6"/><rect x="51" y="16" width="8" height="6"/><rect x="62" y="16" width="8" height="6"/>
        <rect x="20" y="25" width="40" height="4"/>
      </g>
    </g>
    <g id="maus">
      <rect x="-15" y="-22" width="30" height="44" rx="15" fill="#fff" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="-22" x2="0" y2="-4" stroke="#333" stroke-width="2"/>
    </g>
    <g id="bt">
      <path d="M-5,-6 L5,5 L0,10 V-10 L5,-5 L-5,6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="wellen" fill="none" stroke="#3a6ed8" stroke-width="3" stroke-linecap="round">
      <path d="M0,-7 A9,9 0 0 1 0,7"/>
      <path d="M7,-13 A16,16 0 0 1 7,13"/>
      <path d="M14,-19 A24,24 0 0 1 14,19"/>
    </g>
  </defs>
  <rect width="400" height="490" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Vier Wege zum PC</text>

  <!-- PC -->
  <rect x="160" y="170" width="80" height="170" rx="6" fill="#3a3f4a"/>
  <text x="200" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">PC</text>
  <!-- PS/2-Buchse rund -->
  <circle cx="180" cy="196" r="9" fill="#8e5cc4" stroke="#fff" stroke-width="1.5"/>
  <!-- USB-Buchse rechteckig -->
  <rect x="208" y="190" width="22" height="10" rx="1" fill="#fff"/>
  <rect x="211" y="193" width="16" height="4" fill="#3a3f4a"/>
  <!-- Bluetooth eingebaut -->
  <circle cx="180" cy="306" r="12" fill="#3a6ed8"/>
  <use href="#bt" x="180" y="306"/>
  <!-- Dongle -->
  <rect x="240" y="300" width="16" height="12" rx="2" fill="#e0a800" stroke="#9a6b00"/>

  <!-- 1 PS/2 -->
  <text x="16" y="62" font-size="16" font-weight="700" fill="#222">1  PS/2</text>
  <use href="#tast" x="16" y="74"/>
  <path d="M96,91 C140,91 176,120 180,186" fill="none" stroke="#555" stroke-width="4"/>
  <rect x="16" y="120" width="76" height="24" rx="12" fill="#e5e7eb"/>
  <text x="54" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#555">veraltet</text>

  <!-- 2 USB -->
  <text x="290" y="62" font-size="16" font-weight="700" fill="#222">2  USB</text>
  <use href="#maus" x="340" y="98"/>
  <path d="M340,76 C340,60 250,60 222,90 C214,100 219,180 219,186" fill="none" stroke="#555" stroke-width="4"/>
  <rect x="290" y="130" width="90" height="24" rx="12" fill="#d6f0de"/>
  <text x="335" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#16703d">Standard</text>

  <!-- 3 Bluetooth -->
  <text x="16" y="444" font-size="16" font-weight="700" fill="#222">3  Bluetooth</text>
  <use href="#tast" x="16" y="380"/>
  <use href="#wellen" transform="translate(104,380) rotate(-38)"/>
  <circle cx="134" cy="346" r="3" fill="#3a6ed8"/><circle cx="146" cy="335" r="3" fill="#3a6ed8"/><circle cx="158" cy="324" r="3" fill="#3a6ed8"/>
  <rect x="16" y="454" width="104" height="24" rx="12" fill="#e8f0fe"/>
  <text x="68" y="471" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4fb8">ohne Kabel</text>

  <!-- 4 Funkempfänger -->
  <text x="384" y="444" text-anchor="end" font-size="16" font-weight="700" fill="#222">4  Funkempfänger</text>
  <use href="#maus" x="340" y="408"/>
  <use href="#wellen" transform="translate(318,390) rotate(-135)"/>
  <circle cx="290" cy="358" r="3" fill="#3a6ed8"/><circle cx="278" cy="344" r="3" fill="#3a6ed8"/><circle cx="266" cy="330" r="3" fill="#3a6ed8"/>
  <text x="262" y="296" text-anchor="start" font-size="13" font-weight="700" fill="#9a6b00">Dongle</text>
  <rect x="180" y="454" width="204" height="24" rx="12" fill="#fde7b0"/>
  <text x="282" y="471" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5500">ohne Kabel, nicht Bluetooth</text>
</svg>
