<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Ein geöffneter Server von oben. Links die CPU, der Chef. Rechts oben die GPU-Karte (Grafikkarte). Rechts unten eine Steckkarte mit Lichtsymbol: der Licht-Chip als Co-Prozessor im PCIe-Steckplatz. Ein Pfeil zeigt: Die CPU gibt bestimmte Rechnungen an den Licht-Chip ab, ein zweiter Pfeil bringt das Ergebnis zurück. Unten: ergänzt CPU und GPU, ersetzt sie nicht.</title>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Ein Helfer im Server</text>

<rect x="12" y="42" width="376" height="300" rx="8" fill="#f4f5f7" stroke="#555" stroke-width="2.5"/>
<text x="26" y="64" font-size="13" fill="#555">Server, von oben geöffnet</text>

<!-- CPU -->
<rect x="30" y="84" width="100" height="96" rx="6" fill="#5b6470"/>
<text x="80" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">CPU</text>
<text x="80" y="150" text-anchor="middle" font-size="13" fill="#fff">(Chef)</text>

<!-- GPU -->
<rect x="176" y="92" width="196" height="40" rx="4" fill="#cfd6dd" stroke="#555" stroke-width="2"/>
<text x="274" y="117" text-anchor="middle" font-size="14" font-weight="700">GPU-Karte</text>
<rect x="172" y="134" width="204" height="6" fill="#333"/>

<!-- Licht-Chip -->
<text x="274" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#c25e00">Licht-Chip (Co-Prozessor)</text>
<rect x="176" y="222" width="196" height="44" rx="4" fill="#fff4e0" stroke="#E07B00" stroke-width="2.5"/>
<path d="M196,244 H352" stroke="#c62828" stroke-width="3"/>
<rect x="262" y="232" width="24" height="24" rx="3" fill="#cfe3f7" stroke="#3a6ed8" stroke-width="2"/>
<rect x="172" y="268" width="204" height="6" fill="#333"/>
<text x="274" y="294" text-anchor="middle" font-size="13">im PCIe-Steckplatz</text>

<!-- Pfeile -->
<path d="M110,182 V232 H160" stroke="#3a6ed8" stroke-width="3" fill="none"/>
<path d="M158,225 L172,232 L158,239 Z" fill="#3a6ed8"/>
<path d="M172,258 H50 V196" stroke="#2e7d32" stroke-width="3" fill="none"/>
<path d="M43,198 L50,184 L57,198 Z" fill="#2e7d32"/>
<text x="118" y="220" font-size="13" font-weight="700" fill="#3a6ed8">Aufgabe</text>
<text x="60" y="280" font-size="13" font-weight="700" fill="#2e7d32">Ergebnis</text>
<text x="26" y="326" font-size="13" fill="#555">nur bestimmte Rechnungen gehen an den Licht-Chip</text>

<rect x="12" y="360" width="376" height="56" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="385" text-anchor="middle" font-size="15" font-weight="700">ergänzt CPU und GPU –</text>
<text x="200" y="405" text-anchor="middle" font-size="15" font-weight="700">ersetzt sie nicht</text>
</svg>
