<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, sans-serif">
  <title>Sechs Gehäuseformen grob im gleichen Maßstab: Big Tower (sehr hoch, Server und Workstation, E-ATX/ATX), Midi Tower (Büro-PC, ATX/microATX), Mini Tower (Büro-PC, microATX), Desktop-Gehäuse (liegt flach, ATX/microATX), ITX-Gehäuse (Mini-PC, Mini-ITX), Rack-Gehäuse 19 Zoll (flacher Einschub, ATX/microATX).</title>
  <defs>
    <g id="schacht" stroke="#999" stroke-width="2"><line x1="6" y1="10" x2="34" y2="10"/><line x1="6" y1="18" x2="34" y2="18"/></g>
  </defs>
  <rect width="400" height="480" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Gehäuseformen im Vergleich</text>
  <text x="200" y="47" text-anchor="middle" font-size="13" fill="#666">grob im gleichen Maßstab</text>

  <!-- Reihe 1: Grundlinie y=200 -->
  <line x1="10" y1="200" x2="390" y2="200" stroke="#ccc"/>
  <!-- Big Tower 540 hoch, 210 breit -->
  <rect x="44" y="65" width="52" height="135" rx="3" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <use href="#schacht" x="50" y="68"/><use href="#schacht" x="50" y="84"/>
  <circle cx="70" cy="186" r="4" fill="none" stroke="#555" stroke-width="2"/>
  <!-- Midi Tower 460 hoch, 200 breit -->
  <rect x="175" y="85" width="50" height="115" rx="3" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <use href="#schacht" x="180" y="88"/>
  <circle cx="200" cy="186" r="4" fill="none" stroke="#555" stroke-width="2"/>
  <!-- Mini Tower 360 hoch, 180 breit -->
  <rect x="308" y="110" width="45" height="90" rx="3" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <use href="#schacht" x="311" y="113"/>
  <circle cx="330" cy="186" r="4" fill="none" stroke="#555" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="70" y="222" font-size="15" font-weight="700" fill="#222">Big Tower</text>
    <text x="70" y="240" font-size="13" fill="#222">Server,</text>
    <text x="70" y="256" font-size="13" fill="#222">Workstation</text>
    <text x="70" y="274" font-size="13" fill="#3a6ed8">E-ATX / ATX</text>

    <text x="200" y="222" font-size="15" font-weight="700" fill="#222">Midi Tower</text>
    <text x="200" y="240" font-size="13" fill="#222">Büro-PC</text>
    <text x="200" y="274" font-size="13" fill="#3a6ed8">ATX / microATX</text>

    <text x="330" y="222" font-size="15" font-weight="700" fill="#222">Mini Tower</text>
    <text x="330" y="240" font-size="13" fill="#222">Büro-PC</text>
    <text x="330" y="274" font-size="13" fill="#3a6ed8">microATX</text>
  </g>

  <!-- Reihe 2: Grundlinie y=380 -->
  <line x1="10" y1="380" x2="390" y2="380" stroke="#ccc"/>
  <!-- Desktop 160 hoch, 430 breit -->
  <rect x="16" y="340" width="107" height="40" rx="3" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <line x1="24" y1="352" x2="60" y2="352" stroke="#999" stroke-width="2"/>
  <circle cx="110" cy="368" r="4" fill="none" stroke="#555" stroke-width="2"/>
  <!-- ITX 254 hoch, 88 breit -->
  <rect x="189" y="317" width="22" height="63" rx="3" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <circle cx="200" cy="370" r="3" fill="none" stroke="#555" stroke-width="2"/>
  <!-- Rack 44 hoch, 485 breit -->
  <rect x="268" y="369" width="124" height="11" rx="1" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <rect x="264" y="367" width="6" height="15" fill="#777"/><rect x="390" y="367" width="6" height="15" fill="#777"/>

  <g text-anchor="middle">
    <text x="70" y="402" font-size="15" font-weight="700" fill="#222">Desktop</text>
    <text x="70" y="420" font-size="13" fill="#222">liegt flach,</text>
    <text x="70" y="436" font-size="13" fill="#222">z. B. unter Monitor</text>
    <text x="70" y="454" font-size="13" fill="#3a6ed8">ATX / microATX</text>

    <text x="200" y="402" font-size="15" font-weight="700" fill="#222">ITX</text>
    <text x="200" y="420" font-size="13" fill="#222">Mini-PC</text>
    <text x="200" y="454" font-size="13" fill="#3a6ed8">Mini-ITX</text>

    <text x="330" y="402" font-size="15" font-weight="700" fill="#222">Rack 19″</text>
    <text x="330" y="420" font-size="13" fill="#222">flacher Einschub</text>
    <text x="330" y="436" font-size="13" fill="#222">für Server</text>
    <text x="330" y="454" font-size="13" fill="#3a6ed8">ATX / microATX</text>
  </g>
  <text x="200" y="474" text-anchor="middle" font-size="13" fill="#666">blau = passende Mainboards</text>
</svg>
