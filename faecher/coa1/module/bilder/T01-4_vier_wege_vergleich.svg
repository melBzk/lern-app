<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 418" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Vergleich der vier Anschlusswege mit den Spalten Kabel und im Betrieb umstecken. PS/2: Kabel ja, umstecken nein, veraltet. USB: Kabel ja, umstecken ja, Standard. Bluetooth: kein Kabel, schnurlos. Funkempfänger: kein Kabel, der Stick selbst steckt in USB, kein Bluetooth.</title>
