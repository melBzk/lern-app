<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Festplatten im richtigen Größenverhältnis von oben. Links die große 3,5-Zoll-Festplatte für Desktop-PC und Tower, mit Tower-Symbol. Rechts die kleinere 2,5-Zoll-Festplatte für Notebooks, mit Laptop-Symbol. Unten: Eine 2,5-Zoll-Festplatte passt mit einem Einbaurahmen auch in einen 3,5-Zoll-Schacht.</title>
<rect width="400" height="540" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Zwei Größen: 3,5″ und 2,5″</text>
<text x="200" y="46" text-anchor="middle" font-size="13" fill="#555">im richtigen Größenverhältnis</text>

<rect x="40" y="60" width="122" height="175" rx="8.5" fill="#eceff1" stroke="#555" stroke-width="2"/><circle cx="96.1" cy="121.0" r="48.8" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/><circle cx="96.1" cy="121.0" r="9.8" fill="#555"/><line x1="143.7" y1="200.0" x2="113.2" y2="91.7" stroke="#7a7f88" stroke-width="6.1" stroke-linecap="round"/><circle cx="143.7" cy="200.0" r="7.3" fill="#555"/>
<rect x="240" y="115" width="84" height="120" rx="5.9" fill="#eceff1" stroke="#555" stroke-width="2"/><circle cx="278.6" cy="157.0" r="33.6" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/><circle cx="278.6" cy="157.0" r="6.7" fill="#555"/><line x1="311.4" y1="211.0" x2="290.4" y2="136.8" stroke="#7a7f88" stroke-width="4.2" stroke-linecap="round"/><circle cx="311.4" cy="211.0" r="5.0" fill="#555"/>

<g text-anchor="middle">
<text x="101" y="266" font-size="24" font-weight="700" fill="#3a6ed8">3,5″</text>
<text x="101" y="288" font-weight="700">Desktop-PC / Tower</text>
<text x="282" y="266" font-size="24" font-weight="700" fill="#c62828">2,5″</text>
<text x="282" y="288" font-weight="700">Notebook</text>
</g>
<!-- Tower -->
<rect x="86" y="302" width="30" height="54" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<line x1="91" y1="312" x2="111" y2="312" stroke="#555" stroke-width="2"/><line x1="91" y1="320" x2="111" y2="320" stroke="#555" stroke-width="2"/>
<circle cx="101" cy="342" r="3" fill="#555"/>
<!-- Laptop -->
<rect x="258" y="308" width="48" height="32" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M250,342 L314,342 L320,352 L244,352 Z" fill="#555"/>

<!-- Einbaurahmen -->
<rect x="10" y="378" width="380" height="150" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
<rect x="30" y="392" width="85" height="122" rx="4" fill="none" stroke="#3a6ed8" stroke-width="5"/>
<rect x="43" y="411" width="59" height="84" rx="4.1" fill="#eceff1" stroke="#555" stroke-width="2"/><circle cx="70.1" cy="440.5" r="23.6" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/><circle cx="70.1" cy="440.5" r="4.7" fill="#555"/><line x1="93.2" y1="478.2" x2="78.4" y2="426.3" stroke="#7a7f88" stroke-width="4.0" stroke-linecap="round"/><circle cx="93.2" cy="478.2" r="3.5" fill="#555"/>
<text x="135" y="420" font-weight="700" fill="#3a6ed8">Einbaurahmen</text>
<text x="135" y="448">2,5″ passt mit Einbaurahmen</text>
<text x="135" y="468">auch in einen <tspan font-weight="700">3,5″-Schacht</tspan></text>
<line x1="132" y1="415" x2="117" y2="415" stroke="#3a6ed8" stroke-width="1.5"/>
</svg>
