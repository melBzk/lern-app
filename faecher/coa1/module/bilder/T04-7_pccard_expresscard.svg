<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Notebook-Karten als Treppe, jede Stufe schneller. Alle drei wurden von außen ins Notebook geschoben. PC Card 16: 16 Bit, 16 MB/s. CardBus (PC Card 32): 32 Bit, 133 MB/s. ExpressCard: seriell, nutzt eine PCIe-Lane oder USB, 250 bis 500 MB/s; Warnhinweis: Die Buch-Tabelle nennt hier 32 Bit, das ist falsch. Darunter: heute M.2 innen im Gerät.</title>
<rect width="400" height="410" fill="#fff"/>

<text x="200" y="24" text-anchor="middle" font-size="15" font-weight="700">von außen ins Notebook geschoben</text>
<path d="M14,44 V34 H386 V44" fill="none" stroke="#555" stroke-width="2"/>

<!-- Pfeil schneller -->
<text x="16" y="120" font-size="14" font-weight="700" fill="#c62828">jede Stufe</text>
<text x="16" y="138" font-size="14" font-weight="700" fill="#c62828">schneller</text>
<line x1="60" y1="196" x2="300" y2="98" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
<polygon points="312,93 296,91 302,106" fill="#c62828"/>

<!-- Stufe 1 -->
<rect x="12" y="220" width="120" height="80" rx="6" fill="#eceff1" stroke="#9aa5b1" stroke-width="2"/>
<text x="72" y="242" text-anchor="middle" font-size="14" font-weight="700">PC Card 16</text>
<text x="72" y="262" text-anchor="middle" font-size="14">16 Bit</text>
<text x="72" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">16 MB/s</text>
<!-- Stufe 2 -->
<rect x="140" y="170" width="120" height="130" rx="6" fill="#eceff1" stroke="#9aa5b1" stroke-width="2"/>
<text x="200" y="192" text-anchor="middle" font-size="14" font-weight="700">CardBus</text>
<text x="200" y="210" text-anchor="middle" font-size="13">(PC Card 32)</text>
<text x="200" y="232" text-anchor="middle" font-size="14">32 Bit</text>
<text x="200" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">133 MB/s</text>
<!-- Stufe 3 -->
<rect x="268" y="120" width="120" height="180" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="328" y="142" text-anchor="middle" font-size="14" font-weight="700">ExpressCard</text>
<text x="328" y="162" text-anchor="middle" font-size="13">PCIe oder USB</text>
<text x="328" y="182" text-anchor="middle" font-size="13">seriell:</text>
<text x="328" y="198" text-anchor="middle" font-size="13">1 PCIe-Lane</text>
<text x="328" y="214" text-anchor="middle" font-size="13">oder USB</text>
<text x="328" y="238" text-anchor="middle" font-size="11.5" fill="#c62828">⚠ Buch-Tabelle:</text>
<text x="328" y="253" text-anchor="middle" font-size="11.5" fill="#c62828">„32 Bit“ – falsch</text>
<text x="328" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">250–500 MB/s</text>
<text x="200" y="320" text-anchor="middle" font-size="13" fill="#444">(Stufenhöhe nicht maßstäblich)</text>

<!-- heute M.2 -->
<rect x="12" y="336" width="376" height="62" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="30" y="352" width="130" height="30" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<rect x="31" y="354" width="7" height="26" fill="#c9a227"/>
<circle cx="168" cy="367" r="5" fill="#9aa5b1"/>
<text x="99" y="372" text-anchor="middle" font-size="14" font-weight="700">M.2</text>
<text x="186" y="364" font-size="15" font-weight="700">heute: M.2</text>
<text x="186" y="384" font-size="15" font-weight="700" fill="#c62828">innen im Gerät</text>
</svg>
