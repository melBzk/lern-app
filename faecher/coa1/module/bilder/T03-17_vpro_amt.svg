<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fernwartung mit vPro und AMT. Oben die IT-Abteilung mit einem Laptop. Eine Netzwerkleitung führt nach unten zu einem Büro-PC, dessen Bildschirm einen Absturz zeigt: blauer Bildschirm mit traurigem Gesicht. Am Prozessor des Büro-PCs sitzt ein eigenes Kästchen AMT, es läuft unabhängig vom Betriebssystem. An der Leitung drei Knöpfe: Status abrufen, Einstellungen ändern, ein und aus.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
</defs>
<rect width="400" height="490" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="700">Fernwartung mit vPro / AMT</text>

<!-- Laptop IT -->
<rect x="52" y="46" width="106" height="68" rx="5" fill="#555"/>
<rect x="60" y="54" width="90" height="52" fill="#e8f0fe"/>
<path d="M40,114 L170,114 L178,126 L32,126 Z" fill="#9aa5b1"/>
<text x="196" y="80" font-size="16" font-weight="700">IT-Abteilung</text>
<text x="196" y="100" font-size="13" fill="#444">per Fernzugriff</text>

<!-- Netzwerkleitung -->
<path d="M105,132 L105,314 L229,314 L229,328" fill="none" stroke="#3a6ed8" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#k)"/>
<text x="96" y="236" text-anchor="end" font-size="13" fill="#3a6ed8" font-weight="700" transform="rotate(-90 96 236)">Netzwerk</text>

<!-- Knöpfe -->
<g font-weight="700">
<rect x="128" y="156" width="190" height="38" rx="19" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="223" y="181" text-anchor="middle">Status abrufen</text>
<rect x="128" y="206" width="190" height="38" rx="19" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="223" y="231" text-anchor="middle">Einstellungen ändern</text>
<rect x="128" y="256" width="190" height="38" rx="19" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<path d="M186,268 A9,9 0 1,0 196,268" fill="none" stroke="#3a6ed8" stroke-width="2.5" stroke-linecap="round"/>
<line x1="191" y1="263" x2="191" y2="274" stroke="#3a6ed8" stroke-width="2.5" stroke-linecap="round"/>
<text x="210" y="281">ein / aus</text>
</g>

<!-- Büro-PC: Monitor mit Absturz -->
<rect x="30" y="340" width="150" height="96" rx="5" fill="#555"/>
<rect x="38" y="348" width="134" height="80" fill="#1e4fa8"/>
<text x="62" y="392" font-size="30" font-weight="700" fill="#fff">:(</text>
<rect x="102" y="400" width="56" height="4" fill="#9dbcf0"/><rect x="102" y="410" width="40" height="4" fill="#9dbcf0"/>
<rect x="95" y="436" width="20" height="12" fill="#555"/><rect x="74" y="448" width="62" height="6" rx="2" fill="#555"/>
<text x="105" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">Betriebssystem abgestürzt</text>

<!-- Tower mit AMT -->
<rect x="196" y="332" width="66" height="126" rx="5" fill="#eceff1" stroke="#555" stroke-width="2"/>
<rect x="208" y="352" width="42" height="36" rx="3" fill="#555"/>
<text x="229" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CPU</text>
<rect x="212" y="384" width="34" height="22" rx="3" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<text x="229" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">AMT</text>
<line x1="248" y1="395" x2="276" y2="384" stroke="#2e7d32" stroke-width="2"/>
<text x="278" y="364" font-size="15" font-weight="700" fill="#2e7d32">AMT</text>
<text x="278" y="384" font-size="13">läuft unabhängig</text>
<text x="278" y="400" font-size="13">vom Betriebs-</text>
<text x="278" y="416" font-size="13">system</text>
<text x="278" y="440" font-size="13" font-weight="700" fill="#2e7d32">→ PC trotzdem</text>
<text x="278" y="456" font-size="13" font-weight="700" fill="#2e7d32">erreichbar</text>
</svg>
