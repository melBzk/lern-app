<text x="328" y="164" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Host-Controller</text>
<text x="328" y="184" font-size="13" text-anchor="middle" fill="#444">steuert alle</text>
<text x="328" y="200" font-size="13" text-anchor="middle" fill="#444">USB-Geräte</text>
