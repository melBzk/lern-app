<text x="70" y="440" font-size="13" text-anchor="middle" fill="#444">der Speicher</text>
<text x="200" y="392" font-size="20" text-anchor="middle" font-weight="700" fill="#555">↔</text>
<rect x="278" y="374" width="56" height="24" rx="4" fill="#555" stroke="#333" stroke-width="1.5"/><rect x="292" y="362" width="20" height="18" rx="2" fill="#3a6ed8" stroke="#1f3f80" stroke-width="1.5"/><rect x="288" y="379" width="36" height="4" rx="1" fill="#222" stroke="none" stroke-width="0"/><line x1="334" y1="386" x2="346" y2="386" stroke="#333" stroke-width="3"/>
<text x="310" y="424" font-size="14" text-anchor="middle" font-weight="700" fill="#222">SD-Port / Kartenleser</text>
<text x="310" y="440" font-size="13" text-anchor="middle" fill="#444">liest die Karte</text>
</svg>
