<text x="24" y="62" font-size="15" font-weight="700" fill="#222">„Controller“ – drei Bedeutungen</text>
<rect x="10" y="72" width="124" height="136" rx="12" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2.5"/>
<path d="M48,128 Q72,116 96,128 Z" fill="#555" stroke="#333" stroke-width="1.5"/><line x1="72" y1="122" x2="78" y2="98" stroke="#333" stroke-width="4"/><circle cx="79" cy="94" r="7" fill="#d64545" stroke="#333" stroke-width="1.5"/>
<text x="72" y="164" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Spiele-Gerät</text>
<text x="72" y="184" font-size="13" text-anchor="middle" fill="#444">hier gemeint</text>
<rect x="138" y="72" width="124" height="136" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<rect x="170" y="98" width="60" height="28" rx="3" fill="#cfe8d4" stroke="#2f6b4f" stroke-width="1.5"/><line x1="178" y1="128" x2="214" y2="128" stroke="#c9a227" stroke-width="4"/><rect x="226" y="94" width="6" height="34" rx="1" fill="#aaa" stroke="#555" stroke-width="1"/>
<text x="200" y="164" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Steckkarte</text>
<text x="200" y="184" font-size="13" text-anchor="middle" fill="#444">rüstet Anschlüsse</text>
<text x="200" y="200" font-size="13" text-anchor="middle" fill="#444">nach</text>
<rect x="266" y="72" width="124" height="136" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
