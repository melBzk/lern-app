<rect x="40.0" y="232" width="60" height="34" rx="3" fill="#333" stroke="#333" stroke-width="1.5"/><rect x="44.0" y="236" width="52" height="26" rx="1" fill="#e8f0fe" stroke="none" stroke-width="0"/><path d="M32.0,276 L40.0,266 L100.0,266 L108.0,276 Z" fill="#dfe3e8" stroke="#333" stroke-width="1.5"/><rect x="61" y="269" width="18" height="5" rx="1" fill="#ffd8a8" stroke="#E07B00" stroke-width="1.5"/>
