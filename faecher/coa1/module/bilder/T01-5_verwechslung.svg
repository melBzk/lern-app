<text x="310" y="302" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Touchscreen</text>
<text x="310" y="318" font-size="13" text-anchor="middle" fill="#c62828">Ein- und Ausgabe</text>
<rect x="10" y="338" width="380" height="110" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<path d="M53.2,360.4 h24.0 l9.6,9.6 v33.6 h-33.6 z" fill="#3a6ed8" stroke="#1f3f80" stroke-width="1.5"/><rect x="60.4" y="365.2" width="4.8" height="8.4" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/><rect x="68.8" y="365.2" width="4.8" height="8.4" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/><text x="70" y="391.6" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">SD</text>
