<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Seriell oder parallel: Oben seriell, eine einzige Spur vom PC über einen langen Weg zum USB-Stecker und zur Maus; die 8 Bits 1 0 1 1 0 0 1 0 fahren nacheinander. Unten parallel, eine kurze Straße mit 8 Spuren zwischen CPU und RAM; dieselben 8 Bits fahren nebeneinander, also gleichzeitig.</title>
