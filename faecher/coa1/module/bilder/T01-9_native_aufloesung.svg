<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Derselbe Buchstabe A auf einem LCD. Links in der nativen Auflösung: scharf und glatt, ein Bildpunkt gleich ein Pixel. Rechts bei kleinerer Auflösung, auf den ganzen Bildschirm hochgezogen: grobe Treppenstufen und klotzige Pixelblöcke. Darunter die zweite Möglichkeit: Das Bild bleibt klein, rundherum ein schwarzer Rand.</title>
