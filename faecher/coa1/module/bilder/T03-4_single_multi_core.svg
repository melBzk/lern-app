<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Prozessor-Gehäuse von oben. Oben Single-Core: ein Kern mit eigenem L1-Cache, also 1 Gehäuse und 1 Recheneinheit. Unten Multi-Core, hier Quad-Core: vier Kerne, jeder mit eigenem L1- und L2-Cache; darunter ein breiter L3-Cache, den sich alle vier Kerne teilen. 1 Gehäuse, 4 Recheneinheiten.</title>
<rect width="400" height="510" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Ein Kern oder mehrere?</text>

<!-- Single-Core -->
<text x="200" y="60" font-size="16" text-anchor="middle" font-weight="700">Single-Core</text>
<rect x="120" y="72" width="160" height="110" rx="10" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
<rect x="145" y="88" width="110" height="78" rx="6" fill="#3a6ed8"/>
<text x="200" y="116" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">Kern</text>
<rect x="152" y="134" width="40" height="24" rx="4" fill="#2f9e44"/>
<text x="172" y="151" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">L1</text>
<text x="200" y="206" font-size="15" text-anchor="middle" font-weight="700">1 Gehäuse · 1 Recheneinheit</text>

<line x1="20" y1="226" x2="380" y2="226" stroke="#ccc" stroke-width="1.5"/>

<!-- Multi-Core -->
<text x="200" y="254" font-size="16" text-anchor="middle" font-weight="700">Multi-Core (hier: Quad-Core)</text>
<rect x="18" y="264" width="364" height="200" rx="10" fill="#f4f1ee" stroke="#555" stroke-width="2"/>

<rect x="29" y="278" width="78" height="118" rx="6" fill="#3a6ed8"/>
<text x="68" y="304" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Kern 1</text>
<rect x="34" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="50" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L1</text>
<rect x="70" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="86" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L2</text>

<rect x="117" y="278" width="78" height="118" rx="6" fill="#3a6ed8"/>
<text x="156" y="304" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Kern 2</text>
<rect x="122" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="138" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L1</text>
<rect x="158" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="174" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L2</text>

<rect x="205" y="278" width="78" height="118" rx="6" fill="#3a6ed8"/>
<text x="244" y="304" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Kern 3</text>
<rect x="210" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="226" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L1</text>
<rect x="246" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="262" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L2</text>

<rect x="293" y="278" width="78" height="118" rx="6" fill="#3a6ed8"/>
<text x="332" y="304" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Kern 4</text>
<rect x="298" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="314" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L1</text>
<rect x="334" y="360" width="32" height="24" rx="4" fill="#2f9e44"/><text x="350" y="377" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">L2</text>

<rect x="29" y="396" width="342" height="54" rx="6" fill="#b7e4c3" stroke="#2f9e44" stroke-width="2"/>
<text x="200" y="429" font-size="16" text-anchor="middle" font-weight="700" fill="#1f6b30">L3 – gemeinsam</text>

<text x="200" y="490" font-size="15" text-anchor="middle" font-weight="700">1 Gehäuse · 4 Recheneinheiten</text>
</svg>
