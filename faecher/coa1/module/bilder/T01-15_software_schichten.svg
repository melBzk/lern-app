<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Software in Schichten, von unten nach oben: Hardware (CPU, RAM, Festplatte), BIOS (startet den PC), Betriebssystem (zum Beispiel Windows, Linux), Programme (Textprogramm, Browser), ganz oben du als Anwender. Zwischen dir und den Programmen liegt die GUI mit Fenstern, Symbolen und Maus. Zwischen zwei Programmen steckt die API: Programme sprechen miteinander. Links: Beim Start kommt zuerst das BIOS (1), dann das Betriebssystem (2).</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
</defs>
<rect width="400" height="460" fill="#fff"/>

<!-- Du -->
<rect x="66" y="10" width="324" height="52" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="96" cy="28" r="9" fill="#f1c9a5"/>
<rect x="85" y="38" width="22" height="18" rx="8" fill="#3a6ed8"/>
<text x="122" y="42" font-size="16" font-weight="700">Du (Anwender)</text>

<!-- GUI -->
<rect x="96" y="68" width="264" height="36" rx="8" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
<rect x="108" y="74" width="30" height="24" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
<rect x="108" y="74" width="30" height="6" fill="#3a6ed8"/>
<path d="M128,86 l0,10 l3,-3 l3,5 l2,-1 l-3,-5 l4,0 z" fill="#222"/>
<text x="148" y="91" font-size="14" font-weight="700" fill="#a85a00">GUI – Fenster, Symbole, Maus</text>

<!-- Programme -->
<rect x="66" y="110" width="324" height="100" rx="8" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="80" y="132" font-size="16" font-weight="700" fill="#1d3f8a">Programme</text>
<rect x="80" y="142" width="116" height="34" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="138" y="164" text-anchor="middle" font-size="14">Textprogramm</text>
<rect x="262" y="142" width="116" height="34" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="320" y="164" text-anchor="middle" font-size="14">Browser</text>
<!-- Stecker API -->
<line x1="196" y1="159" x2="212" y2="159" stroke="#333" stroke-width="3"/>
<rect x="212" y="149" width="16" height="20" rx="2" fill="#E07B00"/>
<line x1="228" y1="154" x2="236" y2="154" stroke="#333" stroke-width="2.5"/>
<line x1="228" y1="164" x2="236" y2="164" stroke="#333" stroke-width="2.5"/>
<rect x="236" y="147" width="14" height="24" rx="2" fill="#555"/>
<line x1="250" y1="159" x2="262" y2="159" stroke="#333" stroke-width="3"/>
<text x="228" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#a85a00">API – Programme sprechen miteinander</text>

<!-- Betriebssystem -->
<rect x="66" y="216" width="324" height="56" rx="8" fill="#dbe7fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="80" y="240" font-size="16" font-weight="700">Betriebssystem</text>
<text x="80" y="260" font-size="14">z. B. Windows, Linux</text>

<!-- BIOS -->
<rect x="66" y="278" width="324" height="56" rx="8" fill="#e8e3f3" stroke="#6b4fa0" stroke-width="2"/>
<text x="80" y="302" font-size="16" font-weight="700">BIOS</text>
<text x="80" y="322" font-size="14">startet den PC</text>

<!-- Hardware -->
<rect x="66" y="340" width="324" height="56" rx="8" fill="#e5e7eb" stroke="#555" stroke-width="2"/>
<text x="80" y="364" font-size="16" font-weight="700">Hardware</text>
<text x="80" y="384" font-size="14">CPU, RAM, Festplatte …</text>

<!-- Startreihenfolge -->
<circle cx="32" cy="306" r="14" fill="#E07B00"/>
<text x="32" y="311" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<circle cx="32" cy="244" r="14" fill="#E07B00"/>
<text x="32" y="249" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<line x1="32" y1="290" x2="32" y2="262" stroke="#E07B00" stroke-width="3.5" marker-end="url(#ao)"/>
<text x="200" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a00">Start: zuerst BIOS (1), dann Betriebssystem (2)</text>
</svg>
