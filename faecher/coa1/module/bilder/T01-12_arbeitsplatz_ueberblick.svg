<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, sans-serif" role="img">
  <title>Büro-Arbeitsplatz im Überblick. Auf dem Monitor kleben die Schilder TCO und ISO 9241, an der Tastatur ISO 9241. Unter dem Tisch steht der PC mit den Schildern CE, GS und Energy Star; vom Lüfter kommt Lärm. In der Ecke steht ein Laserdrucker neben einem offenen Fenster, über ihm eine Ozon-Wolke: lüften und Abstand halten. Die Schilder sind schlichte Textschilder, keine Original-Zeichen.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="480" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Prüfzeichen · Ozon · Lärm</text>

  <!-- Boden -->
  <line x1="0" y1="410" x2="400" y2="410" stroke="#adb5bd" stroke-width="2"/>

  <!-- Fenster -->
  <rect x="300" y="60" width="86" height="110" fill="#e7f5ff" stroke="#555" stroke-width="2"/>
  <line x1="343" y1="60" x2="343" y2="170" stroke="#555" stroke-width="2"/>
  <polygon points="343,62 374,74 374,158 343,168" fill="#d0ebff" stroke="#555" stroke-width="1.5"/>

  <!-- Ozon und lüften -->
  <line x1="345" y1="222" x2="345" y2="178" stroke="#333" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="352" y="204" font-size="14" font-weight="700" fill="#222">lüften</text>
  <g fill="#ced4da">
    <circle cx="326" cy="244" r="15"/><circle cx="346" cy="234" r="18"/><circle cx="366" cy="244" r="15"/>
    <rect x="318" y="240" width="56" height="18" rx="9"/>
  </g>
  <text x="346" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#e8590c">Ozon</text>

  <!-- Laserdrucker -->
  <rect x="318" y="264" width="56" height="10" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="306" y="272" width="80" height="44" rx="5" fill="#adb5bd" stroke="#555" stroke-width="2"/>
  <circle cx="374" cy="284" r="3" fill="#1f9d55"/>
  <rect x="312" y="316" width="68" height="94" fill="#e9ecef" stroke="#555" stroke-width="1.5"/>
  <text x="346" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Laserdrucker</text>

  <!-- Tisch -->
  <rect x="16" y="228" width="272" height="12" fill="#c9a27e" stroke="#8d6e63" stroke-width="1.5"/>
  <rect x="22" y="240" width="10" height="170" fill="#c9a27e"/>
  <rect x="272" y="240" width="10" height="170" fill="#c9a27e"/>

  <!-- Monitor -->
  <rect x="60" y="92" width="160" height="104" rx="6" fill="#3a3f4a"/>
  <rect x="68" y="100" width="144" height="88" fill="#dfe8f6"/>
  <rect x="132" y="196" width="16" height="18" fill="#555"/>
  <rect x="112" y="212" width="56" height="6" fill="#555"/>
  <g font-size="13" font-weight="700" fill="#222" text-anchor="middle">
    <rect x="78" y="128" width="50" height="26" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="103" y="146">TCO</text>
    <rect x="136" y="128" width="70" height="26" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="171" y="146">ISO 9241</text>
  </g>

  <!-- Tastatur -->
  <polygon points="70,228 214,228 206,216 78,216" fill="#e9ecef" stroke="#555" stroke-width="1.5"/>
  <line x1="92" y1="250" x2="100" y2="228" stroke="#555" stroke-width="1.5"/>
  <rect x="44" y="250" width="70" height="26" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="79" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#222">ISO 9241</text>

  <!-- PC -->
  <rect x="168" y="280" width="84" height="130" rx="4" fill="#3a3f4a"/>
  <circle cx="210" cy="304" r="14" fill="#495057" stroke="#adb5bd" stroke-width="1.5"/>
  <path d="M200,304 h20 M210,294 v20" stroke="#adb5bd" stroke-width="1.5"/>
  <g font-size="13" font-weight="700" fill="#222" text-anchor="middle">
    <rect x="176" y="330" width="32" height="24" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="192" y="347">CE</text>
    <rect x="214" y="330" width="32" height="24" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="230" y="347">GS</text>
    <rect x="170" y="362" width="80" height="24" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="210" y="379">Energy Star</text>
  </g>
  <path d="M158,296 q-8,8 0,16 M150,290 q-13,14 0,28" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="140" y="310" text-anchor="end" font-size="15" font-weight="700" fill="#e8590c">Lärm</text>

  <!-- Abstand -->
  <line x1="160" y1="450" x2="330" y2="450" stroke="#333" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="245" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Abstand halten</text>
</svg>
