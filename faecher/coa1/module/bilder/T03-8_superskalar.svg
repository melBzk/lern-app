<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 548" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Superskalar = jede Funktionseinheit mehrfach, dadurch mehrere Befehle pro Takt. Zeitplan Takt 1 bis 6 mit zwei Bändern (Band = eine komplette Reihe Funktionseinheiten): In Takt 1 starten Befehl 1 auf Band 1 und Befehl 2 auf Band 2, in Takt 2 Befehl 3 auf Band 1 und Befehl 4 auf Band 2. Phasen: L laden, D decodieren, O Operanden laden, A ausführen, S zurückspeichern. Ergebnis: 4 Befehle = 6 Takte. Vergleich: 2 Waschmaschinen und 2 Trockner.</title>
