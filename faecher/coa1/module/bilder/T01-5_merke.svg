<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 492" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Merkbild: Ein- und Ausgabe zugleich sind Touchscreen und Headset. Eingabegeräte sind Touchpad, Grafiktablett, Controller, Webcam und Mikrofon. Der Kartenleser liest SD-, Magnet- und RFID-Karten und hängt meist an USB. RFID heißt Radio-Frequency Identification: ein Chip, der per Funk gelesen wird. Ein Biosensor erfasst Körpermerkmale, z. B. den Fingerabdruck zur Anmeldung.</title>
