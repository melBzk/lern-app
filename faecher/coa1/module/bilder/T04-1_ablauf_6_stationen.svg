<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Der CPU-Tausch in 6 Stationen, von oben nach unten. 1 Prüfen: CPU-Support-Liste mit Lupe, BIOS-Chip mit Pfeil nach oben, BIOS-Update nötig? 2 Vorbereiten: Netzstecker ziehen, Fotos machen, Backup. 3 Erden: Armband, Kabel zur Matte, Kabel zur Erde. 4 Ausbauen und reinigen: Kühler abheben, Tuch mit Isopropanol, Druckluft. 5 Einsetzen: CPU mit Dreieck senkrecht und ohne Kraft auf den Sockel, Hebel. 6 Schließen und testen: Gehäuse zu, Netzstecker zuletzt, Funktionstest.</title>
<rect width="400" height="760" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">CPU-Tausch in 6 Stationen</text>

<!-- Verbindungspfeile links -->
<g stroke="#3a6ed8" stroke-width="3"><line x1="26" y1="82" x2="26" y2="156"/><line x1="26" y1="200" x2="26" y2="274"/><line x1="26" y1="318" x2="26" y2="392"/><line x1="26" y1="436" x2="26" y2="510"/><line x1="26" y1="554" x2="26" y2="628"/></g>
<g fill="#3a6ed8"><path d="M18,154 L34,154 L26,164 Z"/><path d="M18,272 L34,272 L26,282 Z"/><path d="M18,390 L34,390 L26,400 Z"/><path d="M18,508 L34,508 L26,518 Z"/><path d="M18,626 L34,626 L26,636 Z"/></g>

<!-- 1 Prüfen -->
<g transform="translate(0,46)">
<rect x="48" y="0" width="344" height="110" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<circle cx="26" cy="18" r="16" fill="#3a6ed8"/><text x="26" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
<text x="62" y="26" font-size="17" font-weight="700">Prüfen</text>
<text x="380" y="26" font-size="13" text-anchor="end" font-weight="700" fill="#E07B00">vor dem Kauf</text>
<g transform="translate(125,0)">
<rect x="-22" y="36" width="40" height="48" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<g stroke="#9aa5b1" stroke-width="3"><line x1="-16" y1="46" x2="10" y2="46"/><line x1="-16" y1="54" x2="6" y2="54"/><line x1="-16" y1="62" x2="10" y2="62"/><line x1="-16" y1="70" x2="2" y2="70"/></g>
<circle cx="14" cy="64" r="11" fill="#fff" fill-opacity="0.6" stroke="#E07B00" stroke-width="3.5"/>
<line x1="22" y1="72" x2="30" y2="81" stroke="#E07B00" stroke-width="4" stroke-linecap="round"/>
<text x="0" y="102" text-anchor="middle" font-size="13">CPU-Support-Liste</text>
</g>
<g transform="translate(295,0)">
<g stroke="#555" stroke-width="2"><line x1="-26" y1="42" x2="-26" y2="80"/><line x1="-18" y1="42" x2="-18" y2="80"/><line x1="-10" y1="42" x2="-10" y2="80"/><line x1="-2" y1="42" x2="-2" y2="80"/></g>
<rect x="-32" y="46" width="36" height="30" rx="3" fill="#555"/>
<text x="-14" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BIOS</text>
<line x1="22" y1="82" x2="22" y2="52" stroke="#E07B00" stroke-width="4"/><path d="M13,54 L31,54 L22,40 Z" fill="#E07B00"/>
<text x="0" y="102" text-anchor="middle" font-size="13">BIOS-Update nötig?</text>
</g>
</g>

<!-- 2 Vorbereiten -->
<g transform="translate(0,164)">
<rect x="48" y="0" width="344" height="110" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<circle cx="26" cy="18" r="16" fill="#3a6ed8"/><text x="26" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
<text x="62" y="26" font-size="17" font-weight="700">Vorbereiten</text>
<g transform="translate(108,0)">
<rect x="-40" y="40" width="32" height="40" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="-24" cy="53" r="3.5" fill="#555"/><circle cx="-24" cy="67" r="3.5" fill="#555"/>
<g stroke="#555" stroke-width="4"><line x1="0" y1="53" x2="8" y2="53"/><line x1="0" y1="67" x2="8" y2="67"/></g>
<rect x="8" y="45" width="18" height="30" rx="4" fill="#555"/>
<path d="M26,60 C36,60 34,78 44,78" fill="none" stroke="#555" stroke-width="3"/>
<text x="0" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#E07B00">Stecker ziehen</text>
</g>
<g transform="translate(222,0)">
<rect x="-10" y="40" width="16" height="9" rx="2" fill="#555"/>
<rect x="-24" y="46" width="48" height="34" rx="5" fill="#555"/>
<circle cx="0" cy="63" r="11" fill="#9aa5b1" stroke="#fff" stroke-width="2.5"/>
<text x="0" y="102" text-anchor="middle" font-size="13">Fotos machen</text>
</g>
<g transform="translate(330,0)">
<rect x="-12" y="36" width="34" height="42" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<rect x="-22" y="42" width="34" height="42" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="-5" cy="61" r="10" fill="none" stroke="#3a6ed8" stroke-width="2"/><circle cx="-5" cy="61" r="2.5" fill="#3a6ed8"/>
<text x="0" y="102" text-anchor="middle" font-size="13">Backup</text>
</g>
</g>

<!-- 3 Erden -->
<g transform="translate(0,282)">
<rect x="48" y="0" width="344" height="110" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<circle cx="26" cy="18" r="16" fill="#3a6ed8"/><text x="26" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
<text x="62" y="26" font-size="17" font-weight="700">Erden</text>
<!-- Kabel -->
<path d="M100,72 C110,86 160,86 180,72" fill="none" stroke="#E07B00" stroke-width="3"/>
<path d="M250,66 L330,66 L330,48" fill="none" stroke="#E07B00" stroke-width="3"/>
<g transform="translate(105,0)">
<rect x="-44" y="50" width="40" height="22" rx="11" fill="#f2d3b3" stroke="#8a6b4b" stroke-width="2"/>
<ellipse cx="4" cy="61" rx="13" ry="14" fill="#f2d3b3" stroke="#8a6b4b" stroke-width="2"/>
<rect x="-14" y="47" width="9" height="28" rx="2" fill="#3a6ed8"/>
<text x="-10" y="102" text-anchor="middle" font-size="13">Armband</text>
</g>
<g transform="translate(215,0)">
<path d="M-44,82 L32,82 L42,58 L-34,58 Z" fill="#9aa5b1" stroke="#555" stroke-width="2"/>
<text x="0" y="102" text-anchor="middle" font-size="13">geerdete Matte</text>
</g>
<g transform="translate(330,0)" stroke="#222" stroke-width="3">
<line x1="0" y1="46" x2="0" y2="60"/><line x1="-18" y1="60" x2="18" y2="60"/><line x1="-12" y1="68" x2="12" y2="68"/><line x1="-6" y1="76" x2="6" y2="76"/>
<text x="0" y="102" text-anchor="middle" font-size="13" stroke="none">Erde</text>
</g>
</g>

<!-- 4 Ausbauen & reinigen -->
<g transform="translate(0,400)">
<rect x="48" y="0" width="344" height="110" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<circle cx="26" cy="18" r="16" fill="#3a6ed8"/><text x="26" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text>
<text x="62" y="26" font-size="17" font-weight="700">Ausbauen &amp; reinigen</text>
<g transform="translate(108,0)">
<rect x="-40" y="76" width="74" height="8" fill="#9aa5b1"/>
<rect x="-17" y="69" width="28" height="7" fill="#555"/>
<rect x="-30" y="52" width="54" height="6" fill="#9aa5b1"/>
<g fill="#9aa5b1"><rect x="-30" y="36" width="5" height="16"/><rect x="-20" y="36" width="5" height="16"/><rect x="-10" y="36" width="5" height="16"/><rect x="0" y="36" width="5" height="16"/><rect x="10" y="36" width="5" height="16"/><rect x="19" y="36" width="5" height="16"/></g>
<line x1="38" y1="72" x2="38" y2="48" stroke="#3a6ed8" stroke-width="3.5"/><path d="M30,49 L46,49 L38,37 Z" fill="#3a6ed8"/>
<text x="0" y="102" text-anchor="middle" font-size="13">Kühler abheben</text>
</g>
<g transform="translate(222,0)">
<rect x="-18" y="36" width="10" height="9" fill="#3a6ed8"/>
<rect x="-25" y="44" width="24" height="40" rx="4" fill="#e3f2fd" stroke="#3a6ed8" stroke-width="2"/>
<path d="M4,62 Q14,56 24,62 T36,64 L34,84 Q24,78 14,84 T2,82 Z" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="0" y="102" text-anchor="middle" font-size="13">Isopropanol</text>
</g>
<g transform="translate(330,0)">
<rect x="-6" y="38" width="10" height="9" fill="#555"/>
<rect x="-14" y="46" width="26" height="38" rx="4" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<line x1="4" y1="42" x2="22" y2="42" stroke="#555" stroke-width="2.5"/>
<g fill="none" stroke="#3a6ed8" stroke-width="2"><circle cx="30" cy="42" r="4"/><circle cx="40" cy="38" r="3.5"/><circle cx="40" cy="48" r="3.5"/></g>
<text x="0" y="102" text-anchor="middle" font-size="13">Druckluft</text>
</g>
</g>

<!-- 5 Einsetzen -->
<g transform="translate(0,518)">
<rect x="48" y="0" width="344" height="110" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<circle cx="26" cy="18" r="16" fill="#3a6ed8"/><text x="26" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text>
<text x="62" y="26" font-size="17" font-weight="700">Einsetzen</text>
<g transform="translate(150,0)">
<rect x="-50" y="34" width="70" height="11" rx="2" fill="#555"/>
<path d="M-48,36 L-40,36 L-48,43 Z" fill="#E07B00"/>
<line x1="-15" y1="47" x2="-15" y2="56" stroke="#E07B00" stroke-width="3.5"/><path d="M-22,55 L-8,55 L-15,66 Z" fill="#E07B00"/>
<rect x="-56" y="68" width="82" height="16" rx="2" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<path d="M-53,71 L-45,71 L-53,78 Z" fill="#E07B00"/>
<line x1="-46" y1="45" x2="-50" y2="70" stroke="#E07B00" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="32" y1="82" x2="48" y2="50" stroke="#555" stroke-width="4" stroke-linecap="round"/>
<text x="56" y="62" font-size="13">Hebel</text>
<text x="-15" y="102" text-anchor="middle" font-size="13">Dreieck auf Markierung</text>
</g>
<text x="300" y="60" font-size="15" font-weight="700" fill="#E07B00" text-anchor="middle">senkrecht,</text>
<text x="300" y="80" font-size="15" font-weight="700" fill="#E07B00" text-anchor="middle">ohne Kraft</text>
</g>

<!-- 6 Schließen & testen -->
<g transform="translate(0,636)">
<rect x="48" y="0" width="344" height="110" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<circle cx="26" cy="18" r="16" fill="#3a6ed8"/><text x="26" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">6</text>
<text x="62" y="26" font-size="17" font-weight="700">Schließen &amp; testen</text>
<g transform="translate(108,0)">
<rect x="-18" y="36" width="36" height="48" rx="3" fill="#eceff1" stroke="#555" stroke-width="2"/>
<line x1="-10" y1="46" x2="10" y2="46" stroke="#555" stroke-width="2"/>
<circle cx="0" cy="70" r="4" fill="none" stroke="#555" stroke-width="2"/>
<text x="0" y="102" text-anchor="middle" font-size="13">Gehäuse zu</text>
</g>
<g transform="translate(222,0)">
<path d="M0,34 L0,42" stroke="#555" stroke-width="3"/>
<rect x="-10" y="42" width="20" height="24" rx="4" fill="#555"/>
<g stroke="#555" stroke-width="4"><line x1="-4" y1="66" x2="-4" y2="76"/><line x1="4" y1="66" x2="4" y2="76"/></g>
<text x="0" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#E07B00">Stecker zuletzt</text>
</g>
<g transform="translate(330,0)">
<rect x="-28" y="36" width="56" height="36" rx="3" fill="#fff" stroke="#555" stroke-width="2.5"/>
<line x1="0" y1="72" x2="0" y2="80" stroke="#555" stroke-width="3"/><line x1="-12" y1="82" x2="12" y2="82" stroke="#555" stroke-width="3"/>
<path d="M-11,54 L-3,62 L12,46" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="0" y="102" text-anchor="middle" font-size="13">Funktionstest</text>
</g>
</g>
</svg>
