<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, sans-serif" role="img">
  <title>Zwei Welten: Links PC und Laptop, darin stecken Prozessoren von Intel und AMD. Rechts Smartphone und Tablet, darin steckt ARM. ARM arbeitet mit wenigen, einfachen Befehlen (RISC, mehr in T03-7).</title>
  <rect width="400" height="300" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Wer steckt wo drin?</text>

  <!-- links PC und Laptop -->
  <rect x="10" y="44" width="184" height="196" rx="12" fill="#f5f8ff" stroke="#3a6ed8" stroke-width="2.5"/>
  <path d="M10,56 Q10,44 22,44 H102 V60 H10 Z" fill="#3a6ed8"/>
  <path d="M102,44 H182 Q194,44 194,56 V60 H102 Z" fill="#c62828"/>
  <text x="102" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#222">PC und Laptop</text>
  <!-- Turm -->
  <rect x="30" y="96" width="44" height="80" rx="4" fill="#9aa3ad" stroke="#5f6770" stroke-width="2"/>
  <rect x="38" y="106" width="28" height="6" rx="1" fill="#5f6770"/>
  <circle cx="52" cy="160" r="4" fill="#5f6770"/>
  <!-- Laptop -->
  <rect x="98" y="118" width="68" height="44" rx="3" fill="#333"/>
  <rect x="103" y="123" width="58" height="34" fill="#cfdcf7"/>
  <path d="M88,162 H176 L170,172 H94 Z" fill="#9aa3ad" stroke="#5f6770" stroke-width="1.5"/>
  <text x="102" y="214" text-anchor="middle" font-size="18" font-weight="700"><tspan fill="#3a6ed8">Intel</tspan><tspan fill="#222">, </tspan><tspan fill="#c62828">AMD</tspan></text>

  <!-- rechts Smartphone und Tablet -->
  <rect x="206" y="44" width="184" height="196" rx="12" fill="#f3faf5" stroke="#2f9e44" stroke-width="2.5"/>
  <path d="M206,56 Q206,44 218,44 H378 Q390,44 390,56 V60 H206 Z" fill="#2f9e44"/>
  <text x="298" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Smartphone und Tablet</text>
  <!-- Handy -->
  <rect x="232" y="104" width="38" height="70" rx="6" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <rect x="237" y="113" width="28" height="50" fill="#d3eedb"/>
  <circle cx="251" cy="168" r="2" fill="#333"/>
  <!-- Tablet -->
  <rect x="286" y="96" width="82" height="82" rx="7" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <rect x="293" y="104" width="68" height="64" fill="#d3eedb"/>
  <circle cx="327" cy="173" r="2" fill="#333"/>
  <text x="298" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#2f9e44">ARM</text>

  <!-- unter rechts -->
  <path d="M298,240 V252" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="298" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#222">wenige, einfache Befehle</text>
  <text x="298" y="291" text-anchor="middle" font-size="14" fill="#444">(RISC → T03-7)</text>
</svg>
