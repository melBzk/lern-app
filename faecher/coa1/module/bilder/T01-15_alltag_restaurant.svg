<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Alltagsvergleich Restaurant. Oben, morgens: Der Hausmeister mit Schlüsselbund schließt die Tür auf und macht das Licht an, das ist das BIOS. Darunter der Betrieb, von links nach rechts: Der Gast am Tisch bist du, die Speisekarte in seiner Hand ist die GUI. Die Kellnerin ist das Betriebssystem. Der Bestellzettel mit festen Feldern geht von der Kellnerin zum Koch, das ist die API: Er verbindet zwei Software-Teile. Der Koch ist das Programm. Der Herd ist die Hardware. Unten: Software sind Kellnerin, Bestellzettel und Koch; Hardware ist der Herd.</title>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="400" height="436" fill="#fff"/>

<!-- Morgens: Hausmeister -->
<rect x="8" y="8" width="384" height="138" rx="10" fill="#f6f2fb"/>
<text x="20" y="30" font-size="14" font-weight="700" fill="#6b4fa0">Morgens, vor dem Betrieb</text>
<rect x="24" y="44" width="50" height="94" fill="#c9a27a" stroke="#7a5a3a" stroke-width="2"/>
<circle cx="66" cy="94" r="3" fill="#7a5a3a"/>
<circle cx="110" cy="66" r="12" fill="#f1c9a5"/>
<rect x="96" y="80" width="28" height="56" rx="10" fill="#6b7280"/>
<circle cx="84" cy="98" r="6" fill="none" stroke="#b8862b" stroke-width="2.5"/>
<line x1="80" y1="103" x2="76" y2="113" stroke="#b8862b" stroke-width="3"/>
<line x1="86" y1="104" x2="88" y2="114" stroke="#b8862b" stroke-width="3"/>
<!-- Licht -->
<circle cx="168" cy="66" r="15" fill="#ffd84d" stroke="#b8862b" stroke-width="1.5"/>
<rect x="161" y="80" width="14" height="10" fill="#777"/>
<g stroke="#E07B00" stroke-width="2.5" stroke-linecap="round"><line x1="168" y1="44" x2="168" y2="38"/><line x1="148" y1="56" x2="142" y2="52"/><line x1="188" y1="56" x2="194" y2="52"/></g>
<text x="214" y="64" font-size="15" font-weight="700">Hausmeister</text>
<text x="214" y="84" font-size="13">schließt auf,</text>
<text x="214" y="100" font-size="13">macht Licht an</text>
<rect x="214" y="110" width="70" height="26" rx="13" fill="#6b4fa0"/>
<text x="249" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">BIOS</text>

<!-- Betrieb -->
<text x="20" y="172" font-size="14" font-weight="700" fill="#555">Danach, im Betrieb</text>

<!-- Gast -->
<circle cx="40" cy="232" r="12" fill="#f1c9a5"/>
<rect x="26" y="246" width="28" height="44" rx="10" fill="#3a6ed8"/>
<rect x="6" y="290" width="80" height="8" fill="#8b6b4a"/>
<rect x="12" y="298" width="6" height="22" fill="#8b6b4a"/><rect x="74" y="298" width="6" height="22" fill="#8b6b4a"/>
<!-- Speisekarte -->
<rect x="56" y="236" width="24" height="36" rx="2" fill="#fff" stroke="#E07B00" stroke-width="2"/>
<g stroke="#999" stroke-width="1.5"><line x1="60" y1="246" x2="76" y2="246"/><line x1="60" y1="253" x2="76" y2="253"/><line x1="60" y1="260" x2="72" y2="260"/></g>
<text x="56" y="218" text-anchor="middle" font-size="12">Speisekarte</text>
<rect x="32" y="182" width="48" height="22" rx="11" fill="#E07B00"/>
<text x="56" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">GUI</text>
<text x="44" y="342" text-anchor="middle" font-size="14" font-weight="700">Gast</text>
<rect x="20" y="352" width="48" height="24" rx="12" fill="#3a6ed8"/>
<text x="44" y="369" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Du</text>

<!-- Kellnerin -->
<circle cx="132" cy="232" r="12" fill="#f1c9a5"/>
<path d="M120,246 h24 l10,74 h-44 z" fill="#2f6b4f"/>
<text x="132" y="342" text-anchor="middle" font-size="14" font-weight="700">Kellnerin</text>
<rect x="78" y="352" width="108" height="24" rx="12" fill="#2f6b4f"/>
<text x="132" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Betriebssystem</text>

<!-- Bestellzettel -->
<line x1="156" y1="262" x2="176" y2="262" stroke="#333" stroke-width="2.5" marker-end="url(#ad)"/>
<rect x="180" y="236" width="36" height="52" rx="2" fill="#fff" stroke="#333" stroke-width="2"/>
<g fill="none" stroke="#3a6ed8" stroke-width="1.5"><rect x="185" y="243" width="26" height="9"/><rect x="185" y="257" width="26" height="9"/><rect x="185" y="271" width="26" height="9"/></g>
<line x1="220" y1="262" x2="244" y2="262" stroke="#333" stroke-width="2.5" marker-end="url(#ad)"/>
<text x="198" y="218" text-anchor="middle" font-size="12">Bestellzettel</text>
<rect x="174" y="182" width="48" height="22" rx="11" fill="#E07B00"/>
<text x="198" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">API</text>

<!-- Koch -->
<circle cx="270" cy="232" r="11" fill="#f1c9a5"/>
<path d="M259,222 a11,9 0 0 1 22,0 z" fill="#fff" stroke="#999"/>
<rect x="256" y="244" width="28" height="56" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/>
<g fill="#999"><circle cx="270" cy="256" r="2"/><circle cx="270" cy="266" r="2"/><circle cx="270" cy="276" r="2"/></g>
<text x="270" y="342" text-anchor="middle" font-size="14" font-weight="700">Koch</text>
<rect x="232" y="352" width="76" height="24" rx="12" fill="#a85a00"/>
<text x="270" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Programm</text>

<!-- Herd -->
<rect x="312" y="264" width="80" height="56" rx="3" fill="#e5e7eb" stroke="#555" stroke-width="2"/>
<rect x="322" y="252" width="30" height="12" rx="2" fill="#555"/>
<rect x="322" y="282" width="60" height="28" rx="2" fill="#9aa3ad"/>
<g fill="#555"><circle cx="324" cy="273" r="3"/><circle cx="336" cy="273" r="3"/></g>
<text x="352" y="342" text-anchor="middle" font-size="14" font-weight="700">Herd</text>
<rect x="314" y="352" width="76" height="24" rx="12" fill="#555"/>
<text x="352" y="369" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Hardware</text>

<!-- Software-Klammer -->
<path d="M80,388 v6 H306 v-6" fill="none" stroke="#a85a00" stroke-width="2"/>
<text x="193" y="412" text-anchor="middle" font-size="13">Software: Kellnerin, Bestellzettel, Koch</text>
<text x="200" y="430" text-anchor="middle" font-size="13">Der Bestellzettel (API) verbindet zwei Software-Teile.</text>
</svg>
