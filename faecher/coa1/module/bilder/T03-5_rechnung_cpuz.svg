<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Schematisch nachgezeichneter Ausschnitt eines Info-Fensters, Bereich Clocks: Core Speed 3092,44 MHz, Multiplier x31,0 (4,0 – 46,0), Bus Speed 99,76 MHz. Pfeile von Bus Speed und Multiplier zur Rechnung 99,76 MHz mal 31 gleich 3092,56 MHz, ungefähr 3,09 GHz. Von dort ein Pfeil zurück zu Core Speed: passt, der kleine Unterschied kommt von der Rundung.</title>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="24" font-size="17" text-anchor="middle" font-weight="700">Nachrechnen: Takt im Info-Programm</text>

<!-- Fenster (schematisch) -->
<rect x="28" y="40" width="344" height="180" rx="6" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
<rect x="28" y="40" width="344" height="26" rx="6" fill="#d9d9d9"/>
<rect x="28" y="58" width="344" height="8" fill="#d9d9d9"/>
<text x="40" y="58" font-size="13" fill="#444">CPU-Z (schematisch nachgezeichnet)</text>
<rect x="38" y="84" width="324" height="126" rx="4" fill="none" stroke="#aaa" stroke-width="1.5"/>
<rect x="46" y="76" width="56" height="16" fill="#f4f1ee"/>
<text x="50" y="89" font-size="14" font-weight="700">Clocks</text>

<text x="48" y="120" font-size="14" font-weight="700" fill="#c25e00">Core Speed</text>
<rect x="150" y="102" width="202" height="26" rx="3" fill="#fff" stroke="#E07B00" stroke-width="2"/>
<text x="251" y="120" font-size="15" text-anchor="middle" font-weight="700">3092,44 MHz</text>

<text x="48" y="154" font-size="14" font-weight="700" fill="#7b3fa0">Multiplier</text>
<rect x="150" y="136" width="202" height="26" rx="3" fill="#fff" stroke="#7b3fa0" stroke-width="2"/>
<text x="251" y="154" font-size="15" text-anchor="middle" font-weight="700">x31,0 (4,0 – 46,0)</text>

<text x="48" y="188" font-size="14" font-weight="700" fill="#3a6ed8">Bus Speed</text>
<rect x="150" y="170" width="202" height="26" rx="3" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="251" y="188" font-size="15" text-anchor="middle" font-weight="700">99,76 MHz</text>

<!-- Pfeile in die Rechnung -->
<line x1="230" y1="198" x2="230" y2="266" stroke="#3a6ed8" stroke-width="3" marker-end="url(#b)"/>
<path d="M352,149 L388,149 L388,300 L362,300" fill="none" stroke="#7b3fa0" stroke-width="3" marker-end="url(#p)"/>

<!-- Rechnung -->
<rect x="40" y="270" width="320" height="76" rx="10" fill="#fdf0e0" stroke="#E07B00" stroke-width="2.5"/>
<text x="186" y="298" font-size="17" text-anchor="end" font-weight="700" fill="#3a6ed8">99,76 MHz</text>
<text x="200" y="298" font-size="17" text-anchor="middle" font-weight="700">×</text>
<text x="214" y="298" font-size="17" font-weight="700" fill="#7b3fa0">31</text>
<text x="200" y="330" font-size="16" text-anchor="middle" font-weight="700" fill="#c25e00">= 3092,56 MHz ≈ 3,09 GHz</text>

<!-- Pfeil zurück zu Core Speed -->
<path d="M40,308 L12,308 L12,115 L44,115" fill="none" stroke="#2f9e44" stroke-width="3" marker-end="url(#g)"/>
<text x="24" y="246" font-size="15" font-weight="700" fill="#2f9e44">passt</text>
<text x="24" y="264" font-size="13" fill="#2f9e44">(Rundung)</text>
<text x="200" y="370" font-size="13" text-anchor="middle" fill="#555">Bustakt × Multiplikator = CPU-Takt</text>
</svg>
