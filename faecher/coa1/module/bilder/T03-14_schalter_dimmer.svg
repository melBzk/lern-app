<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Zwei Wandschalter. Links ein Kippschalter mit nur zwei Stellungen: AN gleich 1, AUS gleich 0. Darunter: digital, wie ein Transistor. Rechts ein Drehdimmer mit stufenloser Skala von dunkel bis hell, die Lampe darüber leuchtet halb. Am Zeiger zittert es leicht: Rauschen, nie ganz genau. Darunter: analog, wie der Licht-Chip.</title>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Schalter oder Dimmer?</text>

<!-- links: Kippschalter -->
<text x="100" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">AN = 1</text>
<rect x="45" y="92" width="110" height="160" rx="12" fill="#f4f5f7" stroke="#555" stroke-width="2.5"/>
<rect x="78" y="118" width="44" height="108" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="80" y="120" width="40" height="52" rx="5" fill="#3a6ed8"/>
<line x1="78" y1="172" x2="122" y2="172" stroke="#555" stroke-width="2"/>
<text x="100" y="274" text-anchor="middle" font-size="15" font-weight="700" fill="#555">AUS = 0</text>
<text x="100" y="330" text-anchor="middle" font-size="15" font-weight="700">digital:</text>
<text x="100" y="350" text-anchor="middle" font-size="15">Transistor</text>

<!-- rechts: Dimmer -->
<g stroke="#E0A800" stroke-width="2" stroke-linecap="round">
<path d="M300,44 V38 M318,50 L323,46 M282,50 L277,46"/>
</g>
<circle cx="300" cy="66" r="15" fill="#ffe8a3" stroke="#555" stroke-width="2"/>
<rect x="294" y="80" width="12" height="8" fill="#9aa5b1"/>
<rect x="245" y="96" width="110" height="156" rx="12" fill="#f4f5f7" stroke="#555" stroke-width="2.5"/>
<g stroke-width="7" stroke-linecap="round" fill="none">
<path d="M266,198 A44,44 0 0 1 258,172" stroke="#343a40"/>
<path d="M258,163 A44,44 0 0 1 266,142" stroke="#6c6f73"/>
<path d="M272,135 A44,44 0 0 1 291,126" stroke="#a6a07a"/>
<path d="M300,125 A44,44 0 0 1 320,129" stroke="#e8c547"/>
<path d="M328,135 A44,44 0 0 1 342,155" stroke="#ffd43b"/>
<path d="M344,165 A44,44 0 0 1 334,198" stroke="#ffe066"/>
</g>
<circle cx="300" cy="168" r="28" fill="#fff" stroke="#555" stroke-width="2"/>
<line x1="300" y1="168" x2="300" y2="146" stroke="#222" stroke-width="4" stroke-linecap="round"/>
<path d="M288,141 q-5,6 0,12 M312,141 q5,6 0,12" stroke="#E07B00" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="268" y="236" text-anchor="middle" font-size="13" fill="#555">dunkel</text>
<text x="334" y="236" text-anchor="middle" font-size="13" fill="#555">hell</text>
<text x="300" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">Rauschen:</text>
<text x="300" y="292" text-anchor="middle" font-size="14" fill="#E07B00">nie ganz genau</text>
<text x="300" y="330" text-anchor="middle" font-size="15" font-weight="700">analog:</text>
<text x="300" y="350" text-anchor="middle" font-size="15">Licht-Chip</text>
</svg>
