<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 458" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fünf Merksätze mit Symbol. Host ist der echte Rechner, VMs sind Gäste mit eigenem Betriebssystem. Der Hypervisor verwaltet die VMs: Typ 1 direkt auf der Hardware, Typ 2 als Programm im Betriebssystem. VT-x bzw. AMD-V im Prozessor, evtl. im BIOS/UEFI einschalten, Kontrolle im Task-Manager. RAM und Kerne zuteilen, nie mehr als der Host hat. Prüfpunkt: sichern, testen, bei Fehler zurücksetzen.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="458" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Merke</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="18.0" y="60.8" width="60" height="37.2" rx="4" fill="#333" stroke="#333" stroke-width="1"/><rect x="22.0" y="64.8" width="52" height="29.200000000000003" rx="2" fill="#eef2f7" stroke="none" stroke-width="0"/><path d="M10.0,106.0 L18.0,98.0 L78.0,98.0 L86.0,106.0 Z" fill="#9aa3ad" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="66.0" width="36" height="22" rx="2" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/><rect x="30" y="66.0" width="36" height="6" rx="1" fill="#2f6b4f" stroke="none" stroke-width="0"/>
<text x="100" y="82.0" font-size="15" font-weight="700" fill="#1d3f8a">Host = echt, VM = Gast</text>
<text x="100" y="103.0" font-size="14">VMs mit eigenem Betriebssystem</text>
<line x1="15" y1="126" x2="385" y2="126" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="146.0" width="26" height="12" rx="2" fill="#f2c230" stroke="#a07800" stroke-width="1.2"/><rect x="18" y="160.0" width="26" height="12" rx="2" fill="#9aa3ad" stroke="#555" stroke-width="1.2"/><text x="31" y="188.0" font-size="13" text-anchor="middle" font-weight="700">1</text><rect x="52" y="140.0" width="26" height="10" rx="2" fill="#f2c230" stroke="#a07800" stroke-width="1.2"/><rect x="52" y="152.0" width="26" height="10" rx="2" fill="#cfe0fb" stroke="#3a6ed8" stroke-width="1.2"/><rect x="52" y="164.0" width="26" height="10" rx="2" fill="#9aa3ad" stroke="#555" stroke-width="1.2"/><text x="65" y="188.0" font-size="13" text-anchor="middle" font-weight="700">2</text>
<text x="100" y="154.0" font-size="15" font-weight="700" fill="#1d3f8a">Hypervisor verwaltet VMs</text>
<text x="100" y="174.0" font-size="14">Typ 1 direkt auf der Hardware,</text>
<text x="100" y="192.0" font-size="14">Typ 2 als Programm im Betriebssystem</text>
<line x1="15" y1="206" x2="385" y2="206" stroke="#ddd" stroke-width="1"/>
<line x1="37.2" y1="223.0" x2="37.2" y2="228.0" stroke="#888" stroke-width="2"/><line x1="37.2" y1="264.0" x2="37.2" y2="269.0" stroke="#888" stroke-width="2"/><line x1="25" y1="235.2" x2="30" y2="235.2" stroke="#888" stroke-width="2"/><line x1="66" y1="235.2" x2="71" y2="235.2" stroke="#888" stroke-width="2"/><line x1="44.4" y1="223.0" x2="44.4" y2="228.0" stroke="#888" stroke-width="2"/><line x1="44.4" y1="264.0" x2="44.4" y2="269.0" stroke="#888" stroke-width="2"/><line x1="25" y1="242.4" x2="30" y2="242.4" stroke="#888" stroke-width="2"/><line x1="66" y1="242.4" x2="71" y2="242.4" stroke="#888" stroke-width="2"/><line x1="51.6" y1="223.0" x2="51.6" y2="228.0" stroke="#888" stroke-width="2"/><line x1="51.6" y1="264.0" x2="51.6" y2="269.0" stroke="#888" stroke-width="2"/><line x1="25" y1="249.6" x2="30" y2="249.6" stroke="#888" stroke-width="2"/><line x1="66" y1="249.6" x2="71" y2="249.6" stroke="#888" stroke-width="2"/><line x1="58.8" y1="223.0" x2="58.8" y2="228.0" stroke="#888" stroke-width="2"/><line x1="58.8" y1="264.0" x2="58.8" y2="269.0" stroke="#888" stroke-width="2"/><line x1="25" y1="256.8" x2="30" y2="256.8" stroke="#888" stroke-width="2"/><line x1="66" y1="256.8" x2="71" y2="256.8" stroke="#888" stroke-width="2"/><rect x="30" y="228.0" width="36" height="36" rx="3" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><text x="48" y="251.0" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">VT</text>
<text x="100" y="234.0" font-size="15" font-weight="700" fill="#1d3f8a">VT-x / AMD-V</text>
<text x="100" y="254.0" font-size="14">evtl. im BIOS/UEFI einschalten,</text>
<text x="100" y="272.0" font-size="14">Kontrolle im Task-Manager</text>
<line x1="15" y1="286" x2="385" y2="286" stroke="#ddd" stroke-width="1"/>
<rect x="20.0" y="311.0" width="56" height="18" rx="2" fill="#2f6b4f" stroke="#222" stroke-width="1.5"/><rect x="25.0" y="315.0" width="7.5" height="8" rx="1" fill="#222" stroke="none" stroke-width="0"/><rect x="36.5" y="315.0" width="7.5" height="8" rx="1" fill="#222" stroke="none" stroke-width="0"/><rect x="48.0" y="315.0" width="7.5" height="8" rx="1" fill="#222" stroke="none" stroke-width="0"/><rect x="59.5" y="315.0" width="7.5" height="8" rx="1" fill="#222" stroke="none" stroke-width="0"/><line x1="24.0" y1="329.0" x2="24.0" y2="333.0" stroke="#c9a227" stroke-width="2"/><line x1="30.857142857142858" y1="329.0" x2="30.857142857142858" y2="333.0" stroke="#c9a227" stroke-width="2"/><line x1="37.714285714285715" y1="329.0" x2="37.714285714285715" y2="333.0" stroke="#c9a227" stroke-width="2"/><line x1="44.57142857142857" y1="329.0" x2="44.57142857142857" y2="333.0" stroke="#c9a227" stroke-width="2"/><line x1="51.42857142857143" y1="329.0" x2="51.42857142857143" y2="333.0" stroke="#c9a227" stroke-width="2"/><line x1="58.285714285714285" y1="329.0" x2="58.285714285714285" y2="333.0" stroke="#c9a227" stroke-width="2"/><line x1="65.14285714285714" y1="329.0" x2="65.14285714285714" y2="333.0" stroke="#c9a227" stroke-width="2"/><line x1="72.0" y1="329.0" x2="72.0" y2="333.0" stroke="#c9a227" stroke-width="2"/><text x="48" y="348.0" font-size="13" text-anchor="middle" font-weight="700" fill="#c62828">≤ Host</text>
<text x="100" y="322.0" font-size="15" font-weight="700" fill="#c62828">RAM und Kerne zuteilen</text>
<text x="100" y="343.0" font-size="14">nie mehr, als der Host hat</text>
<line x1="15" y1="366" x2="385" y2="366" stroke="#ddd" stroke-width="1"/>
<line x1="34" y1="386.0" x2="34" y2="426.0" stroke="#333" stroke-width="2.5"/><path d="M34,386.0 h22 l-6,7 l6,7 h-22 Z" fill="#2f6b4f" stroke="#2f6b4f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M70,410.0 A12,12 0 1 0 58,422.0" fill="none" stroke="#E07B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="422.0" x2="54" y2="422.0" stroke="#E07B00" stroke-width="2" marker-end="url(#o)"/>
<text x="100" y="402.0" font-size="15" font-weight="700" fill="#2f6b4f">Prüfpunkt</text>
<text x="100" y="423.0" font-size="14">sichern → testen → bei Fehler zurück</text>
<line x1="15" y1="446" x2="385" y2="446" stroke="#ddd" stroke-width="1"/>
</svg>
