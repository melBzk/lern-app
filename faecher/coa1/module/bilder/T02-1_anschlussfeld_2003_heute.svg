<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" font-family="system-ui, sans-serif">
  <title>Zwei Anschlussfelder im Vergleich. Board von 2003: PS/2, Parallel (Drucker), Seriell, S/PDIF, 4 mal USB, RJ45, Ton-Klinken. Aktuelles Board: Kombi-PS/2, VGA, DVI, HDMI, DisplayPort, S/PDIF optisch, USB 2.0 rot, USB 3.x blau, FireWire, eSATA, RJ45 (LAN), Ton-Klinken. Ein Grabstein markiert veraltete Buchsen: Parallel, Seriell, PS/2, VGA, FireWire, eSATA. Ein Zeitpfeil rechts läuft von steinalt nach aktuell.</title>
  <defs>
    <path id="grab" d="M0,16 V6 A6,6 0 0 1 12,6 V16 Z" fill="#7a7a7a" stroke="#fff" stroke-width="1"/>
    <marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D4607A"/>
    </marker>
  </defs>
  <rect width="400" height="510" fill="#fff"/>
  <text x="184" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Anschlussfeld: früher und heute</text>

  <!-- ===== Board 2003 ===== -->
  <rect x="8" y="42" width="352" height="172" rx="10" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
  <text x="18" y="64" font-size="15" font-weight="700" fill="#555">Board von 2003</text>

  <!-- Spalte links -->
  <!-- PS/2 -->
  <circle cx="30" cy="92" r="9" fill="#3fa34d"/>
  <circle cx="52" cy="92" r="9" fill="#8e5cc4"/>
  <use href="#grab" x="56" y="72"/>
  <text x="74" y="97" font-size="13" fill="#222">PS/2</text>
  <!-- Parallel -->
  <path d="M18,117 H62 L58,131 H22 Z" fill="#b07cc6" stroke="#6b4196"/>
  <use href="#grab" x="56" y="106"/>
  <text x="74" y="129" font-size="13" fill="#222">Parallel (Drucker)</text>
  <!-- Seriell -->
  <path d="M24,149 H56 L53,163 H27 Z" fill="#4c9a9a" stroke="#2f6b6b"/>
  <use href="#grab" x="56" y="138"/>
  <text x="74" y="161" font-size="13" fill="#222">Seriell</text>
  <!-- S/PDIF -->
  <circle cx="30" cy="188" r="7" fill="#f0932b"/><circle cx="30" cy="188" r="2.5" fill="#222"/>
  <rect x="44" y="181" width="14" height="14" fill="#333"/>
  <text x="74" y="193" font-size="13" fill="#222">S/PDIF</text>

  <!-- Spalte rechts -->
  <!-- 4x USB -->
  <rect x="196" y="80" width="30" height="10" fill="#fff" stroke="#555"/>
  <rect x="196" y="94" width="30" height="10" fill="#fff" stroke="#555"/>
  <rect x="200" y="83" width="22" height="3" fill="#555"/>
  <rect x="200" y="97" width="22" height="3" fill="#555"/>
  <text x="246" y="97" font-size="13" fill="#222">4× USB</text>
  <!-- RJ45 -->
  <rect x="199" y="116" width="24" height="20" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="206" y="131" width="10" height="5" fill="#555"/>
  <text x="246" y="129" font-size="13" fill="#222">RJ45</text>
  <!-- Klinken (Anzahl im Buchfoto nicht sicher zählbar) -->
  <circle cx="200" cy="160" r="6" fill="#6aa8e0"/>
  <circle cx="214" cy="160" r="6" fill="#7cbf3f"/>
  <circle cx="228" cy="160" r="6" fill="#e58fb0"/>
  <text x="246" y="165" font-size="13" fill="#222">Klinken (Ton)</text>

  <!-- ===== aktuelles Board ===== -->
  <rect x="8" y="228" width="352" height="236" rx="10" fill="#eef4ff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="18" y="250" font-size="15" font-weight="700" fill="#3a6ed8">aktuelles Board</text>

  <!-- Spalte links -->
  <!-- Kombi-PS/2 -->
  <path d="M40,265 A11,11 0 0 0 40,287 Z" fill="#3fa34d"/>
  <path d="M40,265 A11,11 0 0 1 40,287 Z" fill="#8e5cc4"/>
  <use href="#grab" x="56" y="258"/>
  <text x="74" y="281" font-size="13" fill="#222">Kombi-PS/2</text>
  <!-- VGA -->
  <path d="M22,300 H58 L54,316 H26 Z" fill="#3a6ed8"/>
  <use href="#grab" x="56" y="290"/>
  <text x="74" y="313" font-size="13" fill="#222">VGA (analog)</text>
  <!-- DVI -->
  <rect x="18" y="333" width="44" height="14" fill="#fff" stroke="#555"/>
  <text x="74" y="345" font-size="13" fill="#222">DVI</text>
  <!-- HDMI -->
  <path d="M24,365 H56 V374 L52,379 H28 L24,374 Z" fill="#333"/>
  <text x="74" y="377" font-size="13" fill="#222">HDMI</text>
  <!-- DisplayPort -->
  <path d="M24,397 H56 V411 H30 L24,405 Z" fill="#333"/>
  <text x="74" y="409" font-size="13" fill="#222">DisplayPort</text>
  <!-- S/PDIF optisch -->
  <rect x="31" y="428" width="18" height="16" fill="#333"/>
  <circle cx="40" cy="436" r="3.5" fill="#e03030"/>
  <text x="74" y="441" font-size="13" fill="#222">S/PDIF optisch</text>

  <!-- Spalte rechts -->
  <!-- USB 2.0 rot -->
  <rect x="196" y="268" width="30" height="12" fill="#fff" stroke="#555"/>
  <rect x="200" y="271" width="22" height="4" fill="#d43c3c"/>
  <text x="246" y="281" font-size="13" fill="#222">USB 2.0 (rot)</text>
  <!-- USB 3.x blau -->
  <rect x="196" y="300" width="30" height="12" fill="#fff" stroke="#555"/>
  <rect x="200" y="303" width="22" height="4" fill="#3a6ed8"/>
  <text x="246" y="313" font-size="13" fill="#222">USB 3.x (blau)</text>
  <!-- FireWire -->
  <path d="M198,334 H218 A6,6 0 0 1 218,346 H198 Z" fill="#999" stroke="#555"/>
  <use href="#grab" x="228" y="322"/>
  <text x="246" y="345" font-size="13" fill="#222">FireWire</text>
  <!-- eSATA -->
  <path d="M195,368 H227 V376 H224 V378 H198 V376 H195 Z" fill="#d43c3c" stroke="#9b2525"/>
  <use href="#grab" x="228" y="354"/>
  <text x="246" y="377" font-size="13" fill="#222">eSATA</text>
  <!-- RJ45 -->
  <rect x="199" y="396" width="24" height="20" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="206" y="411" width="10" height="5" fill="#555"/>
  <text x="246" y="409" font-size="13" fill="#222">RJ45 (LAN)</text>
  <!-- Klinken -->
  <circle cx="200" cy="430" r="5" fill="#f0932b"/>
  <circle cx="213" cy="430" r="5" fill="#6aa8e0"/>
  <circle cx="226" cy="430" r="5" fill="#222"/>
  <circle cx="200" cy="443" r="5" fill="#7cbf3f"/>
  <circle cx="213" cy="443" r="5" fill="#999"/>
  <circle cx="226" cy="443" r="5" fill="#e58fb0"/>
  <text x="246" y="441" font-size="13" fill="#222">Klinken (Ton)</text>

  <!-- Zeitpfeil -->
  <line x1="368" y1="46" x2="368" y2="456" stroke="#D4607A" stroke-width="3" marker-end="url(#spitze)"/>
  <text transform="translate(376,128) rotate(90)" text-anchor="middle" font-size="13" font-weight="700" fill="#555">steinalt</text>
  <text transform="translate(376,346) rotate(90)" text-anchor="middle" font-size="13" font-weight="700" fill="#D4607A">aktuell</text>

  <!-- Erklärung Grabstein -->
  <use href="#grab" x="18" y="478"/>
  <text x="38" y="492" font-size="13" fill="#222">= veraltet, auf neuen Boards selten oder weg</text>
</svg>
