<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Links der RAM mit Zugriff in Nanosekunden, rechts die Festplatte mit Millisekunden. Pfeil aus: auslagern zur Festplatte, Pfeil ein: zurück in den RAM. Die Speicherverwaltung von Windows entscheidet und verschiebt die Seiten. Rot: RAM dauernd voll, ständig hin und her. Grün: möglichst viel echten RAM einbauen.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="378" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Der Haken: viel langsamer</text>
<rect x="14" y="44" width="150" height="96" rx="10" fill="#dcefe4" stroke="#2f6b4f" stroke-width="2"/>
<rect x="49.0" y="64.0" width="80" height="24" rx="2" fill="#2f6b4f" stroke="#222" stroke-width="1.5"/><rect x="54.0" y="68.0" width="13.5" height="14" rx="1" fill="#222" stroke="none" stroke-width="0"/><rect x="71.5" y="68.0" width="13.5" height="14" rx="1" fill="#222" stroke="none" stroke-width="0"/><rect x="89.0" y="68.0" width="13.5" height="14" rx="1" fill="#222" stroke="none" stroke-width="0"/><rect x="106.5" y="68.0" width="13.5" height="14" rx="1" fill="#222" stroke="none" stroke-width="0"/><line x1="53.0" y1="88.0" x2="53.0" y2="92.0" stroke="#c9a227" stroke-width="2"/><line x1="63.285714285714285" y1="88.0" x2="63.285714285714285" y2="92.0" stroke="#c9a227" stroke-width="2"/><line x1="73.57142857142857" y1="88.0" x2="73.57142857142857" y2="92.0" stroke="#c9a227" stroke-width="2"/><line x1="83.85714285714286" y1="88.0" x2="83.85714285714286" y2="92.0" stroke="#c9a227" stroke-width="2"/><line x1="94.14285714285714" y1="88.0" x2="94.14285714285714" y2="92.0" stroke="#c9a227" stroke-width="2"/><line x1="104.42857142857143" y1="88.0" x2="104.42857142857143" y2="92.0" stroke="#c9a227" stroke-width="2"/><line x1="114.71428571428572" y1="88.0" x2="114.71428571428572" y2="92.0" stroke="#c9a227" stroke-width="2"/><line x1="125.0" y1="88.0" x2="125.0" y2="92.0" stroke="#c9a227" stroke-width="2"/>
<text x="89" y="116" font-size="15" text-anchor="middle" font-weight="700" fill="#2f6b4f">RAM</text>
<text x="89" y="134" font-size="14" text-anchor="middle" font-weight="700">Nanosekunden</text>
<rect x="236" y="44" width="150" height="96" rx="10" fill="#f1f3f5" stroke="#555" stroke-width="2"/>
<rect x="281.0" y="57.0" width="60" height="38" rx="4" fill="#cfd6de" stroke="#555" stroke-width="1.5"/><circle cx="308" cy="76" r="12.16" fill="#eef1f4" stroke="#555" stroke-width="1.5"/><circle cx="308" cy="76" r="2.5" fill="#555" stroke="none" stroke-width="2"/><line x1="317.0" y1="87.4" x2="333.8" y2="68.4" stroke="#555" stroke-width="2"/>
<text x="311" y="116" font-size="15" text-anchor="middle" font-weight="700" fill="#333">Festplatte</text>
<text x="311" y="134" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">Millisekunden</text>
<line x1="168" y1="74" x2="230" y2="74" stroke="#E07B00" stroke-width="3" marker-end="url(#o)"/>
<line x1="230" y1="104" x2="168" y2="104" stroke="#3a6ed8" stroke-width="3" marker-end="url(#b)"/>
<text x="200" y="66" font-size="13" text-anchor="middle" font-weight="700" fill="#a85a00">aus</text>
<text x="200" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#2f5fb3">ein</text>
<rect x="70" y="160" width="260" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="200" y="185" font-size="14" text-anchor="middle" font-weight="700">Speicherverwaltung von Windows</text>
<text x="200" y="220" font-size="13" text-anchor="middle" fill="#444">entscheidet und verschiebt die Seiten</text>
<rect x="14" y="238" width="372" height="62" rx="8" fill="#f9dcdc" stroke="#c62828" stroke-width="2"/>
<text x="200" y="262" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">RAM dauernd voll →</text>
<text x="200" y="284" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">ständig hin und her</text>
<rect x="14" y="314" width="372" height="50" rx="8" fill="#dcefe4" stroke="#2f6b4f" stroke-width="2"/>
<circle cx="40" cy="339" r="11" fill="#2f6b4f" stroke="none" stroke-width="2"/><path d="M35.05,339 l3.52,3.96 l7.04,-7.92" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="344" font-size="15" font-weight="700" fill="#2f6b4f">möglichst viel echten RAM einbauen</text>
</svg>
