<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" fill="#222">
<title>Support-Szene als Ablauf: Ein Kollege ruft „Der neue Arbeitsspeicher wird nicht erkannt.“ Dann vier Schritte: 1. Handbuch des Boards holen. 2. PC vom Strom trennen. 3. Dich statisch entladen. 4. Erst jetzt den PC öffnen.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Ein Fall aus dem Support</text>
<rect x="20" y="46" width="360" height="52" rx="14" fill="#fff3c4" stroke="#c99a06" stroke-width="1.5"/>
<text x="200" y="78" text-anchor="middle" font-size="15" font-weight="700">„Neuer RAM wird nicht erkannt!“</text>
<g fill="#f4f1ee"><rect x="10" y="112" width="380" height="64" rx="10"/><rect x="10" y="184" width="380" height="64" rx="10"/><rect x="10" y="256" width="380" height="64" rx="10"/><rect x="10" y="328" width="380" height="64" rx="10"/></g>
<g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="34" cy="144" r="14" fill="#D4607A"/><text x="34" y="149">1</text>
<circle cx="34" cy="216" r="14" fill="#D4607A"/><text x="34" y="221">2</text>
<circle cx="34" cy="288" r="14" fill="#D4607A"/><text x="34" y="293">3</text>
<circle cx="34" cy="360" r="14" fill="#D4607A"/><text x="34" y="365">4</text>
</g>
<!-- 1 Handbuch -->
<rect x="62" y="124" width="30" height="40" rx="2" fill="#fff" stroke="#333" stroke-width="2"/>
<g stroke="#999" stroke-width="2"><line x1="68" y1="134" x2="86" y2="134"/><line x1="68" y1="142" x2="86" y2="142"/><line x1="68" y1="150" x2="86" y2="150"/></g>
<text x="110" y="150" font-size="15" font-weight="700">Handbuch des Boards holen</text>
<!-- 2 Stecker -->
<rect x="60" y="198" width="20" height="30" rx="4" fill="#333"/>
<line x1="80" y1="213" x2="88" y2="213" stroke="#333" stroke-width="4"/>
<line x1="86" y1="200" x2="96" y2="226" stroke="#d43c3c" stroke-width="3"/>
<text x="110" y="222" font-size="15" font-weight="700">vom Strom trennen</text>
<!-- 3 entladen -->
<rect x="60" y="268" width="34" height="40" fill="#b0bec5" stroke="#607d8b" stroke-width="2"/>
<polygon points="86,262 78,278 84,278 79,292 94,274 87,274 92,262" fill="#D4607A"/>
<text x="110" y="294" font-size="15" font-weight="700">statisch entladen</text>
<!-- 4 oeffnen -->
<rect x="62" y="338" width="30" height="44" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
<path d="M92,340 L100,346 L100,376 L92,380" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
<text x="110" y="366" font-size="15" font-weight="700">erst jetzt öffnen</text>
</svg>
