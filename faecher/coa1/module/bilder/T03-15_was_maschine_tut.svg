<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Vier Bilder wie ein Comic, Wafer jeweils von der Seite. 1 Der Wafer bekommt eine glänzende, lichtempfindliche Schicht. 2 Belichten: Das Licht überträgt das Muster der Maske auf die Schicht; bei EUV wird es dafür an der Maske gespiegelt. 3 Das belichtete Muster ist sichtbar, das Muster ist übertragen. 4 Ein Stapel aus vielen Schichten: Schicht für Schicht wiederholen.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Was die Maschine tut</text>

<!-- 1 -->
<rect x="10" y="40" width="185" height="180" rx="10" fill="#f4f5f7"/>
<circle cx="30" cy="60" r="12" fill="#3a6ed8"/><text x="30" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<rect x="32" y="140" width="140" height="26" fill="#cfd6dd" stroke="#555" stroke-width="1.5"/>
<rect x="32" y="130" width="140" height="10" fill="#f6d365" stroke="#b8860b" stroke-width="1"/>
<text x="102" y="192" text-anchor="middle" font-size="14" font-weight="700">lichtempfindlich</text>
<text x="102" y="210" text-anchor="middle" font-size="14" font-weight="700">beschichten</text>

<!-- 2 -->
<rect x="205" y="40" width="185" height="180" rx="10" fill="#f4f5f7"/>
<circle cx="225" cy="60" r="12" fill="#3a6ed8"/><text x="225" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<!-- Maske = Spiegel mit Muster, oben, Spiegelseite unten -->
<rect x="256" y="64" width="80" height="10" fill="#333"/>
<g fill="#cfd6dd"><rect x="262" y="72" width="12" height="3"/><rect x="284" y="72" width="12" height="3"/><rect x="308" y="72" width="12" height="3"/></g>
<text x="346" y="66" font-size="13" font-weight="700">Maske</text>
<!-- EUV kommt schräg von links unten -->
<path d="M256,75 L336,75 L311,117 L231,117 Z" fill="#b197fc" opacity="0.4"/>
<path d="M232,113 L250,83" stroke="#7b3fc4" stroke-width="3"/><path d="M244,82 L254,76 L254,88 Z" fill="#7b3fc4" transform="rotate(-1 250 82)"/>
<text x="214" y="104" font-size="13" font-weight="700" fill="#7b3fc4">EUV</text>
<!-- nur gespiegelte Stellen gehen weiter -->
<g stroke="#7b3fc4" stroke-width="5" opacity="0.85"><path d="M268,75 L294,118 M290,75 L316,118 M314,75 L340,118"/></g>
<rect x="282" y="128" width="96" height="22" fill="#cfd6dd" stroke="#555" stroke-width="1.5"/>
<rect x="282" y="118" width="96" height="10" fill="#f6d365" stroke="#b8860b" stroke-width="1"/>
<g fill="#7b3fc4"><rect x="290" y="118" width="12" height="10"/><rect x="312" y="118" width="12" height="10"/><rect x="336" y="118" width="12" height="10"/></g>
<text x="297" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#7b3fc4">belichten</text>
<text x="297" y="194" text-anchor="middle" font-size="13">Licht überträgt</text>
<text x="297" y="211" text-anchor="middle" font-size="13">das Muster der Maske</text>

<!-- 3 -->
<rect x="10" y="230" width="185" height="180" rx="10" fill="#f4f5f7"/>
<circle cx="30" cy="250" r="12" fill="#3a6ed8"/><text x="30" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<rect x="32" y="330" width="140" height="26" fill="#cfd6dd" stroke="#555" stroke-width="1.5"/>
<rect x="32" y="320" width="140" height="10" fill="#f6d365" stroke="#b8860b" stroke-width="1"/>
<g fill="#7b3fc4"><rect x="55" y="320" width="16" height="10"/><rect x="79" y="320" width="16" height="10"/><rect x="119" y="320" width="16" height="10"/><rect x="143" y="320" width="16" height="10"/></g>
<text x="102" y="382" text-anchor="middle" font-size="14" font-weight="700">Muster ist</text>
<text x="102" y="400" text-anchor="middle" font-size="14" font-weight="700">übertragen</text>

<!-- 4 -->
<rect x="205" y="230" width="185" height="180" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<circle cx="225" cy="250" r="12" fill="#3a6ed8"/><text x="225" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
<rect x="227" y="330" width="140" height="26" fill="#cfd6dd" stroke="#555" stroke-width="1.5"/>
<rect x="227" y="320" width="140" height="10" fill="#b197fc"/>
<rect x="227" y="310" width="140" height="10" fill="#b8860b"/>
<rect x="227" y="300" width="140" height="10" fill="#b197fc"/>
<rect x="227" y="290" width="140" height="10" fill="#b8860b"/>
<rect x="227" y="280" width="140" height="10" fill="#b197fc"/>
<path d="M378,330 V286" stroke="#E07B00" stroke-width="3"/><path d="M372,288 L378,276 L384,288 Z" fill="#E07B00"/>
<text x="297" y="382" text-anchor="middle" font-size="14" font-weight="700">Schicht für Schicht</text>
<text x="297" y="400" text-anchor="middle" font-size="14" font-weight="700">wiederholen</text>
</svg>
