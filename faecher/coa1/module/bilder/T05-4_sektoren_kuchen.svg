<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Platten nebeneinander. Links eine einzige lange Spur ohne Unterteilung und ohne Nummern: Es gibt keine Nummer, mit der man eine bestimmte Stelle angeben kann. Rechts dieselbe Spur in Kuchenstücke geteilt, nummeriert 1 bis 8; Sektor 3 ist rot markiert, der Kopf steht darüber. Jedes Stück hat eine Nummer: Daten lassen sich gezielt ablegen und wiederfinden, und es wird nur das nötige Stück gelesen oder geschrieben. Ein Sektor fasst meist 512 Byte.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Warum Sektoren?</text>
<text x="100" y="54" text-anchor="middle" font-weight="700">ohne Unterteilung</text>
<text x="300" y="54" text-anchor="middle" font-weight="700">mit Sektoren</text>
<line x1="200" y1="40" x2="200" y2="330" stroke="#ddd" stroke-width="1.5"/>

<!-- links -->
<circle cx="100" cy="150" r="78" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="100" cy="150" r="60" fill="none" stroke="#3a6ed8" stroke-width="18"/>
<circle cx="100" cy="150" r="12" fill="#555"/>
<text x="100" y="96" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">?</text>

<!-- rechts -->
<circle cx="300" cy="150" r="78" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="2"/>
<path d="M300.0,78.0 A72,72 0 0 1 350.9,99.1 L333.9,116.1 A48,48 0 0 0 300.0,102.0 Z" fill="#3a6ed8" stroke="#fff" stroke-width="2"/><text x="323.0" y="99.6" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">1</text><path d="M350.9,99.1 A72,72 0 0 1 372.0,150.0 L348.0,150.0 A48,48 0 0 0 333.9,116.1 Z" fill="#3a6ed8" stroke="#fff" stroke-width="2"/><text x="355.4" y="132.0" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">2</text><path d="M372.0,150.0 A72,72 0 0 1 350.9,200.9 L333.9,183.9 A48,48 0 0 0 348.0,150.0 Z" fill="#c62828" stroke="#fff" stroke-width="2"/><text x="352.0" y="176.0" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">3</text><path d="M350.9,200.9 A72,72 0 0 1 300.0,222.0 L300.0,198.0 A48,48 0 0 0 333.9,183.9 Z" fill="#3a6ed8" stroke="#fff" stroke-width="2"/><text x="323.0" y="210.4" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">4</text><path d="M300.0,222.0 A72,72 0 0 1 249.1,200.9 L266.1,183.9 A48,48 0 0 0 300.0,198.0 Z" fill="#3a6ed8" stroke="#fff" stroke-width="2"/><text x="277.0" y="210.4" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">5</text><path d="M249.1,200.9 A72,72 0 0 1 228.0,150.0 L252.0,150.0 A48,48 0 0 0 266.1,183.9 Z" fill="#3a6ed8" stroke="#fff" stroke-width="2"/><text x="244.6" y="178.0" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">6</text><path d="M228.0,150.0 A72,72 0 0 1 249.1,99.1 L266.1,116.1 A48,48 0 0 0 252.0,150.0 Z" fill="#3a6ed8" stroke="#fff" stroke-width="2"/><text x="244.6" y="132.0" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">7</text><path d="M249.1,99.1 A72,72 0 0 1 300.0,78.0 L300.0,102.0 A48,48 0 0 0 266.1,116.1 Z" fill="#3a6ed8" stroke="#fff" stroke-width="2"/><text x="277.0" y="99.6" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">8</text>
<circle cx="300" cy="150" r="12" fill="#555"/>
<!-- Kopf über Sektor 3, am äußeren Rand -->
<rect x="364" y="178" width="14" height="10" rx="2" fill="#222" stroke="#fff" stroke-width="1.5"/>
<line x1="378" y1="183" x2="396" y2="200" stroke="#7a7f88" stroke-width="5" stroke-linecap="round"/>

<!-- Texte -->
<g text-anchor="middle">
<text x="100" y="262" font-weight="700">keine Nummer:</text>
<text x="100" y="281" font-size="13">Wo genau liegen</text>
<text x="100" y="298" font-size="13">die Daten?</text>
<text x="300" y="262" font-weight="700" fill="#c62828">Sektor 3 hat eine Nummer</text>
<text x="300" y="281" font-size="13">gezielt ablegen und finden,</text>
<text x="300" y="298" font-size="13">nur dieses Stück lesen</text>
</g>
<rect x="210" y="320" width="180" height="56" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="300" y="343" text-anchor="middle" font-weight="700">1 Sektor =</text>
<text x="300" y="364" text-anchor="middle" font-weight="700" fill="#c62828">meist 512 Byte</text>
<text x="200" y="404" text-anchor="middle" font-size="13" fill="#555">Die Platte dreht sich unter dem Kopf hindurch.</text>
</svg>
