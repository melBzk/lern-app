<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Vier Paare: Einzugsscanner (das ganze Gerät zieht das Blatt ein) gegen ADF (Einzug-Aufsatz am Flachbettscanner). Optische Auflösung (echt gemessen, zum Vergleichen) gegen interpolierte (errechnete Zwischenpunkte, Werbezahl). dpi (wie fein) gegen Farbtiefe in Bit (wie viele Farbstufen). Scanner (Papier in den PC, Eingabe) gegen Drucker (aus dem PC aufs Papier, Ausgabe).</title>
