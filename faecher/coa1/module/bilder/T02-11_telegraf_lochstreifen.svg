<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" font-family="system-ui, sans-serif" role="img">
  <title>Vom Telegrafen zum Lochstreifen: 1. Mit der Morsetaste wird ein Stromkreis kurz oder lang geschlossen, das ergibt einen Buchstaben. 2. Die Nachricht wird in einen Papierstreifen gestanzt, eine Zeile mit 8 Feldern ist ein Zeichen, hier mit Löchern an Stelle 1, 4 und 7. 3. Eine Lesemaschine tastet mit 8 Stiften ab: Bei einem Loch fließt Strom, das ist 1; ohne Loch fließt kein Strom, das ist 0.</title>
