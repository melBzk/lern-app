<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" role="img">
  <title>Alltag: Angaben auf der Lebensmittel-Packung. Die Zutatenliste ist Pflicht, ein Testsiegel ist freiwillig. Bei Elektrogeräten ist es ähnlich: Es gibt Pflicht-Regeln und freiwillige Prüfzeichen. Wo der Vergleich hinkt: Ein Zeichen sagt nicht, ob ein Gerät gut ist, nur dass bestimmte Regeln eingehalten wurden.</title>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Pflicht und freiwillig</text>

  <!-- Packung -->
  <text x="100" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Lebensmittel</text>
  <rect x="40" y="70" width="120" height="150" rx="6" fill="#fff4e5" stroke="#3a3f4a" stroke-width="2.5"/>
  <rect x="52" y="150" width="96" height="56" fill="#fff" stroke="#999"/>
  <g stroke="#999" stroke-width="2"><line x1="58" y1="164" x2="140" y2="164"/><line x1="58" y1="176" x2="140" y2="176"/><line x1="58" y1="188" x2="126" y2="188"/></g>
  <circle cx="122" cy="106" r="24" fill="#fff" stroke="#1f9d55" stroke-width="3"/><path d="M110,106 l8,8 l14,-16" fill="none" stroke="#1f9d55" stroke-width="3.5"/>
  <!-- Geraet -->
  <text x="300" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Elektrogerät</text>
  <rect x="240" y="70" width="120" height="150" rx="6" fill="#e5e7eb" stroke="#3a3f4a" stroke-width="2.5"/>
  <rect x="252" y="150" width="96" height="56" fill="#fff" stroke="#999"/>
  <g stroke="#999" stroke-width="2"><line x1="258" y1="164" x2="340" y2="164"/><line x1="258" y1="176" x2="340" y2="176"/><line x1="258" y1="188" x2="326" y2="188"/></g>
  <circle cx="322" cy="106" r="24" fill="#fff" stroke="#1f9d55" stroke-width="3"/><path d="M310,106 l8,8 l14,-16" fill="none" stroke="#1f9d55" stroke-width="3.5"/>

  <!-- Zuordnung -->
  <rect x="8" y="236" width="384" height="44" rx="10" fill="#f3f4f6" stroke="#3a3f4a" stroke-width="2"/>
  <text x="24" y="264" font-size="15" font-weight="700" fill="#222">Pflicht:</text>
  <text x="100" y="264" font-size="14" fill="#333">Zutatenliste</text><text x="200" y="264" text-anchor="middle" font-size="14" fill="#222">↔</text><text x="230" y="264" font-size="14" fill="#333">Pflicht-Regeln</text>
  <rect x="8" y="290" width="384" height="44" rx="10" fill="#e8f6ee" stroke="#1f9d55" stroke-width="2"/>
  <text x="24" y="318" font-size="15" font-weight="700" fill="#14653a">freiwillig:</text>
  <text x="108" y="318" font-size="14" fill="#333">Testsiegel</text><text x="200" y="318" text-anchor="middle" font-size="14" fill="#222">↔</text><text x="230" y="318" font-size="14" fill="#333">Prüfzeichen</text>

  <rect x="8" y="348" width="384" height="62" rx="10" fill="#fdecec" stroke="#d63c3c" stroke-width="2"/>
  <text x="20" y="372" font-size="14" font-weight="700" fill="#a32020">Hinkt: Ein Zeichen heißt nicht „gut“,</text>
  <text x="20" y="394" font-size="14" fill="#a32020">nur: bestimmte Regeln eingehalten.</text>
</svg>
