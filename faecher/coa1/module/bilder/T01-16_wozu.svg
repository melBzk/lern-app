<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Wozu das Rechnen mit Bildpunkten gut ist, in drei Zeilen. Prüfung AP1: Speicher- und Bildgrößen in KiB und MiB rechnen. Drucker kaufen: genug Druckerspeicher, aufrüstbar mit handelsüblichen Modulen DIMM oder SO-DIMM, sonst wird Nachrüsten teuer. Scanner: mehr Auflösung als nötig macht nur die Dateien unnötig groß.</title>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Wofür brauchst du das?</text>
<g fill="#f4f1ee"><rect x="10" y="42" width="380" height="90" rx="10"/><rect x="10" y="140" width="380" height="110" rx="10"/><rect x="10" y="258" width="380" height="90" rx="10"/></g>
<!-- AP1 -->
<rect x="26" y="54" width="52" height="66" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="52" y="76" text-anchor="middle" font-size="13" font-weight="700">AP1</text>
<g stroke="#adb5bd" stroke-width="2.5"><line x1="34" y1="88" x2="70" y2="88"/><line x1="34" y1="98" x2="66" y2="98"/><line x1="34" y1="108" x2="70" y2="108"/></g>
<text x="96" y="78" font-size="15" font-weight="700">Prüfung AP1</text>
<text x="96" y="100" font-size="13">Speicher- und Bildgrößen rechnen</text>
<text x="96" y="118" font-size="13">in <tspan font-weight="700" fill="#e8590c">KiB / MiB</tspan></text>
<!-- Drucker -->
<rect x="24" y="168" width="56" height="34" rx="4" fill="#868e96"/>
<rect x="32" y="156" width="40" height="14" fill="#fff" stroke="#555" stroke-width="1.5"/>
<rect x="32" y="196" width="40" height="18" fill="#fff" stroke="#555" stroke-width="1.5"/>
<rect x="30" y="224" width="44" height="14" rx="2" fill="#2b8a3e"/><g fill="#222"><rect x="34" y="227" width="8" height="8"/><rect x="46" y="227" width="8" height="8"/><rect x="58" y="227" width="8" height="8"/></g>
<text x="96" y="166" font-size="15" font-weight="700">Drucker auswählen</text>
<text x="96" y="188" font-size="13">genug Druckerspeicher</text>
<text x="96" y="208" font-size="13">aufrüstbar mit <tspan font-weight="700">DIMM / SO-DIMM</tspan></text>
<text x="96" y="228" font-size="13" fill="#c62828">sonst wird Nachrüsten teuer</text>
<!-- Scanner -->
<rect x="22" y="290" width="60" height="22" rx="3" fill="#868e96"/>
<rect x="22" y="284" width="60" height="8" rx="2" fill="#495057"/>
<rect x="28" y="316" width="22" height="24" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="54" y="310" width="28" height="30" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="96" y="286" font-size="15" font-weight="700">Scannen</text>
<text x="96" y="308" font-size="13">mehr Auflösung als nötig</text>
<text x="96" y="328" font-size="13">→ nur <tspan font-weight="700" fill="#c62828">unnötig große Dateien</tspan></text>
</svg>
