<text x="200" y="396" font-size="15" text-anchor="middle" font-weight="700">viele Register</text>
<text x="200" y="414" font-size="13" text-anchor="middle" fill="#444">für schnelle Zugriffe</text>
<rect x="110" y="436" width="180" height="24" rx="3" fill="#dcefe4" stroke="#2f6b4f" stroke-width="2"/>
<text x="200" y="453" font-size="14" text-anchor="middle" font-weight="700">LOAD</text>
<rect x="110" y="466" width="180" height="24" rx="3" fill="#dcefe4" stroke="#2f6b4f" stroke-width="2"/>
