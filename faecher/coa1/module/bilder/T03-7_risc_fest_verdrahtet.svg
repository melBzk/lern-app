<rect x="110" y="496" width="180" height="24" rx="3" fill="#dcefe4" stroke="#2f6b4f" stroke-width="2"/>
<text x="200" y="513" font-size="14" text-anchor="middle" font-weight="700">STORE</text>
<line x1="110" y1="430" x2="110" y2="532" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="290" y1="430" x2="290" y2="532" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="200" y="552" font-size="15" text-anchor="middle" font-weight="700">alle Befehle gleich lang</text>
<circle cx="48" cy="598" r="24" fill="#fff" stroke="#333" stroke-width="3"/><line x1="48" y1="598" x2="48" y2="581" stroke="#333" stroke-width="3"/><line x1="48" y1="598" x2="63" y2="598" stroke="#333" stroke-width="3"/><circle cx="48" cy="598" r="3" fill="#333"/>
<path d="M92,612 V584 h24 V612 h24 V584 h24 V612 h24" fill="none" stroke="#333" stroke-width="3"/>
<text x="204" y="606" font-size="16" font-weight="700" fill="#E07B00">wenige Takte</text>
