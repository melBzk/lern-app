<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Welchen Speicher kaufen? Zwei Regale im Laden. Oben normale RAM-Riegel mit grünem Schild: offiziell vom Mainboard-Hersteller zugelassen, den schnellsten davon wählen, wenn er kaum teurer ist. Darunter glänzende Riegel mit Kühlblech und Schild: Overclocker- oder Gamer-RAM, nur wenn das Board das kann. Unten ein Büro mit durchgestrichenem Tacho: Übertakten in der Firma, dringend abraten.</title>
<defs>
<g id="normal">
<rect x="0" y="0" width="110" height="26" rx="2" fill="#2a7f62"/>
<rect x="8" y="5" width="16" height="12" fill="#1b1b1b"/><rect x="34" y="5" width="16" height="12" fill="#1b1b1b"/><rect x="60" y="5" width="16" height="12" fill="#1b1b1b"/><rect x="86" y="5" width="16" height="12" fill="#1b1b1b"/>
<rect x="2" y="21" width="106" height="5" fill="#d9a400"/><rect x="46" y="20" width="4" height="6" fill="#fff"/>
</g>
<g id="gamer">
<rect x="0" y="0" width="110" height="30" rx="3" fill="#444"/>
<path d="M0,0 h110 l-10,-10 h-90 z" fill="#666"/>
<path d="M14,4 l16,22 M24,4 l16,22 M70,4 l16,22" stroke="#ddd" stroke-width="3"/>
<rect x="2" y="30" width="106" height="5" fill="#d9a400"/>
</g>
</defs>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Welchen Speicher kaufen?</text>

<!-- Regal 1 -->
<use xlink:href="#normal" x="24" y="66"/>
<use xlink:href="#normal" x="38" y="104"/>
<rect x="12" y="134" width="160" height="10" fill="#8d6e63"/>
<rect x="184" y="50" width="206" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="196" y="74" font-size="14" font-weight="700" fill="#2e7d32">offiziell vom Mainboard-</text>
<text x="196" y="92" font-size="14" font-weight="700" fill="#2e7d32">Hersteller zugelassen</text>
<text x="196" y="118" font-size="13">den schnellsten davon</text>
<text x="196" y="135" font-size="13">wählen – vor allem, wenn</text>
<text x="196" y="152" font-size="13">er kaum teurer ist</text>

<!-- Regal 2 -->
<use xlink:href="#gamer" x="24" y="222"/>
<use xlink:href="#gamer" x="38" y="270"/>
<rect x="12" y="306" width="160" height="10" fill="#8d6e63"/>
<rect x="184" y="210" width="206" height="110" rx="8" fill="#fff3e0" stroke="#E07B00" stroke-width="2.5"/>
<text x="196" y="236" font-size="14" font-weight="700" fill="#b35f00">Overclocker-/</text>
<text x="196" y="254" font-size="14" font-weight="700" fill="#b35f00">Gamer-RAM (teuer)</text>
<text x="196" y="280" font-size="13">lohnt nur, wenn das</text>
<text x="196" y="297" font-size="13">Board das Tempo kann</text>
<text x="196" y="314" font-size="13">(oder übertaktet läuft)</text>

<line x1="10" y1="350" x2="390" y2="350" stroke="#ddd" stroke-width="2"/>

<!-- Büro -->
<rect x="30" y="394" width="74" height="50" rx="4" fill="#555"/>
<rect x="36" y="400" width="62" height="38" fill="#cfd8dc"/>
<rect x="60" y="444" width="14" height="14" fill="#555"/>
<rect x="14" y="458" width="150" height="10" fill="#8d6e63"/>
<rect x="24" y="468" width="8" height="40" fill="#8d6e63"/><rect x="146" y="468" width="8" height="40" fill="#8d6e63"/>
<text x="89" y="528" font-size="14" text-anchor="middle" font-weight="700">Firma / Büro</text>
<!-- Tacho durchgestrichen -->
<path d="M114,442 A28,28 0 0 1 170,442" fill="none" stroke="#555" stroke-width="7"/>
<line x1="142" y1="442" x2="162" y2="422" stroke="#222" stroke-width="4" stroke-linecap="round"/>
<circle cx="142" cy="430" r="36" fill="none" stroke="#c62828" stroke-width="5"/>
<line x1="117" y1="455" x2="167" y2="405" stroke="#c62828" stroke-width="5"/>

<text x="196" y="410" font-size="16" font-weight="700" fill="#c62828">Übertakten</text>
<text x="196" y="430" font-size="16" font-weight="700" fill="#c62828">in der Firma:</text>
<text x="196" y="456" font-size="16" font-weight="700">dringend abraten</text>
<text x="196" y="482" font-size="13" fill="#444">Speichertakt anheben</text>
<text x="196" y="499" font-size="13" fill="#444">ist immer unsicher</text>
</svg>
