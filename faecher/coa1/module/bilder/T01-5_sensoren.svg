<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, sans-serif">
  <title>Drei Beispiele für Sensoren. Erstens die Unterseite einer optischen Maus mit Lichtpunkt: Der Sensor in der Maus erkennt die Bewegung. Zweitens ein Laptop mit Fingerabdruck-Feld, ein Finger liegt darauf, ein grünes Schloss geht auf: Biosensor, Anmeldung per Fingerabdruck. Drittens eine Tür mit kleinem Sensor-Kasten darüber, der Funkwellen aussendet: Der Sensor löst selbst etwas aus, die Tür öffnet sich.</title>
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f9d55"/></marker>
  </defs>
  <rect width="400" height="480" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Sensoren und Biosensoren</text>

  <!-- 1 Maus -->
  <rect x="8" y="40" width="384" height="138" rx="10" fill="#f3f4f6"/>
  <rect x="58" y="54" width="70" height="110" rx="35" fill="#cfd3da" stroke="#555" stroke-width="2"/>
  <rect x="66" y="64" width="54" height="6" rx="3" fill="#999"/>
  <rect x="66" y="150" width="54" height="6" rx="3" fill="#999"/>
  <circle cx="93" cy="112" r="16" fill="#d63c3c" fill-opacity="0.25"/>
  <circle cx="93" cy="112" r="7" fill="#d63c3c"/>
  <text x="93" y="174" text-anchor="middle" font-size="13" fill="#555">Unterseite</text>
  <text x="176" y="96" font-size="15" font-weight="700" fill="#222">Sensor in der Maus</text>
  <text x="176" y="117" font-size="14" fill="#222">erkennt Bewegung</text>

  <!-- 2 Biosensor -->
  <rect x="8" y="188" width="384" height="138" rx="10" fill="#eaf6ee"/>
  <path d="M24,250 H156 L166,312 H14 Z" fill="#cfd3da" stroke="#555" stroke-width="2"/>
  <rect x="40" y="256" width="100" height="22" rx="2" fill="#fff" stroke="#999"/>
  <rect x="120" y="288" width="26" height="18" rx="3" fill="#3a3f4a"/>
  <!-- Finger auf Sensor -->
  <line x1="170" y1="240" x2="134" y2="294" stroke="#b57f5a" stroke-width="18" stroke-linecap="round"/>
  <line x1="170" y1="240" x2="134" y2="294" stroke="#f2c9a5" stroke-width="14" stroke-linecap="round"/>
  <!-- Schloss offen -->
  <rect x="58" y="210" width="28" height="22" rx="3" fill="#1f9d55"/>
  <path d="M64,210 V202 A8,8 0 0 1 80,202" fill="none" stroke="#1f9d55" stroke-width="4"/>
  <circle cx="72" cy="221" r="3" fill="#fff"/>
  <text x="184" y="240" font-size="15" font-weight="700" fill="#16703d">Biosensor</text>
  <text x="184" y="261" font-size="14" fill="#222">Anmeldung per</text>
  <text x="184" y="279" font-size="14" fill="#222">Fingerabdruck</text>

  <!-- 3 Tür -->
  <rect x="8" y="336" width="384" height="136" rx="10" fill="#e8f0fe"/>
  <rect x="44" y="374" width="90" height="98" fill="#e5e7eb" stroke="#555" stroke-width="2"/>
  <path d="M44,374 L84,384 V472 L44,472 Z" fill="#c9b8a6" stroke="#8a7a60" stroke-width="2"/>
  <rect x="74" y="348" width="30" height="16" rx="3" fill="#3a3f4a"/>
  <circle cx="89" cy="356" r="3" fill="#d63c3c"/>
  <g fill="none" stroke="#3a6ed8" stroke-width="2.5" stroke-linecap="round">
    <path d="M80,370 A12,12 0 0 0 98,370"/>
    <path d="M74,376 A20,20 0 0 0 104,376"/>
  </g>
  <path d="M126,430 C120,410 110,400 96,396" fill="none" stroke="#1f9d55" stroke-width="3.5" marker-end="url(#mg)"/>
  <text x="176" y="392" font-size="15" font-weight="700" fill="#1d4fb8">Sensor löst selbst</text>
  <text x="176" y="411" font-size="15" font-weight="700" fill="#1d4fb8">etwas aus</text>
  <text x="176" y="432" font-size="14" fill="#222">z. B. Tür öffnet sich</text>
</svg>
