<rect x="338" y="251" width="8" height="5" rx="1" fill="#E07B00" stroke="none" stroke-width="0"/><circle cx="342" cy="276" r="18" fill="#fff" stroke="#E07B00" stroke-width="3"/><line x1="342" y1="276" x2="342" y2="264.3" stroke="#333" stroke-width="2.5"/><line x1="342" y1="276" x2="351.0" y2="279.6" stroke="#333" stroke-width="2.5"/>
<text x="296" y="236" font-size="15" text-anchor="middle" font-weight="700" fill="#E07B00">Benchmark</text>
