<text x="80" y="56" font-size="14" text-anchor="middle" font-weight="700" fill="#555">steht im Papier</text>
<text x="300" y="56" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6b4f">zeigt die Messung</text>
<rect x="6" y="66" width="388" height="128" rx="10" fill="#f6f6f6" stroke="#ddd" stroke-width="1.5"/>
<rect x="20" y="82" width="120" height="96" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="80" y="104" font-size="14" text-anchor="middle" font-weight="700">Prospekt</text>
<text x="34" y="128" font-size="13">• PS</text>
<text x="34" y="148" font-size="13">• Hubraum</text>
<line x1="150" y1="130" x2="196" y2="130" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="212" y1="172" x2="380" y2="172" stroke="#999" stroke-width="3" stroke-dasharray="10 6"/>
