<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Schlüssel und Schloss: Drei Schlösser DDR3, DDR4 und DDR5, jedes mit dem Steg an einer anderen Stelle. Darunter Schlüssel. Der DDR3-Schlüssel passt ins DDR3-Schloss, der DDR4-Schlüssel ins DDR4-Schloss, grüner Haken. Ein DDR4-Schlüssel passt nicht ins DDR5-Schloss, rotes X. Die Kerbe am Riegel ist wie der Bart am Schlüssel, der Steg im Steckplatz ist wie das Schloss.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="372" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Schlüssel und Schloss</text>

<!-- Schlösser -->
<g fill="#cfd8dc" stroke="#455a64" stroke-width="2"><rect x="18" y="48" width="100" height="86" rx="12"/><rect x="150" y="48" width="100" height="86" rx="12"/><rect x="282" y="48" width="100" height="86" rx="12"/></g>
<g text-anchor="middle" font-size="15" font-weight="700"><text x="68" y="74">DDR3</text><text x="200" y="74">DDR4</text><text x="332" y="74">DDR5</text></g>
<!-- Schlitz mit Steg -->
<g fill="#263238"><rect x="38" y="98" width="60" height="16"/><rect x="170" y="98" width="60" height="16"/><rect x="302" y="98" width="60" height="16"/></g>
<g fill="#cfd8dc"><rect x="50" y="98" width="8" height="10"/><rect x="196" y="98" width="8" height="10"/><rect x="342" y="98" width="8" height="10"/></g>

<!-- Pfeile -->
<g stroke="#333" stroke-width="2"><line x1="68" y1="160" x2="68" y2="140" marker-end="url(#a)"/><line x1="200" y1="160" x2="200" y2="140" marker-end="url(#a)"/><line x1="332" y1="160" x2="332" y2="140" marker-end="url(#a)"/></g>

<!-- Schlüssel: Bart mit Kerbe -->
<g fill="#c9a227" stroke="#8d6e00" stroke-width="1.5">
<path d="M38,168 H50 V178 H58 V168 H98 V182 H38 Z"/>
<path d="M170,168 H196 V178 H204 V168 H230 V182 H170 Z"/>
<path d="M302,168 H328 V178 H336 V168 H362 V182 H302 Z"/>
<rect x="62" y="182" width="12" height="20"/><rect x="194" y="182" width="12" height="20"/><rect x="326" y="182" width="12" height="20"/>
<circle cx="68" cy="218" r="17"/><circle cx="200" cy="218" r="17"/><circle cx="332" cy="218" r="17"/>
</g>
<g fill="#fff"><circle cx="68" cy="222" r="5"/><circle cx="200" cy="222" r="5"/><circle cx="332" cy="222" r="5"/></g>
<g text-anchor="middle" font-size="13" font-weight="700"><text x="68" y="254">DDR3-Schlüssel</text><text x="200" y="254">DDR4-Schlüssel</text><text x="332" y="254" fill="#c62828">DDR4-Schlüssel</text></g>

<!-- Haken / X -->
<g fill="none" stroke-width="5" stroke-linecap="round"><path d="M56,278 l9,9 l17,-18" stroke="#2e7d32"/><path d="M188,278 l9,9 l17,-18" stroke="#2e7d32"/><path d="M320,268 l22,22 M342,268 l-22,22" stroke="#c62828"/></g>
<text x="332" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">passt nicht</text>

<rect x="10" y="318" width="380" height="46" rx="8" fill="#f4f1ee"/>
<text x="200" y="337" text-anchor="middle" font-size="13"><tspan font-weight="700">Kerbe</tspan> am Riegel = Bart am Schlüssel</text>
<text x="200" y="356" text-anchor="middle" font-size="13"><tspan font-weight="700">Steg</tspan> im Steckplatz = Schloss</text>
</svg>
