<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>WAN und GAN. Oben WAN, Wide Area Network: eine Landkarte mit drei weit voneinander entfernten Städten, die durch lange Leitungen verbunden sind. Unten GAN, Global Area Network: eine Erdkugel, um die sich Verbindungen zwischen mehreren Kontinenten spannen, also weltweit.</title>
