<text x="322" y="154" font-weight="700">Stadt B</text>
<text x="210" y="248" text-anchor="middle" font-weight="700">Stadt C</text>

<line x1="10" y1="282" x2="390" y2="282" stroke="#ccc" stroke-width="1.5"/>

