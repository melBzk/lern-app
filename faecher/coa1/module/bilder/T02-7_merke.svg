<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222">
<title>Merkbild Prozessor in fünf Zeilen: 1. Erst den Prozessor von AMD oder Intel wählen, dann ein Mainboard mit gleichem Sockel, gleiche Zahl. 2. Kontakte sind vergoldet: leitet gut, korrodiert nicht; die Kerbe zeigt die Richtung. 3. Kühlrippen gibt es immer; passiv nur Rippen, aktiv zusätzlich Lüfter darauf. 4. Wärmeleitpaste füllt das Luftpolster, ausgetrocknet erneuern. 5. K = übertaktbar, T = energieoptimiert; Takt = Bustakt mal Multiplikator.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Prozessor – das Wichtigste</text>
<g fill="#f4f1ee"><rect x="10" y="42" width="380" height="66" rx="10"/><rect x="10" y="114" width="380" height="66" rx="10"/><rect x="10" y="186" width="380" height="66" rx="10"/><rect x="10" y="258" width="380" height="66" rx="10"/><rect x="10" y="330" width="380" height="66" rx="10"/></g>
<!-- 1 -->
<rect x="20" y="56" width="30" height="30" rx="2" fill="#cfd8dc" stroke="#555" stroke-width="1.5"/>
<text x="60" y="77" font-size="14" font-weight="700" fill="#555">→</text>
<rect x="76" y="54" width="18" height="34" rx="2" fill="#2e7d4f"/>
<text x="104" y="70" font-size="15" font-weight="700">Erst CPU, dann Mainboard</text>
<text x="104" y="92" font-size="13">gleicher Sockel = gleiche Zahl</text>
<!-- 2 -->
<rect x="24" y="124" width="56" height="16" fill="#cfd8dc" stroke="#555" stroke-width="1.5"/>
<g stroke="#e0a54a" stroke-width="3"><line x1="32" y1="140" x2="32" y2="160"/><line x1="44" y1="140" x2="44" y2="160"/><line x1="56" y1="140" x2="56" y2="160"/><line x1="68" y1="140" x2="68" y2="160"/></g>
<polygon points="24,124 34,124 24,134" fill="#D4607A"/>
<text x="104" y="142" font-size="15" font-weight="700">Gold + Kerbe</text>
<text x="104" y="164" font-size="13">leitet gut, rostet nicht; Kerbe = Richtung</text>
<!-- 3 -->
<g fill="#90a4ae"><rect x="20" y="232" width="30" height="6"/><rect x="22" y="212" width="3" height="20"/><rect x="29" y="212" width="3" height="20"/><rect x="36" y="212" width="3" height="20"/><rect x="43" y="212" width="3" height="20"/></g>
<g fill="#90a4ae"><rect x="58" y="232" width="30" height="6"/><rect x="60" y="222" width="3" height="10"/><rect x="67" y="222" width="3" height="10"/><rect x="74" y="222" width="3" height="10"/><rect x="81" y="222" width="3" height="10"/></g>
<rect x="58" y="206" width="30" height="14" rx="2" fill="#3a6ed8"/>
<text x="104" y="214" font-size="15" font-weight="700">Kühlrippen immer</text>
<text x="104" y="236" font-size="13">passiv = nur Rippen, aktiv = + Lüfter</text>
<!-- 4 -->
<rect x="24" y="270" width="60" height="12" fill="#90a4ae"/>
<rect x="24" y="282" width="60" height="7" fill="#bdbdbd"/>
<rect x="24" y="289" width="60" height="22" fill="#cfd8dc" stroke="#555" stroke-width="1"/>
<text x="104" y="286" font-size="15" font-weight="700">Wärmeleitpaste</text>
<text x="104" y="308" font-size="13">füllt Luftpolster; ausgetrocknet: erneuern</text>
<!-- 5 -->
<rect x="20" y="344" width="32" height="38" rx="6" fill="#fbe3e8" stroke="#D4607A" stroke-width="2"/>
<text x="36" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#b03a56">K</text>
<rect x="58" y="344" width="32" height="38" rx="6" fill="#d4efd9" stroke="#2e9d5b" stroke-width="2"/>
<text x="74" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#1f7a45">T</text>
<text x="104" y="358" font-size="14" font-weight="700">K übertaktbar, T energieoptimiert</text>
<text x="104" y="380" font-size="13">Takt = Bustakt × Multiplikator</text>
</svg>
