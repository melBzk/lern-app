<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" fill="#222">
<title>Die fünf Kürzel nach Zugehörigkeit sortiert. Steuerwerk: IDU, Instruction Decode Unit, der Befehlsdecoder, übersetzt Befehle. Rechenwerk: ALU, Arithmetic Logic Unit, rechnet, verknüpft logisch, vergleicht; FPU, Floating Point Unit, rechnet mit Kommazahlen. Cache: DC, Data Cache, für Daten; CC, Code Cache, für Befehle. Nur erkennen, nicht herleiten.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">5 Kürzel – wo gehören sie hin?</text>
<!-- Steuerwerk -->
<rect x="10" y="42" width="380" height="88" rx="10" fill="#fbe3e8" stroke="#D4607A" stroke-width="2"/>
<text x="24" y="64" font-size="14" font-weight="700" fill="#b03a56">Steuerwerk</text>
<rect x="24" y="76" width="64" height="40" rx="6" fill="#fff" stroke="#D4607A" stroke-width="2"/>
<text x="56" y="102" text-anchor="middle" font-size="16" font-weight="700">IDU</text>
<text x="100" y="92" font-size="13">Instruction Decode Unit</text>
<text x="100" y="111" font-size="13" font-weight="700">Befehlsdecoder: übersetzt Befehle</text>
<!-- Rechenwerk -->
<rect x="10" y="140" width="380" height="140" rx="10" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="2"/>
<text x="24" y="162" font-size="14" font-weight="700" fill="#2550a8">Rechenwerk</text>
<rect x="24" y="174" width="64" height="40" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="56" y="200" text-anchor="middle" font-size="16" font-weight="700">ALU</text>
<text x="100" y="190" font-size="13">Arithmetic Logic Unit</text>
<text x="100" y="209" font-size="13" font-weight="700">rechnet, verknüpft, vergleicht</text>
<rect x="24" y="226" width="64" height="40" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="56" y="252" text-anchor="middle" font-size="16" font-weight="700">FPU</text>
<text x="100" y="242" font-size="13">Floating Point Unit</text>
<text x="100" y="261" font-size="13" font-weight="700">rechnet mit Kommazahlen</text>
<!-- Cache -->
<rect x="10" y="290" width="380" height="120" rx="10" fill="#eef8f0" stroke="#2e9d5b" stroke-width="2"/>
<text x="24" y="312" font-size="14" font-weight="700" fill="#1f7a45">Cache</text>
<rect x="24" y="322" width="64" height="36" rx="6" fill="#fff" stroke="#2e9d5b" stroke-width="2"/>
<text x="56" y="346" text-anchor="middle" font-size="16" font-weight="700">DC</text>
<text x="100" y="337" font-size="13">Data Cache</text>
<text x="100" y="354" font-size="13" font-weight="700">Zwischenspeicher für Daten</text>
<rect x="24" y="366" width="64" height="36" rx="6" fill="#fff" stroke="#2e9d5b" stroke-width="2"/>
<text x="56" y="390" text-anchor="middle" font-size="16" font-weight="700">CC</text>
<text x="100" y="381" font-size="13">Code Cache</text>
<text x="100" y="398" font-size="13" font-weight="700">Zwischenspeicher für Befehle</text>
</svg>
