<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" font-family="system-ui, sans-serif" role="img">
  <title>Vom Sand zum Prozessor in 6 Schritten: 1 Sand, 2 reines Silizium als Block, 3 dünne runde Scheibe (Wafer), 4 Belichten mit UV-Licht durch eine Schablone (Lithografie), 5 Zersägen des Wafers in viele kleine Chips (Dies), 6 fertiger Prozessor: Die auf grünem Träger, darüber der Metalldeckel (Heatspreader).</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
    <marker id="u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="396" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Vom Sand zum Prozessor</text>

  <!-- 1 Sand -->
  <path d="M25,140 Q45,92 70,90 Q95,92 115,140 Z" fill="#e6c77e" stroke="#b8963f" stroke-width="2"/>
  <g fill="#b8963f"><circle cx="55" cy="122" r="2"/><circle cx="72" cy="108" r="2"/><circle cx="86" cy="126" r="2"/><circle cx="66" cy="132" r="2"/><circle cx="96" cy="134" r="2"/><circle cx="44" cy="134" r="2"/></g>
  <text x="70" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#222">1 Sand</text>

  <!-- Pfeil 1-2 -->
  <line x1="120" y1="115" x2="148" y2="115" stroke="#3a6ed8" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2 reines Silizium -->
  <rect x="172" y="70" width="56" height="70" fill="#9aa3ad" stroke="#5f6770" stroke-width="2"/>
  <ellipse cx="200" cy="140" rx="28" ry="9" fill="#9aa3ad" stroke="#5f6770" stroke-width="2"/>
  <rect x="173" y="128" width="54" height="12" fill="#9aa3ad"/>
  <ellipse cx="200" cy="70" rx="28" ry="9" fill="#c9ced6" stroke="#5f6770" stroke-width="2"/>
  <text x="200" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#222">2 reines</text>
  <text x="200" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Silizium</text>

  <!-- Pfeil 2-3 -->
  <line x1="250" y1="115" x2="278" y2="115" stroke="#3a6ed8" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3 Wafer -->
  <circle cx="330" cy="110" r="40" fill="#c9ced6" stroke="#5f6770" stroke-width="2"/>
  <path d="M305,92 A30,30 0 0 1 335,78" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="330" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#222">3 Wafer</text>
  <text x="330" y="186" text-anchor="middle" font-size="13" fill="#444">dünne Scheibe</text>

  <!-- Rücklauf zu Reihe 2 -->
  <path d="M330,196 V214 H70 V236" fill="none" stroke="#3a6ed8" stroke-width="3" marker-end="url(#a)"/>

  <!-- 4 Belichten -->
  <rect x="45" y="246" width="50" height="16" rx="4" fill="#7b3fa0"/>
  <text x="70" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">UV</text>
  <line x1="58" y1="264" x2="58" y2="296" stroke="#7b3fa0" stroke-width="2" marker-end="url(#u)"/>
  <line x1="82" y1="264" x2="82" y2="296" stroke="#7b3fa0" stroke-width="2" marker-end="url(#u)"/>
  <rect x="30" y="280" width="80" height="6" fill="#333"/>
  <rect x="52" y="280" width="12" height="6" fill="#fff"/>
  <rect x="76" y="280" width="12" height="6" fill="#fff"/>
  <ellipse cx="70" cy="320" rx="42" ry="14" fill="#c9ced6" stroke="#5f6770" stroke-width="2"/>
  <path d="M42,320 H98 M56,310 V330 M70,307 V333 M84,310 V330" stroke="#5f6770" stroke-width="1.2"/>
  <text x="70" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#222">4 Belichten</text>
  <text x="70" y="380" text-anchor="middle" font-size="13" fill="#444">(Lithografie)</text>

  <!-- Pfeil 4-5 -->
  <line x1="120" y1="300" x2="148" y2="300" stroke="#3a6ed8" stroke-width="3" marker-end="url(#a)"/>

  <!-- 5 Zersägen -->
  <circle cx="195" cy="305" r="36" fill="#c9ced6" stroke="#5f6770" stroke-width="2"/>
  <path d="M159,293 H231 M159,305 H231 M159,317 H231 M183,269 V341 M195,269 V341 M207,269 V341 M171,273 V337 M219,273 V337" stroke="#5f6770" stroke-width="1.2"/>
  <rect x="207" y="293" width="12" height="12" fill="#fff" stroke="#5f6770" stroke-width="1"/>
  <line x1="219" y1="292" x2="236" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#k)"/>
  <rect x="232" y="246" width="22" height="22" fill="#4a5560" stroke="#222" stroke-width="1.5"/>
  <text x="243" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Die</text>
  <text x="200" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#222">5 Zersägen</text>
  <text x="200" y="380" text-anchor="middle" font-size="13" fill="#444">→ viele Dies</text>

  <!-- Pfeil 5-6 -->
  <line x1="262" y1="300" x2="288" y2="300" stroke="#3a6ed8" stroke-width="3" marker-end="url(#a)"/>

  <!-- 6 Prozessor -->
  <rect x="298" y="282" width="80" height="58" rx="4" fill="#4f9a6e" stroke="#2f6b4f" stroke-width="2"/>
  <rect x="324" y="300" width="28" height="22" fill="#4a5560" stroke="#222" stroke-width="1.5"/>
  <rect x="340" y="276" width="52" height="38" rx="3" fill="#c9ced6" stroke="#7a828c" stroke-width="2"/>
  <text x="345" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#555">Heatspreader</text>
  <text x="338" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#E07B00">6 Prozessor</text>
  <text x="338" y="380" text-anchor="middle" font-size="13" fill="#444">fertig für den PC</text>

</svg>
