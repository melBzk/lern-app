<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 398" font-family="system-ui, sans-serif" role="img">
  <title>Wer baut was wofür? Tabelle mit Einsatzbereichen als Zeilen und den Herstellern Intel, AMD und ARM als Spalten. Kleingerät und IoT: Intel Quark, AMD Embedded-Modelle.Smartphone und Tablet: Intel Atom und ARM-Chips. Büro-PC bis Gaming-PC und Laptop: Intel Core i3 bis i9, AMD Ryzen und Athlon. Workstation: Intel Xeon, AMD Threadripper. Server: Intel Xeon, AMD EPYC. Übrige Felder leer.</title>
  <rect width="400" height="398" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Wer baut was wofür?</text>

  <!-- Kopfzeile -->
  <rect x="136" y="44" width="80" height="32" rx="6" fill="#3a6ed8"/>
  <text x="176" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Intel</text>
  <rect x="220" y="44" width="88" height="32" rx="6" fill="#c62828"/>
  <text x="264" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">AMD</text>
  <rect x="312" y="44" width="78" height="32" rx="6" fill="#2f9e44"/>
  <text x="351" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">ARM</text>

  <!-- Zeile 1: Kleingerät / IoT -->
  <rect x="12" y="98" width="13" height="13" rx="2" fill="#555"/>
  <path d="M29,98.5 a6,6 0 0 1 0,12 M33,94.5 a10,10 0 0 1 0,20" fill="none" stroke="#555" stroke-width="2"/>
  <text x="50" y="103" font-size="14" font-weight="700" fill="#222">Kleingerät</text>
  <text x="50" y="121" font-size="14" font-weight="700" fill="#222">/ IoT</text>
  <rect x="136" y="80" width="80" height="58" rx="6" fill="#eef4ff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="176" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Quark</text>
  <rect x="220" y="80" width="88" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="264" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Embedded-</text>
  <text x="264" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Modelle</text>
  <rect x="312" y="80" width="78" height="58" rx="6" fill="#eceef1"/>

  <!-- Zeile 2: Smartphone / Tablet -->
  <rect x="18" y="154" width="18" height="30" rx="3" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="27" cy="179" r="1.6" fill="#555"/>
  <text x="44" y="165" font-size="14" font-weight="700" fill="#222">Smartphone</text>
  <text x="44" y="183" font-size="14" font-weight="700" fill="#222">/ Tablet</text>
  <rect x="136" y="142" width="80" height="58" rx="6" fill="#eef4ff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="176" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Atom</text>
  <rect x="220" y="142" width="88" height="58" rx="6" fill="#eceef1"/>
  <rect x="312" y="142" width="78" height="58" rx="6" fill="#ebf7ee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="351" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#222">ARM-Chips</text>

  <!-- Zeile 3: Büro-PC bis Gaming-PC / Laptop -->
  <rect x="14" y="216" width="26" height="18" rx="2" fill="none" stroke="#555" stroke-width="2"/>
  <path d="M27,234 v5 M20,240 h14" stroke="#555" stroke-width="2"/>
  <text x="46" y="220" font-size="14" font-weight="700" fill="#222">Büro-PC bis</text>
  <text x="46" y="237" font-size="14" font-weight="700" fill="#222">Gaming-PC</text>
  <text x="46" y="254" font-size="14" font-weight="700" fill="#222">/ Laptop</text>
  <rect x="136" y="204" width="80" height="58" rx="6" fill="#eef4ff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="176" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Core i3–i9</text>
  <rect x="220" y="204" width="88" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="264" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Ryzen,</text>
  <text x="264" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Athlon</text>
  <rect x="312" y="204" width="78" height="58" rx="6" fill="#eceef1"/>

  <!-- Zeile 4: Workstation -->
  <rect x="12" y="282" width="20" height="15" rx="2" fill="none" stroke="#555" stroke-width="2"/>
  <rect x="35" y="280" width="6" height="22" rx="1" fill="#555"/>
  <path d="M22,297 v5 M16,303 h12" stroke="#555" stroke-width="2"/>
  <text x="46" y="296" font-size="14" font-weight="700" fill="#222">Workstation</text>
  <rect x="136" y="266" width="80" height="58" rx="6" fill="#eef4ff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="176" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Xeon</text>
  <rect x="220" y="266" width="88" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="264" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Threadripper</text>
  <rect x="312" y="266" width="78" height="58" rx="6" fill="#eceef1"/>

  <!-- Zeile 5: Server -->
  <rect x="16" y="340" width="26" height="36" rx="2" fill="none" stroke="#555" stroke-width="2"/>
  <path d="M20,349 h18 M20,358 h18 M20,367 h18" stroke="#555" stroke-width="2"/>
  <text x="50" y="363" font-size="14" font-weight="700" fill="#222">Server</text>
  <rect x="136" y="328" width="80" height="58" rx="6" fill="#eef4ff" stroke="#3a6ed8" stroke-width="1.5"/>
  <text x="176" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Xeon</text>
  <rect x="220" y="328" width="88" height="58" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="264" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#222">EPYC</text>
  <rect x="312" y="328" width="78" height="58" rx="6" fill="#eceef1"/>
</svg>
