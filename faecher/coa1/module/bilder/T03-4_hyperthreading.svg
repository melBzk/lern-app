<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Hyper-Threading. Oben, was wirklich drin ist: ein physischer Kern; zwei Warteschlangen, Thread A und Thread B, führen in diesen einen Kern. Im Kern sind einige Teile gerade frei, Thread B nutzt solche freien Teile. Unten, was das Betriebssystem sieht: zwei logische Prozessoren, 1 und 2. Hinweis: Thread B nutzt freie Teile desselben Kerns, es ist kein zweiter echter Kern.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Hyper-Threading</text>

<text x="20" y="58" font-size="15" font-weight="700">Was wirklich drin ist</text>
<!-- Thread A -->
<text x="18" y="96" font-size="14" font-weight="700" fill="#E07B00">Thread A</text>
<g fill="#E07B00"><rect x="18" y="104" width="18" height="18" rx="3"/><rect x="40" y="104" width="18" height="18" rx="3"/><rect x="62" y="104" width="18" height="18" rx="3"/></g>
<line x1="86" y1="113" x2="146" y2="113" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<!-- Thread B -->
<text x="18" y="174" font-size="14" font-weight="700" fill="#7b3fa0">Thread B</text>
<g fill="#7b3fa0"><rect x="18" y="182" width="18" height="18" rx="3"/><rect x="40" y="182" width="18" height="18" rx="3"/><rect x="62" y="182" width="18" height="18" rx="3"/></g>
<line x1="86" y1="191" x2="146" y2="191" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- Kern -->
<rect x="150" y="70" width="232" height="160" rx="10" fill="#3a6ed8"/>
<text x="266" y="94" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">1 physischer Kern</text>
<rect x="160" y="106" width="66" height="54" rx="5" fill="#E07B00"/>
<text x="193" y="139" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">A</text>
<rect x="233" y="106" width="66" height="54" rx="5" fill="#E07B00"/>
<text x="266" y="139" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">A</text>
<rect x="306" y="106" width="66" height="54" rx="5" fill="#7b3fa0"/>
<text x="339" y="139" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">B</text>
<rect x="160" y="166" width="66" height="54" rx="5" fill="#7b3fa0"/>
<text x="193" y="199" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">B</text>
<rect x="233" y="166" width="66" height="54" rx="5" fill="#d9d9d9"/>
<text x="266" y="189" font-size="13" text-anchor="middle" fill="#444">gerade</text>
<text x="266" y="205" font-size="13" text-anchor="middle" fill="#444">frei</text>
<rect x="306" y="166" width="66" height="54" rx="5" fill="#d9d9d9"/>
<text x="339" y="189" font-size="13" text-anchor="middle" fill="#444">gerade</text>
<text x="339" y="205" font-size="13" text-anchor="middle" fill="#444">frei</text>

<!-- Pfeil -->
<line x1="266" y1="236" x2="266" y2="282" stroke="#E07B00" stroke-width="3.5" marker-end="url(#o)"/>
<text x="254" y="264" font-size="15" text-anchor="end" font-weight="700" fill="#E07B00">Hyper-Threading</text>

<text x="20" y="308" font-size="15" font-weight="700">Was das Betriebssystem sieht</text>
<rect x="20" y="320" width="172" height="62" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="106" y="346" font-size="14" text-anchor="middle" font-weight="700">logischer</text>
<text x="106" y="366" font-size="14" text-anchor="middle" font-weight="700">Prozessor 1</text>
<rect x="208" y="320" width="172" height="62" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="294" y="346" font-size="14" text-anchor="middle" font-weight="700">logischer</text>
<text x="294" y="366" font-size="14" text-anchor="middle" font-weight="700">Prozessor 2</text>

<rect x="10" y="398" width="380" height="62" rx="10" fill="#fdf0e0" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="424" font-size="14" text-anchor="middle">Thread B nutzt freie Teile desselben Kerns –</text>
<text x="200" y="446" font-size="15" text-anchor="middle" font-weight="700" fill="#c25e00">kein zweiter echter Kern</text>
</svg>
