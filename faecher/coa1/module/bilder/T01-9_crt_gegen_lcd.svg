<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif">
  <title>Röhrenmonitor gegen Flachbildschirm, von der Seite gesehen. Links der CRT-Röhrenmonitor: tief, groß und schwer, viel Strom, Strahlung. Rechts der flache LCD- oder TFT-Monitor: wenig Strom, keine schädliche Strahlung. Ein Pfeil zeigt: LCD löst CRT ab. Unten: Ein CRT darf nur über einen zugelassenen Fachbetrieb entsorgt werden, weil in der Glasröhre ein Vakuum ist.</title>
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a6ed8"/>
    </marker>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777"/>
    </marker>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E07B00"/>
    </marker>
  </defs>
  <rect width="400" height="450" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Röhre gegen Flachbildschirm</text>
  <text x="200" y="47" text-anchor="middle" font-size="13" fill="#555">(von der Seite gesehen)</text>

  <!-- Pfeil löst ab -->
  <line x1="168" y1="128" x2="250" y2="128" stroke="#3a6ed8" stroke-width="3.5" marker-end="url(#pf)"/>
  <text x="209" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6ed8">löst ab</text>

  <!-- CRT Seitenansicht -->
  <rect x="22" y="72" width="14" height="112" rx="3" fill="#cfc8b8" stroke="#8a8270" stroke-width="2"/>
  <path d="M36,76 H90 L150,104 V152 L90,180 H36 Z" fill="#e6e0d2" stroke="#8a8270" stroke-width="2"/>
  <rect x="44" y="184" width="76" height="9" rx="2" fill="#b8b0a0"/>
  <line x1="24" y1="206" x2="148" y2="206" stroke="#777" stroke-width="1.8" marker-start="url(#pg)" marker-end="url(#pg)"/>
  <text x="86" y="224" text-anchor="middle" font-size="13" fill="#555">sehr tief</text>

  <!-- LCD Seitenansicht -->
  <rect x="300" y="66" width="9" height="120" rx="2" fill="#9fb4d6" stroke="#3a5a8a" stroke-width="2"/>
  <rect x="302" y="186" width="5" height="14" fill="#777"/>
  <rect x="276" y="200" width="56" height="6" rx="2" fill="#777"/>
  <text x="304" y="224" text-anchor="middle" font-size="13" fill="#555">flach</text>

  <line x1="200" y1="240" x2="200" y2="356" stroke="#ddd" stroke-width="1"/>

  <!-- CRT Eigenschaften -->
  <text x="14" y="256" font-size="16" font-weight="700" fill="#222">CRT (Röhre)</text>
  <!-- Hantel -->
  <rect x="16" y="276" width="24" height="4" fill="#555"/>
  <rect x="14" y="270" width="6" height="16" rx="1" fill="#555"/>
  <rect x="36" y="270" width="6" height="16" rx="1" fill="#555"/>
  <text x="50" y="283" font-size="14" fill="#222">groß und schwer</text>
  <!-- Blitz -->
  <path d="M30,298 L20,316 H28 L24,330 L38,310 H30 L34,298 Z" fill="#E07B00"/>
  <text x="50" y="319" font-size="14" fill="#222">viel Strom</text>
  <!-- Warnzeichen -->
  <path d="M28,338 L42,362 H14 Z" fill="#E07B00"/>
  <text x="28" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">!</text>
  <text x="50" y="355" font-size="14" fill="#222">Strahlung</text>

  <!-- LCD Eigenschaften -->
  <text x="214" y="256" font-size="16" font-weight="700" fill="#222">LCD / TFT (flach)</text>
  <path d="M230,298 L220,316 H228 L224,330 L238,310 H230 L234,298 Z" fill="#2e9d5b"/>
  <text x="250" y="319" font-size="14" fill="#222">wenig Strom</text>
  <circle cx="229" cy="350" r="11" fill="#2e9d5b"/>
  <path d="M223,350 L228,355 L236,345" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="250" y="346" font-size="14" fill="#222">keine schädliche</text>
  <text x="250" y="363" font-size="14" fill="#222">Strahlung</text>

  <!-- Entsorgung -->
  <rect x="10" y="378" width="380" height="58" rx="8" fill="#fff3cd" stroke="#E07B00" stroke-width="2"/>
  <path d="M44,394 A14,14 0 1 1 30,406" fill="none" stroke="#E07B00" stroke-width="3" marker-end="url(#po)"/>
  <path d="M30,414 A14,14 0 0 1 36,396" fill="none" stroke="#E07B00" stroke-width="3" marker-end="url(#po)"/>
  <text x="66" y="401" font-size="14" font-weight="700" fill="#222">CRT entsorgen nur über Fachbetrieb</text>
  <text x="66" y="421" font-size="14" fill="#222">(Vakuum in der Glasröhre)</text>
</svg>
