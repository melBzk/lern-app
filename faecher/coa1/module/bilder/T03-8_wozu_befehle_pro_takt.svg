<rect x="146" y="279" width="8" height="5" rx="1" fill="#E07B00" stroke="none" stroke-width="0"/><circle cx="150" cy="306" r="20" fill="#fff" stroke="#E07B00" stroke-width="3"/><line x1="150" y1="306" x2="150" y2="293.0" stroke="#333" stroke-width="2.5"/><line x1="150" y1="306" x2="160.0" y2="310.0" stroke="#333" stroke-width="2.5"/>
<text x="184" y="304" font-size="15" font-weight="700" fill="#2f6b4f">Benchmark misst es</text>
