<text x="105" y="150" font-size="14" text-anchor="middle" font-weight="700">gleicher Takt</text>
<text x="105" y="174" font-size="14" text-anchor="middle" font-weight="700" fill="#3a6ed8">1 Befehl pro Takt</text>
