<text x="295" y="150" font-size="14" text-anchor="middle" font-weight="700">gleicher Takt</text>
<text x="295" y="174" font-size="14" text-anchor="middle" font-weight="700" fill="#E07B00">2 Befehle pro Takt</text>
<text x="200" y="228" font-size="16" text-anchor="middle" font-weight="700" fill="#c62828">unterschiedlich viel Leistung</text>
