<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Im IT-Alltag: Eine Kundin sagt in einer Sprechblase: Bitte schauen Sie sich unser Netz an. Darunter drei Fragen, die du zuerst stellst, jede mit Symbol: Ein Gebäude? Das wäre ein LAN. Mehrere Gebäude auf einem Gelände? Das wäre ein CAN. Filialen in der ganzen Stadt? Das wäre ein MAN. Unten das Ergebnis: Davon hängt ab, welche Technik nötig ist.</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
<rect width="400" height="470" fill="#fff"/>
<!-- Kundin -->
<circle cx="40" cy="38" r="12" fill="#555"/><path d="M22,78 Q22,54 40,54 Q58,54 58,78 Z" fill="#555"/>
<path d="M80,14 H380 Q388,14 388,22 V62 Q388,70 380,70 H92 L80,80 L84,70 Q76,70 76,62 V22 Q76,14 84,14 Z" fill="#f4f6f9" stroke="#9aa3ad" stroke-width="1.5"/>
<text x="232" y="38" text-anchor="middle" font-size="14">„Bitte schauen Sie sich</text>
<text x="232" y="58" text-anchor="middle" font-size="14">unser Netz an.“</text>
<text x="20" y="114" font-size="16" font-weight="700" fill="#1d3f8a">Du fragst zuerst:</text>
<!-- Frage 1 -->
<rect x="12" y="128" width="376" height="62" rx="8" fill="#eef4fd" stroke="#3a6ed8" stroke-width="1.5"/>
<g transform="translate(46,163) scale(1.3)"><path d="M-11,-1 L0,-11 L11,-1 Z" fill="#c62828"/><rect x="-8" y="-1" width="16" height="12" fill="#fff" stroke="#333" stroke-width="1.5"/><rect x="-2" y="4" width="4" height="7" fill="#333"/></g>
<text x="82" y="165" font-size="15" font-weight="700">Ein Gebäude?</text>
<text x="372" y="165" text-anchor="end" font-size="15" font-weight="700" fill="#3a6ed8">→ LAN</text>
<!-- Frage 2 -->
<rect x="12" y="200" width="376" height="62" rx="8" fill="#eef4fd" stroke="#3a6ed8" stroke-width="1.5"/>
<g transform="translate(46,231) scale(1.2)"><rect x="-16" y="-13" width="32" height="26" rx="3" fill="#f3f8ee" stroke="#2f6b4f" stroke-width="1.3" stroke-dasharray="3 2"/><rect x="-12" y="-4" width="7" height="13" fill="#fff" stroke="#333" stroke-width="1.2"/><rect x="-3" y="-9" width="7" height="18" fill="#fff" stroke="#333" stroke-width="1.2"/><rect x="6" y="-1" width="7" height="10" fill="#fff" stroke="#333" stroke-width="1.2"/></g>
<text x="82" y="226" font-size="15" font-weight="700">Mehrere Gebäude</text>
<text x="82" y="246" font-size="15" font-weight="700">auf einem Gelände?</text>
<text x="372" y="237" text-anchor="end" font-size="15" font-weight="700" fill="#3a6ed8">→ CAN</text>
<!-- Frage 3 -->
<rect x="12" y="272" width="376" height="62" rx="8" fill="#eef4fd" stroke="#3a6ed8" stroke-width="1.5"/>
<g transform="translate(48,305) scale(1.3)"><rect x="-14" y="-2" width="6" height="12" fill="#555"/><rect x="-8" y="-10" width="6" height="20" fill="#555"/><rect x="-1" y="-4" width="6" height="14" fill="#555"/><rect x="5" y="-12" width="6" height="22" fill="#555"/></g>
<text x="82" y="298" font-size="15" font-weight="700">Filialen in der</text>
<text x="82" y="318" font-size="15" font-weight="700">ganzen Stadt?</text>
<text x="372" y="309" text-anchor="end" font-size="15" font-weight="700" fill="#3a6ed8">→ MAN</text>
<line x1="200" y1="342" x2="200" y2="376" stroke="#E07B00" stroke-width="3.5" marker-end="url(#ar)"/>
<rect x="30" y="382" width="340" height="70" rx="10" fill="#fde3c3" stroke="#E07B00" stroke-width="2.5"/>
<text x="200" y="410" text-anchor="middle" font-size="16" font-weight="700" fill="#a85a00">Davon hängt ab,</text>
<text x="200" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#a85a00">welche Technik nötig ist.</text>
</svg>
