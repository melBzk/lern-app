<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Größenvergleich: Oben ein gelber Bus, darunter eine EUV-Anlage in derselben Länge, daneben ein Mensch als Strichfigur. Zum Staunen, nicht zum Lernen: Die Anlage wiegt ca. 200 Tonnen und hat Hunderttausende Teile, laut Hersteller. Darunter zwei Preisschilder: normale EUV-Anlage ca. 200 Millionen US-Dollar; neueste Bauart High-NA ca. 400 Millionen US-Dollar. Preise in US-Dollar, laut Presse.</title>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">So groß wie ein Bus</text>

<!-- Bus -->
<rect x="24" y="54" width="300" height="70" rx="10" fill="#ffd43b" stroke="#555" stroke-width="2"/>
<g fill="#e8f0fe" stroke="#555" stroke-width="1.5">
<rect x="40" y="64" width="36" height="26" rx="3"/><rect x="84" y="64" width="36" height="26" rx="3"/><rect x="128" y="64" width="36" height="26" rx="3"/><rect x="172" y="64" width="36" height="26" rx="3"/><rect x="216" y="64" width="36" height="26" rx="3"/><rect x="262" y="64" width="50" height="26" rx="3"/>
</g>
<g fill="#333"><circle cx="76" cy="126" r="12"/><circle cx="270" cy="126" r="12"/></g>
<text x="174" y="114" text-anchor="middle" font-size="14" font-weight="700">Bus</text>

<!-- EUV-Anlage -->
<rect x="24" y="166" width="300" height="70" rx="4" fill="#5b6470"/>
<g fill="#9aa5b1">
<rect x="34" y="176" width="70" height="50" rx="3"/><rect x="112" y="176" width="110" height="50" rx="3"/><rect x="230" y="176" width="84" height="50" rx="3"/>
</g>
<text x="174" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#222">EUV-Anlage</text>
<path d="M24,246 V254 M324,246 V254 M24,250 H324" stroke="#555" stroke-width="1.5"/>
<text x="174" y="270" text-anchor="middle" font-size="13" fill="#555">gleich lang</text>

<!-- Mensch (Größenvergleich) -->
<g stroke="#222" stroke-width="3" stroke-linecap="round" fill="none">
<circle cx="358" cy="200" r="6"/>
<path d="M358,206 V222 M348,212 H368 M358,222 L350,236 M358,222 L366,236"/>
</g>
<text x="358" y="254" text-anchor="middle" font-size="13" fill="#555">Mensch</text>

<!-- Fakten -->
<text x="24" y="296" font-size="13" font-weight="700" fill="#c25e00">zum Staunen:</text>
<text x="24" y="316" font-size="15"><tspan font-weight="700">ca. 200 t schwer</tspan> · Hunderttausende Teile</text>

<!-- Preisschilder -->
<path d="M14,344 H180 V412 H14 L4,378 Z" fill="#f4f5f7" stroke="#555" stroke-width="2"/>
<circle cx="20" cy="378" r="4" fill="#fff" stroke="#555"/>
<text x="98" y="368" text-anchor="middle" font-size="14" font-weight="700">normale EUV-Anlage</text>
<text x="98" y="392" text-anchor="middle" font-size="15">ca. 200 Mio. US-$</text>
<path d="M210,344 H396 V412 H210 L200,378 Z" fill="#fff4e0" stroke="#E07B00" stroke-width="2.5"/>
<circle cx="216" cy="378" r="4" fill="#fff" stroke="#E07B00"/>
<text x="304" y="368" text-anchor="middle" font-size="14" font-weight="700">neueste Bauart</text>
<text x="304" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#c25e00">ca. 400 Mio. US-$</text>
<text x="200" y="438" text-anchor="middle" font-size="13" fill="#555">Preise in US-Dollar, laut Presse</text>
<text x="200" y="458" text-anchor="middle" font-size="13" fill="#555">Größe, Gewicht, Teile: laut Hersteller (Zeiss)</text>
</svg>
