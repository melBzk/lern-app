<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 525" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Klickpfad als Treppe in 6 Stufen: 1 Windows-Taste, erweiterte Systemeinstellungen tippen. 2 Registerkarte Erweitert. 3 Leistung, Einstellungen. 4 Registerkarte Erweitert. 5 Virtueller Arbeitsspeicher, Ändern. 6 Fenster Virtueller Arbeitsspeicher: Häkchen bei Dateigröße für alle Laufwerke automatisch verwalten, Laufwerk C: markiert, Auswahl Benutzerdefinierte Größe, Größe wird vom System verwaltet oder Keine Auslagerungsdatei.</title>
<rect width="400" height="525" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Zur Einstellung in 6 Schritten</text>
<rect x="10" y="44" width="380" height="50" rx="8" fill="#f4f1ee" stroke="#888" stroke-width="1.5"/>
<circle cx="30" cy="69" r="12" fill="#E07B00"/><text x="30" y="74" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<text x="50" y="64" font-size="14" font-weight="700">Windows-Taste →</text>
<text x="50" y="84" font-size="13">‚erweiterte Systemeinstellungen‘ tippen</text>
<rect x="24" y="102" width="366" height="38" rx="8" fill="#f4f1ee" stroke="#888" stroke-width="1.5"/>
<circle cx="44" cy="121" r="12" fill="#E07B00"/><text x="44" y="126" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<text x="64" y="126" font-size="14" font-weight="700">Registerkarte Erweitert</text>
<rect x="38" y="148" width="352" height="38" rx="8" fill="#f4f1ee" stroke="#888" stroke-width="1.5"/>
<circle cx="58" cy="167" r="12" fill="#E07B00"/><text x="58" y="172" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<text x="78" y="172" font-size="14" font-weight="700">Leistung → Einstellungen</text>
<rect x="52" y="194" width="338" height="38" rx="8" fill="#f4f1ee" stroke="#888" stroke-width="1.5"/>
<circle cx="72" cy="213" r="12" fill="#E07B00"/><text x="72" y="218" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<text x="92" y="218" font-size="14" font-weight="700">Registerkarte Erweitert</text>
<rect x="66" y="240" width="324" height="38" rx="8" fill="#f4f1ee" stroke="#888" stroke-width="1.5"/>
<circle cx="86" cy="259" r="12" fill="#E07B00"/><text x="86" y="264" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<text x="106" y="264" font-size="14" font-weight="700">Virtueller Arbeitsspeicher → Ändern</text>
<rect x="10" y="290" width="380" height="226" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M10,298 a8,8 0 0 1 8,-8 h364 a8,8 0 0 1 8,8 v22 h-380 z" fill="#3b4a5c"/>
<circle cx="30" cy="305" r="12" fill="#E07B00"/><text x="30" y="310" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<text x="50" y="310" font-size="14" font-weight="700" fill="#fff">Virtueller Arbeitsspeicher</text>
<rect x="24" y="334" width="17" height="17" rx="3" fill="#3a6ed8"/>
<path d="M27,343 l4,4 l7,-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<text x="50" y="347" font-size="13" font-weight="700">Dateigröße für alle Laufwerke</text>
<text x="50" y="365" font-size="13" font-weight="700">automatisch verwalten</text>
<rect x="24" y="376" width="352" height="44" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
<rect x="27" y="379" width="346" height="24" fill="#3a6ed8" stroke="#E07B00" stroke-width="2.5"/>
<text x="38" y="396" font-size="14" font-weight="700" fill="#fff">C:</text>
<circle cx="33" cy="439" r="8" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="50" y="444" font-size="13">Benutzerdefinierte Größe</text>
<circle cx="33" cy="465" r="8" fill="#fff" stroke="#555" stroke-width="2"/>
<circle cx="33" cy="465" r="4" fill="#222"/>
<text x="50" y="470" font-size="13">Größe wird vom System verwaltet</text>
<circle cx="33" cy="491" r="8" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="50" y="496" font-size="13">Keine Auslagerungsdatei</text>
</svg>
