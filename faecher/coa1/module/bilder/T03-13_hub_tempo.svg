<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif">
  <title>Zwei Wege von einer USB-3.0-Festplatte zum PC. Weg 1 über einen USB-2.0-Hub: dünner Pfeil, nur Hi-Speed mit 480 Megabit pro Sekunde, praktisch etwa 40 Megabyte pro Sekunde, langsam wie eine Schnecke. Weg 2 direkt an der blauen USB-3.0-Buchse: dicker Pfeil, 5 Gigabit pro Sekunde, praktisch etwa 450 Megabyte pro Sekunde, schnell wie eine Rakete. 10 Gigabyte kopieren dauert über den Hub etwa 250 Sekunden, direkt etwa 22 Sekunden.</title>
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="400" height="440" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">USB-3.0-Platte: Hub oder direkt?</text>

  <!-- Weg 1 -->
  <circle cx="30" cy="62" r="13" fill="#555"/>
  <text x="30" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="52" y="67" font-size="15" font-weight="700" fill="#222">über USB-2.0-Hub</text>

  <rect x="14" y="88" width="72" height="54" rx="7" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <text x="50" y="111" text-anchor="middle" font-size="13" fill="#222">USB-3.0-</text>
  <text x="50" y="128" text-anchor="middle" font-size="13" fill="#222">Platte</text>
  <line x1="86" y1="115" x2="134" y2="115" stroke="#555" stroke-width="2.5"/><path d="M132,108 L144,115 L132,122 Z" fill="#555"/>
  <rect x="144" y="95" width="100" height="40" rx="7" fill="#fff" stroke="#555" stroke-width="2.5"/>
  <text x="194" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#222">USB-2.0-Hub</text>
  <line x1="244" y1="115" x2="300" y2="115" stroke="#555" stroke-width="2.5"/><path d="M298,108 L310,115 L298,122 Z" fill="#555"/>
  <rect x="310" y="84" width="74" height="62" rx="5" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <text x="347" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#222">PC</text>

  <!-- Schnecke -->
  <path d="M22,196 H78 Q84,196 82,190 L74,188" fill="#c9b48a" stroke="#555" stroke-width="2"/>
  <circle cx="50" cy="180" r="16" fill="#e2c98f" stroke="#555" stroke-width="2"/>
  <path d="M50,180 m0,-8 a8,8 0 1 1 -8,8 a5,5 0 0 1 5,-5" fill="none" stroke="#555" stroke-width="1.8"/>
  <line x1="76" y1="188" x2="82" y2="176" stroke="#555" stroke-width="2"/>
  <line x1="80" y1="189" x2="90" y2="179" stroke="#555" stroke-width="2"/>
  <text x="104" y="178" font-size="15" font-weight="700" fill="#222">Hi-Speed: 480 Mbit/s</text>
  <text x="104" y="198" font-size="14" fill="#222">praktisch ca. 40 MB/s</text>

  <line x1="14" y1="226" x2="386" y2="226" stroke="#ddd" stroke-width="2"/>

  <!-- Weg 2 -->
  <circle cx="30" cy="254" r="13" fill="#D4607A"/>
  <text x="30" y="259" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="52" y="259" font-size="15" font-weight="700" fill="#222">direkt an USB 3.0</text>

  <rect x="14" y="280" width="72" height="54" rx="7" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <text x="50" y="303" text-anchor="middle" font-size="13" fill="#222">USB-3.0-</text>
  <text x="50" y="320" text-anchor="middle" font-size="13" fill="#222">Platte</text>
  <rect x="86" y="300" width="194" height="14" fill="#D4607A"/>
  <path d="M278,290 L306,307 L278,324 Z" fill="#D4607A"/>
  <rect x="310" y="276" width="74" height="62" rx="5" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <text x="347" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#222">PC</text>
  <rect x="322" y="308" width="50" height="20" rx="2" fill="#fff" stroke="#3a6ed8" stroke-width="3"/>
  <rect x="327" y="312" width="40" height="7" fill="#3a6ed8"/>

  <!-- Rakete -->
  <g transform="translate(50,372) rotate(45)">
    <path d="M0,-24 C9,-14 9,4 6,12 H-6 C-9,4 -9,-14 0,-24 Z" fill="#fff" stroke="#555" stroke-width="2"/>
    <circle cx="0" cy="-8" r="4" fill="#3a6ed8"/>
    <path d="M-6,4 L-12,14 L-6,12 Z M6,4 L12,14 L6,12 Z" fill="#D4607A" stroke="#555" stroke-width="1.5"/>
    <path d="M-4,13 L0,24 L4,13 Z" fill="#f2a33a"/>
  </g>
  <text x="104" y="368" font-size="15" font-weight="700" fill="#D4607A">5 Gbit/s</text>
  <text x="104" y="388" font-size="14" fill="#222">praktisch ca. 450 MB/s</text>

  <!-- Fazit -->
  <rect x="14" y="404" width="372" height="30" rx="8" fill="#f4f1ee" stroke="#555"/>
  <text x="30" y="424" font-size="14" font-weight="700" fill="#222">10 GB kopieren:</text>
  <text x="160" y="424" font-size="14" fill="#222">über Hub ca. 250 s</text>
  <text x="290" y="424" font-size="14" font-weight="700" fill="#D4607A">direkt ca. 22 s</text>
</svg>
