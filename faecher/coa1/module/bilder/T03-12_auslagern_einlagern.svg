<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Oben ein voller RAM-Riegel, in Seiten unterteilt. Unten Festplatte oder SSD mit dem Bereich pagefile.sys, der Auslagerungsdatei. Die Speicherverwaltung von Windows entscheidet: Auslagern schiebt gerade nicht gebrauchte Seiten vom RAM auf die Festplatte, Einlagern holt wieder gebrauchte Seiten zurück in den RAM. Eine Schnecke zeigt: viel langsamer.</title>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker></defs>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Auslagern und Einlagern</text>
<!-- RAM -->
<text x="30" y="54" font-size="15" font-weight="700">Arbeitsspeicher (RAM)</text>
<text x="370" y="54" font-size="15" text-anchor="end" font-weight="700" fill="#c62828">RAM voll</text>
<rect x="30" y="62" width="340" height="76" rx="4" fill="#4f8a6a"/>
<g fill="#a3bcf0" stroke="#fff" stroke-width="1.5">
<rect x="40" y="70" width="38" height="28"/><rect x="80" y="70" width="38" height="28"/><rect x="120" y="70" width="38" height="28"/><rect x="160" y="70" width="38" height="28"/><rect x="200" y="70" width="38" height="28"/><rect x="240" y="70" width="38" height="28"/><rect x="280" y="70" width="38" height="28"/><rect x="320" y="70" width="40" height="28"/>
<rect x="40" y="100" width="38" height="28"/><rect x="80" y="100" width="38" height="28"/><rect x="120" y="100" width="38" height="28"/><rect x="160" y="100" width="38" height="28"/><rect x="200" y="100" width="38" height="28"/><rect x="240" y="100" width="38" height="28"/><rect x="280" y="100" width="38" height="28"/><rect x="320" y="100" width="40" height="28"/>
</g>
<line x1="36" y1="143" x2="364" y2="143" stroke="#d4a72c" stroke-width="8" stroke-dasharray="3 2"/>
<text x="200" y="162" font-size="13" text-anchor="middle" fill="#555">jedes Kästchen = eine Speicherseite</text>
<!-- Windows-Schild -->
<rect x="92" y="176" width="246" height="40" rx="8" fill="#f4f1ee" stroke="#888" stroke-width="1.5"/>
<g fill="#3a6ed8"><rect x="102" y="186" width="9" height="9"/><rect x="113" y="186" width="9" height="9"/><rect x="102" y="197" width="9" height="9"/><rect x="113" y="197" width="9" height="9"/></g>
<text x="132" y="201" font-size="14" font-weight="700">Speicherverwaltung entscheidet</text>
<!-- Pfeil Auslagern -->
<line x1="56" y1="150" x2="56" y2="372" stroke="#E07B00" stroke-width="5" marker-end="url(#o)"/>
<text x="72" y="248" font-size="15" font-weight="700" fill="#E07B00">Auslagern:</text>
<text x="72" y="267" font-size="13">gerade nicht</text>
<text x="72" y="284" font-size="13">gebrauchte Seiten</text>
<!-- Pfeil Einlagern -->
<line x1="352" y1="372" x2="352" y2="150" stroke="#3a6ed8" stroke-width="5" marker-end="url(#b)"/>
<text x="338" y="248" font-size="15" text-anchor="end" font-weight="700" fill="#3a6ed8">Einlagern:</text>
<text x="338" y="267" font-size="13" text-anchor="end">wieder</text>
<text x="338" y="284" font-size="13" text-anchor="end">gebrauchte Seiten</text>
<!-- Schnecke -->
<path d="M232,346 h66 q8,0 8,-8 l4,-14 m-4,14" fill="none" stroke="#6b5b45" stroke-width="2.5" stroke-linecap="round"/>
<path d="M240,346 q-4,-12 0,-22 q10,-14 26,-8 q14,6 12,20 q-2,10 -14,10 z" fill="#c8a27a" stroke="#6b5b45" stroke-width="2"/>
<path d="M259,330 a5,5 0 1 1 6,6 a10,10 0 1 1 -12,-10" fill="none" stroke="#6b5b45" stroke-width="1.5"/>
<path d="M298,338 l2,-10 M304,338 l6,-8" stroke="#6b5b45" stroke-width="2" stroke-linecap="round"/>
<text x="234" y="366" font-size="14" font-weight="700" fill="#c62828">viel langsamer</text>
<!-- Festplatte -->
<rect x="30" y="382" width="340" height="104" rx="8" fill="#9e9a95"/>
<text x="44" y="404" font-size="15" font-weight="700" fill="#fff">Festplatte / SSD</text>
<g fill="#d8d4cf"><rect x="44" y="416" width="34" height="26"/><rect x="82" y="416" width="34" height="26"/><rect x="44" y="446" width="34" height="26"/><rect x="82" y="446" width="34" height="26"/><rect x="120" y="446" width="34" height="26"/></g>
<rect x="172" y="396" width="186" height="80" rx="6" fill="#fdf0e0" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="265" y="428" font-size="15" text-anchor="middle" font-weight="700">pagefile.sys</text>
<text x="265" y="448" font-size="13" text-anchor="middle">(Auslagerungsdatei)</text>
<g fill="#a3bcf0" stroke="#fff" stroke-width="1.5"><rect x="224" y="454" width="22" height="16"/><rect x="248" y="454" width="22" height="16"/><rect x="272" y="454" width="22" height="16"/></g>
</svg>
