<rect x="170" y="120" width="60" height="280" rx="0" fill="#e5e5e5" stroke="none" stroke-width="0" />
<rect x="100" y="225" width="190" height="60" rx="0" fill="#e5e5e5" stroke="none" stroke-width="0" />
