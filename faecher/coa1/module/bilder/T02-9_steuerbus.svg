<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 455" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Steuerbus als Ampel an einer Kreuzung: Die CPU steuert die Ampel und fragt: lesen oder schreiben, Empfänger oder Absender? Die Grafikkarte hat grün und sendet jetzt, Arbeitsspeicher und Tastatur haben rot und warten.</title>
