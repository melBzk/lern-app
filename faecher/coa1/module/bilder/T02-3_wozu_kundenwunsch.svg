<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, sans-serif" fill="#222">
<title>Vom Kundenwunsch zur Auswahl: Eine Sprechblase fragt „Kleiner, leiser Büro-PC – welches Board, welches Gehäuse?“. Pfeil nach unten zur Antwort: ein microATX-Board in einem Mini Tower. Darunter: Begründung mit der Größe.</title>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Vom Kundenwunsch zur Hardware</text>
<!-- Sprechblase -->
<rect x="20" y="48" width="360" height="70" rx="14" fill="#f4f1ee" stroke="#999" stroke-width="1.5"/>
<path d="M60,118 L52,138 L82,118" fill="#f4f1ee" stroke="#999" stroke-width="1.5"/>
<rect x="61" y="116" width="20" height="4" fill="#f4f1ee"/>
<text x="200" y="78" text-anchor="middle" font-size="15" font-weight="700">„Kleiner, leiser Büro-PC –</text>
<text x="200" y="100" text-anchor="middle" font-size="15" font-weight="700">welches Board, welches Gehäuse?“</text>
<line x1="200" y1="134" x2="200" y2="158" stroke="#555" stroke-width="3"/><polygon points="191,156 209,156 200,170" fill="#555"/>
<!-- Mini Tower mit microATX -->
<rect x="128" y="176" width="110" height="140" rx="6" fill="#fff" stroke="#333" stroke-width="3.5"/>
<rect x="142" y="196" width="72" height="72" fill="#d4efd9" stroke="#2e9d5b" stroke-width="2.5"/>
<text x="178" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a45">microATX</text>
<circle cx="224" cy="300" r="4" fill="#333"/>
<text x="252" y="232" font-size="15" font-weight="700">Mini Tower</text>
<text x="252" y="252" font-size="13" fill="#666">(Gehäuse)</text>
<rect x="20" y="330" width="360" height="40" rx="10" fill="#fff" stroke="#D4607A" stroke-width="2"/>
<text x="200" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#D4607A">Begründung: die Größe</text>
</svg>
