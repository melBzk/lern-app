<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Fragen, zwei Werkzeuge. Links die Frage: Original kaputt oder weg? Gründe sind Überspannung, die die Festplatte zerstört, Schadsoftware und Brand. Die Antwort ist die Datensicherung, eine Kopie an einem anderen Ort. Rechts die Frage: Hat ein Fremder dein Laufwerk? Zum Beispiel wurde der Laptop gestohlen oder ist verloren. Die Antwort ist BitLocker, das Laufwerk wird verschlüsselt. Unten rot: Das eine ersetzt das andere nicht.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<g id="laptop">
<rect x="-22" y="-16" width="44" height="28" rx="3" fill="#333"/>
<rect x="-18" y="-12" width="36" height="20" fill="#9fb3cf"/>
<path d="M-28,12 L28,12 L24,18 L-24,18 Z" fill="#555"/>
</g>
</defs>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Zwei Fragen, zwei Werkzeuge</text>

<!-- Spalte links -->
<rect x="10" y="40" width="185" height="214" rx="10" fill="#eceff1"/>
<text x="102" y="64" text-anchor="middle" font-weight="700" font-size="15">Original kaputt</text>
<text x="102" y="83" text-anchor="middle" font-weight="700" font-size="15">oder weg?</text>
<!-- Festplatte mit Blitz -->
<rect x="22" y="104" width="38" height="30" rx="4" fill="#d9dde3" stroke="#444" stroke-width="1.5"/>
<circle cx="37" cy="119" r="10" fill="#9fb3cf"/><circle cx="37" cy="119" r="2.5" fill="#444"/>
<path d="M60,96 L50,114 L57,114 L51,132 L67,110 L60,110 L66,96 Z" fill="#F2B100" stroke="#222" stroke-width="1.2"/>
<text x="80" y="117">Überspannung</text>
<text x="80" y="133" font-size="13" fill="#444">Platte kaputt</text>
<!-- Käfer -->
<g transform="translate(41 174)">
<g stroke="#222" stroke-width="2"><line x1="-14" y1="-6" x2="14" y2="-6"/><line x1="-15" y1="2" x2="15" y2="2"/><line x1="-14" y1="10" x2="14" y2="10"/><line x1="-3" y1="-14" x2="-7" y2="-20"/><line x1="3" y1="-14" x2="7" y2="-20"/></g>
<ellipse cx="0" cy="3" rx="9" ry="12" fill="#c62828"/>
<circle cx="0" cy="-11" r="5" fill="#222"/>
</g>
<text x="80" y="179">Schadsoftware</text>
<!-- Flamme -->
<g transform="translate(41 224)">
<path d="M0,-20 C12,-6 14,2 10,10 A10,10 0 0 1 -10,10 C-14,2 -6,-6 0,-20 Z" fill="#e65100"/>
<path d="M0,-4 C5,2 6,6 4,10 A4,4 0 0 1 -4,10 C-6,6 -3,2 0,-4 Z" fill="#F2B100"/>
</g>
<text x="80" y="229">Brand</text>

<!-- Spalte rechts -->
<rect x="205" y="40" width="185" height="214" rx="10" fill="#eceff1"/>
<text x="297" y="64" text-anchor="middle" font-weight="700" font-size="15">Fremder hat</text>
<text x="297" y="83" text-anchor="middle" font-weight="700" font-size="15">dein Laufwerk?</text>
<!-- Dieb mit Laptop -->
<circle cx="230" cy="110" r="9" fill="#333"/>
<rect x="221" y="106" width="18" height="5" fill="#111"/>
<path d="M216,148 L216,130 Q216,121 230,121 Q244,121 244,130 L244,148 Z" fill="#333"/>
<g transform="translate(250 140) scale(0.55)"><use href="#laptop"/></g>
<text x="270" y="125">Laptop</text>
<text x="270" y="142" font-weight="700" fill="#c62828">gestohlen</text>
<!-- verlorener Laptop -->
<g transform="translate(238 206) scale(0.8)"><use href="#laptop"/></g>
<text x="238" y="208" text-anchor="middle" font-weight="700" font-size="17" fill="#222">?</text>
<text x="270" y="200">Laptop</text>
<text x="270" y="217" font-weight="700" fill="#c62828">verloren</text>

<!-- Pfeile -->
<line x1="102" y1="258" x2="102" y2="290" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<line x1="297" y1="258" x2="297" y2="290" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>

<!-- Kasten Datensicherung -->
<rect x="10" y="296" width="185" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="102" y="322" text-anchor="middle" font-weight="700" font-size="16" fill="#2e7d32">Datensicherung</text>
<text x="102" y="344" text-anchor="middle">= Kopie an einem</text>
<text x="102" y="362" text-anchor="middle">anderen Ort</text>
<!-- zwei Ordner -->
<path d="M34,384 L52,384 L58,390 L86,390 L86,426 L34,426 Z" fill="#F2B100" stroke="#8a6d00" stroke-width="1.5"/>
<path d="M118,384 L136,384 L142,390 L170,390 L170,426 L118,426 Z" fill="#F2B100" stroke="#8a6d00" stroke-width="1.5"/>
<line x1="90" y1="408" x2="114" y2="408" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#k)"/>

<!-- Kasten BitLocker -->
<rect x="205" y="296" width="185" height="150" rx="10" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="297" y="322" text-anchor="middle" font-weight="700" font-size="16" fill="#3a6ed8">BitLocker</text>
<text x="297" y="344" text-anchor="middle">= Laufwerk</text>
<text x="297" y="362" text-anchor="middle">verschlüsseln</text>
<!-- Schloss -->
<path d="M285,402 L285,390 A12,12 0 0 1 309,390 L309,402" fill="none" stroke="#3a6ed8" stroke-width="5"/>
<rect x="276" y="400" width="42" height="32" rx="5" fill="#3a6ed8"/>
<circle cx="297" cy="413" r="4" fill="#fff"/><rect x="295.5" y="414" width="3" height="10" fill="#fff"/>

<!-- roter Balken -->
<rect x="10" y="472" width="380" height="64" rx="10" fill="#c62828"/>
<text x="200" y="511" text-anchor="middle" font-weight="700" font-size="17" fill="#fff">Das eine ersetzt das andere nicht!</text>
</svg>
