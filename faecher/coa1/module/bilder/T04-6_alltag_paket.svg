<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Paket mit Polster und Aufkleber. Oben ein offenes Paket: innen ein Buch, beschriftet Nutzdaten, darum Füllmaterial, außen ein Adressaufkleber; Polster und Aufkleber sind der Overhead, also Verwaltung. Unten zwei Waagen: links 8b10b mit 8 kg Buch und 2 kg Verpackung, das sind 20 Prozent Verpackung. Rechts 128b/130b mit 128 kg Ware und nur einer dünnen Schicht von 2 kg Verpackung, unter 2 Prozent.</title>
<rect width="400" height="530" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Ware und Verpackung</text>

<!-- Paket -->
<path d="M70,70 L40,46 M330,70 L360,46" stroke="#8d6e63" stroke-width="4" stroke-linecap="round"/>
<rect x="70" y="70" width="260" height="150" rx="4" fill="#f3e5cc" stroke="#8d6e63" stroke-width="3"/>
<g fill="#b0b7bf">
<circle cx="88" cy="88" r="7"/><circle cx="106" cy="104" r="7"/><circle cx="86" cy="124" r="7"/><circle cx="104" cy="146" r="7"/><circle cx="88" cy="168" r="7"/><circle cx="108" cy="188" r="7"/><circle cx="90" cy="204" r="7"/>
<circle cx="312" cy="88" r="7"/><circle cx="294" cy="106" r="7"/><circle cx="314" cy="126" r="7"/><circle cx="296" cy="148" r="7"/><circle cx="312" cy="168" r="7"/>
<circle cx="140" cy="86" r="6"/><circle cx="180" cy="84" r="6"/><circle cx="220" cy="86" r="6"/><circle cx="260" cy="84" r="6"/>
<circle cx="140" cy="206" r="6"/><circle cx="180" cy="206" r="6"/><circle cx="220" cy="206" r="6"/>
</g>
<rect x="126" y="100" width="148" height="92" rx="4" fill="#3a6ed8"/>
<line x1="134" y1="100" x2="134" y2="192" stroke="#2a56b0" stroke-width="4"/>
<text x="204" y="144" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Nutzdaten</text>
<text x="204" y="166" text-anchor="middle" font-size="13" fill="#fff">(das Buch)</text>
<rect x="258" y="178" width="88" height="54" rx="4" fill="#E07B00" transform="rotate(-6 302 205)"/>
<g stroke="#fff" stroke-width="3" stroke-linecap="round" transform="rotate(-6 302 205)"><line x1="268" y1="194" x2="330" y2="194"/><line x1="268" y1="206" x2="318" y2="206"/><line x1="268" y1="218" x2="324" y2="218"/></g>
<text x="200" y="256" text-anchor="middle" font-size="14">Polster + Aufkleber</text>
<text x="200" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#E07B00">= Overhead (Verwaltung)</text>

<line x1="10" y1="296" x2="390" y2="296" stroke="#ccc" stroke-width="1.5"/>

<!-- Waage links: 8b10b -->
<text x="105" y="322" text-anchor="middle" font-size="16" font-weight="700">8b10b</text>
<rect x="65" y="340" width="80" height="20" fill="#E07B00"/>
<text x="105" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2 kg</text>
<rect x="65" y="360" width="80" height="80" fill="#3a6ed8"/>
<text x="105" y="396" text-anchor="middle" font-weight="700" fill="#fff">8 kg</text>
<text x="105" y="414" text-anchor="middle" font-weight="700" fill="#fff">Buch</text>
<rect x="45" y="440" width="120" height="6" fill="#555"/><rect x="99" y="446" width="12" height="22" fill="#555"/><rect x="55" y="468" width="100" height="10" rx="3" fill="#555"/>
<text x="105" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">20 % Verpackung</text>

<!-- Waage rechts: Scrambling -->
<text x="295" y="322" text-anchor="middle" font-size="16" font-weight="700">128b/130b</text>
<rect x="255" y="340" width="80" height="3" fill="#E07B00"/>
<text x="341" y="346" font-size="13" font-weight="700" fill="#E07B00">2 kg</text>
<rect x="255" y="343" width="80" height="97" fill="#3a6ed8"/>
<text x="295" y="388" text-anchor="middle" font-weight="700" fill="#fff">128 kg</text>
<text x="295" y="406" text-anchor="middle" font-weight="700" fill="#fff">Ware</text>
<rect x="235" y="440" width="120" height="6" fill="#555"/><rect x="289" y="446" width="12" height="22" fill="#555"/><rect x="245" y="468" width="100" height="10" rx="3" fill="#555"/>
<text x="295" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">unter 2 % Verpackung</text>
</svg>
