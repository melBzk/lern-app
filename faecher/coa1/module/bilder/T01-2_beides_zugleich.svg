<text x="204" y="120" font-size="15" text-anchor="start" font-weight="700" fill="#2f6b4f">Eingabe:</text>
<text x="204" y="140" font-size="15" text-anchor="start" fill="#2f6b4f">Tippen</text>
<line x1="140" y1="200" x2="186.2" y2="209.9" stroke="#E07B00" stroke-width="3"/><polygon points="196,212 183.0,215.4 185.5,203.6" fill="#E07B00"/>
<text x="204" y="210" font-size="15" text-anchor="start" font-weight="700" fill="#a85400">Ausgabe:</text>
<text x="204" y="230" font-size="15" text-anchor="start" fill="#a85400">Bild</text>
<rect x="8" y="294" width="384" height="236" rx="12" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
