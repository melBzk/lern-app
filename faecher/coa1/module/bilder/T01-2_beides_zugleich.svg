<text x="232" y="512" font-size="15" text-anchor="start" fill="#2f6b4f">Stimme</text>
<line x1="194" y1="420" x2="190.0" y2="420.0" stroke="#E07B00" stroke-width="3"/><polygon points="180,420 192.0,414.0 192.0,426.0" fill="#E07B00"/>
