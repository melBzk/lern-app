<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="system-ui, sans-serif" role="img">
<title>Zwei Ein- und Ausgabegeräte. Oben ein Smartphone mit Touchscreen: Ein Finger tippt darauf, grüner Pfeil ins Gerät, Eingabe durch Tippen; oranger Pfeil aus dem Bildschirm heraus, Ausgabe als Bild. Unten ein Kopf mit Headset: grüner Pfeil vom Mund zum Mikrofon, Eingabe der Stimme; oranger Pfeil von der Ohrmuschel zum Ohr, Ausgabe als Ton.</title>

