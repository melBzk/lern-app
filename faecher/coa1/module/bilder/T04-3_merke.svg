<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Merkbild PC zusammenstellen, fünf Zeilen. 1 CPU und Sockel: gleicher Hersteller, gleicher Sockel, BIOS-Version prüfen. 2 RAM-Kit: Generation, Höchstmenge, paarweise. 3 Gehäuse: laut Buch nimmt ein Midi-Tower ATX und microATX, sicher ist das Datenblatt des Gehäuses. 4 Grafikkarte und Netzteil: 75 W aus dem Steckplatz plus Zusatzstecker, Netzteil höchstens 80 Prozent Last. 5 Kühler und Paste: nach TDP wählen, Wärmeleitpaste immer, auch bei Wasserkühlung.</title>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Merke: PC zusammenstellen</text>
<g stroke="#ccc" stroke-width="1.5"><line x1="10" y1="132" x2="390" y2="132"/><line x1="10" y1="224" x2="390" y2="224"/><line x1="10" y1="316" x2="390" y2="316"/><line x1="10" y1="408" x2="390" y2="408"/></g>
<g fill="#fff" font-size="14" font-weight="700" text-anchor="middle">
<circle cx="22" cy="58" r="12" fill="#D4607A"/><text x="22" y="63">1</text>
<circle cx="22" cy="150" r="12" fill="#D4607A"/><text x="22" y="155">2</text>
<circle cx="22" cy="242" r="12" fill="#D4607A"/><text x="22" y="247">3</text>
<circle cx="22" cy="334" r="12" fill="#D4607A"/><text x="22" y="339">4</text>
<circle cx="22" cy="426" r="12" fill="#D4607A"/><text x="22" y="431">5</text>
</g>

<!-- 1 CPU + Sockel -->
<rect x="44" y="76" width="56" height="44" rx="3" fill="#9aa5b1"/>
<rect x="52" y="54" width="40" height="40" rx="3" fill="#455a64"/>
<rect x="62" y="64" width="20" height="20" fill="#cfd8dc"/>
<text x="112" y="68" font-size="15" font-weight="700">CPU + Sockel</text>
<text x="112" y="90">gleicher Hersteller, gleicher Sockel,</text>
<text x="112" y="110">BIOS-Version prüfen</text>

<!-- 2 RAM-Kit -->
<g fill="#2e7d32"><rect x="40" y="150" width="64" height="18" rx="2"/><rect x="40" y="178" width="64" height="18" rx="2"/></g>
<g fill="#c9a227"><rect x="43" y="164" width="58" height="3"/><rect x="43" y="192" width="58" height="3"/></g>
<rect x="66" y="144" width="12" height="58" fill="#D4607A"/>
<text x="112" y="160" font-size="15" font-weight="700">RAM</text>
<text x="112" y="182">Generation, Höchstmenge,</text>
<text x="112" y="202">paarweise (Kit)</text>

<!-- 3 Gehäuse -->
<rect x="56" y="236" width="36" height="74" rx="3" fill="#eceff1" stroke="#333" stroke-width="2.5"/>
<line x1="62" y1="248" x2="86" y2="248" stroke="#555" stroke-width="2.5"/>
<circle cx="74" cy="296" r="4" fill="none" stroke="#555" stroke-width="2"/>
<text x="112" y="252" font-size="15" font-weight="700">Gehäuse</text>
<text x="112" y="274">Buch: Midi-Tower = ATX, microATX</text>
<text x="112" y="294" font-weight="700" fill="#c62828">sicher: Datenblatt des Gehäuses</text>

<!-- 4 Grafikkarte + Netzteil -->
<rect x="40" y="332" width="66" height="24" rx="3" fill="#455a64"/>
<g fill="none" stroke="#cfd8dc" stroke-width="2"><circle cx="58" cy="344" r="8"/><circle cx="88" cy="344" r="8"/></g>
<rect x="48" y="356" width="40" height="4" fill="#c9a227"/>
<rect x="52" y="370" width="42" height="30" rx="3" fill="#9aa5b1"/>
<circle cx="73" cy="385" r="10" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="112" y="344" font-size="15" font-weight="700">Grafikkarte + Netzteil</text>
<text x="112" y="366">75 W Steckplatz + Zusatzstecker,</text>
<text x="112" y="386">Netzteil höchstens 80 % Last</text>

<!-- 5 Kühler + Paste -->
<rect x="44" y="424" width="50" height="12" rx="2" fill="#3a6ed8"/>
<g fill="#9aa5b1"><rect x="46" y="438" width="5" height="26"/><rect x="55" y="438" width="5" height="26"/><rect x="64" y="438" width="5" height="26"/><rect x="73" y="438" width="5" height="26"/><rect x="82" y="438" width="5" height="26"/><rect x="89" y="438" width="5" height="26"/></g>
<path d="M92,476 h-40 a4,4 0 0 1 0,-8 h40 l8,4 z" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="112" y="436" font-size="15" font-weight="700">Kühler + Paste</text>
<text x="112" y="458">nach TDP wählen,</text>
<text x="112" y="478">Paste immer – auch bei Wasser</text>
</svg>
