<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Paste oder Pad und der Kühler aus der Packung. Oben zwei vergrößerte Schnitte: Kühlkörper und Prozessor haben raue Oberflächen. Variante A: Wärmeleitpaste füllt die Lücken. Variante B: Ein Wärmeleitpad, ein Plättchen, füllt die Lücken. Eine durchgestrichene Luftblase zeigt: Luft bremst die Wärme. Unten eine Schachtel Boxed oder In-A-Box mit Prozessor und passendem Kühler; Häkchen: reicht für normale Nutzung.</title>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Paste oder Pad – stark vergrößert</text>
<rect x="8" y="44" width="185" height="196" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="100.5" y="68" text-anchor="middle" font-size="15" font-weight="700">A  Wärmeleitpaste</text>
<path d="M20,76 L181,76 L181,112 L180,112 L170,104 L160,112 L150,104 L140,112 L130,104 L120,112 L110,104 L100,112 L90,104 L80,112 L70,104 L60,112 L50,104 L40,112 L30,104 L20,112 Z" fill="#9aa5b1"/>
<text x="100.5" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Kühlkörper</text>
<path d="M20,112 L20,112 L30,104 L40,112 L50,104 L60,112 L70,104 L80,112 L90,104 L100,112 L110,104 L120,112 L130,104 L140,112 L150,104 L160,112 L170,104 L180,112 L180,150 L170,140 L160,150 L150,140 L140,150 L130,140 L120,150 L110,140 L100,150 L90,140 L80,150 L70,140 L60,150 L50,140 L40,150 L30,140 L20,150 Z" fill="#E07B00" />
<path d="M20,200 L20,150 L30,140 L40,150 L50,140 L60,150 L70,140 L80,150 L90,140 L100,150 L110,140 L120,150 L130,140 L140,150 L150,140 L160,150 L170,140 L180,150 L181,200 Z" fill="#555"/>
<text x="100.5" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Prozessor</text>
<text x="100.5" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#E07B00">füllt die Lücken</text>

<rect x="207" y="44" width="185" height="196" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="299.5" y="68" text-anchor="middle" font-size="15" font-weight="700">B  Wärmeleitpad</text>
<path d="M219,76 L380,76 L380,112 L379,112 L369,104 L359,112 L349,104 L339,112 L329,104 L319,112 L309,104 L299,112 L289,104 L279,112 L269,104 L259,112 L249,104 L239,112 L229,104 L219,112 Z" fill="#9aa5b1"/>
<text x="299.5" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Kühlkörper</text>
<path d="M219,112 L219,112 L229,104 L239,112 L249,104 L259,112 L269,104 L279,112 L289,104 L299,112 L309,104 L319,112 L329,104 L339,112 L349,104 L359,112 L369,104 L379,112 L379,150 L369,140 L359,150 L349,140 L339,150 L329,140 L319,150 L309,140 L299,150 L289,140 L279,150 L269,140 L259,150 L249,140 L239,150 L229,140 L219,150 Z" fill="#f0a040" stroke="#8a4b00" stroke-width="2"/>
<path d="M219,200 L219,150 L229,140 L239,150 L249,140 L259,150 L269,140 L279,150 L289,140 L299,150 L309,140 L319,150 L329,140 L339,150 L349,140 L359,150 L369,140 L379,150 L380,200 Z" fill="#555"/>
<text x="299.5" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Prozessor</text>
<text x="299.5" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#E07B00">Plättchen füllt die Lücken</text>

<!-- Luftblase -->
<circle cx="48" cy="276" r="22" fill="#e3f2fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="48" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">Luft</text>
<line x1="28" y1="300" x2="68" y2="252" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
<text x="84" y="272" font-size="15" font-weight="700" fill="#c62828">Luft bremst die Wärme</text>
<text x="84" y="292" font-size="14">darum: Paste oder Pad dazwischen</text>
<line x1="10" y1="320" x2="390" y2="320" stroke="#ccc" stroke-width="1.5"/>

<!-- Boxed -->
<text x="16" y="348" font-size="15" font-weight="700">Kühler aus der Packung</text>
<!-- Kühler ragt heraus -->
<g>
<rect x="50" y="368" width="96" height="22" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="98" cy="379" r="8" fill="none" stroke="#3a6ed8" stroke-width="2"/>
<rect x="54" y="390" width="6" height="34" fill="#9aa5b1"/><rect x="66" y="390" width="6" height="34" fill="#9aa5b1"/><rect x="78" y="390" width="6" height="34" fill="#9aa5b1"/><rect x="90" y="390" width="6" height="34" fill="#9aa5b1"/><rect x="102" y="390" width="6" height="34" fill="#9aa5b1"/><rect x="114" y="390" width="6" height="34" fill="#9aa5b1"/><rect x="126" y="390" width="6" height="34" fill="#9aa5b1"/><rect x="138" y="390" width="6" height="34" fill="#9aa5b1"/>
</g>
<rect x="170" y="384" width="44" height="40" rx="3" fill="#555"/>
<rect x="180" y="394" width="24" height="20" fill="#c9ced4"/>
<text x="98" y="362" text-anchor="middle" font-size="13" font-weight="700">Kühler</text>
<text x="192" y="378" text-anchor="middle" font-size="13" font-weight="700">Prozessor</text>
<!-- Schachtel -->
<path d="M30,420 L230,420 L250,406 L50,406 Z" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="30" y="420" width="200" height="110" fill="#eceff1" stroke="#555" stroke-width="2"/>
<path d="M230,420 L250,406 L250,516 L230,530 Z" fill="#b0bec5" stroke="#555" stroke-width="2"/>
<text x="130" y="468" text-anchor="middle" font-size="17" font-weight="700">Boxed</text>
<text x="130" y="492" text-anchor="middle" font-size="15" font-weight="700">In-A-Box</text>
<!-- Häkchen -->
<circle cx="296" cy="452" r="22" fill="#2e7d32"/>
<path d="M285,452 L293,461 L308,443" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266" y="496" font-weight="700" fill="#2e7d32">reicht für</text>
<text x="266" y="514" font-weight="700" fill="#2e7d32">normale Nutzung</text>
</svg>
