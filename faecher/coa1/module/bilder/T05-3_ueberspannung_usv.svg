<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Überspannung ist eine häufige Ursache für den Totalausfall. Obere Zeile ohne Schutz: Blitz, Steckdose, PC, die Elektronik-Platine der Festplatte wird zerstört (rotes Kreuz). Untere Zeile mit USV: Blitz, Steckdose, USV filtert Spannungsspitzen, PC, die Platine ist geschützt (grüner Haken).</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Überspannung</text>
<text x="200" y="46" text-anchor="middle" font-size="14">häufige Ursache für den Totalausfall</text>

<!-- Zeile 1 ohne Schutz -->
<rect x="6" y="62" width="388" height="138" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="16" y="82" font-weight="700" fill="#c62828">ohne Schutz</text>
<path d="M38,106 L24,131 L35,131 L30,150 L48,123 L37,123 L44,106 Z" fill="#f2b705" stroke="#8a6d00" stroke-width="1.2"/><rect x="90" y="108" width="40" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><circle cx="110" cy="128" r="13" fill="#eceff1" stroke="#555" stroke-width="1.5"/><circle cx="105" cy="128" r="2.5" fill="#222"/><circle cx="115" cy="128" r="2.5" fill="#222"/><rect x="247" y="104" width="30" height="48" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><line x1="253" y1="114" x2="271" y2="114" stroke="#555" stroke-width="2"/><circle cx="262" cy="140" r="3" fill="#555"/><rect x="322" y="111" width="48" height="34" rx="3" fill="#2e7d32"/><rect x="332" y="120" width="14" height="12" fill="#222"/><rect x="350" y="122" width="12" height="7" fill="#222"/>
<line x1="52" y1="128" x2="86" y2="128" stroke="#c62828" stroke-width="2.5" marker-end="url(#r)"/>
<path d="M134,128 l12,-8 l12,16 l12,-16 l12,16 l12,-16 l12,8 l10,0" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="282" y1="128" x2="318" y2="128" stroke="#c62828" stroke-width="2.5" marker-end="url(#r)"/>
<g stroke="#c62828" stroke-width="5" stroke-linecap="round"><line x1="330" y1="112" x2="362" y2="144"/><line x1="362" y1="112" x2="330" y2="144"/></g>
<g text-anchor="middle" font-size="13">
<text x="36" y="174">Blitz</text><text x="110" y="174">Steckdose</text><text x="186" y="174" fill="#c62828">Spannungsspitze</text><text x="262" y="174">PC</text>
<text x="346" y="174" font-weight="700" fill="#c62828">Platine</text><text x="346" y="191" font-weight="700" fill="#c62828">zerstört</text>
</g>

<!-- Zeile 2 mit USV -->
<rect x="6" y="224" width="388" height="160" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="16" y="244" font-weight="700" fill="#2e7d32">mit USV</text>
<path d="M38,270 L24,295 L35,295 L30,314 L48,287 L37,287 L44,270 Z" fill="#f2b705" stroke="#8a6d00" stroke-width="1.2"/><rect x="90" y="272" width="40" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><circle cx="110" cy="292" r="13" fill="#eceff1" stroke="#555" stroke-width="1.5"/><circle cx="105" cy="292" r="2.5" fill="#222"/><circle cx="115" cy="292" r="2.5" fill="#222"/><rect x="162" y="270" width="48" height="44" rx="5" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/><rect x="174" y="280" width="22" height="12" fill="none" stroke="#3a6ed8" stroke-width="2"/><rect x="196" y="283" width="3" height="6" fill="#3a6ed8"/><text x="186" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">USV</text><rect x="247" y="268" width="30" height="48" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><line x1="253" y1="278" x2="271" y2="278" stroke="#555" stroke-width="2"/><circle cx="262" cy="304" r="3" fill="#555"/><rect x="322" y="275" width="48" height="34" rx="3" fill="#2e7d32"/><rect x="332" y="284" width="14" height="12" fill="#222"/><rect x="350" y="286" width="12" height="7" fill="#222"/>
<line x1="52" y1="292" x2="86" y2="292" stroke="#c62828" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="132" y1="292" x2="158" y2="292" stroke="#c62828" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="212" y1="292" x2="243" y2="292" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<line x1="279" y1="292" x2="318" y2="292" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<path d="M334,292 l8,9 l16,-19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M334,292 l8,9 l16,-19" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g text-anchor="middle" font-size="13">
<text x="36" y="338">Blitz</text><text x="110" y="338">Steckdose</text>
<text x="186" y="338" font-weight="700" fill="#3a6ed8">filtert</text><text x="186" y="354" font-weight="700" fill="#3a6ed8">Spannungs-</text><text x="186" y="370" font-weight="700" fill="#3a6ed8">spitzen</text>
<text x="262" y="338">PC</text>
<text x="346" y="338" font-weight="700" fill="#2e7d32">Platine</text><text x="346" y="354" font-weight="700" fill="#2e7d32">geschützt</text>
</g>
</svg>
