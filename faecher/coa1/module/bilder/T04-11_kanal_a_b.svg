<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Kanal A und Kanal B auf dem Mainboard, Draufsicht. Links der CPU-Sockel, rechts vier RAM-Steckplätze: DIMM_A1 und DIMM_A2 bilden Kanal A, DIMM_B1 und DIMM_B2 bilden Kanal B. A2 und B2 sind blau. Darunter Belegungsbeispiele: 1 Modul in A2. 2 Module in A2 und B2 ergibt Dual Channel, richtig. 4 Module: alle Plätze. Falsch, rot: A1 und A2, beide in Kanal A, ergibt nur Single Channel. Fußzeile: Beispiel eines Herstellers, maßgeblich ist das Handbuch deines Boards.</title>
<rect width="400" height="660" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Kanal A und Kanal B</text>
<rect x="10" y="40" width="380" height="256" rx="10" fill="#e3ebe0" stroke="#999" stroke-width="2"/>
<rect x="24" y="112" width="116" height="116" rx="6" fill="#bbb" stroke="#777" stroke-width="2"/>
<rect x="42" y="130" width="80" height="80" rx="3" fill="#999"/>
<text x="82" y="252" font-size="15" text-anchor="middle" font-weight="700">CPU-Sockel</text>
<rect x="172" y="92" width="28" height="186" rx="3" fill="#333"/>
<text transform="translate(186,185) rotate(-90)" text-anchor="middle" dy="5" fill="#fff" font-size="15" font-weight="700">DIMM_A1</text>
<rect x="208" y="92" width="28" height="186" rx="3" fill="#3a6ed8"/>
<text transform="translate(222,185) rotate(-90)" text-anchor="middle" dy="5" fill="#fff" font-size="15" font-weight="700">DIMM_A2</text>
<rect x="268" y="92" width="28" height="186" rx="3" fill="#333"/>
<text transform="translate(282,185) rotate(-90)" text-anchor="middle" dy="5" fill="#fff" font-size="15" font-weight="700">DIMM_B1</text>
<rect x="304" y="92" width="28" height="186" rx="3" fill="#3a6ed8"/>
<text transform="translate(318,185) rotate(-90)" text-anchor="middle" dy="5" fill="#fff" font-size="15" font-weight="700">DIMM_B2</text>
<rect x="164" y="74" width="80" height="212" rx="6" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="7 5"/>
<rect x="260" y="74" width="80" height="212" rx="6" fill="none" stroke="#222" stroke-width="2.5" stroke-dasharray="7 5"/>
<rect x="170" y="60" width="68" height="22" rx="4" fill="#222"/><text x="204" y="76" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">Kanal A</text>
<rect x="266" y="60" width="68" height="22" rx="4" fill="#222"/><text x="300" y="76" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">Kanal B</text>
<text x="200" y="322" font-size="16" font-weight="700" text-anchor="middle">So stecken (Beispiel):</text>
<text x="27" y="350" font-size="13" text-anchor="middle" font-weight="700" fill="#444">A1</text>
<text x="53" y="350" font-size="13" text-anchor="middle" font-weight="700" fill="#3a6ed8">A2</text>
<text x="89" y="350" font-size="13" text-anchor="middle" font-weight="700" fill="#444">B1</text>
<text x="115" y="350" font-size="13" text-anchor="middle" font-weight="700" fill="#3a6ed8">B2</text>
<rect x="18" y="360" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="44" y="360" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<rect x="47" y="363" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="47" y="398" width="12" height="5" fill="#d9a400"/>
<rect x="80" y="360" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="106" y="360" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="140" y="389" font-size="15" font-weight="700" fill="#222">1 Modul: A2</text>
<rect x="8" y="414" width="384" height="58" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<rect x="18" y="420" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="44" y="420" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<rect x="47" y="423" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="47" y="458" width="12" height="5" fill="#d9a400"/>
<rect x="80" y="420" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="106" y="420" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<rect x="109" y="423" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="109" y="458" width="12" height="5" fill="#d9a400"/>
<text x="140" y="439" font-size="15" font-weight="700" fill="#222">2 Module: A2 + B2</text>
<text x="140" y="459" font-size="15" font-weight="700" fill="#2e7d32">= Dual Channel ✓</text>
<rect x="18" y="480" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="21" y="483" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="21" y="518" width="12" height="5" fill="#d9a400"/>
<rect x="44" y="480" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<rect x="47" y="483" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="47" y="518" width="12" height="5" fill="#d9a400"/>
<rect x="80" y="480" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="83" y="483" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="83" y="518" width="12" height="5" fill="#d9a400"/>
<rect x="106" y="480" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<rect x="109" y="483" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="109" y="518" width="12" height="5" fill="#d9a400"/>
<text x="140" y="509" font-size="15" font-weight="700" fill="#222">4 Module: alle</text>
<rect x="8" y="534" width="384" height="58" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<rect x="18" y="540" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="21" y="543" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="21" y="578" width="12" height="5" fill="#d9a400"/>
<rect x="44" y="540" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<rect x="47" y="543" width="12" height="40" rx="1" fill="#2a7f62"/><rect x="47" y="578" width="12" height="5" fill="#d9a400"/>
<rect x="80" y="540" width="18" height="46" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
<rect x="106" y="540" width="18" height="46" rx="2" fill="#c5d5f5" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="140" y="559" font-size="15" font-weight="700" fill="#c62828">A1 + A2: beide in Kanal A</text>
<text x="140" y="579" font-size="15" font-weight="700" fill="#c62828">→ nur Single Channel ✗</text>
<rect x="10" y="604" width="380" height="48" rx="8" fill="#eceff1"/>
<text x="200" y="624" font-size="13" text-anchor="middle">Beispiel eines Herstellers – maßgeblich ist</text>
<text x="200" y="643" font-size="13" text-anchor="middle" font-weight="700">das Handbuch deines Boards</text>
</svg>
