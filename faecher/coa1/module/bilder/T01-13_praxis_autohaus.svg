<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Praxisfall Autohaus in drei Schritten, ohne Lösung, jeweils mit Fragezeichen. Schritt 1: Verkauf und Werkstatt, jedes Gebäude hat ein eigenes Netz. Schritt 2: Beide Gebäude auf einem Gelände werden verbunden. Schritt 3: Zwei Filialen in anderen Stadtteilen kommen dazu und werden angebunden. Bei jedem Schritt steht die Frage: Welche Netzgröße?</title>
<defs>
<g id="geb"><rect x="-38" y="-26" width="76" height="52" rx="3" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/><g fill="#3a6ed8"><line x1="-20" y1="12" x2="20" y2="12" stroke="#3a6ed8" stroke-width="2"/><circle cx="-20" cy="12" r="5"/><circle cx="0" cy="12" r="5"/><circle cx="20" cy="12" r="5"/></g></g>
<g id="q"><circle r="15" fill="#E07B00"/><text y="6" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">?</text></g>
</defs>
<rect width="400" height="460" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Das Autohaus wächst – welche Netze?</text>
<rect x="12" y="42" width="376" height="162" rx="12" fill="#f3f8ee" stroke="#2f6b4f" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="26" y="64" font-size="14" font-weight="700" fill="#2f6b4f">ein Gelände</text>
<use href="#geb" x="90" y="108"/>
<text x="90" y="100" text-anchor="middle" font-weight="700">Verkauf</text>
<use href="#geb" x="310" y="108"/>
<text x="310" y="100" text-anchor="middle" font-weight="700">Werkstatt</text>
<!-- Schritt 2: verbinden -->
<line x1="128" y1="114" x2="272" y2="114" stroke="#E07B00" stroke-width="5"/>
<circle cx="32" cy="146" r="11" fill="#1d3f8a"/><text x="32" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="50" y="151" font-size="13">jedes Gebäude: eigenes Netz</text>
<use href="#q" x="262" y="146"/>
<circle cx="32" cy="180" r="11" fill="#1d3f8a"/><text x="32" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="50" y="185" font-size="13">beide verbinden (orange)</text>
<use href="#q" x="262" y="180"/>
<!-- Schritt 3 -->
<g stroke="#E07B00" stroke-width="5" fill="none" stroke-dasharray="12 7"><path d="M90,204 V300"/><path d="M310,204 V300"/></g>
<g transform="translate(90,330)"><path d="M-40,-6 L0,-30 L40,-6 Z" fill="#9aa3ad"/><rect x="-36" y="-6" width="72" height="40" fill="#fff" stroke="#333" stroke-width="2"/></g>
<text x="90" y="350" text-anchor="middle" font-weight="700">Filiale</text>
<g transform="translate(310,330)"><path d="M-40,-6 L0,-30 L40,-6 Z" fill="#9aa3ad"/><rect x="-36" y="-6" width="72" height="40" fill="#fff" stroke="#333" stroke-width="2"/></g>
<text x="310" y="350" text-anchor="middle" font-weight="700">Filiale</text>
<text x="200" y="392" text-anchor="middle" font-size="13" fill="#555">in anderen Stadtteilen</text>
<circle cx="140" cy="430" r="11" fill="#1d3f8a"/><text x="140" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="158" y="435" font-size="13">+ Filialen</text>
<use href="#q" x="240" y="430"/>
</svg>
