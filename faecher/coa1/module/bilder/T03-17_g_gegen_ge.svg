<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>G oder GE im Vergleich, zwei Steckbriefe. Links Ryzen 7 PRO 4750G: 8 Kerne, 16 Threads, Takt 3,6 GHz, Turbo 4,4 GHz, TDP 65 W mit großer Flamme. Rechts Ryzen 7 PRO 4750GE: 8 Kerne, 16 Threads, Takt 3,1 GHz, Turbo 4,3 GHz, TDP 35 W mit kleiner Flamme und grünem Blatt. Pfeil: nur gut die Hälfte Wärme. Stand Buch 2020.</title>
