<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ein DSL-Router, zum Beispiel eine Fritzbox, aufgeklappt: Darin stecken vier Geräte in einem Gehäuse. Modem, übersetzt für die Leitung. Router, verbindet zwei Netze. Switch, verteilt auf mehrere Kabel. WLAN-Access-Point, Funk. Darunter: Fritzbox gleich WLAN ist falsch (durchgestrichen). Fritzbox gleich Router plus mehr ist richtig.</title>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">DSL-Router (z. B. Fritzbox)</text>

<rect x="16" y="42" width="368" height="292" rx="12" fill="#3a3f4a"/>
<g fill="#fff"><rect x="28" y="54" width="344" height="62" rx="6"/><rect x="28" y="122" width="344" height="62" rx="6"/><rect x="28" y="190" width="344" height="62" rx="6"/><rect x="28" y="258" width="344" height="62" rx="6"/></g>

<!-- Modem -->
<text x="42" y="90" font-size="14" font-weight="700" fill="#3a6ed8">01</text>
<line x1="62" y1="85" x2="74" y2="85" stroke="#333" stroke-width="2" marker-end="url(#ad)"/>
<path d="M78,85 q4,-10 8,0 q4,10 8,0 q4,-10 8,0" fill="none" stroke="#E07B00" stroke-width="2.5"/>
<text x="118" y="80" font-size="16" font-weight="700">Modem</text>
<text x="118" y="102">übersetzt für die Leitung</text>

<!-- Router -->
<circle cx="52" cy="153" r="11" fill="#dfe9fb" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="96" cy="153" r="11" fill="#c8f0d6" stroke="#1f9d55" stroke-width="2"/>
<line x1="66" y1="153" x2="82" y2="153" stroke="#333" stroke-width="2" marker-start="url(#ad)" marker-end="url(#ad)"/>
<text x="118" y="148" font-size="16" font-weight="700">Router</text>
<text x="118" y="170">verbindet zwei Netze</text>

<!-- Switch -->
<g stroke="#333" stroke-width="2.5" fill="none">
<line x1="40" y1="221" x2="66" y2="221"/>
<path d="M66,221 L100,205 M66,221 L100,221 M66,221 L100,237"/>
</g>
<rect x="60" y="213" width="14" height="16" rx="2" fill="#3a3f4a"/>
<text x="118" y="216" font-size="16" font-weight="700">Switch</text>
<text x="118" y="238">verteilt auf mehrere Kabel</text>

<!-- WLAN-Access-Point -->
<line x1="70" y1="306" x2="70" y2="278" stroke="#333" stroke-width="3"/>
<circle cx="70" cy="276" r="3.5" fill="#333"/>
<g fill="none" stroke="#E07B00" stroke-width="2.5" stroke-linecap="round">
<path d="M80,268 a12,12 0 0 1 0,16"/><path d="M87,262 a20,20 0 0 1 0,28"/>
<path d="M60,268 a12,12 0 0 0 0,16"/><path d="M53,262 a20,20 0 0 0 0,28"/>
</g>
<text x="118" y="284" font-size="16" font-weight="700">WLAN-Access-Point</text>
<text x="118" y="306">Funk</text>

<!-- falsch / richtig -->
<rect x="20" y="354" width="200" height="40" rx="8" fill="#fdecec" stroke="#c62828" stroke-width="2"/>
<text x="120" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#a32020">Fritzbox = WLAN</text>
<line x1="34" y1="375" x2="206" y2="375" stroke="#c62828" stroke-width="2"/>
<text x="236" y="380" font-size="16" font-weight="700" fill="#a32020">falsch</text>

<rect x="20" y="408" width="250" height="40" rx="8" fill="#eaf6ee" stroke="#1f9d55" stroke-width="2"/>
<text x="145" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#1c6b3c">Fritzbox = Router (+ mehr)</text>
<text x="286" y="434" font-size="16" font-weight="700" fill="#1c6b3c">richtig</text>
</svg>
