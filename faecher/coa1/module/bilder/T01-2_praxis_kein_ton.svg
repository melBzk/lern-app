<text x="300" y="176" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Lautsprecher</text>
<circle cx="190" cy="230" r="16" fill="#fff" stroke="#333" stroke-width="3"/><line x1="201.2" y1="241.2" x2="217.2" y2="257.2" stroke="#333" stroke-width="5"/>
<text x="200" y="290" font-size="17" text-anchor="middle" font-weight="700" fill="#a85400">Wo suchst du?</text>
