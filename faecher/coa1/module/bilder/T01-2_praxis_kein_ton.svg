<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Ein PC-Gehäuse ist per Kabel mit einem Lautsprecher verbunden. Die Schallwellen am Lautsprecher sind rot durchgestrichen: kein Ton. Darunter eine Lupe und die Frage: Wo suchst du?</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="306" fill="#fff"/>
<text x="200" y="30" font-size="17" text-anchor="middle" font-weight="700" fill="#222">„Aus den Lautsprechern kommt kein Ton.“</text>
<rect x="45.0" y="70.0" width="70" height="120" rx="5" fill="#3d4450" stroke="#222" stroke-width="1.5"/><circle cx="80" cy="82.0" r="4" fill="#7ee08a" stroke="none" stroke-width="0"/>
<text x="80" y="214" font-size="14" text-anchor="middle" font-weight="700" fill="#222">PC-Gehäuse</text>
<path d="M115,150 C180,150 200,120 268,120" fill="none" stroke="#333" stroke-width="4"/>
<rect x="274" y="96" width="32" height="48" rx="4" fill="#555" stroke="#222" stroke-width="1.5"/><circle cx="290" cy="108" r="6" fill="#888" stroke="#222" stroke-width="1.5"/><circle cx="290" cy="128" r="10" fill="#888" stroke="#222" stroke-width="1.5"/><circle cx="290" cy="128" r="3.5" fill="#333" stroke="none" stroke-width="0"/>
