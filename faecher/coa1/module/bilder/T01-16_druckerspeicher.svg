<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 576" font-family="system-ui, sans-serif" role="img">
  <title>Warum der Laserdrucker Speicher braucht, in vier Schritten von oben nach unten. 1 Eine A4-Seite mit Text und Grafik. 2 Die Seite wird zum feinen Punkteraster, eine Lupe zeigt schwarze und weiße Punkte: 1 Punkt gleich 1 Bit. 3 Die ganze Seite muss in den Druckerspeicher, den RAM. 4 Erst jetzt wird über die Trommel gedruckt. Unten rot: Speicher zu klein führt zum Druckabbruch.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <pattern id="p" x="35" y="172" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fff"/><rect width="4" height="4" fill="#222"/><rect x="4" y="4" width="4" height="4" fill="#222"/>
    </pattern>
    <clipPath id="c"><circle cx="100" cy="202" r="22"/></clipPath>
    <g id="nr"><circle cx="0" cy="0" r="11" fill="#e8590c"/></g>
  </defs>
  <rect width="400" height="576" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Erst speichern, dann drucken</text>

  <!-- 1 Seite -->
  <rect x="35" y="48" width="62" height="88" fill="#fff" stroke="#555" stroke-width="2"/>
  <g stroke="#868e96" stroke-width="3"><line x1="43" y1="60" x2="89" y2="60"/><line x1="43" y1="70" x2="85" y2="70"/><line x1="43" y1="80" x2="89" y2="80"/></g>
  <rect x="46" y="110" width="8" height="18" fill="#3a6ed8"/><rect x="58" y="98" width="8" height="30" fill="#3a6ed8"/><rect x="70" y="104" width="8" height="24" fill="#3a6ed8"/>
  <use href="#nr" x="138" y="80"/><text x="138" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="156" y="86" font-size="15" font-weight="700" fill="#222">Seite mit Text</text>
  <text x="156" y="106" font-size="15" font-weight="700" fill="#222">und Grafik</text>
  <line x1="66" y1="142" x2="66" y2="166" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 2 Punkteraster -->
  <rect x="35" y="172" width="62" height="88" fill="url(#p)" stroke="#555" stroke-width="2"/>
  <g clip-path="url(#c)">
    <rect x="78" y="180" width="44" height="44" fill="#fff"/>
    <rect x="78" y="180" width="14" height="14" fill="#222"/><rect x="106" y="180" width="14" height="14" fill="#222"/>
    <rect x="92" y="194" width="14" height="14" fill="#222"/>
    <rect x="78" y="208" width="14" height="14" fill="#222"/><rect x="106" y="208" width="14" height="14" fill="#222"/>
  </g>
  <circle cx="100" cy="202" r="22" fill="none" stroke="#333" stroke-width="3.5"/>
  <line x1="116" y1="218" x2="126" y2="230" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <use href="#nr" x="138" y="204"/><text x="138" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="156" y="210" font-size="15" font-weight="700" fill="#222">Seite wird zum</text>
  <text x="156" y="230" font-size="15" font-weight="700" fill="#222">Punkteraster</text>
  <text x="156" y="254" font-size="15" font-weight="700" fill="#e8590c">1 Punkt = 1 Bit</text>
  <line x1="66" y1="266" x2="66" y2="290" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3 Druckerspeicher -->
  <rect x="20" y="304" width="92" height="46" rx="3" fill="#2b8a3e"/>
  <g fill="#222"><rect x="26" y="310" width="16" height="26"/><rect x="46" y="310" width="16" height="26"/><rect x="66" y="310" width="16" height="26"/><rect x="86" y="310" width="16" height="26"/></g>
  <rect x="24" y="342" width="84" height="8" fill="#d4a017"/>
  <text x="66" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">voll</text>
  <use href="#nr" x="138" y="322"/><text x="138" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="156" y="328" font-size="15" font-weight="700" fill="#222">Ganze Seite muss</text>
  <text x="156" y="348" font-size="15" font-weight="700" fill="#222">in den Druckerspeicher</text>
  <text x="156" y="366" font-size="13" fill="#444">(RAM im Drucker)</text>
  <line x1="66" y1="380" x2="66" y2="404" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 4 Drucken -->
  <circle cx="66" cy="438" r="26" fill="#495057"/>
  <path d="M50,420 A24 24 0 0 1 84,422" fill="none" stroke="#fff" stroke-width="2.5"/>
  <rect x="20" y="466" width="92" height="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <use href="#nr" x="138" y="436"/><text x="138" y="441" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <text x="156" y="442" font-size="15" font-weight="700" fill="#222">Erst jetzt wird</text>
  <text x="156" y="462" font-size="15" font-weight="700" fill="#222">gedruckt (Trommel)</text>

  <!-- Warnung -->
  <rect x="10" y="500" width="380" height="56" rx="10" fill="#fdecec" stroke="#d63c3c" stroke-width="2.5"/>
  <text x="200" y="534" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">Speicher zu klein → Druckabbruch</text>
</svg>
