<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Laptop zerlegen: Oft muss zuerst die Tastatur gelöst werden, darunter liegen die Bauteile, zum Beispiel Lüfter und Akku. Tipp 1: Eine Schablone mit Feldern für Schraube 1, Schraube 2, Lüfter und Akku, so liegen die Teile geordnet. Tipp 2: Ein Handy auf einem Stativ filmt den Ausbau.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Laptop zerlegen: zwei Tipps</text>

<!-- Laptop offen -->
<rect x="14" y="44" width="210" height="10" rx="3" fill="#90a4ae"/>
<rect x="14" y="54" width="210" height="116" rx="6" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<rect x="26" y="64" width="186" height="96" rx="3" fill="#2f6b4f"/>
<circle cx="70" cy="110" r="28" fill="#90a4ae" stroke="#eceff1" stroke-width="2"/>
<circle cx="70" cy="110" r="6" fill="#455a64"/>
<text x="70" y="154" text-anchor="middle" font-size="13" fill="#fff">Lüfter</text>
<rect x="116" y="76" width="86" height="56" rx="3" fill="#37474f" stroke="#eceff1"/>
<text x="159" y="109" text-anchor="middle" font-size="13" fill="#fff">Akku</text>

<!-- Tastatur abgehoben -->
<g transform="rotate(-8 318 84)">
<rect x="250" y="58" width="136" height="54" rx="4" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<g fill="#90a4ae"><rect x="258" y="64" width="14" height="10"/><rect x="276" y="64" width="14" height="10"/><rect x="294" y="64" width="14" height="10"/><rect x="312" y="64" width="14" height="10"/><rect x="330" y="64" width="14" height="10"/><rect x="348" y="64" width="14" height="10"/><rect x="366" y="64" width="14" height="10"/><rect x="258" y="78" width="14" height="10"/><rect x="276" y="78" width="14" height="10"/><rect x="294" y="78" width="14" height="10"/><rect x="312" y="78" width="14" height="10"/><rect x="330" y="78" width="14" height="10"/><rect x="348" y="78" width="14" height="10"/><rect x="366" y="78" width="14" height="10"/><rect x="276" y="94" width="86" height="10"/></g>
</g>
<line x1="228" y1="110" x2="252" y2="98" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="318" y="140" text-anchor="middle" font-size="13" font-weight="700">Tastatur zuerst lösen</text>

<!-- Tipp 1: Schablone -->
<text x="20" y="200" font-size="15" font-weight="700" fill="#3a6ed8">Tipp 1: Schablone</text>
<rect x="20" y="210" width="210" height="170" fill="#fffdf5" stroke="#999" stroke-width="1.5"/>
<g fill="none" stroke="#3a6ed8" stroke-width="1.5" stroke-dasharray="5 4"><rect x="30" y="220" width="92" height="72"/><rect x="128" y="220" width="92" height="72"/><rect x="30" y="298" width="92" height="72"/><rect x="128" y="298" width="92" height="72"/></g>
<g font-size="13" text-anchor="middle"><text x="76" y="238">Schraube 1</text><text x="174" y="238">Schraube 2</text><text x="76" y="316">Lüfter</text><text x="174" y="316">Akku</text></g>
<g fill="#9e9e9e" stroke="#555" stroke-width="1"><circle cx="58" cy="266" r="7"/><circle cx="80" cy="270" r="7"/><circle cx="100" cy="262" r="7"/><circle cx="160" cy="266" r="7"/><circle cx="186" cy="268" r="7"/></g>
<g stroke="#333" stroke-width="1.5"><path d="M54,266 h8 M58,262 v8"/><path d="M76,270 h8 M80,266 v8"/><path d="M96,262 h8 M100,258 v8"/><path d="M156,266 h8 M160,262 v8"/><path d="M182,268 h8 M186,264 v8"/></g>

<!-- Tipp 2: filmen -->
<text x="325" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#D4607A">Tipp 2:</text>
<text x="325" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#D4607A">Ausbau filmen</text>
<rect x="295" y="230" width="60" height="104" rx="8" fill="#333"/>
<rect x="301" y="240" width="48" height="84" rx="3" fill="#cfd8dc"/>
<circle cx="325" cy="262" r="8" fill="#c62828"/>
<text x="325" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">REC</text>
<g stroke="#555" stroke-width="3"><line x1="325" y1="334" x2="285" y2="392"/><line x1="325" y1="334" x2="365" y2="392"/><line x1="325" y1="334" x2="325" y2="392"/></g>
</svg>
