<text x="89.0" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#3a6ed8">Befehl 1</text>
<text x="199.0" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#E07B00">Befehl 2</text>
<text x="309.0" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#2f6b4f">Befehl 3</text>
<text x="200" y="146" font-size="16" text-anchor="middle" font-weight="700" fill="#c62828">3 × 5 = 15 Takte</text>
