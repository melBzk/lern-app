<rect x="166" y="266" width="22" height="24" rx="3" fill="#dcefe4" stroke="#2f6b4f" stroke-width="1.8"/>
<circle cx="202" cy="278" r="9" fill="#2f6b4f" stroke="none" stroke-width="2"/><path d="M197.95,278 l2.88,3.2399999999999998 l5.76,-6.4799999999999995" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="218" y="283" font-size="13" fill="#333">fertig nach Takt 7</text>
<text x="200" y="316" font-size="16" text-anchor="middle" font-weight="700" fill="#2f6b4f">5 + (3 − 1) = 7 Takte</text>
<text x="200" y="338" font-size="13" text-anchor="middle" fill="#444">jeder Befehl startet 1 Takt später</text>
<text x="200" y="372" font-size="13" text-anchor="middle" fill="#444">1 Kästchen = 1 Takt · Idealfall ohne Wartezeiten</text>
</svg>
