<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Stilisierter Bluescreen mit traurigem Smiley: Ein Problem ist aufgetreten, Speicherabbild wird erstellt, 40 Prozent. Pfeil 1 führt zu einer Dump-Datei auf der Festplatte im Ordner C: › Windows › Minidump. Pfeil 2 führt zu einer Lupe: Fehlercode suchen oder analysieren lassen.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
<rect width="400" height="490" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Bluescreen → Speicherabbild</text>
<!-- Monitor -->
<rect x="30" y="40" width="340" height="170" rx="8" fill="#333"/>
<rect x="40" y="50" width="320" height="150" fill="#1565c0"/>
<text x="58" y="98" font-size="40" font-weight="400" fill="#fff">:(</text>
<text x="58" y="132" font-size="15" fill="#fff">Ein Problem ist aufgetreten</text>
<text x="58" y="162" font-size="13" fill="#fff">Speicherabbild wird erstellt … 40 %</text>
<rect x="58" y="174" width="200" height="8" fill="#5e94d8"/>
<rect x="58" y="174" width="80" height="8" fill="#fff"/>
<rect x="180" y="210" width="40" height="12" fill="#555"/>
<rect x="150" y="222" width="100" height="6" rx="3" fill="#555"/>
<!-- Pfeil 1 -->
<line x1="200" y1="232" x2="200" y2="272" stroke="#E07B00" stroke-width="4" marker-end="url(#a)"/>
<circle cx="228" cy="252" r="12" fill="#E07B00"/><text x="228" y="257" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<!-- Festplatte -->
<rect x="40" y="278" width="320" height="104" rx="8" fill="#9e9a95"/>
<text x="350" y="298" font-size="13" text-anchor="end" font-weight="700" fill="#fff">Festplatte</text>
<path d="M56,296 h20 l6,6 h30 v28 h-56 z" fill="#f2c94c" stroke="#a88a10" stroke-width="1.5"/>
<text x="122" y="320" font-size="14" font-weight="700" fill="#fff">C: › Windows › Minidump</text>
<path d="M64,338 h22 l8,8 v28 h-30 z" fill="#fff" stroke="#555" stroke-width="1.5"/>
<path d="M86,338 v8 h8" fill="none" stroke="#555" stroke-width="1.5"/>
<line x1="69" y1="354" x2="89" y2="354" stroke="#999" stroke-width="1.5"/><line x1="69" y1="361" x2="89" y2="361" stroke="#999" stroke-width="1.5"/>
<text x="108" y="364" font-size="16" font-weight="700" fill="#fff">Dump</text>
<!-- Pfeil 2 -->
<line x1="200" y1="386" x2="200" y2="420" stroke="#E07B00" stroke-width="4" marker-end="url(#a)"/>
<circle cx="228" cy="403" r="12" fill="#E07B00"/><text x="228" y="408" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<!-- Lupe -->
<circle cx="78" cy="446" r="18" fill="#e8f0fc" stroke="#222" stroke-width="4"/>
<line x1="91" y1="459" x2="106" y2="474" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<text x="124" y="444" font-size="15" font-weight="700">Fehlercode suchen /</text>
<text x="124" y="464" font-size="15" font-weight="700">analysieren lassen</text>
</svg>
