<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ausgangslage: Sechs Befehle B1 bis B6 warten vor einem Prozessor mit Pipeline aus den fünf Phasen L, D, O, A, S, je ein Takt. Gefragt: wie viele Takte mit Pipeline und wie viele ohne Pipeline (Fragezeichen).</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="346" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">6 Befehle warten</text>
<rect x="14" y="44" width="52" height="36" rx="6" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="40" y="68" font-size="15" text-anchor="middle" font-weight="700">B1</text>
<rect x="76" y="44" width="52" height="36" rx="6" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="102" y="68" font-size="15" text-anchor="middle" font-weight="700">B2</text>
<rect x="138" y="44" width="52" height="36" rx="6" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="164" y="68" font-size="15" text-anchor="middle" font-weight="700">B3</text>
<rect x="200" y="44" width="52" height="36" rx="6" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="226" y="68" font-size="15" text-anchor="middle" font-weight="700">B4</text>
<rect x="262" y="44" width="52" height="36" rx="6" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="288" y="68" font-size="15" text-anchor="middle" font-weight="700">B5</text>
<rect x="324" y="44" width="52" height="36" rx="6" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="350" y="68" font-size="15" text-anchor="middle" font-weight="700">B6</text>
<line x1="200" y1="90" x2="200" y2="120" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="14" y="126" width="372" height="96" rx="12" fill="#f6f6f6" stroke="#333" stroke-width="2"/>
<text x="28" y="148" font-size="15" font-weight="700">Prozessor mit Pipeline</text>
<rect x="40" y="162" width="52" height="40" rx="4" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/><text x="66.0" y="187.95" font-size="17" text-anchor="middle" font-weight="700">L</text>
<rect x="106" y="162" width="52" height="40" rx="4" fill="#ece0f5" stroke="#7b3fa0" stroke-width="2"/><text x="132.0" y="187.95" font-size="17" text-anchor="middle" font-weight="700">D</text>
<rect x="172" y="162" width="52" height="40" rx="4" fill="#fdebd3" stroke="#E07B00" stroke-width="2"/><text x="198.0" y="187.95" font-size="17" text-anchor="middle" font-weight="700">O</text>
<rect x="238" y="162" width="52" height="40" rx="4" fill="#f9dcdc" stroke="#c62828" stroke-width="2"/><text x="264.0" y="187.95" font-size="17" text-anchor="middle" font-weight="700">A</text>
<rect x="304" y="162" width="52" height="40" rx="4" fill="#dcefe4" stroke="#2f6b4f" stroke-width="2"/><text x="330.0" y="187.95" font-size="17" text-anchor="middle" font-weight="700">S</text>
<text x="200" y="242" font-size="14" text-anchor="middle" font-weight="700" fill="#444">5 Phasen, je 1 Takt</text>
<rect x="14" y="260" width="178" height="70" rx="10" fill="#fff" stroke="#E07B00" stroke-width="2.5"/>
<text x="103" y="286" font-size="14" text-anchor="middle" font-weight="700">mit Pipeline</text>
<text x="103" y="314" font-size="18" text-anchor="middle" font-weight="700" fill="#E07B00">? Takte</text>
<rect x="208" y="260" width="178" height="70" rx="10" fill="#fff" stroke="#E07B00" stroke-width="2.5"/>
<text x="297" y="286" font-size="14" text-anchor="middle" font-weight="700">ohne Pipeline</text>
<text x="297" y="314" font-size="18" text-anchor="middle" font-weight="700" fill="#E07B00">? Takte</text>
</svg>
