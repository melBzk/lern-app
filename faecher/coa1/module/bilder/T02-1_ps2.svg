<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif">
  <title>PS/2-Buchsen: grün für die Maus, lila für die Tastatur, halb grün und halb lila als Kombi-PS/2. Alle haben 6 Löcher und einen Führungssteg. Darunter ein Y-Adapter: ein Kombi-Stecker teilt sich in eine grüne und eine lila Buchse. Hinweis: baugleich, nur die Farbe unterscheidet.</title>
  <defs>
    <g id="loecher">
      <rect x="-5" y="18" width="10" height="9" fill="#fff"/>
      <circle cx="-14" cy="-10" r="3.5" fill="#222"/><circle cx="14" cy="-10" r="3.5" fill="#222"/>
      <circle cx="-19" cy="4" r="3.5" fill="#222"/><circle cx="19" cy="4" r="3.5" fill="#222"/>
      <circle cx="-9" cy="14" r="3.5" fill="#222"/><circle cx="9" cy="14" r="3.5" fill="#222"/>
      <rect x="-5" y="-6" width="10" height="10" fill="#222" fill-opacity="0.35"/>
    </g>
  </defs>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">PS/2 für Maus und Tastatur</text>

  <!-- Maus-Buchse grün -->
  <circle cx="70" cy="90" r="34" fill="#3fa34d" stroke="#2d7a38" stroke-width="3"/>
  <use href="#loecher" x="70" y="90"/>
  <!-- Tastatur-Buchse lila -->
  <circle cx="200" cy="90" r="34" fill="#8e5cc4" stroke="#6b4196" stroke-width="3"/>
  <use href="#loecher" x="200" y="90"/>
  <!-- Kombi -->
  <path d="M330,56 A34,34 0 0 0 330,124 Z" fill="#3fa34d"/>
  <path d="M330,56 A34,34 0 0 1 330,124 Z" fill="#8e5cc4"/>
  <circle cx="330" cy="90" r="34" fill="none" stroke="#555" stroke-width="3"/>
  <use href="#loecher" x="330" y="90"/>

  <!-- Symbol Maus -->
  <g fill="#fff" stroke="#333" stroke-width="2">
    <rect x="58" y="136" width="24" height="34" rx="12"/>
    <line x1="70" y1="136" x2="70" y2="150"/>
  </g>
  <!-- Symbol Tastatur -->
  <g>
    <rect x="176" y="140" width="48" height="26" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <g fill="#333">
      <rect x="181" y="145" width="5" height="4"/><rect x="189" y="145" width="5" height="4"/><rect x="197" y="145" width="5" height="4"/><rect x="205" y="145" width="5" height="4"/><rect x="213" y="145" width="5" height="4"/>
      <rect x="181" y="152" width="5" height="4"/><rect x="189" y="152" width="5" height="4"/><rect x="197" y="152" width="5" height="4"/><rect x="205" y="152" width="5" height="4"/><rect x="213" y="152" width="5" height="4"/>
      <rect x="189" y="159" width="22" height="3"/>
    </g>
  </g>
  <!-- Symbol beide -->
  <g fill="#fff" stroke="#333" stroke-width="2">
    <rect x="298" y="140" width="38" height="26" rx="3"/>
    <rect x="344" y="136" width="18" height="30" rx="9"/>
  </g>
  <g fill="#333"><rect x="303" y="146" width="28" height="3"/><rect x="303" y="153" width="28" height="3"/><rect x="309" y="160" width="16" height="3"/></g>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="70" y="194" fill="#2d7a38">Maus</text>
    <text x="200" y="194" fill="#6b4196">Tastatur</text>
    <text x="330" y="194" fill="#222">Kombi-PS/2</text>
  </g>

  <!-- Y-Adapter -->
  <text x="20" y="232" font-size="15" font-weight="700" fill="#222">Y-Adapter</text>
  <path d="M70,276 A20,20 0 0 0 70,316 Z" fill="#3fa34d"/>
  <path d="M70,276 A20,20 0 0 1 70,316 Z" fill="#8e5cc4"/>
  <circle cx="70" cy="296" r="20" fill="none" stroke="#555" stroke-width="2"/>
  <text x="70" y="338" text-anchor="middle" font-size="13" fill="#222">Stecker</text>
  <text x="70" y="354" text-anchor="middle" font-size="13" fill="#222">(in Kombi-Buchse)</text>
  <path d="M90,296 H180" stroke="#555" stroke-width="5" fill="none"/>
  <path d="M180,296 C220,296 230,262 280,262" stroke="#555" stroke-width="5" fill="none"/>
  <path d="M180,296 C220,296 230,330 280,330" stroke="#555" stroke-width="5" fill="none"/>
  <circle cx="300" cy="262" r="18" fill="#3fa34d" stroke="#2d7a38" stroke-width="2"/>
  <circle cx="300" cy="330" r="18" fill="#8e5cc4" stroke="#6b4196" stroke-width="2"/>
  <text x="326" y="267" font-size="13" fill="#222">Maus</text>
  <text x="326" y="335" font-size="13" fill="#222">Tastatur</text>

  <!-- Hinweis-Schild -->
  <rect x="30" y="372" width="340" height="36" rx="8" fill="#fff3cd" stroke="#e0a800" stroke-width="2"/>
  <text x="200" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#D4607A">baugleich – nur die Farbe unterscheidet!</text>
</svg>
