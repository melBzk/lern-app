<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 502" font-family="system-ui, sans-serif">
  <title>Thermodrucker für Kassenzettel im Querschnitt. Eine Rolle Spezialpapier, das auf Hitze reagiert, läuft unter einer Heizleiste mit einzelnen Punkten durch. Wo ein Punkt heiß ist, wird das Papier schwarz. Der Drucker braucht keine Tinte, keinen Toner und kein Farbband. Vergleich: wie Holz unter einem Lötkolben, die heiße Stelle wird dunkel.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
  </defs>
  <rect width="400" height="502" fill="#fff"/>

  <text x="200" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Thermodrucker (Kassenzettel)</text>
  <!-- Heizleiste -->
  <rect x="134" y="80" width="196" height="26" rx="5" fill="#3a3f4a"/>
  <text x="232" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Heizleiste</text>
  <circle cx="150" cy="112" r="4" fill="#888"/><circle cx="170" cy="112" r="6" fill="#ff4d2e"/><circle cx="190" cy="112" r="4" fill="#888"/><circle cx="210" cy="112" r="6" fill="#ff4d2e"/><circle cx="230" cy="112" r="6" fill="#ff4d2e"/><circle cx="250" cy="112" r="4" fill="#888"/><circle cx="270" cy="112" r="4" fill="#888"/><circle cx="290" cy="112" r="6" fill="#ff4d2e"/><circle cx="310" cy="112" r="4" fill="#888"/>
  <!-- Rolle und Papier -->
  <circle cx="70" cy="160" r="44" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="160" r="12" fill="#ddd" stroke="#333"/>
  <path d="M70,116 L390,120 L390,130 L70,130" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="163" y="120" width="14" height="10" fill="#111"/><rect x="203" y="120" width="14" height="10" fill="#111"/><rect x="223" y="120" width="14" height="10" fill="#111"/><rect x="283" y="120" width="14" height="10" fill="#111"/>
  <g fill="#111"><rect x="300" y="120" width="10" height="10"/><rect x="320" y="120" width="14" height="10"/><rect x="350" y="120" width="10" height="10"/><rect x="368" y="120" width="14" height="10"/></g>
  <line x1="340" y1="146" x2="388" y2="146" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="70" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Spezialpapier</text>
  <text x="70" y="242" text-anchor="middle" font-size="13" fill="#222">reagiert auf Hitze</text>
  <text x="250" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#a32020">heiß → wird schwarz</text>

  <!-- braucht nicht -->
  <rect x="8" y="262" width="384" height="118" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <text x="22" y="286" font-size="15" font-weight="700" fill="#222">braucht nicht:</text>
  <g><rect x="56" y="310" width="28" height="40" rx="3" fill="#1fa3c9"/><rect x="62" y="350" width="16" height="6" fill="#333"/><line x1="46" y1="306" x2="94" y2="354" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/><line x1="94" y1="306" x2="46" y2="354" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/></g>
  <g><rect x="174" y="314" width="52" height="32" rx="4" fill="#3a3f4a"/><circle cx="214" cy="330" r="7" fill="#111" stroke="#999"/><line x1="176" y1="306" x2="224" y2="354" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/><line x1="224" y1="306" x2="176" y2="354" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/></g>
  <g><circle cx="314" cy="330" r="14" fill="#555"/><circle cx="346" cy="330" r="14" fill="#555"/><rect x="314" y="340" width="32" height="6" fill="#111"/><line x1="306" y1="306" x2="354" y2="354" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/><line x1="354" y1="306" x2="306" y2="354" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/></g>
  <g font-size="13" text-anchor="middle" fill="#222"><text x="70" y="372">Tinte</text><text x="200" y="372">Toner</text><text x="330" y="372">Farbband</text></g>

  <!-- Vergleich Lötkolben -->
  <rect x="8" y="390" width="384" height="104" rx="12" fill="#fff4e5" stroke="#E07B00"/>
  <text x="22" y="414" font-size="15" font-weight="700" fill="#b35f00">wie Holz unterm Lötkolben</text>
  <rect x="190" y="456" width="190" height="22" rx="3" fill="#d9a066" stroke="#8a5a2b" stroke-width="1.5"/>
  <ellipse cx="290" cy="458" rx="14" ry="5" fill="#3b2410"/>
  <g transform="translate(140 0) rotate(50 150 452)">
    <rect x="148" y="400" width="4" height="52" fill="#9aa3ae"/>
    <rect x="144" y="372" width="12" height="30" rx="3" fill="#3a3f4a"/>
  </g>
  <text x="24" y="452" font-size="13" fill="#222">die heiße Stelle</text>
  <text x="24" y="468" font-size="13" fill="#222">wird dunkel</text>
</svg>
