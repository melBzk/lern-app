<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" role="img">
  <title>TCO und ISO 9241, gute Bildschirmarbeit. Das TCO-Siegel, TCO-03, bescheinigt einem Monitor: gleichmäßige, flimmerfreie Ausleuchtung; ein helles Gehäuse, das nicht spiegelt; höchstens 15 Watt im Stand-by. ISO 9241 sind internationale Richtlinien für das Zusammenspiel von Mensch und Maschine, für ergonomische Büroarbeit am Bildschirm. Geprüft werden unter anderem Bildschirme und Tastaturen. Auch die Pixelfehlerklassen stehen in ISO 9241.</title>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">TCO und ISO 9241</text>

  <!-- TCO -->
  <rect x="8" y="40" width="384" height="214" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <rect x="20" y="52" width="82" height="30" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="61" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#222">TCO-03</text>
  <text x="114" y="73" font-size="15" font-weight="700" fill="#222">für Monitore</text>
  <rect x="24" y="100" width="130" height="90" rx="5" fill="#d9dde3" stroke="#3a3f4a" stroke-width="3"/>
  <rect x="32" y="108" width="114" height="74" fill="#fffbe6"/>
  <rect x="78" y="190" width="22" height="16" fill="#9aa3ae"/><rect x="62" y="206" width="54" height="6" rx="2" fill="#9aa3ae"/>
  <circle cx="148" cy="226" r="5" fill="#1f9d55"/>
  <g stroke="#E07B00" stroke-width="2"><line x1="146" y1="130" x2="176" y2="114"/><line x1="156" y1="160" x2="176" y2="160"/><line x1="154" y1="226" x2="176" y2="214"/></g>
  <text x="182" y="112" font-size="14" font-weight="700" fill="#222">flimmerfrei,</text><text x="182" y="130" font-size="14" fill="#333">gleichmäßig hell</text>
  <text x="182" y="158" font-size="14" font-weight="700" fill="#222">helles Gehäuse,</text><text x="182" y="176" font-size="14" fill="#333">spiegelt nicht</text>
  <text x="182" y="212" font-size="14" font-weight="700" fill="#222">Stand-by</text><text x="182" y="232" font-size="16" font-weight="700" fill="#b35f00">höchstens 15 W</text>

  <!-- ISO -->
  <rect x="8" y="266" width="384" height="196" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <rect x="20" y="278" width="94" height="30" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="67" y="299" text-anchor="middle" font-size="15" font-weight="700" fill="#222">ISO 9241</text>
  <text x="126" y="299" font-size="15" font-weight="700" fill="#222">Mensch ↔ Maschine</text>
  <circle cx="58" cy="338" r="11" fill="#3a3f4a"/><path d="M38,384 q20,-40 40,0 z" fill="#3a3f4a"/>
  <text x="100" y="366" font-size="20" fill="#E07B00">↔</text>
  <rect x="134" y="332" width="64" height="40" rx="3" fill="#3a3f4a"/><rect x="138" y="336" width="56" height="32" fill="#dbeefc"/>
  <rect x="130" y="378" width="72" height="12" rx="3" fill="#9aa3ae"/>
  <text x="214" y="346" font-size="14" fill="#333">prüft u. a.</text><text x="214" y="364" font-size="14" font-weight="700" fill="#222">Bildschirme,</text><text x="214" y="382" font-size="14" font-weight="700" fill="#222">Tastaturen</text>
  <text x="24" y="420" font-size="14" fill="#333">ergonomische Büroarbeit am Bildschirm</text>
  <text x="24" y="444" font-size="14" font-weight="700" fill="#b35f00">auch die Pixelfehlerklassen (T01-10)</text>
</svg>
