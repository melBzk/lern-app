<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" font-family="system-ui, sans-serif" fill="#222">
<title>Die 8 neuen Wörter mit kleinen Symbolen: RAM-Steckplatz = Schlitz für den Arbeitsspeicher-Riegel. Kerbe und Steg = Lücke am Riegel und passende Nase im Steckplatz. Dual Channel und Kit = zwei Riegel arbeiten gleichzeitig, als abgestimmtes Paar. PCI Express = Steckplatz für Erweiterungskarten wie die Grafikkarte. SATA und M.2 = Anschlüsse für Festplatten und SSDs. ATX-Stromstecker = großer Stecker vom Netzteil zum Mainboard. BIOS und UEFI = Start-Software in einem Chip, UEFI ist der Nachfolger. Knopfzelle = kleine Batterie für Uhrzeit und Einstellungen.</title>
<rect width="400" height="510" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">8 Wörter auf einen Blick</text>
<g fill="#f4f1ee"><rect x="10" y="42" width="380" height="52" rx="10"/><rect x="10" y="100" width="380" height="52" rx="10"/><rect x="10" y="158" width="380" height="52" rx="10"/><rect x="10" y="216" width="380" height="52" rx="10"/><rect x="10" y="274" width="380" height="52" rx="10"/><rect x="10" y="332" width="380" height="52" rx="10"/><rect x="10" y="390" width="380" height="52" rx="10"/><rect x="10" y="448" width="380" height="52" rx="10"/></g>
<!-- RAM-Steckplatz -->
<rect x="22" y="62" width="70" height="12" rx="2" fill="#3a6ed8"/><rect x="26" y="66" width="62" height="4" fill="#1d3f8a"/>
<text x="104" y="64" font-size="15" font-weight="700">RAM-Steckplatz</text>
<text x="104" y="84" font-size="13">Schlitz für den Arbeitsspeicher-Riegel</text>
<!-- Kerbe / Steg -->
<path d="M22,108 H92 V130 H62 V122 H56 V130 H22 Z" fill="#2e7d4f"/>
<rect x="22" y="134" width="34" height="8" fill="#555"/><rect x="56" y="126" width="6" height="16" fill="#D4607A"/><rect x="62" y="134" width="30" height="8" fill="#555"/>
<text x="104" y="122" font-size="15" font-weight="700">Kerbe / Steg</text>
<text x="104" y="142" font-size="13">Lücke am Riegel / Nase im Steckplatz</text>
<!-- Dual Channel / Kit -->
<rect x="24" y="166" width="30" height="36" rx="2" fill="#2e7d4f"/><rect x="60" y="166" width="30" height="36" rx="2" fill="#2e7d4f"/>
<rect x="24" y="198" width="30" height="4" fill="#3a6ed8"/><rect x="60" y="198" width="30" height="4" fill="#3a6ed8"/>
<text x="104" y="180" font-size="15" font-weight="700">Dual Channel / Kit</text>
<text x="104" y="200" font-size="13">2 Riegel gleichzeitig / abgestimmtes Paar</text>
<!-- PCIe -->
<rect x="22" y="234" width="70" height="12" rx="2" fill="#333"/><rect x="36" y="234" width="3" height="12" fill="#f4f1ee"/>
<text x="104" y="238" font-size="15" font-weight="700">PCI Express (PCIe)</text>
<text x="104" y="258" font-size="13">Steckplatz für Erweiterungskarten</text>
<!-- SATA / M.2 -->
<path d="M26,286 H48 V306 H26 Z M30,290 H44 V296 H36 V302 H30 Z" fill="#333" fill-rule="evenodd"/>
<rect x="58" y="292" width="36" height="12" rx="2" fill="#2e7d4f"/><rect x="58" y="304" width="36" height="3" fill="#e0a54a"/>
<text x="104" y="296" font-size="15" font-weight="700">SATA / M.2</text>
<text x="104" y="316" font-size="13">Anschlüsse für Festplatten und SSDs</text>
<!-- ATX-Stromstecker -->
<rect x="30" y="340" width="52" height="30" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
<g fill="#333"><rect x="35" y="345" width="6" height="8"/><rect x="44" y="345" width="6" height="8"/><rect x="53" y="345" width="6" height="8"/><rect x="62" y="345" width="6" height="8"/><rect x="71" y="345" width="6" height="8"/><rect x="35" y="357" width="6" height="8"/><rect x="44" y="357" width="6" height="8"/><rect x="53" y="357" width="6" height="8"/><rect x="62" y="357" width="6" height="8"/><rect x="71" y="357" width="6" height="8"/></g>
<line x1="56" y1="370" x2="56" y2="380" stroke="#c99a06" stroke-width="4"/>
<text x="104" y="354" font-size="15" font-weight="700">ATX-Stromstecker</text>
<text x="104" y="374" font-size="13">vom Netzteil zum Mainboard</text>
<!-- BIOS / UEFI -->
<rect x="30" y="398" width="52" height="36" fill="#333"/>
<text x="56" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BIOS</text>
<text x="104" y="412" font-size="15" font-weight="700">BIOS / UEFI</text>
<text x="104" y="432" font-size="13">Start-Software im Chip; UEFI = Nachfolger</text>
<!-- Knopfzelle -->
<circle cx="56" cy="474" r="18" fill="#cfd8dc" stroke="#607d8b" stroke-width="2.5"/>
<text x="56" y="479" text-anchor="middle" font-size="14" font-weight="700" fill="#455a64">+</text>
<text x="104" y="470" font-size="15" font-weight="700">Knopfzelle</text>
<text x="104" y="490" font-size="13">Batterie für Uhrzeit und Einstellungen</text>
</svg>
