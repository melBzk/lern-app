<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Drei Fragen beim Auswählen nach Datenblatt. Reicht der Strom? Eine 2,5-Zoll-Platte ohne Netzteil läuft an USB 3.0 sicher, an USB 2.0 nur knapp. Reicht das Tempo? Ein USB-3.0-Gerät am USB-2.0-Hub bremst aus. Ein Kabel für alles? Dann Thunderbolt oder USB4.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="298" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Schnittstelle nach Datenblatt wählen</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="26" y="74.0" width="30" height="24" rx="3" fill="#cfd6de" stroke="#555" stroke-width="1.8"/><path d="M69.6,71.6 l-10.8,16.2 h7.2 l-3.6,12.6 l10.8,-16.2 h-7.2 Z" fill="#f2c230" stroke="#a07800" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="91.0" font-size="13" text-anchor="middle" font-weight="700">5V</text>
<text x="100" y="74.0" font-size="15" font-weight="700" fill="#1d3f8a">Reicht der Strom?</text>
<text x="100" y="94.0" font-size="14">2,5-Zoll-Platte ohne Netzteil:</text>
<text x="100" y="112.0" font-size="14">an USB 3.0 sicher, an USB 2.0 knapp</text>
<line x1="15" y1="126" x2="385" y2="126" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="150.0" width="28" height="32" rx="4" fill="#cfd6de" stroke="#555" stroke-width="1.8"/><text x="32" y="171.0" font-size="13" text-anchor="middle" font-weight="700">2.0</text><rect x="54" y="156.0" width="26" height="20" rx="3" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><text x="67" y="171.0" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">3.0</text>
<text x="100" y="154.0" font-size="15" font-weight="700" fill="#1d3f8a">Reicht das Tempo?</text>
<text x="100" y="174.0" font-size="14">USB-3.0-Gerät am USB-2.0-Hub</text>
<text x="100" y="192.0" font-size="14">bremst aus</text>
<line x1="15" y1="206" x2="385" y2="206" stroke="#ddd" stroke-width="1"/>
<path d="M52.8,226.8 l-14.399999999999999,21.599999999999998 h9.6 l-4.8,16.8 l14.399999999999999,-21.599999999999998 h-9.6 Z" fill="#f2c230" stroke="#a07800" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="242.0" font-size="15" font-weight="700" fill="#E07B00">Ein Kabel für alles?</text>
<text x="100" y="263.0" font-size="14">dann Thunderbolt oder USB4</text>
<line x1="15" y1="286" x2="385" y2="286" stroke="#ddd" stroke-width="1"/>
</svg>
