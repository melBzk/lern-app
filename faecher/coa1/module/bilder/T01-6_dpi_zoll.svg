  <text x="355" y="198" text-anchor="middle" font-size="60" fill="#333">a</text>
  <text x="355" y="136" text-anchor="middle" font-size="13" fill="#555">grob</text>
  <text x="355" y="216" text-anchor="middle" font-size="13" fill="#555">fein</text>
  <rect x="90" y="226" width="220" height="30" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <line x1="90.0" y1="226" x2="90.0" y2="246" stroke="#333" stroke-width="1.5"/><line x1="117.5" y1="226" x2="117.5" y2="240" stroke="#333" stroke-width="1.5"/><line x1="145.0" y1="226" x2="145.0" y2="240" stroke="#333" stroke-width="1.5"/><line x1="172.5" y1="226" x2="172.5" y2="240" stroke="#333" stroke-width="1.5"/><line x1="200.0" y1="226" x2="200.0" y2="246" stroke="#333" stroke-width="1.5"/><line x1="227.5" y1="226" x2="227.5" y2="240" stroke="#333" stroke-width="1.5"/><line x1="255.0" y1="226" x2="255.0" y2="240" stroke="#333" stroke-width="1.5"/><line x1="282.5" y1="226" x2="282.5" y2="240" stroke="#333" stroke-width="1.5"/><line x1="310.0" y1="226" x2="310.0" y2="246" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#b35f00">1 Zoll = 2,54 cm</text>
  <rect x="40" y="290" width="320" height="32" rx="8" fill="#f3f4f6" stroke="#bbb"/>
  <text x="200" y="311" text-anchor="middle" font-size="14" fill="#222">mehr dpi = <tspan font-weight="700">feinere Details</tspan></text>
</svg>
