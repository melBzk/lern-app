<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="system-ui, sans-serif">
  <title>dpi heißt dots per inch, Punkte pro Zoll. Auf derselben Strecke von 1 Zoll gleich 2,54 Zentimeter: oben 300 dpi mit wenigen groben Punkten, daneben ein treppiges a. Unten 1200 dpi mit vielen feinen Punkten, daneben ein glattes a. Mehr dpi bedeutet feinere Details.</title>
  <rect width="400" height="330" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">dpi = dots per inch</text>
  <text x="200" y="47" text-anchor="middle" font-size="15" fill="#222">= Punkte pro Zoll</text>
  <g stroke="#E07B00" stroke-width="1.5" stroke-dasharray="4 4"><line x1="90" y1="76" x2="90" y2="226"/><line x1="310" y1="76" x2="310" y2="226"/></g>
  <text x="10" y="100" font-size="15" font-weight="700" fill="#222">300</text>
  <text x="10" y="117" font-size="13" fill="#222">dpi</text>
  <circle cx="108.3" cy="104" r="15" fill="#333"/><circle cx="145.0" cy="104" r="15" fill="#333"/><circle cx="181.7" cy="104" r="15" fill="#333"/><circle cx="218.3" cy="104" r="15" fill="#333"/><circle cx="255.0" cy="104" r="15" fill="#333"/><circle cx="291.7" cy="104" r="15" fill="#333"/>
  <rect x="344" y="80" width="8" height="8" fill="#333"/><rect x="352" y="80" width="8" height="8" fill="#333"/><rect x="360" y="80" width="8" height="8" fill="#333"/><rect x="368" y="88" width="8" height="8" fill="#333"/><rect x="344" y="96" width="8" height="8" fill="#333"/><rect x="352" y="96" width="8" height="8" fill="#333"/><rect x="360" y="96" width="8" height="8" fill="#333"/><rect x="368" y="96" width="8" height="8" fill="#333"/><rect x="336" y="104" width="8" height="8" fill="#333"/><rect x="368" y="104" width="8" height="8" fill="#333"/><rect x="336" y="112" width="8" height="8" fill="#333"/><rect x="368" y="112" width="8" height="8" fill="#333"/><rect x="344" y="120" width="8" height="8" fill="#333"/><rect x="352" y="120" width="8" height="8" fill="#333"/><rect x="360" y="120" width="8" height="8" fill="#333"/><rect x="368" y="120" width="8" height="8" fill="#333"/>
  <text x="10" y="174" font-size="15" font-weight="700" fill="#222">1200</text>
  <text x="10" y="191" font-size="13" fill="#222">dpi</text>
