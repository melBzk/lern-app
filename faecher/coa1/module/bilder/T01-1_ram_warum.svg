<text x="24" y="294" font-size="15" font-weight="700" fill="#7b3fa0">Arbeitsspeicher</text>
<text x="24" y="316" font-size="15" font-weight="700" fill="#222">Nanosekunden</text>
<rect x="220" y="288" width="6" height="22" rx="2" fill="#7b3fa0" stroke="none" stroke-width="0"/>
<rect x="10" y="340" width="380" height="64" rx="12" fill="#f1f3f5" stroke="#777" stroke-width="2.5"/>
<text x="24" y="368" font-size="15" font-weight="700" fill="#444">Festplatte</text>
<text x="24" y="390" font-size="15" font-weight="700" fill="#222">Millisekunden</text>
<rect x="220" y="362" width="160" height="22" rx="2" fill="#9aa3ad" stroke="none" stroke-width="0"/>
<text x="300" y="378" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">viel länger</text>
<text x="300" y="399" font-size="13" text-anchor="middle" fill="#444">(nicht maßstäblich)</text>
<text x="200" y="430" font-size="15" text-anchor="middle" font-weight="700" fill="#a85400">1 Millisekunde = 1 Million Nanosekunden</text>
