  <line x1="190.5" y1="220.7" x2="156.7" y2="116.9" stroke="#777" stroke-width="2"/>
  <circle cx="156.7" cy="116.9" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="156.7" y="121.9" text-anchor="middle" font-size="14" font-weight="700" fill="#222">J</text>
  <!-- Schlägel -->
  <rect x="186" y="128" width="28" height="22" rx="3" fill="#3a3f4a"/>
  <line x1="200" y1="126" x2="200" y2="114" stroke="#E07B00" stroke-width="3" marker-end="url(#o)"/>
  <text x="200" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#222" stroke="#fff" stroke-width="6" paint-order="stroke">Schlägel</text>
  <!-- Drehpfeil -->
  <path d="M359.4,292.7 A165,165 0 0 1 242.7,409.4" fill="none" stroke="#E07B00" stroke-width="4" marker-end="url(#o)"/>
  <text x="392" y="440" text-anchor="end" font-size="14" font-weight="700" fill="#b35f00">dreht sich zum</text>
