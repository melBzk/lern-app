<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Typenrad von oben: eine Scheibe mit 20 Speichen, an jedem Speichenende ein Buchstabe. Das Rad dreht sich zum richtigen Buchstaben, hier steht K oben vor dem Papier. Dahinter schlägt der Schlägel den Buchstaben durch das Farbband aufs Papier, und auf dem Papier erscheint ein K.</title>
