<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Grafikkarte und Netzteil. Die Grafikkarte steckt im langen PCIe-x16-Steckplatz des Mainboards; der Steckplatz liefert bis 75 Watt. Vom Netzteil führen zwei Zusatzkabel zur Karte: 6-polig gleich 75 Watt, 8-polig gleich 150 Watt. Am Netzteil die Prüffragen: genug Watt? passende Stecker? Unten ein Vergleich: Büro-PC selten über 400 Watt, mehrere Grafikkarten 1.000 Watt und mehr.</title>
<defs><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a000"/></marker></defs>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Grafikkarte braucht Strom</text>

<!-- Kabel -->
<path d="M183,142 V96 H360 V330" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round"/>
<path d="M222,142 V122 H330 V330" fill="none" stroke="#555" stroke-width="5" stroke-linejoin="round"/>
<text x="190" y="88" font-size="14" font-weight="700">6-polig = 75 W</text>
<text x="232" y="115" font-size="14" font-weight="700">8-polig = 150 W</text>

<!-- Grafikkarte -->
<rect x="30" y="150" width="212" height="86" rx="5" fill="#455a64"/>
<g fill="none" stroke="#cfd8dc" stroke-width="3"><circle cx="80" cy="192" r="26"/><circle cx="192" cy="192" r="26"/></g>
<g fill="#cfd8dc"><circle cx="80" cy="192" r="5"/><circle cx="192" cy="192" r="5"/></g>
<rect x="170" y="140" width="26" height="12" rx="2" fill="#222"/>
<rect x="206" y="140" width="32" height="12" rx="2" fill="#222"/>
<text x="30" y="138" font-size="15" font-weight="700">Grafikkarte</text>
<rect x="60" y="236" width="160" height="12" fill="#c9a227"/>

<!-- Mainboard mit Steckplatz -->
<rect x="10" y="252" width="250" height="40" rx="3" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<rect x="50" y="244" width="180" height="14" rx="2" fill="#111"/>
<rect x="60" y="240" width="160" height="10" fill="#c9a227"/>
<path d="M131,234 V196 H123 L136,172 L149,196 H141 V234 Z" fill="#e0a000"/>
<text x="20" y="318" font-size="15" font-weight="700">PCIe x16</text>
<text x="20" y="338" font-size="15">Steckplatz: <tspan font-weight="700" fill="#b45f06">bis 75 W</tspan></text>

<!-- Netzteil -->
<rect x="270" y="330" width="110" height="74" rx="5" fill="#9aa5b1"/>
<circle cx="325" cy="367" r="24" fill="#eceff1" stroke="#555" stroke-width="2.5"/>
<path d="M308,350 L342,384 M342,350 L308,384" stroke="#555" stroke-width="2"/>
<text x="325" y="424" text-anchor="middle" font-size="15" font-weight="700">Netzteil</text>
<rect x="246" y="432" width="148" height="46" rx="8" fill="#fbe3e9" stroke="#D4607A" stroke-width="2"/>
<text x="320" y="451" text-anchor="middle" font-size="14" font-weight="700">genug Watt?</text>
<text x="320" y="470" text-anchor="middle" font-size="14" font-weight="700">passende Stecker?</text>

<!-- Vergleich -->
<line x1="10" y1="490" x2="390" y2="490" stroke="#ccc" stroke-width="1.5"/>
<rect x="10" y="500" width="144" height="22" rx="3" fill="#cfe0fb"/>
<text x="16" y="516" font-size="13" font-weight="700">Büro-PC</text>
<text x="162" y="516" font-size="13">selten über 400 W</text>
<rect x="10" y="528" width="330" height="22" rx="3" fill="#3a6ed8"/>
<path d="M340,528 l18,11 l-18,11 z" fill="#3a6ed8"/>
<text x="16" y="544" font-size="13" font-weight="700" fill="#fff">mehrere Grafikkarten: 1.000 W und mehr</text>
</svg>
