<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <title>Weg des Stroms: Aus der Steckdose kommen 230 Volt Wechselspannung mit 50 Hertz. Das Netzteil macht daraus die Gleichspannungen 12 V, 5 V und 3,3 V für das Mainboard. Spannungswandler auf dem Mainboard erzeugen daraus alle weiteren Spannungen für CPU, RAM und Chips. Das Netzteil nie öffnen – innen lebensgefährliche Spannungen.</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d4a000"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker>
  </defs>
  <rect width="400" height="540" fill="#fff"/>

  <!-- 1 Steckdose -->
  <circle cx="70" cy="56" r="38" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <circle cx="70" cy="56" r="27" fill="#fff" stroke="#999"/>
  <circle cx="58" cy="56" r="5" fill="#333"/><circle cx="82" cy="56" r="5" fill="#333"/>
  <text x="128" y="44" font-size="16" font-weight="700">230 V Wechselspannung</text>
  <text x="128" y="76" font-size="34" font-weight="700" fill="#3a6ed8">~</text>
  <text x="160" y="70" font-size="15">50 Hz</text>

  <line x1="70" y1="96" x2="70" y2="130" stroke="#333" stroke-width="3" marker-end="url(#g)"/>

  <!-- 2 Netzteil -->
  <rect x="20" y="134" width="360" height="86" rx="8" fill="#3a3f4a"/>
  <circle cx="80" cy="177" r="32" fill="#22262d" stroke="#888" stroke-width="2"/>
  <g stroke="#888" stroke-width="2"><line x1="80" y1="145" x2="80" y2="209"/><line x1="48" y1="177" x2="112" y2="177"/><line x1="57" y1="154" x2="103" y2="200"/><line x1="103" y1="154" x2="57" y2="200"/></g>
  <circle cx="80" cy="177" r="7" fill="#888"/>
  <text x="135" y="164" font-size="20" font-weight="700" fill="#fff">Netzteil</text>
  <text x="135" y="186" font-size="14" fill="#e6e9ee">wandelt ~ in Gleichspannung = um</text>
  <text x="135" y="208" font-size="13" font-weight="700" fill="#ffb3b3">nie öffnen – lebensgefährlich!</text>

  <!-- 3 drei Spannungen -->
  <line x1="80" y1="222" x2="80" y2="292" stroke="#d4a000" stroke-width="6" marker-end="url(#y)"/>
  <line x1="185" y1="222" x2="185" y2="292" stroke="#d63c3c" stroke-width="6" marker-end="url(#r)"/>
  <line x1="290" y1="222" x2="290" y2="292" stroke="#e07b1a" stroke-width="6" marker-end="url(#o)"/>
  <g font-size="18" font-weight="700">
    <text x="92" y="262">12 V =</text>
    <text x="197" y="262">5 V =</text>
    <text x="302" y="262">3,3 V =</text>
  </g>

  <!-- 4 Mainboard -->
  <rect x="20" y="300" width="360" height="226" rx="8" fill="#e3f1e7" stroke="#2e7d4f" stroke-width="2"/>
  <text x="34" y="324" font-size="16" font-weight="700" fill="#1c6b3c">Mainboard</text>
  <rect x="120" y="336" width="160" height="40" rx="6" fill="#fff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="200" y="361" text-anchor="middle" font-size="15" font-weight="700">Spannungswandler</text>
  <g stroke="#333" stroke-width="1.5" marker-end="url(#g)">
    <line x1="160" y1="378" x2="90" y2="452"/>
    <line x1="200" y1="378" x2="200" y2="452"/>
    <line x1="240" y1="378" x2="310" y2="452"/>
  </g>
  <text x="290" y="404" font-size="13" fill="#1c6b3c" font-weight="700">alle weiteren</text>
  <text x="290" y="420" font-size="13" fill="#1c6b3c" font-weight="700">Spannungen</text>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="50" y="456" width="80" height="40" rx="5" fill="#3a3f4a"/><text x="90" y="481" fill="#fff">CPU</text>
    <rect x="160" y="456" width="80" height="40" rx="5" fill="#2e9e5b"/><text x="200" y="481" fill="#fff">RAM</text>
    <rect x="270" y="456" width="80" height="40" rx="5" fill="#555"/><text x="310" y="481" fill="#fff">Chips</text>
  </g>
</svg>
