<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" font-family="system-ui, sans-serif">
  <title>Vergleich Datumsstempel und Typenrad. Oben ein Bürostempel mit drehbaren Rädchen für Tag, Monat und Jahr; man dreht die Rädchen einmal ein und stempelt dann oft, der Abdruck zeigt 24. NOV 2026. Unten ein Typenrad mit Buchstaben an den Speichen: Es dreht sich für jeden Buchstaben neu und schlägt durch ein Farbband.</title>
