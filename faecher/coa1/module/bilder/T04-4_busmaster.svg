<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ein PCI-Bus als senkrechte Leitung mit zehn nummerierten Steckplätzen, Schild: max. 10 Geräte. Karte 3 trägt eine Krone: Bus-Master, hat gerade die Kontrolle. Die anderen Karten sind Slaves und warten. Kasten: Normal gibt die CPU den Auftrag und die Bridge führt ihn auf dem Bus aus. Beim Bus-Mastering gibt die CPU die Kontrolle kurz an eine Karte ab. Eine Lupe auf Karte 7: Plug and Play, die Karte wird automatisch erkannt. Unten führt eine PCI-PCI-Bridge zu einem zweiten PCI-Bus für mehr Geräte.</title>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Wer darf den Bus steuern?</text>
<line x1="60" y1="70" x2="60" y2="470" stroke="#555" stroke-width="7" stroke-linecap="round"/>
<text x="60" y="58" text-anchor="middle" font-weight="700">PCI-Bus</text>
<text x="48" y="102" text-anchor="end" font-weight="700">1</text><line x1="60" y1="97" x2="80" y2="97" stroke="#555" stroke-width="3"/><rect x="80" y="84" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="102" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="138" text-anchor="end" font-weight="700">2</text><line x1="60" y1="133" x2="80" y2="133" stroke="#555" stroke-width="3"/><rect x="80" y="120" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="138" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="174" text-anchor="end" font-weight="700">3</text><line x1="60" y1="169" x2="80" y2="169" stroke="#555" stroke-width="3"/><rect x="80" y="156" width="110" height="26" rx="3" fill="#fff3e0" stroke="#E07B00" stroke-width="3"/><text x="135" y="174" text-anchor="middle" font-size="13" font-weight="700">Master</text>
<text x="48" y="210" text-anchor="end" font-weight="700">4</text><line x1="60" y1="205" x2="80" y2="205" stroke="#555" stroke-width="3"/><rect x="80" y="192" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="210" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="246" text-anchor="end" font-weight="700">5</text><line x1="60" y1="241" x2="80" y2="241" stroke="#555" stroke-width="3"/><rect x="80" y="228" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="246" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="282" text-anchor="end" font-weight="700">6</text><line x1="60" y1="277" x2="80" y2="277" stroke="#555" stroke-width="3"/><rect x="80" y="264" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="282" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="318" text-anchor="end" font-weight="700">7</text><line x1="60" y1="313" x2="80" y2="313" stroke="#555" stroke-width="3"/><rect x="80" y="300" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="318" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="354" text-anchor="end" font-weight="700">8</text><line x1="60" y1="349" x2="80" y2="349" stroke="#555" stroke-width="3"/><rect x="80" y="336" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="354" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="390" text-anchor="end" font-weight="700">9</text><line x1="60" y1="385" x2="80" y2="385" stroke="#555" stroke-width="3"/><rect x="80" y="372" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="390" text-anchor="middle" font-size="13">Slave: wartet</text>
<text x="48" y="426" text-anchor="end" font-weight="700">10</text><line x1="60" y1="421" x2="80" y2="421" stroke="#555" stroke-width="3"/><rect x="80" y="408" width="110" height="26" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="135" y="426" text-anchor="middle" font-size="13">Slave: wartet</text>
<!-- Schild max 10 -->
<rect x="236" y="70" width="140" height="44" rx="8" fill="#c62828"/>
<text x="306" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">max. 10 Geräte</text>
<!-- Krone + Master-Text -->
<path d="M196,166 L196,150 L205,158 L214,146 L223,158 L232,150 L232,166 Z" fill="#E07B00"/>
<text x="240" y="162" font-size="15" font-weight="700" fill="#b85f00">Bus-Master:</text>
<text x="240" y="180" font-size="13">hat gerade die Kontrolle</text>
<!-- Wer bestimmt? -->
<rect x="200" y="194" width="192" height="84" rx="8" fill="#fff3e0" stroke="#E07B00" stroke-width="2"/>
<text x="210" y="212" font-size="13" font-weight="700">Normal:</text>
<text x="210" y="228" font-size="13">CPU gibt Auftrag, Bridge</text>
<text x="210" y="243" font-size="13">führt ihn auf dem Bus aus.</text>
<text x="210" y="261" font-size="13" font-weight="700" fill="#b85f00">Bus-Mastering:</text>
<text x="210" y="274" font-size="12.5">CPU gibt Kontrolle kurz ab.</text>
<!-- Lupe -->
<line x1="190" y1="313" x2="252" y2="313" stroke="#3a6ed8" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="282" cy="313" r="28" fill="#fff" stroke="#3a6ed8" stroke-width="4"/>
<line x1="302" y1="333" x2="322" y2="353" stroke="#3a6ed8" stroke-width="7" stroke-linecap="round"/>
<path d="M268,313 L278,323 L296,302" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="246" y="380" font-weight="700">Plug &amp; Play:</text>
<text x="246" y="398" font-size="13">automatisch erkannt</text>
<!-- PCI-PCI-Bridge -->
<line x1="60" y1="470" x2="60" y2="486" stroke="#555" stroke-width="4"/>
<rect x="14" y="486" width="150" height="40" rx="6" fill="#555"/>
<text x="89" y="511" text-anchor="middle" font-weight="700" fill="#fff">PCI-PCI-Bridge</text>
<line x1="166" y1="506" x2="222" y2="506" stroke="#555" stroke-width="4"/><path d="M220,498 L234,506 L220,514 Z" fill="#555"/>
<line x1="242" y1="494" x2="388" y2="494" stroke="#555" stroke-width="7" stroke-linecap="round"/>
<text x="242" y="518" font-weight="700">zweiter PCI-Bus</text>
<text x="242" y="536" font-size="13">für mehr Geräte</text>
</svg>
