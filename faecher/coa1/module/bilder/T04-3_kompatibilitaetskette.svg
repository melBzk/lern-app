<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Der Prüfweg: In der Mitte das Mainboard. Pfeile gehen zu den Teilen, die Zahl zeigt die Reihenfolge der Prüfung. 1 CPU: Hersteller und Sockel gleich? BIOS-Version? 2 RAM: DDR-Generation? Höchstmenge? Kit? 3 Gehäuse: Formfaktor? Midi-Tower laut Buch: ATX ja, E-ATX nein. 4 Grafikkarte: PCIe x16 und Zusatzstrom. 4 Netzteil: genug Watt? passende Stecker? 5 Kühler: TDP geschafft? Paste dabei?</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="570" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Passt alles zum Mainboard?</text>
<text x="200" y="46" text-anchor="middle" font-size="13" fill="#444">Zahl = Reihenfolge der Prüfung</text>

<!-- Pfeile -->
<g stroke="#333" stroke-width="2.5" marker-end="url(#a)">
<line x1="172" y1="230" x2="62" y2="146"/>
<line x1="226" y1="230" x2="238" y2="144"/>
<line x1="252" y1="262" x2="274" y2="262"/>
<line x1="148" y1="262" x2="126" y2="262"/>
<line x1="168" y1="360" x2="92" y2="424"/>
<line x1="228" y1="360" x2="240" y2="414"/>
</g>

<!-- Mainboard -->
<rect x="148" y="230" width="104" height="130" rx="4" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2.5"/>
<rect x="166" y="246" width="30" height="30" rx="2" fill="#9aa5b1"/>
<g fill="#555"><rect x="212" y="244" width="6" height="58"/><rect x="224" y="244" width="6" height="58"/><rect x="160" y="312" width="74" height="7"/></g>
<text x="200" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1b4d36">Mainboard</text>

<!-- 1 CPU -->
<rect x="28" y="68" width="48" height="48" rx="4" fill="#455a64"/>
<rect x="40" y="80" width="24" height="24" rx="2" fill="#9aa5b1"/>
<g stroke="#9aa5b1" stroke-width="2"><path d="M36,62 v6 M46,62 v6 M58,62 v6 M68,62 v6 M36,116 v6 M46,116 v6 M58,116 v6 M68,116 v6"/></g>
<circle cx="103" cy="78" r="12" fill="#D4607A"/><text x="103" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="121" y="84" font-size="15" font-weight="700">CPU</text>
<text x="92" y="106">Hersteller +</text>
<text x="92" y="123">Sockel gleich?</text>
<text x="92" y="140">BIOS-Version?</text>

<!-- 5 Kühler -->
<rect x="212" y="66" width="52" height="16" rx="3" fill="#3a6ed8"/>
<g fill="#9aa5b1"><rect x="214" y="84" width="5" height="34"/><rect x="223" y="84" width="5" height="34"/><rect x="232" y="84" width="5" height="34"/><rect x="241" y="84" width="5" height="34"/><rect x="250" y="84" width="5" height="34"/><rect x="259" y="84" width="5" height="34"/></g>
<circle cx="285" cy="78" r="12" fill="#D4607A"/><text x="285" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
<text x="303" y="84" font-size="15" font-weight="700">Kühler</text>
<text x="274" y="106">TDP geschafft?</text>
<text x="274" y="123">Paste dabei?</text>

<!-- 4 Grafikkarte -->
<circle cx="20" cy="228" r="12" fill="#D4607A"/><text x="20" y="233" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="37" y="234" font-size="15" font-weight="700">Grafikkarte</text>
<rect x="10" y="246" width="112" height="34" rx="4" fill="#455a64"/>
<g fill="none" stroke="#cfd8dc" stroke-width="2.5"><circle cx="44" cy="263" r="11"/><circle cx="88" cy="263" r="11"/></g>
<rect x="30" y="280" width="70" height="6" fill="#c9a227"/>
<text x="10" y="306">PCIe x16 +</text>
<text x="10" y="323">Zusatzstrom</text>

<!-- 2 RAM -->
<circle cx="290" cy="228" r="12" fill="#D4607A"/><text x="290" y="233" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="308" y="234" font-size="15" font-weight="700">RAM</text>
<rect x="278" y="248" width="112" height="26" rx="2" fill="#2e7d32"/>
<g fill="#1a1a1a"><rect x="286" y="252" width="16" height="12"/><rect x="308" y="252" width="16" height="12"/><rect x="330" y="252" width="16" height="12"/><rect x="352" y="252" width="16" height="12"/></g>
<rect x="282" y="267" width="104" height="5" fill="#c9a227"/>
<text x="278" y="300">DDR-Generation?</text>
<text x="278" y="317">Höchstmenge?</text>
<text x="278" y="334">Kit?</text>

<!-- 4 Netzteil -->
<rect x="14" y="430" width="70" height="56" rx="4" fill="#9aa5b1"/>
<circle cx="49" cy="458" r="19" fill="#eceff1" stroke="#555" stroke-width="2.5"/>
<path d="M36,445 L62,471 M62,445 L36,471" stroke="#555" stroke-width="2"/>
<circle cx="107" cy="440" r="12" fill="#D4607A"/><text x="107" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="125" y="446" font-size="15" font-weight="700">Netzteil</text>
<text x="96" y="468">genug Watt?</text>
<text x="96" y="485">passende</text>
<text x="96" y="502">Stecker?</text>

<!-- 3 Gehäuse -->
<rect x="216" y="420" width="50" height="100" rx="4" fill="#eceff1" stroke="#333" stroke-width="2.5"/>
<line x1="224" y1="436" x2="258" y2="436" stroke="#555" stroke-width="3"/>
<circle cx="241" cy="502" r="5" fill="none" stroke="#555" stroke-width="2.5"/>
<circle cx="291" cy="440" r="12" fill="#D4607A"/><text x="291" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
<text x="309" y="446" font-size="15" font-weight="700">Gehäuse</text>
<text x="280" y="468">Formfaktor?</text>
<text x="276" y="485" font-size="12" fill="#444">Midi-Tower (Buch):</text>
<text x="280" y="508" font-weight="700" fill="#2e7d32">ATX ✔</text>
<text x="280" y="528" font-weight="700" fill="#c62828">E-ATX ✘</text>

<text x="200" y="558" text-anchor="middle" font-size="14" font-weight="700">Start immer bei der CPU</text>
</svg>
