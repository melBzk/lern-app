    <circle cx="74" cy="34" r="3.5" fill="#1fa3c9"/><circle cx="74" cy="46" r="3.5" fill="#1fa3c9"/>
    <circle cx="88" cy="36" r="3.5" fill="#d6338a"/><circle cx="88" cy="48" r="3.5" fill="#d6338a"/>
    <circle cx="102" cy="33" r="3.5" fill="#f2c200"/><circle cx="102" cy="45" r="3.5" fill="#f2c200"/>
    <circle cx="116" cy="35" r="3.5" fill="#111"/><circle cx="116" cy="47" r="3.5" fill="#111"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Tintenstrahldrucker</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Tröpfchen aus Düsen</text></g>

