<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" font-family="system-ui, sans-serif" role="img">
  <title>Die 8 neuen Wörter als Bildkacheln. Nadeldrucker: Nadeln und Farbband. Laserdrucker: Laser, Trommel, Toner. Xerografie: Ladung auf der Trommel, Toner haftet. Toner: feines Farbpulver. Tintenstrahldrucker: Tröpfchen aus Düsen. CMYK: Cyan, Magenta, Yellow, K gleich Key gleich Schwarz. Thermosublimation: Hitze bringt Farbe von der Folie ins Papier. Dokumentenecht: bleibt, auch bei Nässe.</title>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker></defs>
  <rect width="400" height="488" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Die 8 neuen Wörter</text>

  <g transform="translate(8,40)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="70" y="8" width="48" height="20" rx="3" fill="#3a3f4a"/>
    <g stroke="#333" stroke-width="3"><line x1="80" y1="28" x2="80" y2="44"/><line x1="94" y1="28" x2="94" y2="44"/><line x1="108" y1="28" x2="108" y2="44"/></g>
    <rect x="62" y="38" width="64" height="5" fill="#111"/><rect x="56" y="46" width="76" height="5" fill="#fff" stroke="#333"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Nadeldrucker</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Nadeln + Farbband</text></g>

  <g transform="translate(204,40)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <circle cx="86" cy="32" r="20" fill="#d9dde3" stroke="#555" stroke-width="2"/>
    <line x1="146" y1="8" x2="106" y2="24" stroke="#d63c3c" stroke-width="3" marker-end="url(#r)"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Laserdrucker</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Laser, Trommel, Toner</text></g>

  <g transform="translate(8,152)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <circle cx="94" cy="32" r="20" fill="#d9dde3" stroke="#555" stroke-width="2"/>
    <g font-size="15" font-weight="700" fill="#E07B00" text-anchor="middle"><text x="64" y="22">+</text><text x="60" y="44">+</text><text x="124" y="22">+</text></g>
    <g fill="#111"><circle cx="118" cy="40" r="3"/><circle cx="124" cy="47" r="3"/><circle cx="114" cy="49" r="3"/></g>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Xerografie</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Ladung → Toner haftet</text></g>

  <g transform="translate(204,152)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="62" y="10" width="64" height="24" rx="4" fill="#3a3f4a"/>
    <g fill="#111"><circle cx="76" cy="42" r="2.5"/><circle cx="88" cy="46" r="2.5"/><circle cx="98" cy="41" r="2.5"/><circle cx="108" cy="47" r="2.5"/><circle cx="82" cy="50" r="2.5"/><circle cx="114" cy="42" r="2.5"/></g>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Toner</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">feines Farbpulver</text></g>

  <g transform="translate(8,264)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
