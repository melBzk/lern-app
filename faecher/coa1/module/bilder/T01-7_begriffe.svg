    <g font-size="14" font-weight="700" text-anchor="middle"><text x="58" y="35" fill="#fff">C</text><text x="82" y="35" fill="#fff">M</text><text x="106" y="35" fill="#222">Y</text><text x="130" y="35" fill="#fff">K</text></g>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">CMYK</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">K = Key = Schwarz</text></g>

  <g transform="translate(8,376)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="60" y="6" width="68" height="18" rx="3" fill="#3a3f4a"/>
    <rect x="44" y="28" width="34" height="7" fill="#f2c200"/><rect x="78" y="28" width="34" height="7" fill="#d6338a"/><rect x="112" y="28" width="34" height="7" fill="#1fa3c9"/>
    <ellipse cx="94" cy="41" rx="7" ry="4" fill="#d6338a" fill-opacity="0.6"/>
    <rect x="44" y="46" width="102" height="6" fill="#fff" stroke="#333"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Thermosublimation</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Hitze: Folie → Papier</text></g>

  <g transform="translate(204,376)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="66" y="6" width="34" height="46" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <g stroke="#333" stroke-width="2"><line x1="71" y1="16" x2="95" y2="16"/><line x1="71" y1="24" x2="95" y2="24"/><line x1="71" y1="32" x2="95" y2="32"/><line x1="71" y1="40" x2="89" y2="40"/></g>
    <path d="M118,8 C112,18 108,24 108,30 a10,10 0 0 0 20,0 C128,24 124,18 118,8 z" fill="#1fa3c9"/>
    <path d="M108,46 l6,6 l12,-14" fill="none" stroke="#1f9d55" stroke-width="4"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">dokumentenecht</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">bleibt, auch bei Nässe</text></g>
</svg>
