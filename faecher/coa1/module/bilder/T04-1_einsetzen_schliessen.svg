<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Neue CPU einsetzen und PC schließen. Oben: Die CPU schwebt über dem Sockel. Das Dreieck an der CPU-Ecke gehört auf die Markierung am Sockel, gestrichelt verbunden; die Kerben gehören auf die Nasen. Ein Pfeil zeigt senkrecht nach unten: ohne Kraft. Ein schräger Pfeil ist durchgestrichen: nicht kippen. Rechts am Sockel der Hebel. Unten die Checkliste: Alle Kabel verbunden? Nichts im PC vergessen? Kein Kabel eingeklemmt? Netzstecker zuletzt! Funktionstest.</title>
<rect width="400" height="580" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">CPU einsetzen, PC schließen</text>

<!-- CPU -->
<rect x="110" y="56" width="100" height="80" rx="3" fill="#555"/>
<rect x="122" y="66" width="76" height="60" rx="3" fill="#c9ced4"/>
<rect x="110" y="70" width="7" height="12" fill="#fff"/><rect x="203" y="70" width="7" height="12" fill="#fff"/>
<path d="M113,133 L113,121 L125,133 Z" fill="#E07B00"/>
<text x="102" y="81" text-anchor="end" font-size="14" font-weight="700">Kerbe</text>
<text x="102" y="137" text-anchor="end" font-size="14" font-weight="700" fill="#E07B00">Dreieck</text>

<!-- Pfeil senkrecht -->
<line x1="160" y1="144" x2="160" y2="176" stroke="#E07B00" stroke-width="5"/>
<path d="M149,174 L171,174 L160,190 Z" fill="#E07B00"/>
<text x="176" y="164" font-size="15" font-weight="700" fill="#E07B00">senkrecht,</text>
<text x="176" y="184" font-size="15" font-weight="700" fill="#E07B00">ohne Kraft</text>

<!-- Sockel -->
<rect x="96" y="196" width="128" height="100" rx="3" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="110" y="206" width="100" height="80" fill="#fff" stroke="#555" stroke-width="1.5"/>
<g fill="#9aa5b1">
<circle cx="130" cy="230" r="1.8"/><circle cx="142" cy="230" r="1.8"/><circle cx="154" cy="230" r="1.8"/><circle cx="166" cy="230" r="1.8"/><circle cx="178" cy="230" r="1.8"/><circle cx="190" cy="230" r="1.8"/>
<circle cx="130" cy="244" r="1.8"/><circle cx="142" cy="244" r="1.8"/><circle cx="154" cy="244" r="1.8"/><circle cx="166" cy="244" r="1.8"/><circle cx="178" cy="244" r="1.8"/><circle cx="190" cy="244" r="1.8"/>
<circle cx="130" cy="258" r="1.8"/><circle cx="142" cy="258" r="1.8"/><circle cx="154" cy="258" r="1.8"/><circle cx="166" cy="258" r="1.8"/><circle cx="178" cy="258" r="1.8"/><circle cx="190" cy="258" r="1.8"/>
<circle cx="130" cy="272" r="1.8"/><circle cx="142" cy="272" r="1.8"/><circle cx="154" cy="272" r="1.8"/><circle cx="166" cy="272" r="1.8"/><circle cx="178" cy="272" r="1.8"/><circle cx="190" cy="272" r="1.8"/>
</g>
<rect x="110" y="220" width="7" height="12" fill="#555"/><rect x="203" y="220" width="7" height="12" fill="#555"/>
<path d="M113,283 L113,271 L125,283 Z" fill="#E07B00"/>
<text x="88" y="231" text-anchor="end" font-size="14" font-weight="700">Nase</text>
<text x="88" y="287" text-anchor="end" font-size="14" font-weight="700" fill="#E07B00">Markierung</text>
<line x1="116" y1="136" x2="116" y2="268" stroke="#E07B00" stroke-width="2" stroke-dasharray="4 4"/>
<!-- Hebel -->
<path d="M232,292 L232,206 L240,200" fill="none" stroke="#555" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="248" y="252" font-size="14" font-weight="700">Hebel</text>

<!-- schräg durchgestrichen -->
<line x1="318" y1="74" x2="346" y2="114" stroke="#9aa5b1" stroke-width="5"/>
<path d="M340,120 L360,128 L352,108 Z" fill="#9aa5b1"/>
<rect x="282" y="48" width="64" height="16" rx="2" fill="#555" transform="rotate(-25 314 56)"/>
<line x1="294" y1="128" x2="366" y2="50" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<text x="330" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">nicht kippen</text>

<!-- Checkliste -->
<rect x="10" y="316" width="380" height="256" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="26" y="344" font-size="16" font-weight="700">Vor dem Einschalten:</text>
<g fill="#fff" stroke="#2e7d32" stroke-width="2.5">
<rect x="26" y="360" width="24" height="24" rx="4"/><rect x="26" y="400" width="24" height="24" rx="4"/><rect x="26" y="440" width="24" height="24" rx="4"/><rect x="26" y="480" width="24" height="24" rx="4" stroke="#E07B00"/><rect x="26" y="520" width="24" height="24" rx="4"/>
</g>
<g fill="none" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M31,372 L37,378 L46,365"/><path d="M31,412 L37,418 L46,405"/><path d="M31,452 L37,458 L46,445"/><path d="M31,492 L37,498 L46,485" stroke="#E07B00"/><path d="M31,532 L37,538 L46,525"/>
</g>
<text x="64" y="378" font-size="15">Alle Kabel verbunden?</text>
<text x="64" y="418" font-size="15">Nichts im PC vergessen?</text>
<text x="64" y="458" font-size="15">Kein Kabel eingeklemmt?</text>
<text x="64" y="498" font-size="16" font-weight="700" fill="#E07B00">Netzstecker zuletzt!</text>
<text x="64" y="538" font-size="15">Dann: Funktionstest</text>
</svg>
