<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222">
<title>Steckbrief microATX: Anschlüsse sitzen wie bei ATX, darum passt es ins ATX-Gehäuse; passt auch in kleinere Gehäuse; oft günstiger. Nachteil: enger Aufbau, Kühlung schwieriger, weniger Steckkarten. Steckbrief Mini-ITX: beliebt für Thin Clients, läuft mit ATX-Netzteil, passt auch ins ATX-Gehäuse.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Zwei kleine Formfaktoren</text>
<!-- microATX -->
<rect x="10" y="46" width="380" height="190" rx="10" fill="#eef8f0" stroke="#2e9d5b" stroke-width="2"/>
<rect x="24" y="58" width="44" height="44" fill="#d4efd9" stroke="#2e9d5b" stroke-width="2"/>
<text x="82" y="86" font-size="17" font-weight="700" fill="#1f7a45">microATX</text>
<g font-size="14">
<text x="26" y="130"><tspan fill="#2e9d5b" font-weight="700">+</tspan>  wie ATX → passt ins ATX-Gehäuse</text>
<text x="26" y="154"><tspan fill="#2e9d5b" font-weight="700">+</tspan>  passt auch in kleinere Gehäuse</text>
<text x="26" y="178"><tspan fill="#2e9d5b" font-weight="700">+</tspan>  oft günstiger</text>
<text x="26" y="206"><tspan fill="#d43c3c" font-weight="700">–</tspan>  eng: Kühlung schwieriger,</text>
<text x="40" y="225">weniger Steckkarten</text>
</g>
<!-- Mini-ITX -->
<rect x="10" y="250" width="380" height="140" rx="10" fill="#fff6ec" stroke="#e08a2e" stroke-width="2"/>
<rect x="30" y="264" width="31" height="31" fill="#fde3c4" stroke="#e08a2e" stroke-width="2"/>
<text x="82" y="286" font-size="17" font-weight="700" fill="#a8590f">Mini-ITX</text>
<g font-size="14">
<text x="26" y="322"><tspan fill="#2e9d5b" font-weight="700">+</tspan>  beliebt für Thin Clients</text>
<text x="26" y="346"><tspan fill="#2e9d5b" font-weight="700">+</tspan>  läuft mit ATX-Netzteil</text>
<text x="26" y="370"><tspan fill="#2e9d5b" font-weight="700">+</tspan>  passt auch ins ATX-Gehäuse</text>
</g>
</svg>
