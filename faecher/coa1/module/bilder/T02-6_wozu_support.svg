<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="system-ui, sans-serif" fill="#222">
<title>Zwei Situationen. Oben Support: Nach dem Nachrüsten von Arbeitsspeicher piept der PC beim Start, also Riegel prüfen: ist die Arretierung ganz zu? Unten AP1: Hardware nach Datenblatt auswählen und begründen, zum Beispiel welche RAM-Generation, welcher SATA-Standard und wie viele PCIe-Steckplätze.</title>
<rect width="400" height="370" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Wo du das brauchst</text>
<!-- Support -->
<rect x="10" y="44" width="380" height="140" rx="10" fill="#f4f1ee"/>
<text x="24" y="68" font-size="15" font-weight="700">Im Support</text>
<rect x="28" y="84" width="60" height="80" rx="5" fill="#fff" stroke="#333" stroke-width="3"/>
<g fill="none" stroke="#D4607A" stroke-width="3" stroke-linecap="round"><path d="M96,104 q8,10 0,20"/><path d="M106,98 q12,16 0,32"/></g>
<text x="128" y="112" font-size="16" font-weight="700" fill="#D4607A">„Piep, piep!“</text>
<text x="128" y="140" font-size="14">→ Riegel prüfen:</text>
<text x="128" y="162" font-size="14" font-weight="700">Arretierung ganz zu?</text>
<!-- AP1 -->
<rect x="10" y="196" width="380" height="164" rx="10" fill="#f4f1ee"/>
<text x="24" y="220" font-size="15" font-weight="700">In der AP1: nach Datenblatt wählen</text>
<rect x="28" y="236" width="80" height="108" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<g stroke="#999" stroke-width="2"><line x1="38" y1="252" x2="98" y2="252"/><line x1="38" y1="266" x2="90" y2="266"/><line x1="38" y1="280" x2="98" y2="280"/><line x1="38" y1="294" x2="86" y2="294"/><line x1="38" y1="308" x2="98" y2="308"/><line x1="38" y1="322" x2="80" y2="322"/></g>
<g font-size="14">
<text x="128" y="258">✓ welche RAM-Generation?</text>
<text x="128" y="290">✓ welcher SATA-Standard?</text>
<text x="128" y="322">✓ wie viele PCIe-Plätze?</text>
</g>
</svg>
