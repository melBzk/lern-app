<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="system-ui, sans-serif">
  <title>Warum Leistung messen? Oben ein Blatt mit den Kennzahlen Takt in GHz, Anzahl der Kerne und Cache in MB und einem großen Fragezeichen: Die Zahlen allein sagen nicht, wie schnell der Rechner wirklich ist. Darunter eine Kette aus den Gliedern CPU, RAM, Mainboard und Grafikkarte. Das Glied RAM ist dünn und rot: Ein Schwachpunkt bremst alles. Unten eine Stoppuhr: Ein Benchmark misst das echte Ergebnis.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
  </defs>
  <rect width="400" height="540" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Kennzahlen allein reichen nicht</text>

  <!-- 1 Datenblatt -->
  <circle cx="24" cy="66" r="12" fill="#3a6ed8"/><text x="24" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <path d="M50,48 L230,48 L250,68 L250,160 L50,160 Z" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <path d="M230,48 L230,68 L250,68" fill="none" stroke="#555" stroke-width="2"/>
  <text x="64" y="72" font-size="13" fill="#555">Kennzahlen</text>
  <text x="64" y="98" font-size="16" font-weight="700" fill="#222">Takt in GHz</text>
  <text x="64" y="122" font-size="16" font-weight="700" fill="#222">Anzahl Kerne</text>
  <text x="64" y="146" font-size="16" font-weight="700" fill="#222">Cache in MB</text>
  <text x="315" y="140" text-anchor="middle" font-size="80" font-weight="700" fill="#3a6ed8">?</text>
  <text x="322" y="160" text-anchor="middle" font-size="13" fill="#222">wie schnell wirklich?</text>

  <line x1="200" y1="170" x2="200" y2="200" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2 Kette -->
  <circle cx="24" cy="226" r="12" fill="#3a6ed8"/><text x="24" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="44" y="231" font-size="14" font-weight="700" fill="#222">Alle Teile arbeiten zusammen</text>
  <rect x="10" y="250" width="88" height="54" rx="27" fill="none" stroke="#555" stroke-width="9"/>
  <rect x="88" y="250" width="88" height="54" rx="27" fill="none" stroke="#d63c3c" stroke-width="3"/>
  <rect x="166" y="250" width="118" height="54" rx="27" fill="none" stroke="#555" stroke-width="9"/>
  <rect x="274" y="250" width="118" height="54" rx="27" fill="none" stroke="#555" stroke-width="9"/>
  <text x="54" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#222">CPU</text>
  <text x="132" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#d63c3c">RAM</text>
  <text x="225" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Mainboard</text>
  <text x="333" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Grafikkarte</text>
  <line x1="132" y1="346" x2="132" y2="314" stroke="#d63c3c" stroke-width="3" marker-end="url(#r)"/>
  <text x="150" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#d63c3c">Schwachpunkt bremst alles</text>

  <line x1="200" y1="378" x2="200" y2="408" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3 Stoppuhr -->
  <circle cx="24" cy="440" r="12" fill="#3a6ed8"/><text x="24" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <rect x="83" y="418" width="18" height="10" rx="2" fill="#555"/>
  <circle cx="92" cy="474" r="44" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="4"/>
  <g stroke="#3a6ed8" stroke-width="3" stroke-linecap="round">
    <line x1="92" y1="436" x2="92" y2="444"/><line x1="130" y1="474" x2="122" y2="474"/>
    <line x1="92" y1="512" x2="92" y2="504"/><line x1="54" y1="474" x2="62" y2="474"/>
  </g>
  <line x1="92" y1="474" x2="114" y2="456" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="92" cy="474" r="4" fill="#222"/>
  <rect x="160" y="440" width="228" height="66" rx="10" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
  <text x="274" y="467" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Benchmark misst</text>
  <text x="274" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#222">das echte Ergebnis</text>
</svg>
