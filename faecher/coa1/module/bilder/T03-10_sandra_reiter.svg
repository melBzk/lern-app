<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, sans-serif">
  <title>Vereinfacht nachgebautes Programmfenster SiSoftware Sandra. Reiterleiste: Werkzeuge, Benchmarks, Hardware-Informationen, Software-Informationen. Unter Hardware-Informationen drei Kacheln: Mainboard, Prozessor, BIOS. Unter Benchmarks zwei Kacheln: Prozessor, Grafikkarte. Dazu zwei Etiketten: Lite-Version kostenlos, und: muss installiert werden.</title>
  <rect width="400" height="520" fill="#fff"/>

  <!-- Fenster -->
  <rect x="6" y="8" width="388" height="412" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <path d="M6,16 Q6,8 14,8 L386,8 Q394,8 394,16 L394,38 L6,38 Z" fill="#555"/>
  <text x="18" y="29" font-size="14" font-weight="700" fill="#fff">SiSoftware Sandra</text>
  <text x="382" y="29" text-anchor="end" font-size="13" fill="#ddd">vereinfacht</text>

  <!-- Reiter in zwei Reihen -->
  <g font-size="13" text-anchor="middle">
    <rect x="14" y="48" width="182" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="105" y="68" fill="#222">Werkzeuge</text>
    <rect x="204" y="48" width="182" height="30" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><text x="295" y="68" font-weight="700" fill="#3a6ed8">Benchmarks</text>
    <rect x="14" y="84" width="182" height="30" rx="5" fill="#fff" stroke="#d63c3c" stroke-width="2"/><text x="105" y="104" font-weight="700" fill="#d63c3c">Hardware-Informationen</text>
    <rect x="204" y="84" width="182" height="30" rx="5" fill="#fff" stroke="#bbb"/><text x="295" y="104" fill="#222">Software-Informationen</text>
  </g>

  <!-- Hardware-Informationen -->
  <text x="18" y="146" font-size="15" font-weight="700" fill="#d63c3c">Hardware-Informationen</text>
  <g font-size="14" font-weight="700" fill="#222" text-anchor="middle">
    <rect x="14" y="156" width="118" height="80" rx="8" fill="#fdeaea" stroke="#d63c3c" stroke-width="2"/>
    <rect x="50" y="170" width="46" height="34" rx="3" fill="none" stroke="#d63c3c" stroke-width="2.5"/>
    <text x="73" y="225">Mainboard</text>
    <rect x="141" y="156" width="118" height="80" rx="8" fill="#fdeaea" stroke="#d63c3c" stroke-width="2"/>
    <rect x="184" y="170" width="32" height="32" rx="3" fill="none" stroke="#d63c3c" stroke-width="2.5"/>
    <text x="200" y="225">Prozessor</text>
    <rect x="268" y="156" width="118" height="80" rx="8" fill="#fdeaea" stroke="#d63c3c" stroke-width="2"/>
    <rect x="304" y="172" width="46" height="28" rx="3" fill="none" stroke="#d63c3c" stroke-width="2.5"/>
    <text x="327" y="225">BIOS</text>
  </g>

  <!-- Benchmarks -->
  <text x="18" y="272" font-size="15" font-weight="700" fill="#3a6ed8">Benchmarks</text>
  <g font-size="14" font-weight="700" fill="#222" text-anchor="middle">
    <rect x="14" y="282" width="182" height="120" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
    <rect x="84" y="298" width="42" height="42" rx="3" fill="none" stroke="#3a6ed8" stroke-width="2.5"/>
    <g stroke="#3a6ed8" stroke-width="2.5"><line x1="92" y1="292" x2="92" y2="298"/><line x1="105" y1="292" x2="105" y2="298"/><line x1="118" y1="292" x2="118" y2="298"/><line x1="92" y1="340" x2="92" y2="346"/><line x1="105" y1="340" x2="105" y2="346"/><line x1="118" y1="340" x2="118" y2="346"/></g>
    <text x="105" y="378">Prozessor</text>
    <rect x="204" y="282" width="182" height="120" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
    <rect x="252" y="304" width="86" height="34" rx="3" fill="none" stroke="#3a6ed8" stroke-width="2.5"/>
    <circle cx="278" cy="321" r="10" fill="none" stroke="#3a6ed8" stroke-width="2.5"/>
    <circle cx="312" cy="321" r="10" fill="none" stroke="#3a6ed8" stroke-width="2.5"/>
    <text x="295" y="378">Grafikkarte</text>
  </g>

  <!-- Etiketten -->
  <rect x="14" y="436" width="182" height="64" rx="32" fill="#1f9d55"/>
  <text x="105" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Lite-Version</text>
  <text x="105" y="483" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">kostenlos</text>
  <rect x="204" y="436" width="182" height="64" rx="32" fill="#e08a1e"/>
  <text x="295" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">muss installiert</text>
  <text x="295" y="483" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">werden</text>
</svg>
