<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif" role="img">
  <title>Ozon vom Laserdrucker. 1 Im Drucker wird die Trommel elektrisch aufgeladen, dabei entsteht Ozon, O3. 2 Das Ozon zieht durch einen Aktivkohlefilter, heraus kommt Sauerstoff, O2. Hinweisschild: Grenzwert 0,1 ppm, Filter regelmäßig wechseln, Abstand halten, lüften.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="450" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Ozon vom Laserdrucker</text>

  <!-- Ozon-Wolke -->
  <g fill="#ced4da">
    <circle cx="70" cy="118" r="20"/><circle cx="95" cy="104" r="24"/><circle cx="120" cy="118" r="20"/>
    <rect x="56" y="112" width="78" height="26" rx="13"/>
  </g>
  <text x="95" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#e8590c">O₃ Ozon</text>
  <path d="M85,166 q-6,-6 0,-12 q6,-6 0,-12 M105,166 q-6,-6 0,-12 q6,-6 0,-12" fill="none" stroke="#868e96" stroke-width="2"/>

  <!-- Drucker im Querschnitt -->
  <rect x="20" y="170" width="190" height="110" rx="8" fill="#e9ecef" stroke="#555" stroke-width="2"/>
  <line x1="34" y1="262" x2="196" y2="262" stroke="#adb5bd" stroke-width="3"/>
  <circle cx="115" cy="225" r="30" fill="#495057"/>
  <path d="M120,202 L106,228 L116,228 L110,248 L127,220 L117,220 Z" fill="#ffd43b"/>
  <circle cx="34" cy="186" r="11" fill="#e8590c"/>
  <text x="34" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="20" y="304" font-size="14" font-weight="700" fill="#222">Trommel wird elektrisch</text>
  <text x="20" y="322" font-size="14" font-weight="700" fill="#222">aufgeladen → Ozon entsteht</text>

  <!-- Filter -->
  <line x1="142" y1="118" x2="176" y2="118" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="159" cy="98" r="11" fill="#e8590c"/>
  <text x="159" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <rect x="180" y="90" width="96" height="56" rx="6" fill="#343a40"/>
  <text x="228" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Aktivkohle-</text>
  <text x="228" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">filter</text>
  <line x1="278" y1="118" x2="310" y2="118" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="350" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#1f9d55">O₂</text>
  <text x="350" y="140" text-anchor="middle" font-size="13" fill="#1c6b3c">Sauerstoff</text>

  <!-- Hinweisschild -->
  <rect x="20" y="346" width="360" height="92" rx="10" fill="#fff9db" stroke="#f59f00" stroke-width="2.5"/>
  <polygon points="52,368 74,406 30,406" fill="#f59f00"/>
  <text x="52" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">!</text>
  <text x="90" y="374" font-size="17" font-weight="700" fill="#222">Grenzwert <tspan fill="#e8590c">0,1 ppm</tspan></text>
  <text x="90" y="398" font-size="14" fill="#222">Filter regelmäßig wechseln</text>
  <text x="90" y="420" font-size="14" fill="#222">Abstand halten · lüften</text>
</svg>
