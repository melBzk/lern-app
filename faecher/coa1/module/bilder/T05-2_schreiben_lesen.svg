<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Links ein PC, rechts ein USB-Stick. Oben ein dicker Pfeil vom Stick zum PC: Lesen ist schnell. Unten ein dünner Pfeil mit Schnecke vom PC zum Stick: Schreiben ist langsamer. Darunter der Grund: Ein Speicherblock besteht aus mehreren Seiten, den Pages. Zum Schreiben wird erst der ganze Block gelöscht, dann wird er neu beschrieben.</title>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="28" font-size="17" font-weight="700" text-anchor="middle">Schreiben dauert länger als Lesen</text>

<!-- PC -->
<rect x="16" y="90" width="92" height="70" rx="6" fill="#eee" stroke="#555" stroke-width="2"/>
<rect x="24" y="98" width="76" height="52" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="62" y="130" text-anchor="middle" font-weight="700">PC</text>
<rect x="50" y="160" width="24" height="10" fill="#555"/>
<rect x="36" y="170" width="52" height="6" rx="2" fill="#555"/>

<!-- USB-Stick waagerecht -->
<rect x="292" y="112" width="24" height="26" fill="#ccc" stroke="#555" stroke-width="2"/>
<rect x="316" y="104" width="70" height="42" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
<text x="351" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">Stick</text>

<!-- Lesen: dick, schnell, Stick -> PC -->
<line x1="286" y1="76" x2="126" y2="76" stroke="#3a6ed8" stroke-width="12" marker-end="url(#b)"/>
<text x="206" y="58" text-anchor="middle" font-weight="700" font-size="16" fill="#3a6ed8">Lesen: schnell</text>

<!-- Schreiben: duenn, PC -> Stick, Schnecke -->
<line x1="126" y1="176" x2="286" y2="176" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#r)"/>
<text x="206" y="210" text-anchor="middle" font-weight="700" font-size="16" fill="#c62828">Schreiben: langsamer</text>
<!-- Schnecke -->
<g transform="translate(184,148)">
<path d="M0,20 L44,20 C50,20 52,14 48,12 L40,12" fill="#e0c9a0" stroke="#7a5a2a" stroke-width="1.5"/>
<circle cx="22" cy="10" r="10" fill="#d9a35b" stroke="#7a5a2a" stroke-width="1.5"/>
<path d="M22,10 m-4,0 a4,4 0 1 1 4,4" fill="none" stroke="#7a5a2a" stroke-width="1.5"/>
<line x1="44" y1="12" x2="46" y2="4" stroke="#7a5a2a" stroke-width="1.5"/>
<line x1="48" y1="13" x2="52" y2="6" stroke="#7a5a2a" stroke-width="1.5"/>
</g>

<line x1="10" y1="234" x2="390" y2="234" stroke="#ddd" stroke-width="1.5"/>
<text x="200" y="262" text-anchor="middle" font-weight="700" font-size="16">Warum? Flash schreibt in Blöcken</text>

<!-- Schritt 1: Block mit Pages -->
<circle cx="24" cy="292" r="11" fill="#222"/><text x="24" y="297" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
<text x="42" y="297" font-weight="700">Speicherblock aus Pages</text>
<rect x="40" y="310" width="140" height="96" fill="#fff" stroke="#3a6ed8" stroke-width="2.5"/>
<g fill="#cfe0fb" stroke="#3a6ed8" stroke-width="1.5">
<rect x="48" y="318" width="124" height="16"/><rect x="48" y="340" width="124" height="16"/><rect x="48" y="362" width="124" height="16"/><rect x="48" y="384" width="124" height="16"/>
</g>
<rect x="48" y="340" width="124" height="16" fill="#F2B100" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="196" y="352" font-size="13">eine Page soll</text>
<text x="196" y="368" font-size="13">geändert werden</text>
<line x1="194" y1="348" x2="176" y2="348" stroke="#222" stroke-width="1.5" marker-end="url(#k)"/>

<!-- Schritt 2: ganzer Block geloescht -->
<line x1="110" y1="412" x2="110" y2="428" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<circle cx="24" cy="446" r="11" fill="#222"/><text x="24" y="451" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
<text x="42" y="451" font-weight="700">erst <tspan fill="#c62828">ganzen Block</tspan> löschen</text>
<rect x="40" y="462" width="140" height="40" fill="#fff" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="110" y="487" text-anchor="middle" font-size="13" fill="#c62828">leer</text>

<!-- Schritt 3: neu beschreiben -->
<line x1="186" y1="482" x2="222" y2="482" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<circle cx="242" cy="446" r="11" fill="#222"/><text x="242" y="451" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">3</text>
<text x="260" y="451" font-weight="700">neu schreiben</text>
<rect x="230" y="462" width="140" height="40" fill="#cfe0fb" stroke="#3a6ed8" stroke-width="2.5"/>
<text x="300" y="487" text-anchor="middle" font-size="13" fill="#3a6ed8">alle Pages neu</text>

<text x="200" y="540" text-anchor="middle" font-size="13" fill="#555">Tempo je nach Modell: Datenblatt lesen</text>
</svg>
