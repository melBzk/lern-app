<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Treppe mit fünf Stufen: Tempo je Lane in MB/s. Jede Stufe ist etwa doppelt so hoch wie die vorige, Pfeile mit mal 2 dazwischen. PCIe 1.x 250, 2.x 500, 3.x 985, 4.x 1969, 5.x 3938 MB/s je Lane.</title>
<rect width="400" height="490" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">Tempo je Lane (MB/s)</text>
<text x="200" y="50" text-anchor="middle" font-size="14" fill="#444">jede Version etwa doppelt so schnell</text>

<!-- Stufen: 0,08 px je MB/s, Grundlinie y=420 -->
<g fill="#3a6ed8">
<rect x="16" y="401" width="60" height="19"/>
<rect x="92" y="382" width="60" height="38"/>
<rect x="168" y="345" width="60" height="75"/>
<rect x="244" y="270" width="60" height="150"/>
<rect x="320" y="120" width="60" height="300"/>
</g>
<line x1="10" y1="420" x2="390" y2="420" stroke="#222" stroke-width="2"/>

<!-- x2-Pfeile -->
<g fill="none" stroke="#E07B00" stroke-width="2.5">
<path d="M52,397 Q52,376 108,376"/>
<path d="M128,378 Q128,339 184,339"/>
<path d="M204,341 Q204,264 260,264"/>
<path d="M280,266 Q280,114 336,114"/>
</g>
<g fill="#E07B00">
<path d="M118,376 l-11,-6 l0,12 z"/><path d="M194,339 l-11,-6 l0,12 z"/><path d="M270,264 l-11,-6 l0,12 z"/><path d="M346,114 l-11,-6 l0,12 z"/>
</g>
<g font-size="15" font-weight="700" fill="#E07B00" text-anchor="middle">
<text x="52" y="368">×2</text><text x="128" y="331">×2</text><text x="204" y="256">×2</text><text x="280" y="106">×2</text>
</g>

<!-- Beschriftung unter den Stufen -->
<g text-anchor="middle" font-size="16" font-weight="700">
<text x="46" y="442">1.x</text><text x="122" y="442">2.x</text><text x="198" y="442">3.x</text><text x="274" y="442">4.x</text><text x="350" y="442">5.x</text>
</g>
<g text-anchor="middle" font-size="15" fill="#3a6ed8" font-weight="700">
<text x="46" y="464">250</text><text x="122" y="464">500</text><text x="198" y="464">985</text><text x="274" y="464">1969</text><text x="350" y="464">3938</text>
</g>
<text x="200" y="484" text-anchor="middle" font-size="13" fill="#444">MB/s je Lane</text>
</svg>
