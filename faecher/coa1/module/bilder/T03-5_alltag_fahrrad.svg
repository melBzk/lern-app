<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fahrrad von der Seite als Vergleich. An der Tretkurbel: 1 Umdrehung entspricht dem Referenztakt. Am kleinen Ritzel hinten: der Gang entspricht dem Multiplikator. Am Hinterrad: 3 Umdrehungen entsprechen dem CPU-Takt. Hinweis: größerer Gang, Rad dreht öfter.</title>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Die Gangschaltung am Fahrrad</text>

<!-- Label Hinterrad -->
<text x="16" y="60" font-size="15" font-weight="700" fill="#c25e00">Hinterrad: 3 Umdrehungen</text>
<text x="16" y="79" font-size="15" font-weight="700" fill="#c25e00">= CPU-Takt</text>

<!-- Räder -->
<circle cx="100" cy="240" r="68" fill="none" stroke="#333" stroke-width="6"/>
<circle cx="310" cy="240" r="68" fill="none" stroke="#333" stroke-width="6"/>
<g stroke="#bbb" stroke-width="1.5"><line x1="100" y1="174" x2="100" y2="306"/><line x1="34" y1="240" x2="166" y2="240"/><line x1="53" y1="193" x2="147" y2="287"/><line x1="53" y1="287" x2="147" y2="193"/><line x1="310" y1="174" x2="310" y2="306"/><line x1="244" y1="240" x2="376" y2="240"/><line x1="263" y1="193" x2="357" y2="287"/><line x1="263" y1="287" x2="357" y2="193"/></g>

<!-- Rahmen -->
<g stroke="#3a6ed8" stroke-width="6" stroke-linecap="round" fill="none"><path d="M100,240 L200,244 L176,148 Z"/><path d="M176,148 L290,148 L200,244"/><path d="M290,148 L310,240"/><path d="M286,130 L290,148"/></g>
<rect x="158" y="134" width="38" height="9" rx="4" fill="#333"/>
<path d="M276,126 L300,124" stroke="#333" stroke-width="6" stroke-linecap="round"/>

<!-- Kette -->
<g stroke="#666" stroke-width="2.5"><line x1="100" y1="229" x2="200" y2="218"/><line x1="100" y1="251" x2="200" y2="270"/></g>
<!-- Ritzel hinten (klein) -->
<circle cx="100" cy="240" r="11" fill="#E07B00" stroke="#8a4a00" stroke-width="2"/>
<!-- Kettenblatt vorne (groß) -->
<circle cx="200" cy="244" r="26" fill="#3a6ed8" stroke="#1f4fae" stroke-width="2"/>
<circle cx="200" cy="244" r="6" fill="#fff"/>
<line x1="200" y1="244" x2="222" y2="276" stroke="#333" stroke-width="6" stroke-linecap="round"/>
<rect x="212" y="274" width="24" height="7" rx="2" fill="#333"/>

<!-- Drehpfeil Hinterrad: 3x -->
<path d="M29,199 A82,82 0 0,1 171,199" fill="none" stroke="#E07B00" stroke-width="4" marker-end="url(#o)"/>
<text x="100" y="146" font-size="20" text-anchor="middle" font-weight="700" fill="#c25e00">3×</text>
<!-- Drehpfeil Kurbel: 1x -->
<path d="M236,262 A40,40 0 0,1 164,262" fill="none" stroke="#3a6ed8" stroke-width="4" marker-end="url(#b)"/>
<text x="200" y="312" font-size="20" text-anchor="middle" font-weight="700" fill="#3a6ed8">1×</text>

<!-- Label Ritzel -->
<line x1="94" y1="252" x2="70" y2="326" stroke="#333" stroke-width="1.5"/>
<text x="16" y="344" font-size="15" font-weight="700">Gang</text>
<text x="16" y="363" font-size="15" font-weight="700">= Multiplikator</text>
<!-- Label Kurbel -->
<text x="384" y="344" font-size="15" text-anchor="end" font-weight="700" fill="#3a6ed8">Tretkurbel: 1 Umdrehung</text>
<text x="384" y="363" font-size="15" text-anchor="end" font-weight="700" fill="#3a6ed8">= Referenztakt</text>

<rect x="10" y="384" width="380" height="44" rx="10" fill="#f4f1ee" stroke="#888" stroke-width="1.5"/>
<text x="200" y="412" font-size="15" text-anchor="middle">größerer Gang  →  Rad dreht öfter</text>
</svg>
