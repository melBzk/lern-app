<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, sans-serif" fill="#222">
<title>Datenrate in zwei Schritten: Internet mit 1000 MBit/s. Schritt 1: Die Angabe steht in Bit. Schritt 2: durch 8 teilen, 1000 geteilt durch 8 = 125 MB/s. Probe: 125 mal 8 = 1000. Merke: Datenraten rechnest du immer mit 1000.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">1000 MBit/s = ? MB/s</text>
<!-- Schritt 1 -->
<circle cx="24" cy="60" r="13" fill="#3a6ed8"/><text x="24" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="46" y="65" font-size="15" font-weight="700">Angabe steht in <tspan fill="#E07B00">Bit</tspan></text>
<rect x="46" y="78" width="200" height="40" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="146" y="104" text-anchor="middle" font-size="17" font-weight="700">1000 M<tspan fill="#E07B00">Bit</tspan>/s</text>
<!-- Schritt 2 -->
<circle cx="24" cy="152" r="13" fill="#3a6ed8"/><text x="24" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="46" y="157" font-size="15" font-weight="700">÷ 8 (8 Bit = 1 Byte)</text>
<line x1="146" y1="122" x2="146" y2="138" stroke="#333" stroke-width="2"/>
<rect x="46" y="170" width="200" height="40" rx="8" fill="#fdf0e0" stroke="#E07B00" stroke-width="2"/>
<text x="146" y="196" text-anchor="middle" font-size="17" font-weight="700">1000 ÷ 8</text>
<line x1="146" y1="212" x2="146" y2="234" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="46" y="238" width="200" height="46" rx="10" fill="#2f6b4f"/>
<text x="146" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">125 MB/s</text>
<text x="262" y="266" font-size="14" fill="#2f6b4f" font-weight="700">Probe:</text>
<text x="262" y="284" font-size="14" fill="#2f6b4f">125 · 8 = 1000 ✔</text>
<!-- Regel -->
<rect x="10" y="304" width="380" height="64" rx="10" fill="#fdf0e0" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="330" text-anchor="middle" font-size="15" font-weight="700">Merke: Datenraten rechnest du</text>
<text x="206" y="354" text-anchor="end" font-size="15" font-weight="700" fill="#E07B00">immer mit 1000</text>
<text x="212" y="354" font-size="15">→ 125 MB/s</text>
</svg>
