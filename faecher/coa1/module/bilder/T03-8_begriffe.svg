<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die fünf neuen Wörter mit Symbol: Befehlsphase, ein Abschnitt eines Befehls, z. B. laden. Taktzyklus, ein einzelner Takt. Funktionseinheit, ein Bauteil, das genau eine Phase erledigt. Pipelining, Phasen laufen versetzt wie am Fließband. Superskalar, Funktionseinheiten mehrfach, dadurch mehrere Befehle pro Takt.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="428" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">5 neue Wörter</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="30" y="68.0" width="36" height="30" rx="4" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/><text x="48.0" y="88.25" font-size="15" text-anchor="middle" font-weight="700">L</text>
<text x="96" y="79.0" font-size="15" font-weight="700" fill="#1d3f8a">Befehlsphase</text>
<text x="96" y="100.0" font-size="14">ein Abschnitt eines Befehls, z. B. laden</text>
<line x1="15" y1="120" x2="385" y2="120" stroke="#ddd" stroke-width="1"/>
<path d="M26,165.0 h8 v-16 h12 v16 h12 v-16 h8" fill="none" stroke="#3a6ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="145.0" width="16" height="24" rx="3" fill="none" stroke="#E07B00" stroke-width="2"/>
<text x="96" y="153.0" font-size="15" font-weight="700" fill="#1d3f8a">Taktzyklus</text>
<text x="96" y="174.0" font-size="14">ein einzelner Takt</text>
<line x1="15" y1="194" x2="385" y2="194" stroke="#ddd" stroke-width="1"/>
<rect x="26" y="215.0" width="44" height="32" rx="5" fill="#f1f3f5" stroke="#333" stroke-width="2"/><rect x="35" y="220.0" width="26" height="22" rx="4" fill="#ece0f5" stroke="#7b3fa0" stroke-width="2"/><text x="48.0" y="235.55" font-size="13" text-anchor="middle" font-weight="700">D</text>
<text x="96" y="227.0" font-size="15" font-weight="700" fill="#1d3f8a">Funktionseinheit</text>
<text x="96" y="248.0" font-size="14">Bauteil, das genau eine Phase erledigt</text>
<line x1="15" y1="268" x2="385" y2="268" stroke="#ddd" stroke-width="1"/>
<rect x="22" y="287.0" width="12" height="11" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="35" y="287.0" width="12" height="11" rx="2" fill="#ece0f5" stroke="#7b3fa0" stroke-width="1.5"/><rect x="48" y="287.0" width="12" height="11" rx="2" fill="#fdebd3" stroke="#E07B00" stroke-width="1.5"/><rect x="35" y="300.0" width="12" height="11" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="48" y="300.0" width="12" height="11" rx="2" fill="#ece0f5" stroke="#7b3fa0" stroke-width="1.5"/><rect x="61" y="300.0" width="12" height="11" rx="2" fill="#fdebd3" stroke="#E07B00" stroke-width="1.5"/><rect x="48" y="313.0" width="12" height="11" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="61" y="313.0" width="12" height="11" rx="2" fill="#ece0f5" stroke="#7b3fa0" stroke-width="1.5"/><rect x="74" y="313.0" width="12" height="11" rx="2" fill="#fdebd3" stroke="#E07B00" stroke-width="1.5"/>
<text x="96" y="301.0" font-size="15" font-weight="700" fill="#1d3f8a">Pipelining</text>
<text x="96" y="322.0" font-size="14">Phasen versetzt, wie am Fließband</text>
<line x1="15" y1="342" x2="385" y2="342" stroke="#ddd" stroke-width="1"/>
<rect x="22" y="365.0" width="12" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="35" y="365.0" width="12" height="12" rx="2" fill="#ece0f5" stroke="#7b3fa0" stroke-width="1.5"/><rect x="48" y="365.0" width="12" height="12" rx="2" fill="#fdebd3" stroke="#E07B00" stroke-width="1.5"/><rect x="61" y="365.0" width="12" height="12" rx="2" fill="#f9dcdc" stroke="#c62828" stroke-width="1.5"/><rect x="22" y="381.0" width="12" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="35" y="381.0" width="12" height="12" rx="2" fill="#ece0f5" stroke="#7b3fa0" stroke-width="1.5"/><rect x="48" y="381.0" width="12" height="12" rx="2" fill="#fdebd3" stroke="#E07B00" stroke-width="1.5"/><rect x="61" y="381.0" width="12" height="12" rx="2" fill="#f9dcdc" stroke="#c62828" stroke-width="1.5"/>
<text x="96" y="375.0" font-size="15" font-weight="700" fill="#E07B00">superskalar</text>
<text x="96" y="396.0" font-size="14">Einheiten mehrfach → mehrere Befehle/Takt</text>
<line x1="15" y1="416" x2="385" y2="416" stroke="#ddd" stroke-width="1"/>
</svg>
