<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, sans-serif">
  <title>Balken Physischer Speicher im Ressourcenmonitor, von links nach rechts: ganz schmal grau Für Hardware reserviert 296 MB, grün In Verwendung 12723 MB (belegt von laufenden Programmen, Treibern und Windows), schmal orange Geändert 313 MB, dunkelblau Standby 15209 MB (zwischengespeichert, gerade nicht gebraucht), hellblau Frei 4227 MB (ungenutzt). Eine Klammer über Standby und Frei: verfügbar 19436 MB.</title>
  <rect width="400" height="380" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Physischer Speicher</text>

  <!-- Klammer verfügbar -->
  <text x="277" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#2f5fb3">verfügbar 19436 MB</text>
  <path d="M169,90 L169,78 L385,78 L385,90" fill="none" stroke="#2f5fb3" stroke-width="2.5"/>
  <line x1="277" y1="72" x2="277" y2="78" stroke="#2f5fb3" stroke-width="2.5"/>

  <!-- Balken (Breiten ungefähr maßstäblich, kleine Teile vergrößert) -->
  <rect x="15" y="96" width="6" height="44" fill="#9a9a9a"/>
  <rect x="21" y="96" width="142" height="44" fill="#3fa34d"/>
  <rect x="163" y="96" width="6" height="44" fill="#e08a1e"/>
  <rect x="169" y="96" width="170" height="44" fill="#2f5fb3"/>
  <rect x="339" y="96" width="46" height="44" fill="#a9c8f0"/>
  <rect x="15" y="96" width="370" height="44" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- Beschriftungen unter den großen Teilen -->
  <g text-anchor="middle" fill="#222">
    <text x="92" y="164" font-size="15" font-weight="700" fill="#2a7a36">In Verwendung</text>
    <text x="92" y="183" font-size="14" font-weight="700">12723 MB</text>
    <text x="92" y="204" font-size="13">laufende Programme,</text>
    <text x="92" y="221" font-size="13">Treiber, Windows</text>

    <text x="254" y="164" font-size="15" font-weight="700" fill="#2f5fb3">Standby</text>
    <text x="254" y="183" font-size="14" font-weight="700">15209 MB</text>
    <text x="254" y="204" font-size="13">zwischengespeichert,</text>
    <text x="254" y="221" font-size="13">gerade nicht gebraucht</text>

    <text x="362" y="164" font-size="15" font-weight="700" fill="#4a7fc8">Frei</text>
    <text x="362" y="183" font-size="14" font-weight="700">4227 MB</text>
    <text x="362" y="204" font-size="13">ungenutzt</text>
  </g>

  <!-- schmale Teile mit Hinweislinien -->
  <line x1="18" y1="140" x2="18" y2="312" stroke="#777" stroke-width="2"/>
  <rect x="12" y="298" width="12" height="12" fill="#9a9a9a"/>
  <text x="30" y="309" font-size="14" fill="#222">Für Hardware reserviert <tspan font-weight="700">296 MB</tspan></text>
  <line x1="166" y1="140" x2="166" y2="276" stroke="#e08a1e" stroke-width="2"/>
  <rect x="160" y="262" width="12" height="12" fill="#e08a1e"/>
  <text x="178" y="273" font-size="14" fill="#222">Geändert <tspan font-weight="700">313 MB</tspan></text>

  <rect x="12" y="330" width="376" height="40" rx="10" fill="#f3f4f6" stroke="#ddd"/>
  <text x="200" y="355" text-anchor="middle" font-size="14" fill="#222">verfügbar = Standby + Frei = 15209 + 4227</text>
</svg>
