<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" font-family="system-ui, sans-serif" role="img">
  <title>Oben laufen einzelne Bits mit 1000 MBit/s. Eine Packmaschine teilt durch 8: je 8 Bit kommen in eine Schachtel, und eine Schachtel ist 1 Byte. Unten kommen 125 MB/s heraus, denn 1000 ÷ 8 = 125.</title>
