<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Schematisches ATX-Mainboard von oben: Links oben das Anschlussfeld, daneben der 8-polige CPU-Stromanschluss. In der Mitte oben der CPU-Sockel mit dem Anschluss CPU_FAN für den Prozessorlüfter. Rechts davon vier RAM-Steckplätze, abwechselnd blau und grau, ganz rechts der 24-polige ATX-Stromanschluss. Links unten zwei lange PCIe-x16-Steckplätze für die Grafikkarte und ein kurzer PCIe-x1-Steckplatz, daneben der flache M.2-Steckplatz. Rechts unten die SATA-Buchsen. Unten der BIOS-Chip und die Knopfzelle, am Rand die Anschlüsse CHA_FAN für Gehäuselüfter.</title>
<rect width="400" height="524" fill="#fff"/>
<text x="200" y="24" text-anchor="middle" font-size="17" font-weight="700">Mainboard: Was steckt wo?</text>
<rect x="10" y="38" width="380" height="476" rx="8" fill="#1b4332"/>

<!-- Anschlussfeld -->
<rect x="10" y="56" width="28" height="166" fill="#b0bec5" stroke="#eceff1"/>
<text transform="translate(29,139) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2a30">Anschlussfeld (T02-1)</text>

<!-- 8-polig CPU-Strom -->
<rect x="56" y="52" width="46" height="26" rx="2" fill="#111" stroke="#9e9e9e"/>
<g fill="#eceff1"><rect x="60" y="56" width="7" height="7"/><rect x="70" y="56" width="7" height="7"/><rect x="81" y="56" width="7" height="7"/><rect x="91" y="56" width="7" height="7"/><rect x="60" y="67" width="7" height="7"/><rect x="70" y="67" width="7" height="7"/><rect x="81" y="67" width="7" height="7"/><rect x="91" y="67" width="7" height="7"/></g>
<text x="80" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">8-polig</text>
<text x="80" y="112" text-anchor="middle" font-size="13" fill="#fff">CPU-Strom</text>

<!-- CPU-Sockel -->
<rect x="128" y="62" width="112" height="112" rx="4" fill="#b0bec5" stroke="#eceff1" stroke-width="2"/>
<rect x="144" y="78" width="80" height="80" fill="#cfd8dc" stroke="#78909c"/>
<text x="184" y="114" text-anchor="middle" font-size="14" font-weight="700">CPU-</text>
<text x="184" y="131" text-anchor="middle" font-size="14" font-weight="700">Sockel</text>
<!-- CPU_FAN -->
<circle cx="150" cy="200" r="11" fill="#90a4ae"/>
<g fill="#1b4332"><path d="M150,200 Q144,190 152,189 Z"/><path d="M150,200 Q160,194 161,202 Z"/><path d="M150,200 Q156,210 148,211 Z"/><path d="M150,200 Q140,206 139,198 Z"/></g>
<rect x="166" y="196" width="22" height="8" fill="#eceff1"/>
<text x="196" y="205" font-size="13" font-weight="700" fill="#fff">CPU_FAN</text>

<!-- RAM -->
<g><rect x="278" y="56" width="10" height="140" fill="#3a6ed8"/><rect x="296" y="56" width="10" height="140" fill="#9e9e9e"/><rect x="314" y="56" width="10" height="140" fill="#3a6ed8"/><rect x="332" y="56" width="10" height="140" fill="#9e9e9e"/></g>
<text x="310" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RAM-</text>
<text x="310" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Steckplätze</text>

<!-- 24-polig -->
<rect x="358" y="70" width="26" height="124" rx="2" fill="#111" stroke="#9e9e9e"/>
<g fill="#eceff1">
<rect x="362" y="74" width="7" height="7"/><rect x="373" y="74" width="7" height="7"/><rect x="362" y="84" width="7" height="7"/><rect x="373" y="84" width="7" height="7"/><rect x="362" y="94" width="7" height="7"/><rect x="373" y="94" width="7" height="7"/><rect x="362" y="104" width="7" height="7"/><rect x="373" y="104" width="7" height="7"/><rect x="362" y="114" width="7" height="7"/><rect x="373" y="114" width="7" height="7"/><rect x="362" y="124" width="7" height="7"/><rect x="373" y="124" width="7" height="7"/><rect x="362" y="134" width="7" height="7"/><rect x="373" y="134" width="7" height="7"/><rect x="362" y="144" width="7" height="7"/><rect x="373" y="144" width="7" height="7"/><rect x="362" y="154" width="7" height="7"/><rect x="373" y="154" width="7" height="7"/><rect x="362" y="164" width="7" height="7"/><rect x="373" y="164" width="7" height="7"/><rect x="362" y="174" width="7" height="7"/><rect x="373" y="174" width="7" height="7"/><rect x="362" y="184" width="7" height="7"/><rect x="373" y="184" width="7" height="7"/>
</g>
<text x="384" y="214" text-anchor="end" font-size="13" font-weight="700" fill="#fff">24-polig</text>
<text x="384" y="230" text-anchor="end" font-size="13" fill="#fff">ATX-Strom</text>

<!-- PCIe -->
<text x="50" y="292" font-size="13" font-weight="700" fill="#fff">PCIe x16 (Grafikkarte)</text>
<rect x="50" y="300" width="200" height="12" rx="2" fill="#111" stroke="#9e9e9e"/>
<rect x="50" y="340" width="56" height="12" rx="2" fill="#111" stroke="#9e9e9e"/>
<text x="114" y="351" font-size="13" font-weight="700" fill="#fff">PCIe x1</text>
<text x="50" y="384" font-size="13" font-weight="700" fill="#fff">PCIe x16</text>
<rect x="50" y="392" width="200" height="12" rx="2" fill="#111" stroke="#9e9e9e"/>
<!-- M.2 -->
<rect x="178" y="334" width="82" height="22" rx="2" fill="#37474f" stroke="#90a4ae"/>
<circle cx="252" cy="345" r="4" fill="#cfd8dc"/>
<text x="212" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">M.2</text>

<!-- SATA -->
<g fill="#111" stroke="#9e9e9e"><rect x="356" y="300" width="28" height="18" rx="2"/><rect x="356" y="326" width="28" height="18" rx="2"/><rect x="356" y="352" width="28" height="18" rx="2"/><rect x="356" y="378" width="28" height="18" rx="2"/></g>
<text x="346" y="353" text-anchor="end" font-size="13" font-weight="700" fill="#fff">SATA</text>

<!-- BIOS-Chip und Knopfzelle -->
<rect x="150" y="424" width="30" height="30" rx="2" fill="#111" stroke="#9e9e9e"/>
<text x="165" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BIOS-Chip</text>
<circle cx="250" cy="438" r="20" fill="#cfd8dc" stroke="#fff" stroke-width="2"/>
<circle cx="250" cy="438" r="14" fill="none" stroke="#90a4ae"/>
<text x="250" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Knopfzelle</text>

<!-- CHA_FAN -->
<rect x="22" y="430" width="22" height="8" fill="#eceff1"/>
<rect x="66" y="430" width="22" height="8" fill="#eceff1"/>
<text x="20" y="460" font-size="13" font-weight="700" fill="#fff">CHA_FAN</text>
<text x="20" y="476" font-size="13" fill="#fff">(Gehäuselüfter)</text>

<text x="200" y="502" text-anchor="middle" font-size="13" fill="#cfd8dc">stark vereinfacht – jedes Board sieht anders aus</text>
</svg>
