<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Ausgangslage im Praxisfall: Links ein alter Beamer mit nur einer blauen Buchse mit 15 Löchern. Rechts der neue PC, hinten nur HDMI und DisplayPort. Dazwischen ein Fragezeichen: Wie bekommst du das Bild auf den Beamer?</title>
<rect width="400" height="350" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Alter Beamer, neuer PC</text>
<!-- Beamer -->
<rect x="14" y="60" width="160" height="80" rx="12" fill="#e9ecef" stroke="#555" stroke-width="2.5"/>
<circle cx="52" cy="100" r="24" fill="#495057"/><circle cx="52" cy="100" r="14" fill="#9cc3f5"/>
<path d="M100,84 H160 L154,116 H106 Z" fill="#3a6ed8" stroke="#2550a8" stroke-width="2"/>
<g fill="#fff"><circle cx="112" cy="92" r="2.4"/><circle cx="121" cy="92" r="2.4"/><circle cx="130" cy="92" r="2.4"/><circle cx="139" cy="92" r="2.4"/><circle cx="148" cy="92" r="2.4"/><circle cx="114" cy="100" r="2.4"/><circle cx="123" cy="100" r="2.4"/><circle cx="132" cy="100" r="2.4"/><circle cx="141" cy="100" r="2.4"/><circle cx="150" cy="100" r="2.4"/><circle cx="116" cy="108" r="2.4"/><circle cx="125" cy="108" r="2.4"/><circle cx="134" cy="108" r="2.4"/><circle cx="143" cy="108" r="2.4"/><circle cx="152" cy="108" r="2.4"/></g>
<text x="94" y="166" text-anchor="middle" font-size="15" font-weight="700">alter Beamer</text>
<text x="94" y="186" text-anchor="middle" font-size="13">nur: blaue Buchse,</text>
<text x="94" y="204" text-anchor="middle" font-size="13">15 Löcher</text>
<!-- PC -->
<rect x="236" y="48" width="150" height="110" rx="6" fill="#dee2e6" stroke="#555" stroke-width="2.5"/>
<path d="M254,86 H304 V98 L296,106 H262 L254,98 Z" fill="#333"/><rect x="262" y="91" width="34" height="5" fill="#888"/>
<path d="M318,86 H368 V106 H328 L318,96 Z" fill="#333"/><rect x="328" y="92" width="32" height="5" fill="#888"/>
<text x="279" y="128" text-anchor="middle" font-size="13" font-weight="700">HDMI</text>
<text x="343" y="128" text-anchor="middle" font-size="13" font-weight="700">DP</text>
<text x="311" y="186" text-anchor="middle" font-size="15" font-weight="700">neuer PC</text>
<text x="311" y="204" text-anchor="middle" font-size="13">nur HDMI + DisplayPort</text>
<!-- Frage -->
<text x="205" y="112" text-anchor="middle" font-size="36" font-weight="700" fill="#D4607A">?</text>
<rect x="40" y="244" width="320" height="64" rx="14" fill="#fff3c4" stroke="#c99a06" stroke-width="1.5"/>
<text x="200" y="272" text-anchor="middle" font-size="15" font-weight="700">Wie heißt die blaue Buchse?</text>
<text x="200" y="294" text-anchor="middle" font-size="15" font-weight="700">Wie kommt das Bild hin?</text>
</svg>
