<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>OCR, Texterkennung, in drei Schritten von oben nach unten. 1: Ein Papierbrief liegt auf dem Scanner. 2: Heraus kommt eine Bilddatei. Die Buchstaben bestehen nur aus vielen kleinen Bildpunkten, es ist nur ein Bild. 3: Die OCR-Software, dargestellt mit einer Lupe, erkennt die Buchstaben. Heraus kommt bearbeitbarer Text in einem Textprogramm mit Cursor.</title>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
</defs>
<rect width="400" height="520" fill="#fff"/>

<!-- 1 Scanner mit Brief -->
<circle cx="22" cy="70" r="14" fill="#3a6ed8"/><text x="22" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<rect x="44" y="16" width="176" height="112" rx="10" fill="#3a3f4a"/>
<rect x="56" y="28" width="152" height="88" rx="3" fill="#c8e0f5"/>
<rect x="88" y="32" width="88" height="80" fill="#fff" stroke="#999"/>
<g stroke="#555" stroke-width="2"><line x1="96" y1="46" x2="140" y2="46"/><line x1="96" y1="58" x2="168" y2="58"/><line x1="96" y1="68" x2="164" y2="68"/><line x1="96" y1="78" x2="168" y2="78"/><line x1="96" y1="88" x2="150" y2="88"/></g>
<text x="240" y="64" font-size="17" font-weight="700">Brief scannen</text>
<text x="240" y="86" font-size="14">Scanner</text>
<line x1="132" y1="132" x2="132" y2="178" stroke="#333" stroke-width="3.5" marker-end="url(#ad)"/>

<!-- 2 Bild aus Pixeln -->
<circle cx="22" cy="240" r="14" fill="#3a6ed8"/><text x="22" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<rect x="44" y="184" width="176" height="112" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="44" y="184" width="176" height="18" rx="4" fill="#9aa3ad"/>
<text x="54" y="198" font-size="12" fill="#fff" font-weight="700">brief.jpg</text>
