<circle cx="22" cy="420" r="14" fill="#3a6ed8"/><text x="22" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<rect x="44" y="364" width="176" height="112" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
