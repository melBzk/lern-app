<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Wo sitzt der Hypervisor? Zwei Schichtstapel, von unten nach oben. Links Typ 1: Hardware, darauf direkt der Hypervisor Typ 1, darauf drei VMs (VM 1, VM 2, VM 3). Beispiele: Hyper-V, VMware ESXi. Rechts Typ 2: Hardware, darauf das Betriebssystem, zum Beispiel Windows; darauf links normale Programme und rechts der Hypervisor Typ 2 mit zwei VMs (VM 1, VM 2). Beispiele: VirtualBox, VMware Workstation.</title>
<rect width="400" height="390" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">Wo sitzt der Hypervisor?</text>
<line x1="200" y1="48" x2="200" y2="372" stroke="#ccc" stroke-width="1.5"/>

<!-- Typ 1 -->
<text x="100" y="72" font-size="17" text-anchor="middle" font-weight="700">Typ 1</text>
<rect x="10" y="90" width="56" height="142" rx="6" fill="#E07B00"/>
<rect x="72" y="90" width="56" height="142" rx="6" fill="#E07B00"/>
<rect x="134" y="90" width="56" height="142" rx="6" fill="#E07B00"/>
<text x="38" y="166" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">VM 1</text>
<text x="100" y="166" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">VM 2</text>
<text x="162" y="166" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">VM 3</text>
<rect x="10" y="240" width="180" height="52" rx="6" fill="#ffe082" stroke="#c9a000" stroke-width="2"/>
<text x="100" y="262" font-size="15" text-anchor="middle" font-weight="700">Hypervisor</text>
<text x="100" y="282" font-size="15" text-anchor="middle" font-weight="700">Typ 1</text>
<rect x="10" y="300" width="180" height="40" rx="6" fill="#2f9e44"/>
<text x="100" y="325" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Hardware</text>
<text x="100" y="364" font-size="13" text-anchor="middle" fill="#555">z. B. Hyper-V, VMware ESXi</text>

<!-- Typ 2 -->
<text x="300" y="72" font-size="17" text-anchor="middle" font-weight="700">Typ 2</text>
<rect x="210" y="90" width="76" height="142" rx="6" fill="#3a6ed8"/>
<text x="248" y="156" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">normale</text>
<text x="248" y="174" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">Programme</text>
<rect x="292" y="90" width="46" height="88" rx="6" fill="#E07B00"/>
<rect x="344" y="90" width="46" height="88" rx="6" fill="#E07B00"/>
<text x="315" y="139" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">VM 1</text>
<text x="367" y="139" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">VM 2</text>
<rect x="292" y="184" width="98" height="48" rx="6" fill="#ffe082" stroke="#c9a000" stroke-width="2"/>
<text x="341" y="204" font-size="14" text-anchor="middle" font-weight="700">Hypervisor</text>
<text x="341" y="223" font-size="14" text-anchor="middle" font-weight="700">Typ 2</text>
<rect x="210" y="240" width="180" height="52" rx="6" fill="#b7e4c3" stroke="#2f9e44" stroke-width="2"/>
<text x="300" y="262" font-size="15" text-anchor="middle" font-weight="700" fill="#1f6b30">Betriebssystem</text>
<text x="300" y="282" font-size="13" text-anchor="middle" fill="#1f6b30">(z. B. Windows)</text>
<rect x="210" y="300" width="180" height="40" rx="6" fill="#2f9e44"/>
<text x="300" y="325" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">Hardware</text>
<text x="300" y="364" font-size="13" text-anchor="middle" fill="#555">z. B. VirtualBox,</text>
<text x="300" y="381" font-size="13" text-anchor="middle" fill="#555">VMware Workstation</text>
</svg>
