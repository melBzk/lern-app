<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Welche Laufwerke Windows im Unterricht für die Auslagerungsdatei anbot: C: eingebaute Festplatte, Standard, Haken. E: eingebaute Festplatte, Haken. H: externe Festplatte, Haken. Y: Netzlaufwerk Google Drive, möglich aber nicht empfohlen, Warnzeichen. D: USB-Stick fehlt, standardmäßig nicht möglich, Kreuz. Für die Klausur: auf eine Festplatte (HDD oder SSD), nicht auf einen USB-Stick.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="432" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Wohin mit der Auslagerungsdatei?</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="24" y="59.0" width="48" height="36" rx="5" fill="#f1f3f5" stroke="#555" stroke-width="2"/><text x="48" y="83.0" font-size="17" text-anchor="middle" font-weight="700" fill="#1d3f8a">C:</text>
<text x="92" y="73.0" font-size="15" font-weight="700" fill="#2f6b4f">C: eingebaute Festplatte</text>
<text x="92" y="94.0" font-size="14">Standard</text>
<line x1="15" y1="108" x2="385" y2="108" stroke="#ddd" stroke-width="1"/>
<rect x="24" y="121.0" width="48" height="36" rx="5" fill="#f1f3f5" stroke="#555" stroke-width="2"/><text x="48" y="145.0" font-size="17" text-anchor="middle" font-weight="700" fill="#1d3f8a">E:</text>
<text x="92" y="135.0" font-size="15" font-weight="700" fill="#2f6b4f">E: eingebaute Festplatte</text>
<text x="92" y="156.0" font-size="14">wurde angeboten</text>
<line x1="15" y1="170" x2="385" y2="170" stroke="#ddd" stroke-width="1"/>
<rect x="24" y="183.0" width="48" height="36" rx="5" fill="#f1f3f5" stroke="#555" stroke-width="2"/><text x="48" y="207.0" font-size="17" text-anchor="middle" font-weight="700" fill="#1d3f8a">H:</text>
<text x="92" y="197.0" font-size="15" font-weight="700" fill="#2f6b4f">H: externe Festplatte</text>
<text x="92" y="218.0" font-size="14">wurde angeboten</text>
<line x1="15" y1="232" x2="385" y2="232" stroke="#ddd" stroke-width="1"/>
<rect x="24" y="245.0" width="48" height="36" rx="5" fill="#f1f3f5" stroke="#555" stroke-width="2"/><text x="48" y="269.0" font-size="17" text-anchor="middle" font-weight="700" fill="#1d3f8a">Y:</text>
<text x="92" y="259.0" font-size="15" font-weight="700" fill="#a85a00">Y: Netzlaufwerk (Google Drive)</text>
<text x="92" y="280.0" font-size="14">möglich, aber nicht empfohlen</text>
<line x1="15" y1="294" x2="385" y2="294" stroke="#ddd" stroke-width="1"/>
<rect x="24" y="307.0" width="48" height="36" rx="5" fill="#f1f3f5" stroke="#555" stroke-width="2"/><text x="48" y="331.0" font-size="17" text-anchor="middle" font-weight="700" fill="#c62828">D:</text>
<text x="92" y="321.0" font-size="15" font-weight="700" fill="#c62828">D: USB-Stick</text>
<text x="92" y="342.0" font-size="14">fehlt – standardmäßig nicht</text>
<line x1="15" y1="356" x2="385" y2="356" stroke="#ddd" stroke-width="1"/>
<circle cx="366" cy="77" r="11" fill="#2f6b4f" stroke="none" stroke-width="2"/><path d="M361.05,77 l3.52,3.96 l7.04,-7.92" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="366" cy="139" r="11" fill="#2f6b4f" stroke="none" stroke-width="2"/><path d="M361.05,139 l3.52,3.96 l7.04,-7.92" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="366" cy="201" r="11" fill="#2f6b4f" stroke="none" stroke-width="2"/><path d="M361.05,201 l3.52,3.96 l7.04,-7.92" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M366,252 L377,271.8 L355,271.8 Z" fill="#E07B00" stroke="#E07B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="366" y="269.6" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">!</text>
<circle cx="366" cy="325" r="11" fill="#c62828" stroke="none" stroke-width="2"/><path d="M361.6,320.6 L370.4,329.4 M370.4,320.6 L361.6,329.4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="14" y="368" width="372" height="50" rx="8" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="200" y="388" font-size="15" text-anchor="middle" font-weight="700" fill="#1d3f8a">Klausur: auf eine Festplatte</text>
<text x="200" y="408" font-size="13" text-anchor="middle" fill="#333">(HDD oder SSD), nicht auf einen USB-Stick</text>
</svg>
