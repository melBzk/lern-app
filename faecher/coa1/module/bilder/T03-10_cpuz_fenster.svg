<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, sans-serif">
  <title>Vereinfacht nachgebautes Programmfenster CPU-Z mit den Reitern CPU, Mainboard, Memory, SPD, Graphics und Bench; der Reiter CPU ist aktiv. Werte vom Unterrichts-Laptop: Name Intel Core i7-12700H, Technology 10 nm, Max TDP 45 W, Core Speed 3092 MHz, Multiplier x31, Bus Speed 99,76 MHz, Level 3 Cache 24 MB, Cores 6P + 8E, Threads 20. Pfeile zeigen: Bus Speed mal Multiplier ergibt Core Speed, also 99,76 MHz mal 31 ungefähr 3092 MHz, ungefähr 3,1 GHz.</title>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
  </defs>
  <rect width="400" height="520" fill="#fff"/>

  <!-- Fenster -->
  <rect x="6" y="8" width="388" height="422" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <path d="M6,16 Q6,8 14,8 L386,8 Q394,8 394,16 L394,38 L6,38 Z" fill="#555"/>
  <text x="18" y="29" font-size="14" font-weight="700" fill="#fff">CPU-Z</text>
  <text x="382" y="29" text-anchor="end" font-size="13" fill="#ddd">vereinfacht nachgebaut</text>

  <!-- Reiter -->
  <g font-size="13" text-anchor="middle">
    <rect x="12" y="46" width="42" height="28" rx="4" fill="#3a6ed8"/><text x="33" y="65" font-weight="700" fill="#fff">CPU</text>
    <rect x="58" y="46" width="80" height="28" rx="4" fill="#fff" stroke="#bbb"/><text x="98" y="65" fill="#222">Mainboard</text>
    <rect x="142" y="46" width="66" height="28" rx="4" fill="#fff" stroke="#bbb"/><text x="175" y="65" fill="#222">Memory</text>
    <rect x="212" y="46" width="40" height="28" rx="4" fill="#fff" stroke="#bbb"/><text x="232" y="65" fill="#222">SPD</text>
    <rect x="256" y="46" width="70" height="28" rx="4" fill="#fff" stroke="#bbb"/><text x="291" y="65" fill="#222">Graphics</text>
    <rect x="330" y="46" width="56" height="28" rx="4" fill="#fff" stroke="#bbb"/><text x="358" y="65" fill="#222">Bench</text>
  </g>

  <!-- Felder: Beschriftung rechtsbündig bei x=118, Wert ab x=126 -->
  <g font-size="14" fill="#222">
    <text x="118" y="111" text-anchor="end">Name</text>
    <rect x="126" y="92" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="111" font-weight="700">Intel Core i7-12700H</text>

    <text x="118" y="145" text-anchor="end">Technology</text>
    <rect x="126" y="126" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="145" font-weight="700">10 nm</text>

    <text x="118" y="179" text-anchor="end">Max TDP</text>
    <rect x="126" y="160" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="179" font-weight="700">45 W</text>

    <text x="118" y="213" text-anchor="end" font-weight="700" fill="#d63c3c">Core Speed</text>
    <rect x="126" y="194" width="200" height="27" rx="3" fill="#fff" stroke="#d63c3c" stroke-width="2.5"/>
    <text x="134" y="213" font-weight="700" fill="#d63c3c">3092 MHz</text>

    <text x="118" y="247" text-anchor="end">Multiplier</text>
    <rect x="126" y="228" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="247" font-weight="700">x31</text>

    <text x="118" y="281" text-anchor="end">Bus Speed</text>
    <rect x="126" y="262" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="281" font-weight="700">99,76 MHz</text>

    <text x="118" y="315" text-anchor="end">Level 3</text>
    <rect x="126" y="296" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="315" font-weight="700">24 MB</text>

    <text x="118" y="349" text-anchor="end">Cores</text>
    <rect x="126" y="330" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="349" font-weight="700">6P + 8E</text>

    <text x="118" y="383" text-anchor="end">Threads</text>
    <rect x="126" y="364" width="200" height="27" rx="3" fill="#fff" stroke="#999"/>
    <text x="134" y="383" font-weight="700">20</text>
  </g>

  <!-- Rechen-Pfeile: Bus Speed × Multiplier = Core Speed -->
  <g stroke="#d63c3c" stroke-width="3" fill="none">
    <line x1="328" y1="275" x2="362" y2="275"/>
    <line x1="328" y1="241" x2="362" y2="241"/>
    <line x1="362" y1="275" x2="362" y2="207"/>
    <line x1="362" y1="207" x2="332" y2="207" marker-end="url(#r)"/>
  </g>
  <text x="378" y="264" text-anchor="middle" font-size="20" font-weight="700" fill="#d63c3c">×</text>
  <text x="378" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#d63c3c">=</text>

  <!-- Rechnung -->
  <rect x="6" y="444" width="388" height="64" rx="10" fill="#fdeaea" stroke="#d63c3c" stroke-width="2"/>
  <text x="200" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#222">99,76 MHz × 31 ≈ 3092 MHz</text>
  <text x="200" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#d63c3c">≈ 3,1 GHz</text>
</svg>
