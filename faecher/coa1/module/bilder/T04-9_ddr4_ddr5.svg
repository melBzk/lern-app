<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>DDR4 und DDR5 im Vergleich: zwei gleich lange Desktop-Riegel übereinander, beide mit 288 Kontakten. Die Kerben (rot markiert) sitzen an verschiedenen Stellen. DDR4 arbeitet mit 1,2 Volt, DDR5 mit 1,1 Volt. Dazwischen ein rotes X: passt nicht in den anderen Steckplatz. Positionen schematisch.</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="370" fill="#fff"/>

<!-- DDR4 -->
<text x="20" y="28" font-size="18" font-weight="700" fill="#2e7d32">DDR4</text>
<rect x="300" y="12" width="70" height="26" rx="13" fill="#eceff1"/>
<text x="335" y="31" text-anchor="middle" font-size="15" font-weight="700">1,2 V</text>
<path d="M20,46 H370 V116 H172 V104 H160 V116 H20 Z" fill="#2e7d32"/>
<g fill="#1a1a1a"><rect x="36" y="54" width="32" height="30"/><rect x="82" y="54" width="32" height="30"/><rect x="128" y="54" width="32" height="30"/><rect x="174" y="54" width="32" height="30"/><rect x="220" y="54" width="32" height="30"/><rect x="266" y="54" width="32" height="30"/><rect x="312" y="54" width="32" height="30"/></g>
<line x1="26" y1="108" x2="158" y2="108" stroke="#c9a227" stroke-width="14" stroke-dasharray="4 2"/>
<line x1="174" y1="108" x2="364" y2="108" stroke="#c9a227" stroke-width="14" stroke-dasharray="4 2"/>
<line x1="166" y1="140" x2="166" y2="120" stroke="#c62828" stroke-width="3" marker-end="url(#s)"/>
<text x="370" y="138" text-anchor="end">288 Kontakte</text>
<text x="176" y="138" font-size="13" font-weight="700" fill="#c62828">Kerbe</text>

<!-- X dazwischen -->
<path d="M30,164 l22,22 M52,164 l-22,22" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<text x="66" y="173" font-size="15" font-weight="700" fill="#c62828">passt nicht in den</text>
<text x="66" y="192" font-size="15" font-weight="700" fill="#c62828">anderen Steckplatz</text>

<!-- DDR5 -->
<text x="20" y="232" font-size="18" font-weight="700" fill="#555">DDR5</text>
<rect x="300" y="216" width="70" height="26" rx="13" fill="#eceff1"/>
<text x="335" y="235" text-anchor="middle" font-size="15" font-weight="700">1,1 V</text>
<path d="M20,250 H370 V320 H208 V308 H196 V320 H20 Z" fill="#2e7d32"/>
<g fill="#1a1a1a"><rect x="36" y="258" width="32" height="30"/><rect x="82" y="258" width="32" height="30"/><rect x="128" y="258" width="32" height="30"/><rect x="174" y="258" width="32" height="30"/><rect x="220" y="258" width="32" height="30"/><rect x="266" y="258" width="32" height="30"/><rect x="312" y="258" width="32" height="30"/></g>
<line x1="26" y1="312" x2="194" y2="312" stroke="#c9a227" stroke-width="14" stroke-dasharray="4 2"/>
<line x1="210" y1="312" x2="364" y2="312" stroke="#c9a227" stroke-width="14" stroke-dasharray="4 2"/>
<line x1="202" y1="344" x2="202" y2="324" stroke="#c62828" stroke-width="3" marker-end="url(#s)"/>
<text x="370" y="342" text-anchor="end">288 Kontakte</text>
<text x="212" y="342" font-size="13" font-weight="700" fill="#c62828">Kerbe</text>
<line x1="166" y1="204" x2="166" y2="330" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="390" y="364" text-anchor="end" font-size="13" fill="#555">Positionen schematisch</text>
</svg>
