<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die sieben neuen Wörter mit Symbol: Auslagerungsdatei pagefile.sys auf der Festplatte. Virtueller Arbeitsspeicher: Festplattenbereich, benutzt wie RAM. Speicherseite: Stück RAM, das als Ganzes verschoben wird. Auslagern und Einlagern: vom RAM auf die Festplatte und wieder zurück. Bluescreen: blauer Fehlerbildschirm, Windows hält an. Speicherabbild (Dump): Speicherinhalt beim Absturz, hilft bei der Fehlersuche. ReadyBoost: USB-Stick als Zwischenspeicher für langsame Festplatten.</title>
