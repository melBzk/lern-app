<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Eine Waage. Linke Schale: kleine Zuordnungseinheit, viele kleine Kästchen. Plus: wenig Verschnitt. Minus: eher langsamer. Rechte Schale: große Zuordnungseinheit, wenige große Kästen. Plus: eher schneller. Minus: viel Verschnitt bei kleinen Dateien. Beispiele: Filmrolle, Videos und Bilder: groß. Stapel Briefe, viele kleine Office-Dateien: kleiner. Auswahl im Windows-Fenster beim Formatieren: 8192 Byte, also 8 KB, bis 32 768 KB, also 32 MB.</title>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Klein oder groß – du wählst</text>

<!-- Waage -->
<path d="M170,196 L230,196 L214,182 L186,182 Z" fill="#555"/>
<rect x="196" y="70" width="8" height="114" fill="#555"/>
<circle cx="200" cy="68" r="7" fill="#555"/>
<rect x="60" y="64" width="280" height="7" rx="3" fill="#7a7f88"/>
<g stroke="#7a7f88" stroke-width="2"><line x1="100" y1="71" x2="60" y2="140"/><line x1="100" y1="71" x2="140" y2="140"/><line x1="300" y1="71" x2="260" y2="140"/><line x1="300" y1="71" x2="340" y2="140"/></g>
<path d="M50,140 L150,140 Q100,164 50,140 Z" fill="#eceff1" stroke="#555" stroke-width="2"/>
<path d="M250,140 L350,140 Q300,164 250,140 Z" fill="#eceff1" stroke="#555" stroke-width="2"/>
<rect x="70" y="116" width="9" height="9" fill="#3a6ed8"/><rect x="81" y="116" width="9" height="9" fill="#3a6ed8"/><rect x="92" y="116" width="9" height="9" fill="#3a6ed8"/><rect x="103" y="116" width="9" height="9" fill="#3a6ed8"/><rect x="114" y="116" width="9" height="9" fill="#3a6ed8"/><rect x="125" y="116" width="9" height="9" fill="#3a6ed8"/><rect x="70" y="127" width="9" height="9" fill="#3a6ed8"/><rect x="81" y="127" width="9" height="9" fill="#3a6ed8"/><rect x="92" y="127" width="9" height="9" fill="#3a6ed8"/><rect x="103" y="127" width="9" height="9" fill="#3a6ed8"/><rect x="114" y="127" width="9" height="9" fill="#3a6ed8"/><rect x="125" y="127" width="9" height="9" fill="#3a6ed8"/>
<rect x="268" y="102" width="28" height="28" fill="#3a6ed8"/><rect x="302" y="102" width="28" height="28" fill="#3a6ed8"/>

<g text-anchor="middle">
<text x="100" y="186" font-weight="700">kleine</text>
<text x="100" y="204" font-weight="700">Zuordnungseinheit</text>
<text x="300" y="186" font-weight="700">große</text>
<text x="300" y="204" font-weight="700">Zuordnungseinheit</text>
<text x="100" y="236" font-weight="700" fill="#2e7d32">+ wenig Verschnitt</text>
<text x="100" y="258" font-weight="700" fill="#c62828">– eher langsamer</text>
<text x="300" y="236" font-weight="700" fill="#2e7d32">+ eher schneller</text>
<text x="300" y="258" font-weight="700" fill="#c62828">– viel Verschnitt</text>
<text x="300" y="276" font-size="13" fill="#c62828">bei kleinen Dateien</text>
</g>

<!-- Beispiele -->
<line x1="10" y1="296" x2="390" y2="296" stroke="#ddd" stroke-width="1.5"/>
<text x="200" y="318" text-anchor="middle" font-size="13" fill="#555">Beispiele</text>
<!-- Filmrolle -->
<rect x="14" y="330" width="182" height="96" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="52" cy="366" r="20" fill="#555"/>
<g fill="#e8f0fe"><circle cx="52" cy="354" r="5"/><circle cx="52" cy="378" r="5"/><circle cx="40" cy="366" r="5"/><circle cx="64" cy="366" r="5"/></g>
<rect x="52" y="384" width="40" height="12" fill="#555"/>
<text x="100" y="362" font-weight="700">Videos,</text>
<text x="100" y="380" font-weight="700">Bilder</text>
<text x="105" y="414" text-anchor="middle" font-weight="700" fill="#3a6ed8">→ groß</text>
<!-- Briefe -->
<rect x="204" y="330" width="182" height="96" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<g fill="#fff" stroke="#555" stroke-width="1.5">
<rect x="222" y="350" width="34" height="24"/><rect x="226" y="356" width="34" height="24"/><rect x="230" y="362" width="34" height="24"/>
</g>
<path d="M230,362 L247,375 L264,362" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="274" y="356" font-weight="700" font-size="13">viele kleine</text>
<text x="274" y="373" font-weight="700" font-size="13">Office-</text>
<text x="274" y="390" font-weight="700" font-size="13">Dateien</text>
<text x="295" y="414" text-anchor="middle" font-weight="700" fill="#2e7d32">→ kleiner</text>

<!-- Fußzeile -->
<rect x="10" y="440" width="380" height="50" rx="8" fill="#fffde7" stroke="#8a6d00" stroke-width="1.5"/>
<text x="200" y="461" text-anchor="middle" font-size="13">Auswahl im Windows-Fenster beim Formatieren:</text>
<text x="200" y="481" text-anchor="middle" font-weight="700" font-size="13">8192 Byte (= 8 KB) bis 32 768 KB (= 32 MB)</text>
</svg>
