<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif">
  <title>Dreimal ATX: 1. ATX-Formfaktor ist die Größe des Mainboards. 2. ATX-Anschlussfeld sind die Anschlüsse hinten am PC. 3. ATX-Netzteil und ATX-Stecker sind die Stromversorgung. Alle drei gehören zum selben Standard, sind aber verschiedene Dinge.</title>
  <rect width="400" height="450" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Dreimal „ATX“ – drei Dinge</text>

  <!-- Kachel 1: Formfaktor -->
  <rect x="14" y="46" width="372" height="100" rx="10" fill="#f4f1ee"/>
  <rect x="30" y="62" width="88" height="70" fill="#d6e4fb" stroke="#3a6ed8" stroke-width="2.5"/>
  <rect x="58" y="74" width="24" height="24" fill="#fff" stroke="#3a6ed8"/>
  <g fill="#3a6ed8"><rect x="90" y="70" width="4" height="34"/><rect x="98" y="70" width="4" height="34"/></g>
  <g fill="#999"><rect x="36" y="110" width="50" height="4"/><rect x="36" y="120" width="50" height="4"/></g>
  <text x="136" y="82" font-size="22" font-weight="800" fill="#3a6ed8">ATX</text>
  <text x="136" y="106" font-size="16" font-weight="700" fill="#222">Formfaktor</text>
  <text x="136" y="127" font-size="14" fill="#222">= Größe des Boards</text>

  <!-- Kachel 2: Anschlussfeld -->
  <rect x="14" y="156" width="372" height="100" rx="10" fill="#f4f1ee"/>
  <rect x="26" y="190" width="96" height="32" fill="#fff" stroke="#D4607A" stroke-width="2.5"/>
  <circle cx="38" cy="206" r="6" fill="#3fa34d"/>
  <path d="M50,199 H68 L66,213 H52 Z" fill="#3a6ed8"/>
  <rect x="74" y="200" width="14" height="10" fill="#fff" stroke="#555"/>
  <rect x="92" y="198" width="14" height="14" fill="#fff" stroke="#555"/>
  <circle cx="114" cy="200" r="3" fill="#7cbf3f"/><circle cx="114" cy="211" r="3" fill="#e58fb0"/>
  <text x="136" y="192" font-size="22" font-weight="800" fill="#D4607A">ATX</text>
  <text x="136" y="216" font-size="16" font-weight="700" fill="#222">Anschlussfeld</text>
  <text x="136" y="237" font-size="14" fill="#222">= Anschlüsse hinten am PC</text>

  <!-- Kachel 3: Netzteil -->
  <rect x="14" y="266" width="372" height="100" rx="10" fill="#f4f1ee"/>
  <rect x="28" y="286" width="56" height="44" rx="3" fill="#444"/>
  <circle cx="56" cy="308" r="15" fill="#666" stroke="#999"/>
  <path d="M84,316 C98,316 96,336 104,336" fill="none" stroke="#333" stroke-width="4"/>
  <rect x="100" y="326" width="22" height="20" rx="2" fill="#fff" stroke="#333" stroke-width="2"/>
  <g fill="#333"><rect x="104" y="330" width="4" height="4"/><rect x="110" y="330" width="4" height="4"/><rect x="116" y="330" width="2" height="4"/><rect x="104" y="337" width="4" height="4"/><rect x="110" y="337" width="4" height="4"/></g>
  <text x="136" y="302" font-size="22" font-weight="800" fill="#e08a2e">ATX</text>
  <text x="136" y="326" font-size="16" font-weight="700" fill="#222">Netzteil / Stecker</text>
  <text x="136" y="347" font-size="14" fill="#222">= Stromversorgung</text>

  <!-- Verbindungsbalken -->
  <g stroke="#3a6ed8" stroke-width="3">
    <line x1="376" y1="96" x2="392" y2="96"/><line x1="376" y1="206" x2="392" y2="206"/><line x1="376" y1="316" x2="392" y2="316"/>
    <line x1="392" y1="96" x2="392" y2="384"/>
  </g>
  <rect x="14" y="380" width="380" height="54" rx="10" fill="#3a6ed8"/>
  <text x="204" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">gehören zum selben Standard,</text>
  <text x="204" y="423" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">sind aber verschiedene Dinge</text>
</svg>
