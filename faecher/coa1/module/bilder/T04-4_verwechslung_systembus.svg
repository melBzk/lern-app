<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Verwechslung: Links der Systembus aus T02-9 – CPU und RAM, verbunden durch drei Leitungen Daten, Adresse und Steuer, fest auf dem Board. Rechts der Erweiterungsbus – ein Mainboard mit Steckplätzen, in denen Netzwerkkarte und Grafikkarte stecken, man kann Karten nachrüsten. In der Mitte ein großes Ungleich-Zeichen.</title>
<rect width="400" height="370" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Beides heißt „Bus“ – aber …</text>

<!-- Links Systembus -->
<text x="93" y="62" text-anchor="middle" font-size="15" font-weight="700">Systembus</text>
<text x="93" y="80" text-anchor="middle" font-size="13" fill="#555">(T02-9)</text>
<rect x="12" y="104" width="52" height="150" rx="5" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="38" y="184" text-anchor="middle" font-size="15" font-weight="700">CPU</text>
<rect x="122" y="104" width="52" height="150" rx="5" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="148" y="184" text-anchor="middle" font-size="15" font-weight="700">RAM</text>
<g stroke="#3a6ed8" stroke-width="4"><line x1="64" y1="140" x2="122" y2="140"/><line x1="64" y1="186" x2="122" y2="186"/><line x1="64" y1="232" x2="122" y2="232"/></g>
<g font-size="13" font-weight="700" text-anchor="middle"><text x="93" y="132">Daten</text><text x="93" y="178">Adresse</text><text x="93" y="224">Steuer</text></g>
<text x="93" y="290" text-anchor="middle" font-size="13">fest auf dem Board</text>

<!-- Ungleich -->
<circle cx="201" cy="180" r="22" fill="#fff" stroke="#c62828" stroke-width="3"/>
<g stroke="#c62828" stroke-width="5" stroke-linecap="round"><line x1="188" y1="173" x2="212" y2="173"/><line x1="188" y1="187" x2="212" y2="187"/><line x1="206" y1="164" x2="194" y2="196"/></g>

<!-- Rechts Erweiterungsbus -->
<text x="306" y="62" text-anchor="middle" font-size="15" font-weight="700">Erweiterungs-</text>
<text x="306" y="80" text-anchor="middle" font-size="15" font-weight="700">bus</text>
<rect x="228" y="98" width="160" height="166" rx="6" fill="#eef2ee" stroke="#8a9a8a" stroke-width="2"/>
<rect x="240" y="108" width="136" height="30" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="308" y="128" text-anchor="middle" font-size="13" font-weight="700">Netzwerkkarte</text>
<rect x="240" y="138" width="136" height="9" rx="2" fill="#3a6ed8"/>
<rect x="240" y="166" width="136" height="30" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="308" y="186" text-anchor="middle" font-size="13" font-weight="700">Grafikkarte</text>
<rect x="240" y="196" width="136" height="9" rx="2" fill="#3a6ed8"/>
<rect x="240" y="236" width="136" height="9" rx="2" fill="#3a6ed8"/>
<text x="308" y="228" text-anchor="middle" font-size="13" fill="#555">frei</text>
<text x="306" y="290" text-anchor="middle" font-size="13">Karte einstecken</text>
<text x="306" y="308" text-anchor="middle" font-size="13">= nachrüsten</text>

<rect x="14" y="324" width="372" height="34" rx="8" fill="#fdecea"/>
<text x="200" y="346" text-anchor="middle" font-weight="700" fill="#c62828">Systembus ≠ Erweiterungsbus</text>
</svg>
