<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 425" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Nachgezeichneter Balken Physischer Speicher aus dem Ressourcenmonitor, Werte vom Laptop im Unterricht. Oben: schmaler grauer Teil für Hardware reserviert 296 MB, grüner Teil In Verwendung 12 723 MB, schmaler oranger Teil Geändert 313 MB, dunkelblauer Teil Standby 15 209 MB (zwischengespeichert), hellblauer Teil Frei 4 227 MB. Eine Klammer über Standby und Frei: Verfügbar 19 436 MB. Summe 32 768 MB gleich installiert – Häkchen, genug Reserve. Unten der Fall RAM zu knapp: fast nur grün, kaum noch Blau – Windows lagert verstärkt aus.</title>
<defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="425" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Physischer Speicher</text>
<!-- gesund -->
<text x="20" y="62" font-size="15" font-weight="700" fill="#2f6b4f">Genug Reserve</text>
<circle cx="366" cy="56" r="13" fill="#2f6b4f"/>
<path d="M359,56 l5,5 l9,-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<rect x="20" y="76" width="3.3" height="36" fill="#9e9e9e"/>
<rect x="23.3" y="76" width="139.8" height="36" fill="#6aa832"/>
<rect x="163.1" y="76" width="3.4" height="36" fill="#E07B00"/>
<rect x="166.5" y="76" width="167.1" height="36" fill="#2b5fc4"/>
<rect x="333.6" y="76" width="46.4" height="36" fill="#a9c4f0"/>
<rect x="20" y="76" width="360" height="36" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="93" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#3f7a1a">In Verwendung</text>
<text x="93" y="150" font-size="14" text-anchor="middle" font-weight="700">12 723 MB</text>
<text x="250" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#2b5fc4">Standby</text>
<text x="250" y="150" font-size="14" text-anchor="middle" font-weight="700">15 209 MB</text>
<text x="250" y="167" font-size="12" text-anchor="middle" fill="#555">zwischengespeichert</text>
<text x="358" y="132" font-size="14" text-anchor="middle" font-weight="700" fill="#5a7fc0">Frei</text>
<text x="358" y="150" font-size="13" text-anchor="middle" font-weight="700">4 227 MB</text>
<!-- Klammer Verfügbar -->
<path d="M166.5,180 v8 h213.5 v-8" fill="none" stroke="#2b5fc4" stroke-width="2"/>
<text x="380" y="206" font-size="13" text-anchor="end" font-weight="700" fill="#2b5fc4">Verfügbar = Standby + Frei = 19 436 MB</text>
<!-- kleine Teile -->
<rect x="20" y="220" width="12" height="12" fill="#9e9e9e"/>
<text x="38" y="231" font-size="13">für Hardware reserviert: 296 MB</text>
<rect x="20" y="240" width="12" height="12" fill="#E07B00"/>
<text x="38" y="251" font-size="13">Geändert: 313 MB</text>
<text x="380" y="272" font-size="13" text-anchor="end" fill="#555">Summe: 32 768 MB = installiert</text>
<line x1="20" y1="284" x2="380" y2="284" stroke="#ddd" stroke-width="1.5"/>
<!-- kritisch -->
<text x="20" y="310" font-size="15" font-weight="700" fill="#c62828">RAM zu knapp</text>
<path d="M366,290 L381,316 L351,316 Z" fill="#E0B000" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="366" y="313" font-size="15" text-anchor="middle" font-weight="700">!</text>
<rect x="20" y="326" width="3.3" height="36" fill="#9e9e9e"/>
<rect x="23.3" y="326" width="344.7" height="36" fill="#6aa832"/>
<rect x="368" y="326" width="7" height="36" fill="#2b5fc4"/>
<rect x="375" y="326" width="5" height="36" fill="#a9c4f0"/>
<rect x="20" y="326" width="360" height="36" fill="none" stroke="#555" stroke-width="1.5"/>
<line x1="300" y1="384" x2="368" y2="368" stroke="#c62828" stroke-width="2.5" marker-end="url(#r)"/>
<text x="290" y="390" font-size="15" text-anchor="end" font-weight="700" fill="#c62828">kaum noch Blau =</text>
<text x="290" y="410" font-size="15" text-anchor="end" font-weight="700" fill="#c62828">Windows lagert verstärkt aus</text>
</svg>
