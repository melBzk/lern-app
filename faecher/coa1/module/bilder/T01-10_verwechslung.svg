<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 484" font-family="system-ui, sans-serif" role="img">
  <title>Vier Paare, die man nicht vertauschen darf. Bildwiederholrate in Hertz: Bilder pro Sekunde, höher ist besser. Reaktionszeit in Millisekunden: Umschaltdauer eines Pixels, kleiner ist besser. Fehlerklasse 0: keine Fehler, das Beste. Fehlerklasse IV: bis 50 helle Pixel je Million, das Schlechteste. Fehlertyp 1 und 2: ganzes Pixel hell oder dunkel. Typ 3: nur ein Subpixel. Panel IPS: beste Farbtreue. Panel VA: bester Kontrast.</title>
  <rect width="400" height="484" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Nicht vertauschen</text>

  <!-- 1 Hz / ms -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="40" width="174" height="100" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="40" width="174" height="100" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="98">≠</text>
  <text x="80" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Hz</text>
  <path d="M118,80 v-24 m-8,8 l8,-8 l8,8" fill="none" stroke="#1f9d55" stroke-width="3.5"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="108">Bilder pro Sekunde</text><text x="95" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#14653a">höher ist besser</text>
  <text x="290" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#222">ms</text>
  <path d="M326,56 v24 m-8,-8 l8,8 l8,-8" fill="none" stroke="#1f9d55" stroke-width="3.5"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="108">Umschaltdauer</text><text x="305" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#14653a">kleiner ist besser</text>

  <!-- 2 Klasse -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="150" width="174" height="100" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="150" width="174" height="100" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="208">≠</text>
  <rect x="76" y="160" width="38" height="32" rx="4" fill="#1f9d55"/><text x="95" y="183" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">0</text>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="218">Klasse 0: keine Fehler</text><text font-size="13" fill="#333" text-anchor="middle" x="95" y="238">das Beste</text>
  <rect x="286" y="160" width="38" height="32" rx="4" fill="#d63c3c"/><text x="305" y="183" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">IV</text>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="218">Klasse IV: bis 50 hell</text><text font-size="13" fill="#333" text-anchor="middle" x="305" y="238">je Million · schlechteste</text>

  <!-- 3 Typ -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="260" width="174" height="104" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="260" width="174" height="104" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="320">≠</text>
  <rect x="58" y="272" width="30" height="30" fill="#fff" stroke="#3a3f4a" stroke-width="2"/><rect x="102" y="272" width="30" height="30" fill="#111" stroke="#3a3f4a" stroke-width="2"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="328">Typ 1 / 2</text><text font-size="13" fill="#333" text-anchor="middle" x="95" y="348">ganzes Pixel hell/dunkel</text>
  <rect x="275" y="272" width="60" height="30" fill="#111" stroke="#3a3f4a" stroke-width="2"/><rect x="277" y="274" width="18" height="26" fill="#e03131"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="328">Typ 3</text><text font-size="13" fill="#333" text-anchor="middle" x="305" y="348">nur ein Subpixel</text>

  <!-- 4 IPS / VA -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="374" width="174" height="102" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="374" width="174" height="102" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="434">≠</text>
  <circle cx="74" cy="402" r="11" fill="#e03131"/><circle cx="95" cy="402" r="11" fill="#2f9e44"/><circle cx="116" cy="402" r="11" fill="#1c7ed6"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="442">IPS</text><text font-size="13" fill="#333" text-anchor="middle" x="95" y="462">beste Farbtreue</text>
  <rect x="277" y="388" width="28" height="28" fill="#fff" stroke="#3a3f4a" stroke-width="2"/><rect x="305" y="388" width="28" height="28" fill="#000" stroke="#3a3f4a" stroke-width="2"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="442">VA</text><text font-size="13" fill="#333" text-anchor="middle" x="305" y="462">bester Kontrast</text>
</svg>
