<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 610" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Wer darf ins Heimnetz? Tür 1, Gastnetz: Besuch mit Handy kommt ins Haus. Ein grüner Pfeil führt nur ins Internet. Rote, durchgestrichene Pfeile zu Drucker, Jalousien und NAS: kein Zugriff. Ein Drehregler zeigt: Bandbreite begrenzen. Tür 2, VPN: Eine Person ist unterwegs im Hotel. Ein geschützter Tunnel mit Schloss führt durch das Internet ins eigene Haus bis zum NAS.</title>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<g id="xx"><path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#c62828" stroke-width="3.5"/></g>
</defs>
<rect width="400" height="610" fill="#fff"/>

<!-- ===== Tuer 1: Gastnetz ===== -->
<text x="20" y="28" font-size="17" font-weight="700" fill="#1c6b3c">Tür 1: Gastnetz</text>
<!-- Internet -->
<g fill="#dfe9fb">
<circle cx="50" cy="82" r="22"/><circle cx="80" cy="70" r="26"/><circle cx="108" cy="86" r="18"/>
<rect x="30" y="84" width="92" height="22" rx="11"/>
</g>
<text x="76" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3f8a">Internet</text>
<!-- Haus -->
<path d="M140,108 L265,52 L390,108 Z" fill="#9aa3ad"/>
<rect x="144" y="108" width="242" height="176" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
<rect x="138" y="206" width="14" height="78" fill="#c9a27a" stroke="#7a5a3a"/>
<!-- Besuch -->
<circle cx="190" cy="200" r="12" fill="#f1c9a5"/>
<rect x="176" y="214" width="28" height="46" rx="11" fill="#1f9d55"/>
<rect x="204" y="222" width="11" height="18" rx="2" fill="#222"/>
<text x="190" y="278" text-anchor="middle" font-size="13">Besuch</text>
<!-- gruen: nur Internet -->
<line x1="178" y1="192" x2="118" y2="110" stroke="#1f9d55" stroke-width="4" marker-end="url(#ag)"/>
<text x="20" y="140" font-size="15" font-weight="700" fill="#1c6b3c">nur Internet</text>
<!-- rot: kein Zugriff -->
<g stroke="#c62828" stroke-width="3">
<line x1="220" y1="224" x2="306" y2="140" marker-end="url(#ar)"/>
<line x1="220" y1="230" x2="306" y2="196" marker-end="url(#ar)"/>
<line x1="220" y1="236" x2="306" y2="252" marker-end="url(#ar)"/>
</g>
<use href="#xx" x="262" y="181"/>
<use href="#xx" x="262" y="213"/>
<use href="#xx" x="262" y="244"/>
<!-- Drucker -->
<rect x="330" y="122" width="22" height="8" fill="#fff" stroke="#333"/>
<rect x="322" y="129" width="38" height="20" rx="3" fill="#3a3f4a"/>
<text x="341" y="166" text-anchor="middle" font-size="13">Drucker</text>
<!-- Jalousien -->
<rect x="324" y="178" width="34" height="30" fill="#fff" stroke="#333" stroke-width="1.5"/>
<g stroke="#777" stroke-width="2"><line x1="326" y1="184" x2="356" y2="184"/><line x1="326" y1="190" x2="356" y2="190"/><line x1="326" y1="196" x2="356" y2="196"/><line x1="326" y1="202" x2="356" y2="202"/></g>
<text x="341" y="222" text-anchor="middle" font-size="13">Jalousien</text>
<!-- NAS -->
<rect x="326" y="234" width="30" height="30" rx="3" fill="#3a3f4a"/>
<g stroke="#9aa3ad" stroke-width="2.5"><line x1="331" y1="244" x2="351" y2="244"/><line x1="331" y1="252" x2="351" y2="252"/></g>
<text x="341" y="278" text-anchor="middle" font-size="13" font-weight="700">NAS</text>
<!-- Bandbreite -->
<circle cx="60" cy="214" r="20" fill="#eee" stroke="#555" stroke-width="2"/>
<line x1="60" y1="214" x2="48" y2="200" stroke="#E07B00" stroke-width="4" stroke-linecap="round"/>
<path d="M38,232 A28,28 0 0 1 36,196" fill="none" stroke="#1f9d55" stroke-width="3"/>
<path d="M84,196 A28,28 0 0 1 82,232" fill="none" stroke="#c62828" stroke-width="3"/>
<text x="60" y="256" text-anchor="middle" font-size="13" font-weight="700">Bandbreite</text>
<text x="60" y="272" text-anchor="middle" font-size="13" font-weight="700">begrenzen</text>

<line x1="10" y1="306" x2="390" y2="306" stroke="#ccc" stroke-width="1.5"/>

<!-- ===== Tuer 2: VPN ===== -->
<text x="20" y="336" font-size="17" font-weight="700" fill="#a85a00">Tür 2: VPN</text>
<text x="20" y="356" font-size="14">von überall auf der Welt an dein NAS</text>
<!-- Hotel -->
<rect x="16" y="400" width="96" height="140" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<rect x="30" y="384" width="68" height="22" rx="4" fill="#3a6ed8"/>
<text x="64" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Hotel</text>
<g fill="#9cc3f5"><rect x="26" y="416" width="16" height="14"/><rect x="56" y="416" width="16" height="14"/><rect x="86" y="416" width="16" height="14"/></g>
<circle cx="64" cy="462" r="11" fill="#f1c9a5"/>
<rect x="51" y="475" width="26" height="44" rx="10" fill="#E07B00"/>
<text x="64" y="562" text-anchor="middle" font-size="13">du, unterwegs</text>
<!-- Internet -->
<g fill="#dfe9fb">
<circle cx="178" cy="452" r="24"/><circle cx="208" cy="440" r="30"/><circle cx="240" cy="456" r="22"/>
<rect x="156" y="454" width="104" height="30" rx="14"/>
</g>
<text x="208" y="426" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3f8a">Internet</text>
<!-- Haus mit NAS -->
<path d="M272,430 L330,392 L388,430 Z" fill="#9aa3ad"/>
<rect x="276" y="430" width="108" height="110" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
<rect x="322" y="470" width="40" height="40" rx="4" fill="#3a3f4a"/>
<text x="342" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">NAS</text>
<text x="330" y="562" text-anchor="middle" font-size="13">dein Zuhause</text>
<!-- Tunnel -->
<line x1="92" y1="490" x2="312" y2="490" stroke="#E07B00" stroke-width="22" stroke-linecap="round"/>
<line x1="96" y1="490" x2="308" y2="490" stroke="#fff4e5" stroke-width="12"/>
<!-- Schloss -->
<path d="M200,484 v-8 a8,8 0 0 1 16,0 v8" fill="none" stroke="#333" stroke-width="3"/>
<rect x="194" y="482" width="28" height="20" rx="3" fill="#333"/>
<circle cx="208" cy="491" r="3" fill="#fff"/>
<text x="208" y="530" text-anchor="middle" font-size="15" font-weight="700" fill="#a85a00">geschützter Tunnel</text>
</svg>
