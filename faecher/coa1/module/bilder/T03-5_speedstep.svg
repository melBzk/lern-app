<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>SpeedStep und Cool'n'Quiet, Takt runter. Ablauf: 1 Ein Kern hat nichts zu tun und wird schlafen gelegt. 2 Multiplikator und Spannung sinken. 3 Das spart deutlich Energie. Ein- und ausschalten im BIOS. Unten ein vereinfacht nachgezeichneter Task-Manager aus dem Unterricht: Auslastung 17 Prozent, Geschwindigkeit 2,18 GHz, Basisgeschwindigkeit 2,70 GHz; 2,18 liegt unter 2,70, der Laptop taktet herunter, das ist kein Fehler.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">SpeedStep / Cool'n'Quiet: Takt runter</text>
<circle cx="26" cy="70" r="13" fill="#3a6ed8"/><text x="26" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<rect x="50" y="48" width="64" height="48" rx="6" fill="#d9d9d9"/><path d="M86,58 A12,12 0 1,0 93,78 A9,9 0 0,1 86,58 Z" fill="#555"/>
<text x="128" y="68" font-size="15" font-weight="700">nichts zu tun →</text><text x="128" y="88" font-size="15">Kern wird schlafen gelegt</text>
<line x1="82" y1="102" x2="82" y2="122" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<circle cx="26" cy="150" r="13" fill="#3a6ed8"/><text x="26" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<path d="M66,130 V166 M56,156 L66,168 L76,156" stroke="#3a6ed8" stroke-width="4" fill="none"/><path d="M98,130 V166 M88,156 L98,168 L108,156" stroke="#3a6ed8" stroke-width="4" fill="none"/>
<text x="128" y="148" font-size="15" font-weight="700">Multiplikator ↓</text><text x="128" y="168" font-size="15" font-weight="700">Spannung ↓</text>
<line x1="82" y1="176" x2="82" y2="196" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<circle cx="26" cy="222" r="13" fill="#2f9e44"/><text x="26" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
<path d="M82,204 C100,210 104,232 82,242 C60,232 64,210 82,204 Z" fill="#2f9e44"/>
<text x="128" y="228" font-size="15" font-weight="700" fill="#2f9e44">spart deutlich Energie</text>
<text x="200" y="270" text-anchor="middle" font-size="14" fill="#555">ein- und ausschalten im BIOS</text>
<rect x="10" y="288" width="380" height="180" rx="10" fill="#f4f5f7" stroke="#9aa3ad" stroke-width="1.5"/>
<text x="24" y="312" font-size="14" font-weight="700" fill="#555">Task-Manager im Unterricht</text>
<text x="24" y="342" font-size="15">Auslastung</text><text x="376" y="342" text-anchor="end" font-size="15" font-weight="700">17 %</text>
<rect x="20" y="352" width="360" height="34" rx="5" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="2"/>
<text x="30" y="375" font-size="15">Geschwindigkeit</text><text x="370" y="375" text-anchor="end" font-size="16" font-weight="700" fill="#3a6ed8">2,18 GHz</text>
<text x="24" y="410" font-size="15">Basisgeschwindigkeit</text><text x="376" y="410" text-anchor="end" font-size="15" font-weight="700">2,70 GHz</text>
<text x="200" y="444" text-anchor="middle" font-size="15" font-weight="700">2,18 unter 2,70 = heruntergetaktet</text>
<text x="200" y="462" text-anchor="middle" font-size="14" fill="#2f9e44" font-weight="700">kein Fehler</text>
</svg>
