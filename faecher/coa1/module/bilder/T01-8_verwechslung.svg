<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" role="img">
  <title>Vier Paare, die man nicht vertauschen darf. Thermodrucker beim Kassenzettel: Hitze färbt das Papier selbst. Thermosublimation: Hitze macht Farbe von einer Folie gasförmig, für Fotos. Typenrad: Buchstaben auf einem Rad. Kugelkopf: Buchstaben auf einer Kugel. Tintenstrahl: flüssige Tinte. Wachsdrucker: festes Wachs wird geschmolzen. Papierdrucker: Farbe auf ein Blatt. 3D-Drucker: ein Gegenstand aus Schichten.</title>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Nicht vertauschen</text>

  <!-- 1 Thermo -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="40" width="174" height="120" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="40" width="174" height="120" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="108">≠</text>
  <path d="M80,50 h30 v40 l-5,-4 l-5,4 l-5,-4 l-5,4 l-5,-4 l-5,4 z" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <g stroke="#111" stroke-width="2"><line x1="85" y1="62" x2="105" y2="62"/><line x1="85" y1="72" x2="100" y2="72"/></g>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="114">Thermodrucker</text><text font-size="13" fill="#333" text-anchor="middle" x="95" y="132">Hitze färbt Papier</text><text font-size="13" fill="#333" text-anchor="middle" x="95" y="150">Kassenzettel</text>
  <rect x="270" y="54" width="70" height="8" fill="#d6338a"/><ellipse cx="305" cy="70" rx="8" ry="4" fill="#d6338a" fill-opacity="0.5"/><rect x="270" y="78" width="70" height="10" fill="#fff" stroke="#333"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="114">Thermosublimation</text><text font-size="13" fill="#333" text-anchor="middle" x="305" y="132">Folie → Gas → Papier</text><text font-size="13" fill="#333" text-anchor="middle" x="305" y="150">Fotos</text>

  <!-- 2 Rad / Kugel -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="170" width="174" height="92" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="170" width="174" height="92" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="224">≠</text>
  <g stroke="#3a3f4a" stroke-width="2.5"><line x1="95" y1="202" x2="95" y2="182"/><line x1="95" y1="202" x2="112" y2="192"/><line x1="95" y1="202" x2="112" y2="212"/><line x1="95" y1="202" x2="95" y2="222"/><line x1="95" y1="202" x2="78" y2="212"/><line x1="95" y1="202" x2="78" y2="192"/></g>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="248">Typenrad: Rad</text>
  <circle cx="305" cy="202" r="18" fill="#c9ced6" stroke="#555" stroke-width="2"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="248">Kugelkopf: Kugel</text>

  <!-- 3 Tinte / Wachs -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="272" width="174" height="92" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="272" width="174" height="92" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="326">≠</text>
  <path d="M95,282 C88,294 84,300 84,307 a11,11 0 0 0 22,0 C106,300 102,294 95,282 z" fill="#1fa3c9"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="336">Tintenstrahl</text><text font-size="13" fill="#333" text-anchor="middle" x="95" y="354">Tinte flüssig</text>
  <rect x="290" y="288" width="30" height="24" rx="3" fill="#f2c200" stroke="#a88600"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="336">Wachsdrucker</text><text font-size="13" fill="#333" text-anchor="middle" x="305" y="354">Wachs fest, geschmolzen</text>

  <!-- 4 Papier / 3D -->
  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="374" width="174" height="88" rx="10"/><rect fill="#f3f4f6" stroke="#bbb" x="218" y="374" width="174" height="88" rx="10"/>
  <text font-size="22" font-weight="700" fill="#E07B00" text-anchor="middle" x="200" y="426">≠</text>
  <rect x="82" y="382" width="26" height="34" fill="#fff" stroke="#333"/>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="95" y="436">Papierdrucker</text><text font-size="13" fill="#333" text-anchor="middle" x="95" y="454">Farbe auf ein Blatt</text>
  <g fill="#1fa3c9" stroke="#fff"><rect x="285" y="406" width="40" height="8"/><rect x="290" y="398" width="30" height="8"/><rect x="295" y="390" width="20" height="8"/></g>
  <text font-size="14" font-weight="700" fill="#222" text-anchor="middle" x="305" y="436">3D-Drucker</text><text font-size="13" fill="#333" text-anchor="middle" x="305" y="454">Gegenstand aus Schichten</text>
</svg>
