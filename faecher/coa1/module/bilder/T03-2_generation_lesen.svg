<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Generation ablesen: die Zahl direkt nach i3, i5, i7 oder i9. Drei Beispiele mit markierter Zahl: i9-8950HK, eine Ziffer, 8. Generation (2. bis 9. Generation). i7-12700H, zwei Ziffern, 12. Generation (ab der 10.). i7-1065G7, zwei Ziffern, 10. Generation. Endbuchstaben wie H, HK, G7 zählen nicht. Unten die Stufen i3, i5, i7, i9 von einfach bis High-End, ein durchgestrichenes i8: gibt es nicht.</title>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="16" font-weight="700">Generation = Zahl nach „i3-/i5-/i7-/i9-“</text>
<rect x="10" y="44" width="380" height="88" rx="10" fill="#f4f5f7"/>
<text x="24" y="80" font-size="22" font-weight="700" font-family="ui-monospace, monospace">i9-<tspan fill="#E07B00">8</tspan><tspan fill="#555">950</tspan><tspan fill="#9aa3ad">HK</tspan></text>
<text x="250" y="80" font-size="16" font-weight="700" fill="#c25e00">→ 8. Gen.</text>
<text x="24" y="114" font-size="14" fill="#555">2. bis 9. Generation: eine Ziffer</text>
<rect x="10" y="140" width="380" height="88" rx="10" fill="#f4f5f7"/>
<text x="24" y="176" font-size="22" font-weight="700" font-family="ui-monospace, monospace">i7-<tspan fill="#E07B00">12</tspan><tspan fill="#555">700</tspan><tspan fill="#9aa3ad">H</tspan></text>
<text x="250" y="176" font-size="16" font-weight="700" fill="#c25e00">→ 12. Gen.</text>
<text x="24" y="210" font-size="14" fill="#555">ab der 10.: zwei Ziffern (10–14)</text>
<rect x="10" y="236" width="380" height="88" rx="10" fill="#f4f5f7"/>
<text x="24" y="272" font-size="22" font-weight="700" font-family="ui-monospace, monospace">i7-<tspan fill="#E07B00">10</tspan><tspan fill="#555">65</tspan><tspan fill="#9aa3ad">G7</tspan></text>
<text x="250" y="272" font-size="16" font-weight="700" fill="#c25e00">→ 10. Gen.</text>
<text x="24" y="306" font-size="14" fill="#555"><tspan fill="#9aa3ad" font-weight="700">grau</tspan> = Endbuchstaben zählen nicht</text>
<text x="200" y="362" text-anchor="middle" font-size="15" font-weight="700">Stufe: einfach bis High-End</text>
<rect x="30" y="418" width="60" height="30" rx="4" fill="#9db7ea"/><rect x="100" y="406" width="60" height="42" rx="4" fill="#6f95e0"/><rect x="170" y="394" width="60" height="54" rx="4" fill="#4a78d8"/>
<rect x="240" y="388" width="50" height="60" rx="4" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="300" y="380" width="60" height="68" rx="4" fill="#2a56b0"/>
<text x="60" y="439" text-anchor="middle" font-size="15" font-weight="700">i3</text><text x="130" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">i5</text><text x="200" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">i7</text><text x="330" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">i9</text>
<text x="265" y="424" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">i8</text><path d="M246,394 L284,442" stroke="#c62828" stroke-width="3"/>
<text x="265" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">gibt es nicht</text>
</svg>
