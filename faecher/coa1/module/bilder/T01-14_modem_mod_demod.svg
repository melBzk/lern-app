<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Das Modem übersetzt in zwei Schritten. Oben der Sender mit digitalen Daten 0 1 1 0. Schritt 1, Modulation: das Modem setzt die Daten in Signale für die Leitung um, gezeigt als Welle auf der Leitung, beim alten Modem hörbare Töne. Schritt 2, Demodulation: das Modem beim Empfänger macht daraus wieder digitale Daten 0 1 1 0. Unten der Unterschied: Der Router entscheidet, wohin die Daten gehen. Das Modem sorgt dafür, dass sie über die Leitung passen. Heute steckt das Modem meist im Router.</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700"><tspan fill="#E07B00">Mo</tspan>dulation + <tspan fill="#E07B00">Dem</tspan>odulation</text>
<!-- Sender -->
<text x="70" y="62" text-anchor="middle" font-size="14" font-weight="700">Sender</text>
<rect x="20" y="72" width="100" height="38" rx="6" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="70" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3f8a">0 1 1 0</text>
<!-- Empfaenger -->
<text x="330" y="62" text-anchor="middle" font-size="14" font-weight="700">Empfänger</text>
<rect x="280" y="72" width="100" height="38" rx="6" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="330" y="97" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3f8a">0 1 1 0</text>
<!-- Modems -->
<line x1="70" y1="112" x2="70" y2="140" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="25" y="144" width="90" height="36" rx="6" fill="#3a3f4a"/>
<text x="70" y="167" text-anchor="middle" font-weight="700" fill="#fff">Modem</text>
<line x1="330" y1="142" x2="330" y2="114" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="285" y="144" width="90" height="36" rx="6" fill="#3a3f4a"/>
<text x="330" y="167" text-anchor="middle" font-weight="700" fill="#fff">Modem</text>
<circle cx="94" cy="126" r="10" fill="#E07B00"/><text x="94" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<circle cx="306" cy="126" r="10" fill="#E07B00"/><text x="306" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<!-- Leitung -->
<line x1="115" y1="162" x2="285" y2="162" stroke="#999" stroke-width="2"/>
<path d="M120,162 q7,-16 14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0" fill="none" stroke="#2e9d5b" stroke-width="3"/>
<text x="200" y="138" text-anchor="middle" font-size="13" fill="#2e9d5b" font-weight="700">Signale auf der Leitung</text>
<!-- Schritt 1 -->
<circle cx="32" cy="216" r="12" fill="#E07B00"/><text x="32" y="221" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<text x="52" y="212" font-weight="700">Modulation (beim Senden)</text>
<text x="52" y="231" font-size="13">Daten → Signale, früher hörbare Töne</text>
<circle cx="32" cy="262" r="12" fill="#E07B00"/><text x="32" y="267" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<text x="52" y="258" font-weight="700">Demodulation (beim Empfänger)</text>
<text x="52" y="277" font-size="13">Signale → wieder Daten</text>
<line x1="15" y1="300" x2="385" y2="300" stroke="#ccc" stroke-width="1.5"/>
<!-- Router vs Modem -->
<rect x="15" y="316" width="175" height="80" rx="8" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="102" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3f8a">Router</text>
<text x="102" y="364" text-anchor="middle">entscheidet,</text>
<text x="102" y="383" text-anchor="middle" font-weight="700">wohin?</text>
<rect x="210" y="316" width="175" height="80" rx="8" fill="#e8f5ec" stroke="#2e9d5b" stroke-width="2"/>
<text x="297" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#1e6e3e">Modem</text>
<text x="297" y="364" text-anchor="middle">sorgt dafür: passt</text>
<text x="297" y="383" text-anchor="middle" font-weight="700">über die Leitung</text>
<text x="200" y="432" text-anchor="middle" font-size="14" fill="#555">Heute steckt das Modem</text>
<text x="200" y="452" text-anchor="middle" font-size="14" fill="#555">meist im Router.</text>
</svg>
