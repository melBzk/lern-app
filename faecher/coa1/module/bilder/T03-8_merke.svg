<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fünf Merksätze mit Symbol. Ein Befehl hat 5 Phasen: laden, decodieren, Operanden laden, ausführen, zurückspeichern, je ein Takt. Ohne Pipeline 5 Takte pro Befehl, alles nacheinander: 5 blaue Kästchen für Befehl 1, erst danach 2 orange für Befehl 2. Pipelining ist eine Eimerkette: jede Einheit arbeitet, aber nur 1 neuer Befehl pro Takt. Superskalar: Einheiten mehrfach, mehrere Befehle pro Takt. Moderne CPUs kombinieren beides.</title>
