<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 478" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fünf Merksätze mit Symbol. Reicht der RAM nicht, verschiebt Windows Speicherseiten in die Auslagerungsdatei pagefile.sys. Ausgelagert ist deutlich langsamer, deshalb genug echten RAM einbauen. Einstellung: Erweiterte Systemeinstellungen, Erweitert, Leistung, Einstellungen, Erweitert, Virtueller Arbeitsspeicher. Früher 1,5 mal RAM, damit beim Bluescreen ein Speicherabbild passt; heute verwaltet Windows die Größe. Viel Auslagern bedeutet viele Schreibvorgänge auf die SSD, mit der Leistungsüberwachung prüfen.</title>
