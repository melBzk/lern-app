<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Prüfweg Prozessor und Mainboard in vier Schritten von oben nach unten. 1 CPU-Packung: AMD oder Intel? Ein AMD-Board braucht eine AMD-CPU. 2 Sockel: gleicher Name und gleiche Zahl, zum Beispiel LGA 1200. 3 CPU-Support-Liste: ab welcher BIOS-Version läuft die CPU? Eventuell erst ein BIOS-Update. 4 Chipsatz: Übertakten? Wie viele USB-, PCIe- und M.2-Anschlüsse?</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Prozessor und Mainboard prüfen</text>

<!-- Pfeile zwischen den Schritten -->
<g stroke="#333" stroke-width="2.5" marker-end="url(#a)"><line x1="62" y1="136" x2="62" y2="160"/><line x1="62" y1="256" x2="62" y2="280"/><line x1="62" y1="376" x2="62" y2="400"/></g>

<!-- 1 -->
<rect x="10" y="44" width="380" height="90" rx="10" fill="#eceff1"/>
<rect x="30" y="58" width="64" height="62" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
<rect x="48" y="74" width="28" height="28" rx="3" fill="#455a64"/>
<rect x="56" y="82" width="12" height="12" fill="#9aa5b1"/>
<circle cx="24" cy="56" r="12" fill="#D4607A"/><text x="24" y="61" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<text x="110" y="74" font-size="15" font-weight="700">Hersteller</text>
<text x="110" y="96">AMD oder Intel?</text>
<text x="110" y="116">AMD-Board → AMD-CPU</text>

<!-- 2 -->
<rect x="10" y="164" width="380" height="90" rx="10" fill="#eceff1"/>
<rect x="30" y="178" width="64" height="62" rx="4" fill="#9aa5b1"/>
<g fill="#c9a227"><circle cx="42" cy="190" r="3"/><circle cx="54" cy="190" r="3"/><circle cx="66" cy="190" r="3"/><circle cx="78" cy="190" r="3"/><circle cx="42" cy="202" r="3"/><circle cx="54" cy="202" r="3"/><circle cx="66" cy="202" r="3"/><circle cx="78" cy="202" r="3"/><circle cx="42" cy="214" r="3"/><circle cx="54" cy="214" r="3"/><circle cx="66" cy="214" r="3"/><circle cx="78" cy="214" r="3"/><circle cx="42" cy="226" r="3"/><circle cx="54" cy="226" r="3"/><circle cx="66" cy="226" r="3"/><circle cx="78" cy="226" r="3"/></g>
<circle cx="24" cy="176" r="12" fill="#D4607A"/><text x="24" y="181" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<text x="110" y="194" font-size="15" font-weight="700">Sockel</text>
<text x="110" y="216">gleicher Name + Zahl</text>
<text x="110" y="236">z. B. <tspan font-weight="700">LGA 1200</tspan></text>

<!-- 3 -->
<rect x="10" y="284" width="380" height="90" rx="10" fill="#eceff1"/>
<rect x="34" y="296" width="56" height="68" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<g fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M41,312 l4,4 l8,-8"/><path d="M41,330 l4,4 l8,-8"/><path d="M41,348 l4,4 l8,-8"/></g>
<g stroke="#9aa5b1" stroke-width="2.5"><line x1="58" y1="313" x2="82" y2="313"/><line x1="58" y1="331" x2="82" y2="331"/><line x1="58" y1="349" x2="82" y2="349"/></g>
<circle cx="24" cy="296" r="12" fill="#D4607A"/><text x="24" y="301" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<text x="110" y="314" font-size="15" font-weight="700">CPU-Support-Liste</text>
<text x="110" y="336">ab BIOS-Version …</text>
<rect x="108" y="346" width="186" height="22" rx="11" fill="#fff4e5" stroke="#b45f06" stroke-width="1.5"/>
<text x="201" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#b45f06">↻ evtl. erst BIOS-Update</text>

<!-- 4 -->
<rect x="10" y="404" width="380" height="104" rx="10" fill="#eceff1"/>
<rect x="38" y="424" width="48" height="48" rx="4" fill="#455a64"/>
<g stroke="#455a64" stroke-width="2.5"><path d="M46,418 v6 M56,418 v6 M68,418 v6 M78,418 v6 M46,472 v6 M56,472 v6 M68,472 v6 M78,472 v6 M32,432 h6 M32,448 h6 M32,464 h6 M86,432 h6 M86,448 h6 M86,464 h6"/></g>
<circle cx="24" cy="416" r="12" fill="#D4607A"/><text x="24" y="421" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<text x="110" y="432" font-size="15" font-weight="700">Chipsatz</text>
<text x="110" y="454">Übertakten?</text>
<text x="110" y="474">Wie viele USB-, PCIe-</text>
<text x="110" y="494">und M.2-Anschlüsse?</text>
</svg>
