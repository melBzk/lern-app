  <text x="112.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">×2</text>
  <path d="M174.0,104 Q156.0,76 140.0,104" fill="none" stroke="#3a6ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="156.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">×2</text>
  <path d="M218.0,104 Q200.0,76 184.0,104" fill="none" stroke="#3a6ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="200.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">×2</text>
  <path d="M262.0,104 Q244.0,76 228.0,104" fill="none" stroke="#3a6ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="244.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">×2</text>
  <path d="M306.0,104 Q288.0,76 272.0,104" fill="none" stroke="#3a6ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="288.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">×2</text>
  <path d="M350.0,104 Q332.0,76 316.0,104" fill="none" stroke="#3a6ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="332.0" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">×2</text>
  <text x="200" y="54" text-anchor="middle" font-size="14" font-weight="400" fill="#444">nach links: jede Stelle doppelt so viel</text>
  <text x="46.0" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#222">128</text>
  <text x="90.0" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#222">64</text>
