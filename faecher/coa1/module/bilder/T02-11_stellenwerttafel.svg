  <rect x="200" y="138" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <rect x="244" y="138" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <rect x="288" y="138" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <rect x="332" y="138" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <text x="46.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2⁷</text>
  <text x="46.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">7</text>
  <text x="90.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2⁶</text>
  <text x="90.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">6</text>
  <text x="134.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2⁵</text>
  <text x="134.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">5</text>
  <text x="178.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2⁴</text>
  <text x="178.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">4</text>
  <text x="222.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2³</text>
  <text x="222.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">3</text>
  <text x="266.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2²</text>
  <text x="266.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">2</text>
  <text x="310.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2¹</text>
  <text x="310.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">1</text>
  <text x="354.0" y="204" text-anchor="middle" font-size="15" font-weight="400" fill="#444">2⁰</text>
  <text x="354.0" y="228" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">0</text>
  <text x="200" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#9aa0a6">Stelle</text>
  <line x1="354" y1="268" x2="354" y2="236" stroke="#e8590c" stroke-width="2.5" marker-end="url(#as)"/>
  <text x="376" y="290" text-anchor="end" font-size="15" font-weight="700" fill="#e8590c">Stelle 0 – hier fängt man an</text>

