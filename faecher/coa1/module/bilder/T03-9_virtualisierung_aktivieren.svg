<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 478" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Virtualisierung einschalten in zwei Schritten. Schritt 1: Im BIOS/UEFI den Schalter „Virtualisierung (Intel VT-x / AMD-V)“ auf Ein stellen; zu finden unter Erweitert, CPU oder Sicherheit. Pfeil nach unten. Schritt 2: In Windows im Task-Manager unter Leistung, CPU prüfen: Die markierte Zeile zeigt „Virtualisierung: Aktiviert“.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="400" height="478" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Virtualisierung einschalten</text>

<!-- Schritt 1 -->
<circle cx="24" cy="58" r="14" fill="#333"/>
<text x="24" y="63" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<text x="46" y="63" font-size="16" font-weight="700">Im BIOS/UEFI einschalten</text>
<rect x="10" y="78" width="380" height="118" rx="6" fill="#1f3b73"/>
<rect x="10" y="78" width="380" height="28" rx="6" fill="#16295a"/>
<rect x="10" y="98" width="380" height="8" fill="#16295a"/>
<text x="24" y="97" font-size="14" font-weight="700" fill="#fff">BIOS/UEFI-Setup (vereinfacht)</text>
<rect x="20" y="118" width="360" height="62" rx="4" fill="#2c4f94"/>
<text x="32" y="143" font-size="15" font-weight="700" fill="#fff">Virtualisierung</text>
<text x="32" y="164" font-size="13" fill="#dfe8ff">(Intel VT-x / AMD-V)</text>
<!-- Schalter -->
<rect x="268" y="134" width="56" height="28" rx="14" fill="#2f9e44"/>
<circle cx="310" cy="148" r="11" fill="#fff"/>
<text x="334" y="154" font-size="16" font-weight="700" fill="#fff">Ein</text>
<text x="200" y="218" font-size="13" text-anchor="middle" fill="#555">zu finden unter: Erweitert / CPU / Sicherheit</text>

<!-- Pfeil -->
<line x1="200" y1="230" x2="200" y2="266" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

<!-- Schritt 2 -->
<circle cx="24" cy="290" r="14" fill="#333"/>
<text x="24" y="295" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<text x="46" y="295" font-size="16" font-weight="700">In Windows prüfen</text>
<rect x="10" y="308" width="380" height="160" rx="6" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<rect x="10" y="308" width="380" height="30" rx="6" fill="#444"/>
<rect x="10" y="330" width="380" height="8" fill="#444"/>
<text x="24" y="328" font-size="14" font-weight="700" fill="#fff">Task-Manager · Leistung → CPU</text>
<text x="28" y="364" font-size="14" fill="#555">Kerne:</text>
<text x="220" y="364" font-size="14" fill="#555">14</text>
<text x="28" y="388" font-size="14" fill="#555">Logische Prozessoren:</text>
<text x="220" y="388" font-size="14" fill="#555">20</text>
<rect x="18" y="398" width="364" height="32" rx="5" fill="#f3e8fa" stroke="#7b3fa0" stroke-width="3"/>
<text x="28" y="420" font-size="15" font-weight="700" fill="#5a2a78">Virtualisierung:</text>
<text x="220" y="420" font-size="15" font-weight="700" fill="#5a2a78">Aktiviert</text>
<text x="28" y="450" font-size="14" fill="#555">L1-Cache:</text>
<text x="220" y="450" font-size="14" fill="#555">1,2 MB</text>
</svg>
