<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 458" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Fünf Merkzeilen: MF-102 ist die Standard-Tastatur mit Blöcken, Ziffernblock und Status-LEDs. Einen Treiber brauchst du nur für programmierbare Tasten. Das Natural Keyboard ist geteilt und V-förmig und schont die Handgelenke. Mäuse hatten früher eine Kugel, heute sind sie optisch, mit Laser präziser. Der Trackball steht still und spart Platz.</title>
