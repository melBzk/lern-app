<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="system-ui, sans-serif" role="img">
  <title>Acht Lichtschalter in einer Reihe. Schalter 1, 4 und 7 sind oben, ihre Lampen leuchten, darunter steht 1. Die übrigen Schalter sind unten, Lampe aus, darunter 0. Ein einzelner Schalter ist 1 Bit, alle 8 zusammen sind 1 Byte.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
