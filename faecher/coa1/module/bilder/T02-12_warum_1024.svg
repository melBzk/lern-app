<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222">
<title>Warum 1024: Die Verdopplungs-Reihe geht 256, 512, 1024. 1024 ist 2 hoch 10, die runde Zahl des Computers. 1 GB in der EDV ist 1024 mal 1024 mal 1024 Byte = 2 hoch 30 = 1.073.741.824 Byte. Zwischenschritt: 1024 mal 1024 = 1.048.576, mal 1024 = 1.073.741.824.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Warum gerade 1024?</text>
<!-- Reihe -->
<g text-anchor="middle" font-weight="700">
<rect x="20" y="46" width="90" height="46" rx="8" fill="#e8f0fe"/><text x="65" y="76" font-size="18">256</text>
<rect x="155" y="46" width="90" height="46" rx="8" fill="#e8f0fe"/><text x="200" y="76" font-size="18">512</text>
<rect x="290" y="46" width="90" height="46" rx="8" fill="#3a6ed8"/><text x="335" y="76" font-size="18" fill="#fff">1024</text>
<g font-size="13" fill="#555"><text x="132" y="62">×2</text><text x="267" y="62">×2</text></g>
</g>
<g stroke="#555" stroke-width="2"><line x1="112" y1="74" x2="152" y2="74" marker-end="url(#a)"/><line x1="247" y1="74" x2="287" y2="74" marker-end="url(#a)"/></g>
<text x="335" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6ed8">= 2¹⁰</text>
<text x="200" y="146" text-anchor="middle" font-size="14">Der Computer rechnet mit Zweierpotenzen –</text>
<text x="200" y="166" text-anchor="middle" font-size="14">1024 ist seine „runde“ Zahl.</text>
<!-- 1 GB -->
<rect x="10" y="186" width="380" height="204" rx="10" fill="#f4f1ee"/>
<text x="22" y="212" font-size="15" font-weight="700">1 GB in der EDV:</text>
<g font-size="17" font-weight="700" text-anchor="middle">
<rect x="22" y="226" width="96" height="40" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><text x="70" y="252">1024</text>
<text x="136" y="252">·</text>
<rect x="152" y="226" width="96" height="40" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><text x="200" y="252">1024</text>
<text x="266" y="252">·</text>
<rect x="282" y="226" width="96" height="40" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><text x="330" y="252">1024</text>
</g>
<path d="M70,270 v10 h130 v-10" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="135" y="298" text-anchor="middle" font-size="14">= 1.048.576</text>
<text x="200" y="326" text-anchor="middle" font-size="14">· 1024 = 2³⁰</text>
<rect x="40" y="338" width="320" height="42" rx="8" fill="#3a6ed8"/>
<text x="200" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1.073.741.824 Byte</text>
</svg>
