<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="system-ui, sans-serif" fill="#222">
<title>Merkbild Formfaktoren: Oben drei Teile, die zusammenpassen müssen: Mainboard mit Formfaktor (Größe und Lage der Bauteile), Gehäuse und Netzteil. In der Mitte zwei Regeln: großes Board in kleines Gehäuse geht nie (rotes X), kleines Board in großes Gehäuse geht meist, z. B. Mini-ITX ins ATX-Gehäuse (grüner Haken). Unten: Server stehen oft im 19-Zoll-Rack, Höhe in HE.</title>
<rect width="400" height="430" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Formfaktor – das Wichtigste</text>
<!-- drei Teile -->
<rect x="10" y="44" width="380" height="120" rx="10" fill="#f4f1ee"/>
<g text-anchor="middle">
<rect x="22" y="58" width="104" height="60" rx="8" fill="#d6e4fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="74" y="84" font-size="14" font-weight="700">Mainboard</text><text x="74" y="104" font-size="13">(Formfaktor)</text>
<rect x="148" y="58" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="200" y="93" font-size="14" font-weight="700">Gehäuse</text>
<rect x="274" y="58" width="104" height="60" rx="8" fill="#fff3c4" stroke="#c99a06" stroke-width="2"/>
<text x="326" y="93" font-size="14" font-weight="700">Netzteil</text>
<text x="137" y="94" font-size="17" font-weight="700" fill="#555">+</text><text x="263" y="94" font-size="17" font-weight="700" fill="#555">+</text>
<text x="200" y="148" font-size="15" font-weight="700" fill="#D4607A">müssen zusammenpassen</text>
</g>
<!-- Regeln -->
<rect x="10" y="176" width="380" height="150" rx="10" fill="#f4f1ee"/>
<rect x="88" y="196" width="40" height="40" rx="3" fill="#fff" stroke="#333" stroke-width="3"/>
<rect x="52" y="200" width="66" height="44" fill="#d6e4fb" fill-opacity="0.85" stroke="#3a6ed8" stroke-width="2"/>
<g stroke="#d43c3c" stroke-width="5" stroke-linecap="round"><line x1="148" y1="203" x2="168" y2="223"/><line x1="168" y1="203" x2="148" y2="223"/></g>
<text x="184" y="211" font-size="15" font-weight="700" fill="#d43c3c">groß in klein:</text>
<text x="184" y="230" font-size="14">geht nie</text>
<rect x="76" y="256" width="56" height="58" rx="3" fill="#fff" stroke="#333" stroke-width="3"/>
<rect x="86" y="264" width="26" height="26" fill="#fde3c4" stroke="#e08a2e" stroke-width="2"/>
<path d="M146,280 L156,290 L172,270" fill="none" stroke="#2e9d5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="184" y="276" font-size="15" font-weight="700" fill="#2e9d5b">klein in groß:</text>
<text x="184" y="295" font-size="14">geht meist</text>
<text x="184" y="313" font-size="13" fill="#666">(Mini-ITX ins ATX-Gehäuse)</text>
<!-- Rack -->
<rect x="10" y="338" width="380" height="82" rx="10" fill="#f4f1ee"/>
<rect x="30" y="350" width="46" height="58" fill="#fff" stroke="#333" stroke-width="2.5"/>
<g fill="#9cc0ef" stroke="#3a6ed8" stroke-width="1.5"><rect x="34" y="354" width="38" height="9"/><rect x="34" y="366" width="38" height="9"/><rect x="34" y="378" width="38" height="18"/></g>
<text x="96" y="373" font-size="15" font-weight="700">Server: oft im 19-Zoll-Rack</text>
<text x="96" y="395" font-size="14">Höhe in HE (Höheneinheiten)</text>
</svg>
