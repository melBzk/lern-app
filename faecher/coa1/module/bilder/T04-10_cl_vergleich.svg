<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Riegel vergleichen. Fall 1, gleicher Typ und gleicher Takt: DDR4-3200 CL16 gegen DDR4-3200 CL22, dazwischen eine Uhr für gleichen Takt. Pokal beim CL16-Riegel: weniger Takte warten ist schneller. Fall 2, verschiedener Takt: DDR4-2666 CL16 gegen DDR5-6000 CL30. Zwei Balken zeigen die echte Wartezeit: ungefähr 12 Nanosekunden beim DDR4-Riegel, 10 Nanosekunden beim DDR5-Riegel. Hinweis: größere CL-Zahl, trotzdem kürzer, weil der Takt schneller ist.</title>
<rect width="400" height="560" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="700">Zwei Riegel vergleichen</text>

<!-- Fall 1 -->
<text x="16" y="56" font-size="15" font-weight="700">Fall 1: gleicher Typ, gleicher Takt</text>
<rect x="20" y="70" width="150" height="40" rx="3" fill="#2e7d32"/>
<rect x="230" y="70" width="150" height="40" rx="3" fill="#2e7d32"/>
<g fill="#222">
<rect x="28" y="77" width="28" height="26" rx="1"/><rect x="62" y="77" width="28" height="26" rx="1"/><rect x="96" y="77" width="28" height="26" rx="1"/><rect x="130" y="77" width="28" height="26" rx="1"/>
<rect x="238" y="77" width="28" height="26" rx="1"/><rect x="272" y="77" width="28" height="26" rx="1"/><rect x="306" y="77" width="28" height="26" rx="1"/><rect x="340" y="77" width="28" height="26" rx="1"/>
</g>
<circle cx="200" cy="90" r="14" fill="#fff" stroke="#555" stroke-width="2.5"/>
<path d="M200,90 V81 M200,90 L206,94" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<text x="200" y="124" text-anchor="middle" font-size="13">gleicher</text>
<text x="200" y="140" text-anchor="middle" font-size="13">Takt</text>
<text x="95" y="134" text-anchor="middle" font-size="15" font-weight="700">DDR4-3200</text>
<text x="95" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#c62828">CL16</text>
<text x="305" y="134" text-anchor="middle" font-size="15" font-weight="700">DDR4-3200</text>
<text x="305" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#555">CL22</text>
<!-- Pokal -->
<path d="M30,176 H50 V184 Q50,196 40,196 Q30,196 30,184 Z" fill="#E07B00"/>
<path d="M30,180 Q22,180 24,187 Q26,192 31,191 M50,180 Q58,180 56,187 Q54,192 49,191" fill="none" stroke="#E07B00" stroke-width="2.5"/>
<rect x="38" y="196" width="4" height="7" fill="#E07B00"/>
<rect x="31" y="203" width="18" height="5" rx="1" fill="#E07B00"/>
<text x="64" y="190" font-weight="700" fill="#c62828">weniger Takte warten</text>
<text x="64" y="208" font-weight="700" fill="#c62828">= schneller</text>
<text x="305" y="190" text-anchor="middle" font-size="13" fill="#555">mehr Takte warten</text>

<line x1="10" y1="228" x2="390" y2="228" stroke="#ccc" stroke-width="1.5"/>

<!-- Fall 2 -->
<text x="16" y="256" font-size="15" font-weight="700">Fall 2: verschiedener Takt</text>
<rect x="20" y="270" width="150" height="40" rx="3" fill="#2e7d32"/>
<rect x="230" y="270" width="150" height="40" rx="3" fill="#2e7d32"/>
<g fill="#222">
<rect x="28" y="277" width="28" height="26" rx="1"/><rect x="62" y="277" width="28" height="26" rx="1"/><rect x="96" y="277" width="28" height="26" rx="1"/><rect x="130" y="277" width="28" height="26" rx="1"/>
<rect x="238" y="277" width="28" height="26" rx="1"/><rect x="272" y="277" width="28" height="26" rx="1"/><rect x="306" y="277" width="28" height="26" rx="1"/><rect x="340" y="277" width="28" height="26" rx="1"/>
</g>
<text x="95" y="334" text-anchor="middle" font-size="15" font-weight="700">DDR4-2666</text>
<text x="95" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#555">CL16</text>
<text x="305" y="334" text-anchor="middle" font-size="15" font-weight="700">DDR5-6000</text>
<text x="305" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#3a6ed8">CL30</text>

<text x="16" y="392" font-weight="700">Echte Wartezeit in ns:</text>
<rect x="20" y="402" width="240" height="28" rx="3" fill="#9aa5b1"/>
<text x="30" y="421" font-size="13" font-weight="700" fill="#fff">DDR4-2666 CL16</text>
<text x="268" y="421" font-weight="700" fill="#555">≈ 12 ns</text>
<rect x="20" y="440" width="200" height="28" rx="3" fill="#3a6ed8"/>
<text x="30" y="459" font-size="13" font-weight="700" fill="#fff">DDR5-6000 CL30</text>
<text x="228" y="459" font-weight="700" fill="#3a6ed8">10 ns (kürzer)</text>

<rect x="12" y="484" width="376" height="66" rx="8" fill="#eceff1"/>
<text x="200" y="510" text-anchor="middle" font-weight="700">größere CL-Zahl – trotzdem kürzer,</text>
<text x="200" y="532" text-anchor="middle">weil der Takt schneller ist</text>
</svg>
