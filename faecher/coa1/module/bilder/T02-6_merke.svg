<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222">
<title>Merkbild Steckplätze in fünf Zeilen: 1. DDR3, DDR4, DDR5 passen nicht ineinander, der Steg verhindert Verwechslung. 2. Arretierung ganz schließen, sonst Pieptöne beim POST. 3. Dual Channel: zwei Riegel als Kit in gleichfarbige Plätze. 4. Erweiterungskarten und Grafikkarte in PCIe, Festplatten an SATA oder M.2. 5. BIOS oder UEFI erkennt beim Start die Geräte, die Knopfzelle hält Uhrzeit und Einstellungen.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Steckplätze – das Wichtigste</text>
<g fill="#f4f1ee"><rect x="10" y="42" width="380" height="66" rx="10"/><rect x="10" y="114" width="380" height="66" rx="10"/><rect x="10" y="186" width="380" height="66" rx="10"/><rect x="10" y="258" width="380" height="66" rx="10"/><rect x="10" y="330" width="380" height="66" rx="10"/></g>
<!-- 1 -->
<path d="M20,52 H90 V74 H60 V66 H54 V74 H20 Z" fill="#2e7d4f"/>
<rect x="20" y="80" width="38" height="9" fill="#555"/><rect x="58" y="70" width="6" height="19" fill="#D4607A"/><rect x="64" y="80" width="26" height="9" fill="#555"/>
<g stroke="#d43c3c" stroke-width="3"><line x1="80" y1="92" x2="90" y2="102"/><line x1="90" y1="92" x2="80" y2="102"/></g>
<text x="102" y="70" font-size="15" font-weight="700">DDR3/4/5 nicht kompatibel</text>
<text x="102" y="92" font-size="13">der Steg verhindert Verwechslung</text>
<!-- 2 -->
<rect x="30" y="134" width="50" height="22" rx="2" fill="#2e7d4f"/>
<g fill="#D4607A"><rect x="22" y="130" width="8" height="32" rx="2"/><rect x="80" y="130" width="8" height="32" rx="2"/></g>
<text x="102" y="142" font-size="15" font-weight="700">Klammern ganz zu</text>
<text x="102" y="164" font-size="13">sonst piept es beim POST</text>
<!-- 3 -->
<g fill="#2e7d4f"><rect x="24" y="196" width="26" height="40" rx="2"/><rect x="58" y="196" width="26" height="40" rx="2"/></g>
<g fill="#3a6ed8"><rect x="24" y="236" width="26" height="6"/><rect x="58" y="236" width="26" height="6"/></g>
<text x="102" y="214" font-size="15" font-weight="700">Dual Channel: Kit</text>
<text x="102" y="236" font-size="13">2 Riegel in gleichfarbige Plätze</text>
<!-- 4 -->
<rect x="20" y="272" width="70" height="10" rx="2" fill="#333"/>
<rect x="20" y="292" width="24" height="18" fill="#333"/><rect x="26" y="297" width="12" height="6" fill="#f4f1ee"/>
<rect x="52" y="296" width="38" height="10" rx="2" fill="#2e7d4f"/>
<text x="102" y="286" font-size="15" font-weight="700">Karten → PCIe</text>
<text x="102" y="308" font-size="13">Festplatten → SATA oder M.2</text>
<!-- 5 -->
<rect x="14" y="344" width="46" height="34" fill="#333"/>
<text x="37" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BIOS</text>
<circle cx="80" cy="361" r="15" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/>
<text x="102" y="358" font-size="15" font-weight="700">BIOS/UEFI erkennt Geräte</text>
<text x="102" y="380" font-size="13">Knopfzelle hält Uhrzeit, Einstellungen</text>
</svg>
