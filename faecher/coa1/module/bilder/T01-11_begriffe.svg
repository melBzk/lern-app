<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" font-family="system-ui, sans-serif" role="img">
  <title>Die 8 neuen Wörter als Bildkacheln. Lautsprecher: macht aus dem Signal hörbaren Ton. Surround: Raumklang, Lautsprecher rund um dich. Subwoofer: nur für tiefe Töne, den Bass. Kopfhörer und Headset: Headset ist Kopfhörer mit Mikrofon. Beamer: wirft das Bild an Wand oder Leinwand. VR-Brille: Bildschirme vor den Augen. Braille-Gerät: Text als tastbare Punkte. Roboter: Maschine, die der Computer bewegt.</title>
  <rect width="400" height="488" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Die 8 neuen Wörter</text>

  <g transform="translate(8,40)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="74" y="6" width="32" height="48" rx="4" fill="#3a3f4a"/><circle cx="90" cy="20" r="6" fill="#9aa3ae"/><circle cx="90" cy="40" r="10" fill="#9aa3ae"/>
    <path d="M114,22 q8,8 0,16 M120,16 q14,14 0,28" fill="none" stroke="#E07B00" stroke-width="2.5"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Lautsprecher</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">macht Ton hörbar</text></g>

  <g transform="translate(204,40)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <circle cx="94" cy="32" r="8" fill="#E07B00"/>
    <g fill="#3a3f4a"><rect x="62" y="6" width="12" height="12" rx="2"/><rect x="114" y="6" width="12" height="12" rx="2"/><rect x="88" y="4" width="12" height="10" rx="2"/><rect x="62" y="44" width="12" height="12" rx="2"/><rect x="114" y="44" width="12" height="12" rx="2"/></g>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Surround</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Klang von allen Seiten</text></g>

  <g transform="translate(8,152)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="68" y="6" width="52" height="48" rx="5" fill="#3a3f4a"/><circle cx="94" cy="30" r="17" fill="#6b7280"/><circle cx="94" cy="30" r="7" fill="#3a3f4a"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Subwoofer</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">nur tiefe Töne (Bass)</text></g>

  <g transform="translate(204,152)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <path d="M70,40 v-10 a24,22 0 0 1 48,0 v10" fill="none" stroke="#3a3f4a" stroke-width="5"/>
    <rect x="62" y="30" width="14" height="22" rx="5" fill="#3a3f4a"/><rect x="112" y="30" width="14" height="22" rx="5" fill="#3a3f4a"/>
    <path d="M70,50 q2,10 22,8" fill="none" stroke="#E07B00" stroke-width="3"/><circle cx="94" cy="58" r="4" fill="#E07B00"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Kopfhörer / Headset</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Headset: + Mikrofon</text></g>

  <g transform="translate(8,264)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="30" y="26" width="40" height="22" rx="4" fill="#3a3f4a"/><circle cx="68" cy="37" r="6" fill="#f2c200"/>
    <path d="M72,33 L150,8 L150,56 L72,41 z" fill="#f2c200" opacity="0.35"/><rect x="150" y="8" width="6" height="48" fill="#fff" stroke="#999"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Beamer</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Bild an die Wand</text></g>

  <g transform="translate(204,264)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="56" y="14" width="76" height="32" rx="12" fill="#3a3f4a"/>
    <rect x="64" y="20" width="26" height="20" rx="4" fill="#4aa3ff"/><rect x="98" y="20" width="26" height="20" rx="4" fill="#4aa3ff"/>
    <path d="M56,26 h-12 M132,26 h12" stroke="#3a3f4a" stroke-width="4"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">VR-Brille</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Bildschirme vor den Augen</text></g>

  <g transform="translate(8,376)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="60" y="8" width="68" height="44" rx="5" fill="#e5e7eb" stroke="#3a3f4a" stroke-width="2"/>
    <g fill="#222"><circle cx="76" cy="18" r="4"/><circle cx="76" cy="30" r="4"/><circle cx="88" cy="30" r="4"/><circle cx="76" cy="42" r="4"/><circle cx="104" cy="18" r="4"/><circle cx="116" cy="18" r="4"/><circle cx="116" cy="30" r="4"/></g>
    <g fill="none" stroke="#bbb"><circle cx="88" cy="18" r="4"/><circle cx="88" cy="42" r="4"/><circle cx="104" cy="30" r="4"/><circle cx="104" cy="42" r="4"/><circle cx="116" cy="42" r="4"/></g>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Braille-Gerät</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Text als Tastpunkte</text></g>

  <g transform="translate(204,376)"><rect fill="#f3f4f6" stroke="#bbb" width="188" height="104" rx="10"/>
    <rect x="60" y="44" width="34" height="10" rx="2" fill="#3a3f4a"/>
    <path d="M77,44 L86,20 L118,12" fill="none" stroke="#E07B00" stroke-width="7" stroke-linecap="round"/>
    <circle cx="86" cy="20" r="5" fill="#3a3f4a"/><path d="M118,6 l8,6 l-8,6" fill="none" stroke="#3a3f4a" stroke-width="3"/>
    <text font-size="15" font-weight="700" fill="#222" text-anchor="middle" x="94" y="74">Roboter</text><text font-size="13" fill="#333" text-anchor="middle" x="94" y="93">Computer bewegt etwas</text></g>
</svg>
