<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" role="img">
  <title>Rechenweg für die Auflösung 1024 mal 768. Schritt 1: 1024 Pixel liegen in einer Zeile, waagerecht. Schritt 2: 768 Zeilen liegen übereinander. Schritt 3: Pixel pro Zeile mal Zahl der Zeilen: 1024 mal 768 gleich 786 432 Bildpunkte. Merke: Breite mal Höhe.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Wie viele Pixel hat 1024 × 768?</text>

  <!-- Raster -->
  <rect x="70" y="84" width="240" height="180" fill="#fff" stroke="#3a3f4a" stroke-width="3"/>
  <g stroke="#c9ced6" stroke-width="1">
    <line x1="90" y1="84" x2="90" y2="264"/><line x1="110" y1="84" x2="110" y2="264"/><line x1="130" y1="84" x2="130" y2="264"/><line x1="150" y1="84" x2="150" y2="264"/><line x1="170" y1="84" x2="170" y2="264"/><line x1="190" y1="84" x2="190" y2="264"/><line x1="210" y1="84" x2="210" y2="264"/><line x1="230" y1="84" x2="230" y2="264"/><line x1="250" y1="84" x2="250" y2="264"/><line x1="270" y1="84" x2="270" y2="264"/><line x1="290" y1="84" x2="290" y2="264"/>
    <line x1="70" y1="104" x2="310" y2="104"/><line x1="70" y1="124" x2="310" y2="124"/><line x1="70" y1="144" x2="310" y2="144"/><line x1="70" y1="164" x2="310" y2="164"/><line x1="70" y1="184" x2="310" y2="184"/><line x1="70" y1="204" x2="310" y2="204"/><line x1="70" y1="224" x2="310" y2="224"/><line x1="70" y1="244" x2="310" y2="244"/></g>
  <rect x="70" y="84" width="240" height="20" fill="#E07B00" fill-opacity="0.35"/>

  <line x1="72" y1="66" x2="308" y2="66" stroke="#E07B00" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <circle cx="22" cy="58" r="11" fill="#E07B00"/><text x="22" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="190" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#b35f00">1024 Pixel in einer Zeile</text>

  <line x1="330" y1="86" x2="330" y2="262" stroke="#E07B00" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <circle cx="352" cy="128" r="11" fill="#E07B00"/><text x="352" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="344" y="170" font-size="15" font-weight="700" fill="#b35f00">768</text>
  <text x="340" y="188" font-size="14" fill="#b35f00">Zeilen</text>

  <!-- Rechnung -->
  <rect x="8" y="290" width="384" height="80" rx="12" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <circle cx="30" cy="314" r="11" fill="#E07B00"/><text x="30" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="50" y="319" font-size="15" fill="#222">Pixel pro Zeile × Zahl der Zeilen</text>
  <text x="200" y="354" text-anchor="middle" font-size="20" font-weight="700" fill="#222">1024 × 768 = 786 432</text>
  <text x="200" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#b35f00">Merke: Breite mal Höhe</text>
</svg>
