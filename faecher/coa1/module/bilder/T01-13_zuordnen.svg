<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Zuordnen mit einer Frage: Wie groß ist das Gebiet? Fünf Zeilen, jeweils Situation, Gebiet und Netz. Handy und Funk-Kopfhörer, um eine Person: PAN. Arztpraxis, ein Gebäude: LAN. Werk mit Verwaltung, Halle und Lager, ein Firmengelände: CAN. Bäckerei-Filialen in allen Stadtteilen, eine Stadt: MAN. Standorte in zwei weit entfernten Städten, weite Entfernung: WAN. Unten der Merkspruch Paula Liest Comics, Max Wäscht Gläser für PAN, LAN, CAN, MAN, WAN, GAN.</title>
