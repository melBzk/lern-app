<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Rechnung für den Laptop aus dem Unterricht, Intel Core i7-12700H. Obere Reihe: 6 P-Kerne (Performance, stark), jeder mit 2 Threads: 6 mal 2 gleich 12. Untere Reihe: 8 E-Kerne (Effizienz, sparsam), jeder mit 1 Thread: 8 mal 1 gleich 8. Summe: Kerne 6 plus 8 gleich 14; logische Prozessoren 12 plus 8 gleich 20.</title>
