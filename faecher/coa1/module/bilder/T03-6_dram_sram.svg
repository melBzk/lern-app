<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Speicherzellen für je 1 Bit. Links DRAM (Arbeitsspeicher): 1 Transistor und ein Ladungsspeicher wie ein Eimer, der tropft; muss ständig aufgefrischt werden; Preis €. Rechts SRAM (Cache): bis zu 8 Transistoren, kein Auffrischen, sehr schnell; Preis €€€. Unten zwei gleich große Flächen: links viele Zellen, rechts wenige – gleiche Fläche, viel weniger Bits.</title>
<rect width="400" height="490" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Eine Speicherzelle = 1 Bit</text>
<!-- DRAM -->
<rect x="10" y="40" width="185" height="262" rx="10" fill="#f4f1ee" stroke="#bbb" stroke-width="1.5"/>
<text x="102" y="64" font-size="18" text-anchor="middle" font-weight="700">DRAM</text>
<text x="102" y="82" font-size="13" text-anchor="middle" fill="#555">(Arbeitsspeicher)</text>
<rect x="28" y="118" width="58" height="40" rx="4" fill="#fff" stroke="#444" stroke-width="2"/>
<g stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round">
<line x1="34" y1="146" x2="44" y2="146"/><line x1="44" y1="146" x2="64" y2="130"/><line x1="66" y1="146" x2="80" y2="146"/>
</g>
<circle cx="44" cy="146" r="3" fill="#222"/><circle cx="66" cy="146" r="3" fill="#222"/>
<line x1="86" y1="138" x2="112" y2="138" stroke="#444" stroke-width="2"/>
<path d="M112,112 L168,112 L160,170 L120,170 Z" fill="#fff" stroke="#444" stroke-width="2.5"/>
<path d="M114.5,130 L165.5,130 L160,170 L120,170 Z" fill="#5b86e0"/>
<path d="M140,175 q-6,9 0,13 q6,-4 0,-13 z" fill="#5b86e0"/>
<text x="102" y="208" font-size="13" text-anchor="middle" font-weight="700">1 Transistor +</text>
<text x="102" y="225" font-size="13" text-anchor="middle" font-weight="700">Ladungsspeicher</text>
<text x="102" y="248" font-size="13" text-anchor="middle" font-weight="700" fill="#c62828">muss ständig</text>
<text x="102" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#c62828">aufgefrischt werden</text>
<path d="M78,276 h44 l10,10 l-10,10 h-44 z" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
<text x="100" y="292" font-size="15" text-anchor="middle" font-weight="700" fill="#2f6b4f">€</text>
<!-- SRAM -->
<rect x="205" y="40" width="185" height="262" rx="10" fill="#f4f1ee" stroke="#bbb" stroke-width="1.5"/>
<text x="297" y="64" font-size="18" text-anchor="middle" font-weight="700">SRAM</text>
<text x="297" y="82" font-size="13" text-anchor="middle" fill="#555">(Cache)</text>
<g id="s">
<rect x="216" y="104" width="38" height="28" rx="3" fill="#fff" stroke="#444" stroke-width="1.5"/>
<path d="M220,124 h6 l12,-10 M240,124 h10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="226" cy="124" r="2" fill="#222"/><circle cx="240" cy="124" r="2" fill="#222"/>
</g>
<use href="#s" x="42"/><use href="#s" x="84"/><use href="#s" x="126"/>
<use href="#s" y="36"/><use href="#s" x="42" y="36"/><use href="#s" x="84" y="36"/><use href="#s" x="126" y="36"/>
<text x="297" y="208" font-size="13" text-anchor="middle" font-weight="700">bis zu 8 Transistoren</text>
<text x="297" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#2f6b4f">kein Auffrischen</text>
<text x="297" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#2f6b4f">sehr schnell</text>
<path d="M265,276 h56 l10,10 l-10,10 h-56 z" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="293" y="292" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">€€€</text>
<!-- gleiche Fläche -->
<text x="102" y="330" font-size="14" text-anchor="middle" font-weight="700">DRAM</text>
<text x="297" y="330" font-size="14" text-anchor="middle" font-weight="700">SRAM</text>
<rect x="42" y="338" width="120" height="120" fill="#fff" stroke="#222" stroke-width="2"/>
<g stroke="#fff" stroke-width="2">
<rect x="42" y="338" width="120" height="120" fill="#7ea0e8"/>
<path d="M57,338 V458 M72,338 V458 M87,338 V458 M102,338 V458 M117,338 V458 M132,338 V458 M147,338 V458 M42,353 H162 M42,368 H162 M42,383 H162 M42,398 H162 M42,413 H162 M42,428 H162 M42,443 H162"/>
</g>
<rect x="42" y="338" width="120" height="120" fill="none" stroke="#222" stroke-width="2"/>
<g stroke="#fff" stroke-width="3">
<rect x="237" y="338" width="120" height="120" fill="#E07B00"/>
<path d="M277,338 V458 M317,338 V458 M237,378 H357 M237,418 H357"/>
</g>
<rect x="237" y="338" width="120" height="120" fill="none" stroke="#222" stroke-width="2"/>
<text x="200" y="480" font-size="15" text-anchor="middle" font-weight="700">gleiche Fläche – viel weniger Bits</text>
</svg>
