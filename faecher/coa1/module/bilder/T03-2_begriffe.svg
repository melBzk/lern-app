<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 592" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Die neuen Wörter mit Symbol: Intel Xeon = Server und Workstation (Server-Schrank). Intel Atom = sparsam, mobil (Tablet). Intel Quark = winzige Chips für IoT. AMD EPYC = Server, AMD Threadripper = Workstation. Eigener grauer Kasten „allgemein, jeder Hersteller“: IoT = Internet der Dinge, vernetzte Kleinstgeräte (Gerät mit Funkwellen). Embedded System = fest eingebauter Computer, z. B. im Fernseher oder Router. ARM = Smartphone und Tablet, wenige einfache Befehle (RISC).</title>
<rect width="400" height="592" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Die neuen Wörter</text>
<text x="105" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">Intel</text>
<text x="300" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">AMD</text>
<rect x="10" y="66" width="190" height="78" rx="10" fill="#e3ecfb"/>
<rect x="22" y="80" width="30" height="50" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M27,92 H47 M27,104 H47 M27,116 H47" stroke="#555" stroke-width="2"/>
<text x="62" y="98" font-size="15" font-weight="700">Xeon</text><text x="62" y="118" font-size="13">Server, Workstation</text>
<rect x="206" y="66" width="184" height="120" rx="10" fill="#fbe3e3"/>
<rect x="218" y="88" width="30" height="50" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M223,100 H243 M223,112 H243 M223,124 H243" stroke="#555" stroke-width="2"/>
<text x="258" y="114" font-size="15" font-weight="700">EPYC</text><text x="258" y="134" font-size="13">Server</text>
<rect x="206" y="192" width="184" height="120" rx="10" fill="#fbe3e3"/>
<rect x="220" y="216" width="26" height="46" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><circle cx="233" cy="252" r="3" fill="#555"/>
<text x="258" y="240" font-size="15" font-weight="700">Threadripper</text><text x="258" y="260" font-size="13">Workstation</text>
<rect x="10" y="150" width="190" height="78" rx="10" fill="#e3ecfb"/>
<rect x="24" y="164" width="28" height="44" rx="4" fill="#fff" stroke="#555" stroke-width="2"/><rect x="28" y="170" width="20" height="30" fill="#cfd6dd"/>
<text x="62" y="182" font-size="15" font-weight="700">Atom</text><text x="62" y="202" font-size="13">sparsam, mobil</text>
<rect x="10" y="234" width="190" height="78" rx="10" fill="#e3ecfb"/>
<rect x="28" y="256" width="20" height="20" fill="#5b6470"/>
<text x="62" y="266" font-size="15" font-weight="700">Quark</text><text x="62" y="286" font-size="13">winzige Chips für IoT</text>
<rect x="10" y="322" width="380" height="96" rx="10" fill="#f4f5f7" stroke="#9aa3ad" stroke-width="1.5"/>
<text x="24" y="342" font-size="14" font-weight="700" fill="#555">allgemein (jeder Hersteller)</text>
<rect x="24" y="358" width="26" height="26" rx="4" fill="#fff" stroke="#555" stroke-width="2"/><path d="M56,362 q6,9 0,18 M62,358 q10,13 0,26" stroke="#2f9e44" stroke-width="2.5" fill="none"/>
<text x="80" y="370" font-size="15" font-weight="700">IoT</text><text x="80" y="388" font-size="13">vernetzte</text><text x="80" y="404" font-size="13">Kleinstgeräte</text>
<rect x="200" y="356" width="34" height="24" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><rect x="212" y="364" width="10" height="9" fill="#5b6470"/><path d="M208,384 H226" stroke="#555" stroke-width="2"/>
<text x="244" y="370" font-size="15" font-weight="700">Embedded</text><text x="244" y="388" font-size="13">fest eingebaut,</text><text x="244" y="404" font-size="13">z. B. im Router</text>
<rect x="10" y="428" width="380" height="88" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<rect x="28" y="442" width="32" height="58" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><circle cx="44" cy="492" r="3" fill="#555"/>
<text x="76" y="462" font-size="15" font-weight="700">ARM</text><text x="76" y="482" font-size="13">in Smartphones und Tablets</text><text x="76" y="500" font-size="13">wenige, einfache Befehle (RISC)</text>
<text x="200" y="546" text-anchor="middle" font-size="14" fill="#555">Schon bekannt (T02-7):</text>
<text x="200" y="568" text-anchor="middle" font-size="14" fill="#555">Intel Core i3–i9, AMD Ryzen, Sockel</text>
</svg>
