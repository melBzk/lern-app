<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" role="img">
  <title>Angebote vergleichen und begründen, in drei Schritten. Schritt 1: Wert im Datenblatt ablesen. Schritt 2: mit der Kauf-Checkliste vergleichen, was gut ist. Schritt 3: zum Bedarf passen, zum Beispiel Grafikarbeit, also IPS. So wählst du in der AP1 Hardware nach Datenblatt aus und begründest die Wahl; das gehört auch zum Lernfeld 2.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Angebot prüfen in 3 Schritten</text>

  <rect x="8" y="42" width="384" height="88" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <circle cx="32" cy="86" r="13" fill="#E07B00"/><text x="32" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  <rect x="58" y="56" width="46" height="60" rx="3" fill="#fff" stroke="#3a3f4a" stroke-width="2"/><g stroke="#999" stroke-width="2"><line x1="64" y1="70" x2="98" y2="70"/><line x1="64" y1="82" x2="98" y2="82"/><line x1="64" y1="94" x2="98" y2="94"/><line x1="64" y1="106" x2="90" y2="106"/></g>
  <text x="122" y="82" font-size="16" font-weight="700" fill="#222">Wert ablesen</text>
  <text x="122" y="104" font-size="14" fill="#333">im Datenblatt</text>
  <line x1="200" y1="134" x2="200" y2="152" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

  <rect x="8" y="158" width="384" height="88" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <circle cx="32" cy="202" r="13" fill="#E07B00"/><text x="32" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  <g fill="none" stroke="#1f9d55" stroke-width="3"><path d="M60,180 l5,5 l9,-10"/><path d="M60,200 l5,5 l9,-10"/><path d="M60,220 l5,5 l9,-10"/></g>
  <g stroke="#999" stroke-width="2"><line x1="80" y1="181" x2="104" y2="181"/><line x1="80" y1="201" x2="104" y2="201"/><line x1="80" y1="221" x2="104" y2="221"/></g>
  <text x="122" y="198" font-size="16" font-weight="700" fill="#222">mit „gut ist …“ vergleichen</text>
  <text x="122" y="220" font-size="14" fill="#333">Kauf-Checkliste</text>
  <line x1="200" y1="250" x2="200" y2="268" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

  <rect x="8" y="274" width="384" height="88" rx="12" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <circle cx="32" cy="318" r="13" fill="#E07B00"/><text x="32" y="323" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
  <circle cx="74" cy="306" r="10" fill="#3a3f4a"/><path d="M58,340 q16,-26 32,0 z" fill="#3a3f4a"/>
  <text x="122" y="312" font-size="16" font-weight="700" fill="#222">zum Bedarf passen</text>
  <text x="122" y="336" font-size="14" fill="#333">z. B. Grafikarbeit → </text><text x="258" y="336" font-size="15" font-weight="700" fill="#b35f00">IPS</text>

  <text x="200" y="398" text-anchor="middle" font-size="14" fill="#333">AP1 + Lernfeld 2: auswählen und begründen</text>
</svg>
