<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" font-family="system-ui, sans-serif">
  <title>Vereinfacht nachgebautes Fenster Task-Manager. Links die Menüpunkte Prozesse, Leistung (ausgewählt) und Details. Daneben die Liste CPU (ausgewählt), Arbeitsspeicher, Datenträger 0, Datenträger 1, WLAN und GPU. Darunter die Kurve CPU-Auslastung und die Werte aus dem Unterricht: Geschwindigkeit 2,18 GHz (schwankt), Basisgeschwindigkeit 2,70 GHz, Kerne 14, Logische Prozessoren 20, Virtualisierung Aktiviert, L1-Cache 1,2 MB, L2-Cache 11,5 MB, L3-Cache 24,0 MB.</title>
  <rect width="400" height="600" fill="#fff"/>

  <!-- Fenster -->
  <rect x="6" y="8" width="388" height="584" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <path d="M6,16 Q6,8 14,8 L386,8 Q394,8 394,16 L394,38 L6,38 Z" fill="#555"/>
  <text x="18" y="29" font-size="14" font-weight="700" fill="#fff">Task-Manager</text>
  <text x="382" y="29" text-anchor="end" font-size="13" fill="#ddd">vereinfacht nachgebaut</text>

  <!-- Menü links -->
  <g font-size="14" fill="#222">
    <text x="20" y="72">Prozesse</text>
    <rect x="12" y="86" width="104" height="30" rx="5" fill="#3a6ed8"/>
    <text x="20" y="106" font-weight="700" fill="#fff">Leistung</text>
    <text x="20" y="140">Details</text>
  </g>
  <line x1="124" y1="48" x2="124" y2="244" stroke="#ccc" stroke-width="1.5"/>

  <!-- Liste Mitte -->
  <g font-size="14" fill="#222">
    <rect x="132" y="50" width="254" height="28" rx="5" fill="#fff" stroke="#d63c3c" stroke-width="2.5"/>
    <text x="142" y="69" font-weight="700" fill="#d63c3c">CPU</text>
    <text x="142" y="101">Arbeitsspeicher</text>
    <text x="142" y="133">Datenträger 0</text>
    <text x="142" y="165">Datenträger 1</text>
    <text x="142" y="197">WLAN</text>
    <text x="142" y="229">GPU</text>
  </g>

  <!-- CPU-Bereich -->
  <rect x="12" y="254" width="376" height="330" rx="8" fill="#fff" stroke="#d63c3c" stroke-width="2"/>
  <text x="24" y="278" font-size="15" font-weight="700" fill="#222">CPU-Auslastung</text>
  <rect x="24" y="288" width="352" height="80" fill="#e8f0fe" stroke="#9cb6e8"/>
  <g stroke="#c9d7f2" stroke-width="1"><line x1="24" y1="308" x2="376" y2="308"/><line x1="24" y1="328" x2="376" y2="328"/><line x1="24" y1="348" x2="376" y2="348"/></g>
  <path d="M24,360 L50,356 L70,348 L86,358 L110,340 L130,352 L150,330 L166,350 L190,344 L214,320 L232,346 L256,338 L280,354 L300,326 L322,340 L344,312 L360,336 L376,330 L376,368 L24,368 Z" fill="#3a6ed8" fill-opacity="0.35" stroke="#3a6ed8" stroke-width="2"/>

  <g font-size="14" fill="#222">
    <text x="24" y="396">Geschwindigkeit:</text>
    <text x="214" y="396" font-weight="700" fill="#d63c3c">2,18 GHz</text>
    <text x="290" y="396" font-size="13" fill="#d63c3c">(schwankt)</text>
    <text x="24" y="420">Basisgeschwindigkeit:</text>
    <text x="214" y="420" font-weight="700">2,70 GHz</text>
    <text x="24" y="444">Kerne:</text>
    <text x="214" y="444" font-weight="700">14</text>
    <text x="24" y="468">Logische Prozessoren:</text>
    <text x="214" y="468" font-weight="700">20</text>
    <text x="24" y="492">Virtualisierung:</text>
    <text x="214" y="492" font-weight="700">Aktiviert</text>
    <text x="24" y="516">L1-Cache:</text>
    <text x="214" y="516" font-weight="700">1,2 MB</text>
    <text x="24" y="540">L2-Cache:</text>
    <text x="214" y="540" font-weight="700">11,5 MB</text>
    <text x="24" y="564">L3-Cache:</text>
    <text x="214" y="564" font-weight="700">24,0 MB</text>
  </g>
</svg>
