<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich Einbauküche. Kühlschrank vor einer Nische mit Maßband: passt in die Nische? Das entspricht dem Formfaktor. Herd mit Stecker vor einer Steckdose: richtiger Anschluss? Das entspricht dem Sockel. Spülmaschine mit Wasserhahn und Stromstecker: genug Strom? Das entspricht dem Netzteil. Unten ein Einkaufszettel mit Häkchen: erst messen, dann kaufen.</title>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45f06"/></marker></defs>
<rect width="400" height="540" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Wie eine Einbauküche</text>

<!-- 1 Kühlschrank + Nische -->
<path d="M20,160 V58 H130 V160" fill="none" stroke="#555" stroke-width="3"/>
<rect x="10" y="160" width="130" height="6" fill="#555"/>
<rect x="42" y="78" width="60" height="82" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
<line x1="42" y1="104" x2="102" y2="104" stroke="#3a6ed8" stroke-width="2"/>
<line x1="94" y1="86" x2="94" y2="98" stroke="#3a6ed8" stroke-width="3" stroke-linecap="round"/>
<line x1="94" y1="112" x2="94" y2="132" stroke="#3a6ed8" stroke-width="3" stroke-linecap="round"/>
<line x1="24" y1="70" x2="126" y2="70" stroke="#b45f06" stroke-width="2.5" marker-start="url(#m)" marker-end="url(#m)"/>
<g stroke="#b45f06" stroke-width="1.5"><line x1="45" y1="66" x2="45" y2="74"/><line x1="65" y1="66" x2="65" y2="74"/><line x1="85" y1="66" x2="85" y2="74"/><line x1="105" y1="66" x2="105" y2="74"/></g>
<text x="182" y="96" font-size="15" font-weight="700">passt in die Nische?</text>
<text x="182" y="122" font-size="16" font-weight="700" fill="#D4607A">= Formfaktor</text>
<line x1="10" y1="184" x2="390" y2="184" stroke="#ccc" stroke-width="1.5"/>

<!-- 2 Herd + Steckdose -->
<rect x="20" y="210" width="76" height="86" rx="4" fill="#eceff1" stroke="#555" stroke-width="2.5"/>
<g fill="none" stroke="#555" stroke-width="2.5"><circle cx="40" cy="226" r="7"/><circle cx="76" cy="226" r="7"/></g>
<rect x="30" y="246" width="56" height="40" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M96,256 C110,256 108,240 120,240" fill="none" stroke="#333" stroke-width="3"/>
<rect x="118" y="232" width="14" height="16" rx="3" fill="#333"/>
<rect x="138" y="226" width="28" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="2.5"/>
<g fill="#333"><circle cx="148" cy="240" r="2.5"/><circle cx="156" cy="240" r="2.5"/></g>
<text x="182" y="244" font-size="15" font-weight="700">richtiger Anschluss?</text>
<text x="182" y="270" font-size="16" font-weight="700" fill="#D4607A">= Sockel</text>
<line x1="10" y1="318" x2="390" y2="318" stroke="#ccc" stroke-width="1.5"/>

<!-- 3 Spülmaschine -->
<rect x="20" y="342" width="76" height="86" rx="4" fill="#eceff1" stroke="#555" stroke-width="2.5"/>
<line x1="20" y1="360" x2="96" y2="360" stroke="#555" stroke-width="2"/>
<rect x="44" y="349" width="28" height="5" rx="2" fill="#555"/>
<path d="M96,410 H110 V376" fill="none" stroke="#3a6ed8" stroke-width="4"/>
<path d="M104,370 h18" stroke="#3a6ed8" stroke-width="4" stroke-linecap="round"/>
<path d="M126,384 C134,394 134,400 126,404 C118,400 118,394 126,384 Z" fill="#3a6ed8"/>
<path d="M96,424 C120,424 124,410 140,410" fill="none" stroke="#333" stroke-width="3"/>
<path d="M150,398 L142,412 L149,412 L144,426 L156,408 L149,408 L154,398 Z" fill="#e0a000"/>
<text x="182" y="378" font-size="15" font-weight="700">genug Strom?</text>
<text x="182" y="404" font-size="16" font-weight="700" fill="#D4607A">= Netzteil</text>

<!-- Einkaufszettel -->
<rect x="60" y="452" width="280" height="74" rx="6" fill="#fffbe6" stroke="#b5a35a" stroke-width="2"/>
<path d="M80,488 l9,9 l17,-19" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="482" font-size="16" font-weight="700">erst messen,</text>
<text x="122" y="506" font-size="16" font-weight="700">dann kaufen</text>
</svg>
