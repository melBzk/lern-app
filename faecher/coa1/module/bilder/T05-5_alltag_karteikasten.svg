<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich Bibliothek. Szene 1 Schnellformatierung: Der alte Karteikasten wird weggeworfen und ein leerer hingestellt, die Bücher stehen noch im Regal. Szene 2 Vollständige Formatierung: Zusätzlich werden alle Regale leer geräumt und jedes Fach geprüft, überall ein Haken. Notiz: Neue Bücher kommen auf freie Plätze.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="590" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Wie der Karteikasten in der Bibliothek</text>

<!-- Szene 1 -->
<circle cx="24" cy="60" r="11" fill="#222"/><text x="24" y="65" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
<text x="42" y="65" font-weight="700">Schnellformatierung</text>
<rect x="10" y="78" width="380" height="210" rx="10" fill="#f5f7f8" stroke="#ccd3d8"/>
<!-- alter Kasten durchgestrichen -->
<rect x="26" y="112" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<g stroke="#3a6ed8" stroke-width="1.5"><line x1="34" y1="104" x2="34" y2="124"/><line x1="44" y1="102" x2="44" y2="124"/><line x1="54" y1="104" x2="54" y2="124"/><line x1="64" y1="102" x2="64" y2="124"/><line x1="74" y1="104" x2="74" y2="124"/></g>
<g stroke="#c62828" stroke-width="4" stroke-linecap="round"><line x1="22" y1="100" x2="94" y2="162"/><line x1="94" y1="100" x2="22" y2="162"/></g>
<text x="58" y="180" text-anchor="middle" font-size="13">alter Kasten</text>
<text x="58" y="196" text-anchor="middle" font-size="13">weg</text>
<line x1="98" y1="134" x2="122" y2="134" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<!-- neuer leerer Kasten -->
<rect x="128" y="112" width="64" height="44" rx="4" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="160" y="180" text-anchor="middle" font-size="13">neuer Kasten</text>
<text x="160" y="196" text-anchor="middle" font-size="13" font-weight="700">leer</text>
<!-- volles Regal -->
<rect x="214" y="92" width="164" height="150" fill="#fff" stroke="#8d6e63" stroke-width="3"/>
<line x1="214" y1="142" x2="378" y2="142" stroke="#8d6e63" stroke-width="3"/>
<line x1="214" y1="192" x2="378" y2="192" stroke="#8d6e63" stroke-width="3"/>
<line x1="268" y1="92" x2="268" y2="242" stroke="#8d6e63" stroke-width="3"/>
<line x1="324" y1="92" x2="324" y2="242" stroke="#8d6e63" stroke-width="3"/>
<g>
<rect x="220" y="104" width="10" height="36" fill="#3a6ed8"/><rect x="232" y="100" width="10" height="40" fill="#F2B100"/><rect x="244" y="106" width="10" height="34" fill="#2e7d32"/>
<rect x="274" y="102" width="10" height="38" fill="#c62828"/><rect x="286" y="106" width="10" height="34" fill="#3a6ed8"/><rect x="298" y="100" width="10" height="40" fill="#F2B100"/><rect x="310" y="106" width="10" height="34" fill="#555"/>
<rect x="330" y="100" width="10" height="40" fill="#2e7d32"/><rect x="342" y="104" width="10" height="36" fill="#c62828"/>
<rect x="220" y="152" width="10" height="38" fill="#555"/><rect x="232" y="156" width="10" height="34" fill="#c62828"/>
<rect x="274" y="154" width="10" height="36" fill="#2e7d32"/><rect x="286" y="150" width="10" height="40" fill="#3a6ed8"/>
<rect x="330" y="156" width="10" height="34" fill="#F2B100"/><rect x="342" y="152" width="10" height="38" fill="#3a6ed8"/><rect x="354" y="154" width="10" height="36" fill="#555"/>
<rect x="220" y="202" width="10" height="38" fill="#2e7d32"/><rect x="232" y="206" width="10" height="34" fill="#3a6ed8"/><rect x="244" y="200" width="10" height="40" fill="#c62828"/>
<rect x="286" y="204" width="10" height="36" fill="#F2B100"/>
<rect x="330" y="202" width="10" height="38" fill="#555"/><rect x="342" y="206" width="10" height="34" fill="#2e7d32"/>
</g>
<text x="296" y="264" text-anchor="middle" font-weight="700" fill="#c62828">Bücher stehen noch da</text>

<!-- Szene 2 -->
<circle cx="24" cy="318" r="11" fill="#222"/><text x="24" y="323" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
<text x="42" y="323" font-weight="700">Vollständige Formatierung</text>
<rect x="10" y="336" width="380" height="190" rx="10" fill="#f5f7f8" stroke="#ccd3d8"/>
<rect x="44" y="384" width="64" height="44" rx="4" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="76" y="452" text-anchor="middle" font-size="13">neuer Kasten</text>
<text x="76" y="468" text-anchor="middle" font-size="13" font-weight="700">leer</text>
<rect x="214" y="350" width="164" height="150" fill="#fff" stroke="#8d6e63" stroke-width="3"/>
<line x1="214" y1="400" x2="378" y2="400" stroke="#8d6e63" stroke-width="3"/>
<line x1="214" y1="450" x2="378" y2="450" stroke="#8d6e63" stroke-width="3"/>
<line x1="268" y1="350" x2="268" y2="500" stroke="#8d6e63" stroke-width="3"/>
<line x1="324" y1="350" x2="324" y2="500" stroke="#8d6e63" stroke-width="3"/>
<g fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M231,376 l7,8 l13,-16"/><path d="M286,376 l7,8 l13,-16"/><path d="M342,376 l7,8 l13,-16"/>
<path d="M231,426 l7,8 l13,-16"/><path d="M286,426 l7,8 l13,-16"/><path d="M342,426 l7,8 l13,-16"/>
<path d="M231,476 l7,8 l13,-16"/><path d="M286,476 l7,8 l13,-16"/><path d="M342,476 l7,8 l13,-16"/>
</g>
<text x="200" y="518" text-anchor="middle" font-weight="700" fill="#2e7d32">leer geräumt, jedes Fach geprüft</text>

<!-- Notiz -->
<rect x="60" y="542" width="280" height="36" rx="6" fill="#FFF6D6" stroke="#F2B100" stroke-width="2"/>
<text x="200" y="565" text-anchor="middle" font-size="13">Neue Bücher kommen auf freie Plätze</text>
</svg>
