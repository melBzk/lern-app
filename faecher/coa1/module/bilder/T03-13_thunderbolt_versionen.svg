<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Thunderbolt-Versionen als Balken: Thunderbolt 1 hat 2 Kanäle mit je 10 Gigabit pro Sekunde, Thunderbolt 2 bündelt die Kanäle zu 20 Gigabit pro Sekunde, Thunderbolt 3 schafft 40 Gigabit pro Sekunde. Darunter ein Notebook, an dem sieben Geräte hintereinander in einer Kette hängen, nummeriert 1 bis 7, zum Beispiel Monitor, Festplatte und Dock. Kette: höchstens 7 Geräte.</title>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Thunderbolt: Versionen und Kette</text>

  <!-- Balken -->
  <text x="20" y="62" font-size="14" fill="#222"><tspan font-weight="700">Thunderbolt 1</tspan></text>
  <rect x="20" y="70" width="75" height="10" fill="#3a6ed8"/>
  <rect x="20" y="84" width="75" height="10" fill="#3a6ed8"/>
  <text x="104" y="88" font-size="14" fill="#222">2 Kanäle × je 10 Gbit/s</text>

  <text x="20" y="124" font-size="14" fill="#222"><tspan font-weight="700">Thunderbolt 2</tspan> – Kanäle gebündelt</text>
  <rect x="20" y="132" width="150" height="22" fill="#3a6ed8"/>
  <text x="178" y="148" font-size="14" font-weight="700" fill="#222">20 Gbit/s</text>

  <text x="20" y="186" font-size="14" fill="#222"><tspan font-weight="700">Thunderbolt 3</tspan></text>
  <rect x="20" y="194" width="300" height="22" fill="#D4607A"/>
  <text x="32" y="210" font-size="14" font-weight="700" fill="#fff">40 Gbit/s</text>

  <line x1="14" y1="240" x2="386" y2="240" stroke="#ddd" stroke-width="2"/>

  <!-- Kette -->
  <text x="200" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#D4607A">Kette: max. 7 Geräte</text>

  <g stroke="#555" stroke-width="3" fill="none">
    <line x1="80" y1="306" x2="335" y2="306"/>
    <line x1="360" y1="326" x2="360" y2="380"/>
    <line x1="210" y1="400" x2="360" y2="400"/>
  </g>

  <!-- Notebook -->
  <rect x="18" y="284" width="60" height="38" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
  <path d="M10,322 H86 L80,330 H16 Z" fill="#3a6ed8"/>
  <text x="48" y="350" text-anchor="middle" font-size="13" fill="#222">Notebook</text>

  <!-- Geräte -->
  <g fill="#f4f1ee" stroke="#555" stroke-width="2">
    <rect x="107" y="286" width="56" height="40" rx="6"/>
    <rect x="182" y="286" width="56" height="40" rx="6"/>
    <rect x="257" y="286" width="56" height="40" rx="6"/>
    <rect x="332" y="286" width="56" height="40" rx="6"/>
    <rect x="332" y="380" width="56" height="40" rx="6"/>
    <rect x="257" y="380" width="56" height="40" rx="6"/>
    <rect x="182" y="380" width="56" height="40" rx="6"/>
  </g>
  <g font-size="18" font-weight="700" text-anchor="middle" fill="#222">
    <text x="135" y="313">1</text>
    <text x="210" y="313">2</text>
    <text x="285" y="313">3</text>
    <text x="360" y="313">4</text>
    <text x="360" y="407">5</text>
    <text x="285" y="407">6</text>
    <text x="210" y="407">7</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="135" y="346">Monitor</text>
    <text x="210" y="346">Festplatte</text>
    <text x="285" y="346">Dock</text>
  </g>
  <text x="200" y="452" text-anchor="middle" font-size="14" fill="#222">Geräte hängen hintereinander</text>
</svg>
