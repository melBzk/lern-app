<rect x="44" y="160" width="250" height="28" rx="3"/>
</g>
<g fill="#9aa5b1"><rect x="32" y="50" width="10" height="32"/><rect x="32" y="86" width="10" height="32"/><rect x="32" y="122" width="10" height="32"/><rect x="32" y="158" width="10" height="32"/></g>
<g font-size="15" font-weight="700">
<text x="58" y="71">Netzwerkkarte</text>
<text x="58" y="107">Grafikkarte</text>
<text x="58" y="143">TV-Karte</text>
<text x="58" y="179">WLAN-Karte</text>
</g>
<rect x="316" y="92" width="44" height="44" rx="4" fill="#9aa5b1"/>
<text x="338" y="119" text-anchor="middle" font-size="13" fill="#fff">CPU</text>

<!-- Zeit -->
<line x1="200" y1="210" x2="200" y2="238" stroke="#555" stroke-width="3"/>
