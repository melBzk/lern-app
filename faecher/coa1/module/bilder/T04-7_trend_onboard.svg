<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 515" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Trend: alles onboard. Oben früher: Mainboard mit vier eingesteckten Karten – Netzwerkkarte, Grafikkarte, TV-Karte, WLAN-Karte. Pfeil nach unten: Zeit. Unten heute: dasselbe Mainboard fast ohne Karten, dafür Bausteine direkt auf dem Board – LAN mit RJ45-Buchse onboard, Grafik onboard, WLAN onboard; ein Steckplatz bleibt frei. Kasten: noch als Karte – Kartenleser, Bio-Scanner.</title>
