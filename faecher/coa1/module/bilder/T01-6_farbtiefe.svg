<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif">
  <title>Farbtiefe: mehr Bit bedeuten feinere Farbstufen. Oben ein Farbverlauf von Schwarz über Braun nach Hell mit wenigen Bit: sechs grobe, sichtbare Stufen mit kleinen bunten Pünktchen, dem Bildrauschen, also zufälligen Farbfleckchen. Darunter derselbe Verlauf mit vielen Bit, wie beim Scanner mit 30, 36 oder 42 Bit: glatt und fein. Ein Pfeil führt nach unten: erstens Rauschen korrigieren, zweitens auf 24 Bit herunterrechnen. Ergebnis: Bild im PC mit 24 Bit.</title>
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.5" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#f6ecdd"/>
    </linearGradient>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
  </defs>
  <rect width="400" height="420" fill="#fff"/>

  <!-- Ueberschrift -->
  <rect x="12" y="12" width="376" height="40" rx="8" fill="#fff4e5" stroke="#E07B00"/>
  <text x="200" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Mehr Bit = feinere Farbstufen</text>

  <!-- wenige Bit -->
  <text x="12" y="82" font-size="15" font-weight="700" fill="#222">wenige Bit: grobe Stufen</text>
  <g stroke="#333" stroke-width="1">
    <rect x="12" y="92" width="63" height="56" fill="#000"/>
    <rect x="75" y="92" width="62" height="56" fill="#2e1b0c"/>
    <rect x="137" y="92" width="63" height="56" fill="#5c3818"/>
    <rect x="200" y="92" width="63" height="56" fill="#8f6236"/>
    <rect x="263" y="92" width="62" height="56" fill="#c4a27a"/>
    <rect x="325" y="92" width="63" height="56" fill="#f6ecdd"/>
  </g>
  <g>
    <circle cx="30" cy="104" r="3" fill="#e53935"/>
    <circle cx="55" cy="132" r="3" fill="#43a047"/>
    <circle cx="96" cy="115" r="3" fill="#1e88e5"/>
    <circle cx="122" cy="140" r="3" fill="#ffd600"/>
    <circle cx="160" cy="100" r="3" fill="#43a047"/>
    <circle cx="178" cy="128" r="3" fill="#d81b60"/>
    <circle cx="214" cy="118" r="3" fill="#1e88e5"/>
    <circle cx="244" cy="138" r="3" fill="#ffd600"/>
    <circle cx="280" cy="104" r="3" fill="#e53935"/>
    <circle cx="306" cy="130" r="3" fill="#1e88e5"/>
    <circle cx="345" cy="112" r="3" fill="#43a047"/>
    <circle cx="372" cy="138" r="3" fill="#d81b60"/>
  </g>
  <circle cx="214" cy="118" r="9" fill="none" stroke="#E07B00" stroke-width="2.5"/>
  <line x1="214" y1="127" x2="214" y2="160" stroke="#E07B00" stroke-width="2"/>
  <text x="200" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">Bildrauschen = zufällige Farbfleckchen</text>

  <!-- viele Bit -->
  <text x="12" y="214" font-size="15" font-weight="700" fill="#222">viele Bit: feiner Verlauf</text>
  <text x="12" y="232" font-size="13" fill="#222">Scanner: 30, 36 oder 42 Bit</text>
  <rect x="12" y="242" width="376" height="56" fill="url(#v)" stroke="#333" stroke-width="1"/>

  <!-- Pfeil -->
  <line x1="60" y1="304" x2="60" y2="356" stroke="#E07B00" stroke-width="3" marker-end="url(#o)"/>
  <text x="80" y="322" font-size="14" fill="#222"><tspan font-weight="700">1.</tspan> Rauschen korrigieren</text>
  <text x="80" y="342" font-size="14" fill="#222"><tspan font-weight="700">2.</tspan> auf 24 Bit heruntergerechnet</text>

  <!-- Ergebnis -->
  <rect x="12" y="364" width="376" height="42" rx="8" fill="#eceef1" stroke="#999"/>
  <text x="200" y="391" text-anchor="middle" font-size="15" fill="#222">Bild im PC / Grafikprogramm: <tspan font-weight="700">24 Bit</tspan></text>
</svg>
