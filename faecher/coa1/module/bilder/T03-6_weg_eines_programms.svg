<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Comic in vier Feldern: 1 Word liegt dauerhaft auf der Festplatte oder SSD. 2 Beim Start wird Word in den RAM geladen und läuft dort. 3 Die CPU holt, was gleich gebraucht wird, aus dem RAM über L3 und L2 in den L1-Cache. 4 Ergebnisse gehen zurück in den RAM; erst Speichern legt die Datei dauerhaft auf der Festplatte oder SSD ab.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
<rect width="400" height="630" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Der Weg eines Programms</text>
<!-- Feldrahmen und Nummern -->
<rect x="8" y="40" width="384" height="112" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<rect x="8" y="160" width="384" height="112" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<rect x="8" y="280" width="384" height="142" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<rect x="8" y="430" width="384" height="192" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<g font-weight="700" font-size="14" text-anchor="middle" fill="#fff">
<circle cx="28" cy="60" r="12" fill="#E07B00"/><text x="28" y="65">1</text>
<circle cx="28" cy="180" r="12" fill="#E07B00"/><text x="28" y="185">2</text>
<circle cx="28" cy="300" r="12" fill="#E07B00"/><text x="28" y="305">3</text>
<circle cx="28" cy="450" r="12" fill="#E07B00"/><text x="28" y="455">4</text>
</g>
<!-- Feld 1 -->
<rect x="56" y="78" width="90" height="46" rx="5" fill="#9e9a95"/>
<circle cx="132" cy="116" r="3" fill="#6fcf6f"/>
<rect x="66" y="62" width="24" height="30" rx="2" fill="#2b579a" stroke="#fff" stroke-width="1.5"/>
<text x="78" y="83" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">W</text>
<text x="101" y="143" font-size="13" text-anchor="middle" fill="#555">Festplatte / SSD</text>
<text x="170" y="96" font-size="15" font-weight="700">Word liegt hier</text>
<text x="170" y="116" font-size="15" font-weight="700">dauerhaft</text>
<!-- Feld 2 -->
<rect x="48" y="200" width="70" height="40" rx="5" fill="#9e9a95"/>
<rect x="60" y="188" width="20" height="25" rx="2" fill="#2b579a" stroke="#fff" stroke-width="1.5"/>
<text x="70" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">W</text>
<text x="83" y="258" font-size="13" text-anchor="middle" fill="#555">SSD</text>
<line x1="124" y1="220" x2="206" y2="220" stroke="#E07B00" stroke-width="4" marker-end="url(#o)"/>
<text x="165" y="208" font-size="13" text-anchor="middle" font-weight="700" fill="#E07B00">Start → laden</text>
<rect x="214" y="200" width="160" height="36" rx="3" fill="#4f8a6a"/>
<rect x="224" y="208" width="18" height="16" fill="#1f3b2c"/><rect x="250" y="208" width="18" height="16" fill="#1f3b2c"/><rect x="320" y="208" width="18" height="16" fill="#1f3b2c"/><rect x="346" y="208" width="18" height="16" fill="#1f3b2c"/>
<line x1="218" y1="240" x2="370" y2="240" stroke="#d4a72c" stroke-width="6" stroke-dasharray="3 2"/>
<rect x="282" y="194" width="24" height="30" rx="2" fill="#2b579a" stroke="#fff" stroke-width="1.5"/>
<text x="294" y="215" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">W</text>
<text x="294" y="262" font-size="15" text-anchor="middle" font-weight="700">Word läuft im RAM</text>
<!-- Feld 3 -->
<rect x="30" y="322" width="96" height="32" rx="3" fill="#4f8a6a"/>
<line x1="34" y1="358" x2="122" y2="358" stroke="#d4a72c" stroke-width="6" stroke-dasharray="3 2"/>
<text x="78" y="343" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">RAM</text>
<line x1="130" y1="338" x2="176" y2="338" stroke="#E07B00" stroke-width="4" marker-end="url(#o)"/>
<rect x="180" y="300" width="204" height="74" rx="6" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<text x="190" y="317" font-size="13" font-weight="700" fill="#2f6b4f">CPU</text>
<rect x="190" y="324" width="46" height="36" rx="4" fill="#a3bcf0"/>
<text x="213" y="347" font-size="14" text-anchor="middle" font-weight="700">L3</text>
<line x1="238" y1="342" x2="256" y2="342" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="260" y="324" width="46" height="36" rx="4" fill="#7ea0e8"/>
<text x="283" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">L2</text>
<line x1="308" y1="342" x2="326" y2="342" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="330" y="324" width="46" height="36" rx="4" fill="#3a6ed8"/>
<text x="353" y="347" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">L1</text>
<text x="200" y="396" font-size="15" text-anchor="middle" font-weight="700">Was gleich gebraucht wird,</text>
<text x="200" y="414" font-size="15" text-anchor="middle" font-weight="700">kommt in den Cache</text>
<!-- Feld 4 -->
<rect x="50" y="468" width="76" height="60" rx="6" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<text x="88" y="503" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6b4f">CPU</text>
<line x1="130" y1="498" x2="230" y2="498" stroke="#E07B00" stroke-width="4" marker-end="url(#o)"/>
<text x="180" y="488" font-size="13" text-anchor="middle" font-weight="700" fill="#E07B00">Ergebnis</text>
<rect x="236" y="480" width="136" height="34" rx="3" fill="#4f8a6a"/>
<line x1="240" y1="518" x2="368" y2="518" stroke="#d4a72c" stroke-width="6" stroke-dasharray="3 2"/>
<text x="304" y="502" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">RAM</text>
<text x="200" y="546" font-size="15" text-anchor="middle" font-weight="700">Ergebnis zurück in den RAM</text>
<line x1="24" y1="558" x2="376" y2="558" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
<!-- Speichern -->
<rect x="28" y="570" width="34" height="34" rx="3" fill="#3a6ed8"/>
<rect x="36" y="570" width="18" height="11" fill="#fff"/>
<rect x="34" y="588" width="22" height="14" fill="#dfe7f8"/>
<text x="72" y="584" font-size="14" font-weight="700">Speichern =</text>
<text x="72" y="602" font-size="14" font-weight="700">dauerhaft ablegen</text>
<line x1="212" y1="588" x2="270" y2="588" stroke="#E07B00" stroke-width="4" marker-end="url(#o)"/>
<rect x="276" y="568" width="96" height="40" rx="5" fill="#9e9a95"/>
<text x="324" y="593" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">Festplatte/SSD</text>
</svg>
