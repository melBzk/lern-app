<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 400 465" font-family="system-ui, sans-serif">
  <title>Blick in eine alte mechanische Maus. In der Mitte die Gummikugel, sie rollt auf dem Tisch. An der Kugel liegen zwei Wellen an: eine für vor und zurück, eine für links und rechts. An jeder Welle sitzt ein Rädchen mit Schlitzen. Die Schlitze unterbrechen eine Lichtschranke, daraus entsteht das elektrische Signal. Braune Schmutzpunkte an Kugel und Rädchen: Die Teile verschmutzen leicht.</title>
  <defs>
    <g id="rad">
      <circle r="26" fill="#9db7e8" stroke="#3a6ed8" stroke-width="2"/>
      <g fill="#fff">
        <rect x="-2.5" y="-23" width="5" height="9"/>
        <rect x="-2.5" y="-23" width="5" height="9" transform="rotate(45)"/>
        <rect x="-2.5" y="-23" width="5" height="9" transform="rotate(90)"/>
        <rect x="-2.5" y="-23" width="5" height="9" transform="rotate(135)"/>
        <rect x="-2.5" y="-23" width="5" height="9" transform="rotate(180)"/>
        <rect x="-2.5" y="-23" width="5" height="9" transform="rotate(225)"/>
        <rect x="-2.5" y="-23" width="5" height="9" transform="rotate(270)"/>
        <rect x="-2.5" y="-23" width="5" height="9" transform="rotate(315)"/>
      </g>
      <circle r="5" fill="#3a6ed8"/>
    </g>
  </defs>
  <rect y="50" width="400" height="465" fill="#fff"/>
  <text x="200" y="74" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Blick in die alte Kugelmaus</text>

  <!-- Gehäuse -->
  <line x1="200" y1="134" x2="200" y2="84" stroke="#555" stroke-width="4"/>
  <text x="208" y="118" font-size="13" fill="#555">Kabel</text>
  <path d="M200,134 C330,134 376,170 376,290 C376,430 310,500 200,500 C90,500 24,430 24,290 C24,170 70,134 200,134 Z" fill="#f3f4f6" stroke="#555" stroke-width="2.5"/>

  <!-- Welle vor/zurück (waagerecht, liegt oben an der Kugel) -->
  <rect x="130" y="200" width="168" height="8" rx="3" fill="#3a6ed8"/>
  <use href="#rad" x="300" y="204"/>
  <!-- Lichtschranke oben -->
  <rect x="314" y="164" width="18" height="12" rx="2" fill="#3a3f4a"/>
  <rect x="314" y="232" width="18" height="12" rx="2" fill="#3a3f4a"/>
  <line x1="323" y1="176" x2="323" y2="232" stroke="#f2b705" stroke-width="4" stroke-dasharray="5 3"/>

  <!-- Welle links/rechts (senkrecht, liegt links an der Kugel) -->
  <rect x="136" y="224" width="8" height="164" rx="3" fill="#3a6ed8"/>
  <use href="#rad" x="140" y="400"/>
  <!-- Lichtschranke unten -->
  <rect x="100" y="410" width="12" height="18" rx="2" fill="#3a3f4a"/>
  <rect x="168" y="410" width="12" height="18" rx="2" fill="#3a3f4a"/>
  <line x1="112" y1="419" x2="168" y2="419" stroke="#f2b705" stroke-width="4" stroke-dasharray="5 3"/>

  <!-- Kugel -->
  <circle cx="204" cy="266" r="58" fill="#6b6f78" stroke="#3a3f4a" stroke-width="2"/>
  <ellipse cx="184" cy="244" rx="16" ry="10" fill="#8d919a"/>
  <text x="204" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Gummi-</text>
  <text x="204" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">kugel</text>

  <!-- Schmutz -->
  <g fill="#8b5a2b">
    <circle cx="232" cy="300" r="4"/><circle cx="244" cy="290" r="3"/><circle cx="222" cy="312" r="3"/><circle cx="170" cy="300" r="3"/>
    <circle cx="288" cy="190" r="3.5"/><circle cx="310" cy="216" r="3"/><circle cx="130" cy="412" r="3"/>
  </g>

  <!-- Beschriftungen -->
  <text x="204" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4fb8">Welle: vor/zurück</text>
  <text x="126" y="300" text-anchor="end" font-size="14" font-weight="700" fill="#1d4fb8">Welle:</text>
  <text x="126" y="317" text-anchor="end" font-size="14" font-weight="700" fill="#1d4fb8">links/rechts</text>
  <text x="304" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Rädchen mit</text>
  <text x="304" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#222">Schlitzen</text>
  <text x="270" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#8b5a2b">verschmutzt</text>
  <text x="270" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#8b5a2b">leicht!</text>
  <text x="194" y="410" font-size="14" font-weight="700" fill="#9a6b00">Lichtschranke</text>
  <text x="194" y="428" font-size="13" fill="#222">→ elektrisches</text>
  <text x="194" y="444" font-size="13" fill="#222">Signal</text>
</svg>
