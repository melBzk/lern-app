<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="system-ui, sans-serif">
  <title>Vergleich mit einer Hauswand: Viele gleiche Steckdosen stehen für USB, es passt fast überall (Lampe, Radio, Handy-Ladegerät). Daneben zwei Spezialdosen mit Spinnweben: FireWire nur für Kamera und Video, eSATA nur für externe Festplatten. Hinweis: Der Vergleich hinkt, denn USB überträgt Daten und etwas Strom, eSATA liefert keinen Strom.</title>
  <defs>
    <g id="dose">
      <rect x="-22" y="-22" width="44" height="44" rx="7" fill="#fff" stroke="#555" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#f4f1ee" stroke="#888"/>
      <circle cx="-6" cy="0" r="2.6" fill="#333"/><circle cx="6" cy="0" r="2.6" fill="#333"/>
    </g>
    <g id="netz" fill="none" stroke="#aaa" stroke-width="1">
      <path d="M0,0 L18,0 M0,0 L0,18 M0,0 L14,14"/>
      <path d="M6,0 Q5,5 0,6 M12,0 Q10,10 0,12 M17,0 Q15,15 0,17"/>
    </g>
  </defs>
  <rect width="400" height="430" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">USB = die Allzweck-Steckdose</text>

  <!-- Wand -->
  <rect x="10" y="44" width="380" height="270" rx="10" fill="#f6efe4"/>
  <line x1="262" y1="54" x2="262" y2="304" stroke="#c9b9a0" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- USB-Seite -->
  <text x="136" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">USB – passt fast überall</text>
  <use href="#dose" x="56" y="112"/>
  <use href="#dose" x="136" y="112"/>
  <use href="#dose" x="216" y="112"/>
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M56,134 V176"/>
    <path d="M136,134 V184"/>
    <path d="M216,134 V196"/>
  </g>
  <!-- Lampe -->
  <path d="M38,214 L46,180 H66 L74,214 Z" fill="#f5d76e" stroke="#555" stroke-width="2"/>
  <rect x="53" y="214" width="6" height="34" fill="#555"/>
  <rect x="40" y="248" width="32" height="6" rx="2" fill="#555"/>
  <text x="56" y="276" text-anchor="middle" font-size="13" fill="#222">Lampe</text>
  <!-- Radio -->
  <rect x="108" y="196" width="56" height="44" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
  <circle cx="124" cy="218" r="10" fill="#ddd" stroke="#555"/>
  <rect x="140" y="208" width="18" height="5" fill="#555"/><rect x="140" y="220" width="18" height="5" fill="#555"/>
  <line x1="152" y1="196" x2="162" y2="184" stroke="#555" stroke-width="2"/>
  <text x="136" y="276" text-anchor="middle" font-size="13" fill="#222">Radio</text>
  <!-- Ladegerät + Handy -->
  <rect x="206" y="196" width="20" height="16" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
  <path d="M216,212 C216,232 226,236 232,236" fill="none" stroke="#555" stroke-width="2"/>
  <rect x="226" y="214" width="20" height="36" rx="4" fill="#333"/>
  <rect x="229" y="219" width="14" height="24" fill="#9cc0ef"/>
  <text x="216" y="276" text-anchor="middle" font-size="13" fill="#222">Handy laden</text>

  <!-- Spezialdosen -->
  <!-- FireWire -->
  <rect x="276" y="90" width="44" height="44" rx="7" fill="#fff" stroke="#555" stroke-width="2"/>
  <path d="M286,106 H304 A6,6 0 0 1 304,118 H286 Z" fill="#555"/>
  <use href="#netz" x="276" y="90"/>
  <rect x="334" y="100" width="40" height="26" rx="4" fill="#555"/>
  <circle cx="348" cy="113" r="8" fill="#ddd" stroke="#333"/>
  <rect x="362" y="94" width="10" height="6" fill="#555"/>
  <text x="276" y="154" font-size="14" font-weight="700" fill="#222">FireWire</text>
  <text x="276" y="171" font-size="13" fill="#222">nur Kamera / Video</text>
  <!-- eSATA -->
  <rect x="276" y="196" width="44" height="44" rx="7" fill="#fff" stroke="#555" stroke-width="2"/>
  <path d="M284,214 H312 V220 H309 V223 H287 V220 H284 Z" fill="#555"/>
  <use href="#netz" x="276" y="196"/>
  <rect x="334" y="204" width="38" height="28" rx="4" fill="#ddd" stroke="#555" stroke-width="2"/>
  <circle cx="353" cy="218" r="8" fill="#fff" stroke="#555"/>
  <circle cx="353" cy="218" r="2" fill="#555"/>
  <text x="276" y="260" font-size="14" font-weight="700" fill="#222">eSATA</text>
  <text x="276" y="277" font-size="13" fill="#222">nur externe</text>
  <text x="276" y="293" font-size="13" fill="#222">Festplatten</text>

  <!-- Hinweis -->
  <rect x="10" y="330" width="380" height="84" rx="10" fill="#fff3cd" stroke="#e0a800" stroke-width="2"/>
  <text x="24" y="354" font-size="14" font-weight="700" fill="#222">Wo der Vergleich hinkt:</text>
  <text x="24" y="377" font-size="14" fill="#222">USB überträgt Daten <tspan font-weight="700">UND</tspan> etwas Strom.</text>
  <text x="24" y="399" font-size="14" fill="#222">eSATA liefert <tspan font-weight="700" fill="#D4607A">keinen</tspan> Strom.</text>
</svg>
