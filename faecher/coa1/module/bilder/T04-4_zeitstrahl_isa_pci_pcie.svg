<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zeitstrahl von links nach rechts mit drei Steckkarten: ISA und EISA, die Vorgänger (grau, mit Grabstein); PCI, Anfang der 1990er von Intel vorgestellt (grau, Schild nur noch Altbestand); PCI Express, heute Standard (blau, mit Stern). Darunter das Tempo: ISA/EISA bis 33 MB/s, PCI 133 MB/s, PCI Express ab 250 MB/s. Pfeile dazwischen: abgelöst durch.</title>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Von ISA über PCI zu PCI Express</text>

<!-- 1 ISA -->
<path d="M48,112 L48,74 A22,22 0 0 1 92,74 L92,112 Z" fill="#cfd4da" stroke="#777" stroke-width="2"/>
<line x1="36" y1="112" x2="104" y2="112" stroke="#777" stroke-width="2"/>
<rect x="16" y="126" width="108" height="54" rx="3" fill="#eceff1" stroke="#9aa5b1" stroke-width="2"/>
<rect x="26" y="180" width="88" height="9" fill="#bbb"/>
<text x="70" y="160" text-anchor="middle" font-weight="700" fill="#666">ISA</text>
<text x="70" y="218" text-anchor="middle" font-size="15" font-weight="700">ISA / EISA</text>
<text x="70" y="238" text-anchor="middle" font-size="13">die Vorgänger</text>

<!-- 2 PCI -->
<rect x="146" y="56" width="108" height="44" rx="6" fill="#fff3e0" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="75" text-anchor="middle" font-size="13" font-weight="700">nur noch</text>
<text x="200" y="92" text-anchor="middle" font-size="13" font-weight="700">Altbestand</text>
<line x1="200" y1="100" x2="200" y2="126" stroke="#E07B00" stroke-width="2"/>
<rect x="146" y="126" width="108" height="54" rx="3" fill="#eceff1" stroke="#9aa5b1" stroke-width="2"/>
<rect x="156" y="180" width="50" height="9" fill="#bbb"/><rect x="214" y="180" width="30" height="9" fill="#bbb"/>
<text x="200" y="160" text-anchor="middle" font-weight="700" fill="#666">PCI</text>
<text x="200" y="218" text-anchor="middle" font-size="15" font-weight="700">PCI</text>
<text x="200" y="238" text-anchor="middle" font-size="13">Anfang der 1990er,</text>
<text x="200" y="256" text-anchor="middle" font-size="13">von Intel</text>

<!-- 3 PCIe -->
<path d="M330,58 L338,78 L360,79 L343,92 L349,113 L330,101 L311,113 L317,92 L300,79 L322,78 Z" fill="#3a6ed8"/>
<rect x="276" y="126" width="108" height="54" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<rect x="286" y="180" width="18" height="9" fill="#d4a017"/><rect x="310" y="180" width="64" height="9" fill="#d4a017"/>
<text x="330" y="160" text-anchor="middle" font-weight="700" fill="#3a6ed8">PCIe</text>
<text x="330" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">PCI Express</text>
<text x="330" y="238" text-anchor="middle" font-size="13">heute Standard</text>

<!-- Tempo -->
<g font-size="13" font-weight="700" text-anchor="middle" fill="#b85f00"><text x="70" y="276">bis 33 MB/s</text><text x="200" y="276">133 MB/s</text><text x="330" y="276">ab 250 MB/s</text></g>
<!-- Zeitstrahl -->
<line x1="30" y1="296" x2="370" y2="296" stroke="#bbb" stroke-width="3"/>
<circle cx="70" cy="296" r="8" fill="#9aa5b1"/><circle cx="200" cy="296" r="8" fill="#9aa5b1"/><circle cx="330" cy="296" r="8" fill="#3a6ed8"/>
<line x1="84" y1="296" x2="176" y2="296" stroke="#555" stroke-width="3.5"/><path d="M174,289 L188,296 L174,303 Z" fill="#555"/>
<line x1="214" y1="296" x2="306" y2="296" stroke="#555" stroke-width="3.5"/><path d="M304,289 L318,296 L304,303 Z" fill="#555"/>
<g font-size="13" text-anchor="middle"><text x="135" y="326">abgelöst</text><text x="135" y="344">durch</text><text x="265" y="326">abgelöst</text><text x="265" y="344">durch</text></g>
</svg>
