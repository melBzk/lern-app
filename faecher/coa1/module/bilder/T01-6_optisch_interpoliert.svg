<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="system-ui, sans-serif">
  <title>Optische und interpolierte Auflösung. Oben optisch: fünf Punkte hell, hell, dunkel, dunkel, hell, wirklich gemessen. Unten interpoliert: dieselben fünf Punkte, dazwischen je ein blasser geratener Punkt mit Fragezeichen, berechnet als Mittelwert der beiden Nachbarn. Fazit: mehr Punkte, aber nicht mehr Details.</title>
  <rect width="400" height="370" fill="#fff"/>
  <!-- optisch -->
  <rect x="8" y="8" width="384" height="140" rx="12" fill="#eaf6ee" stroke="#1f9d55"/>
  <text x="22" y="34" font-size="17" font-weight="700" fill="#1c6b3c">optisch</text>
  <text x="104" y="34" font-size="14" fill="#1c6b3c">= wirklich gemessen</text>
  <circle cx="50" cy="90" r="16" fill="#e6e6e6" stroke="#333" stroke-width="2"/><circle cx="110" cy="90" r="16" fill="#e6e6e6" stroke="#333" stroke-width="2"/><circle cx="170" cy="90" r="16" fill="#333" stroke="#333" stroke-width="2"/><circle cx="230" cy="90" r="16" fill="#333" stroke="#333" stroke-width="2"/><circle cx="290" cy="90" r="16" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
  <circle cx="350" cy="84" r="22" fill="#fff" stroke="#333" stroke-width="4"/>
  <line x1="366" y1="100" x2="384" y2="120" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <text x="200" y="134" text-anchor="middle" font-size="13" fill="#222">5 echte Punkte</text>
  <!-- interpoliert -->
  <rect x="8" y="160" width="384" height="140" rx="12" fill="#fff4e5" stroke="#E07B00"/>
  <text x="22" y="186" font-size="17" font-weight="700" fill="#b35f00">interpoliert</text>
  <circle cx="50" cy="232" r="16" fill="#e6e6e6" stroke="#333" stroke-width="2"/><circle cx="110" cy="232" r="16" fill="#e6e6e6" stroke="#333" stroke-width="2"/><circle cx="170" cy="232" r="16" fill="#333" stroke="#333" stroke-width="2"/><circle cx="230" cy="232" r="16" fill="#333" stroke="#333" stroke-width="2"/><circle cx="290" cy="232" r="16" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="232" r="11" fill="#e6e6e6" fill-opacity="0.55" stroke="#E07B00" stroke-width="2" stroke-dasharray="3 2"/><text x="80" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">?</text><circle cx="140" cy="232" r="11" fill="#8c8c8c" fill-opacity="0.55" stroke="#E07B00" stroke-width="2" stroke-dasharray="3 2"/><text x="140" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">?</text><circle cx="200" cy="232" r="11" fill="#333" fill-opacity="0.55" stroke="#E07B00" stroke-width="2" stroke-dasharray="3 2"/><text x="200" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">?</text><circle cx="260" cy="232" r="11" fill="#8c8c8c" fill-opacity="0.55" stroke="#E07B00" stroke-width="2" stroke-dasharray="3 2"/><text x="260" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">?</text>
  <text x="200" y="272" text-anchor="middle" font-size="13" fill="#222">geraten = Mittelwert der Nachbarn</text>
  <text x="200" y="289" text-anchor="middle" font-size="13" fill="#222">5 echte + 4 geratene Punkte</text>
  <!-- Schild -->
  <rect x="30" y="314" width="340" height="44" rx="8" fill="#fdecec" stroke="#d63c3c" stroke-width="2"/>
  <text x="200" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#a32020">mehr Punkte – aber nicht mehr Details</text>
</svg>
