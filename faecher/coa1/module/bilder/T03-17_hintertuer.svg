<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die Kehrseite von AMT: ein Haus von hinten mit einer kleinen Hintertür, beschriftet AMT-Zugang. Links ein Hausmeister mit Schlüssel: IT-Abteilung, praktisch. Rechts eine dunkle Einbrecher-Figur mit Dietrich: Angreifer, auch interessant. Oben ein Warnschild: BSI-Warnung, Sicherheitslücke.</title>
<rect width="400" height="480" fill="#fff"/>

<!-- Warnschild -->
<path d="M44,24 L76,80 L12,80 Z" fill="#f2c200" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<text x="44" y="74" text-anchor="middle" font-size="26" font-weight="700">!</text>
<text x="88" y="48" font-size="16" font-weight="700" fill="#c62828">BSI-Warnung:</text>
<text x="88" y="70" font-size="16" font-weight="700">Sicherheitslücke in vPro</text>

<!-- Haus -->
<path d="M90,180 L200,110 L310,180 Z" fill="#8d6e63" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="104" y="180" width="192" height="130" fill="#eceff1" stroke="#555" stroke-width="2.5"/>
<rect x="124" y="200" width="40" height="34" fill="#e3f2fd" stroke="#555" stroke-width="2"/>
<rect x="236" y="200" width="40" height="34" fill="#e3f2fd" stroke="#555" stroke-width="2"/>
<rect x="184" y="262" width="32" height="48" rx="2" fill="#c62828" stroke="#555" stroke-width="2"/>
<circle cx="209" cy="288" r="2.5" fill="#fff"/>
<line x1="216" y1="282" x2="236" y2="262" stroke="#555" stroke-width="1.5"/>
<text x="240" y="256" font-size="15" font-weight="700" fill="#c62828">AMT-Zugang</text>
<text x="200" y="330" text-anchor="middle" font-size="13" fill="#444">Hintertür</text>

<!-- Hausmeister -->
<circle cx="70" cy="356" r="16" fill="#ffe0b2" stroke="#555" stroke-width="2"/>
<path d="M52,348 L88,348 L84,338 L56,338 Z" fill="#3a6ed8"/>
<rect x="50" y="374" width="40" height="52" rx="12" fill="#3a6ed8"/>
<line x1="90" y1="388" x2="110" y2="378" stroke="#3a6ed8" stroke-width="8" stroke-linecap="round"/>
<circle cx="118" cy="374" r="7" fill="none" stroke="#c49000" stroke-width="3.5"/>
<path d="M124,370 L138,362 M134,364 L137,369 M130,366 L133,371" stroke="#c49000" stroke-width="3.5" stroke-linecap="round"/>
<text x="70" y="450" text-anchor="middle" font-weight="700" fill="#2e7d32">IT-Abteilung:</text>
<text x="70" y="468" text-anchor="middle" font-weight="700" fill="#2e7d32">praktisch</text>

<!-- Einbrecher -->
<circle cx="330" cy="356" r="16" fill="#333"/>
<rect x="314" y="350" width="32" height="8" fill="#111"/>
<circle cx="323" cy="354" r="2" fill="#fff"/><circle cx="337" cy="354" r="2" fill="#fff"/>
<rect x="310" y="374" width="40" height="52" rx="12" fill="#333"/>
<line x1="310" y1="388" x2="290" y2="378" stroke="#333" stroke-width="8" stroke-linecap="round"/>
<path d="M288,378 L262,368 L258,372" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
<text x="330" y="450" text-anchor="middle" font-weight="700" fill="#c62828">Angreifer:</text>
<text x="330" y="468" text-anchor="middle" font-weight="700" fill="#c62828">auch interessant</text>
</svg>
