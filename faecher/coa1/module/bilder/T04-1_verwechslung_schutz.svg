<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Was schützt wen wovor? Oben, schützt DICH: Netzstecker ziehen, gegen lebensgefährliche Spannung am Netzteil, Blitz durchgestrichen. Unten, schützt die BAUTEILE: Erdungsarmband und Matte gegen Funken aus dem Körper, ESD. Antistatische Tüte beim Lagern und Tragen gegen ESD. Druckluft statt Staubsauger gegen statische Aufladung. Jeweils Funke durchgestrichen. Handschuhe schützen die Kontakte vor Fett und Schweiß, aber nicht vor ESD; Fetttropfen durchgestrichen.</title>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">Was schützt wen wovor?</text>

<!-- DICH -->
<rect x="10" y="44" width="380" height="124" rx="10" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<path d="M34,52 L50,58 L50,72 Q50,84 34,90 Q18,84 18,72 L18,58 Z" fill="#3a6ed8"/>
<text x="62" y="78" font-size="17" font-weight="700" fill="#3a6ed8">schützt DICH</text>
<g transform="translate(0,96)">
<g stroke="#555" stroke-width="4"><line x1="26" y1="16" x2="36" y2="16"/><line x1="26" y1="32" x2="36" y2="32"/></g>
<rect x="36" y="8" width="22" height="32" rx="4" fill="#555"/>
<path d="M58,24 C70,24 66,46 80,46" fill="none" stroke="#555" stroke-width="3"/>
<text x="96" y="22" font-size="15" font-weight="700">Netzstecker ziehen</text>
<text x="96" y="44" font-size="14">gegen Spannung am Netzteil</text>
<path d="M352,0 L336,26 L346,26 L334,52 L362,20 L351,20 L362,0 Z" fill="#E07B00"/>
<line x1="326" y1="54" x2="370" y2="-2" stroke="#c62828" stroke-width="4.5" stroke-linecap="round"/>
</g>

<!-- BAUTEILE -->
<rect x="10" y="180" width="380" height="370" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
<path d="M34,188 L50,194 L50,208 Q50,220 34,226 Q18,220 18,208 L18,194 Z" fill="#2e7d32"/>
<text x="62" y="214" font-size="17" font-weight="700" fill="#2e7d32">schützt die BAUTEILE</text>

<!-- Armband -->
<g transform="translate(0,238)">
<ellipse cx="44" cy="24" rx="20" ry="13" fill="none" stroke="#3a6ed8" stroke-width="6"/>
<path d="M64,26 C76,30 76,46 86,46" fill="none" stroke="#E07B00" stroke-width="3"/>
<text x="96" y="20" font-size="15" font-weight="700">Erdungsarmband, Matte</text>
<text x="96" y="42" font-size="14">gegen Funken (ESD)</text>
<path d="M352,6 L340,24 L348,24 L338,44 L362,18 L353,18 L362,6 Z" fill="#E07B00"/>
<line x1="330" y1="48" x2="372" y2="2" stroke="#c62828" stroke-width="4.5" stroke-linecap="round"/>
</g>

<!-- Tüte -->
<g transform="translate(0,312)">
<rect x="24" y="2" width="42" height="46" rx="2" fill="#d7dde3" stroke="#555" stroke-width="2"/>
<line x1="24" y1="10" x2="66" y2="10" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="34" y="20" width="22" height="18" rx="2" fill="#555"/>
<text x="96" y="20" font-size="15" font-weight="700">Antistatische Tüte</text>
<text x="96" y="42" font-size="14">beim Lagern, Tragen (ESD)</text>
<path d="M352,6 L340,24 L348,24 L338,44 L362,18 L353,18 L362,6 Z" fill="#E07B00"/>
<line x1="330" y1="48" x2="372" y2="2" stroke="#c62828" stroke-width="4.5" stroke-linecap="round"/>
</g>

<!-- Druckluft -->
<g transform="translate(0,386)">
<rect x="36" y="0" width="12" height="8" fill="#555"/>
<rect x="30" y="8" width="24" height="40" rx="4" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<line x1="46" y1="4" x2="64" y2="4" stroke="#555" stroke-width="2.5"/>
<circle cx="72" cy="6" r="4" fill="none" stroke="#3a6ed8" stroke-width="2"/>
<text x="96" y="20" font-size="15" font-weight="700">Druckluft statt Staubsauger</text>
<text x="96" y="42" font-size="14">gegen statische Aufladung</text>
<path d="M352,6 L340,24 L348,24 L338,44 L362,18 L353,18 L362,6 Z" fill="#E07B00"/>
<line x1="330" y1="48" x2="372" y2="2" stroke="#c62828" stroke-width="4.5" stroke-linecap="round"/>
</g>

<line x1="24" y1="448" x2="376" y2="448" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5 4"/>

<!-- Handschuhe -->
<g transform="translate(0,460)">
<path d="M30,48 L30,22 L30,8 Q30,4 34,4 Q38,4 38,8 L38,20 L38,4 Q38,0 42,0 Q46,0 46,4 L46,20 L46,6 Q46,2 50,2 Q54,2 54,6 L54,22 L54,12 Q54,8 58,8 Q62,8 62,12 L62,36 Q62,48 52,52 L36,52 Q30,52 30,48 Z" fill="#e3f2fd" stroke="#3a6ed8" stroke-width="2"/>
<path d="M30,30 Q22,26 20,32 Q22,40 30,42" fill="#e3f2fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="96" y="16" font-size="15" font-weight="700">Handschuhe: Kontakte</text>
<text x="96" y="38" font-size="14">gegen Fett und Schweiß</text>
<text x="96" y="62" font-size="14" font-weight="700" fill="#c62828">nicht gegen ESD!</text>
<path d="M350,4 Q364,26 364,34 Q364,48 350,48 Q336,48 336,34 Q336,26 350,4 Z" fill="#d4a017"/>
<line x1="330" y1="50" x2="372" y2="2" stroke="#c62828" stroke-width="4.5" stroke-linecap="round"/>
</g>
</svg>
