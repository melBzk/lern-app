<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 545" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Comic in drei Feldern: 1 die CPU rechnet und baut das Bild auf; 2 ein Klick auf das rote X oder Alt plus F4: das Gerät meldet sich sofort von selbst, das Signal läuft über den Chipsatz (ICH) zur CPU; 3 die CPU unterbricht kurz, erledigt die Eingabe und rechnet danach weiter. Das Fenster schließt sich erst als Folge des Befehls.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
<rect width="400" height="545" fill="#fff"/>
<text x="200.0" y="26" font-size="17" text-anchor="middle" font-weight="700" >Interrupt – „Halt, ich will was!“</text>
<rect x="8" y="40" width="384" height="160" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="28" cy="60" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="28" y="65" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >1</text>
<rect x="8" y="208" width="384" height="160" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="28" cy="228" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="28" y="233" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >2</text>
<rect x="8" y="376" width="384" height="160" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="28" cy="396" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="28" y="401" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >3</text>
<!-- Feld 1: CPU rechnet -->
<rect x="40" y="86" width="60" height="60" rx="4" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2" />
<line x1="52" y1="80" x2="52" y2="86" stroke="#2f6b4f" stroke-width="2" />
<line x1="64" y1="80" x2="64" y2="86" stroke="#2f6b4f" stroke-width="2" />
<line x1="76" y1="80" x2="76" y2="86" stroke="#2f6b4f" stroke-width="2" />
<line x1="88" y1="80" x2="88" y2="86" stroke="#2f6b4f" stroke-width="2" />
<line x1="52" y1="146" x2="52" y2="152" stroke="#2f6b4f" stroke-width="2" />
<line x1="64" y1="146" x2="64" y2="152" stroke="#2f6b4f" stroke-width="2" />
<line x1="76" y1="146" x2="76" y2="152" stroke="#2f6b4f" stroke-width="2" />
<line x1="88" y1="146" x2="88" y2="152" stroke="#2f6b4f" stroke-width="2" />
<circle cx="60" cy="110" r="4" fill="#222" />
<circle cx="80" cy="110" r="4" fill="#222" />
<path d="M56,100 l9,4 M84,100 l-9,4" fill="none" stroke="#222" stroke-width="2" />
<line x1="62" y1="130" x2="78" y2="130" stroke="#222" stroke-width="2.5" />
<path d="M140,70 h236 a8,8 0 0 1 8,8 v62 a8,8 0 0 1 -8,8 h-216 l-20,14 l4,-14 a8,8 0 0 1 -8,-8 v-62 a8,8 0 0 1 8,-8 Z" fill="#f4f1ee" stroke="#222" stroke-width="1.5" />
<text x="260" y="102" font-size="14" text-anchor="middle" font-weight="700" >rechnen … Bild aufbauen …</text>
<text x="260" y="124" font-size="14" text-anchor="middle" font-weight="700" >rechnen …</text>
<text x="76" y="178" font-size="14" text-anchor="middle" font-weight="700" >CPU</text>
<!-- Feld 2: Eingabe meldet sich über den Chipsatz -->
<rect x="40" y="240" width="110" height="70" rx="4" fill="#fff" stroke="#222" stroke-width="2" />
<rect x="40" y="240" width="110" height="20" rx="4" fill="#dde3ec" stroke="#222" stroke-width="2" />
<rect x="128" y="242" width="20" height="16" rx="2" fill="#c62828" />
<text x="138" y="255" font-size="13" text-anchor="middle" font-weight="700" fill="#fff" >✕</text>
<text x="48" y="255" font-size="13" font-weight="700" >Programm</text>
<path d="M136,252 l0,20 l5,-5 l5,9 l4,-2 l-5,-9 l7,0 Z" fill="#fff" stroke="#222" stroke-width="1.5" />
<text x="95" y="326" font-size="13" text-anchor="middle" fill="#555" >oder</text>
<rect x="46" y="332" width="36" height="22" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" />
<text x="64" y="348" font-size="13" text-anchor="middle" font-weight="700" >Alt</text>
<text x="94" y="348" font-size="14" text-anchor="middle" font-weight="700" >+</text>
<rect x="106" y="332" width="36" height="22" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" />
<text x="124" y="348" font-size="13" text-anchor="middle" font-weight="700" >F4</text>
<rect x="196" y="256" width="74" height="44" rx="4" fill="#f4f1ee" stroke="#888" stroke-width="2" />
<text x="233" y="275" font-size="13" text-anchor="middle" font-weight="700" >Chipsatz</text>
<text x="233" y="292" font-size="13" text-anchor="middle" fill="#555" >(ICH)</text>
<line x1="154" y1="278" x2="192" y2="278" stroke="#E07B00" stroke-width="4" marker-end="url(#o)" />
<line x1="272" y1="278" x2="312" y2="278" stroke="#E07B00" stroke-width="4" marker-end="url(#o)" />
<rect x="318" y="248" width="60" height="60" rx="4" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2" />
<text x="348" y="284" font-size="14" text-anchor="middle" font-weight="700" >CPU</text>
<text x="262" y="330" font-size="15" text-anchor="middle" font-weight="700" fill="#E07B00" >Interrupt:</text>
<text x="262" y="350" font-size="13" text-anchor="middle" fill="#222" >Gerät meldet sich sofort</text>
<!-- Feld 3: unterbrechen, erledigen, weiterrechnen -->
<rect x="40" y="420" width="60" height="60" rx="4" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2" />
<line x1="52" y1="414" x2="52" y2="420" stroke="#2f6b4f" stroke-width="2" />
<line x1="64" y1="414" x2="64" y2="420" stroke="#2f6b4f" stroke-width="2" />
<line x1="76" y1="414" x2="76" y2="420" stroke="#2f6b4f" stroke-width="2" />
<line x1="88" y1="414" x2="88" y2="420" stroke="#2f6b4f" stroke-width="2" />
<line x1="52" y1="480" x2="52" y2="486" stroke="#2f6b4f" stroke-width="2" />
<line x1="64" y1="480" x2="64" y2="486" stroke="#2f6b4f" stroke-width="2" />
<line x1="76" y1="480" x2="76" y2="486" stroke="#2f6b4f" stroke-width="2" />
<line x1="88" y1="480" x2="88" y2="486" stroke="#2f6b4f" stroke-width="2" />
<circle cx="60" cy="444" r="4" fill="#222" />
<circle cx="80" cy="444" r="4" fill="#222" />
<circle cx="70" cy="464" r="6" fill="#fff" stroke="#222" stroke-width="2.5" />
<text x="70" y="506" font-size="13" text-anchor="middle" fill="#555" >CPU</text>
<rect x="124" y="388" width="200" height="26" rx="6" fill="#fdf0e0" stroke="#E07B00" stroke-width="1.5" />
<text x="224" y="406" font-size="14" text-anchor="middle" font-weight="700" >1. kurz unterbrechen</text>
<rect x="124" y="420" width="200" height="26" rx="6" fill="#fdf0e0" stroke="#E07B00" stroke-width="1.5" />
<text x="224" y="438" font-size="14" text-anchor="middle" font-weight="700" >2. Eingabe erledigen</text>
<rect x="124" y="452" width="200" height="26" rx="6" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="1.5" />
<text x="224" y="470" font-size="14" text-anchor="middle" font-weight="700" >3. weiterrechnen</text>
<text x="224" y="500" font-size="13" text-anchor="middle" fill="#222" >Fenster zu = erst die Folge des Befehls</text>
<text x="224" y="522" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828" >Unterbrechen ≠ beenden</text>
</svg>
