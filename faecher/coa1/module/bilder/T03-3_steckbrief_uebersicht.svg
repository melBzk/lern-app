<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Prozessor-Steckbrief als Ausweiskarte mit acht Merkmalen: 1 Kerne (mehr in T03-4), 2 Takt und Threads (T03-5), 3 Turbo und Energiesparen (T03-5), 4 Cache L1 bis L3 (T03-6), 5 Virtualisierung (T03-9), 6 Architektur und Busbreite, z. B. 64 Bit (hier), 7 Befehlssatzerweiterungen wie SSE, AVX2 (hier), 8 Sicherheitsmechanismen (hier).</title>
<rect width="400" height="500" fill="#fff"/>

<!-- Karte -->
<rect x="10" y="10" width="380" height="478" rx="14" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<path d="M10,56 L10,24 Q10,10 24,10 L376,10 Q390,10 390,24 L390,56 z" fill="#3a6ed8"/>
<rect x="24" y="20" width="26" height="26" rx="3" fill="#fff"/>
<rect x="30" y="26" width="14" height="14" rx="1" fill="#3a6ed8"/>
<text x="62" y="40" font-size="18" font-weight="700" fill="#fff">Prozessor-Steckbrief</text>

<text x="112" y="78" font-size="13" fill="#555">Merkmal</text>
<text x="352" y="78" font-size="13" text-anchor="middle" fill="#555">mehr in</text>

<g stroke="#ccc" stroke-width="1">
<line x1="20" y1="86" x2="380" y2="86"/>
<line x1="20" y1="136" x2="380" y2="136"/>
<line x1="20" y1="186" x2="380" y2="186"/>
<line x1="20" y1="236" x2="380" y2="236"/>
<line x1="20" y1="286" x2="380" y2="286"/>
<line x1="20" y1="336" x2="380" y2="336"/>
<line x1="20" y1="386" x2="380" y2="386"/>
<line x1="20" y1="436" x2="380" y2="436"/>
<line x1="318" y1="86" x2="318" y2="480"/>
</g>

<!-- Nummern -->
<g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="32" cy="111" r="12" fill="#333"/><text x="32" y="116">1</text>
<circle cx="32" cy="161" r="12" fill="#333"/><text x="32" y="166">2</text>
<circle cx="32" cy="211" r="12" fill="#333"/><text x="32" y="216">3</text>
<circle cx="32" cy="261" r="12" fill="#333"/><text x="32" y="266">4</text>
<circle cx="32" cy="311" r="12" fill="#333"/><text x="32" y="316">5</text>
<circle cx="32" cy="361" r="12" fill="#333"/><text x="32" y="366">6</text>
<circle cx="32" cy="411" r="12" fill="#333"/><text x="32" y="416">7</text>
<circle cx="32" cy="461" r="12" fill="#333"/><text x="32" y="466">8</text>
</g>

<!-- 1 Kerne -->
<rect x="60" y="96" width="14" height="14" rx="2" fill="#3a6ed8"/><rect x="77" y="96" width="14" height="14" rx="2" fill="#3a6ed8"/>
<rect x="60" y="113" width="14" height="14" rx="2" fill="#3a6ed8"/><rect x="77" y="113" width="14" height="14" rx="2" fill="#3a6ed8"/>
<text x="112" y="116" font-size="15" font-weight="700">Kerne</text>
<text x="352" y="116" font-size="14" text-anchor="middle">T03-4</text>

<!-- 2 Takt -->
<polyline points="52,169 52,153 62,153 62,169 72,169 72,153 82,153 82,169 92,169 92,153 98,153" fill="none" stroke="#3a6ed8" stroke-width="2.5"/>
<text x="112" y="166" font-size="15" font-weight="700">Takt + Threads</text>
<text x="352" y="166" font-size="14" text-anchor="middle">T03-5</text>

<!-- 3 Turbo + Energiesparen -->
<path d="M55,213 A20,20 0 0 1 95,213" fill="none" stroke="#333" stroke-width="3"/>
<line x1="75" y1="213" x2="86" y2="200" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="60,226 66,217 72,226" fill="#c62828"/>
<polygon points="78,217 90,217 84,226" fill="#2f9e44"/>
<text x="112" y="216" font-size="15" font-weight="700">Turbo + Energiesparen</text>
<text x="352" y="216" font-size="14" text-anchor="middle">T03-5</text>

<!-- 4 Cache -->
<rect x="57" y="246" width="36" height="9" rx="2" fill="#b7e4c3" stroke="#2f9e44" stroke-width="1.5"/>
<rect x="57" y="257" width="36" height="9" rx="2" fill="#6cc283" stroke="#2f9e44" stroke-width="1.5"/>
<rect x="57" y="268" width="36" height="9" rx="2" fill="#2f9e44" stroke="#2f9e44" stroke-width="1.5"/>
<text x="112" y="266" font-size="15" font-weight="700">Cache L1–L3</text>
<text x="352" y="266" font-size="14" text-anchor="middle">T03-6</text>

<!-- 5 Virtualisierung -->
<rect x="55" y="296" width="40" height="26" rx="2" fill="#fff" stroke="#333" stroke-width="2.5"/>
<rect x="66" y="303" width="20" height="12" fill="#7b3fa0"/>
<line x1="75" y1="322" x2="75" y2="328" stroke="#333" stroke-width="2.5"/>
<line x1="65" y1="329" x2="85" y2="329" stroke="#333" stroke-width="2.5"/>
<text x="112" y="316" font-size="15" font-weight="700">Virtualisierung</text>
<text x="352" y="316" font-size="14" text-anchor="middle">T03-9</text>

<!-- 6 Architektur + Busbreite -->
<rect x="50" y="348" width="50" height="26" rx="2" fill="#555"/>
<text x="75" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">64 Bit</text>
<text x="112" y="366" font-size="15" font-weight="700">Architektur + Busbreite</text>
<text x="352" y="366" font-size="15" text-anchor="middle" font-weight="700" fill="#b35f00">hier</text>

<!-- 7 Befehlssatzerweiterungen -->
<path d="M68,404 L68,398 L82,398 L82,404" fill="none" stroke="#8d6e63" stroke-width="2.5"/>
<rect x="56" y="404" width="38" height="20" rx="3" fill="#8d6e63"/>
<line x1="56" y1="412" x2="94" y2="412" stroke="#5d4037" stroke-width="1.5"/>
<text x="112" y="406" font-size="15" font-weight="700">Befehlssatzerweiterungen</text>
<text x="112" y="425" font-size="13" fill="#555">SSE, AVX2</text>
<text x="352" y="416" font-size="15" text-anchor="middle" font-weight="700" fill="#b35f00">hier</text>

<!-- 8 Sicherheitsmechanismen -->
<path d="M67,458 L67,452 A8,8 0 0 1 83,452 L83,458" fill="none" stroke="#555" stroke-width="3"/>
<rect x="62" y="457" width="26" height="18" rx="3" fill="#555"/>
<circle cx="75" cy="465" r="2.5" fill="#fff"/>
<text x="112" y="466" font-size="15" font-weight="700">Sicherheitsmechanismen</text>
<text x="352" y="466" font-size="15" text-anchor="middle" font-weight="700" fill="#b35f00">hier</text>
</svg>
