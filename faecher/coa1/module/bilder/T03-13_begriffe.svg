<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die acht neuen Wörter mit Symbol: Legacy, veraltete Schnittstellen, lange mitgeschleppt. Ampere und Milliampere: Stromstärke, 1000 mA gleich 1 A. Ader: ein einzelner Draht im Kabel. Typ A und Typ B: A am Computer, B am Gerät, z. B. am Drucker. Host: steuert alle USB-Geräte, meist der PC. USB OTG: zwei Geräte direkt koppeln, z. B. Stick am Handy. Thunderbolt: sehr schnelle Schnittstelle von Intel und Apple. Kette: Geräte hängen hintereinander.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="570" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">8 neue Wörter</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<path d="M26,66.0 h44 l-5,22 h-34 Z" fill="#cfd6de" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="74.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="41" cy="74.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="48" cy="74.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="55" cy="74.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="62" cy="74.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="38" cy="82.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="45" cy="82.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="52" cy="82.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="59" cy="82.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="72" cy="62.0" r="9" fill="#fff" stroke="#555" stroke-width="1.5"/><line x1="72" y1="62.0" x2="72" y2="56.0" stroke="#555" stroke-width="1.5"/><line x1="72" y1="62.0" x2="76" y2="64.0" stroke="#555" stroke-width="1.5"/>
<text x="100" y="66.0" font-size="15" font-weight="700" fill="#1d3f8a">Legacy</text>
<text x="100" y="86.0" font-size="14">veraltete Schnittstellen,</text>
<text x="100" y="104.0" font-size="14">lange „mitgeschleppt“</text>
<line x1="15" y1="110" x2="385" y2="110" stroke="#ddd" stroke-width="1"/>
<circle cx="48" cy="146.0" r="20" fill="#fff" stroke="#555" stroke-width="2"/><text x="48" y="158.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1d3f8a">mA</text><line x1="48" y1="146.0" x2="58" y2="132.0" stroke="#c62828" stroke-width="2.5"/>
<text x="100" y="138.0" font-size="15" font-weight="700" fill="#1d3f8a">Ampere / Milliampere</text>
<text x="100" y="159.0" font-size="14">Stromstärke · 1000 mA = 1 A</text>
<line x1="15" y1="174" x2="385" y2="174" stroke="#ddd" stroke-width="1"/>
<circle cx="48" cy="206.0" r="20" fill="#555" stroke="#333" stroke-width="1.5"/><circle cx="40" cy="199.0" r="5" fill="#c62828" stroke="#999" stroke-width="1"/><circle cx="56" cy="199.0" r="5" fill="#222" stroke="#999" stroke-width="1"/><circle cx="40" cy="213.0" r="5" fill="#2f6b4f" stroke="#999" stroke-width="1"/><circle cx="56" cy="213.0" r="5" fill="#fff" stroke="#999" stroke-width="1"/>
<text x="100" y="202.0" font-size="15" font-weight="700" fill="#1d3f8a">Ader</text>
