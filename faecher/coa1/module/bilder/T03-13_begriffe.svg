<line x1="15" y1="238" x2="385" y2="238" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="252.0" width="30" height="18" rx="2" fill="#cfd6de" stroke="#555" stroke-width="1.8"/><text x="31" y="290.0" font-size="13" text-anchor="middle" font-weight="700">A</text><path d="M54,251.0 h20 v14 l-4,4 h-12 l-4,-4 Z" fill="#cfd6de" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="290.0" font-size="13" text-anchor="middle" font-weight="700">B</text>
<text x="100" y="266.0" font-size="15" font-weight="700" fill="#1d3f8a">Typ A / Typ B</text>
<text x="100" y="287.0" font-size="14">A am Computer, B am Gerät (z. B. Drucker)</text>
<line x1="15" y1="302" x2="385" y2="302" stroke="#ddd" stroke-width="1"/>
<rect x="38" y="310.0" width="20" height="26" rx="2" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><line x1="48" y1="336.0" x2="24" y2="348.0" stroke="#555" stroke-width="2"/><rect x="17" y="348.0" width="14" height="10" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="48" y1="336.0" x2="48" y2="348.0" stroke="#555" stroke-width="2"/><rect x="41" y="348.0" width="14" height="10" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="48" y1="336.0" x2="72" y2="348.0" stroke="#555" stroke-width="2"/><rect x="65" y="348.0" width="14" height="10" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="100" y="330.0" font-size="15" font-weight="700" fill="#1d3f8a">Host</text>
<text x="100" y="351.0" font-size="14">steuert alle USB-Geräte, meist der PC</text>
<line x1="15" y1="366" x2="385" y2="366" stroke="#ddd" stroke-width="1"/>
<rect x="20" y="376.0" width="24" height="42" rx="4" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><rect x="23" y="381.0" width="18" height="30" rx="1" fill="#cfe0fb" stroke="none" stroke-width="0"/><rect x="49.0" y="393.0" width="24.48" height="14" rx="3" fill="#3a6ed8" stroke="#222" stroke-width="1.5"/><rect x="73.48" y="395.8" width="9.520000000000001" height="8.4" rx="1" fill="#ccc" stroke="#555" stroke-width="1.5"/><line x1="44" y1="400.0" x2="49" y2="400.0" stroke="#555" stroke-width="2"/>
<text x="100" y="394.0" font-size="15" font-weight="700" fill="#1d3f8a">USB OTG</text>
<text x="100" y="415.0" font-size="14">zwei Geräte direkt koppeln, Stick am Handy</text>
<line x1="15" y1="430" x2="385" y2="430" stroke="#ddd" stroke-width="1"/>
<path d="M52.8,442.8 l-14.399999999999999,21.599999999999998 h9.6 l-4.8,16.8 l14.399999999999999,-21.599999999999998 h-9.6 Z" fill="#f2c230" stroke="#a07800" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="458.0" font-size="15" font-weight="700" fill="#E07B00">Thunderbolt</text>
<text x="100" y="479.0" font-size="14">sehr schnelle Schnittstelle (Intel, Apple)</text>
<line x1="15" y1="494" x2="385" y2="494" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="517.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="40" y="517.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="34" y1="526.0" x2="40" y2="526.0" stroke="#333" stroke-width="2"/><rect x="64" y="517.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="58" y1="526.0" x2="64" y2="526.0" stroke="#333" stroke-width="2"/>
<text x="100" y="522.0" font-size="15" font-weight="700" fill="#1d3f8a">Kette</text>
<text x="100" y="543.0" font-size="14">Geräte hintereinander, eins am nächsten</text>
<line x1="15" y1="558" x2="385" y2="558" stroke="#ddd" stroke-width="1"/>
</svg>
