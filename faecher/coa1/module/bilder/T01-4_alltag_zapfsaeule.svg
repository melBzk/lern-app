<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif">
  <title>Vergleich Tankstelle und PC. Überschrift: Schnittstelle gleich festgelegter Übergabepunkt. Tankstelle: Der dünne Benzin-Zapfhahn passt in den Tankstutzen eines Benzin-Autos, grüner Haken. Der dicke Diesel-Zapfhahn passt nicht, rotes Kreuz. PC: Der USB-Stecker passt in die rechteckige USB-Buchse, grüner Haken. In die runde PS/2-Buchse passt er nicht, rotes Kreuz.</title>
  <defs>
    <g id="ok"><circle r="14" fill="#1f9d55"/><path d="M-7,0 l5,6 l9,-12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="nein"><circle r="14" fill="#d63c3c"/><path d="M-6,-6 l12,12 M6,-6 l-12,12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
    <g id="stutzen">
      <circle r="20" fill="#e5e7eb" stroke="#555" stroke-width="2"/>
      <circle r="8" fill="#3a3f4a"/>
    </g>
    <g id="usbstecker">
      <rect x="-60" y="-8" width="30" height="16" rx="3" fill="#555"/>
      <rect x="-30" y="-10" width="28" height="20" fill="#cfd3da" stroke="#555" stroke-width="2"/>
      <rect x="-24" y="-5" width="16" height="4" fill="#555"/>
    </g>
  </defs>
  <rect width="400" height="440" fill="#fff"/>
  <rect x="20" y="10" width="360" height="36" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
  <text x="200" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4fb8">Schnittstelle = festgelegter Übergabepunkt</text>

  <!-- Tankstelle -->
  <rect x="8" y="58" width="384" height="176" rx="10" fill="#f6efe4"/>
  <text x="22" y="82" font-size="16" font-weight="700" fill="#222">Tankstelle</text>
  <text x="250" y="82" text-anchor="middle" font-size="13" fill="#555">Tankstutzen (Benzin-Auto)</text>
  <!-- Benzin: dünn -->
  <rect x="30" y="112" width="70" height="26" rx="8" fill="#1f9d55"/>
  <rect x="100" y="121" width="96" height="8" rx="3" fill="#555"/>
  <text x="65" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#16703d">Benzin</text>
  <use href="#stutzen" x="250" y="125"/>
  <path d="M206,125 h18" stroke="#555" stroke-width="2" stroke-dasharray="3 3"/>
  <use href="#ok" x="330" y="125"/>
  <text x="352" y="130" font-size="13" font-weight="700" fill="#16703d">passt</text>
  <!-- Diesel: dick -->
  <rect x="30" y="172" width="70" height="30" rx="8" fill="#3a3f4a"/>
  <rect x="100" y="179" width="96" height="16" rx="4" fill="#555"/>
  <text x="65" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Diesel</text>
  <use href="#stutzen" x="250" y="187"/>
  <path d="M206,187 h18" stroke="#555" stroke-width="2" stroke-dasharray="3 3"/>
  <use href="#nein" x="330" y="187"/>
  <text x="352" y="192" font-size="13" font-weight="700" fill="#a32020">passt</text>
  <text x="352" y="208" font-size="13" font-weight="700" fill="#a32020">nicht</text>

  <!-- PC -->
  <rect x="8" y="246" width="384" height="186" rx="10" fill="#eef4ff"/>
  <text x="22" y="270" font-size="16" font-weight="700" fill="#222">PC</text>
  <text x="250" y="270" text-anchor="middle" font-size="13" fill="#555">Buchsen am PC</text>
  <!-- USB in USB -->
  <use href="#usbstecker" x="200" y="312"/>
  <text x="140" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#222">USB-Stecker</text>
  <rect x="226" y="296" width="48" height="32" rx="4" fill="#3a3f4a"/>
  <rect x="232" y="305" width="36" height="14" fill="#fff"/>
  <rect x="236" y="309" width="28" height="5" fill="#3a3f4a"/>
  <text x="250" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4fb8">USB</text>
  <use href="#ok" x="330" y="312"/>
  <text x="352" y="317" font-size="13" font-weight="700" fill="#16703d">passt</text>
  <!-- USB in PS/2 -->
  <use href="#usbstecker" x="200" y="386"/>
  <text x="140" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#222">USB-Stecker</text>
  <circle cx="250" cy="386" r="18" fill="#8e5cc4" stroke="#6b4196" stroke-width="2"/>
  <g fill="#222"><circle cx="243" cy="380" r="2.5"/><circle cx="257" cy="380" r="2.5"/><circle cx="240" cy="389" r="2.5"/><circle cx="260" cy="389" r="2.5"/><circle cx="245" cy="396" r="2.5"/><circle cx="255" cy="396" r="2.5"/></g>
  <text x="250" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#6b4196">PS/2</text>
  <use href="#nein" x="330" y="386"/>
  <text x="352" y="391" font-size="13" font-weight="700" fill="#a32020">passt</text>
  <text x="352" y="407" font-size="13" font-weight="700" fill="#a32020">nicht</text>
</svg>
