  <circle cx="366.0" cy="72.5" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="353.1" y1="97.7" x2="378.3" y2="89.5" stroke="#777" stroke-width="2"/>
  <circle cx="378.3" cy="89.5" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
