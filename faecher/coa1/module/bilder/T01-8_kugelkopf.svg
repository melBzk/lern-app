<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, sans-serif">
  <title>Kugelkopfdrucker: Eine Metallkugel an einer Halterung ist rundum mit kleinen Buchstaben besetzt. Sie dreht sich zum richtigen Buchstaben und schlägt durch das Farbband aufs Papier. Rechts zum Vergleich: oben das Typenrad mit der Beschriftung Rad, unten der Kugelkopf mit der Beschriftung Kugel.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
  </defs>
  <rect width="400" height="360" fill="#fff"/>

  <text x="200" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Kugelkopfdrucker</text>
