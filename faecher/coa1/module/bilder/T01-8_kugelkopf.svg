  <circle cx="366.0" cy="127.5" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="346.0" y1="107.5" x2="346.0" y2="134.0" stroke="#777" stroke-width="2"/>
  <circle cx="346.0" cy="134.0" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="341.6" y1="106.1" x2="326.0" y2="127.5" stroke="#777" stroke-width="2"/>
  <circle cx="326.0" cy="127.5" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="338.9" y1="102.3" x2="313.7" y2="110.5" stroke="#777" stroke-width="2"/>
  <circle cx="313.7" cy="110.5" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="338.9" y1="97.7" x2="313.7" y2="89.5" stroke="#777" stroke-width="2"/>
  <circle cx="313.7" cy="89.5" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="341.6" y1="93.9" x2="326.0" y2="72.5" stroke="#777" stroke-width="2"/>
  <circle cx="326.0" cy="72.5" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="346" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Rad</text>
  <defs><radialGradient id="bg346214" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#f4f5f7"/><stop offset="1" stop-color="#8a929c"/></radialGradient></defs><circle cx="346" cy="214" r="30" fill="url(#bg346214)" stroke="#555" stroke-width="2"/>
  <g font-size="13" font-weight="700" fill="#333" text-anchor="middle"><text x="336" y="208">A</text><text x="356" y="212">B</text><text x="342" y="228">C</text></g>
  <text x="346" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Kugel</text>
