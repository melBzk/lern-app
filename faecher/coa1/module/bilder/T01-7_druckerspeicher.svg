<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Warum der Laserdrucker eigenen Speicher braucht. Der PC schickt die ganze Seite an den Laserdrucker. Schritt 1: Erst kommt die ganze Seite als Bild in den Druckerspeicher, einen RAM-Riegel im Drucker. Schritt 2: Dann wird gedruckt. Größenvergleich: A4 schwarz-weiß bei 1200 dpi rund 16 MB, Farblaser 192 bis 512 MB. Warnung: zu wenig Speicher führt zum Druckabbruch.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="470" fill="#fff"/>

  <!-- PC -->
  <rect x="10" y="70" width="64" height="48" rx="4" fill="#3a3f4a"/>
  <rect x="15" y="75" width="54" height="36" fill="#fff"/>
  <rect x="28" y="80" width="28" height="26" fill="#fff" stroke="#333"/>
  <rect x="34" y="118" width="16" height="8" fill="#555"/>
  <text x="42" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#222">PC</text>
  <line x1="78" y1="94" x2="120" y2="94" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <text x="99" y="70" text-anchor="middle" font-size="13" fill="#222">ganze</text>
  <text x="99" y="85" text-anchor="middle" font-size="13" fill="#222">Seite</text>

  <!-- Drucker -->
  <rect x="126" y="40" width="266" height="170" rx="12" fill="#e5e7eb" stroke="#3a3f4a" stroke-width="3"/>
  <text x="140" y="62" font-size="14" font-weight="700" fill="#222">Laserdrucker</text>
  <!-- RAM-Riegel -->
  <rect x="146" y="120" width="150" height="36" rx="3" fill="#1f9d55"/>
  <g fill="#222"><rect x="154" y="128" width="20" height="20"/><rect x="180" y="128" width="20" height="20"/><rect x="242" y="128" width="20" height="20"/><rect x="268" y="128" width="20" height="20"/></g>
  <g fill="#f2c200"><rect x="152" y="156" width="4" height="6"/><rect x="160" y="156" width="4" height="6"/><rect x="168" y="156" width="4" height="6"/><rect x="176" y="156" width="4" height="6"/><rect x="184" y="156" width="4" height="6"/><rect x="230" y="156" width="4" height="6"/><rect x="238" y="156" width="4" height="6"/><rect x="246" y="156" width="4" height="6"/><rect x="254" y="156" width="4" height="6"/><rect x="262" y="156" width="4" height="6"/><rect x="270" y="156" width="4" height="6"/><rect x="278" y="156" width="4" height="6"/></g>
  <text x="222" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RAM</text>
  <!-- ganze A4-Seite auf dem RAM -->
  <rect x="204" y="72" width="40" height="56" fill="#fff" stroke="#E07B00" stroke-width="2.5"/>
  <g stroke="#999" stroke-width="2"><line x1="210" y1="82" x2="238" y2="82"/><line x1="210" y1="90" x2="238" y2="90"/><line x1="210" y1="98" x2="238" y2="98"/><line x1="210" y1="106" x2="238" y2="106"/><line x1="210" y1="114" x2="230" y2="114"/></g>
  <circle cx="140" cy="186" r="11" fill="#E07B00"/><text x="140" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="157" y="184" font-size="13" font-weight="700" fill="#222">erst die GANZE Seite</text>
  <text x="157" y="200" font-size="13" fill="#222">in den Druckerspeicher</text>
  <!-- Ausgabe -->
  <line x1="300" y1="138" x2="338" y2="138" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <rect x="342" y="112" width="40" height="56" fill="#fff" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="2"><line x1="348" y1="122" x2="376" y2="122"/><line x1="348" y1="130" x2="376" y2="130"/><line x1="348" y1="138" x2="376" y2="138"/><line x1="348" y1="146" x2="376" y2="146"/><line x1="348" y1="154" x2="368" y2="154"/></g>
  <circle cx="320" cy="86" r="11" fill="#E07B00"/><text x="320" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="336" y="84" font-size="13" font-weight="700" fill="#222">dann</text>
  <text x="336" y="100" font-size="13" font-weight="700" fill="#222">drucken</text>

  <!-- Balken -->
  <text x="10" y="248" font-size="15" font-weight="700" fill="#222">So viel Druckerspeicher braucht es</text>
  <text x="10" y="276" font-size="13" fill="#222">A4 schwarz-weiß, 1200 dpi</text>
  <rect x="10" y="284" width="8" height="22" fill="#3a3f4a"/>
  <text x="26" y="301" font-size="14" font-weight="700" fill="#222">≈ 16 MB</text>
  <text x="10" y="332" font-size="13" fill="#222">Farblaser</text>
  <rect x="10" y="340" width="101" height="22" fill="#3a3f4a"/>
  <rect x="111" y="340" width="169" height="22" fill="#9aa3ae"/>
  <text x="288" y="357" font-size="14" font-weight="700" fill="#222">192–512 MB</text>
  <line x1="111" y1="336" x2="111" y2="366" stroke="#fff" stroke-width="2"/>

  <!-- Warnung -->
  <rect x="10" y="390" width="380" height="64" rx="10" fill="#fdecec" stroke="#d63c3c" stroke-width="2"/>
  <path d="M44,402 L64,440 L24,440 z" fill="#d63c3c"/>
  <text x="44" y="436" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">!</text>
  <text x="78" y="418" font-size="15" font-weight="700" fill="#a32020">zu wenig Speicher</text>
  <text x="78" y="440" font-size="15" font-weight="700" fill="#a32020">→ Druckabbruch</text>
</svg>
