<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich aus dem Alltag in zwei Bildern. Bild 1: Haustürschlüssel und Zweitschlüssel hängen am selben Schlüsselbund. Der Bund geht verloren, beide Schlüssel sind weg. Kopie am selben Ort ist keine Hilfe. Bild 2: Der Zweitschlüssel liegt bei der Nachbarin im Nachbarhaus. Dein Schlüssel ist weg, aber der Zweitschlüssel ist gerettet. Hinweis: Wo der Vergleich hinkt – Daten kann man beliebig oft kopieren, auch an mehrere Orte.</title>
<defs>
<g id="key">
<circle cx="0" cy="0" r="9" fill="none" stroke="currentColor" stroke-width="4"/>
<path d="M9,-2 L36,-2 L36,2 L9,2 Z" fill="currentColor"/>
<rect x="26" y="2" width="4" height="7" fill="currentColor"/><rect x="32" y="2" width="4" height="9" fill="currentColor"/>
</g>
<g id="haus">
<path d="M-40,-10 L0,-44 L40,-10 Z" fill="#8d6e63"/>
<rect x="-32" y="-10" width="64" height="54" fill="#efe6dc" stroke="#8d6e63" stroke-width="2"/>
<rect x="-9" y="14" width="18" height="30" fill="#8d6e63"/>
</g>
</defs>
<rect width="400" height="570" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Wie ein Zweitschlüssel</text>

<!-- Feld 1 -->
<rect x="10" y="40" width="380" height="200" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<circle cx="32" cy="64" r="11" fill="#c62828"/><text x="32" y="69" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
<text x="50" y="69" font-weight="700">beide am selben Schlüsselbund</text>
<!-- Schlüsselbund fällt -->
<circle cx="110" cy="98" r="12" fill="none" stroke="#555" stroke-width="3"/>
<g color="#555" transform="translate(94 122) rotate(100)"><use href="#key"/></g>
<g color="#555" transform="translate(126 122) rotate(80)"><use href="#key"/></g>
<text x="60" y="130" text-anchor="middle" font-size="13" fill="#444">Haus-</text>
<text x="60" y="146" text-anchor="middle" font-size="13" fill="#444">schlüssel</text>
<text x="148" y="130" font-size="13" fill="#444">Zweit-</text>
<text x="148" y="146" font-size="13" fill="#444">schlüssel</text>
<!-- Fallpfeil -->
<g stroke="#555" stroke-width="2" stroke-dasharray="4 4"><line x1="96" y1="176" x2="96" y2="196"/><line x1="124" y1="176" x2="124" y2="196"/></g>
<!-- weg -->
<text x="110" y="222" text-anchor="middle" font-weight="700" fill="#c62828">verloren</text>
<!-- rechts Ergebnis -->
<text x="300" y="120" text-anchor="middle" font-weight="700" font-size="16" fill="#c62828">beide weg</text>
<g stroke="#c62828" stroke-width="4" stroke-linecap="round"><line x1="270" y1="140" x2="330" y2="190"/><line x1="330" y1="140" x2="270" y2="190"/></g>
<text x="300" y="212" text-anchor="middle" font-weight="700" fill="#c62828">Kopie am selben Ort</text>
<text x="300" y="230" text-anchor="middle" font-weight="700" fill="#c62828">= keine Hilfe</text>

<!-- Feld 2 -->
<rect x="10" y="256" width="380" height="210" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<circle cx="32" cy="280" r="11" fill="#2e7d32"/><text x="32" y="285" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
<text x="50" y="285" font-weight="700">Zweitschlüssel bei der Nachbarin</text>
<!-- dein Haus -->
<g transform="translate(100 360)"><use href="#haus"/></g>
<text x="100" y="424" text-anchor="middle" font-size="13">deine Wohnung</text>
<g color="#999" transform="translate(84 304)"><use href="#key"/></g>
<line x1="78" y1="296" x2="126" y2="316" stroke="#c62828" stroke-width="3"/>
<text x="100" y="440" text-anchor="middle" font-size="13" fill="#c62828">Schlüssel weg</text>
<!-- Nachbarhaus -->
<g transform="translate(290 360)"><use href="#haus"/></g>
<text x="290" y="424" text-anchor="middle" font-size="13">Nachbarin</text>
<g color="#2e7d32" transform="translate(270 304)"><use href="#key"/></g>
<circle cx="350" cy="306" r="14" fill="#2e7d32"/>
<path d="M343,306 L348,312 L358,300" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="150" y1="360" x2="236" y2="360" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 5"/>
<text x="193" y="352" text-anchor="middle" font-size="13" fill="#444">woanders</text>
<text x="200" y="456" text-anchor="middle" font-weight="700" fill="#2e7d32">Kopie woanders = gerettet</text>

<!-- Hinweis -->
<rect x="10" y="482" width="380" height="76" rx="10" fill="#eceff1"/>
<text x="24" y="508" font-weight="700">Wo der Vergleich hinkt:</text>
<text x="24" y="530">Daten kopierst du beliebig oft –</text>
<text x="24" y="549">auch an mehrere Orte.</text>
</svg>
