<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Fünf Merksätze mit Symbol. Betriebssystem: Schnittstelle zwischen Hardware, Programmen und Anwender. GUI für Menschen, API für Programme. BIOS steckt im ROM auf dem Mainboard, ohne BIOS startet der PC nicht. OCR: aus einem gescannten Bild wird bearbeitbarer Text. KI ist gleich AI, künstliche Intelligenz.</title>
<rect width="400" height="450" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Merke</text>
<g stroke="#ddd" stroke-width="1"><line x1="15" y1="42" x2="385" y2="42"/><line x1="15" y1="122" x2="385" y2="122"/><line x1="15" y1="202" x2="385" y2="202"/><line x1="15" y1="282" x2="385" y2="282"/><line x1="15" y1="362" x2="385" y2="362"/><line x1="15" y1="442" x2="385" y2="442"/></g>
<!-- BS -->
<g transform="translate(52,82)"><circle cx="0" cy="-24" r="6" fill="#555"/><rect x="-26" y="-12" width="52" height="16" rx="4" fill="#3a6ed8"/><rect x="-20" y="12" width="40" height="12" rx="2" fill="#9aa3ad"/><line x1="0" y1="-18" x2="0" y2="-12" stroke="#555" stroke-width="2"/><line x1="0" y1="4" x2="0" y2="12" stroke="#555" stroke-width="2"/></g>
<text x="100" y="74" font-size="15" font-weight="700" fill="#1d3f8a">Betriebssystem = Schnittstelle</text>
<text x="100" y="96">Hardware ↔ Programme ↔ du</text>
<!-- GUI / API -->
<g transform="translate(52,162)"><rect x="-30" y="-20" width="26" height="20" rx="2" fill="#dfe9fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="-30" y="-20" width="26" height="5" fill="#3a6ed8"/><rect x="4" y="2" width="11" height="16" rx="2" fill="#3a3f4a"/><rect x="20" y="2" width="11" height="16" rx="2" fill="#3a3f4a"/><line x1="15" y1="10" x2="20" y2="10" stroke="#E07B00" stroke-width="3"/></g>
<text x="100" y="154" font-size="15"><tspan font-weight="700" fill="#1d3f8a">GUI</tspan> = für Menschen</text>
<text x="100" y="178" font-size="15"><tspan font-weight="700" fill="#1d3f8a">API</tspan> = für Programme</text>
<!-- BIOS -->
<g transform="translate(52,242)"><rect x="-26" y="-18" width="52" height="36" rx="3" fill="#2f6b4f"/><rect x="-16" y="-10" width="32" height="20" rx="2" fill="#222"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ROM</text></g>
<text x="100" y="234" font-size="15" font-weight="700" fill="#1d3f8a">BIOS im ROM, Mainboard</text>
<text x="100" y="256" font-weight="700" fill="#c62828">ohne BIOS kein Start</text>
<!-- OCR -->
<g transform="translate(52,322)"><rect x="-30" y="-18" width="24" height="32" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="-18" y="4" text-anchor="middle" font-size="14" font-family="Georgia, serif" font-weight="700">A</text><path d="M-2,-2 H8 M4,-6 L9,-2 L4,2" stroke="#E07B00" stroke-width="2.5" fill="none"/><text x="20" y="4" text-anchor="middle" font-size="16" font-weight="700" fill="#1d3f8a">A</text><line x1="28" y1="-10" x2="28" y2="8" stroke="#1d3f8a" stroke-width="2"/></g>
<text x="100" y="314" font-size="15" font-weight="700" fill="#1d3f8a">OCR = Texterkennung</text>
<text x="100" y="336">Scan-Bild → bearbeitbarer Text</text>
<!-- KI -->
<g transform="translate(52,402)"><g stroke="#888" stroke-width="1.5"><line x1="-18" y1="-10" x2="0" y2="-14"/><line x1="-18" y1="-10" x2="0" y2="0"/><line x1="-18" y1="10" x2="0" y2="0"/><line x1="-18" y1="10" x2="0" y2="14"/><line x1="0" y1="-14" x2="18" y2="0"/><line x1="0" y1="0" x2="18" y2="0"/><line x1="0" y1="14" x2="18" y2="0"/></g><g fill="#7b4bb8"><circle cx="-18" cy="-10" r="5"/><circle cx="-18" cy="10" r="5"/><circle cx="0" cy="-14" r="5"/><circle cx="0" cy="0" r="5"/><circle cx="0" cy="14" r="5"/><circle cx="18" cy="0" r="6"/></g></g>
<text x="100" y="396" font-size="15" font-weight="700" fill="#5a2f94">KI = AI</text>
<text x="100" y="418">künstliche Intelligenz</text>
</svg>
