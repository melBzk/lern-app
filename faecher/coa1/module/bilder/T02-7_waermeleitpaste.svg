<title>Querschnitt stark vergrößert: Kühler oben, Prozessor unten, beide Flächen leicht wellig. Ohne Paste bleibt ein Luftpolster, nur wenig Wärme kommt durch. Mit Paste sind die Lücken gefüllt, viel Wärme fließt in den Kühler.</title>
