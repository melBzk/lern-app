<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 388" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Drei Spalten. Mechanische Maus: erkennt die Bewegung mit einer Kugel unten, du bewegst die ganze Maus, heute nicht mehr zu kaufen. Optische Maus: erkennt mit einem Lichtsensor, du bewegst die ganze Maus, heute Standard. Trackball: Kugel oben, du bewegst nur die Kugel, heute gelegentlich im Einsatz.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="388" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700" fill="#222">Drei Arten zu zeigen</text>
<rect x="10" y="44" width="124" height="330" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<text x="72" y="68" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Mechanische</text>
<text x="72" y="86" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Maus</text>
<ellipse cx="72" cy="130" rx="16" ry="23" fill="#dfe3e8" stroke="#333" stroke-width="1.5"/><circle cx="72" cy="133" r="9" fill="#666" stroke="#333" stroke-width="1.5"/>
<text x="72" y="190" font-size="13" text-anchor="middle" fill="#555">erkennt mit:</text>
<text x="72" y="208" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Kugel unten</text>
<text x="72" y="246" font-size="13" text-anchor="middle" fill="#555">du bewegst:</text>
<text x="72" y="264" font-size="14" text-anchor="middle" font-weight="700" fill="#222">ganze Maus</text>
<line x1="58.8" y1="286.0" x2="85.2" y2="286.0" stroke="#333" stroke-width="2.5"/><polygon points="94,286 83.0,291.5 83.0,280.5" fill="#333"/><polygon points="50,286 61.0,280.5 61.0,291.5" fill="#333"/>
<rect x="24" y="316" width="96" height="32" rx="16" fill="#fff" stroke="#777" stroke-width="2.5"/>
<text x="72" y="337" font-size="14" text-anchor="middle" font-weight="700" fill="#777">nicht mehr</text>
<rect x="138" y="44" width="124" height="330" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<text x="200" y="68" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Optische</text>
<text x="200" y="86" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Maus</text>
<path d="M172,140 Q174,116 202,116 Q228,118 228,140 Z" fill="#fff" stroke="#333" stroke-width="1.5"/><path d="M196,140 l-6,12 h20 z" fill="#ffe066" stroke="none" stroke-width="0"/><line x1="164" y1="152" x2="236" y2="152" stroke="#999" stroke-width="2"/>
<text x="200" y="190" font-size="13" text-anchor="middle" fill="#555">erkennt mit:</text>
<text x="200" y="208" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Lichtsensor</text>
<text x="200" y="246" font-size="13" text-anchor="middle" fill="#555">du bewegst:</text>
<text x="200" y="264" font-size="14" text-anchor="middle" font-weight="700" fill="#222">ganze Maus</text>
<line x1="186.8" y1="286.0" x2="213.2" y2="286.0" stroke="#333" stroke-width="2.5"/><polygon points="222,286 211.0,291.5 211.0,280.5" fill="#333"/><polygon points="178,286 189.0,280.5 189.0,291.5" fill="#333"/>
<rect x="152" y="316" width="96" height="32" rx="16" fill="#fff" stroke="#2f6b4f" stroke-width="2.5"/>
<text x="200" y="337" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6b4f">Standard</text>
<rect x="266" y="44" width="124" height="330" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<text x="328" y="68" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Trackball</text>
<text x="328" y="86" font-size="14" text-anchor="middle" font-weight="700" fill="#222"></text>
<path d="M298,144 Q298,120 328,118 Q358,120 358,144 Z" fill="#dfe3e8" stroke="#333" stroke-width="1.5"/><circle cx="324" cy="128" r="11" fill="#d64545" stroke="#333" stroke-width="1.5"/>
<text x="328" y="190" font-size="13" text-anchor="middle" fill="#555">erkennt mit:</text>
<text x="328" y="208" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Kugel oben</text>
<text x="328" y="246" font-size="13" text-anchor="middle" fill="#555">du bewegst:</text>
<text x="328" y="264" font-size="14" text-anchor="middle" font-weight="700" fill="#222">nur die Kugel</text>
<path d="M314,288 A14,8 0 1 1 342,288" fill="none" stroke="#333" stroke-width="2.5"/><polygon points="342.0,288.0 330.0,285.1 337.1,276.7" fill="#333"/>
<rect x="280" y="316" width="96" height="32" rx="16" fill="#fff" stroke="#3a6ed8" stroke-width="2.5"/>
<text x="328" y="337" font-size="14" text-anchor="middle" font-weight="700" fill="#3a6ed8">gelegentlich</text>

</svg>
