<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Datenschutz beim Weitergeben einer alten Festplatte. Ein ausgemusterter Büro-PC, die Festplatte liegt daneben auf dem Tisch. Drei Schilder: Formatieren garantiert keine vollständige Löschung, rotes X. HDD: mit einem Löschprogramm den ganzen Datenträger überschreiben, grüner Haken. SSD: Secure Erase, den eingebauten Löschbefehl, nutzen – er löst eine Löschprozedur in der SSD aus, grüner Haken. Quelle: BSI.</title>
<rect width="400" height="520" fill="#fff"/>
<!-- Schloss -->
<path d="M36,30 v-8 a10,10 0 0 1 20,0 v8" fill="none" stroke="#3a6ed8" stroke-width="4"/>
<rect x="30" y="30" width="32" height="24" rx="4" fill="#3a6ed8"/>
<circle cx="46" cy="41" r="3.5" fill="#fff"/>
<text x="74" y="38" font-size="17" font-weight="700">Datenschutz:</text>
<text x="74" y="58" font-size="15">alte Festplatte weitergeben</text>

<!-- PC und Platte auf Tisch -->
<rect x="40" y="82" width="70" height="120" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/>
<rect x="52" y="96" width="46" height="8" rx="2" fill="#9aa5ad"/>
<rect x="52" y="112" width="46" height="8" rx="2" fill="#9aa5ad"/>
<circle cx="75" cy="180" r="6" fill="none" stroke="#555" stroke-width="2"/>
<rect x="56" y="132" width="38" height="28" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="75" y="222" text-anchor="middle" font-size="13">ausgemustert</text>
<path d="M118,150 C150,140 170,150 190,164" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
<g transform="translate(196,128)">
<rect x="0" y="0" width="110" height="70" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="46" cy="35" r="26" fill="#fff" stroke="#9aa5ad" stroke-width="2"/>
<circle cx="46" cy="35" r="5" fill="#555"/>
<line x1="96" y1="58" x2="58" y2="28" stroke="#555" stroke-width="4" stroke-linecap="round"/>
</g>
<text x="251" y="222" text-anchor="middle" font-size="13">mit Kundendaten</text>
<line x1="150" y1="200" x2="370" y2="200" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>

<!-- Schild 1 -->
<rect x="10" y="246" width="380" height="74" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<g stroke="#c62828" stroke-width="5" stroke-linecap="round"><line x1="30" y1="268" x2="54" y2="292"/><line x1="54" y1="268" x2="30" y2="292"/></g>
<text x="72" y="276" font-weight="700" font-size="15">Formatieren</text>
<text x="72" y="298">garantiert <tspan font-weight="700" fill="#c62828">keine</tspan> vollständige Löschung</text>

<!-- Schild 2 -->
<rect x="10" y="332" width="380" height="74" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<path d="M28,370 l9,10 l17,-22" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="356" font-weight="700" font-size="15">HDD:</text>
<text x="72" y="377">mit einem Löschprogramm den</text>
<text x="72" y="396">ganzen Datenträger überschreiben</text>

<!-- Schild 3 -->
<rect x="10" y="418" width="380" height="74" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<path d="M28,456 l9,10 l17,-22" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="442" font-weight="700" font-size="15">SSD: Secure Erase</text>
<text x="72" y="463">eingebauter Löschbefehl,</text>
<text x="72" y="482" font-size="13" fill="#444">Löschprozedur in der SSD</text>

<text x="390" y="512" text-anchor="end" font-size="11" fill="#666">nach BSI „Daten endgültig löschen“</text>
</svg>
