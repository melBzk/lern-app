<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Rechenkette als Treppe von oben nach unten: 16 Köpfe mal 16 383 Zylinder ergibt 262 128 Spuren. Mal 63 Sektoren je Spur ergibt 16 514 064 Sektoren. Mal 512 Byte ergibt 8 455 200 768 Byte. Geteilt durch 1024 und nochmal durch 1024 ergibt etwa 8063,5 MiB. Geteilt durch 1024 ergibt etwa 7,87 GiB. Hinweis: Das Buch schreibt MB und GB, rechnet aber mit 1024.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Kapazität Schritt für Schritt</text>
<text x="200" y="46" text-anchor="middle" font-size="13" fill="#555">ältere Festplatte, Rechnung aus dem Buch</text>
<rect x="14" y="58" width="216" height="38" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="122.0" y="83" text-anchor="middle" font-weight="700" font-size="15" fill="#222">16 Köpfe</text><line x1="54" y1="96" x2="68" y2="126" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/><text x="80" y="116" font-size="14" font-weight="700" fill="#1f4fa8">× 16 383 Zylinder</text><rect x="28" y="126" width="216" height="38" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="136.0" y="151" text-anchor="middle" font-weight="700" font-size="15" fill="#222">262 128 Spuren</text><line x1="68" y1="164" x2="82" y2="194" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/><text x="94" y="184" font-size="14" font-weight="700" fill="#1f4fa8">× 63 Sektoren je Spur</text><rect x="42" y="194" width="216" height="38" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="150.0" y="219" text-anchor="middle" font-weight="700" font-size="15" fill="#222">16 514 064 Sektoren</text><line x1="82" y1="232" x2="96" y2="262" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/><text x="108" y="252" font-size="14" font-weight="700" fill="#1f4fa8">× 512 Byte</text><rect x="56" y="262" width="216" height="38" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/><text x="164.0" y="287" text-anchor="middle" font-weight="700" font-size="15" fill="#222">8 455 200 768 Byte</text><line x1="96" y1="300" x2="110" y2="330" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/><text x="122" y="320" font-size="14" font-weight="700" fill="#1f4fa8">÷ 1024 ÷ 1024</text><rect x="70" y="330" width="216" height="38" rx="8" fill="#fff" stroke="#555" stroke-width="2"/><text x="178.0" y="355" text-anchor="middle" font-weight="700" font-size="15" fill="#222">≈ 8063,5 MiB</text><line x1="110" y1="368" x2="124" y2="398" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/><text x="136" y="388" font-size="14" font-weight="700" fill="#1f4fa8">÷ 1024</text><rect x="84" y="398" width="216" height="38" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2.5"/><text x="192.0" y="423" text-anchor="middle" font-weight="700" font-size="17" fill="#c62828">≈ 7,87 GiB</text>
<rect x="10" y="460" width="380" height="50" rx="8" fill="#fffde7" stroke="#8a6d00" stroke-width="1.5"/>
<text x="200" y="481" text-anchor="middle" font-size="13">Buch schreibt „MB/GB“,</text>
<text x="200" y="500" text-anchor="middle" font-size="13" font-weight="700">rechnet aber mit 1024 – also MiB/GiB</text>
</svg>
