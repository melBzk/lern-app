<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Vergleich: Oben links eine Schreibmaschine, oben rechts ein Taschenrechner, dazwischen ein Pluszeichen. Unten eine Tastatur von oben. Gestrichelte Linien verbinden die Schreibmaschine mit dem alphanumerischen Block und den Taschenrechner mit dem Ziffernblock. Hinweis unten: Die Funktionstasten tun, was das gerade aktive Programm festlegt – das kann keine Schreibmaschine.</title>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Schreibmaschine + Taschenrechner</text>

  <!-- Schreibmaschine -->
  <rect x="10" y="40" width="230" height="146" rx="10" fill="#eef4ff"/>
  <rect x="50" y="54" width="150" height="14" rx="4" fill="#9aa3b2"/>
  <rect x="80" y="44" width="90" height="12" fill="#fff" stroke="#999"/>
  <path d="M36,76 H214 L226,140 H24 Z" fill="#3a3f4a"/>
  <g fill="#dbe6fb">
    <circle cx="50" cy="92" r="6"/><circle cx="68" cy="92" r="6"/><circle cx="86" cy="92" r="6"/><circle cx="104" cy="92" r="6"/><circle cx="122" cy="92" r="6"/><circle cx="140" cy="92" r="6"/><circle cx="158" cy="92" r="6"/><circle cx="176" cy="92" r="6"/><circle cx="194" cy="92" r="6"/>
    <circle cx="44" cy="110" r="6"/><circle cx="62" cy="110" r="6"/><circle cx="80" cy="110" r="6"/><circle cx="98" cy="110" r="6"/><circle cx="116" cy="110" r="6"/><circle cx="134" cy="110" r="6"/><circle cx="152" cy="110" r="6"/><circle cx="170" cy="110" r="6"/><circle cx="188" cy="110" r="6"/><circle cx="206" cy="110" r="6"/>
    <rect x="80" y="122" width="90" height="10" rx="4"/>
  </g>
  <text x="125" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4fb8">Schreibmaschine</text>

  <text x="262" y="122" text-anchor="middle" font-size="30" font-weight="700" fill="#555">+</text>

  <!-- Taschenrechner -->
  <rect x="284" y="40" width="106" height="146" rx="10" fill="#e9f7ee"/>
  <rect x="304" y="48" width="66" height="104" rx="6" fill="#3a3f4a"/>
  <rect x="311" y="55" width="52" height="16" rx="2" fill="#d6f0de"/>
  <text x="358" y="68" text-anchor="end" font-size="12" font-weight="700" fill="#16703d">123</text>
  <g fill="#d6f0de">
    <rect x="311" y="78" width="14" height="12" rx="2"/><rect x="330" y="78" width="14" height="12" rx="2"/><rect x="349" y="78" width="14" height="12" rx="2"/>
    <rect x="311" y="95" width="14" height="12" rx="2"/><rect x="330" y="95" width="14" height="12" rx="2"/><rect x="349" y="95" width="14" height="12" rx="2"/>
    <rect x="311" y="112" width="14" height="12" rx="2"/><rect x="330" y="112" width="14" height="12" rx="2"/><rect x="349" y="112" width="14" height="12" rx="2"/>
    <rect x="311" y="129" width="33" height="12" rx="2"/><rect x="349" y="129" width="14" height="12" rx="2"/>
  </g>
  <text x="337" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#16703d">Taschen-</text>
  <text x="337" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#16703d">rechner</text>

  <!-- Tastatur -->
  <rect x="10" y="212" width="380" height="172" rx="10" fill="#f6f6f6"/>
  <text x="378" y="232" text-anchor="end" font-size="14" font-weight="700" fill="#555">Tastatur (von oben)</text>
  <rect x="22" y="242" width="356" height="130" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <rect x="120" y="250" width="148" height="26" rx="5" fill="#fde7b0" stroke="#e0a800" stroke-width="2"/>
  <text x="194" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5500">Funktionstasten</text>
  <rect x="32" y="286" width="208" height="76" rx="5" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
  <text x="136" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4fb8">Alphanumerischer</text>
  <text x="136" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4fb8">Block</text>
  <rect x="248" y="286" width="34" height="76" rx="5" fill="#e5e7eb" stroke="#999"/>
  <rect x="292" y="286" width="76" height="76" rx="5" fill="#d6f0de" stroke="#1f9d55" stroke-width="2"/>
  <text x="330" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#16703d">Ziffern-</text>
  <text x="330" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#16703d">block</text>

  <!-- Verbindungen -->
  <g stroke-width="2.5" stroke-dasharray="6 4" fill="none">
    <path d="M90,178 V284" stroke="#3a6ed8"/>
    <path d="M330,190 V284" stroke="#1f9d55"/>
  </g>
  <circle cx="90" cy="284" r="4" fill="#3a6ed8"/>
  <circle cx="330" cy="284" r="4" fill="#1f9d55"/>

  <!-- Hinweis -->
  <rect x="20" y="398" width="360" height="58" rx="8" fill="#fff3cd" stroke="#e0a800" stroke-width="2"/>
  <path d="M38,410 L50,432 H26 Z" fill="#e0a800"/>
  <text x="38" y="429" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">!</text>
  <text x="62" y="421" font-size="14" font-weight="700" fill="#222">Funktionstasten: Aufgabe je nach</text>
  <text x="62" y="441" font-size="14" font-weight="700" fill="#222">Programm <tspan font-weight="400" fill="#555">(kann keine Schreibmaschine)</tspan></text>
</svg>
