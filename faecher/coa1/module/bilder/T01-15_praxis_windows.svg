<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Praxisfall „Windows kommt nicht“, ohne Lösung: was der Kunde der Reihe nach sieht. 1: Einschalten, die Lüfter laufen, Haken. 2: Kurz erscheint das Logo des Herstellers, Haken. 3: Die Meldung „Kein Betriebssystem gefunden“, Warnzeichen. 4: Windows startet nie, Kreuz. Unten die Fragen: Was arbeitet schon? Wo suchst du den Fehler?</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Was der Kunde sieht</text>
<!-- 1 -->
<rect x="15" y="42" width="370" height="62" rx="8" fill="#f4f6f9" stroke="#9aa3ad" stroke-width="1.5"/>
<circle cx="40" cy="73" r="13" fill="#555"/><text x="40" y="78" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<g transform="translate(88,73)"><circle r="17" fill="#fff" stroke="#333" stroke-width="2"/><g stroke="#555" stroke-width="3"><line x1="0" y1="-12" x2="0" y2="12"/><line x1="-12" y1="0" x2="12" y2="0"/><line x1="-8" y1="-8" x2="8" y2="8"/></g></g>
<text x="120" y="78" font-size="15">Einschalten: Lüfter laufen</text>
<text x="368" y="80" text-anchor="end" font-size="22" font-weight="700" fill="#2e9d5b">✓</text>
<line x1="200" y1="106" x2="200" y2="120" stroke="#555" stroke-width="2.5" marker-end="url(#ad)"/>
<!-- 2 -->
<rect x="15" y="124" width="370" height="62" rx="8" fill="#f4f6f9" stroke="#9aa3ad" stroke-width="1.5"/>
<circle cx="40" cy="155" r="13" fill="#555"/><text x="40" y="160" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<g transform="translate(88,155)"><rect x="-22" y="-16" width="44" height="30" rx="2" fill="#222"/><rect x="-12" y="-8" width="24" height="14" rx="2" fill="#9aa3ad"/></g>
<text x="120" y="160" font-size="15">kurz: Logo des Herstellers</text>
<text x="368" y="162" text-anchor="end" font-size="22" font-weight="700" fill="#2e9d5b">✓</text>
<line x1="200" y1="188" x2="200" y2="202" stroke="#555" stroke-width="2.5" marker-end="url(#ad)"/>
<!-- 3 -->
<rect x="15" y="206" width="370" height="72" rx="8" fill="#fde3c3" stroke="#E07B00" stroke-width="2.5"/>
<circle cx="40" cy="242" r="13" fill="#E07B00"/><text x="40" y="247" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<rect x="66" y="220" width="300" height="44" rx="3" fill="#111"/>
<text x="78" y="240" font-size="13" font-family="monospace" fill="#fff">Kein Betriebssystem</text>
<text x="78" y="256" font-size="13" font-family="monospace" fill="#fff">gefunden.</text>
<text x="352" y="256" text-anchor="end" font-size="20" font-weight="700" fill="#E07B00">⚠</text>
<line x1="200" y1="280" x2="200" y2="294" stroke="#555" stroke-width="2.5" marker-end="url(#ad)"/>
<!-- 4 -->
<rect x="15" y="298" width="370" height="62" rx="8" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="40" cy="329" r="13" fill="#c62828"/><text x="40" y="334" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<g transform="translate(88,329)"><rect x="-22" y="-16" width="44" height="30" rx="2" fill="#dfe9fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="-22" y="-16" width="44" height="7" fill="#3a6ed8"/></g>
<text x="120" y="334" font-size="15">Windows startet nie</text>
<text x="368" y="336" text-anchor="end" font-size="22" font-weight="700" fill="#c62828">✗</text>
<!-- Fragen -->
<rect x="30" y="384" width="340" height="68" rx="10" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="200" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3f8a">Was arbeitet schon?</text>
<text x="200" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3f8a">Wo suchst du den Fehler?</text>
</svg>
