<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Bridge-Architektur, die älteste Form: Oben die CPU, verbunden mit der Northbridge (schneller Bereich). An der Northbridge hängen Grafik und Arbeitsspeicher. Darunter die Southbridge (langsamer Bereich) mit Laufwerken, Schnittstellen, Steckkarten, BIOS und Festplatte. Nord liegt oben, Süd unten, daher die Namen.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Bridge-Architektur</text>

<!-- Kompass -->
<circle cx="350" cy="78" r="22" fill="#fff" stroke="#555" stroke-width="2"/>
<polygon points="350,60 344,78 356,78" fill="#D4607A"/><polygon points="350,96 344,78 356,78" fill="#9e9e9e"/>
<text x="350" y="52" text-anchor="middle" font-size="14" font-weight="700">N</text>
<text x="350" y="116" text-anchor="middle" font-size="14" font-weight="700">S</text>

<!-- Leitungen -->
<line x1="200" y1="90" x2="200" y2="130" stroke="#333" stroke-width="4"/>
<g stroke="#b45f06" stroke-width="7"><line x1="104" y1="158" x2="130" y2="158"/><line x1="270" y1="158" x2="288" y2="158"/></g>
<line x1="200" y1="186" x2="200" y2="228" stroke="#333" stroke-width="3"/>
<g stroke="#3a6ed8" stroke-width="1.5"><line x1="112" y1="242" x2="130" y2="242"/><line x1="112" y1="276" x2="130" y2="276"/><line x1="112" y1="310" x2="130" y2="310"/><line x1="270" y1="258" x2="288" y2="258"/><line x1="270" y1="294" x2="288" y2="294"/></g>

<!-- CPU -->
<rect x="150" y="50" width="100" height="40" rx="5" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2.5"/>
<text x="200" y="76" text-anchor="middle" font-size="16" font-weight="700">CPU</text>
<!-- Northbridge -->
<rect x="130" y="130" width="140" height="56" rx="5" fill="#fdebd8" stroke="#e8892b" stroke-width="2.5"/>
<text x="200" y="155" text-anchor="middle" font-size="15" font-weight="700">Northbridge</text>
<text x="200" y="174" text-anchor="middle" font-size="13" fill="#b45f06" font-weight="700">(schnell)</text>
<rect x="8" y="138" width="96" height="40" rx="5" fill="#fff" stroke="#e8892b" stroke-width="2"/>
<text x="56" y="163" text-anchor="middle" font-size="14">Grafik</text>
<rect x="288" y="138" width="104" height="40" rx="5" fill="#fff" stroke="#e8892b" stroke-width="2"/>
<text x="340" y="155" text-anchor="middle" font-size="13">Arbeits-</text>
<text x="340" y="171" text-anchor="middle" font-size="13">speicher</text>
<!-- Southbridge -->
<rect x="130" y="228" width="140" height="96" rx="5" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
<text x="200" y="272" text-anchor="middle" font-size="15" font-weight="700">Southbridge</text>
<text x="200" y="291" text-anchor="middle" font-size="13" fill="#3a6ed8" font-weight="700">(langsam)</text>
<g fill="#fff" stroke="#3a6ed8" stroke-width="1.5"><rect x="8" y="229" width="104" height="26" rx="4"/><rect x="8" y="263" width="104" height="26" rx="4"/><rect x="8" y="297" width="104" height="26" rx="4"/><rect x="288" y="245" width="104" height="26" rx="4"/><rect x="288" y="281" width="104" height="26" rx="4"/></g>
<g font-size="13" text-anchor="middle"><text x="60" y="247">Laufwerke</text><text x="60" y="281">Schnittstellen</text><text x="60" y="315">Steckkarten</text><text x="340" y="263">BIOS</text><text x="340" y="299">Festplatte</text></g>

<text x="200" y="360" text-anchor="middle" font-size="15" font-weight="700">Bridge-Architektur (älteste Form)</text>
<text x="200" y="382" text-anchor="middle" font-size="13" fill="#555">North = oben, South = unten → daher die Namen</text>
</svg>
