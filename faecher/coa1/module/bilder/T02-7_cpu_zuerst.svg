<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vier Schritte untereinander: 1 Prozessor aussuchen, 2 Sockel ablesen, 3 Mainboard mit genau diesem Sockel wählen, 4 im Handbuch prüfen, ob der Prozessor in der Liste steht. Hinweis: Nicht jeder Prozessor passt auf jeden Sockel.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker></defs>
<rect width="400" height="430" fill="#fff"/>
<text x="200.0" y="26" font-size="17" text-anchor="middle" font-weight="700" >Erst der Prozessor, dann das Mainboard</text>
<rect x="20" y="48" width="360" height="70" rx="10" fill="#fff" stroke="#3a6ed8" stroke-width="2" />
<circle cx="42" cy="83" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="42" y="88" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >1</text>
<rect x="78" y="69" width="28" height="28" rx="4" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2" />
<line x1="83.6" y1="63" x2="83.6" y2="69" stroke="#2f6b4f" stroke-width="2" />
<line x1="83.6" y1="97" x2="83.6" y2="103" stroke="#2f6b4f" stroke-width="2" />
<line x1="72" y1="74.6" x2="78" y2="74.6" stroke="#2f6b4f" stroke-width="2" />
<line x1="106" y1="74.6" x2="112" y2="74.6" stroke="#2f6b4f" stroke-width="2" />
<line x1="89.2" y1="63" x2="89.2" y2="69" stroke="#2f6b4f" stroke-width="2" />
<line x1="89.2" y1="97" x2="89.2" y2="103" stroke="#2f6b4f" stroke-width="2" />
<line x1="72" y1="80.2" x2="78" y2="80.2" stroke="#2f6b4f" stroke-width="2" />
<line x1="106" y1="80.2" x2="112" y2="80.2" stroke="#2f6b4f" stroke-width="2" />
<line x1="94.8" y1="63" x2="94.8" y2="69" stroke="#2f6b4f" stroke-width="2" />
<line x1="94.8" y1="97" x2="94.8" y2="103" stroke="#2f6b4f" stroke-width="2" />
<line x1="72" y1="85.8" x2="78" y2="85.8" stroke="#2f6b4f" stroke-width="2" />
<line x1="106" y1="85.8" x2="112" y2="85.8" stroke="#2f6b4f" stroke-width="2" />
<line x1="100.4" y1="63" x2="100.4" y2="69" stroke="#2f6b4f" stroke-width="2" />
<line x1="100.4" y1="97" x2="100.4" y2="103" stroke="#2f6b4f" stroke-width="2" />
<line x1="72" y1="91.4" x2="78" y2="91.4" stroke="#2f6b4f" stroke-width="2" />
<line x1="106" y1="91.4" x2="112" y2="91.4" stroke="#2f6b4f" stroke-width="2" />
<text x="128" y="79" font-size="15" font-weight="700" >Prozessor aussuchen</text>
<text x="128" y="100" font-size="15" >(AMD oder Intel)</text>
<line x1="200" y1="154" x2="200" y2="157" stroke="#222" stroke-width="2.5" marker-end="url(#a)" />
<rect x="20" y="160" width="360" height="70" rx="10" fill="#fff" stroke="#3a6ed8" stroke-width="2" />
<circle cx="42" cy="195" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="42" y="200" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >2</text>
<circle cx="90" cy="193" r="13" fill="#fff" stroke="#222" stroke-width="3" />
<line x1="100" y1="203" x2="110" y2="213" stroke="#222" stroke-width="5" />
<text x="128" y="191" font-size="15" font-weight="700" >Sockel ablesen,</text>
<text x="128" y="212" font-size="15" >z. B. LGA 1200</text>
<line x1="200" y1="232" x2="200" y2="249" stroke="#222" stroke-width="2.5" marker-end="url(#a)" />
<rect x="20" y="252" width="360" height="70" rx="10" fill="#fff" stroke="#3a6ed8" stroke-width="2" />
<circle cx="42" cy="287" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="42" y="292" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >3</text>
<rect x="72" y="267" width="40" height="40" rx="3" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2" />
<rect x="84" y="275" width="16" height="16" rx="2" fill="#fff" stroke="#2f6b4f" stroke-width="1.5" />
<line x1="76" y1="299" x2="108" y2="299" stroke="#2f6b4f" stroke-width="3" />
<text x="128" y="283" font-size="15" font-weight="700" >Mainboard mit genau</text>
<text x="128" y="304" font-size="15" >diesem Sockel wählen</text>
<line x1="200" y1="324" x2="200" y2="341" stroke="#222" stroke-width="2.5" marker-end="url(#a)" />
<rect x="20" y="344" width="360" height="70" rx="10" fill="#fff" stroke="#3a6ed8" stroke-width="2" />
<circle cx="42" cy="379" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="42" y="384" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >4</text>
<rect x="74" y="359" width="34" height="40" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2" />
<line x1="80" y1="359" x2="80" y2="399" stroke="#3a6ed8" stroke-width="2" />
<path d="M86,381 l7,8 l14,-18" fill="none" stroke="#2f6b4f" stroke-width="4" />
<text x="128" y="375" font-size="15" font-weight="700" >Im Handbuch prüfen: steht</text>
<text x="128" y="396" font-size="15" >der Prozessor in der Liste?</text>
<text x="200" y="138" font-size="14" text-anchor="middle" font-weight="700" fill="#E07B00" >Nicht jeder Prozessor passt auf jeden Sockel!</text>
</svg>
