<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Startablauf von oben nach unten. 1 Strom an mit dem Netzschalter. 2 Die Geräte melden sich beim BIOS/UEFI: Grafikkarte, Arbeitsspeicher, CPU und Tastatur sagen jeweils „Ich bin da!“. 3 Der POST prüft unter anderem Grafikkarte, Arbeitsspeicher, CPU und Tastatur. Dann zwei Wege: a alles in Ordnung – Windows startet, du hörst nichts. b Fehler – Pieptöne.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="400" height="620" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">POST – Selbsttest beim Einschalten</text>

<!-- 1 Strom an -->
<circle cx="24" cy="60" r="11" fill="#222"/><text x="24" y="65" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
<rect x="44" y="42" width="200" height="38" rx="8" fill="#eceff1"/>
<path d="M66,54 A10,10 0 1 0 78,54" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="72" y1="48" x2="72" y2="60" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="92" y="66" font-weight="700" font-size="15">Strom an</text>
<line x1="144" y1="80" x2="144" y2="104" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>

<!-- 2 Geräte melden sich -->
<circle cx="24" cy="124" r="11" fill="#222"/><text x="24" y="129" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
<text x="44" y="129" font-weight="700">Geräte melden sich beim BIOS/UEFI</text>
<g font-size="13" text-anchor="middle">
<!-- Sprechblasen -->
<g fill="#fff" stroke="#3a6ed8" stroke-width="1.8">
<path d="M14,142 h84 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-34 l-8,8 l-2,-8 h-40 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z"/>
<path d="M108,142 h84 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-34 l-8,8 l-2,-8 h-40 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z"/>
<path d="M202,142 h84 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-34 l-8,8 l-2,-8 h-40 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z"/>
<path d="M296,142 h84 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-34 l-8,8 l-2,-8 h-40 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z"/>
</g>
<text x="56" y="161" fill="#3a6ed8" font-weight="700">Ich bin da!</text>
<text x="150" y="161" fill="#3a6ed8" font-weight="700">Ich bin da!</text>
<text x="244" y="161" fill="#3a6ed8" font-weight="700">Ich bin da!</text>
<text x="338" y="161" fill="#3a6ed8" font-weight="700">Ich bin da!</text>
<!-- Geräte -->
<g fill="#eceff1" stroke="#555" stroke-width="1.5">
<rect x="14" y="184" width="88" height="58" rx="6"/><rect x="108" y="184" width="88" height="58" rx="6"/><rect x="202" y="184" width="88" height="58" rx="6"/><rect x="296" y="184" width="88" height="58" rx="6"/>
</g>
<!-- Grafikkarte -->
<rect x="28" y="192" width="60" height="18" rx="2" fill="#555"/><circle cx="46" cy="201" r="5" fill="none" stroke="#bbb" stroke-width="1.5"/><circle cx="70" cy="201" r="5" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="58" y="232">Grafikkarte</text>
<!-- RAM -->
<rect x="122" y="194" width="60" height="14" rx="1" fill="#2e7d32"/><rect x="128" y="197" width="9" height="8" fill="#222"/><rect x="141" y="197" width="9" height="8" fill="#222"/><rect x="154" y="197" width="9" height="8" fill="#222"/><rect x="167" y="197" width="9" height="8" fill="#222"/>
<text x="152" y="232">RAM</text>
<!-- CPU -->
<rect x="234" y="190" width="24" height="24" rx="2" fill="#555"/><rect x="240" y="196" width="12" height="12" fill="#c9ced4"/>
<text x="246" y="232">CPU</text>
<!-- Tastatur -->
<rect x="312" y="192" width="56" height="20" rx="3" fill="#fff" stroke="#555" stroke-width="1.5"/>
<g fill="#555"><rect x="316" y="196" width="6" height="5"/><rect x="325" y="196" width="6" height="5"/><rect x="334" y="196" width="6" height="5"/><rect x="343" y="196" width="6" height="5"/><rect x="352" y="196" width="6" height="5"/><rect x="361" y="196" width="4" height="5"/><rect x="322" y="204" width="36" height="4"/></g>
<text x="340" y="232">Tastatur</text>
</g>
<line x1="200" y1="246" x2="200" y2="270" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>

<!-- 3 POST prüft -->
<circle cx="24" cy="290" r="11" fill="#222"/><text x="24" y="295" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">3</text>
<rect x="44" y="274" width="312" height="136" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="44" y="274" width="312" height="32" rx="8" fill="#222"/><rect x="44" y="296" width="312" height="10" fill="#222"/>
<text x="200" y="296" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">POST prüft u. a.:</text>
<g font-size="15">
<g fill="none" stroke="#555" stroke-width="2"><rect x="62" y="318" width="18" height="18" rx="3"/><rect x="62" y="346" width="18" height="18" rx="3"/><rect x="62" y="374" width="18" height="18" rx="3"/><rect x="210" y="318" width="18" height="18" rx="3"/></g>
<g fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M65,327 l4,5 l9,-11"/><path d="M65,355 l4,5 l9,-11"/><path d="M65,383 l4,5 l9,-11"/><path d="M213,327 l4,5 l9,-11"/></g>
<text x="88" y="333">Grafikkarte</text>
<text x="88" y="361">Arbeitsspeicher</text>
<text x="88" y="389">CPU</text>
<text x="236" y="333">Tastatur</text>
<text x="236" y="389" fill="#555">…</text>
</g>

<!-- Abzweig -->
<path d="M150,410 L100,446" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#g)"/>
<path d="M250,410 L300,446" stroke="#c62828" stroke-width="3" fill="none" marker-end="url(#r)"/>

<!-- a ok -->
<rect x="10" y="450" width="184" height="156" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<circle cx="32" cy="474" r="11" fill="#2e7d32"/><text x="32" y="479" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">a</text>
<text x="50" y="479" font-weight="700" fill="#2e7d32" font-size="15">alles ok</text>
<rect x="66" y="494" width="72" height="44" rx="3" fill="#3a6ed8"/><rect x="96" y="538" width="12" height="6" fill="#555"/><rect x="86" y="544" width="32" height="3" fill="#555"/>
<text x="102" y="575" text-anchor="middle" font-weight="700">Windows startet</text>
<text x="102" y="594" text-anchor="middle">du hörst nichts</text>

<!-- b Fehler -->
<rect x="206" y="450" width="184" height="156" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<circle cx="228" cy="474" r="11" fill="#c62828"/><text x="228" y="479" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">b</text>
<text x="246" y="479" font-weight="700" fill="#c62828" font-size="15">Fehler</text>
<rect x="250" y="508" width="12" height="20" fill="#555"/>
<path d="M262,508 L278,496 L278,540 L262,528 Z" fill="#555"/>
<g fill="#c62828" stroke="#c62828" stroke-width="2.2">
<ellipse cx="292" cy="528" rx="5" ry="4" stroke="none"/><line x1="296.5" y1="528" x2="296.5" y2="506"/>
<ellipse cx="308" cy="520" rx="5" ry="4" stroke="none"/><line x1="312.5" y1="520" x2="312.5" y2="498"/>
<line x1="296.5" y1="506" x2="312.5" y2="498"/>
</g>
<text x="298" y="575" text-anchor="middle" font-weight="700" fill="#c62828">Pieptöne</text>
<text x="298" y="594" text-anchor="middle">(vor dem Bild)</text>
</svg>
