<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>32 oder 64 Bit? Oben ein 32-Bit-Prozessor: Vom RAM-Balken mit 16 GB sind nur die ersten 4 GB nutzbar, der Rest ist grau und gesperrt, die 4-GB-Grenze. Darunter ein 64-Bit-Prozessor: derselbe RAM-Balken ist komplett nutzbar. Unten zwei Programmfassungen: cpuz_x32 für 32-Bit-Systeme und cpuz_x64 für 64-Bit-Systeme, außerdem ein Treiber-Hinweis: 64-Bit-Windows braucht 64-Bit-Treiber.</title>
<rect width="400" height="410" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">32 oder 64 Bit?</text>

<!-- 32 Bit -->
<rect x="12" y="62" width="76" height="56" rx="6" fill="#555"/>
<g stroke="#555" stroke-width="2"><line x1="26" y1="56" x2="26" y2="62"/><line x1="50" y1="56" x2="50" y2="62"/><line x1="74" y1="56" x2="74" y2="62"/><line x1="26" y1="118" x2="26" y2="124"/><line x1="50" y1="118" x2="50" y2="124"/><line x1="74" y1="118" x2="74" y2="124"/></g>
<text x="50" y="96" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">32 Bit</text>
<text x="104" y="60" font-size="13" fill="#555">RAM 16 GB</text>
<rect x="104" y="68" width="70" height="34" fill="#2f9e44"/>
<rect x="174" y="68" width="210" height="34" fill="#ddd"/>
<rect x="104" y="68" width="280" height="34" fill="none" stroke="#555" stroke-width="2"/>
<line x1="174" y1="62" x2="174" y2="108" stroke="#c62828" stroke-width="3"/>
<!-- Schloss -->
<path d="M272,84 L272,79 A7,7 0 0 1 286,79 L286,84" fill="none" stroke="#555" stroke-width="2.5"/>
<rect x="267" y="83" width="24" height="15" rx="2" fill="#555"/>
<text x="139" y="124" font-size="14" text-anchor="middle" font-weight="700" fill="#1f6b30">nutzbar</text>
<text x="279" y="124" font-size="14" text-anchor="middle" font-weight="700" fill="#c62828">4-GB-Grenze</text>

<!-- 64 Bit -->
<rect x="12" y="152" width="76" height="56" rx="6" fill="#3a6ed8"/>
<g stroke="#3a6ed8" stroke-width="2"><line x1="26" y1="146" x2="26" y2="152"/><line x1="50" y1="146" x2="50" y2="152"/><line x1="74" y1="146" x2="74" y2="152"/><line x1="26" y1="208" x2="26" y2="214"/><line x1="50" y1="208" x2="50" y2="214"/><line x1="74" y1="208" x2="74" y2="214"/></g>
<text x="50" y="186" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">64 Bit</text>
<text x="104" y="150" font-size="13" fill="#555">RAM 16 GB</text>
<rect x="104" y="158" width="280" height="34" fill="#2f9e44" stroke="#555" stroke-width="2"/>
<text x="244" y="214" font-size="14" text-anchor="middle" font-weight="700" fill="#1f6b30">alles nutzbar</text>

<line x1="12" y1="236" x2="388" y2="236" stroke="#ccc" stroke-width="1.5"/>

<!-- Programme -->
<rect x="16" y="254" width="40" height="32" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="16" y="254" width="40" height="8" fill="#555"/>
<text x="70" y="276" font-size="15" font-weight="700">cpuz_x32</text>
<text x="150" y="276" font-size="14">→ für 32-Bit-Systeme</text>

<rect x="16" y="302" width="40" height="32" rx="3" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<rect x="16" y="302" width="40" height="8" fill="#3a6ed8"/>
<text x="70" y="324" font-size="15" font-weight="700" fill="#2a56b0">cpuz_x64</text>
<text x="150" y="324" font-size="14">→ für 64-Bit-Systeme</text>

<!-- Treiber -->
<rect x="10" y="350" width="380" height="46" rx="8" fill="#fdf0e0" stroke="#E07B00" stroke-width="2"/>
<rect x="22" y="362" width="28" height="22" rx="3" fill="#E07B00"/>
<rect x="28" y="356" width="5" height="6" fill="#E07B00"/><rect x="39" y="356" width="5" height="6" fill="#E07B00"/>
<line x1="36" y1="384" x2="36" y2="392" stroke="#E07B00" stroke-width="3"/>
<text x="62" y="378" font-size="14" font-weight="700">64-Bit-Windows braucht 64-Bit-Treiber</text>
</svg>
