<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Beispiel: Passt das LTE-Modul in den NVMe-Steckplatz? Oben ein LTE-Modul mit Funksymbol und Kerben an der Stelle für Key A/E. Pfeil nach unten zum Steckplatz für die NVMe-SSD mit Key M; dessen Steg sitzt an der M-Stelle. Roter Blitz: Der Steg trifft auf Kontakte statt auf eine Kerbe. Ergebnis rotes X: passt nicht, andere Kerbe.</title>
<rect width="400" height="400" fill="#fff"/>

<!-- LTE-Modul -->
<text x="100" y="36" font-size="16" font-weight="700">LTE-Modul</text>
<rect x="214" y="20" width="86" height="24" rx="12" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="257" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6ed8">Key A/E</text>
<path d="M100,56 H300 V136 H181 V116 H167 V136 H137 V116 H123 V136 H100 Z" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<rect x="102" y="124" width="19" height="11" fill="#c9a227"/>
<rect x="139" y="124" width="26" height="11" fill="#c9a227"/>
<rect x="183" y="124" width="115" height="11" fill="#c9a227"/>
<path d="M123,136 V116 H137 V136 M167,136 V116 H181 V136" fill="none" stroke="#3a6ed8" stroke-width="2.5"/>
<line x1="250" y1="106" x2="250" y2="80" stroke="#3a6ed8" stroke-width="3" stroke-linecap="round"/>
<circle cx="250" cy="78" r="3.5" fill="#3a6ed8"/>
<path d="M240,70 A13,13 0 0,0 240,86 M260,70 A13,13 0 0,1 260,86 M233,64 A22,22 0 0,0 233,92 M267,64 A22,22 0 0,1 267,92" fill="none" stroke="#3a6ed8" stroke-width="2.5" stroke-linecap="round"/>
<text x="150" y="98" text-anchor="middle" font-size="15" font-weight="700">LTE</text>

<!-- Pfeil -->
<line x1="150" y1="146" x2="150" y2="200" stroke="#555" stroke-width="3"/>
<polygon points="141,198 159,198 150,212" fill="#555"/>
<text x="138" y="180" text-anchor="end" font-size="13" fill="#444">einstecken?</text>

<!-- Blitz am Steg -->
<polygon points="270,150 258,180 268,180 256,212 280,172 270,172 280,150" fill="#c62828"/>
<text x="292" y="176" font-size="14" font-weight="700" fill="#c62828">Steg trifft</text>
<text x="292" y="194" font-size="14" font-weight="700" fill="#c62828">Kontakte</text>

<!-- Steckplatz -->
<rect x="92" y="220" width="216" height="46" rx="4" fill="#555"/>
<rect x="100" y="220" width="200" height="22" fill="#fff"/>
<rect x="259" y="220" width="14" height="22" fill="#c62828"/>
<text x="266" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Steg</text>
<text x="100" y="290" font-size="16" font-weight="700">Steckplatz NVMe-SSD</text>
<rect x="214" y="296" width="86" height="24" rx="12" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="257" y="313" text-anchor="middle" font-size="14" font-weight="700">Key M</text>

<!-- Ergebnis -->
<rect x="12" y="334" width="376" height="56" rx="8" fill="#eceff1"/>
<path d="M36,348 L58,370 M58,348 L36,370" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
<text x="76" y="358" font-size="16" font-weight="700" fill="#c62828">passt nicht</text>
<text x="76" y="378" font-size="14">andere Kerbe – nicht mit Gewalt drücken</text>
</svg>
