<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Systembus: Von der CPU gehen drei Bahnen aus, Steuerbus (wer, wann?), Adressbus (wohin?) und der breite Datenbus (was?). Arbeitsspeicher und Geräte hängen an allen drei. Steuer- und Adressbus nur von der CPU weg, Datenbus in beide Richtungen.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker></defs>
<rect width="400" height="400" fill="#fff"/>
<text x="200.0" y="26" font-size="17" text-anchor="middle" font-weight="700" >Der Systembus im PC</text>
<line x1="122" y1="74" x2="122" y2="266" stroke="#7b3fa0" stroke-width="3" marker-end="url(#p)" />
<line x1="160" y1="118" x2="160" y2="266" stroke="#3a6ed8" stroke-width="3" marker-end="url(#b)" />
<line x1="198" y1="188" x2="198" y2="266" stroke="#c62828" stroke-width="3" marker-end="url(#r)" marker-start="url(#r)" />
<line x1="258" y1="74" x2="258" y2="266" stroke="#7b3fa0" stroke-width="3" marker-end="url(#p)" />
<line x1="296" y1="118" x2="296" y2="266" stroke="#3a6ed8" stroke-width="3" marker-end="url(#b)" />
<line x1="334" y1="188" x2="334" y2="266" stroke="#c62828" stroke-width="3" marker-end="url(#r)" marker-start="url(#r)" />
<rect x="64" y="48" width="290" height="26" rx="4" fill="#7b3fa0" stroke="none" stroke-width="0" />
<text x="76" y="66.0" font-size="15" font-weight="700" fill="#fff" >Steuerbus – wer, wann?</text>
<rect x="64" y="92" width="290" height="26" rx="4" fill="#3a6ed8" stroke="none" stroke-width="0" />
<text x="76" y="110.0" font-size="15" font-weight="700" fill="#fff" >Adressbus – wohin?</text>
<rect x="64" y="136" width="290" height="44" rx="4" fill="#c62828" stroke="none" stroke-width="0" />
<text x="76" y="163.0" font-size="15" font-weight="700" fill="#fff" >Datenbus – was?</text>
<rect x="10" y="40" width="54" height="300" rx="8" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2.5" />
<text x="37" y="190" font-size="18" text-anchor="middle" font-weight="700" fill="#2f6b4f" transform="rotate(-90 37 190)">CPU</text>
<rect x="100" y="270" width="120" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2" />
<text x="160" y="310" font-size="14" text-anchor="middle" font-weight="700" >Arbeitsspeicher</text>
<rect x="236" y="270" width="120" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2" />
<text x="296" y="294" font-size="14" text-anchor="middle" font-weight="700" >Geräte</text>
<text x="296" y="312" font-size="13" text-anchor="middle" fill="#555" >(Tastatur,</text>
<text x="296" y="329" font-size="13" text-anchor="middle" fill="#555" >Drucker …)</text>
<path d="M360,48 h8 v132 h-8" fill="none" stroke="#222" stroke-width="2" />
<text x="381" y="114" font-size="15" text-anchor="middle" font-weight="700" transform="rotate(90 381 114)">Systembus</text>
<text x="14" y="370" font-size="14" fill="#222" >Steuer- und Adressbus: nur von der CPU weg</text>
<text x="14" y="390" font-size="14" font-weight="700" fill="#c62828" >Datenbus: breit, in beide Richtungen</text>
</svg>
