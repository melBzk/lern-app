<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>SATA und M.2: Links vier kleine L-förmige SATA-Buchsen auf dem Mainboard, ein Kabel führt zur Festplatte oder SSD im 2,5-Zoll-Gehäuse. Rechts ein flacher M.2-Steckplatz, darin liegt flach eine M.2-SSD, festgeschraubt und ohne Kabel. SATA: mit Kabel. M.2: direkt aufs Board.</title>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Festplatten anschließen</text>
<line x1="200" y1="42" x2="200" y2="320" stroke="#ccc" stroke-width="1.5"/>
<text x="100" y="60" text-anchor="middle" font-size="16" font-weight="700">SATA</text>
<text x="300" y="60" text-anchor="middle" font-size="16" font-weight="700">M.2</text>

<!-- SATA -->
<rect x="40" y="76" width="120" height="78" rx="6" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<text x="100" y="108" text-anchor="middle" font-size="13" font-weight="700">Festplatte / SSD</text>
<text x="100" y="126" text-anchor="middle" font-size="13">2,5 Zoll</text>
<path d="M43,262 C43,210 100,210 100,154" fill="none" stroke="#c62828" stroke-width="5"/>
<text x="96" y="206" font-size="13" font-weight="700" fill="#c62828">Kabel</text>
<rect x="10" y="220" width="180" height="100" rx="6" fill="#2f6b4f"/>
<g fill="#111"><rect x="30" y="256" width="26" height="18" rx="2"/><rect x="66" y="256" width="26" height="18" rx="2"/><rect x="102" y="256" width="26" height="18" rx="2"/><rect x="138" y="256" width="26" height="18" rx="2"/></g>
<g fill="#777"><path d="M34,260 H52 V264 H40 V270 H34 Z"/><path d="M70,260 H88 V264 H76 V270 H70 Z"/><path d="M106,260 H124 V264 H112 V270 H106 Z"/><path d="M142,260 H160 V264 H148 V270 H142 Z"/></g>
<text x="100" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">SATA-Buchsen</text>

<!-- M.2 -->
<text x="300" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#D4607A">kein Kabel!</text>
<text x="300" y="172" text-anchor="middle" font-size="13" fill="#555">flach wie ein Kaugummi</text>
<rect x="210" y="220" width="180" height="100" rx="6" fill="#2f6b4f"/>
<rect x="222" y="236" width="14" height="34" rx="2" fill="#111"/>
<rect x="236" y="241" width="132" height="24" rx="2" fill="#263238" stroke="#90a4ae"/>
<g fill="#78909c"><rect x="250" y="246" width="26" height="14"/><rect x="284" y="246" width="26" height="14"/><rect x="318" y="246" width="20" height="14"/></g>
<circle cx="372" cy="253" r="7" fill="#cfd8dc" stroke="#455a64"/>
<path d="M368,253 h8 M372,249 v8" stroke="#455a64" stroke-width="1.5"/>
<text x="300" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">M.2-SSD</text>
<text x="300" y="310" text-anchor="middle" font-size="13" fill="#fff">flach, festgeschraubt</text>

<text x="200" y="346" text-anchor="middle" font-size="14" font-weight="700">SATA: mit Kabel · M.2: direkt aufs Board</text>
</svg>
