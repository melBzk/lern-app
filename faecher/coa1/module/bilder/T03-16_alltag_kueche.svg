<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich Küche und PC, zweimal dieselbe kleine Küche. Topf auf dem Herd = Prozessor, Dunstabzugshaube darüber = Kühler mit Lüfter, Backofen daneben = Grafikkarte, die mitheizt. Oben ist das Fenster zu: Die Küche wird heiß. Unten ist das Fenster offen: Durchzug, warme Luft raus, Frischluft rein. Das entspricht dem Luftstrom im Gehäuse.</title>
<defs>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
</defs>
<rect width="400" height="600" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Kochen in der kleinen Küche</text>
<g transform="translate(0,40)">
<rect x="8" y="0" width="384" height="240" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="380" y="24" font-size="15" font-weight="700" text-anchor="end" fill="#c62828">Fenster zu</text>

<path d="M75,10 L105,10 L105,32 L75,32 Z" fill="#9aa5b1"/>
<path d="M38,32 L142,32 L162,66 L18,66 Z" fill="#9aa5b1" stroke="#555" stroke-width="2"/>
<circle cx="90" cy="52" r="8" fill="none" stroke="#fff" stroke-width="2"/>
<path d="M90,52 L90,46 M90,52 L95,55 M90,52 L85,55" stroke="#fff" stroke-width="2"/>
<path d="M70,122 C62,110 78,100 70,86 M110,122 C102,110 118,100 110,86" fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="126" width="100" height="38" rx="6" fill="#555"/>
<rect x="28" y="132" width="12" height="6" fill="#555"/><rect x="140" y="132" width="12" height="6" fill="#555"/>
<text x="90" y="150" text-anchor="middle" font-weight="700" fill="#fff">Prozessor</text>
<rect x="20" y="164" width="140" height="66" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="50" cy="196" r="6" fill="#555"/><circle cx="90" cy="196" r="6" fill="#555"/><circle cx="130" cy="196" r="6" fill="#555"/>
<rect x="176" y="140" width="92" height="90" fill="#eceff1" stroke="#555" stroke-width="2"/>
<rect x="186" y="164" width="72" height="50" rx="4" fill="#ffcc80" stroke="#555" stroke-width="1.5"/>
<path d="M222,208 C234,198 230,186 222,178 C222,188 212,190 212,200 C212,206 216,208 222,208 Z" fill="#c62828"/>
<text x="168" y="54" font-weight="700">Kühler mit Lüfter</text>
<text x="222" y="114" text-anchor="middle" font-weight="700">Grafikkarte</text>
<text x="222" y="131" text-anchor="middle" font-weight="700" fill="#c62828">heizt mit</text>

<rect x="290" y="70" width="80" height="90" fill="#e3f2fd" stroke="#555" stroke-width="3"/>
<line x1="330" y1="70" x2="330" y2="160" stroke="#555" stroke-width="3"/>
<path d="M196,100 C190,88 202,82 196,70 M268,100 C262,88 274,82 268,70" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round"/>
<text x="330" y="186" text-anchor="middle" font-weight="700" fill="#c62828">Küche</text>
<text x="330" y="204" text-anchor="middle" font-weight="700" fill="#c62828">wird heiß</text>
</g>
<g transform="translate(0,292)">
<rect x="8" y="0" width="384" height="240" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="380" y="24" font-size="15" font-weight="700" text-anchor="end" fill="#2e7d32">Fenster auf = Durchzug</text>

<path d="M75,10 L105,10 L105,32 L75,32 Z" fill="#9aa5b1"/>
<path d="M38,32 L142,32 L162,66 L18,66 Z" fill="#9aa5b1" stroke="#555" stroke-width="2"/>
<circle cx="90" cy="52" r="8" fill="none" stroke="#fff" stroke-width="2"/>
<path d="M90,52 L90,46 M90,52 L95,55 M90,52 L85,55" stroke="#fff" stroke-width="2"/>
<path d="M70,122 C62,110 78,100 70,86 M110,122 C102,110 118,100 110,86" fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
<rect x="40" y="126" width="100" height="38" rx="6" fill="#555"/>
<rect x="28" y="132" width="12" height="6" fill="#555"/><rect x="140" y="132" width="12" height="6" fill="#555"/>
<text x="90" y="150" text-anchor="middle" font-weight="700" fill="#fff">Prozessor</text>
<rect x="20" y="164" width="140" height="66" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="50" cy="196" r="6" fill="#555"/><circle cx="90" cy="196" r="6" fill="#555"/><circle cx="130" cy="196" r="6" fill="#555"/>
<rect x="176" y="140" width="92" height="90" fill="#eceff1" stroke="#555" stroke-width="2"/>
<rect x="186" y="164" width="72" height="50" rx="4" fill="#ffcc80" stroke="#555" stroke-width="1.5"/>
<path d="M222,208 C234,198 230,186 222,178 C222,188 212,190 212,200 C212,206 216,208 222,208 Z" fill="#c62828"/>
<text x="168" y="54" font-weight="700">Kühler mit Lüfter</text>
<text x="222" y="114" text-anchor="middle" font-weight="700">Grafikkarte</text>
<text x="222" y="131" text-anchor="middle" font-weight="700" fill="#c62828">heizt mit</text>

<rect x="290" y="70" width="80" height="90" fill="#fff" stroke="#555" stroke-width="3"/>
<path d="M290,70 L318,84 L318,174 L290,160 Z" fill="#e3f2fd" stroke="#555" stroke-width="2"/>
<path d="M150,90 C220,88 300,88 384,94" fill="none" stroke="#E07B00" stroke-width="4" marker-end="url(#o)"/>
<path d="M384,140 C320,140 280,150 270,170" fill="none" stroke="#3a6ed8" stroke-width="4" marker-end="url(#b)"/>
<text x="330" y="190" text-anchor="middle" font-weight="700" fill="#E07B00">warm raus</text>
<text x="330" y="208" text-anchor="middle" font-weight="700" fill="#3a6ed8">frisch rein</text>
</g>

<text x="200" y="560" font-size="15" text-anchor="middle" font-weight="700" fill="#2e7d32">Wärme raus, Frischluft rein</text>
<text x="200" y="582" font-size="15" text-anchor="middle" font-weight="700" fill="#2e7d32">= Luftstrom im Gehäuse</text>
</svg>
