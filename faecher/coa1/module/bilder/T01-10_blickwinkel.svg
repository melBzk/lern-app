<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif">
  <title>Ein Monitor von oben gesehen. Ein Auge direkt davor, grüner Pfeil: Von vorne stimmen die Farben. Ein Bogen vor dem Monitor zeigt den Blickwinkel von 170 Grad: In diesem Bereich stimmen die Farben bei einem guten Monitor. Zwei Augen ganz seitlich, außerhalb des Bogens, orange Pfeile: Von der Seite verändern sich die Farben. Gut beim Kauf: über 170 Grad.</title>
  <defs>
    <marker id="pgr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2e9d5b"/>
    </marker>
    <marker id="por" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E07B00"/>
    </marker>
  </defs>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Blickwinkel: Farben von der Seite</text>

  <!-- Monitor von oben -->
  <text x="200" y="54" text-anchor="middle" font-size="13" fill="#555">Monitor, von oben gesehen</text>
  <rect x="110" y="62" width="180" height="12" rx="3" fill="#333"/>

  <!-- 170-Grad-Bogen -->
  <path d="M200,74 L329.5,85.3 A130,130 0 0 1 70.5,85.3 Z" fill="#3a6ed8" fill-opacity="0.08" stroke="#3a6ed8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#3a6ed8">170°</text>

  <!-- Pfeile -->
  <line x1="200" y1="282" x2="200" y2="84" stroke="#2e9d5b" stroke-width="3.5" marker-end="url(#pgr)"/>
  <line x1="50" y1="86" x2="102" y2="80" stroke="#E07B00" stroke-width="3.5" marker-end="url(#por)"/>
  <line x1="350" y1="86" x2="298" y2="80" stroke="#E07B00" stroke-width="3.5" marker-end="url(#por)"/>

  <!-- Augen -->
  <g stroke="#222" stroke-width="2">
    <path d="M182,298 Q200,282 218,298 Q200,314 182,298 Z" fill="#fff"/>
    <path d="M10,88 Q28,72 46,88 Q28,104 10,88 Z" fill="#fff"/>
    <path d="M354,88 Q372,72 390,88 Q372,104 354,88 Z" fill="#fff"/>
  </g>
  <g fill="#222"><circle cx="200" cy="298" r="5"/><circle cx="28" cy="88" r="5"/><circle cx="372" cy="88" r="5"/></g>

  <text x="200" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#2e9d5b">von vorne: Farben stimmen</text>
  <g font-size="14" font-weight="700" fill="#E07B00" stroke="#fff" stroke-width="4" paint-order="stroke">
    <text x="8" y="126">ganz von der Seite:</text>
    <text x="8" y="144">Farben verändern sich</text>
  </g>

  <rect x="40" y="350" width="320" height="54" rx="8" fill="#fff3cd" stroke="#E07B00" stroke-width="2"/>
  <text x="200" y="372" text-anchor="middle" font-size="14" fill="#222">Blickwinkel = bis wohin die Farben stimmen</text>
  <text x="200" y="393" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">gut beim Kauf: über 170°</text>
</svg>
