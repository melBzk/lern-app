<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Badwand mit Fliesen: 10 Fliesen nebeneinander und 8 Reihen übereinander. Statt jede Fliese zu zählen, rechnet man 10 mal 8 gleich 80 Fliesen. Beim Monitor rechnet man genauso Breite mal Höhe, nur mit Millionen winziger Punkte.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<pattern id="f" x="70" y="76" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#dbe6fb" stroke="#fff" stroke-width="2"/></pattern>
</defs>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Fliesen nicht zählen – rechnen!</text>
<text x="190" y="56" text-anchor="middle" font-size="15" font-weight="700">10 nebeneinander</text>
<line x1="70" y1="66" x2="310" y2="66" stroke="#333" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="54" y1="76" x2="54" y2="268" stroke="#333" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="36" y="172" text-anchor="middle" font-size="15" font-weight="700" transform="rotate(-90 36 172)">8 Reihen</text>
<rect x="70" y="76" width="240" height="192" fill="url(#f)" stroke="#555" stroke-width="2"/>
<rect x="70" y="76" width="240" height="24" fill="none" stroke="#e8590c" stroke-width="3"/>
<text x="318" y="93" font-size="13" fill="#e8590c" font-weight="700">1 Reihe</text>
<text x="200" y="308" text-anchor="middle" font-size="22" font-weight="700">10 × 8 = <tspan fill="#e8590c">80</tspan> Fliesen</text>
<text x="200" y="340" text-anchor="middle" font-size="14" fill="#444">Monitor genauso – nur Millionen Punkte</text>
</svg>
