<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Systeminformationen auf zwei Wegen. Links kurz: Tasten Windows plus Pause, am Laptop oft zusätzlich Fn. Das öffnet die Seite System, Info mit den Kacheln Prozessor, RAM, Grafikkarte und Speicher. Rechts ausführlich: im Suchfeld msinfo32 eingeben. Das öffnet das Programm Systeminformationen mit dem Baum Systemübersicht, Hardwareressourcen, Komponenten, darunter Speicher mit Laufwerke und Datenträger.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="400" height="470" fill="#fff"/>
  <line x1="200" y1="14" x2="200" y2="456" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- LINKS: kurz -->
  <text x="100" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#3a6ed8">kurz</text>
  <rect x="10" y="48" width="78" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="10" y="84" width="78" height="6" rx="2" fill="#999"/>
  <text x="49" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Windows</text>
  <text x="100" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#222">+</text>
  <rect x="112" y="48" width="78" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="112" y="84" width="78" height="6" rx="2" fill="#999"/>
  <text x="151" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Pause</text>
  <text x="100" y="112" text-anchor="middle" font-size="13" fill="#555">am Laptop oft</text>
  <text x="100" y="129" text-anchor="middle" font-size="13" fill="#555">zusätzlich Fn</text>
  <line x1="100" y1="138" x2="100" y2="166" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <rect x="8" y="172" width="184" height="190" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <text x="20" y="196" font-size="14" font-weight="700" fill="#222">System &gt; Info</text>
  <g font-size="13" font-weight="700" fill="#222" text-anchor="middle">
    <rect x="16" y="208" width="82" height="66" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5"/><text x="57" y="246">Prozessor</text>
    <rect x="102" y="208" width="82" height="66" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5"/><text x="143" y="246">RAM</text>
    <rect x="16" y="282" width="82" height="66" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5"/><text x="57" y="320">Grafikkarte</text>
    <rect x="102" y="282" width="82" height="66" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5"/><text x="143" y="320">Speicher</text>
  </g>

  <!-- RECHTS: ausführlich -->
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#d63c3c">ausführlich</text>
  <rect x="212" y="48" width="180" height="40" rx="20" fill="#fff" stroke="#555" stroke-width="2"/>
  <circle cx="234" cy="66" r="7" fill="none" stroke="#555" stroke-width="2.5"/>
  <line x1="239" y1="71" x2="245" y2="77" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
  <text x="256" y="74" font-size="16" font-weight="700" fill="#d63c3c">msinfo32</text>
  <text x="300" y="112" text-anchor="middle" font-size="13" fill="#555">nach Windows-Taste</text>
  <text x="300" y="129" text-anchor="middle" font-size="13" fill="#555">oder Windows + R</text>
  <line x1="300" y1="138" x2="300" y2="166" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <rect x="208" y="172" width="186" height="230" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
  <path d="M208,180 Q208,172 216,172 L386,172 Q394,172 394,180 L394,200 L208,200 Z" fill="#555"/>
  <text x="218" y="191" font-size="13" font-weight="700" fill="#fff">Systeminformationen</text>
  <g font-size="13" fill="#222">
    <rect x="214" y="208" width="120" height="24" rx="3" fill="#3a6ed8"/>
    <text x="220" y="225" font-weight="700" fill="#fff">Systemübersicht</text>
    <text x="226" y="256">Hardwareressourcen</text>
    <text x="226" y="284">Komponenten</text>
    <text x="242" y="312">▾ Speicher</text>
    <text x="262" y="340">Laufwerke</text>
    <text x="262" y="368">Datenträger</text>
  </g>
</svg>
