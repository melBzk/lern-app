<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Support-Anruf: Eine Kollegin sagt: Mein neuer Monitor bleibt schwarz. Du fragst der Reihe nach: 1 Welche Buchsen hat der PC? 2 Welche Buchsen hat der Monitor? 3 Steckt das Kabel im Anschlussfeld oder in der Grafikkarte? Unten: In der AP1 wählst du Hardware nach Datenblatt aus, dafür musst du Anschlüsse sicher erkennen.</title>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Im IT-Alltag</text>
<!-- Sprechblase -->
<rect x="20" y="44" width="300" height="46" rx="14" fill="#fff3c4" stroke="#c99a06" stroke-width="1.5"/>
<path d="M300,90 L318,106 L284,90 Z" fill="#fff3c4" stroke="#c99a06" stroke-width="1.5"/>
<text x="170" y="73" text-anchor="middle" font-size="15" font-weight="700">„Mein neuer Monitor bleibt schwarz.“</text>
<rect x="330" y="58" width="56" height="40" rx="3" fill="#333"/><rect x="335" y="63" width="46" height="30" fill="#111"/><rect x="351" y="98" width="14" height="8" fill="#333"/>
<!-- Fragen -->
<text x="20" y="134" font-size="14" font-weight="700" fill="#555">Du fragst nach:</text>
<g fill="#f4f1ee"><rect x="10" y="144" width="380" height="40" rx="9"/><rect x="10" y="190" width="380" height="40" rx="9"/><rect x="10" y="236" width="380" height="40" rx="9"/></g>
<g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="32" cy="164" r="11" fill="#D4607A"/><text x="32" y="169">1</text>
<circle cx="32" cy="210" r="11" fill="#D4607A"/><text x="32" y="215">2</text>
<circle cx="32" cy="256" r="11" fill="#D4607A"/><text x="32" y="261">3</text>
</g>
<text x="52" y="169" font-size="14">Welche Buchsen hat der <tspan font-weight="700">PC</tspan>?</text>
<text x="52" y="215" font-size="14">Welche Buchsen hat der <tspan font-weight="700">Monitor</tspan>?</text>
<text x="52" y="261" font-size="14">Kabel: <tspan font-weight="700">Anschlussfeld</tspan> oder <tspan font-weight="700">Grafikkarte</tspan>?</text>
<!-- AP1 -->
<rect x="10" y="298" width="380" height="70" rx="10" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<rect x="24" y="310" width="36" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><g stroke="#adb5bd" stroke-width="2"><line x1="30" y1="322" x2="54" y2="322"/><line x1="30" y1="332" x2="54" y2="332"/><line x1="30" y1="342" x2="50" y2="342"/></g>
<text x="74" y="326" font-size="15" font-weight="700">AP1: Hardware nach Datenblatt</text>
<text x="74" y="348" font-size="13">→ Anschlüsse sicher erkennen</text>
</svg>
