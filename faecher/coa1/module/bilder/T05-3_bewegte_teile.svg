<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Festplatte von oben mit zwei bewegten Teilen: Ein Motor dreht die Platten, der Arm schwenkt. Dafür hat die Festplatte einen eigenen Stromanschluss, gezeigt als Stecker mit Blitz. Bewegte Teile erzeugen Wärme (Thermometer), Geräusche (Lautsprecher) und Verschleiß (Zahnrad mit Riss). Zum Vergleich unten eine SSD ohne bewegte Teile: leise, kaum Wärme.</title>
<defs>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="540" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Was sich bewegt, braucht Strom</text>

<!-- HDD -->
<rect x="20" y="44" width="170" height="210" rx="10" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="98" cy="128" r="64" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="98" cy="128" r="12" fill="#555"/>
<!-- Drehpfeil -->
<path d="M34,150 A68,68 0 0 1 60,72" fill="none" stroke="#c62828" stroke-width="3.5" marker-end="url(#r)"/>
<!-- Arm -->
<line x1="166" y1="226" x2="118" y2="86" stroke="#7a7f88" stroke-width="8" stroke-linecap="round"/>
<rect x="110" y="80" width="15" height="11" rx="2" fill="#555"/>
<circle cx="166" cy="226" r="10" fill="#555"/>
<!-- Schwenkpfeil -->
<path d="M152,96 A145,145 0 0 1 178,124" fill="none" stroke="#c62828" stroke-width="3.5" marker-start="url(#r)" marker-end="url(#r)"/>

<g stroke="#333" stroke-width="1.2">
<line x1="206" y1="74" x2="66" y2="68"/>
<line x1="206" y1="140" x2="182" y2="128"/>
</g>
<text x="210" y="74" font-weight="700" fill="#c62828">Motor dreht</text>
<text x="210" y="91" font-weight="700" fill="#c62828">die Platten</text>
<text x="210" y="145" font-weight="700" fill="#c62828">Arm schwenkt</text>

<!-- Stromanschluss -->
<rect x="140" y="254" width="36" height="10" fill="#333"/>
<path d="M158,264 C158,290 210,282 230,282" fill="none" stroke="#333" stroke-width="3"/>
<rect x="230" y="272" width="28" height="20" rx="3" fill="#555"/>
<g stroke="#555" stroke-width="3"><line x1="258" y1="277" x2="268" y2="277"/><line x1="258" y1="287" x2="268" y2="287"/></g>
<path d="M286,262 L276,284 L286,284 L278,304 L298,276 L288,276 L296,262 Z" fill="#f2b705" stroke="#8a6d00" stroke-width="1"/>
<text x="306" y="278" font-weight="700">eigener</text>
<text x="306" y="295" font-weight="700">Strom-</text>
<text x="306" y="312" font-weight="700">anschluss</text>

<!-- Folgen -->
<line x1="200" y1="318" x2="200" y2="338" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<text x="210" y="334" font-size="13">bewegte Teile machen:</text>

<!-- Thermometer -->
<rect x="60" y="348" width="14" height="44" rx="7" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="64" y="362" width="6" height="34" fill="#c62828"/>
<circle cx="67" cy="398" r="11" fill="#c62828" stroke="#555" stroke-width="2"/>
<text x="67" y="432" text-anchor="middle" font-weight="700">Wärme</text>
<!-- Lautsprecher -->
<rect x="176" y="360" width="14" height="22" fill="#555"/>
<path d="M190,360 L208,346 L208,396 L190,382 Z" fill="#555"/>
<g fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round">
<path d="M216,362 A12,12 0 0 1 216,380"/><path d="M222,354 A22,22 0 0 1 222,388"/>
</g>
<text x="200" y="432" text-anchor="middle" font-weight="700">Geräusch</text>
<!-- Zahnrad mit Riss -->
<path d="M354.7,366.3 L362.8,366.7 L362.8,373.3 L354.7,373.7 L353.9,376.8 L352.7,379.7 L359.1,384.9 L355.2,390.2 L348.4,385.8 L345.9,387.8 L343.2,389.5 L345.3,397.3 L339.1,399.4 L336.2,391.8 L333.0,392.0 L329.8,391.8 L326.9,399.4 L320.7,397.3 L322.8,389.5 L320.1,387.8 L317.6,385.8 L310.8,390.2 L306.9,384.9 L313.3,379.7 L312.1,376.8 L311.3,373.7 L303.2,373.3 L303.2,366.7 L311.3,366.3 L312.1,363.2 L313.3,360.3 L306.9,355.1 L310.8,349.8 L317.6,354.2 L320.1,352.2 L322.8,350.5 L320.7,342.7 L326.9,340.6 L329.8,348.2 L333.0,348.0 L336.2,348.2 L339.1,340.6 L345.3,342.7 L343.2,350.5 L345.9,352.2 L348.4,354.2 L355.2,349.8 L359.1,355.1 L352.7,360.3 L353.9,363.2 Z" fill="#7a7f88"/>
<circle cx="333" cy="370" r="8" fill="#fff"/>
<path d="M340,342 L334,352 L341,358 L336,364" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linejoin="round"/>
<text x="333" y="432" text-anchor="middle" font-weight="700">Verschleiß</text>

<!-- SSD Vergleich -->
<rect x="10" y="452" width="380" height="78" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<rect x="28" y="466" width="76" height="50" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="36" y="474" width="26" height="18" fill="#555"/><rect x="68" y="474" width="26" height="18" fill="#555"/>
<text x="66" y="510" text-anchor="middle" font-size="13" font-weight="700">SSD</text>
<text x="120" y="484" font-weight="700" fill="#2e7d32">SSD: keine bewegten Teile</text>
<text x="120" y="506">leise, kaum Wärme</text>
</svg>
