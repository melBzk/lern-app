<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 384" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Drei Fälle für eine externe 2,5-Zoll-Festplatte. USB 2.0 liefert bis 500 mA: genau an der Grenze, Warnzeichen. Y-Kabel an USB 2.0 mit zwei Steckern: zusammen bis 1000 mA gleich 5 W, aber gegen die USB-Regeln, Warnzeichen. USB 3.0 liefert bis 900 mA: sicher ohne extra Strom, Haken.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="384" fill="#fff"/>
<text x="200" y="26" font-size="16" text-anchor="middle" font-weight="700">Reicht der Strom für die 2,5-Zoll-Platte?</text>
<rect x="8" y="44" width="384" height="102" rx="10" fill="#f6f6f6" stroke="#ddd" stroke-width="1.5"/>
<rect x="26.0" y="76.0" width="52" height="36" rx="4" fill="#cfd6de" stroke="#555" stroke-width="1.5"/><circle cx="49" cy="94" r="11.52" fill="#eef1f4" stroke="#555" stroke-width="1.5"/><circle cx="49" cy="94" r="2.5" fill="#555" stroke="none" stroke-width="2"/><line x1="57.2" y1="104.8" x2="71.76" y2="86.8" stroke="#555" stroke-width="2"/>
<text x="52" y="134" font-size="13" text-anchor="middle" font-weight="700" fill="#444">2,5 Zoll</text>
<line x1="80" y1="94" x2="130" y2="94" stroke="#333" stroke-width="3"/><rect x="128" y="87" width="16" height="14" rx="2" fill="#cfd6de" stroke="#555" stroke-width="1.5"/>
<text x="156" y="74" font-size="15" font-weight="700">USB 2.0</text>
<text x="156" y="96" font-size="14">bis 500 mA</text>
<text x="156" y="122" font-size="14" font-weight="700" fill="#E07B00">genau an der Grenze</text>
<path d="M366,105 L377,124.8 L355,124.8 Z" fill="#E07B00" stroke="#E07B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="366" y="122.6" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">!</text>
<rect x="8" y="156" width="384" height="102" rx="10" fill="#f6f6f6" stroke="#ddd" stroke-width="1.5"/>
<rect x="26.0" y="188.0" width="52" height="36" rx="4" fill="#cfd6de" stroke="#555" stroke-width="1.5"/><circle cx="49" cy="206" r="11.52" fill="#eef1f4" stroke="#555" stroke-width="1.5"/><circle cx="49" cy="206" r="2.5" fill="#555" stroke="none" stroke-width="2"/><line x1="57.2" y1="216.8" x2="71.76" y2="198.8" stroke="#555" stroke-width="2"/>
<text x="52" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#444">2,5 Zoll</text>
<path d="M80,206 C100,206 100,186 120,186" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M80,206 C100,206 100,226 120,226" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="120" y="179" width="16" height="14" rx="2" fill="#cfd6de" stroke="#555" stroke-width="1.5"/><rect x="120" y="219" width="16" height="14" rx="2" fill="#cfd6de" stroke="#555" stroke-width="1.5"/>
<text x="156" y="186" font-size="15" font-weight="700">Y-Kabel an USB 2.0</text>
<text x="156" y="208" font-size="14">zusammen bis 1000 mA = 5 W</text>
<text x="156" y="234" font-size="14" font-weight="700" fill="#E07B00">gegen die USB-Regeln</text>
<path d="M366,217 L377,236.8 L355,236.8 Z" fill="#E07B00" stroke="#E07B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="366" y="234.6" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">!</text>
<rect x="8" y="268" width="384" height="102" rx="10" fill="#f6f6f6" stroke="#ddd" stroke-width="1.5"/>
<rect x="26.0" y="300.0" width="52" height="36" rx="4" fill="#cfd6de" stroke="#555" stroke-width="1.5"/><circle cx="49" cy="318" r="11.52" fill="#eef1f4" stroke="#555" stroke-width="1.5"/><circle cx="49" cy="318" r="2.5" fill="#555" stroke="none" stroke-width="2"/><line x1="57.2" y1="328.8" x2="71.76" y2="310.8" stroke="#555" stroke-width="2"/>
<text x="52" y="358" font-size="13" text-anchor="middle" font-weight="700" fill="#444">2,5 Zoll</text>
<line x1="80" y1="318" x2="130" y2="318" stroke="#333" stroke-width="3"/><rect x="128" y="311" width="16" height="14" rx="2" fill="#cfd6de" stroke="#555" stroke-width="1.5"/>
<text x="156" y="298" font-size="15" font-weight="700">USB 3.0</text>
<text x="156" y="320" font-size="14">bis 900 mA</text>
<text x="156" y="346" font-size="14" font-weight="700" fill="#2f6b4f">sicher ohne extra Strom</text>
<circle cx="366" cy="340" r="11" fill="#2f6b4f" stroke="none" stroke-width="2"/><path d="M361.05,340 l3.52,3.96 l7.04,-7.92" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
