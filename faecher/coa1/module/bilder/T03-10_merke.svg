<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 458" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fünf Merksätze mit Symbol. Die Leistung misst ein Benchmark; den Takt nur innerhalb einer Familie und Generation vergleichen. Gleiche Bedingungen: synthetisch mit 3DMark oder PCMark, oder mit eigener Anwendung. Ranglisten auf cpubenchmark.net mit PassMark-Werten; MIPS sind Befehle pro Sekunde, GFLOPS Rechnungen mit Kommazahlen pro Sekunde. CPU-Z liest aus und ist portable, MemTest86 prüft den RAM, Sandra gibt einen Überblick mit Benchmarks. Nicht nur Punkte zählen: Preis, Strom, Abwärme, Garantie.</title>
