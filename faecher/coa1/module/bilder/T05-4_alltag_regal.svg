<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ein Regal mit 4 Reihen und 5 Spalten, Reihen und Spalten sind nummeriert. Im Fach Reihe 2, Spalte 1 steht eine Kerze. Ein Zettel Inhaltsverzeichnis sagt: Kerze, Reihe 2, Spalte 1; ein Pfeil zeigt vom Zettel zum Fach. Darunter eine kleine Festplatte mit dem Zettel: Datei, Spur 17, Sektor 3. Unten ein roter Kasten: Wo der Vergleich hinkt: Im Regalfach liegen mehrere Dinge, im Cluster nur eine Datei.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Regal mit Inhaltsverzeichnis</text>
<text x="211.0" y="50" text-anchor="middle" font-size="13" fill="#555">Spalte</text>
<text x="20" y="160" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90 20 160)">Reihe</text>
<text x="87.0" y="68" text-anchor="middle" font-size="13" font-weight="700">1</text><text x="149.0" y="68" text-anchor="middle" font-size="13" font-weight="700">2</text><text x="211.0" y="68" text-anchor="middle" font-size="13" font-weight="700">3</text><text x="273.0" y="68" text-anchor="middle" font-size="13" font-weight="700">4</text><text x="335.0" y="68" text-anchor="middle" font-size="13" font-weight="700">5</text><text x="44" y="101" text-anchor="middle" font-size="13" font-weight="700">1</text><text x="44" y="141" text-anchor="middle" font-size="13" font-weight="700">2</text><text x="44" y="181" text-anchor="middle" font-size="13" font-weight="700">3</text><text x="44" y="221" text-anchor="middle" font-size="13" font-weight="700">4</text>
<rect x="56" y="76" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="118" y="76" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="180" y="76" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="242" y="76" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="304" y="76" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="56" y="116" width="62" height="40" fill="#fdecea" stroke="#8d6e63" stroke-width="3"/><rect x="118" y="116" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="180" y="116" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="242" y="116" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="304" y="116" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="56" y="156" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="118" y="156" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="180" y="156" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="242" y="156" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="304" y="156" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="56" y="196" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="118" y="196" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="180" y="196" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="242" y="196" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/><rect x="304" y="196" width="62" height="40" fill="#fff" stroke="#8d6e63" stroke-width="2"/>
<rect x="81.0" y="130" width="12" height="22" fill="#fff3c4" stroke="#8a6d00" stroke-width="1.5"/><line x1="87.0" y1="130" x2="87.0" y2="126" stroke="#222" stroke-width="1.5"/><path d="M87.0,118 C92.0,123 90.0,127 87.0,127 C84.0,127 82.0,123 87.0,118 Z" fill="#f2b705"/>
<rect x="190" y="84" width="8" height="30" fill="#3a6ed8"/><rect x="200" y="88" width="8" height="26" fill="#2e7d32"/><rect x="214" y="98" width="18" height="16" rx="3" fill="#bbb"/><rect x="254" y="164" width="8" height="30" fill="#8d6e63"/><circle cx="282" cy="185" r="9" fill="#c9a227"/><rect x="318" y="206" width="8" height="28" fill="#3a6ed8"/><rect x="328" y="210" width="8" height="24" fill="#555"/><rect x="338" y="204" width="8" height="30" fill="#2e7d32"/>

<!-- Zettel Regal -->
<path d="M87.0,252 L87.0,158" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<rect x="20" y="254" width="250" height="62" rx="4" fill="#fffde7" stroke="#8a6d00" stroke-width="1.5"/>
<text x="32" y="276" font-weight="700">Inhaltsverzeichnis</text>
<text x="32" y="302">Kerze → <tspan font-weight="700" fill="#c62828">Reihe 2, Spalte 1</tspan></text>

<!-- Festplatte -->
<text x="200" y="350" text-anchor="middle" font-weight="700" font-size="15">Die Festplatte macht es genauso</text>
<rect x="24" y="364" width="62" height="84" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="55" cy="398" r="25" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/>
<circle cx="55" cy="398" r="5" fill="#555"/>
<line x1="78" y1="436" x2="62" y2="384" stroke="#7a7f88" stroke-width="4" stroke-linecap="round"/>
<line x1="92" y1="406" x2="110" y2="406" stroke="#222" stroke-width="2.5" marker-start="url(#k)"/>
<rect x="114" y="374" width="262" height="62" rx="4" fill="#fffde7" stroke="#8a6d00" stroke-width="1.5"/>
<text x="126" y="396" font-weight="700">Inhaltsverzeichnis</text>
<text x="126" y="422">Datei → <tspan font-weight="700" fill="#c62828">Spur 17, Sektor 3</tspan></text>

<!-- Hinkt -->
<rect x="10" y="466" width="380" height="84" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="200" y="490" text-anchor="middle" font-weight="700" fill="#c62828">Wo der Vergleich hinkt</text>
<text x="200" y="513" text-anchor="middle">Im Regalfach liegen mehrere Dinge –</text>
<text x="200" y="535" text-anchor="middle" font-weight="700">im Cluster nur eine Datei</text>
</svg>
