<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Merkbild in 5 Zeilen: 1 Geschwindigkeit in GHz, 1 GHz = 1 Milliarde Takte pro Sekunde; heute meist ca. 2 bis 4 GHz, Turbo bis ca. 5 GHz. 2 CPU-Takt = Bustakt mal Multiplikator: 99,76 MHz mal 31 ungefähr 3,09 GHz. 3 Takt ist nicht gleich Leistung: auch Befehle pro Takt, Kerne, Cache, Speicheranbindung. 4 SpeedStep und Cool'n'Quiet automatisch runter, Turbo Boost und Turbo Core automatisch rauf. 5 Übertakten von Hand, nur Unlocked (K), viel mehr Wärme, kürzere Lebensdauer.</title>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Das Wichtigste</text>
<rect x="10" y="42" width="380" height="78" rx="10" fill="#f4f5f7"/>
<text x="24" y="68" font-size="15" font-weight="700">1 GHz = 1 Milliarde Takte/s</text>
<text x="24" y="92" font-size="15">heute meist ca. 2–4 GHz,</text>
<text x="24" y="112" font-size="15">Turbo bis ca. 5 GHz</text>
<rect x="10" y="126" width="380" height="78" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<text x="24" y="152" font-size="15" font-weight="700">CPU-Takt = Bustakt × Multiplikator</text>
<text x="24" y="182" font-size="16">99,76 MHz × 31 ≈ <tspan font-weight="700" fill="#c25e00">3,09 GHz</tspan></text>
<rect x="10" y="210" width="380" height="78" rx="10" fill="#f4f5f7"/>
<text x="24" y="236" font-size="15" font-weight="700">Takt ≠ Leistung</text>
<text x="24" y="258" font-size="15">auch: Befehle pro Takt, Kerne,</text>
<text x="24" y="278" font-size="15">Cache, Speicheranbindung</text>
<rect x="10" y="294" width="380" height="82" rx="10" fill="#f4f5f7"/>
<path d="M36,306 V340 M26,330 L36,342 L46,330" stroke="#3a6ed8" stroke-width="4" fill="none"/>
<text x="60" y="324" font-size="15"><tspan font-weight="700" fill="#3a6ed8">runter:</tspan> SpeedStep / Cool'n'Quiet</text>
<path d="M36,372 V350 M26,360 L36,348 L46,360" stroke="#E07B00" stroke-width="4" fill="none"/>
<text x="60" y="362" font-size="15"><tspan font-weight="700" fill="#c25e00">rauf:</tspan> Turbo Boost / Turbo Core</text>
<text x="376" y="344" text-anchor="end" font-size="13" fill="#555">automatisch</text>
<rect x="10" y="382" width="380" height="88" rx="10" fill="#fdecec" stroke="#c62828" stroke-width="2"/>
<text x="24" y="408" font-size="15" font-weight="700">Übertakten = von Hand</text>
<text x="24" y="430" font-size="15">nur Unlocked-Modelle (K)</text>
<text x="24" y="454" font-size="15" fill="#c62828" font-weight="700">viel mehr Wärme, kürzere Lebensdauer</text>
</svg>
