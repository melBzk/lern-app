<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Was ist ein Netzwerk? Drei PCs (PC 1, PC 2, PC 3) sind über Leitungen an einem gemeinsamen Punkt verbunden. Von dort aus nutzen alle gemeinsam: Daten (Ordner), Programme (Fenster mit Zahnrad) und einen Drucker. Merksatz: Netzwerk gleich verbunden plus gemeinsam nutzen.</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
<g id="pc">
<rect x="-30" y="0" width="60" height="42" rx="3" fill="#3a3f4a"/>
<rect x="-25" y="5" width="50" height="32" fill="#dfe9fb"/>
<rect x="-6" y="42" width="12" height="8" fill="#555"/>
<rect x="-17" y="50" width="34" height="5" rx="2" fill="#555"/>
</g>
</defs>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Netzwerk = verbunden + gemeinsam nutzen</text>

<!-- PCs -->
<use href="#pc" x="70" y="52"/>
<use href="#pc" x="200" y="52"/>
<use href="#pc" x="330" y="52"/>
<text x="70" y="126" text-anchor="middle" font-weight="700">PC 1</text>
<text x="200" y="126" text-anchor="middle" font-weight="700">PC 2</text>
<text x="330" y="126" text-anchor="middle" font-weight="700">PC 3</text>

<!-- Verbindungen -->
<g stroke="#3a6ed8" stroke-width="3.5">
<line x1="70" y1="134" x2="200" y2="186"/>
<line x1="200" y1="134" x2="200" y2="186"/>
<line x1="330" y1="134" x2="200" y2="186"/>
</g>
<circle cx="200" cy="190" r="12" fill="#3a6ed8"/>
<text x="220" y="214" font-weight="700" fill="#3a6ed8">verbunden</text>

<!-- gemeinsam nutzen -->
<g stroke="#E07B00" stroke-width="3.5">
<line x1="200" y1="202" x2="80" y2="262" marker-end="url(#ao)"/>
<line x1="200" y1="202" x2="200" y2="262" marker-end="url(#ao)"/>
<line x1="200" y1="202" x2="320" y2="262" marker-end="url(#ao)"/>
</g>

<!-- Daten: Ordner -->
<path d="M40,276 h22 l6,7 h32 v44 h-60 z" fill="#f5c46b" stroke="#b8862b" stroke-width="2"/>
<text x="70" y="352" text-anchor="middle" font-weight="700">Daten</text>

<!-- Programme: Fenster mit Zahnrad -->
<rect x="170" y="274" width="60" height="52" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="170" y="274" width="60" height="10" rx="2" fill="#3a6ed8"/>
<circle cx="200" cy="305" r="12" fill="none" stroke="#555" stroke-width="6" stroke-dasharray="4.7 4.7"/>
<circle cx="200" cy="305" r="9" fill="#555"/>
<circle cx="200" cy="305" r="3.5" fill="#fff"/>
<text x="200" y="352" text-anchor="middle" font-weight="700">Programme</text>

<!-- Drucker -->
<rect x="312" y="270" width="36" height="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
<rect x="298" y="286" width="64" height="30" rx="4" fill="#3a3f4a"/>
<circle cx="352" cy="294" r="3" fill="#1f9d55"/>
<rect x="312" y="308" width="36" height="20" fill="#fff" stroke="#333" stroke-width="1.5"/>
<line x1="318" y1="316" x2="342" y2="316" stroke="#999" stroke-width="1.5"/>
<line x1="318" y1="322" x2="336" y2="322" stroke="#999" stroke-width="1.5"/>
<text x="330" y="352" text-anchor="middle" font-weight="700">Drucker</text>

<rect x="40" y="372" width="320" height="34" rx="8" fill="#fff4e5" stroke="#E07B00" stroke-width="1.5"/>
<text x="200" y="394" text-anchor="middle" font-size="15" font-weight="700">Alle PCs nutzen das gemeinsam</text>
</svg>
