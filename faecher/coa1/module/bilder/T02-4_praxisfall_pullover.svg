<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222">
<title>Suchbild „Finde die 3 Fehler“: Links ein PC, die grüne Betriebslampe leuchtet, das Stromkabel steckt in der Steckdose (Fehler 1). Rechts eine Person im gestreiften Wollpullover (Fehler 2). Ihre Finger berühren die goldenen Kontakte einer Netzwerkkarte (Fehler 3). Die drei Stellen sind mit pinken Fragezeichen 1, 2, 3 markiert.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Finde die 3 Fehler</text>
<!-- Steckdose + Kabel -->
<rect x="20" y="300" width="34" height="34" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="31" cy="317" r="3" fill="#333"/><circle cx="43" cy="317" r="3" fill="#333"/>
<path d="M37,317 C37,280 60,270 70,250" fill="none" stroke="#333" stroke-width="4"/>
<!-- PC -->
<rect x="60" y="110" width="90" height="170" rx="6" fill="#fff" stroke="#333" stroke-width="3.5"/>
<line x1="72" y1="130" x2="138" y2="130" stroke="#333" stroke-width="2"/><line x1="72" y1="140" x2="138" y2="140" stroke="#333" stroke-width="2"/>
<circle cx="105" cy="250" r="9" fill="#2e9d5b"/>
<text x="105" y="298" text-anchor="middle" font-size="13" fill="#2e9d5b" font-weight="700">AN</text>
<!-- Person -->
<circle cx="300" cy="104" r="26" fill="#f2c7a5" stroke="#a0704a" stroke-width="2"/>
<path d="M248,240 L252,160 Q300,132 348,160 L352,240 Z" fill="#b5651d"/>
<g stroke="#e9c08a" stroke-width="5"><line x1="252" y1="178" x2="348" y2="178"/><line x1="251" y1="198" x2="349" y2="198"/><line x1="250" y1="218" x2="350" y2="218"/></g>
<!-- Netzwerkkarte -->
<rect x="170" y="262" width="80" height="40" rx="2" fill="#2e7d4f"/>
<rect x="190" y="270" width="18" height="16" fill="#333"/>
<rect x="176" y="302" width="68" height="8" fill="#e0a54a"/>
<text x="210" y="332" text-anchor="middle" font-size="13">Netzwerkkarte</text>
<!-- Arm zur Karte -->
<path d="M256,180 Q236,250 234,292" fill="none" stroke="#b5651d" stroke-width="16" stroke-linecap="round"/>
<circle cx="232" cy="304" r="9" fill="#f2c7a5" stroke="#a0704a" stroke-width="1.5"/>
<!-- Marker -->
<g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="132" cy="250" r="14" fill="#D4607A"/><text x="132" y="255">1</text>
<circle cx="372" cy="200" r="14" fill="#D4607A"/><text x="372" y="205">2</text>
<circle cx="266" cy="310" r="14" fill="#D4607A"/><text x="266" y="315">3</text>
</g>
<text x="200" y="374" text-anchor="middle" font-size="14" fill="#555">Was läuft hier falsch?</text>
</svg>
