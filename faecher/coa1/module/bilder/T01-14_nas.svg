<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>NAS im Heimnetz. Ein gestrichelter Rahmen zeigt das Heimnetz. In der Mitte steht das NAS, ein Festplattenspeicher im Netzwerk, wie ein gemeinsamer Aktenschrank. PC, Laptop und Handy greifen alle darauf zu. Unten die einfache Lösung: Eine USB-Festplatte an der Fritzbox wird zur Dateizentrale im Netzwerk.</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker></defs>
<rect width="400" height="450" fill="#fff"/>
<rect x="12" y="12" width="376" height="270" rx="12" fill="#f3f8ee" stroke="#2f6b4f" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="26" y="36" font-size="15" font-weight="700" fill="#2f6b4f">dein Heimnetz</text>
<!-- NAS -->
<rect x="170" y="150" width="60" height="80" rx="5" fill="#3a3f4a"/>
<rect x="178" y="160" width="44" height="14" fill="#9aa3ad"/><rect x="178" y="180" width="44" height="14" fill="#9aa3ad"/><rect x="178" y="200" width="44" height="14" fill="#9aa3ad"/>
<circle cx="220" cy="222" r="3" fill="#7fe08a"/>
<text x="200" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#E07B00">NAS</text>
<text x="200" y="270" text-anchor="middle" font-size="13">gemeinsamer Speicher</text>
<!-- Geraete -->
<rect x="40" y="62" width="44" height="30" rx="2" fill="#3a3f4a"/><rect x="44" y="66" width="36" height="22" fill="#dfe9fb"/><rect x="58" y="92" width="8" height="8" fill="#555"/>
<text x="62" y="118" text-anchor="middle" font-size="13">PC</text>
<rect x="176" y="62" width="48" height="30" rx="2" fill="#3a3f4a"/><rect x="180" y="66" width="40" height="22" fill="#dfe9fb"/><path d="M168,92 H232 L226,99 H174 Z" fill="#555"/>
<text x="200" y="118" text-anchor="middle" font-size="13">Laptop</text>
<rect x="326" y="58" width="24" height="42" rx="4" fill="#3a3f4a"/><rect x="329" y="63" width="18" height="30" fill="#dfe9fb"/>
<text x="338" y="118" text-anchor="middle" font-size="13">Handy</text>
<g stroke="#3a6ed8" stroke-width="3" fill="none"><line x1="76" y1="126" x2="166" y2="168" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="200" y1="124" x2="200" y2="146" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="324" y1="126" x2="234" y2="168" marker-start="url(#ar)" marker-end="url(#ar)"/></g>
<!-- USB an Fritzbox -->
<text x="200" y="318" text-anchor="middle" font-size="15" font-weight="700">Einfache Lösung</text>
<g stroke="#333" stroke-width="2.5"><line x1="76" y1="345" x2="76" y2="325"/><line x1="96" y1="345" x2="100" y2="325"/></g>
<rect x="40" y="342" width="96" height="30" rx="5" fill="#3a3f4a"/>
<text x="88" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Fritzbox</text>
<path d="M136,357 H206" stroke="#555" stroke-width="3"/>
<rect x="206" y="340" width="56" height="36" rx="5" fill="#9aa3ad" stroke="#333" stroke-width="1.5"/>
<text x="234" y="363" text-anchor="middle" font-size="13" font-weight="700">USB</text>
<text x="300" y="352" font-size="13">USB-</text>
<text x="300" y="369" font-size="13">Festplatte</text>
<rect x="30" y="392" width="340" height="40" rx="8" fill="#fde3c3" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="417" text-anchor="middle" font-size="15" font-weight="700" fill="#a85a00">→ Dateizentrale im Netzwerk</text>
</svg>
