<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Kette von oben nach unten: Ein Kern mit immer höherem Takt braucht mehr Strom, das macht mehr Wärme, die Lüfter werden lauter, am Ende sind Stabilität und Lebensdauer in Gefahr. Ausweg: mehrere Kerne, jeder niedriger getaktet.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker></defs>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Warum nicht ein schnellerer Kern?</text>

<!-- 1 -->
<rect x="50" y="42" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<rect x="62" y="52" width="26" height="26" rx="4" fill="#3a6ed8"/>
<text x="100" y="70" font-size="15" font-weight="700">Ein Kern, immer höherer Takt</text>
<line x1="200" y1="90" x2="200" y2="116" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- 2 -->
<rect x="50" y="118" width="300" height="46" rx="8" fill="#f4f1ee" stroke="#555" stroke-width="1.5"/>
<path d="M80,124 L66,144 L76,144 L70,160 L88,136 L78,136 Z" fill="#d4a017"/>
<text x="100" y="147" font-size="15" font-weight="700">mehr Strom</text>
<line x1="200" y1="166" x2="200" y2="192" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- 3 -->
<rect x="50" y="194" width="300" height="46" rx="8" fill="#fdf0e0" stroke="#E07B00" stroke-width="1.5"/>
<rect x="72" y="200" width="10" height="26" rx="5" fill="#fff" stroke="#c62828" stroke-width="2"/>
<rect x="75" y="208" width="4" height="20" fill="#c62828"/>
<circle cx="77" cy="230" r="7" fill="#c62828"/>
<text x="100" y="223" font-size="15" font-weight="700">mehr Wärme</text>
<line x1="200" y1="242" x2="200" y2="268" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- 4 -->
<rect x="50" y="270" width="300" height="46" rx="8" fill="#f4f1ee" stroke="#555" stroke-width="1.5"/>
<circle cx="76" cy="293" r="14" fill="none" stroke="#555" stroke-width="2"/>
<path d="M76,293 Q70,281 76,280 Q82,281 76,293 Z M76,293 Q88,287 89,293 Q88,299 76,293 Z M76,293 Q82,305 76,306 Q70,305 76,293 Z M76,293 Q64,299 63,293 Q64,287 76,293 Z" fill="#555"/>
<text x="100" y="299" font-size="15" font-weight="700">lautere Lüfter</text>
<line x1="200" y1="318" x2="200" y2="344" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- 5 Warnung -->
<rect x="50" y="346" width="300" height="60" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2.5"/>
<path d="M76,356 L92,384 L60,384 Z" fill="#c62828"/>
<text x="76" y="381" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">!</text>
<text x="100" y="372" font-size="15" font-weight="700" fill="#c62828">Stabilität und Lebensdauer</text>
<text x="100" y="392" font-size="15" font-weight="700" fill="#c62828">in Gefahr</text>

<!-- Ausweg -->
<line x1="200" y1="408" x2="200" y2="442" stroke="#2f9e44" stroke-width="4" marker-end="url(#g)"/>
<text x="214" y="430" font-size="15" font-weight="700" fill="#2f9e44">Ausweg</text>
<rect x="50" y="446" width="300" height="62" rx="8" fill="#e3f5e8" stroke="#2f9e44" stroke-width="2.5"/>
<g fill="#3a6ed8"><rect x="62" y="456" width="18" height="18" rx="3"/><rect x="84" y="456" width="18" height="18" rx="3"/><rect x="62" y="478" width="18" height="18" rx="3"/><rect x="84" y="478" width="18" height="18" rx="3"/></g>
<text x="114" y="473" font-size="15" font-weight="700" fill="#1f6b30">Mehrere Kerne,</text>
<text x="114" y="494" font-size="15" font-weight="700" fill="#1f6b30">jeder niedriger getaktet</text>
</svg>
