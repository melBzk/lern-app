<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif">
  <title>USB als Baum von oben nach unten: Oben der PC, er verwaltet alle Geräte. Darunter ein USB-Hub, daran Maus, Tastatur, USB-Stick und ein zweiter Hub. Am zweiten Hub hängen Drucker und externe Festplatte. Jedes Gerät bekommt eine eigene ID. Insgesamt sind höchstens 127 Geräte möglich.</title>
  <defs>
    <g id="hubbuchsen" fill="#fff" stroke="#3a6ed8">
      <rect x="-30" y="6" width="11" height="6"/><rect x="-15" y="6" width="11" height="6"/><rect x="0" y="6" width="11" height="6"/><rect x="15" y="6" width="11" height="6"/>
    </g>
  </defs>
  <rect width="400" height="450" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">USB verwaltet viele Geräte</text>

  <!-- Linien -->
  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="200" y1="100" x2="200" y2="134"/>
    <line x1="200" y1="174" x2="200" y2="194"/>
    <line x1="50" y1="194" x2="320" y2="194"/>
    <line x1="50" y1="194" x2="50" y2="222"/>
    <line x1="140" y1="194" x2="140" y2="222"/>
    <line x1="230" y1="194" x2="230" y2="222"/>
    <line x1="320" y1="194" x2="320" y2="222"/>
    <line x1="320" y1="262" x2="320" y2="290"/>
    <line x1="262" y1="290" x2="360" y2="290"/>
    <line x1="262" y1="290" x2="262" y2="314"/>
    <line x1="360" y1="290" x2="360" y2="314"/>
  </g>

  <!-- PC mit Host-Controller -->
  <rect x="110" y="46" width="180" height="54" rx="9" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
  <text x="200" y="69" text-anchor="middle" font-size="15" font-weight="700" fill="#222">PC</text>
  <text x="200" y="88" text-anchor="middle" font-size="13" fill="#3a6ed8">(verwaltet alle Geräte)</text>

  <!-- Hub 1 -->
  <rect x="155" y="134" width="90" height="40" rx="7" fill="#fff" stroke="#3a6ed8" stroke-width="2.5"/>
  <text x="200" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#222">USB-Hub</text>
  <use href="#hubbuchsen" x="202" y="152"/>

  <!-- Geräte Ebene 1 -->
  <g font-size="13" text-anchor="middle" fill="#222">
    <rect x="12" y="222" width="76" height="40" rx="7" fill="#f4f1ee" stroke="#555"/><text x="50" y="247">Maus</text>
    <rect x="102" y="222" width="76" height="40" rx="7" fill="#f4f1ee" stroke="#555"/><text x="140" y="247">Tastatur</text>
    <rect x="192" y="222" width="76" height="40" rx="7" fill="#f4f1ee" stroke="#555"/><text x="230" y="247">USB-Stick</text>
    <rect x="282" y="222" width="76" height="40" rx="7" fill="#fff" stroke="#3a6ed8" stroke-width="2.5"/><text x="320" y="247" font-weight="700">Hub 2</text>
  </g>
  <!-- Geräte Ebene 2 -->
  <g font-size="13" text-anchor="middle" fill="#222">
    <rect x="224" y="314" width="76" height="40" rx="7" fill="#f4f1ee" stroke="#555"/><text x="262" y="339">Drucker</text>
    <rect x="322" y="314" width="72" height="48" rx="7" fill="#f4f1ee" stroke="#555"/><text x="358" y="335">externe</text><text x="358" y="352">Festplatte</text>
  </g>

  <!-- IDs -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="220" y="124" width="38" height="18" rx="9" fill="#D4607A"/><text x="239" y="138">ID 1</text>
    <rect x="58" y="212" width="38" height="18" rx="9" fill="#D4607A"/><text x="77" y="226">ID 2</text>
    <rect x="148" y="212" width="38" height="18" rx="9" fill="#D4607A"/><text x="167" y="226">ID 3</text>
    <rect x="238" y="212" width="38" height="18" rx="9" fill="#D4607A"/><text x="257" y="226">ID 4</text>
    <rect x="328" y="212" width="38" height="18" rx="9" fill="#D4607A"/><text x="347" y="226">ID 5</text>
    <rect x="270" y="304" width="38" height="18" rx="9" fill="#D4607A"/><text x="289" y="318">ID 6</text>
    <rect x="352" y="304" width="38" height="18" rx="9" fill="#D4607A"/><text x="371" y="318">ID 7</text>
  </g>

  <!-- Hinweise -->
  <text x="14" y="300" font-size="13" fill="#222">Hub = Verteiler,</text>
  <text x="14" y="317" font-size="13" fill="#222">zählt selbst als Gerät</text>
  <text x="14" y="334" font-size="13" fill="#222">mit eigener ID</text>

  <rect x="150" y="378" width="240" height="58" rx="10" fill="#f6e4e8" stroke="#D4607A" stroke-width="2.5"/>
  <text x="270" y="402" text-anchor="middle" font-size="14" fill="#222">der PC verwaltet per USB</text>
  <text x="270" y="426" text-anchor="middle" font-size="20" font-weight="700" fill="#D4607A">max. 127 Geräte</text>
</svg>
