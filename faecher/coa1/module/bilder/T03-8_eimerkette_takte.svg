<text x="200" y="308" font-size="13" text-anchor="middle" fill="#444">L laden · D decodieren · O Operanden laden</text>
<text x="200" y="326" font-size="13" text-anchor="middle" fill="#444">A ausführen · S zurückspeichern</text>
<text x="200" y="354" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6b4f">… und so weiter: keine Einheit wartet mehr</text>
<rect x="14" y="370" width="372" height="52" rx="8" fill="#fdebd3" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="392" font-size="15" text-anchor="middle" font-weight="700" fill="#a85a00">Grenze: pro Takt nur 1 neuer Befehl</text>
<text x="200" y="412" font-size="13" text-anchor="middle" fill="#444">(orange Pfeile links)</text>
