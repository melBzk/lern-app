<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Stammbaum der Speicherfamilie. Oben der Systemspeicher mit zwei Ästen. Links RAM: lesen und schreiben, flüchtig; darunter DRAM für den Arbeitsspeicher und SRAM für den Cache, mehr dazu in T03-6. Rechts ROM: nur lesen, behält Daten ohne Strom. Darunter eine Treppe mit fünf Stufen von links unten nach rechts oben: ROM ab Werk fest, PROM einmal beschreibbar, EPROM wird mit UV-Licht gelöscht, EEPROM wird elektrisch gelöscht, Flash schreibt mehrere Bytes auf einmal und steckt in USB-Stick und BIOS-Chip. Ein roter Pfeil neben der Treppe: immer leichter neu zu beschreiben. Unten abgesetzt: Grafikspeicher GDDR auf der Grafikkarte.</title>
<rect width="400" height="530" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="700">Die Speicherfamilie</text>

<!-- Wurzel -->
<rect x="120" y="38" width="160" height="34" rx="6" fill="#555"/>
<text x="200" y="61" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Systemspeicher</text>
<path d="M200,72 V86 H100 V100 M200,86 H300 V100" fill="none" stroke="#555" stroke-width="2.5"/>

<!-- RAM -->
<rect x="10" y="100" width="180" height="70" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="100" y="122" text-anchor="middle" font-size="16" font-weight="700">RAM</text>
<text x="100" y="142" text-anchor="middle">lesen und schreiben</text>
<text x="100" y="161" text-anchor="middle" font-weight="700">flüchtig</text>

<!-- RAM-Blätter -->
<path d="M18,170 V252 M18,205 H26 M18,252 H26" fill="none" stroke="#3a6ed8" stroke-width="2"/>
<rect x="26" y="184" width="124" height="42" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="34" y="201" font-weight="700">DRAM</text>
<text x="34" y="219" font-size="13">→ Arbeitsspeicher</text>
<rect x="26" y="232" width="124" height="40" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="34" y="249" font-weight="700">SRAM</text>
<text x="34" y="266" font-size="13">→ Cache</text>
<text x="12" y="294" font-size="13" fill="#666">mehr in T03-6</text>

<!-- ROM -->
<rect x="210" y="100" width="180" height="70" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="300" y="122" text-anchor="middle" font-size="16" font-weight="700">ROM</text>
<text x="300" y="142" text-anchor="middle" font-weight="700" fill="#c62828">nur lesen</text>
<text x="300" y="161" text-anchor="middle" font-size="13">behält Daten ohne Strom</text>
<line x1="300" y1="170" x2="300" y2="188" stroke="#555" stroke-width="2.5"/>

<!-- Treppe -->
<g stroke="#555" stroke-width="1.5" fill="#fff">
<rect x="10" y="372" width="190" height="44" rx="4"/>
<rect x="60" y="326" width="190" height="44" rx="4"/>
<rect x="110" y="280" width="190" height="44" rx="4"/>
<rect x="162" y="234" width="190" height="44" rx="4"/>
<rect x="196" y="188" width="194" height="44" rx="4" fill="#e8f0fe"/>
</g>

<!-- Stufe 1 ROM: Schloss -->
<path d="M26,393 V388 A6,6 0 0 1 38,388 V393" fill="none" stroke="#555" stroke-width="2.5"/>
<rect x="22" y="393" width="20" height="14" rx="2" fill="#555"/>
<text x="54" y="390" font-weight="700">ROM</text>
<text x="54" y="408" font-size="13">ab Werk fest</text>

<!-- Stufe 2 PROM: Stift -->
<line x1="72" y1="360" x2="90" y2="338" stroke="#555" stroke-width="6" stroke-linecap="round"/>
<path d="M68,364 L71,355 L76,359 Z" fill="#555"/>
<text x="104" y="344" font-weight="700">PROM</text>
<text x="104" y="362" font-size="13">1× beschreibbar</text>

<!-- Stufe 3 EPROM: UV-Lampe -->
<path d="M122,290 H142 L138,298 H126 Z" fill="#555"/>
<g stroke="#7b1fa2" stroke-width="2.5" stroke-linecap="round">
<line x1="132" y1="302" x2="132" y2="316"/>
<line x1="125" y1="301" x2="120" y2="314"/>
<line x1="139" y1="301" x2="144" y2="314"/>
</g>
<text x="154" y="298" font-weight="700">EPROM</text>
<text x="154" y="316" font-size="13">UV-Licht löscht</text>

<!-- Stufe 4 EEPROM: Blitz -->
<path d="M188,240 L176,258 H184 L178,272 L194,252 H186 L192,240 Z" fill="#f9a825" stroke="#555" stroke-width="1.2" stroke-linejoin="round"/>
<text x="206" y="252" font-weight="700">EEPROM</text>
<text x="206" y="270" font-size="13">elektrisch löschen</text>

<!-- Stufe 5 Flash: USB-Stick und BIOS-Chip -->
<text x="204" y="206" font-weight="700">Flash</text>
<text x="204" y="224" font-size="13">mehrere Bytes auf einmal</text>
<rect x="262" y="195" width="30" height="13" rx="3" fill="#555"/>
<rect x="292" y="198" width="9" height="7" fill="#9aa5b1"/>
<rect x="314" y="192" width="44" height="22" rx="2" fill="#555"/>
<g stroke="#555" stroke-width="1.5"><path d="M320,189 v3 M328,189 v3 M336,189 v3 M344,189 v3 M352,189 v3 M320,214 v3 M328,214 v3 M336,214 v3 M344,214 v3 M352,214 v3"/></g>
<text x="336" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BIOS</text>

<!-- Pfeil: immer leichter -->
<line x1="262" y1="410" x2="378" y2="257" stroke="#c62828" stroke-width="4"/>
<polygon points="386,247 383.1,262.3 371.9,253.9" fill="#c62828"/>
<text x="392" y="436" text-anchor="end" font-weight="700" fill="#c62828">immer leichter</text>
<text x="392" y="454" text-anchor="end" font-weight="700" fill="#c62828">neu zu beschreiben</text>

<!-- Grafikspeicher abgesetzt -->
<rect x="10" y="476" width="380" height="42" rx="6" fill="#f5f5f5" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="200" y="502" text-anchor="middle" font-weight="700">Grafikspeicher (GDDR) – auf der Grafikkarte</text>
</svg>
