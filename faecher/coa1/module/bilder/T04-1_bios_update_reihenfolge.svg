<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Reihenfolge beim BIOS-Update, von links nach rechts. Schritt 1: Die alte CPU ist im Mainboard, der PC ist an. Schritt 2: Das BIOS wird aktualisiert, Fortschrittsbalken; Warnung: Strom nicht trennen! Schritt 3: PC aus, neue CPU einsetzen. Unten durchgestrichen die falsche Reihenfolge: neue CPU zuerst, dann startet der PC eventuell nicht.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">Erst BIOS-Update, dann neue CPU</text>

<!-- Nummern und Pfeile -->
<g fill="#3a6ed8"><circle cx="70" cy="58" r="15"/><circle cx="200" cy="58" r="15"/><circle cx="330" cy="58" r="15"/></g>
<g font-size="16" font-weight="700" fill="#fff" text-anchor="middle"><text x="70" y="64">1</text><text x="200" y="64">2</text><text x="330" y="64">3</text></g>
<g stroke="#3a6ed8" stroke-width="3"><line x1="90" y1="58" x2="170" y2="58"/><line x1="220" y1="58" x2="300" y2="58"/></g>
<g fill="#3a6ed8"><path d="M168,50 L182,58 L168,66 Z"/><path d="M298,50 L312,58 L298,66 Z"/></g>

<!-- Karten -->
<g fill="#fff" stroke="#ccc" stroke-width="1.5"><rect x="10" y="80" width="120" height="190" rx="10"/><rect x="140" y="80" width="120" height="190" rx="10"/><rect x="270" y="80" width="120" height="190" rx="10"/></g>

<!-- 1 -->
<rect x="24" y="94" width="92" height="74" rx="3" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="48" y="109" width="44" height="44" rx="3" fill="#555"/>
<text x="70" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">alt</text>
<circle cx="70" cy="196" r="15" fill="#2e7d32"/>
<path d="M64,191 A8,8 0 1,0 76,191" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="70" y1="185" x2="70" y2="196" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<text x="70" y="234" text-anchor="middle" font-size="15" font-weight="700">alte CPU drin</text>
<text x="70" y="254" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="700">PC an</text>

<!-- 2 -->
<g stroke="#555" stroke-width="2"><line x1="182" y1="96" x2="182" y2="136"/><line x1="194" y1="96" x2="194" y2="136"/><line x1="206" y1="96" x2="206" y2="136"/><line x1="218" y1="96" x2="218" y2="136"/></g>
<rect x="172" y="100" width="56" height="32" rx="3" fill="#555"/>
<text x="200" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">BIOS</text>
<rect x="152" y="146" width="96" height="14" rx="3" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<rect x="154" y="148" width="60" height="10" rx="2" fill="#3a6ed8"/>
<text x="200" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6ed8">Update</text>
<path d="M200,190 L216,218 L184,218 Z" fill="#c62828"/>
<text x="200" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">!</text>
<text x="200" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">Strom nicht</text>
<text x="200" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828">trennen!</text>

<!-- 3 -->
<rect x="302" y="96" width="56" height="16" rx="2" fill="#555"/>
<path d="M304,98 L312,98 L304,106 Z" fill="#E07B00"/>
<text x="340" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">neu</text>
<line x1="330" y1="116" x2="330" y2="130" stroke="#E07B00" stroke-width="3.5"/>
<path d="M323,129 L337,129 L330,140 Z" fill="#E07B00"/>
<rect x="294" y="144" width="72" height="22" rx="2" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<circle cx="330" cy="196" r="15" fill="#9aa5b1"/>
<path d="M324,191 A8,8 0 1,0 336,191" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<line x1="330" y1="185" x2="330" y2="196" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<text x="330" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#555">PC aus,</text>
<text x="330" y="254" text-anchor="middle" font-size="15" font-weight="700">neue CPU rein</text>

<!-- Falsch -->
<rect x="10" y="290" width="380" height="116" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<circle cx="46" cy="348" r="20" fill="#c62828"/>
<path d="M37,339 L55,357 M55,339 L37,357" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
<text x="80" y="318" font-size="14" font-weight="700" fill="#c62828">Falsche Reihenfolge:</text>
<text x="80" y="346" font-size="16" font-weight="700">neue CPU zuerst</text>
<line x1="78" y1="341" x2="197" y2="341" stroke="#c62828" stroke-width="3"/>
<text x="80" y="374" font-size="15">→ PC startet evtl. nicht –</text>
<text x="80" y="394" font-size="15">dann geht auch kein Update</text>
</svg>
