<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 438" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fünf Merksätze mit Symbol. Legacy: RS232, Parallel-Port und PS/2, heute ersetzt durch USB. USB liefert 5 V mit max. 500 mA gleich 2,5 W, ab USB 3.0 bis 900 mA. USB-3.0-Geräte laufen an USB 2.0 nur mit Hi-Speed, 480 Mbit/s. Thunderbolt bündelt USB, DisplayPort und PCIe; Thunderbolt 3 hat 40 Gbit/s, Kette bis 7 Geräte. Heute marktüblich: USB 3.x und USB4 über USB-C.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="438" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Merke</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<path d="M26,72.0 h44 l-5,22 h-34 Z" fill="#cfd6de" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="80.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="41" cy="80.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="48" cy="80.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="55" cy="80.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="62" cy="80.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="38" cy="88.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="45" cy="88.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="52" cy="88.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="59" cy="88.0" r="1.8" fill="#333" stroke="none" stroke-width="2"/><circle cx="72" cy="68.0" r="9" fill="#fff" stroke="#555" stroke-width="1.5"/><line x1="72" y1="68.0" x2="72" y2="62.0" stroke="#555" stroke-width="1.5"/><line x1="72" y1="68.0" x2="76" y2="70.0" stroke="#555" stroke-width="1.5"/>
<text x="100" y="80.0" font-size="15" font-weight="700" fill="#1d3f8a">Legacy</text>
<text x="100" y="101.0" font-size="14">RS232, Parallel-Port, PS/2 – heute USB</text>
<line x1="15" y1="122" x2="385" y2="122" stroke="#ddd" stroke-width="1"/>
<rect x="26" y="148.0" width="30" height="24" rx="3" fill="#cfd6de" stroke="#555" stroke-width="1.8"/><path d="M69.6,145.6 l-10.8,16.2 h7.2 l-3.6,12.6 l10.8,-16.2 h-7.2 Z" fill="#f2c230" stroke="#a07800" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="165.0" font-size="13" text-anchor="middle" font-weight="700">5V</text>
<text x="100" y="156.0" font-size="15" font-weight="700" fill="#E07B00">USB: 5 V, max. 500 mA = 2,5 W</text>
<text x="100" y="177.0" font-size="14">ab USB 3.0 bis 900 mA</text>
<line x1="15" y1="198" x2="385" y2="198" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="220.0" width="28" height="32" rx="4" fill="#cfd6de" stroke="#555" stroke-width="1.8"/><text x="32" y="241.0" font-size="13" text-anchor="middle" font-weight="700">2.0</text><rect x="54" y="226.0" width="26" height="20" rx="3" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><text x="67" y="241.0" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">3.0</text>
<text x="100" y="232.0" font-size="15" font-weight="700" fill="#1d3f8a">USB 3.0 an USB 2.0</text>
<text x="100" y="253.0" font-size="14">nur Hi-Speed (480 Mbit/s)</text>
<line x1="15" y1="274" x2="385" y2="274" stroke="#ddd" stroke-width="1"/>
<path d="M52.8,292.8 l-14.399999999999999,21.599999999999998 h9.6 l-4.8,16.8 l14.399999999999999,-21.599999999999998 h-9.6 Z" fill="#f2c230" stroke="#a07800" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="300.0" font-size="15" font-weight="700" fill="#1d3f8a">Thunderbolt</text>
<text x="100" y="320.0" font-size="14">bündelt USB, DisplayPort, PCIe;</text>
<text x="100" y="338.0" font-size="14">TB 3 = 40 Gbit/s, Kette bis 7 Geräte</text>
<line x1="15" y1="350" x2="385" y2="350" stroke="#ddd" stroke-width="1"/>
<rect x="20" y="377.0" width="56" height="22" rx="11" fill="#cfd6de" stroke="#333" stroke-width="2"/><rect x="32" y="385.0" width="32" height="6" rx="3" fill="#555" stroke="none" stroke-width="0"/>
<text x="100" y="384.0" font-size="15" font-weight="700" fill="#1d3f8a">heute marktüblich</text>
<text x="100" y="405.0" font-size="14">USB 3.x und USB4 über USB-C</text>
<line x1="15" y1="426" x2="385" y2="426" stroke="#ddd" stroke-width="1"/>
</svg>
