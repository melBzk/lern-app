<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Vergrößertes Raster aus Bildpunkten, den Pixeln. Oben ein Pfeil: Breite 1024 Pixel. Links ein Pfeil: Höhe 768 Pixel. Ein Pixel ist herausgezogen und vergrößert: Es besteht aus drei schmalen Streifen in Rot, Grün und Blau. 1 Pixel gleich 3 Subpixel, R G B.</title>
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Pixel, Subpixel und Auflösung</text>

  <!-- Breite -->
  <line x1="100" y1="72" x2="338" y2="72" stroke="#333" stroke-width="2" marker-start="url(#pg)" marker-end="url(#pg)"/>
  <rect x="149.0" y="60" width="140" height="22" fill="#fff"/>
  <text x="219.0" y="77" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Breite: 1024 Pixel</text>
  <!-- Hoehe -->
  <line x1="78" y1="90" x2="78" y2="260" stroke="#333" stroke-width="2" marker-start="url(#pg)" marker-end="url(#pg)"/>
  <rect x="67" y="111.0" width="22" height="128" fill="#fff"/>
  <text x="83" y="175.0" text-anchor="middle" font-size="15" font-weight="700" fill="#222" transform="rotate(-90 83 175.0)">Höhe: 768 Pixel</text>

