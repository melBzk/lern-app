<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ein Metronom als Taktgeber, darunter eine Rechteckkurve mit nummerierten Zacken: 1 Zacke ist 1 Takt; ein Befehl braucht meist mehrere Takte. Treppe: 1 Hz ist 1 Takt pro Sekunde, 1 kHz 1.000, 1 MHz 1 Million, 1 GHz 1 Milliarde Takte pro Sekunde.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker></defs>
<rect width="400" height="480" fill="#fff"/>
<text x="200.0" y="26" font-size="17" text-anchor="middle" font-weight="700" >Der Takt – der Herzschlag der CPU</text>
<path d="M170,120 L186,44 L214,44 L230,120 Z" fill="#f4f1ee" stroke="#222" stroke-width="2" />
<line x1="200" y1="110" x2="220" y2="54" stroke="#E07B00" stroke-width="3" />
<circle cx="214" cy="72" r="5" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="244" y="88" font-size="16" font-weight="700" >Taktgeber</text>
<path d="M20,196 L30,196 L30,156 L59,156 L59,196 L88,196 L88,156 L117,156 L117,196 L146,196 L146,156 L175,156 L175,196 L204,196 L204,156 L233,156 L233,196 L262,196 L262,156 L291,156 L291,196 L320,196 L320,156 L349,156 L349,196 L380,196" fill="none" stroke="#E07B00" stroke-width="3" />
<text x="44.5" y="148" font-size="14" text-anchor="middle" font-weight="700" >1</text>
<text x="102.5" y="148" font-size="14" text-anchor="middle" font-weight="700" >2</text>
<text x="160.5" y="148" font-size="14" text-anchor="middle" font-weight="700" >3</text>
<text x="218.5" y="148" font-size="14" text-anchor="middle" font-weight="700" >4</text>
<text x="276.5" y="148" font-size="14" text-anchor="middle" font-weight="700" >5</text>
<text x="334.5" y="148" font-size="14" text-anchor="middle" font-weight="700" >6</text>
<text x="200" y="220" font-size="16" text-anchor="middle" font-weight="700" fill="#E07B00" >1 Zacke = 1 Takt</text>
<text x="200" y="238" font-size="13" text-anchor="middle" fill="#555" >Ein Befehl braucht meist mehrere Takte.</text>
<rect x="10" y="246" width="376" height="40" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5" />
<text x="22" y="272" font-size="15" font-weight="700" fill="#3a6ed8" >1 Hz</text>
<text x="82" y="272" font-size="14" >= 1 Takt pro Sekunde</text>
<rect x="28" y="298" width="358" height="40" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5" />
<text x="40" y="324" font-size="15" font-weight="700" fill="#3a6ed8" >1 kHz</text>
<text x="100" y="324" font-size="14" >= 1.000 Takte</text>
<rect x="46" y="350" width="340" height="40" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5" />
<text x="58" y="376" font-size="15" font-weight="700" fill="#3a6ed8" >1 MHz</text>
<text x="118" y="376" font-size="14" >= 1.000.000 (1 Million)</text>
<rect x="64" y="402" width="322" height="40" rx="6" fill="#fdf0e0" stroke="#E07B00" stroke-width="2" />
<text x="76" y="428" font-size="15" font-weight="700" fill="#E07B00" >1 GHz</text>
<text x="136" y="428" font-size="14" font-weight="700" >= 1.000.000.000 (1 Milliarde)</text>
<text x="200" y="470" font-size="14" text-anchor="middle" fill="#555" >jede Stufe: × 1.000</text>
</svg>
