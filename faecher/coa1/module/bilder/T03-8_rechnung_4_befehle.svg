<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 542" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Rechenweg 4 Befehle, Zeitplan mit Takt 1 bis 8. Nur Pipeline: Befehl 1 bis 4 starten nacheinander in Takt 1, 2, 3, 4; fertig nach 5 plus 3 gleich 8 Takten. Superskalar mit doppelten Einheiten: Befehl 1 und 2 starten in Takt 1, Befehl 3 und 4 in Takt 2; fertig nach 6 Takten. Ohne Pipeline wären es 4 mal 5 gleich 20 Takte. Idealfall.</title>
