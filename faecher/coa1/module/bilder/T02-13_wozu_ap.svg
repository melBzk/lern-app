<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, sans-serif" fill="#222">
<title>Wozu: AP1 etwa zur Hälfte der Umschulung: Gefahren wie Stromausfall erkennen und eine USV vorschlagen, außerdem Energieeffizienz und Energiekosten berechnen. AP2 am Ende: Redundanz und USV für Server planen, USV-Leistung und Überbrückungszeit berechnen, das lernst du später.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Wo du das brauchst</text>
<line x1="20" y1="54" x2="380" y2="54" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<circle cx="200" cy="54" r="9" fill="#3a6ed8"/><circle cx="360" cy="54" r="9" fill="#7b3fa0"/>
<text x="200" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">AP1 (Mitte)</text>
<text x="392" y="80" text-anchor="end" font-size="15" font-weight="700" fill="#7b3fa0">AP2 (Ende)</text>
<!-- AP1 -->
<rect x="10" y="94" width="380" height="132" rx="10" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="22" y="118" font-size="15" font-weight="700" fill="#3a6ed8">AP1</text>
<path d="M40,138 l-12,26 h10 l-6,22 l20,-30 h-10 l8,-18 Z" fill="#E07B00"/>
<text x="70" y="152" font-size="14"><tspan font-weight="700">Stromausfall</tspan> erkennen</text>
<text x="70" y="172" font-size="14">→ <tspan font-weight="700">USV</tspan> vorschlagen</text>
<text x="70" y="206" font-size="14"><tspan font-weight="700">Energieeffizienz</tspan> und Kosten berechnen</text>
<!-- AP2 -->
<rect x="10" y="238" width="380" height="132" rx="10" fill="#f3e9f8" stroke="#7b3fa0" stroke-width="2"/>
<text x="22" y="262" font-size="15" font-weight="700" fill="#7b3fa0">AP2</text>
<rect x="24" y="278" width="16" height="22" rx="2" fill="#3a3f4a"/><rect x="44" y="278" width="16" height="22" rx="2" fill="#3a3f4a"/>
<text x="70" y="294" font-size="14"><tspan font-weight="700">Redundanz</tspan> und USV für Server planen</text>
<rect x="24" y="316" width="36" height="22" rx="3" fill="#1f9d55"/>
<text x="70" y="326" font-size="14"><tspan font-weight="700">USV-Leistung</tspan> und Überbrückungszeit</text>
<text x="70" y="346" font-size="14">berechnen</text>
<text x="378" y="360" text-anchor="end" font-size="13" fill="#555">lernst du später</text>
</svg>
