<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 472" font-family="system-ui, sans-serif" role="img">
  <title>Speicher-Treppe von unten nach oben: Bit, Byte, KB (Kilo), MB (Mega), GB (Giga), TB (Tera), PB (Peta), EB (Exa), ZB (Zetta), YB (Yotta). 1 Byte = 8 Bit, jede weitere Stufe = 1024 der Stufe darunter (EDV), bei Herstellern 1000. Zetta kommt vor Yotta. Geht man eine Stufe hoch, teilt man die Zahl, geht man runter, nimmt man mal. Beispiel: 2048 MB = 2 GB.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="472" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Die Speicher-Treppe</text>
  <text x="200" y="54" text-anchor="middle" font-size="14" font-weight="400" fill="#444">je Stufe: EDV × 1024 · Hersteller × 1000</text>
  <rect x="66" y="396" width="120" height="32" rx="4" fill="#eef0f3" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="76" y="418" text-anchor="start" font-size="15" font-weight="700" fill="#222">Bit</text>
  <rect x="80" y="360" width="120" height="32" rx="4" fill="#eef0f3" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="90" y="382" text-anchor="start" font-size="15" font-weight="700" fill="#222">Byte</text>
  <text x="208" y="382" text-anchor="start" font-size="14" font-weight="700" fill="#e8590c">= 8 Bit</text>
  <rect x="94" y="324" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="104" y="346" text-anchor="start" font-size="15" font-weight="700" fill="#222">KB <tspan font-weight="400" fill="#555">Kilo</tspan></text>
  <text x="222" y="346" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 Byte</text>
  <rect x="108" y="288" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="118" y="310" text-anchor="start" font-size="15" font-weight="700" fill="#222">MB <tspan font-weight="400" fill="#555">Mega</tspan></text>
  <text x="236" y="310" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 KB</text>
  <rect x="122" y="252" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="132" y="274" text-anchor="start" font-size="15" font-weight="700" fill="#222">GB <tspan font-weight="400" fill="#555">Giga</tspan></text>
  <text x="250" y="274" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 MB</text>
  <rect x="136" y="216" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="146" y="238" text-anchor="start" font-size="15" font-weight="700" fill="#222">TB <tspan font-weight="400" fill="#555">Tera</tspan></text>
  <text x="264" y="238" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 GB</text>
  <rect x="150" y="180" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="160" y="202" text-anchor="start" font-size="15" font-weight="700" fill="#222">PB <tspan font-weight="400" fill="#555">Peta</tspan></text>
  <text x="278" y="202" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 TB</text>
  <rect x="164" y="144" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="174" y="166" text-anchor="start" font-size="15" font-weight="700" fill="#222">EB <tspan font-weight="400" fill="#555">Exa</tspan></text>
  <text x="292" y="166" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 PB</text>
  <rect x="178" y="108" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#e8590c" stroke-width="2.5"/>
  <text x="188" y="130" text-anchor="start" font-size="15" font-weight="700" fill="#222">ZB <tspan font-weight="400" fill="#555">Zetta</tspan></text>
  <text x="306" y="130" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 EB</text>
  <rect x="192" y="72" width="120" height="32" rx="4" fill="#dbe6fb" stroke="#e8590c" stroke-width="2.5"/>
  <text x="202" y="94" text-anchor="start" font-size="15" font-weight="700" fill="#222">YB <tspan font-weight="400" fill="#555">Yotta</tspan></text>
  <text x="320" y="94" text-anchor="start" font-size="14" font-weight="400" fill="#333">= 1024 ZB</text>
  <text x="170" y="104" text-anchor="end" font-size="14" font-weight="700" fill="#e8590c">Zetta vor</text>
  <text x="170" y="122" text-anchor="end" font-size="14" font-weight="700" fill="#e8590c">Yotta!</text>
  <line x1="26" y1="380" x2="26" y2="150" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="44" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#222" transform="rotate(-90 44 265)">Stufe hoch: Zahl ÷</text>
  <line x1="66" y1="150" x2="66" y2="300" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="84" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#222" transform="rotate(-90 84 225)">runter: Zahl ×</text>
  <text x="200" y="456" text-anchor="middle" font-size="14" font-weight="400" fill="#444">Beispiel: 2048 MB = 2 GB  (2048 ÷ 1024)</text>

</svg>
