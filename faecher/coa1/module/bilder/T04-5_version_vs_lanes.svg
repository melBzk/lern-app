<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die zwei Zahlen in PCIe 3.0 x16. Pfeil auf 3.0: Version gleich Tempo je Spur, wie schnell jedes Auto fährt. Pfeil auf x16: Zahl der Spuren, wie breit die Straße ist. Unten zwei Straßen mit gleichem Ergebnis: PCIe 3.0 x16 mit 16 Spuren mal 985 MB/s und PCIe 4.0 x8 mit 8 schnelleren Spuren mal 1969 MB/s ergeben beide etwa 15,75 GB/s.</title>
<defs>
<g id="r16"><rect x="26" y="1" width="12" height="3" rx="1" fill="#9ec0ff"/><rect x="66" y="1" width="12" height="3" rx="1" fill="#9ec0ff"/><rect x="106" y="1" width="12" height="3" rx="1" fill="#9ec0ff"/><rect x="146" y="1" width="12" height="3" rx="1" fill="#9ec0ff"/><rect x="186" y="1" width="12" height="3" rx="1" fill="#9ec0ff"/><rect x="226" y="1" width="12" height="3" rx="1" fill="#9ec0ff"/></g>
<g id="r8"><g stroke="#ffb74d" stroke-width="1.5"><line x1="30" y1="3" x2="46" y2="3"/><line x1="30" y1="7" x2="46" y2="7"/><line x1="110" y1="3" x2="126" y2="3"/><line x1="110" y1="7" x2="126" y2="7"/><line x1="190" y1="3" x2="206" y2="3"/><line x1="190" y1="7" x2="206" y2="7"/></g><rect x="48" y="2" width="16" height="6" rx="2" fill="#9ec0ff"/><rect x="128" y="2" width="16" height="6" rx="2" fill="#9ec0ff"/><rect x="208" y="2" width="16" height="6" rx="2" fill="#9ec0ff"/></g>
</defs>
<rect width="400" height="540" fill="#fff"/>

<!-- Schriftzug -->
<text x="20" y="66" font-size="42" font-weight="700">PCIe</text>
<text x="180" y="66" font-size="42" font-weight="700" text-anchor="middle" fill="#3a6ed8">3.0</text>
<text x="290" y="66" font-size="42" font-weight="700" text-anchor="middle" fill="#E07B00">x16</text>
<g stroke-width="3"><line x1="170" y1="78" x2="124" y2="110" stroke="#3a6ed8"/><line x1="292" y1="78" x2="296" y2="108" stroke="#E07B00"/></g>
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(116,116) rotate(145)" fill="#3a6ed8"/>
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(297,118) rotate(82)" fill="#E07B00"/>

<rect x="10" y="122" width="186" height="100" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="103" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6ed8">Version</text>
<text x="103" y="168" text-anchor="middle" font-weight="700">= Tempo je Spur</text>
<text x="103" y="190" text-anchor="middle" font-size="13" fill="#444">wie schnell jedes</text>
<text x="103" y="207" text-anchor="middle" font-size="13" fill="#444">Auto fährt</text>

<rect x="204" y="122" width="186" height="100" rx="8" fill="#fff3e0" stroke="#E07B00" stroke-width="2"/>
<text x="297" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#E07B00">Lanes</text>
<text x="297" y="168" text-anchor="middle" font-weight="700">= Zahl der Spuren</text>
<text x="297" y="190" text-anchor="middle" font-size="13" fill="#444">wie breit die</text>
<text x="297" y="207" text-anchor="middle" font-size="13" fill="#444">Straße ist</text>

<line x1="10" y1="244" x2="390" y2="244" stroke="#ccc" stroke-width="1.5"/>
<text x="200" y="270" text-anchor="middle" font-size="16" font-weight="700">Zwei Wege, gleiches Ergebnis</text>

<!-- Straße 1: 16 Spuren -->
<text x="16" y="298"><tspan font-weight="700">PCIe 3.0 x16:</tspan> 16 Spuren × 985 MB/s</text>
<rect x="16" y="308" width="240" height="80" fill="#555"/>
<use xlink:href="#r16" x="0" y="308"/><use xlink:href="#r16" x="18" y="313"/><use xlink:href="#r16" x="6" y="318"/><use xlink:href="#r16" x="14" y="323"/>
<use xlink:href="#r16" x="2" y="328"/><use xlink:href="#r16" x="16" y="333"/><use xlink:href="#r16" x="8" y="338"/><use xlink:href="#r16" x="0" y="343"/>
<use xlink:href="#r16" x="12" y="348"/><use xlink:href="#r16" x="4" y="353"/><use xlink:href="#r16" x="18" y="358"/><use xlink:href="#r16" x="10" y="363"/>
<use xlink:href="#r16" x="2" y="368"/><use xlink:href="#r16" x="14" y="373"/><use xlink:href="#r16" x="6" y="378"/><use xlink:href="#r16" x="16" y="383"/>
<rect x="266" y="318" width="124" height="60" rx="8" fill="#eceff1"/>
<text x="328" y="344" text-anchor="middle" font-size="17" font-weight="700">≈ 15,75</text>
<text x="328" y="366" text-anchor="middle" font-size="15" font-weight="700">GB/s</text>

<!-- Straße 2: 8 schnellere Spuren -->
<text x="16" y="428"><tspan font-weight="700">PCIe 4.0 x8:</tspan> 8 Spuren × 1969 MB/s</text>
<rect x="16" y="438" width="240" height="80" fill="#555"/>
<use xlink:href="#r8" x="0" y="438"/><use xlink:href="#r8" x="12" y="448"/><use xlink:href="#r8" x="4" y="458"/><use xlink:href="#r8" x="16" y="468"/>
<use xlink:href="#r8" x="8" y="478"/><use xlink:href="#r8" x="0" y="488"/><use xlink:href="#r8" x="14" y="498"/><use xlink:href="#r8" x="6" y="508"/>
<text x="136" y="534" text-anchor="middle" font-size="13" fill="#444">halb so viele Spuren, doppelt so schnell</text>
<rect x="266" y="448" width="124" height="60" rx="8" fill="#eceff1"/>
<text x="328" y="474" text-anchor="middle" font-size="17" font-weight="700">≈ 15,75</text>
<text x="328" y="496" text-anchor="middle" font-size="15" font-weight="700">GB/s</text>
</svg>
