<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" role="img">
  <title>Wozu du die Zeichen brauchst. Lernfeld 2 nennt Normen und Vorschriften für elektrische Geräte, also Zertifikate und Kennzeichnung, und Ergonomie. In der AP1 bestimmst du die Energieeffizienz von IT-Systemen; Stand-by-Werte wie bei Energy Star und TCO sind typische Angaben. Im Job achtest du beim Kauf im Datenblatt auf diese Zeichen.</title>
  <rect width="400" height="400" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Prüfung und Praxis</text>

  <rect x="8" y="42" width="384" height="104" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <text x="24" y="68" font-size="16" font-weight="700" fill="#222">Lernfeld 2</text>
  <g><rect x="24" y="82" width="44" height="24" rx="3" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="46" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#222">CE</text>
     <rect x="74" y="82" width="44" height="24" rx="3" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="96" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#222">GS</text></g>
  <text x="132" y="99" font-size="14" fill="#333">Normen, Kennzeichnung</text>
  <text x="24" y="132" font-size="14" fill="#333">und</text><text x="54" y="132" font-size="14" font-weight="700" fill="#222">Ergonomie</text>

  <rect x="8" y="156" width="384" height="104" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <text x="24" y="182" font-size="16" font-weight="700" fill="#222">AP1: Energieeffizienz</text>
  <path d="M40,198 l-12,26 h12 l-7,24 l21,-33 h-12 l9,-17 z" fill="#f2c200" stroke="#a88600"/>
  <text x="76" y="218" font-size="14" fill="#333">Stand-by-Werte, z. B.</text>
  <text x="76" y="240" font-size="14" font-weight="700" fill="#222">Energy Star · TCO</text>

  <rect x="8" y="270" width="384" height="116" rx="12" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <text x="24" y="296" font-size="16" font-weight="700" fill="#b35f00">Im Job: beim Kauf</text>
  <rect x="24" y="308" width="62" height="66" rx="4" fill="#fff" stroke="#3a3f4a" stroke-width="2"/>
  <g stroke="#999" stroke-width="2"><line x1="30" y1="322" x2="80" y2="322"/><line x1="30" y1="334" x2="80" y2="334"/></g>
  <rect x="34" y="344" width="42" height="20" rx="3" fill="#fff" stroke="#E07B00" stroke-width="2"/>
  <text x="104" y="336" font-size="15" fill="#222">im Datenblatt</text>
  <text x="104" y="358" font-size="15" font-weight="700" fill="#222">auf die Zeichen achten</text>
</svg>
