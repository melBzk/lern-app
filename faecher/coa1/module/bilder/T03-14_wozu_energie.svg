<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Rechenweg Energie gleich Leistung mal Zeit: Steckdose mit 1000 Watt mal Uhr mit 24 Stunden ergibt 24 000 Wattstunden, das sind 24 Kilowattstunden (Kilo = 1000). Darunter ein Büro-PC mit grünem Blatt: Energieeffizienz zählt bei der Auswahl.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Energie = Leistung × Zeit</text>

<!-- Leistung -->
<rect x="20" y="44" width="140" height="110" rx="10" fill="#f4f5f7" stroke="#555" stroke-width="1.5"/>
<rect x="72" y="56" width="36" height="36" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<circle cx="84" cy="74" r="3.5" fill="#555"/><circle cx="96" cy="74" r="3.5" fill="#555"/>
<text x="90" y="122" text-anchor="middle" font-size="20" font-weight="700">1000 W</text>
<text x="90" y="144" text-anchor="middle" font-size="13" fill="#555">Leistung</text>
<text x="200" y="108" text-anchor="middle" font-size="26" font-weight="700">×</text>
<!-- Zeit -->
<rect x="240" y="44" width="140" height="110" rx="10" fill="#f4f5f7" stroke="#555" stroke-width="1.5"/>
<circle cx="310" cy="74" r="18" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M310,74 V62 M310,74 L319,79" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="310" y="122" text-anchor="middle" font-size="20" font-weight="700">24 h</text>
<text x="310" y="144" text-anchor="middle" font-size="13" fill="#555">Zeit (1 Tag)</text>
<!-- Ergebnis -->
<rect x="20" y="170" width="360" height="64" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2.5"/>
<text x="200" y="198" text-anchor="middle" font-size="17" font-weight="700">= 24 000 Wh = 24 kWh</text>
<text x="200" y="220" text-anchor="middle" font-size="13" fill="#555">Kilo = 1000</text>

<!-- Büro-PC -->
<rect x="24" y="270" width="80" height="54" rx="4" fill="#e8f0fe" stroke="#555" stroke-width="2"/>
<path d="M56,324 V334 M72,324 V334 M46,336 H82" stroke="#555" stroke-width="3"/>
<rect x="112" y="272" width="26" height="64" rx="3" fill="#cfd6dd" stroke="#555" stroke-width="2"/>
<path d="M150,306 C150,282 172,270 196,270 C196,296 180,310 160,310 Z" fill="#2e7d32"/>
<path d="M150,316 L178,284" stroke="#fff" stroke-width="2"/>
<text x="210" y="294" font-size="15" font-weight="700" fill="#2e7d32">Energieeffizienz</text>
<text x="210" y="314" font-size="15" font-weight="700" fill="#2e7d32">zählt bei der</text>
<text x="210" y="334" font-size="15" font-weight="700" fill="#2e7d32">Auswahl</text>
<text x="24" y="376" font-size="13" fill="#555">Frage nicht nur „Wie schnell?“, sondern auch</text>
<text x="24" y="393" font-size="13" fill="#555">„Wie viel Strom pro Leistung?“</text>
</svg>
