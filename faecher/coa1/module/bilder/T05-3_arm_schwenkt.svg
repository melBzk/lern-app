<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Draufsicht auf eine Platte mit dem Plattenarm in zwei Stellungen: durchgezogen mit dem Kopf weit außen, halb durchsichtig mit dem Kopf innen nahe der Spindel. Ein gebogener Doppelpfeil am Kopf zeigt: Der Arm schwenkt nach innen und außen. Das Armlager ist der Drehpunkt, der Armmotor bewegt den Arm. Ein runder Pfeil zeigt: Die Platte dreht sich. Drehung der Platte plus Schwenk des Arms: Jede Stelle ist erreichbar.</title>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">So kommt der Kopf an jede Stelle</text>
<text x="210" y="56" text-anchor="middle" font-weight="700" fill="#3a6ed8">schwenkt nach innen / außen</text>
<line x1="210" y1="62" x2="212" y2="104" stroke="#3a6ed8" stroke-width="1.2"/>

<!-- Platte -->
<circle cx="150" cy="190" r="120" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="2"/>
<g fill="none" stroke="#fff" stroke-opacity="0.6"><circle cx="150" cy="190" r="100"/><circle cx="150" cy="190" r="78"/><circle cx="150" cy="190" r="56"/></g>
<circle cx="150" cy="190" r="16" fill="#555"/>
<circle cx="150" cy="190" r="5" fill="#ccc"/>
<!-- Drehung der Platte -->
<path d="M85,303 A130,130 0 0 0 215,303" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<text x="150" y="340" text-anchor="middle" font-weight="700">Platte dreht sich</text>

<!-- Armmotor -->
<path d="M320,300 L318,346 L362,346 Z" fill="#7a7f88"/>
<rect x="312" y="340" width="58" height="22" rx="4" fill="#555"/>
<!-- Arm innen (halb durchsichtig) -->
<g opacity="0.4">
<line x1="320" y1="300" x2="174" y2="164" stroke="#7a7f88" stroke-width="9" stroke-linecap="round"/>
<rect x="164" y="157" width="18" height="13" rx="2" fill="#c62828"/>
</g>
<!-- Arm außen (durchgezogen) -->
<line x1="320" y1="300" x2="234" y2="119" stroke="#7a7f88" stroke-width="9" stroke-linecap="round"/>
<rect x="225" y="112" width="18" height="13" rx="2" fill="#c62828"/>
<!-- Schwenkpfeil -->
<path d="M236,102 A215,215 0 0 0 155,162" fill="none" stroke="#3a6ed8" stroke-width="3" marker-start="url(#b)" marker-end="url(#b)"/>
<!-- Armlager -->
<circle cx="320" cy="300" r="13" fill="#555"/>
<circle cx="320" cy="300" r="5" fill="#ccc"/>

<!-- Beschriftungen -->
<line x1="340" y1="282" x2="329" y2="291" stroke="#333" stroke-width="1.2"/>
<text x="392" y="258" text-anchor="end" font-weight="700">Armlager</text>
<text x="392" y="275" text-anchor="end" font-size="13">= Drehpunkt</text>
<text x="390" y="384" text-anchor="end" font-weight="700">Armmotor</text>
<text x="390" y="401" text-anchor="end" font-size="13">bewegt den Arm</text>

<!-- Fazit -->
<rect x="10" y="418" width="380" height="52" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="200" y="440" text-anchor="middle" font-size="14">Drehung der Platte + Schwenk des Arms</text>
<text x="200" y="460" text-anchor="middle" font-weight="700" fill="#c62828">= jede Stelle erreichbar</text>
</svg>
