<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" role="img">
  <title>Monitor nach Datenblatt auswählen. Im Datenblatt liest du drei Werte: Diagonale, Seitenverhältnis und native Auflösung. Dann wählst du passend aus, begründest die Wahl und stellst die native Auflösung ein. Das ist Thema in der AP1 und im Lernfeld 2.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="400" height="400" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Monitor nach Datenblatt</text>

  <!-- Datenblatt -->
  <rect x="20" y="46" width="200" height="214" rx="6" fill="#fff" stroke="#3a3f4a" stroke-width="2.5"/>
  <rect x="20" y="46" width="200" height="36" rx="6" fill="#3a3f4a"/>
  <text x="120" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Datenblatt</text>
  <g font-size="14" fill="#222">
    <circle cx="40" cy="110" r="10" fill="#E07B00"/><text x="40" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="58" y="115" font-weight="700">Diagonale</text>
    <circle cx="40" cy="160" r="10" fill="#E07B00"/><text x="40" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="58" y="165" font-weight="700">Seitenverhältnis</text>
    <circle cx="40" cy="210" r="10" fill="#E07B00"/><text x="40" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="58" y="215" font-weight="700">native Auflösung</text></g>
  <g stroke="#c9ced6" stroke-width="2"><line x1="58" y1="128" x2="200" y2="128"/><line x1="58" y1="178" x2="200" y2="178"/><line x1="58" y1="228" x2="200" y2="228"/></g>

  <!-- Monitor -->
  <line x1="226" y1="150" x2="262" y2="150" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <rect x="268" y="112" width="116" height="74" rx="4" fill="#3a3f4a"/><rect x="274" y="118" width="104" height="62" fill="#dbeefc"/>
  <rect x="318" y="186" width="16" height="12" fill="#555"/><rect x="300" y="198" width="52" height="6" rx="2" fill="#555"/>
  <path d="M310,150 l10,10 l20,-24" fill="none" stroke="#1f9d55" stroke-width="5"/>

  <rect x="8" y="282" width="384" height="104" rx="12" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <text x="24" y="310" font-size="15" font-weight="700" fill="#b35f00">AP1 und Lernfeld 2:</text>
  <text x="24" y="336" font-size="15" fill="#222">Werte lesen → auswählen → begründen</text>
  <text x="24" y="362" font-size="15" fill="#222">dann passend einstellen</text>
</svg>
