<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 515" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Comic in fünf Feldern: 1 die CPU holt den Befehl vergleiche 7 und 5 aus dem Speicher, 2 der Befehlsdecoder macht Mikrocode daraus, 3 die Zahlen 7 und 5 liegen in zwei Registern, 4 die ALU vergleicht: 7 größer 5 ja, 5 das Ergebnis geht über den Bus zum Arbeitsspeicher oder Monitor.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker></defs>
<rect width="400" height="515" fill="#fff"/>
<text x="200.0" y="26" font-size="17" text-anchor="middle" font-weight="700" >Die CPU prüft: Ist 7 größer als 5?</text>
<rect x="8" y="40" width="188" height="160" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="28" cy="60" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="28" y="65" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >1</text>
<text x="46" y="65" font-size="15" font-weight="700" >Befehl holen</text>
<rect x="204" y="40" width="188" height="160" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="224" cy="60" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="224" y="65" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >2</text>
<text x="242" y="65" font-size="15" font-weight="700" >übersetzen</text>
<rect x="8" y="208" width="188" height="160" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="28" cy="228" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="28" y="233" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >3</text>
<text x="46" y="233" font-size="15" font-weight="700" >ablegen</text>
<rect x="204" y="208" width="188" height="160" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="224" cy="228" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="224" y="233" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >4</text>
<text x="242" y="233" font-size="15" font-weight="700" >vergleichen</text>
<rect x="8" y="376" width="384" height="130" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" />
<circle cx="28" cy="396" r="12" fill="#E07B00" stroke="none" stroke-width="1.5" />
<text x="28" y="401" font-size="14" text-anchor="middle" font-weight="700" fill="#fff" >5</text>
<text x="46" y="401" font-size="15" font-weight="700" >weitergeben</text>
<rect x="20" y="116" width="54" height="70" rx="4" fill="#c9c3bd" stroke="#888" stroke-width="1.5" />
<text x="47" y="156" font-size="13" text-anchor="middle" font-weight="700" >RAM</text>
<rect x="130" y="116" width="54" height="70" rx="4" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2" />
<text x="157" y="156" font-size="13" text-anchor="middle" font-weight="700" >CPU</text>
<line x1="78" y1="166" x2="126" y2="166" stroke="#222" stroke-width="2.5" marker-end="url(#a)" />
<rect x="30" y="76" width="150" height="32" rx="2" fill="#fffbe6" stroke="#222" stroke-width="1.2" />
<text x="105" y="97" font-size="13" text-anchor="middle" font-weight="700" >vergleiche 7 und 5</text>
<rect x="214" y="90" width="60" height="28" rx="2" fill="#fffbe6" stroke="#222" stroke-width="1.2" />
<text x="244" y="109" font-size="13" text-anchor="middle" >Befehl</text>
<line x1="278" y1="104" x2="306" y2="104" stroke="#222" stroke-width="2.5" marker-end="url(#a)" />
<circle cx="330" cy="98" r="14" fill="#fff" stroke="#3a6ed8" stroke-width="5" stroke-dasharray="4 3"/>
<circle cx="330" cy="98" r="9" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5" />
<circle cx="356" cy="120" r="10" fill="#fff" stroke="#3a6ed8" stroke-width="5" stroke-dasharray="4 3"/>
<circle cx="356" cy="120" r="5" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5" />
<text x="298" y="158" font-size="13" text-anchor="middle" font-weight="700" >Befehlsdecoder</text>
<text x="298" y="176" font-size="13" text-anchor="middle" fill="#555" >macht Mikrocode</text>
<rect x="40" y="248" width="58" height="50" rx="3" fill="#f4f1ee" stroke="#888" stroke-width="1.5" />
<text x="69" y="282" font-size="24" text-anchor="middle" font-weight="700" >7</text>
<rect x="61" y="302" width="16" height="5" rx="2" fill="#888" stroke="none" stroke-width="0" />
<rect x="106" y="248" width="58" height="50" rx="3" fill="#f4f1ee" stroke="#888" stroke-width="1.5" />
<text x="135" y="282" font-size="24" text-anchor="middle" font-weight="700" >5</text>
<rect x="127" y="302" width="16" height="5" rx="2" fill="#888" stroke="none" stroke-width="0" />
<text x="102" y="336" font-size="13" text-anchor="middle" font-weight="700" >zwei Register</text>
<text x="102" y="354" font-size="13" text-anchor="middle" fill="#555" >(Ablagefächer)</text>
<line x1="298" y1="330" x2="298" y2="262" stroke="#222" stroke-width="3" />
<line x1="278" y1="330" x2="318" y2="330" stroke="#222" stroke-width="3" />
<line x1="256" y1="280" x2="340" y2="254" stroke="#222" stroke-width="3" />
<line x1="256" y1="280" x2="248" y2="300" stroke="#555" stroke-width="1" />
<line x1="256" y1="280" x2="264" y2="300" stroke="#555" stroke-width="1" />
<line x1="340" y1="254" x2="332" y2="274" stroke="#555" stroke-width="1" />
<line x1="340" y1="254" x2="348" y2="274" stroke="#555" stroke-width="1" />
<path d="M244,300 h24 a12,6 0 0 1 -24,0 Z" fill="#ddd" stroke="#222" stroke-width="1" />
<text x="256" y="296" font-size="18" text-anchor="middle" font-weight="700" >7</text>
<path d="M328,274 h24 a12,6 0 0 1 -24,0 Z" fill="#ddd" stroke="#222" stroke-width="1" />
<text x="340" y="270" font-size="16" text-anchor="middle" font-weight="700" >5</text>
<text x="384" y="252" font-size="14" text-anchor="end" font-weight="700" fill="#3a6ed8" >ALU</text>
<rect x="244" y="338" width="108" height="24" rx="5" fill="#E07B00" stroke="none" stroke-width="0" />
<text x="298" y="355" font-size="15" text-anchor="middle" font-weight="700" fill="#fff" >7 &gt; 5: ja</text>
<rect x="24" y="426" width="56" height="40" rx="8" fill="#E07B00" stroke="none" stroke-width="0" />
<text x="52" y="452" font-size="17" text-anchor="middle" font-weight="700" fill="#fff" >ja</text>
<rect x="90" y="436" width="180" height="20" rx="4" fill="#f4f1ee" stroke="#888" stroke-width="1.2" />
<text x="180" y="478" font-size="13" text-anchor="middle" font-weight="700" fill="#555" >über den Bus</text>
<line x1="84" y1="446" x2="286" y2="446" stroke="#222" stroke-width="2.5" marker-end="url(#a)" />
<path d="M270,446 L300,420 M270,446 L300,476" fill="none" stroke="#222" stroke-width="2" />
<rect x="304" y="404" width="76" height="30" rx="4" fill="#c9c3bd" stroke="#888" stroke-width="1.5" />
<text x="342" y="424" font-size="13" text-anchor="middle" font-weight="700" >RAM</text>
<rect x="304" y="458" width="76" height="34" rx="3" fill="#fff" stroke="#222" stroke-width="1.5" />
<rect x="309" y="462" width="66" height="26" rx="1" fill="#e8f0fe" stroke="none" stroke-width="0" />
<text x="342" y="480" font-size="13" text-anchor="middle" font-weight="700" >Monitor</text>
<text x="342" y="449" font-size="13" text-anchor="middle" fill="#555" >oder</text>
</svg>
