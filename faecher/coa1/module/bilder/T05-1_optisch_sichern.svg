<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Sichern auf CD, DVD oder Blu-ray. Oben eine Scheibe in einem Schutzschild: Ein Magnet links und ein Blitz für Überspannung rechts prallen ab. In der Vergrößerung tastet ein Laser von unten Pits, also Vertiefungen, und Lands, also flache Stellen, ab. Die Scheibe speichert mit Licht, nicht magnetisch. Unten die Schwäche: Für große Datenmengen brauchst du viele Scheiben, siehe T02-10.</title>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<g id="scheibe">
<circle cx="0" cy="0" r="1" fill="#f2c48e" stroke="#b5651d" stroke-width="0.02"/>
</g>
</defs>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Sichern auf CD, DVD, Blu-ray</text>

<!-- Scheibe mit Schild -->
<circle cx="200" cy="130" r="80" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="3" stroke-dasharray="10 6"/>
<circle cx="200" cy="130" r="58" fill="#f2c48e" stroke="#b5651d" stroke-width="2"/>
<circle cx="200" cy="130" r="40" fill="none" stroke="#e0a868" stroke-width="2"/>
<circle cx="200" cy="130" r="13" fill="#fff" stroke="#b5651d" stroke-width="2"/>

<!-- Magnet links -->
<path d="M28,96 L28,126 A22,22 0 0 0 72,126 L72,96 L60,96 L60,126 A10,10 0 0 1 40,126 L40,96 Z" fill="#c62828"/>
<rect x="28" y="88" width="12" height="10" fill="#bdbdbd"/><rect x="60" y="88" width="12" height="10" fill="#bdbdbd"/>
<path d="M80,128 L117,128 L94,152" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#g)"/>
<text x="50" y="176" text-anchor="middle" font-size="13">Magnet</text>
<text x="50" y="194" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="700">prallt ab</text>

<!-- Blitz rechts -->
<path d="M362,84 L340,124 L354,124 L342,160 L374,112 L360,112 L372,84 Z" fill="#F2B100" stroke="#222" stroke-width="1.5"/>
<path d="M334,128 L283,128 L306,152" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#g)"/>
<text x="350" y="182" text-anchor="middle" font-size="13">Überspannung</text>
<text x="350" y="200" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="700">prallt ab</text>

<!-- Vergrößerung -->
<text x="40" y="262" font-size="13" fill="#444">vergrößert:</text>
<rect x="40" y="270" width="320" height="34" fill="#b0bec5" stroke="#455a64" stroke-width="1.5"/>
<g fill="#fff" stroke="#455a64" stroke-width="1.5">
<rect x="70" y="292" width="44" height="12"/>
<rect x="160" y="292" width="24" height="12"/>
<rect x="236" y="292" width="58" height="12"/>
</g>
<line x1="92" y1="306" x2="92" y2="322" stroke="#222" stroke-width="1.5"/>
<text x="92" y="338" text-anchor="middle" font-weight="700">Pit</text>
<text x="92" y="354" text-anchor="middle" font-size="13" fill="#444">Vertiefung</text>
<line x1="138" y1="306" x2="138" y2="322" stroke="#222" stroke-width="1.5"/>
<text x="150" y="338" text-anchor="middle" font-weight="700">Land</text>
<text x="150" y="354" text-anchor="middle" font-size="13" fill="#444">flach</text>
<!-- Laser -->
<path d="M265,304 L254,372 L276,372 Z" fill="#c62828" opacity="0.35"/>
<line x1="265" y1="372" x2="265" y2="306" stroke="#c62828" stroke-width="2.5"/>
<rect x="246" y="372" width="38" height="20" rx="3" fill="#455a64"/>
<text x="294" y="388" font-weight="700" fill="#c62828">Laser liest</text>

<!-- Kernaussage -->
<rect x="10" y="408" width="380" height="42" rx="10" fill="#3a6ed8"/>
<text x="200" y="435" text-anchor="middle" font-weight="700" font-size="16" fill="#fff">speichert mit Licht, nicht magnetisch</text>

<!-- Schwäche -->
<rect x="10" y="464" width="380" height="86" rx="10" fill="#eceff1"/>
<g stroke="#b5651d" stroke-width="1.5" fill="#f2c48e">
<ellipse cx="62" cy="530" rx="36" ry="9"/><ellipse cx="62" cy="522" rx="36" ry="9"/><ellipse cx="62" cy="514" rx="36" ry="9"/><ellipse cx="62" cy="506" rx="36" ry="9"/><ellipse cx="62" cy="498" rx="36" ry="9"/><ellipse cx="62" cy="490" rx="36" ry="9"/>
</g>
<text x="116" y="494" font-weight="700">Schwäche:</text>
<text x="116" y="514">große Datenmengen</text>
<text x="116" y="534">= viele Scheiben (T02-10)</text>
</svg>
