<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 552" font-family="system-ui, sans-serif" role="img">
  <title>Farbbild mit 24 Bit je Pixel. Ein Pixel bekommt 8 Bit für Rot, 8 Bit für Grün und 8 Bit für Blau, zusammen 24 Bit gleich 3 Byte je Pixel. Rechenkette: 2.073.600 Pixel mal 24 Bit gleich 49.766.400 Bit. Geteilt durch 8: 6.220.800 Byte. Geteilt durch 1024: 6.075 KiB. Geteilt durch 1024: etwa 5,93 MiB. Vergleich: Schwarz-Weiß braucht 1 Bit je Punkt, Farbe 24 Bit je Punkt.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <pattern id="r" x="136" y="54" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="1" y="0" width="18" height="20" fill="#e03131"/></pattern>
    <pattern id="g" x="136" y="80" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="1" y="0" width="18" height="20" fill="#2f9e44"/></pattern>
    <pattern id="b" x="136" y="106" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="1" y="0" width="18" height="20" fill="#1c7ed6"/></pattern>
  </defs>
  <rect width="400" height="552" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Farbbild: 24 Bit je Pixel</text>

  <rect x="16" y="62" width="56" height="56" fill="#9c36b5" stroke="#333" stroke-width="2"/>
  <text x="44" y="138" text-anchor="middle" font-size="13" fill="#222">1 Pixel</text>
  <g font-size="14" font-weight="700" fill="#222">
    <text x="90" y="69">Rot</text><text x="90" y="95">Grün</text><text x="90" y="121">Blau</text>
    <text x="304" y="69">8 Bit</text><text x="304" y="95">8 Bit</text><text x="304" y="121">8 Bit</text>
  </g>
  <rect x="136" y="54" width="160" height="20" fill="url(#r)"/>
  <rect x="136" y="80" width="160" height="20" fill="url(#g)"/>
  <rect x="136" y="106" width="160" height="20" fill="url(#b)"/>
  <text x="200" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#222">24 Bit = <tspan fill="#e8590c">3 Byte</tspan> je Pixel</text>

  <rect x="40" y="176" width="320" height="50" rx="8" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="200" y="195" text-anchor="middle" font-size="14" fill="#333">2 073 600 Pixel × 24 Bit</text>
  <text x="200" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#222">= 49 766 400 Bit</text>
  <line x1="200" y1="228" x2="200" y2="252" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="212" y="246" font-size="15" font-weight="700" fill="#3a6ed8">÷ 8</text>
  <rect x="40" y="254" width="320" height="40" rx="8" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="200" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#222">6 220 800 Byte</text>
  <line x1="200" y1="296" x2="200" y2="320" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="212" y="314" font-size="15" font-weight="700" fill="#3a6ed8">÷ 1024</text>
  <rect x="40" y="322" width="320" height="40" rx="8" fill="#dbe6fb" stroke="#9fb3dc" stroke-width="1.5"/>
  <text x="200" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#222">6 075 KiB</text>
  <line x1="200" y1="364" x2="200" y2="388" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="212" y="382" font-size="15" font-weight="700" fill="#3a6ed8">÷ 1024</text>
  <rect x="40" y="390" width="320" height="48" rx="8" fill="#fff4ec" stroke="#e8590c" stroke-width="2.5"/>
  <text x="200" y="421" text-anchor="middle" font-size="20" font-weight="700" fill="#e8590c">≈ 5,93 MiB</text>

  <rect x="10" y="462" width="185" height="70" rx="10" fill="#f1f3f5" stroke="#555" stroke-width="1.5"/>
  <text x="102" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Schwarz-Weiß</text>
  <text x="102" y="514" text-anchor="middle" font-size="14" fill="#222">1 Bit je Punkt</text>
  <rect x="205" y="462" width="185" height="70" rx="10" fill="#f1f3f5" stroke="#555" stroke-width="1.5"/>
  <text x="298" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Farbe</text>
  <text x="298" y="514" text-anchor="middle" font-size="14" fill="#222">24 Bit je Punkt</text>
</svg>
