<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" role="img">
  <title>Alltag: Dein Handy meldet eine Nachricht. Ein Ergebnis, drei Wege zu dir: Das Handy zeigt die Nachricht an, du siehst sie; es klingelt, du hörst es; es vibriert, du spürst es. Wo der Vergleich hinkt: Im Handy steckt alles in einem Gehäuse, am PC schließt du für jeden Weg meist ein eigenes Gerät an.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">1 Nachricht – 3 Wege zu dir</text>

  <!-- Handy -->
  <rect x="40" y="70" width="80" height="150" rx="14" fill="#3a3f4a"/><rect x="48" y="86" width="64" height="112" rx="4" fill="#dbeefc"/>
  <rect x="54" y="100" width="52" height="22" rx="6" fill="#fff" stroke="#E07B00" stroke-width="2"/>
  <g stroke="#E07B00" stroke-width="2.5" fill="none"><path d="M30,110 l-8,6 l8,6 l-8,6"/><path d="M130,150 l8,6 l-8,6 l8,6"/></g>

  <g stroke="#333" stroke-width="3"><line x1="140" y1="96" x2="196" y2="76" marker-end="url(#a)"/><line x1="146" y1="146" x2="196" y2="146" marker-end="url(#a)"/><line x1="140" y1="196" x2="196" y2="216" marker-end="url(#a)"/></g>

  <!-- sehen -->
  <rect x="204" y="48" width="188" height="56" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <path d="M216,76 q16,-16 32,0 q-16,16 -32,0 z" fill="#fff" stroke="#3a3f4a" stroke-width="2"/><circle cx="232" cy="76" r="5" fill="#3a3f4a"/>
  <text x="258" y="72" font-size="15" font-weight="700" fill="#222">sehen</text><text x="258" y="92" font-size="13" fill="#333">zeigt sie an</text>
  <!-- hoeren -->
  <rect x="204" y="118" width="188" height="56" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <path d="M218,140 h7 l9,-8 v24 l-9,-8 h-7 z" fill="#3a3f4a"/><path d="M240,138 q6,6 0,12" fill="none" stroke="#3a3f4a" stroke-width="2"/>
  <text x="258" y="142" font-size="15" font-weight="700" fill="#222">hören</text><text x="258" y="162" font-size="13" fill="#333">klingelt</text>
  <!-- spueren -->
  <rect x="204" y="188" width="188" height="56" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <rect x="222" y="200" width="16" height="30" rx="3" fill="#3a3f4a"/><g stroke="#E07B00" stroke-width="2" fill="none"><path d="M216,206 l-3,4 l3,4 l-3,4"/><path d="M244,206 l3,4 l-3,4 l3,4"/></g>
  <text x="258" y="212" font-size="15" font-weight="700" fill="#222">spüren</text><text x="258" y="232" font-size="13" fill="#333">vibriert</text>

  <!-- hinkt -->
  <rect x="8" y="270" width="384" height="140" rx="12" fill="#fdecec" stroke="#d63c3c" stroke-width="2"/>
  <text x="24" y="296" font-size="15" font-weight="700" fill="#a32020">Hinkt: Handy = alles in einem Gehäuse</text>
  <text x="24" y="318" font-size="14" fill="#a32020">Am PC meist ein eigenes Gerät pro Weg:</text>
  <rect x="40" y="334" width="60" height="40" rx="3" fill="#3a3f4a"/><rect x="44" y="338" width="52" height="32" fill="#dbeefc"/>
  <rect x="168" y="332" width="26" height="46" rx="4" fill="#3a3f4a"/><circle cx="181" cy="346" r="5" fill="#9aa3ae"/><circle cx="181" cy="364" r="8" fill="#9aa3ae"/>
  <rect x="262" y="340" width="96" height="30" rx="4" fill="#e5e7eb" stroke="#3a3f4a" stroke-width="2"/>
  <g fill="#222"><circle cx="276" cy="350" r="3"/><circle cx="276" cy="360" r="3"/><circle cx="286" cy="350" r="3"/><circle cx="304" cy="360" r="3"/><circle cx="314" cy="350" r="3"/><circle cx="332" cy="350" r="3"/><circle cx="342" cy="360" r="3"/></g>
  <g font-size="13" fill="#333" text-anchor="middle"><text x="70" y="396">Bild</text><text x="181" y="396">Ton</text><text x="310" y="396">Tastpunkte</text></g>
</svg>
