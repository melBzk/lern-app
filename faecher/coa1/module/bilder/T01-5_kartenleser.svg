<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Ein kleiner Kartenleser steckt mit einem USB-Kabel am Laptop. Drei Karten werden gelesen: SD-Karte mit Fotos und Magnetkarte mit Magnetstreifen werden eingesteckt, die Chipkarte mit RFID wird per Funk gelesen. Der Laptop hat zusätzlich einen eingebauten SD-Port.</title>
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f9d55"/></marker>
  </defs>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Kartenleser: Karten am PC lesen</text>

  <!-- Laptop -->
  <rect x="30" y="50" width="160" height="100" rx="6" fill="#3a3f4a"/>
  <rect x="38" y="58" width="144" height="84" fill="#dbe6fb"/>
  <path d="M22,150 H198 L210,172 H10 Z" fill="#cfd3da" stroke="#555" stroke-width="2"/>
  <!-- SD-Port eingebaut -->
  <rect x="36" y="166" width="26" height="4" rx="1" fill="#222"/>
  <text x="20" y="198" font-size="13" font-weight="700" fill="#222">SD-Port (eingebaut)</text>
  <line x1="49" y1="185" x2="49" y2="172" stroke="#555" stroke-width="1.5"/>

  <!-- USB-Kabel -->
  <path d="M196,151 C240,150 300,120 300,200" fill="none" stroke="#555" stroke-width="4"/>
  <rect x="191" y="146" width="10" height="10" fill="#555"/>
  <text x="256" y="124" font-size="13" font-weight="700" fill="#555">USB-Kabel</text>

  <!-- Kartenleser -->
  <rect x="250" y="200" width="110" height="50" rx="8" fill="#3a3f4a"/>
  <rect x="266" y="236" width="40" height="5" fill="#999"/>
  <rect x="314" y="236" width="30" height="5" fill="#999"/>
  <text x="305" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Kartenleser</text>

  <!-- Karten -->
  <!-- SD -->
  <path d="M40,330 H72 L82,340 V384 H40 Z" fill="#3a6ed8"/>
  <g fill="#e0a800"><rect x="46" y="334" width="4" height="10"/><rect x="53" y="334" width="4" height="10"/><rect x="60" y="334" width="4" height="10"/></g>
  <text x="62" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#222">SD-Karte</text>
  <text x="62" y="425" text-anchor="middle" font-size="13" fill="#555">(Fotos)</text>
  <!-- Magnet -->
  <rect x="130" y="330" width="96" height="58" rx="5" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="130" y="342" width="96" height="14" fill="#222"/>
  <text x="178" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Magnetkarte</text>
  <text x="178" y="425" text-anchor="middle" font-size="13" fill="#555">(Magnetstreifen)</text>
  <!-- Chip RFID -->
  <rect x="268" y="330" width="96" height="58" rx="5" fill="#fde7b0" stroke="#9a6b00" stroke-width="2"/>
  <rect x="280" y="348" width="18" height="15" rx="2" fill="#e0a800" stroke="#9a6b00"/>
  <text x="316" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Chipkarte</text>
  <text x="316" y="425" text-anchor="middle" font-size="13" fill="#555">mit RFID</text>

  <!-- Pfeile -->
  <g stroke="#1f9d55" stroke-width="4" fill="none" marker-end="url(#mg)">
    <path d="M70,322 C80,280 200,270 260,248"/>
    <path d="M190,322 C200,290 260,280 288,250"/>
  </g>
  <g fill="none" stroke="#3a6ed8" stroke-width="3" stroke-linecap="round">
    <path d="M330,318 A12,12 0 0 1 350,318"/>
    <path d="M324,302 A22,22 0 0 1 356,302"/>
    <path d="M318,286 A32,32 0 0 1 362,286"/>
  </g>
  <text x="200" y="456" text-anchor="middle" font-size="13" fill="#555">SD- und Magnetkarte: einstecken · RFID: per Funk</text>
</svg>
