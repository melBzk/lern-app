<title>Ausgangslage: Ein Notebook mit nur einem Thunderbolt-3-Anschluss. Rundherum Monitor, Netzwerkkabel, externe Festplatte und Tastatur, gestrichelte Linien zum einen Anschluss, in der Mitte ein Fragezeichen.</title>
