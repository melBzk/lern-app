<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Warum überhaupt sichern? Drei rote Pfeile zeigen auf einen Laptop mit dem Ordner Fotos und Videos. 1 Überspannung: die Steuer-Elektronik der Festplatte ist kaputt. 2 Schadsoftware zerstört Daten. 3 Kinderfotos gibt es nur einmal, sie sind nicht wiederholbar. Unten grün: Ist eine Kopie vorhanden, holst du die Daten zurück.</title>
<defs>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<path id="ordner" d="M0,0 L16,0 L22,6 L48,6 L48,38 L0,38 Z"/>
</defs>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Warum überhaupt sichern?</text>

<!-- 1 Blitz -->
<circle cx="30" cy="54" r="11" fill="#c62828"/><text x="30" y="59" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
<path d="M76,46 L58,80 L70,80 L60,108 L86,70 L74,70 L84,46 Z" fill="#F2B100" stroke="#222" stroke-width="1.5"/>
<text x="70" y="132" text-anchor="middle" font-weight="700">Überspannung</text>
<text x="70" y="150" text-anchor="middle" font-size="13">Steuer-Elektronik</text>
<text x="70" y="166" text-anchor="middle" font-size="13">der Platte kaputt</text>

<!-- 2 Käfer -->
<circle cx="160" cy="54" r="11" fill="#c62828"/><text x="160" y="59" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
<g transform="translate(200 80) scale(1.4)">
<g stroke="#222" stroke-width="2"><line x1="-14" y1="-6" x2="14" y2="-6"/><line x1="-15" y1="2" x2="15" y2="2"/><line x1="-14" y1="10" x2="14" y2="10"/><line x1="-3" y1="-14" x2="-7" y2="-20"/><line x1="3" y1="-14" x2="7" y2="-20"/></g>
<ellipse cx="0" cy="3" rx="9" ry="12" fill="#c62828"/>
<circle cx="0" cy="-11" r="5" fill="#222"/>
</g>
<text x="200" y="132" text-anchor="middle" font-weight="700">Schadsoftware</text>
<text x="200" y="150" text-anchor="middle" font-size="13">zerstört Daten</text>

<!-- 3 Kinderfoto -->
<circle cx="290" cy="54" r="11" fill="#c62828"/><text x="290" y="59" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">3</text>
<rect x="306" y="48" width="50" height="60" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="311" y="53" width="40" height="40" fill="#e8f0fe"/>
<circle cx="331" cy="68" r="7" fill="#8d6e63"/>
<path d="M319,93 Q319,78 331,78 Q343,78 343,93 Z" fill="#3a6ed8"/>
<text x="366" y="80" font-weight="700" font-size="20" fill="#c62828">?</text>
<text x="330" y="132" text-anchor="middle" font-weight="700">Kinderfotos</text>
<text x="330" y="150" text-anchor="middle" font-size="13">gibt es nur einmal:</text>
<text x="330" y="166" text-anchor="middle" font-size="13">nicht wiederholbar</text>

<!-- rote Pfeile -->
<g stroke="#c62828" stroke-width="3" fill="none">
<line x1="78" y1="178" x2="146" y2="250" marker-end="url(#r)"/>
<line x1="200" y1="162" x2="200" y2="248" marker-end="url(#r)"/>
<line x1="322" y1="178" x2="254" y2="250" marker-end="url(#r)"/>
</g>

<!-- Laptop -->
<rect x="126" y="256" width="148" height="96" rx="6" fill="#333"/>
<rect x="134" y="264" width="132" height="80" fill="#fff"/>
<use href="#ordner" x="176" y="272" fill="#F2B100" stroke="#8a6d00" stroke-width="1.5"/>
<text x="200" y="334" text-anchor="middle" font-size="13" font-weight="700">Fotos &amp; Videos</text>
<path d="M110,352 L290,352 L280,364 L120,364 Z" fill="#555"/>

<!-- grüner Kasten -->
<rect x="10" y="394" width="380" height="94" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<use href="#ordner" x="28" y="420" fill="#F2B100" stroke="#8a6d00" stroke-width="1.5"/>
<use href="#ordner" x="38" y="430" fill="#F2B100" stroke="#8a6d00" stroke-width="1.5"/>
<text x="104" y="432" font-weight="700" font-size="16" fill="#2e7d32">Kopie vorhanden</text>
<line x1="104" y1="454" x2="134" y2="454" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
<text x="142" y="459" font-weight="700" font-size="16" fill="#2e7d32">zurückholen</text>
</svg>
