<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Passt die neue CPU zum Mainboard? Drei Prüfschritte mit Häkchen. 1: Ist der Sockel gleich? Der Name allein reicht nicht, weiter zu Schritt 2. 2: Steht die CPU auf der Support-Liste des Board-Herstellers? 3: Ist die BIOS-Version hoch genug? Sonst zuerst ein BIOS-Update.</title>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">Passt die neue CPU?</text>

<!-- CPU -->
<rect x="36" y="56" width="66" height="66" rx="4" fill="#555"/>
<rect x="48" y="68" width="42" height="42" rx="3" fill="#c9ced4"/>
<path d="M39,59 L50,59 L39,70 Z" fill="#E07B00"/>
<text x="69" y="144" text-anchor="middle" font-size="15" font-weight="700">neue CPU</text>

<!-- Mainboard -->
<rect x="272" y="48" width="112" height="82" rx="4" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="290" y="62" width="40" height="40" rx="2" fill="#fff" stroke="#555" stroke-width="2"/>
<g fill="#555"><circle cx="297" cy="69" r="1.6"/><circle cx="297" cy="76" r="1.6"/><circle cx="297" cy="83" r="1.6"/><circle cx="297" cy="90" r="1.6"/><circle cx="297" cy="97" r="1.6"/><circle cx="304" cy="69" r="1.6"/><circle cx="304" cy="76" r="1.6"/><circle cx="304" cy="83" r="1.6"/><circle cx="304" cy="90" r="1.6"/><circle cx="304" cy="97" r="1.6"/><circle cx="311" cy="69" r="1.6"/><circle cx="311" cy="76" r="1.6"/><circle cx="311" cy="83" r="1.6"/><circle cx="311" cy="90" r="1.6"/><circle cx="311" cy="97" r="1.6"/><circle cx="318" cy="69" r="1.6"/><circle cx="318" cy="76" r="1.6"/><circle cx="318" cy="83" r="1.6"/><circle cx="318" cy="90" r="1.6"/><circle cx="318" cy="97" r="1.6"/><circle cx="325" cy="69" r="1.6"/><circle cx="325" cy="76" r="1.6"/><circle cx="325" cy="83" r="1.6"/><circle cx="325" cy="90" r="1.6"/><circle cx="325" cy="97" r="1.6"/></g>
<text x="310" y="122" text-anchor="middle" font-size="13" font-weight="700">Sockel</text>
<g fill="#555"><rect x="344" y="58" width="6" height="62" rx="1"/><rect x="358" y="58" width="6" height="62" rx="1"/></g>
<text x="328" y="150" text-anchor="middle" font-size="15" font-weight="700">Mainboard</text>

<!-- Pfeil -->
<line x1="112" y1="89" x2="252" y2="89" stroke="#3a6ed8" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M250,80 L266,89 L250,98 Z" fill="#3a6ed8"/>
<text x="186" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="#3a6ed8">passt?</text>

<!-- Prüfkästchen -->
<g transform="translate(0,174)">
<rect x="14" y="0" width="372" height="64" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<rect x="28" y="18" width="28" height="28" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<path d="M33,32 L40,39 L52,24" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="28" font-size="15" font-weight="700">1. Sockel gleich?</text>
<text x="70" y="50" font-size="14">Name allein reicht nicht → Schritt 2</text>
</g>
<g transform="translate(0,250)">
<rect x="14" y="0" width="372" height="64" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<rect x="28" y="18" width="28" height="28" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<path d="M33,32 L40,39 L52,24" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="28" font-size="15" font-weight="700">2. CPU auf der Support-Liste?</text>
<text x="70" y="50" font-size="14">Liste des Mainboard-Herstellers</text>
</g>
<g transform="translate(0,326)">
<rect x="14" y="0" width="372" height="64" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<rect x="28" y="18" width="28" height="28" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<path d="M33,32 L40,39 L52,24" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="28" font-size="15" font-weight="700">3. BIOS-Version hoch genug?</text>
<text x="70" y="50" font-size="14">steht auch in der Support-Liste</text>
</g>

<!-- sonst -->
<line x1="200" y1="392" x2="200" y2="414" stroke="#E07B00" stroke-width="4"/>
<path d="M190,412 L210,412 L200,426 Z" fill="#E07B00"/>
<rect x="44" y="430" width="312" height="40" rx="10" fill="#fff3e0" stroke="#E07B00" stroke-width="2.5"/>
<text x="200" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#E07B00">sonst: zuerst BIOS-Update</text>
</svg>
