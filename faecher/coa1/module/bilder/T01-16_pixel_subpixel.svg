<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="system-ui, sans-serif" role="img">
  <title>Ein Monitor mit 1920 Pixeln in der Breite und 1080 in der Höhe: 1920 mal 1080 gleich 2.073.600 Pixel. Eine Lupe vergrößert einen einzigen Pixel: Er besteht aus drei schmalen Streifen rot, grün und blau, den 3 LCD-Zellen, auch Subpixel genannt. 2.073.600 mal 3 gleich 6.220.800, also etwa 6 Millionen Zellen.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <clipPath id="c"><circle cx="322" cy="128" r="56"/></clipPath>
  </defs>
  <rect width="400" height="370" fill="#fff"/>

  <!-- Monitor -->
  <text x="135" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#222">1920 breit</text>
  <line x1="48" y1="54" x2="222" y2="54" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="40" y="62" width="190" height="128" rx="6" fill="#3a3f4a"/>
  <rect x="48" y="70" width="174" height="112" fill="#dfe8f6"/>
  <line x1="28" y1="70" x2="28" y2="182" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="14" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#222" transform="rotate(-90 14 126)">1080 hoch</text>
  <rect x="126" y="190" width="18" height="12" fill="#555"/>
  <rect x="106" y="202" width="58" height="5" fill="#555"/>
  <rect x="150" y="108" width="10" height="10" fill="#fff" stroke="#e8590c" stroke-width="2"/>

  <!-- Lupe -->
  <line x1="160" y1="113" x2="266" y2="122" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="362" y1="168" x2="386" y2="192" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <g clip-path="url(#c)">
    <rect x="266" y="72" width="112" height="112" fill="#fff"/>
    <rect x="280" y="72" width="28" height="112" fill="#e03131"/>
    <rect x="308" y="72" width="28" height="112" fill="#2f9e44"/>
    <rect x="336" y="72" width="28" height="112" fill="#1c7ed6"/>
  </g>
  <circle cx="322" cy="128" r="56" fill="none" stroke="#333" stroke-width="4"/>
  <g font-size="18" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="294" y="134">R</text><text x="322" y="134">G</text><text x="350" y="134">B</text>
  </g>
  <text x="310" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#222">3 LCD-Zellen</text>
  <text x="310" y="230" text-anchor="middle" font-size="13" fill="#444">(Subpixel)</text>

  <!-- Rechnung -->
  <text x="200" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#222">1920 × 1080 = 2 073 600 Pixel</text>
  <line x1="200" y1="272" x2="200" y2="296" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="212" y="290" font-size="15" font-weight="700" fill="#3a6ed8">× 3</text>
  <rect x="40" y="300" width="320" height="60" rx="10" fill="#fff4ec" stroke="#e8590c" stroke-width="2.5"/>
  <text x="200" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#222">2 073 600 × 3 = 6 220 800</text>
  <text x="200" y="349" text-anchor="middle" font-size="18" font-weight="700" fill="#e8590c">≈ 6 Mio. Zellen</text>
</svg>
