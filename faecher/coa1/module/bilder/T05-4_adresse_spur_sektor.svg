<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Platte von oben. Die Spuren sind von außen nach innen durchgezählt ab 0: Spur 0 ganz außen, dann 1, 2 und so weiter. Die Sektoren rundherum sind ab 1 gezählt: Sektor 1, 2, 3 und so weiter. Eine Stelle ist rot markiert: Datei in Spur 17, Sektor 3. Darunter ein Karteikärtchen Inhaltsverzeichnis: brief.docx liegt in Spur 17, Sektor 3.</title>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Jede Stelle hat eine Adresse</text>
<text x="140" y="56" text-anchor="middle" font-size="13" fill="#1f4fa8" font-weight="700">Sektor 1, 2, 3 …</text>

<circle cx="140" cy="200" r="118" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="140" cy="200" r="118" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="140" cy="200" r="104" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="140" cy="200" r="90" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="140" cy="200" r="60" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="140" cy="200" r="45" fill="none" stroke="#fff" stroke-width="1.5"/>
<g stroke="#fff" stroke-opacity="0.6" stroke-width="1"><line x1="140.0" y1="180.0" x2="140.0" y2="82.0"/><line x1="150.0" y1="182.7" x2="199.0" y2="97.8"/><line x1="157.3" y1="190.0" x2="242.2" y2="141.0"/><line x1="160.0" y1="200.0" x2="258.0" y2="200.0"/><line x1="157.3" y1="210.0" x2="242.2" y2="259.0"/><line x1="150.0" y1="217.3" x2="199.0" y2="302.2"/><line x1="140.0" y1="220.0" x2="140.0" y2="318.0"/><line x1="130.0" y1="217.3" x2="81.0" y2="302.2"/><line x1="122.7" y1="210.0" x2="37.8" y2="259.0"/><line x1="120.0" y1="200.0" x2="22.0" y2="200.0"/><line x1="122.7" y1="190.0" x2="37.8" y2="141.0"/><line x1="130.0" y1="182.7" x2="81.0" y2="97.8"/></g>
<circle cx="140" cy="200" r="60" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M207.0,200.0 A67,67 0 0 1 198.0,233.5 L185.9,226.5 A53,53 0 0 0 193.0,200.0 Z" fill="#c62828" stroke="#fff" stroke-width="1.5"/>
<circle cx="140" cy="200" r="16" fill="#555"/>
<text x="234.8" y="110.2" text-anchor="middle" font-weight="700" fill="#1f4fa8">1</text><text x="269.4" y="170.3" text-anchor="middle" font-weight="700" fill="#1f4fa8">2</text><text x="269.4" y="239.7" text-anchor="middle" font-weight="700" fill="#1f4fa8">3</text><text x="234.8" y="299.8" text-anchor="middle" font-weight="700" fill="#1f4fa8">…</text>

<!-- Spurnummern auf dem Radius links -->
<g text-anchor="middle" font-weight="700" font-size="13">
<text x="29" y="205" fill="#222">0</text>
<text x="43" y="205" fill="#222">1</text>
<text x="57" y="205" fill="#222">2</text>
<text x="69" y="205" fill="#222">…</text>
<text x="88" y="205" fill="#c62828">17</text>
</g>
<line x1="36" y1="212" x2="36" y2="330" stroke="#333" stroke-width="1.2"/>
<text x="16" y="348" font-size="13" font-weight="700">Spur 0 (außen), 1, 2 …</text>

<!-- Etikett -->
<line x1="206.0" y1="215.5" x2="276" y2="215.5" stroke="#c62828" stroke-width="1.5"/>
<rect x="278" y="185.5" width="114" height="62" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="335" y="205.5" text-anchor="middle" font-weight="700" fill="#c62828">Datei:</text>
<text x="335" y="223.5" text-anchor="middle" font-size="13" font-weight="700">Spur 17,</text>
<text x="335" y="240.5" text-anchor="middle" font-size="13" font-weight="700">Sektor 3</text>

<!-- Karteikarte -->
<rect x="20" y="372" width="360" height="92" rx="6" fill="#fffde7" stroke="#8a6d00" stroke-width="1.5"/>
<line x1="20" y1="402" x2="380" y2="402" stroke="#e0c97a" stroke-width="1.5"/>
<text x="34" y="394" font-weight="700">Inhaltsverzeichnis</text>
<text x="34" y="428">brief.docx</text>
<text x="120" y="428">→</text>
<text x="148" y="428" font-weight="700" fill="#c62828">Spur 17, Sektor 3</text>
<text x="34" y="452" font-size="13" fill="#555">Vereinfacht: Das Verzeichnis merkt sich die Adresse.</text>
</svg>
