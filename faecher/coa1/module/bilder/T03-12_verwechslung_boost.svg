<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Drei Begriffe im Vergleich. Auslagerungsdatei: Festplatte als Ersatz-Arbeitsspeicher, Standard C:, wenn der RAM nicht reicht. ReadyBoost: USB-Stick als Zwischenspeicher, nur bei langsamen Festplatten sinnvoll, bei SSD überflüssig. Turbo Boost: Intel-Prozessor erhöht den Takt, wenn nicht alle Kerne arbeiten. Warnhinweis: die USB-Stick-Funktion heißt ReadyBoost, nicht Turbo Boost, und kam mit Windows Vista.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="374" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Drei Namen, drei Dinge</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="23.0" y="71.0" width="50" height="34" rx="4" fill="#cfd6de" stroke="#555" stroke-width="1.5"/><circle cx="45" cy="88.0" r="10.88" fill="#eef1f4" stroke="#555" stroke-width="1.5"/><circle cx="45" cy="88.0" r="2.5" fill="#555" stroke="none" stroke-width="2"/><line x1="53.0" y1="98.2" x2="67.0" y2="81.2" stroke="#555" stroke-width="2"/>
<text x="92" y="76.0" font-size="15" font-weight="700" fill="#E07B00">Auslagerungsdatei</text>
<text x="92" y="96.0" font-size="14">Festplatte als Ersatz-RAM (Standard C:)</text>
<text x="92" y="114.0" font-size="14">wenn der RAM nicht reicht</text>
<line x1="15" y1="130" x2="385" y2="130" stroke="#ddd" stroke-width="1"/>
<rect x="22.0" y="162.0" width="37.44" height="20" rx="3" fill="#E07B00" stroke="#222" stroke-width="1.5"/><rect x="59.44" y="166.0" width="14.560000000000002" height="12.0" rx="1" fill="#ccc" stroke="#555" stroke-width="1.5"/>
<text x="92" y="160.0" font-size="15" font-weight="700" fill="#1d3f8a">ReadyBoost</text>
<text x="92" y="180.0" font-size="14">USB-Stick als Zwischenspeicher (Cache)</text>
<text x="92" y="198.0" font-size="14">nur bei langsamen HDDs – bei SSD überflüssig</text>
<line x1="15" y1="214" x2="385" y2="214" stroke="#ddd" stroke-width="1"/>
<line x1="37.2" y1="233.0" x2="37.2" y2="238.0" stroke="#888" stroke-width="2"/><line x1="37.2" y1="274.0" x2="37.2" y2="279.0" stroke="#888" stroke-width="2"/><line x1="25" y1="245.2" x2="30" y2="245.2" stroke="#888" stroke-width="2"/><line x1="66" y1="245.2" x2="71" y2="245.2" stroke="#888" stroke-width="2"/><line x1="44.4" y1="233.0" x2="44.4" y2="238.0" stroke="#888" stroke-width="2"/><line x1="44.4" y1="274.0" x2="44.4" y2="279.0" stroke="#888" stroke-width="2"/><line x1="25" y1="252.4" x2="30" y2="252.4" stroke="#888" stroke-width="2"/><line x1="66" y1="252.4" x2="71" y2="252.4" stroke="#888" stroke-width="2"/><line x1="51.6" y1="233.0" x2="51.6" y2="238.0" stroke="#888" stroke-width="2"/><line x1="51.6" y1="274.0" x2="51.6" y2="279.0" stroke="#888" stroke-width="2"/><line x1="25" y1="259.6" x2="30" y2="259.6" stroke="#888" stroke-width="2"/><line x1="66" y1="259.6" x2="71" y2="259.6" stroke="#888" stroke-width="2"/><line x1="58.8" y1="233.0" x2="58.8" y2="238.0" stroke="#888" stroke-width="2"/><line x1="58.8" y1="274.0" x2="58.8" y2="279.0" stroke="#888" stroke-width="2"/><line x1="25" y1="266.8" x2="30" y2="266.8" stroke="#888" stroke-width="2"/><line x1="66" y1="266.8" x2="71" y2="266.8" stroke="#888" stroke-width="2"/><rect x="30" y="238.0" width="36" height="36" rx="3" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/>
<text x="92" y="244.0" font-size="15" font-weight="700" fill="#1d3f8a">Turbo Boost</text>
<text x="92" y="264.0" font-size="14">Intel-Prozessor erhöht den Takt</text>
<text x="92" y="282.0" font-size="14">wenn nicht alle Kerne arbeiten (T03-5)</text>
<line x1="15" y1="298" x2="385" y2="298" stroke="#ddd" stroke-width="1"/>
<rect x="14" y="310" width="372" height="50" rx="8" fill="#fdebd3" stroke="#E07B00" stroke-width="2"/>
<path d="M36,324 L47,343.8 L25,343.8 Z" fill="#E07B00" stroke="#E07B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="341.6" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">!</text>
<text x="56" y="331" font-size="14" font-weight="700" fill="#a85a00">USB-Stick-Funktion = ReadyBoost,</text>
<text x="56" y="350" font-size="13" fill="#333">nicht Turbo Boost (kam mit Vista)</text>
</svg>
