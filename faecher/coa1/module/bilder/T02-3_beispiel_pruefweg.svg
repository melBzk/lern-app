<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" fill="#222">
<title>Prüfweg in vier Schritten: 1. Maße vergleichen: ATX-Board 305 × 244 mm, ITX-Gehäuse für Mini-ITX 170 × 170 mm. 2. ATX ist viel größer, größer in kleiner geht nie: passt nicht. 3. Lösung: Mini-ITX-Board kaufen oder ein ATX-Gehäuse dazu. 4. Netzteil prüfen: ATX-Board, ATX-Netzteil und ATX-Gehäuse gehören zusammen.</title>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">ATX-Board ins ITX-Gehäuse?</text>
<g fill="#f4f1ee"><rect x="10" y="46" width="380" height="92" rx="10"/><rect x="10" y="146" width="380" height="80" rx="10"/><rect x="10" y="234" width="380" height="100" rx="10"/><rect x="10" y="342" width="380" height="88" rx="10"/></g>
<g font-size="15" font-weight="700" fill="#fff">
<circle cx="32" cy="70" r="14" fill="#D4607A"/><text x="32" y="75" text-anchor="middle">1</text>
<circle cx="32" cy="170" r="14" fill="#D4607A"/><text x="32" y="175" text-anchor="middle">2</text>
<circle cx="32" cy="258" r="14" fill="#D4607A"/><text x="32" y="263" text-anchor="middle">3</text>
<circle cx="32" cy="366" r="14" fill="#D4607A"/><text x="32" y="371" text-anchor="middle">4</text>
</g>
<!-- 1 -->
<text x="56" y="75" font-size="15" font-weight="700">Maße vergleichen</text>
<rect x="60" y="88" width="61" height="45" fill="#d6e4fb" stroke="#3a6ed8" stroke-width="2"/>
<rect x="210" y="99" width="34" height="34" fill="#fde3c4" stroke="#e08a2e" stroke-width="2"/>
<text x="128" y="106" font-size="13" font-weight="700" fill="#2550a8">ATX</text>
<text x="128" y="124" font-size="13" fill="#2550a8">305 × 244</text>
<text x="252" y="106" font-size="13" font-weight="700" fill="#a8590f">Mini-ITX</text>
<text x="252" y="124" font-size="13" fill="#a8590f">170 × 170 mm</text>
<!-- 2 -->
<text x="56" y="175" font-size="15" font-weight="700">Größer in kleiner geht nie</text>
<g stroke="#d43c3c" stroke-width="5" stroke-linecap="round"><line x1="60" y1="190" x2="80" y2="210"/><line x1="80" y1="190" x2="60" y2="210"/></g>
<text x="92" y="206" font-size="14" font-weight="700" fill="#d43c3c">passt nicht</text>
<!-- 3 -->
<text x="56" y="263" font-size="15" font-weight="700">Lösung – eins von beiden:</text>
<rect x="56" y="276" width="140" height="48" rx="8" fill="#fff" stroke="#e08a2e" stroke-width="2"/>
<text x="126" y="296" text-anchor="middle" font-size="13" font-weight="700">Mini-ITX-Board</text>
<text x="126" y="314" text-anchor="middle" font-size="13">kaufen</text>
<text x="213" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#D4607A">oder</text>
<rect x="230" y="276" width="150" height="48" rx="8" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="305" y="296" text-anchor="middle" font-size="13" font-weight="700">ATX-Gehäuse</text>
<text x="305" y="314" text-anchor="middle" font-size="13">dazu kaufen</text>
<!-- 4 -->
<text x="56" y="371" font-size="15" font-weight="700">Netzteil prüfen</text>
<g font-size="13" font-weight="700" fill="#2550a8" text-anchor="middle">
<rect x="56" y="384" width="92" height="34" rx="6" fill="#d6e4fb"/><text x="102" y="406">ATX-Board</text>
<rect x="160" y="384" width="104" height="34" rx="6" fill="#d6e4fb"/><text x="212" y="406">ATX-Netzteil</text>
<rect x="276" y="384" width="104" height="34" rx="6" fill="#d6e4fb"/><text x="328" y="406">ATX-Gehäuse</text>
</g>
<g font-size="15" font-weight="700" fill="#555" text-anchor="middle"><text x="154" y="406">+</text><text x="270" y="406">+</text></g>
</svg>
