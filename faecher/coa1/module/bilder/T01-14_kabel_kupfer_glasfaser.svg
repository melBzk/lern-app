<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Netzwerkkabel im Vergleich. Links Kupferkabel: verdrillte Kupferadern, RJ45-Stecker mit 8 Kontakten, Daten als Strom, höchstens 100 m lang, günstig. Rechts Lichtwellenleiter (Glasfaser): ein Lichtstrahl läuft im Zickzack durch die dünne Glasfaser, Daten als Licht, nötig ab über 100 m (laut Buch bis 40 km), deutlich teurer.</title>
<rect width="400" height="480" fill="#fff"/>
<line x1="200" y1="10" x2="200" y2="470" stroke="#ccc" stroke-width="1.5"/>

<text x="100" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#8a4a14">Kupferkabel</text>
<text x="300" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1d3f8a">Lichtwellenleiter</text>
<text x="300" y="50" text-anchor="middle" font-size="14" fill="#1d3f8a">(Glasfaser)</text>

<!-- Kupfer: verdrillte Adern + RJ45 -->
<rect x="14" y="84" width="112" height="32" rx="6" fill="#e5e7eb" stroke="#555" stroke-width="2"/>
<path d="M20,100 q8,-12 16,0 q8,12 16,0 q8,-12 16,0 q8,12 16,0 q8,-12 16,0 q8,12 16,0 q8,-12 8,0" fill="none" stroke="#c87533" stroke-width="4"/>
<path d="M20,100 q8,12 16,0 q8,-12 16,0 q8,12 16,0 q8,-12 16,0 q8,12 16,0 q8,-12 16,0 q8,12 8,0" fill="none" stroke="#e0a060" stroke-width="4"/>
<rect x="126" y="80" width="56" height="40" rx="4" fill="#eef4f8" stroke="#555" stroke-width="2"/>
<g stroke="#d4a017" stroke-width="2.5"><line x1="134" y1="84" x2="134" y2="96"/><line x1="140" y1="84" x2="140" y2="96"/><line x1="146" y1="84" x2="146" y2="96"/><line x1="152" y1="84" x2="152" y2="96"/><line x1="158" y1="84" x2="158" y2="96"/><line x1="164" y1="84" x2="164" y2="96"/><line x1="170" y1="84" x2="170" y2="96"/><line x1="176" y1="84" x2="176" y2="96"/></g>
<text x="70" y="140" text-anchor="middle" font-size="13">verdrillte Adern</text>
<text x="154" y="140" text-anchor="middle" font-size="13" font-weight="700">RJ45</text>

<!-- Glasfaser: Licht im Zickzack -->
<rect x="214" y="84" width="172" height="32" rx="16" fill="#e6f2fb" stroke="#3a6ed8" stroke-width="2"/>
<polyline points="222,100 240,88 262,112 284,88 306,112 328,88 350,112 372,88 380,94" fill="none" stroke="#E07B00" stroke-width="3"/>
<text x="300" y="140" text-anchor="middle" font-size="13">dünne Glasfaser</text>

<!-- Strom / Licht -->
<path d="M106,166 L84,204 H100 L92,236 L120,192 H103 L114,166 Z" fill="#ffd84d" stroke="#b8862b" stroke-width="2" stroke-linejoin="round"/>
<text x="100" y="262" text-anchor="middle" font-size="17" font-weight="700">Strom</text>
<!-- Taschenlampe -->
<rect x="250" y="190" width="40" height="22" rx="4" fill="#555"/>
<path d="M290,184 L306,180 V222 L290,218 Z" fill="#777"/>
<path d="M306,182 L356,168 V234 L306,220 Z" fill="#ffd84d" opacity="0.7"/>
<text x="300" y="262" text-anchor="middle" font-size="17" font-weight="700">Licht</text>

<!-- Laenge -->
<g transform="translate(30,288)">
<circle cx="14" cy="14" r="14" fill="#E07B00"/><circle cx="14" cy="14" r="5" fill="#fff"/>
<rect x="26" y="6" width="116" height="16" fill="#ffd84d" stroke="#b8862b"/>
<g stroke="#8a6a1a" stroke-width="1.5"><line x1="40" y1="6" x2="40" y2="14"/><line x1="56" y1="6" x2="56" y2="12"/><line x1="72" y1="6" x2="72" y2="14"/><line x1="88" y1="6" x2="88" y2="12"/><line x1="104" y1="6" x2="104" y2="14"/><line x1="120" y1="6" x2="120" y2="12"/><line x1="136" y1="6" x2="136" y2="14"/></g>
</g>
<text x="100" y="342" text-anchor="middle" font-size="16" font-weight="700">bis 100 m</text>
<g transform="translate(222,288)">
<circle cx="14" cy="14" r="14" fill="#E07B00"/><circle cx="14" cy="14" r="5" fill="#fff"/>
<rect x="26" y="6" width="140" height="16" fill="#ffd84d" stroke="#b8862b"/>
<g stroke="#8a6a1a" stroke-width="1.5"><line x1="40" y1="6" x2="40" y2="14"/><line x1="56" y1="6" x2="56" y2="12"/><line x1="72" y1="6" x2="72" y2="14"/><line x1="88" y1="6" x2="88" y2="12"/><line x1="104" y1="6" x2="104" y2="14"/><line x1="120" y1="6" x2="120" y2="12"/><line x1="136" y1="6" x2="136" y2="14"/><line x1="152" y1="6" x2="152" y2="12"/></g>
</g>
<text x="300" y="342" text-anchor="middle" font-size="16" font-weight="700">nötig ab über 100 m</text>
<text x="300" y="362" text-anchor="middle" font-size="13">(Buch: bis 40 km)</text>

<!-- Preis -->
<path d="M40,380 H150 V420 H40 L24,400 Z" fill="#eaf6ee" stroke="#1f9d55" stroke-width="2"/>
<circle cx="38" cy="400" r="4" fill="#fff" stroke="#1f9d55" stroke-width="1.5"/>
<text x="98" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#1c6b3c">günstig</text>
<path d="M240,380 H380 V420 H240 L224,400 Z" fill="#fdecec" stroke="#c62828" stroke-width="2"/>
<circle cx="238" cy="400" r="4" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
<text x="312" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#a32020">deutlich teurer</text>

<text x="200" y="458" text-anchor="middle" font-size="13">Beide sind Netzwerkkabel.</text>
</svg>
