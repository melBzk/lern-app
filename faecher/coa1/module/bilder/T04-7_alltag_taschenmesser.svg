<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Alltagsvergleich. Links ein Akkuschrauber mit einem Koffer voller Aufsätze (Bohrer, Bit, Schleifscheibe): früher Erweiterungskarten einstecken. Rechts ein Taschenmesser mit Messer, Schere und Öffner: heute alles onboard. Unten: Wo der Vergleich hinkt – innen gibt es noch M.2-Plätze zum Nachrüsten.</title>
<rect width="400" height="400" fill="#fff"/>
<line x1="200" y1="14" x2="200" y2="300" stroke="#ccc" stroke-width="1.5"/>

<!-- Akkuschrauber -->
<rect x="28" y="56" width="92" height="30" rx="8" fill="#3a6ed8"/>
<rect x="58" y="82" width="26" height="58" rx="4" fill="#3a6ed8"/>
<rect x="46" y="138" width="52" height="18" rx="3" fill="#555"/>
<rect x="120" y="62" width="14" height="18" rx="2" fill="#555"/>
<line x1="134" y1="71" x2="162" y2="71" stroke="#555" stroke-width="4" stroke-linecap="round"/>
<!-- Koffer mit Aufsätzen -->
<path d="M84,178 V168 H116 V178" fill="none" stroke="#555" stroke-width="3"/>
<rect x="24" y="178" width="152" height="54" rx="6" fill="#eceff1" stroke="#555" stroke-width="2"/>
<line x1="75" y1="182" x2="75" y2="228" stroke="#9aa5b1" stroke-width="1.5"/>
<line x1="125" y1="182" x2="125" y2="228" stroke="#9aa5b1" stroke-width="1.5"/>
<line x1="36" y1="205" x2="64" y2="205" stroke="#555" stroke-width="5" stroke-linecap="round"/>
<path d="M42,200 L46,210 M50,200 L54,210 M58,200 L62,210" stroke="#eceff1" stroke-width="2"/>
<polygon points="100,193 108,198 108,208 100,213 92,208 92,198" fill="#555"/>
<circle cx="150" cy="205" r="15" fill="#9aa5b1"/>
<circle cx="150" cy="205" r="4" fill="#eceff1"/>
<text x="100" y="250" text-anchor="middle" font-size="13" fill="#444">Koffer voller Aufsätze</text>

<!-- Taschenmesser -->
<path d="M234,126 L234,62 Q252,56 264,74 L250,126 Z" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<path d="M290,126 L298,80 L305,82 L299,126 Z M300,126 L318,84 L324,87 L308,126 Z" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<path d="M346,126 L360,88 Q373,82 370,96 L362,95 L355,126 Z" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="222" y="120" width="150" height="34" rx="17" fill="#c62828"/>
<text x="246" y="50" text-anchor="middle" font-size="13">Messer</text>
<text x="309" y="72" text-anchor="middle" font-size="13">Schere</text>
<text x="368" y="76" text-anchor="middle" font-size="13">Öffner</text>

<!-- Schilder -->
<rect x="12" y="262" width="176" height="64" rx="8" fill="#eceff1"/>
<text x="100" y="286" text-anchor="middle" font-size="14" font-weight="700">früher: Erweiterungs-</text>
<text x="100" y="308" text-anchor="middle" font-size="14" font-weight="700">karten einstecken</text>
<rect x="212" y="262" width="176" height="64" rx="8" fill="#eceff1"/>
<text x="300" y="286" text-anchor="middle" font-size="14" font-weight="700">heute:</text>
<text x="300" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">alles onboard</text>

<rect x="12" y="338" width="376" height="54" rx="8" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
<text x="200" y="360" text-anchor="middle" font-size="14" font-weight="700">Wo der Vergleich hinkt:</text>
<text x="200" y="380" text-anchor="middle" font-size="14">Innen gibt es noch M.2-Plätze zum Nachrüsten.</text>
</svg>
