<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Prüfpunkt als Zeitleiste von links nach rechts: (1) grüner Haken, die VM läuft. Kamera: Prüfpunkt setzen. (2) Paket: Software oder Update installieren. (3) Rotes Kreuz: Fehler! Ein großer gebogener Pfeil führt zurück zu (1), beschriftet „Zurücksetzen“.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
</defs>
<rect width="400" height="300" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Prüfpunkt – der Weg zurück</text>

<!-- Nummern -->
<circle cx="50" cy="62" r="12" fill="#333"/><text x="50" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="250" cy="62" r="12" fill="#333"/><text x="250" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="350" cy="62" r="12" fill="#333"/><text x="350" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text>

<!-- (1) VM läuft -->
<circle cx="50" cy="112" r="28" fill="#2f9e44"/>
<polyline points="37,112 46,121 63,102" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="50" y="164" font-size="14" text-anchor="middle" font-weight="700">VM läuft</text>

<line x1="82" y1="112" x2="116" y2="112" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- Kamera -->
<rect x="124" y="94" width="52" height="38" rx="6" fill="#3a6ed8"/>
<rect x="136" y="87" width="18" height="9" rx="2" fill="#3a6ed8"/>
<circle cx="150" cy="113" r="12" fill="#fff"/>
<circle cx="150" cy="113" r="7" fill="#3a6ed8"/>
<text x="150" y="164" font-size="14" text-anchor="middle" font-weight="700" fill="#2a56b0">Prüfpunkt</text>
<text x="150" y="181" font-size="14" text-anchor="middle" font-weight="700" fill="#2a56b0">setzen</text>

<line x1="182" y1="112" x2="216" y2="112" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- (2) Paket -->
<rect x="224" y="90" width="52" height="44" rx="3" fill="#c8a27a" stroke="#8d6e63" stroke-width="2"/>
<line x1="250" y1="90" x2="250" y2="134" stroke="#8d6e63" stroke-width="2"/>
<line x1="224" y1="104" x2="276" y2="104" stroke="#8d6e63" stroke-width="2"/>
<text x="250" y="164" font-size="13" text-anchor="middle">Software</text>
<text x="250" y="180" font-size="13" text-anchor="middle">oder Update</text>
<text x="250" y="196" font-size="13" text-anchor="middle">installieren</text>

<line x1="282" y1="112" x2="316" y2="112" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

<!-- (3) Fehler -->
<circle cx="350" cy="112" r="28" fill="#c62828"/>
<line x1="339" y1="101" x2="361" y2="123" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<line x1="361" y1="101" x2="339" y2="123" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<text x="350" y="164" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">Fehler!</text>

<!-- Zurück -->
<path d="M350,186 C350,300 50,300 50,184" fill="none" stroke="#E07B00" stroke-width="5" marker-end="url(#o)"/>
<rect x="138" y="254" width="124" height="30" rx="15" fill="#fff" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="275" font-size="16" text-anchor="middle" font-weight="700" fill="#b35f00">Zurücksetzen</text>
</svg>
