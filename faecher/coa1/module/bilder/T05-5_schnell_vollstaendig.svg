<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich in zwei Spalten. Links Schnellformatierung: Inhaltsverzeichnis neu, die alten Daten in den Kästchen bleiben bunt liegen, keine Suche nach defekten Stellen, Dauer kurz. Rechts vollständige Formatierung: Inhaltsverzeichnis neu, alle Kästchen mit 0 überschrieben, Lupe: Sektor für Sektor prüfen, Dauer viel länger.</title>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Schnell oder vollständig?</text>

<!-- Spaltenköpfe -->
<rect x="10" y="42" width="185" height="36" rx="8" fill="#3a6ed8"/>
<text x="102" y="66" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">Schnell</text>
<rect x="205" y="42" width="185" height="36" rx="8" fill="#c62828"/>
<text x="297" y="66" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">Vollständig</text>

<!-- Zeile Inhaltsverzeichnis -->
<g>
<rect x="22" y="94" width="34" height="42" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<g stroke="#3a6ed8" stroke-width="1.5"><line x1="28" y1="106" x2="50" y2="106"/><line x1="28" y1="114" x2="50" y2="114"/><line x1="28" y1="122" x2="44" y2="122"/></g>
<path d="M62,114 l7,8 l13,-16" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="110" font-size="13">Inhaltsverz.</text>
<text x="90" y="127" font-size="13" font-weight="700">neu</text>
</g>
<g>
<rect x="217" y="94" width="34" height="42" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<g stroke="#3a6ed8" stroke-width="1.5"><line x1="223" y1="106" x2="245" y2="106"/><line x1="223" y1="114" x2="245" y2="114"/><line x1="223" y1="122" x2="239" y2="122"/></g>
<path d="M257,114 l7,8 l13,-16" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="285" y="110" font-size="13">Inhaltsverz.</text>
<text x="285" y="127" font-size="13" font-weight="700">neu</text>
</g>

<line x1="20" y1="152" x2="380" y2="152" stroke="#ddd"/>

<!-- Datenkästchen links: bunt -->
<g stroke="#fff" stroke-width="2">
<rect x="28" y="166" width="36" height="30" fill="#3a6ed8"/><rect x="64" y="166" width="36" height="30" fill="#F2B100"/><rect x="100" y="166" width="36" height="30" fill="#2e7d32"/><rect x="136" y="166" width="36" height="30" fill="#8e44ad"/>
<rect x="28" y="196" width="36" height="30" fill="#F2B100"/><rect x="64" y="196" width="36" height="30" fill="#2e7d32"/><rect x="100" y="196" width="36" height="30" fill="#3a6ed8"/><rect x="136" y="196" width="36" height="30" fill="#F2B100"/>
<rect x="28" y="226" width="36" height="30" fill="#2e7d32"/><rect x="64" y="226" width="36" height="30" fill="#8e44ad"/><rect x="100" y="226" width="36" height="30" fill="#F2B100"/><rect x="136" y="226" width="36" height="30" fill="#3a6ed8"/>
</g>
<text x="100" y="280" text-anchor="middle" font-weight="700" fill="#3a6ed8">alte Daten</text>
<text x="100" y="298" text-anchor="middle" font-weight="700" fill="#3a6ed8">bleiben liegen</text>

<!-- Datenkästchen rechts: 0 -->
<g fill="#eceff1" stroke="#9aa5ad" stroke-width="1.5">
<rect x="223" y="166" width="36" height="30"/><rect x="259" y="166" width="36" height="30"/><rect x="295" y="166" width="36" height="30"/><rect x="331" y="166" width="36" height="30"/>
<rect x="223" y="196" width="36" height="30"/><rect x="259" y="196" width="36" height="30"/><rect x="295" y="196" width="36" height="30"/><rect x="331" y="196" width="36" height="30"/>
<rect x="223" y="226" width="36" height="30"/><rect x="259" y="226" width="36" height="30"/><rect x="295" y="226" width="36" height="30"/><rect x="331" y="226" width="36" height="30"/>
</g>
<g font-size="15" font-weight="700" text-anchor="middle" fill="#555">
<text x="241" y="187">0</text><text x="277" y="187">0</text><text x="313" y="187">0</text><text x="349" y="187">0</text>
<text x="241" y="217">0</text><text x="277" y="217">0</text><text x="313" y="217">0</text><text x="349" y="217">0</text>
<text x="241" y="247">0</text><text x="277" y="247">0</text><text x="313" y="247">0</text><text x="349" y="247">0</text>
</g>
<text x="297" y="280" text-anchor="middle" font-weight="700" fill="#c62828">alles mit Nullen</text>
<text x="297" y="298" text-anchor="middle" font-weight="700" fill="#c62828">überschrieben</text>

<line x1="20" y1="314" x2="380" y2="314" stroke="#ddd"/>

<!-- Prüfen -->
<text x="100" y="354" text-anchor="middle" font-size="13" fill="#444">keine Suche nach</text>
<text x="100" y="372" text-anchor="middle" font-size="13" fill="#444">defekten Stellen</text>
<circle cx="236" cy="356" r="15" fill="none" stroke="#222" stroke-width="4"/>
<line x1="247" y1="367" x2="262" y2="382" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<text x="272" y="354" font-size="13">Sektor für</text>
<text x="272" y="372" font-size="13">Sektor prüfen</text>

<line x1="20" y1="398" x2="380" y2="398" stroke="#ddd"/>

<!-- Stoppuhren -->
<g>
<circle cx="56" cy="456" r="26" fill="#fff" stroke="#222" stroke-width="3"/>
<rect x="51" y="422" width="10" height="8" fill="#222"/>
<path d="M56,456 L56,436 A20,20 0 0 1 70,442 Z" fill="#3a6ed8"/>
<text x="94" y="452" font-weight="700" font-size="15">Dauer:</text>
<text x="94" y="472" font-weight="700" font-size="15" fill="#3a6ed8">kurz</text>
</g>
<g>
<circle cx="251" cy="456" r="26" fill="#fff" stroke="#222" stroke-width="3"/>
<rect x="246" y="422" width="10" height="8" fill="#222"/>
<path d="M251,456 L251,436 A20,20 0 1 1 231,456 Z" fill="#c62828"/>
<text x="289" y="452" font-weight="700" font-size="15">Dauer:</text>
<text x="289" y="472" font-weight="700" font-size="15" fill="#c62828">viel länger</text>
</g>
<line x1="200" y1="90" x2="200" y2="500" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
