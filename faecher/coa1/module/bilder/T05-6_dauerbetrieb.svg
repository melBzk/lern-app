<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>MTBF ähnlich – aber für wie viele Stunden am Tag? Links eine Standard-SATA-Platte: Manche Hersteller rechnen nur mit 8 bis 12 Stunden Betrieb am Tag, Schild Büro-PC. Rechts eine Enterprise-Platte: freigegeben für Dauerbetrieb, 24 Stunden an 7 Tagen, Schild Server. Die Tagesuhren zeigen den Anteil als farbigen Ring.</title>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="28" font-size="17" font-weight="700" text-anchor="middle">MTBF ähnlich – aber für</text>
<text x="200" y="50" font-size="17" font-weight="700" text-anchor="middle">wie viele Stunden am Tag?</text>

<!-- links -->
<rect x="10" y="70" width="185" height="350" rx="10" fill="#f5f7f8" stroke="#ccd3d8"/>
<text x="102" y="98" text-anchor="middle" font-weight="700" font-size="15">Standard-SATA</text>
<!-- Tagesuhr 24 h: Ring; 8 h kräftig, bis 12 h heller -->
<circle cx="102" cy="180" r="54" fill="none" stroke="#e0e0e0" stroke-width="16"/>
<!-- 8 h = 120 Grad, 12 h = 180 Grad, Start oben -->
<path d="M102,126 A54,54 0 0 1 148.8,207" fill="none" stroke="#3a6ed8" stroke-width="16"/>
<path d="M148.8,207 A54,54 0 0 1 102,234" fill="none" stroke="#9fbcef" stroke-width="16"/>
<text x="102" y="176" text-anchor="middle" font-weight="700" font-size="18">8 – 12 h</text>
<text x="102" y="196" text-anchor="middle" font-size="13">von 24 h</text>
<text x="102" y="270" text-anchor="middle" font-size="13">manche Hersteller</text>
<text x="102" y="288" text-anchor="middle" font-size="13">rechnen nur mit</text>
<text x="102" y="306" text-anchor="middle" font-size="13" font-weight="700">8 – 12 Stunden am Tag</text>
<rect x="38" y="350" width="128" height="40" rx="6" fill="#3a6ed8"/>
<text x="102" y="376" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">Büro-PC</text>

<!-- rechts -->
<rect x="205" y="70" width="185" height="350" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="297" y="98" text-anchor="middle" font-weight="700" font-size="15">Enterprise-Modell</text>
<circle cx="297" cy="180" r="54" fill="none" stroke="#c62828" stroke-width="16"/>
<text x="297" y="176" text-anchor="middle" font-weight="700" font-size="18">24 h</text>
<text x="297" y="196" text-anchor="middle" font-size="13">an 7 Tagen</text>
<text x="297" y="270" text-anchor="middle" font-size="13">freigegeben für</text>
<text x="297" y="288" text-anchor="middle" font-size="13" font-weight="700">Dauerbetrieb</text>
<text x="297" y="306" text-anchor="middle" font-size="13" font-weight="700">24 Stunden, 7 Tage</text>
<rect x="233" y="350" width="128" height="40" rx="6" fill="#c62828"/>
<text x="297" y="376" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">Server</text>
</svg>
