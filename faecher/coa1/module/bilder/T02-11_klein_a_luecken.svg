<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" fill="#222">
<title>97 in Binär, halb vorgerechnet: Die Stellenwerte 128 bis 1 als Treppe. 128 passt nicht in 97, also 0, Rest 97. 64 passt, also 1, Rest 97 minus 64 gleich 33. 32 passt in 33, also 1, der Rest ist eine Lücke. Die Stellen 16, 8, 4, 2 und 1 sind leere Kästchen zum Selberfüllen.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Alt + 97 = a · 97 in Binär</text>
<text x="200" y="48" text-anchor="middle" font-size="13" fill="#555">Passt der Wert? ja → 1, abziehen · nein → 0</text>
<!-- Kopf -->
<g font-size="13" font-weight="700" fill="#555">
<text x="20" y="76">Wert</text><text x="110" y="76">passt?</text><text x="220" y="76">Ziffer</text><text x="290" y="76">Rest</text>
</g>
<!-- Zeilen -->
<g font-size="15">
<rect x="10" y="84" width="380" height="36" rx="6" fill="#f4f1ee"/>
<text x="20" y="108" font-weight="700" fill="#3a6ed8">128</text><text x="110" y="108">nein</text><text x="234" y="108" font-weight="700" font-size="18">0</text><text x="290" y="108">97</text>
<rect x="10" y="124" width="380" height="36" rx="6" fill="#fdf0e0"/>
<text x="20" y="148" font-weight="700" fill="#3a6ed8">64</text><text x="110" y="148">ja</text><text x="234" y="148" font-weight="700" font-size="18" fill="#E07B00">1</text><text x="290" y="148">97 − 64 = 33</text>
<rect x="10" y="164" width="380" height="36" rx="6" fill="#fdf0e0"/>
<text x="20" y="188" font-weight="700" fill="#3a6ed8">32</text><text x="110" y="188">ja</text><text x="234" y="188" font-weight="700" font-size="18" fill="#E07B00">1</text><text x="290" y="188">33 − 32 =</text>
<rect x="362" y="170" width="24" height="24" rx="4" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="4 3"/>
</g>
<!-- Lücken -->
<g font-size="15" font-weight="700" fill="#3a6ed8">
<text x="20" y="228">16</text><text x="20" y="268">8</text><text x="20" y="308">4</text><text x="20" y="348">2</text><text x="20" y="388">1</text>
</g>
<g fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="4 3">
<rect x="110" y="208" width="60" height="28" rx="4"/><rect x="224" y="208" width="28" height="28" rx="4"/><rect x="290" y="208" width="90" height="28" rx="4"/>
<rect x="110" y="248" width="60" height="28" rx="4"/><rect x="224" y="248" width="28" height="28" rx="4"/><rect x="290" y="248" width="90" height="28" rx="4"/>
<rect x="110" y="288" width="60" height="28" rx="4"/><rect x="224" y="288" width="28" height="28" rx="4"/><rect x="290" y="288" width="90" height="28" rx="4"/>
<rect x="110" y="328" width="60" height="28" rx="4"/><rect x="224" y="328" width="28" height="28" rx="4"/><rect x="290" y="328" width="90" height="28" rx="4"/>
<rect x="110" y="368" width="60" height="28" rx="4"/><rect x="224" y="368" width="28" height="28" rx="4"/><rect x="290" y="368" width="90" height="28" rx="4"/>
</g>
<text x="200" y="414" text-anchor="middle" font-size="13" fill="#555">Die leeren Kästchen füllst du selbst.</text>
</svg>
