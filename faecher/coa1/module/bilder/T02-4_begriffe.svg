<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" fill="#222">
<title>Die 6 neuen Wörter mit kleinen Symbolen: Mainboard = die große Hauptplatine im PC. Platine = Trägerplatte für alle Bauteile. Leiterbahn = feine Metall-Leitung auf der Platine. Bus = viele Leitungen verbinden Geräte. Onboard = fest auf dem Mainboard eingebaut. ESD = winziger Funke aus deinem Körper.</title>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">6 Wörter auf einen Blick</text>
<g fill="#f4f1ee"><rect x="10" y="48" width="380" height="58" rx="10"/><rect x="10" y="112" width="380" height="58" rx="10"/><rect x="10" y="176" width="380" height="58" rx="10"/><rect x="10" y="240" width="380" height="58" rx="10"/><rect x="10" y="304" width="380" height="58" rx="10"/><rect x="10" y="368" width="380" height="58" rx="10"/></g>
<!-- Mainboard -->
<rect x="28" y="55" width="54" height="44" rx="2" fill="#2e7d4f"/>
<rect x="40" y="63" width="16" height="16" fill="#cfd8dc"/><rect x="64" y="60" width="4" height="30" fill="#333"/><rect x="72" y="60" width="4" height="30" fill="#333"/>
<text x="100" y="73" font-size="15" font-weight="700">Mainboard</text>
<text x="100" y="94" font-size="13">Hauptplatine im PC (= Motherboard)</text>
<!-- Platine -->
<rect x="26" y="134" width="58" height="10" fill="#c9b37a" stroke="#8a7440" stroke-width="1.5"/>
<rect x="26" y="144" width="58" height="10" fill="#e0cf9c" stroke="#8a7440" stroke-width="1.5"/>
<text x="100" y="137" font-size="15" font-weight="700">Platine</text>
<text x="100" y="158" font-size="13">Trägerplatte für alle Bauteile</text>
<!-- Leiterbahn -->
<rect x="26" y="184" width="58" height="42" fill="#2e7d4f"/>
<path d="M30,196 H52 L60,212 H80" fill="none" stroke="#e0a54a" stroke-width="3"/>
<text x="100" y="201" font-size="15" font-weight="700">Leiterbahn</text>
<text x="100" y="222" font-size="13">feine Metall-Leitung auf der Platine</text>
<!-- Bus -->
<rect x="22" y="254" width="16" height="30" fill="#9cc0ef" stroke="#3a6ed8" stroke-width="1.5"/>
<rect x="72" y="254" width="16" height="30" fill="#9cc0ef" stroke="#3a6ed8" stroke-width="1.5"/>
<g stroke="#e0a54a" stroke-width="2.5"><line x1="38" y1="259" x2="72" y2="259"/><line x1="38" y1="265" x2="72" y2="265"/><line x1="38" y1="271" x2="72" y2="271"/><line x1="38" y1="277" x2="72" y2="277"/></g>
<text x="100" y="265" font-size="15" font-weight="700">Bus</text>
<text x="100" y="286" font-size="13">viele Leitungen verbinden Geräte</text>
<!-- Onboard -->
<rect x="26" y="312" width="58" height="42" fill="#2e7d4f"/>
<rect x="44" y="322" width="22" height="22" fill="#333"/>
<g stroke="#ccc" stroke-width="1.5"><line x1="41" y1="327" x2="44" y2="327"/><line x1="41" y1="333" x2="44" y2="333"/><line x1="41" y1="339" x2="44" y2="339"/><line x1="66" y1="327" x2="69" y2="327"/><line x1="66" y1="333" x2="69" y2="333"/><line x1="66" y1="339" x2="69" y2="339"/></g>
<text x="100" y="329" font-size="15" font-weight="700">Onboard</text>
<text x="100" y="350" font-size="13">fest auf dem Mainboard eingebaut</text>
<!-- ESD -->
<path d="M34,404 C34,386 46,380 52,388 L52,410 Z" fill="#f2c7a5" stroke="#a0704a" stroke-width="1.5"/>
<polygon points="66,374 58,392 64,392 59,406 74,386 67,386 72,374" fill="#D4607A"/>
<text x="100" y="393" font-size="15" font-weight="700">ESD</text>
<text x="100" y="414" font-size="13">winziger Funke aus deinem Körper</text>
</svg>
