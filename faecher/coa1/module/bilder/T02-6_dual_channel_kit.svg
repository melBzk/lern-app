<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Dual Channel und Kit: Vier RAM-Steckplätze, blau, grau, blau, grau. Richtig: zwei gleiche Riegel mit je 16 GB als Kit in den beiden blauen Plätzen, zwei Kanäle gleichzeitig zur CPU, Dual Channel. Ungünstig: ein einzelner Riegel mit 32 GB, nur ein Kanal. Ohne Kit, ein schneller und ein langsamer Riegel: beide laufen im langsamsten gemeinsamen Tempo.</title>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45f06"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Dual Channel und Kit</text>
<line x1="200" y1="42" x2="200" y2="300" stroke="#ccc" stroke-width="1.5"/>
<text x="100" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#2e7d32">✓ richtig</text>
<text x="300" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="#b45f06">ungünstig</text>

<!-- links -->
<rect x="35" y="70" width="130" height="34" rx="5" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<text x="100" y="93" text-anchor="middle" font-size="15" font-weight="700">CPU</text>
<g stroke="#2e7d32" stroke-width="6"><line x1="46" y1="150" x2="46" y2="106" marker-end="url(#g)"/><line x1="126" y1="150" x2="126" y2="106" marker-end="url(#g)"/></g>
<g><rect x="40" y="138" width="12" height="122" fill="#3a6ed8"/><rect x="80" y="138" width="12" height="122" fill="#9e9e9e"/><rect x="120" y="138" width="12" height="122" fill="#3a6ed8"/><rect x="160" y="138" width="12" height="122" fill="#9e9e9e"/></g>
<g fill="#2e7d32" stroke="#1b5e20"><rect x="34" y="152" width="24" height="100" rx="2"/><rect x="114" y="152" width="24" height="100" rx="2"/></g>
<g font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><text transform="translate(50,226) rotate(-90)">16 GB</text><text transform="translate(130,226) rotate(-90)">16 GB</text></g>
<rect x="26" y="164" width="120" height="22" rx="4" fill="#D4607A"/>
<text x="86" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Kit</text>
<text x="100" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">Dual Channel:</text>
<text x="100" y="298" text-anchor="middle" font-size="14" fill="#2e7d32">beide gleichzeitig</text>

<!-- rechts -->
<rect x="235" y="70" width="130" height="34" rx="5" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<text x="300" y="93" text-anchor="middle" font-size="15" font-weight="700">CPU</text>
<line x1="246" y1="150" x2="246" y2="106" stroke="#b45f06" stroke-width="6" marker-end="url(#o)"/>
<g><rect x="240" y="138" width="12" height="122" fill="#3a6ed8"/><rect x="280" y="138" width="12" height="122" fill="#9e9e9e"/><rect x="320" y="138" width="12" height="122" fill="#3a6ed8"/><rect x="360" y="138" width="12" height="122" fill="#9e9e9e"/></g>
<rect x="234" y="152" width="24" height="100" rx="2" fill="#2e7d32" stroke="#1b5e20"/>
<text transform="translate(250,226) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">32 GB</text>
<text x="300" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#b45f06">ein Riegel allein:</text>
<text x="300" y="298" text-anchor="middle" font-size="14" fill="#b45f06">nur ein Kanal</text>

<text x="200" y="326" text-anchor="middle" font-size="13" fill="#555">gleiche Farbe = zusammengehörige Plätze</text>
<line x1="10" y1="342" x2="390" y2="342" stroke="#ccc" stroke-dasharray="6 5"/>

<!-- ohne Kit -->
<text x="14" y="370" font-size="15" font-weight="700">Ohne Kit:</text>
<rect x="14" y="392" width="80" height="30" rx="3" fill="#2e7d32"/>
<text x="54" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">schnell</text>
<text x="106" y="413" text-anchor="middle" font-size="18" font-weight="700">+</text>
<rect x="118" y="392" width="80" height="30" rx="3" fill="#2e7d32"/>
<text x="158" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">langsam</text>
<line x1="208" y1="407" x2="240" y2="407" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<!-- Tacho -->
<path d="M252,424 A42,42 0 0 1 336,424" fill="none" stroke="#9e9e9e" stroke-width="8"/>
<path d="M252,424 A42,42 0 0 1 266,393" fill="none" stroke="#c62828" stroke-width="8"/>
<line x1="294" y1="424" x2="262" y2="404" stroke="#c62828" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="294" cy="424" r="5" fill="#333"/>
<text x="252" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">langsam</text>
<text x="340" y="444" text-anchor="middle" font-size="13" fill="#555">schnell</text>

<text x="200" y="472" text-anchor="middle" font-size="14">beide laufen im <tspan font-weight="700">langsamsten</tspan></text>
<text x="200" y="490" text-anchor="middle" font-size="14">gemeinsamen Tempo</text>
</svg>
