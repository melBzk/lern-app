<rect x="71.5" y="312.5" width="8" height="6" rx="1" fill="#ccc" stroke="none" stroke-width="0" />
<rect x="19.0" y="321.0" width="8" height="6" rx="1" fill="#ccc" stroke="none" stroke-width="0" />
<rect x="29.5" y="321.0" width="8" height="6" rx="1" fill="#ccc" stroke="none" stroke-width="0" />
