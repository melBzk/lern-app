<line x1="338" y1="347" x2="364" y2="347" stroke="#222" stroke-width="2" />
<line x1="284" y1="315" x2="312" y2="315" stroke="#222" stroke-width="2" marker-end="url(#a)" />
<text x="351" y="364" font-size="13" text-anchor="middle" fill="#555" >Monitor</text>
<text x="351" y="380" font-size="13" text-anchor="middle" fill="#555" >(raus)</text>
