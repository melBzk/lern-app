<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" fill="#222">
<title>Wozu: Die IHK-Prüfung hat zwei Teile. AP1 etwa zur Hälfte der Umschulung: Hardware nach Datenblatt auswählen und begründen, zum Beispiel für den neuen Büro-PC SSD für Tempo, HDD für viel Platz zum kleinen Preis. AP2 am Ende: Datensicherungen planen, dazu gehört die Wahl des Mediums.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Wo du das brauchst</text>
<!-- Zeitstrahl -->
<line x1="20" y1="62" x2="380" y2="62" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<circle cx="200" cy="62" r="9" fill="#3a6ed8"/><circle cx="360" cy="62" r="9" fill="#7b3fa0"/>
<text x="20" y="50" font-size="13" fill="#555">Umschulung</text>
<text x="200" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">AP1 (Mitte)</text>
<text x="392" y="88" text-anchor="end" font-size="15" font-weight="700" fill="#7b3fa0">AP2 (Ende)</text>
<!-- AP1 -->
<rect x="10" y="102" width="380" height="190" rx="10" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="22" y="126" font-size="14" font-weight="700">AP1: nach Datenblatt auswählen + begründen</text>
<text x="22" y="150" font-size="14">„Welches Speichermedium für den Büro-PC?“</text>
<rect x="22" y="164" width="172" height="116" rx="8" fill="#eaf6ee" stroke="#2e9e5b" stroke-width="2"/>
<rect x="64" y="174" width="88" height="40" rx="4" fill="#fff" stroke="#2e9e5b" stroke-width="2"/><rect x="72" y="182" width="32" height="24" fill="#2e9e5b"/><rect x="112" y="182" width="32" height="24" fill="#2e9e5b"/>
<text x="108" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#2e9e5b">SSD</text>
<text x="108" y="256" text-anchor="middle" font-size="14">für Tempo</text>
<rect x="206" y="164" width="172" height="116" rx="8" fill="#eef3fc" stroke="#3a6ed8" stroke-width="2"/>
<rect x="256" y="172" width="72" height="46" rx="5" fill="#d9dde3" stroke="#444" stroke-width="1.5"/><circle cx="280" cy="195" r="16" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="292" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">HDD</text>
<text x="292" y="256" text-anchor="middle" font-size="14">viel Platz,</text><text x="292" y="272" text-anchor="middle" font-size="14">kleiner Preis</text>
<!-- AP2 -->
<rect x="10" y="300" width="380" height="110" rx="10" fill="#f3e9f8" stroke="#7b3fa0" stroke-width="2"/>
<text x="22" y="324" font-size="15" font-weight="700">AP2: Datensicherung planen</text>
<rect x="30" y="340" width="60" height="50" rx="5" fill="#fff" stroke="#555" stroke-width="1.5"/>
<g stroke="#999" stroke-width="2"><line x1="38" y1="354" x2="82" y2="354"/><line x1="38" y1="364" x2="82" y2="364"/><line x1="38" y1="374" x2="70" y2="374"/></g>
<line x1="100" y1="365" x2="150" y2="365" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="160" y="344" width="60" height="42" rx="5" fill="#fff" stroke="#7b3fa0" stroke-width="2" stroke-dasharray="5 4"/>
<text x="190" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#7b3fa0">?</text>
<text x="234" y="362" font-size="14">Welches</text>
<text x="234" y="380" font-size="14" font-weight="700">Medium?</text>
</svg>
