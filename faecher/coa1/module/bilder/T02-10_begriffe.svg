<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="system-ui, sans-serif" fill="#222">
<title>Die 7 neuen Wörter mit kleinen Symbolen: Massenspeicher = speichert große Datenmengen dauerhaft. HDD = Festplatte mit drehenden Magnetscheiben. SSD = speichert in Chips, ohne bewegliche Teile. Flash-Speicher = Chips, die Daten auch ohne Strom behalten. Optische Medien = CD, DVD, Blu-ray, ein Laser liest. Magnetband = Band in einer Kassette, der Streamer schreibt darauf. Online, Nearline, Offline = wie schnell die Daten greifbar sind.</title>
<rect width="400" height="430" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">7 Wörter auf einen Blick</text>
<g fill="#f4f1ee"><rect x="10" y="40" width="380" height="50" rx="10"/><rect x="10" y="94" width="380" height="50" rx="10"/><rect x="10" y="148" width="380" height="50" rx="10"/><rect x="10" y="202" width="380" height="50" rx="10"/><rect x="10" y="256" width="380" height="50" rx="10"/><rect x="10" y="310" width="380" height="50" rx="10"/><rect x="10" y="364" width="380" height="58" rx="10"/></g>
<!-- Massenspeicher -->
<g fill="#fff" stroke="#555" stroke-width="1.5"><rect x="26" y="70" width="56" height="12" rx="2"/><rect x="26" y="58" width="56" height="12" rx="2"/><rect x="26" y="46" width="56" height="12" rx="2"/></g>
<text x="102" y="61" font-size="15" font-weight="700">Massenspeicher</text>
<text x="102" y="80" font-size="13">große Datenmengen, dauerhaft</text>
<!-- HDD -->
<rect x="30" y="98" width="48" height="42" rx="5" fill="#d9dde3" stroke="#444" stroke-width="1.5"/>
<circle cx="50" cy="119" r="15" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/><circle cx="50" cy="119" r="3" fill="#444"/>
<line x1="74" y1="136" x2="56" y2="112" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<text x="102" y="115" font-size="15" font-weight="700" fill="#3a6ed8">HDD</text>
<text x="102" y="134" font-size="13">Festplatte, drehende Magnetscheiben</text>
<!-- SSD -->
<rect x="26" y="156" width="56" height="34" rx="4" fill="#eaf6ee" stroke="#2e9e5b" stroke-width="2"/>
<g fill="#2e9e5b"><rect x="32" y="163" width="20" height="20" rx="2"/><rect x="56" y="163" width="20" height="20" rx="2"/></g>
<text x="102" y="169" font-size="15" font-weight="700" fill="#2e9e5b">SSD</text>
<text x="102" y="188" font-size="13">speichert in Chips, nichts bewegt sich</text>
<!-- Flash -->
<rect x="38" y="210" width="32" height="34" rx="3" fill="#2e9e5b"/>
<g stroke="#2e9e5b" stroke-width="2"><line x1="32" y1="216" x2="38" y2="216"/><line x1="32" y1="227" x2="38" y2="227"/><line x1="32" y1="238" x2="38" y2="238"/><line x1="70" y1="216" x2="76" y2="216"/><line x1="70" y1="227" x2="76" y2="227"/><line x1="70" y1="238" x2="76" y2="238"/></g>
<text x="102" y="223" font-size="15" font-weight="700" fill="#2e9e5b">Flash-Speicher</text>
<text x="102" y="242" font-size="13">Chips behalten Daten auch ohne Strom</text>
<!-- Optisch -->
<circle cx="54" cy="281" r="20" fill="#fdf2e6" stroke="#d9791f" stroke-width="2"/><circle cx="54" cy="281" r="5" fill="#fff" stroke="#d9791f" stroke-width="1.5"/>
<line x1="80" y1="258" x2="62" y2="276" stroke="#d9791f" stroke-width="3"/>
<text x="102" y="277" font-size="15" font-weight="700" fill="#d9791f">Optische Medien</text>
<text x="102" y="296" font-size="13">CD, DVD, Blu-ray – ein Laser liest</text>
<!-- Magnetband -->
<rect x="22" y="316" width="64" height="38" rx="5" fill="#555"/>
<circle cx="40" cy="335" r="11" fill="#c9a36b"/><circle cx="40" cy="335" r="3" fill="#555"/>
<circle cx="68" cy="335" r="11" fill="#c9a36b"/><circle cx="68" cy="335" r="3" fill="#555"/>
<text x="102" y="331" font-size="15" font-weight="700" fill="#3a6ed8">Magnetband</text>
<text x="102" y="350" font-size="13">Kassette, Streamer schreibt darauf</text>
<!-- Online Nearline Offline -->
<rect x="22" y="400" width="18" height="14" fill="#2e9e5b"/><rect x="44" y="386" width="18" height="28" fill="#d9a400"/><rect x="66" y="372" width="18" height="42" fill="#c62828"/>
<text x="102" y="386" font-size="15" font-weight="700">Online / Nearline / Offline</text>
<text x="102" y="406" font-size="13">wie schnell die Daten greifbar sind</text>
</svg>
