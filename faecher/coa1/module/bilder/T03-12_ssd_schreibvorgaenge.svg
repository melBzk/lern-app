<path d="M95,410 h14 M102,403 v14" stroke="#fff" stroke-width="3"/>
<text x="130" y="424" font-size="15" font-weight="700" fill="#2f6b4f">genug RAM =</text>
<text x="130" y="444" font-size="15" font-weight="700" fill="#2f6b4f">weniger Schreiben</text>
</svg>
