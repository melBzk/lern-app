<text x="200" y="56" font-size="15" text-anchor="middle" font-weight="700" fill="#E07B00">Auslagern, Auslagern, Auslagern …</text>
<rect x="40" y="120" width="320" height="176" rx="8" fill="#4a4a4a"/>
<text x="52" y="140" font-size="13" font-weight="700" fill="#fff">SSD</text>
