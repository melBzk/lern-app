<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Eine SSD von oben mit einem Raster aus Speicherzellen. Pfeile mit Auslagern, Auslagern, Auslagern treffen immer wieder auf die Zellen; einige Zellen sind schon grau und abgenutzt. Darunter eine Stoppuhr: Leistungsüberwachung – Seitenschreibvorgänge/s prüfen. Und ein RAM-Riegel mit Plus: genug RAM = weniger Schreiben.</title>
<defs><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
