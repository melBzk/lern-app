<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Links passive Kühlung: nur Kühlrippen auf dem Prozessor, ein Gehäuselüfter an der Wand, kalte Luft rein, warme Luft raus. Rechts aktive Kühlung: zusätzlich ein Lüfter direkt auf den Kühlrippen, die Wärme wird schneller weggeblasen. Kühlrippen gibt es in beiden Fällen.</title>
