<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, sans-serif" fill="#222">
<title>Binär nach dezimal für 10010010 in zwei Schritten. Schritt 1: Die Ziffern 1 0 0 1 0 0 1 0 unter die Stellenwerte 128, 64, 32, 16, 8, 4, 2, 1 schreiben. Schritt 2: Nur die Werte mit einer 1 zusammenzählen: 128 plus 16 plus 2 gleich 146.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">10010010 = ?</text>
<!-- Schritt 1 -->
<circle cx="24" cy="56" r="13" fill="#3a6ed8"/><text x="24" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="46" y="61" font-size="15" font-weight="700">Ziffern unter die Stellenwerte</text>
<g text-anchor="middle" font-weight="700">
<!-- Stellenwerte -->
<g font-size="15" fill="#3a6ed8">
<text x="34" y="100">128</text><text x="80" y="100">64</text><text x="126" y="100">32</text><text x="172" y="100">16</text><text x="218" y="100">8</text><text x="264" y="100">4</text><text x="310" y="100">2</text><text x="356" y="100">1</text>
</g>
<!-- Ziffern -->
<g font-size="20" font-family="ui-monospace, Consolas, monospace">
<rect x="14" y="110" width="40" height="40" rx="5" fill="#E07B00"/><text x="34" y="138" fill="#fff">1</text>
<rect x="60" y="110" width="40" height="40" rx="5" fill="#fff" stroke="#bbb" stroke-width="2"/><text x="80" y="138" fill="#999">0</text>
<rect x="106" y="110" width="40" height="40" rx="5" fill="#fff" stroke="#bbb" stroke-width="2"/><text x="126" y="138" fill="#999">0</text>
<rect x="152" y="110" width="40" height="40" rx="5" fill="#E07B00"/><text x="172" y="138" fill="#fff">1</text>
<rect x="198" y="110" width="40" height="40" rx="5" fill="#fff" stroke="#bbb" stroke-width="2"/><text x="218" y="138" fill="#999">0</text>
<rect x="244" y="110" width="40" height="40" rx="5" fill="#fff" stroke="#bbb" stroke-width="2"/><text x="264" y="138" fill="#999">0</text>
<rect x="290" y="110" width="40" height="40" rx="5" fill="#E07B00"/><text x="310" y="138" fill="#fff">1</text>
<rect x="336" y="110" width="40" height="40" rx="5" fill="#fff" stroke="#bbb" stroke-width="2"/><text x="356" y="138" fill="#999">0</text>
</g>
</g>
<!-- Pfeile -->
<g stroke="#E07B00" stroke-width="2.5">
<line x1="34" y1="154" x2="34" y2="172" marker-end="url(#a)"/>
<line x1="172" y1="154" x2="172" y2="172" marker-end="url(#a)"/>
<line x1="310" y1="154" x2="310" y2="172" marker-end="url(#a)"/>
</g>
<g font-size="16" font-weight="700" fill="#E07B00" text-anchor="middle"><text x="34" y="192">128</text><text x="172" y="192">16</text><text x="310" y="192">2</text></g>
<!-- Schritt 2 -->
<circle cx="24" cy="222" r="13" fill="#3a6ed8"/><text x="24" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="46" y="227" font-size="15" font-weight="700">nur die Werte mit 1 zusammenzählen</text>
<rect x="40" y="242" width="320" height="50" rx="10" fill="#fdf0e0" stroke="#E07B00" stroke-width="2"/>
<text x="200" y="275" text-anchor="middle" font-size="22" font-weight="700">128 + 16 + 2</text>
<rect x="110" y="304" width="180" height="46" rx="10" fill="#2f6b4f"/>
<text x="200" y="335" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">= 146</text>
</svg>
