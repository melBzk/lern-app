<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" role="img">
  <title>Szene aus dem IT-Alltag: Du stattest einen Besprechungsraum aus, mit Beamer und Leinwand, Lautsprechern und Headsets für Videokonferenzen. Das ist der Kern von Lernfeld 2, Arbeitsplätze nach Kundenwunsch ausstatten. In der Prüfung zählt auch, ob die Lösung barrierefrei ist.</title>
  <rect width="400" height="400" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Besprechungsraum ausstatten</text>

  <!-- Raum -->
  <rect x="8" y="42" width="384" height="230" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <rect x="236" y="60" width="140" height="90" fill="#fff" stroke="#999" stroke-width="2"/>
  <text x="306" y="168" text-anchor="middle" font-size="13" fill="#333">Leinwand</text>
  <rect x="40" y="96" width="50" height="26" rx="4" fill="#3a3f4a"/><circle cx="88" cy="109" r="6" fill="#f2c200"/>
  <path d="M94,104 L236,62 L236,148 L94,114 z" fill="#f2c200" opacity="0.25"/>
  <text x="65" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Beamer</text>
  <!-- Tisch + Lautsprecher + Headsets -->
  <rect x="100" y="206" width="200" height="22" rx="6" fill="#c9a77c"/>
  <rect x="30" y="180" width="24" height="44" rx="4" fill="#3a3f4a"/><circle cx="42" cy="194" r="5" fill="#9aa3ae"/><circle cx="42" cy="212" r="7" fill="#9aa3ae"/>
  <rect x="346" y="180" width="24" height="44" rx="4" fill="#3a3f4a"/><circle cx="358" cy="194" r="5" fill="#9aa3ae"/><circle cx="358" cy="212" r="7" fill="#9aa3ae"/>
  <text x="14" y="172" font-size="14" font-weight="700" fill="#222">Lautsprecher</text>
  <g><path d="M140,204 v-6 a14,12 0 0 1 28,0 v6" fill="none" stroke="#3a3f4a" stroke-width="3.5"/><rect x="136" y="196" width="8" height="12" rx="3" fill="#3a3f4a"/><rect x="164" y="196" width="8" height="12" rx="3" fill="#3a3f4a"/><circle cx="156" cy="210" r="3" fill="#E07B00"/></g>
  <g><path d="M232,204 v-6 a14,12 0 0 1 28,0 v6" fill="none" stroke="#3a3f4a" stroke-width="3.5"/><rect x="228" y="196" width="8" height="12" rx="3" fill="#3a3f4a"/><rect x="256" y="196" width="8" height="12" rx="3" fill="#3a3f4a"/><circle cx="248" cy="210" r="3" fill="#E07B00"/></g>
  <text x="200" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Headsets: Videokonferenz</text>

  <rect x="8" y="284" width="384" height="54" rx="12" fill="#fff" stroke="#3a3f4a" stroke-width="2"/>
  <text x="24" y="307" font-size="14" font-weight="700" fill="#222">Lernfeld 2:</text>
  <text x="24" y="327" font-size="14" fill="#333">Arbeitsplätze nach Kundenwunsch ausstatten</text>
  <rect x="8" y="346" width="384" height="46" rx="12" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <text x="200" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#b35f00">Prüfung: Ist die Lösung barrierefrei?</text>
</svg>
