<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" role="img">
  <title>Spickzettel mit zwei Spalten. Links Datei und Speicher: GiB und MiB bedeuten mal 1024, GB und MB bedeuten mal 1000; Windows zeigt GB, meint aber GiB. Rechts Leitung und Geschwindigkeit: MBit pro Sekunde und GBit pro Sekunde immer mal 1000. Unten: Byte in Bit mal 8, Bit in Byte geteilt durch 8.</title>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Spickzettel: 1000 oder 1024?</text>

  <!-- Linke Spalte: Datei / Speicher -->
  <rect x="10" y="44" width="186" height="268" rx="12" fill="#eef4ff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="103" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6ed8">Datei / Speicher</text>
  <!-- Festplatten-Symbol -->
  <rect x="73" y="82" width="60" height="44" rx="5" fill="#9aa0a6" stroke="#555" stroke-width="1.5"/>
  <circle cx="98" cy="104" r="16" fill="#dee2e6" stroke="#555" stroke-width="1.5"/>
  <circle cx="98" cy="104" r="3" fill="#555"/>
  <line x1="126" y1="88" x2="104" y2="106" stroke="#333" stroke-width="3" stroke-linecap="round"/>

  <text x="24" y="160" font-size="17" font-weight="700" fill="#222">GiB, MiB</text>
  <text x="24" y="184" font-size="17" font-weight="700" fill="#3a6ed8">→ × 1024</text>
  <text x="24" y="218" font-size="17" font-weight="700" fill="#222">GB, MB</text>
  <text x="24" y="242" font-size="17" font-weight="700" fill="#3a6ed8">→ × 1000</text>
  <line x1="24" y1="258" x2="182" y2="258" stroke="#9bb3e6" stroke-width="1"/>
  <text x="24" y="278" font-size="13" fill="#444">„GB“ in Windows und</text>
  <text x="24" y="296" font-size="13" fill="#444">Unterricht = GiB (× 1024)</text>

  <!-- Rechte Spalte: Leitung / Geschwindigkeit -->
  <rect x="204" y="44" width="186" height="268" rx="12" fill="#f1f3f5" stroke="#555" stroke-width="2"/>
  <text x="297" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#333">Leitung /</text>
  <text x="297" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#333">Geschwindigkeit</text>
  <!-- Kabel-Symbol -->
  <path d="M222,118 C250,98 270,138 298,118 S346,100 356,118" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="356" y="110" width="18" height="16" rx="2" fill="#555"/>
  <rect x="374" y="114" width="6" height="3" fill="#555"/><rect x="374" y="120" width="6" height="3" fill="#555"/>

  <text x="218" y="160" font-size="17" font-weight="700" fill="#222">MBit/s,</text>
  <text x="218" y="184" font-size="17" font-weight="700" fill="#222">GBit/s</text>
  <text x="218" y="218" font-size="17" font-weight="700" fill="#333">→ immer</text>
  <text x="236" y="242" font-size="17" font-weight="700" fill="#333">× 1000</text>
  <line x1="218" y1="258" x2="376" y2="258" stroke="#bbb" stroke-width="1"/>
  <text x="218" y="278" font-size="13" fill="#444">Geschwindigkeit</text>
  <text x="218" y="296" font-size="13" fill="#444">steht in Bit</text>

  <!-- Unten: Byte und Bit -->
  <rect x="10" y="326" width="380" height="82" rx="12" fill="#fff4ec" stroke="#e8590c" stroke-width="2.5"/>
  <text x="200" y="358" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Byte → Bit: <tspan fill="#e8590c">× 8</tspan></text>
  <text x="200" y="390" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Bit → Byte: <tspan fill="#e8590c">÷ 8</tspan></text>
</svg>
