<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Vergleich: Hinter der Küchenzeile gibt es Wasser, Abfluss, Strom und Starkstrom, jeder Anschluss mit eigener Form. Am PC-Anschlussfeld gibt es genauso eigene Buchsen für Bild, Ton, Netz und Eingabe. Ausnahme PS/2: gleiche Form, nur die Farbe ist verschieden.</title>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777"/>
    </marker>
  </defs>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Küche und PC: feste Anschlüsse</text>

  <!-- Spaltenköpfe -->
  <rect x="10" y="44" width="175" height="330" rx="10" fill="#f6efe4"/>
  <rect x="215" y="44" width="175" height="330" rx="10" fill="#eef4ff"/>
  <text x="97" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Küchenwand</text>
  <text x="302" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#222">PC-Anschlussfeld</text>

  <!-- Küche: Wasser -->
  <rect x="26" y="102" width="34" height="10" fill="#6aa8e0"/>
  <rect x="50" y="94" width="10" height="26" fill="#6aa8e0"/>
  <rect x="40" y="88" width="30" height="6" rx="3" fill="#3a6ed8"/>
  <text x="80" y="111" font-size="14" fill="#222">Wasser</text>
  <!-- Küche: Abfluss -->
  <rect x="24" y="172" width="44" height="14" rx="7" fill="#999"/>
  <rect x="54" y="172" width="14" height="34" rx="7" fill="#999"/>
  <text x="80" y="185" font-size="14" fill="#222">Abfluss</text>
  <!-- Küche: Strom -->
  <circle cx="46" cy="256" r="17" fill="#fff" stroke="#555" stroke-width="2"/>
  <circle cx="40" cy="256" r="3" fill="#333"/><circle cx="52" cy="256" r="3" fill="#333"/>
  <text x="80" y="261" font-size="14" fill="#222">Strom</text>
  <!-- Küche: Starkstrom -->
  <circle cx="46" cy="330" r="20" fill="#d43c3c" stroke="#9b2525" stroke-width="2"/>
  <g fill="#fff"><circle cx="46" cy="318" r="3"/><circle cx="35" cy="326" r="3"/><circle cx="57" cy="326" r="3"/><circle cx="39" cy="340" r="3"/><circle cx="53" cy="340" r="3"/></g>
  <text x="80" y="335" font-size="14" fill="#222">Starkstrom</text>

  <!-- PC: Bild -->
  <path d="M228,98 H258 L254,116 H232 Z" fill="#3a6ed8"/>
  <path d="M264,101 H290 V110 L286,115 H268 L264,110 Z" fill="#333"/>
  <text x="300" y="111" font-size="14" fill="#222">Bild</text>
  <!-- PC: Ton -->
  <circle cx="236" cy="180" r="8" fill="#7cbf3f"/><circle cx="236" cy="180" r="3" fill="#222"/>
  <circle cx="256" cy="180" r="8" fill="#e58fb0"/><circle cx="256" cy="180" r="3" fill="#222"/>
  <circle cx="276" cy="180" r="8" fill="#6aa8e0"/><circle cx="276" cy="180" r="3" fill="#222"/>
  <text x="300" y="185" font-size="14" fill="#222">Ton</text>
  <!-- PC: Netz -->
  <rect x="240" y="242" width="30" height="26" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="249" y="262" width="12" height="6" fill="#555"/>
  <text x="300" y="261" font-size="14" fill="#222">Netz</text>
  <!-- PC: Eingabe PS/2 -->
  <circle cx="240" cy="330" r="12" fill="#3fa34d"/>
  <circle cx="270" cy="330" r="12" fill="#8e5cc4"/>
  <text x="300" y="335" font-size="14" fill="#222">Eingabe</text>

  <!-- Verbindungspfeile -->
  <g stroke="#777" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pfeil)" marker-start="url(#pfeil)">
    <line x1="140" y1="106" x2="222" y2="106"/>
    <line x1="140" y1="180" x2="226" y2="180"/>
    <line x1="140" y1="256" x2="234" y2="256"/>
    <line x1="160" y1="330" x2="224" y2="330"/>
  </g>

  <!-- Warnschild PS/2 -->
  <rect x="150" y="386" width="240" height="44" rx="8" fill="#fff3cd" stroke="#e0a800" stroke-width="2"/>
  <path d="M168,396 L180,418 H156 Z" fill="#e0a800"/>
  <text x="168" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">!</text>
  <text x="190" y="404" font-size="13" font-weight="700" fill="#222">Ausnahme PS/2:</text>
  <text x="190" y="421" font-size="13" fill="#222">gleiche Form, nur Farbe anders</text>
  <line x1="255" y1="344" x2="255" y2="386" stroke="#e0a800" stroke-width="2"/>

  <text x="200" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#D4607A">Jeder Anschluss hat seine eigene Form.</text>
</svg>
