<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Onboard oder Erweiterungskarte: Links ist der Chip für Grafik, Sound oder Netzwerk fest auf dem Mainboard eingebaut, das spart Platz und Geld, ist aber meist schwächer. Rechts wird eine eigene Grafikkarte in einen Steckplatz gesteckt, sie ist meist leistungsfähiger, zum Beispiel für 3D und Spiele.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="320" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Onboard oder Steckkarte?</text>
<text x="100" y="60" text-anchor="middle" font-size="15" font-weight="700">Onboard</text>
<text x="300" y="60" text-anchor="middle" font-size="15" font-weight="700">Erweiterungskarte</text>
<line x1="200" y1="46" x2="200" y2="306" stroke="#ccc" stroke-width="1.5"/>

<!-- Onboard -->
<rect x="14" y="76" width="172" height="124" rx="6" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<rect x="56" y="98" width="88" height="70" rx="3" fill="#263238"/>
<g stroke="#888" stroke-width="2"><line x1="62" y1="168" x2="62" y2="176"/><line x1="74" y1="168" x2="74" y2="176"/><line x1="86" y1="168" x2="86" y2="176"/><line x1="98" y1="168" x2="98" y2="176"/><line x1="110" y1="168" x2="110" y2="176"/><line x1="122" y1="168" x2="122" y2="176"/><line x1="134" y1="168" x2="134" y2="176"/></g>
<text x="100" y="120" text-anchor="middle" font-size="13" fill="#fff">Grafik /</text>
<text x="100" y="137" text-anchor="middle" font-size="13" fill="#fff">Sound /</text>
<text x="100" y="154" text-anchor="middle" font-size="13" fill="#fff">Netzwerk</text>
<text x="100" y="220" text-anchor="middle" font-size="13">fest eingebaut</text>

<!-- Steckkarte -->
<rect x="234" y="80" width="130" height="58" rx="4" fill="#455a64"/>
<circle cx="268" cy="109" r="20" fill="#90a4ae" stroke="#cfd8dc" stroke-width="2"/>
<circle cx="330" cy="109" r="20" fill="#90a4ae" stroke="#cfd8dc" stroke-width="2"/>
<rect x="248" y="138" width="100" height="9" fill="#c9a227"/>
<line x1="378" y1="112" x2="378" y2="170" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="214" y="170" width="172" height="30" rx="4" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<rect x="240" y="180" width="116" height="9" fill="#333"/>
<text x="300" y="220" text-anchor="middle" font-size="13">wird eingesteckt</text>

<!-- Bewertung -->
<text x="16" y="256" font-size="14" font-weight="700" fill="#2e7d32">✓ spart Platz und Geld</text>
<text x="16" y="282" font-size="14" font-weight="700" fill="#c62828">− meist schwächer</text>
<text x="214" y="256" font-size="14" font-weight="700" fill="#2e7d32">+ meist leistungs-</text>
<text x="228" y="274" font-size="14" font-weight="700" fill="#2e7d32">fähiger</text>
<text x="228" y="296" font-size="13">z. B. für 3D und Spiele</text>
</svg>
