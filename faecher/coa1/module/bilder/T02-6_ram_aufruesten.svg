<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" fill="#222">
<title>Arbeitsspeicher aufrüsten auf 32 GB in fünf Schritten: 1. Generation: DDR4, denn DDR5 passt nicht. 2. Zwei mal 16 GB statt einmal 32 GB, wegen Dual Channel. 3. Als Kit kaufen, damit beide gleich schnell laufen. 4. In die beiden gleichfarbigen, hier blauen Steckplätze. 5. Strom trennen und eindrücken, bis beide Klammern ganz zu sind.</title>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">32 GB RAM nachrüsten – 5 Schritte</text>
<g fill="#f4f1ee"><rect x="10" y="42" width="380" height="76" rx="10"/><rect x="10" y="126" width="380" height="76" rx="10"/><rect x="10" y="210" width="380" height="76" rx="10"/><rect x="10" y="294" width="380" height="76" rx="10"/><rect x="10" y="378" width="380" height="84" rx="10"/></g>
<g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="32" cy="66" r="14" fill="#D4607A"/><text x="32" y="71">1</text>
<circle cx="32" cy="150" r="14" fill="#D4607A"/><text x="32" y="155">2</text>
<circle cx="32" cy="234" r="14" fill="#D4607A"/><text x="32" y="239">3</text>
<circle cx="32" cy="318" r="14" fill="#D4607A"/><text x="32" y="323">4</text>
<circle cx="32" cy="402" r="14" fill="#D4607A"/><text x="32" y="407">5</text>
</g>
<!-- 1 -->
<text x="56" y="71" font-size="15" font-weight="700">Generation: DDR4</text>
<rect x="56" y="84" width="90" height="24" rx="5" fill="#d4efd9" stroke="#2e9d5b" stroke-width="2"/><text x="101" y="101" text-anchor="middle" font-size="14" font-weight="700">DDR4 ✓</text>
<rect x="160" y="84" width="90" height="24" rx="5" fill="#fdeeee" stroke="#d43c3c" stroke-width="2"/><text x="205" y="101" text-anchor="middle" font-size="14" font-weight="700">DDR5 ✗</text>
<text x="262" y="101" font-size="13">Steg sitzt anders</text>
<!-- 2 -->
<text x="56" y="155" font-size="15" font-weight="700">2 × 16 GB statt 1 × 32 GB</text>
<g fill="#2e7d4f"><rect x="56" y="168" width="70" height="22" rx="2"/><rect x="134" y="168" width="70" height="22" rx="2"/></g>
<g font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><text x="91" y="184">16 GB</text><text x="169" y="184">16 GB</text></g>
<text x="216" y="184" font-size="13">→ Dual Channel</text>
<!-- 3 -->
<text x="56" y="239" font-size="15" font-weight="700">als Kit kaufen</text>
<rect x="56" y="250" width="148" height="28" rx="6" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<g fill="#2e7d4f"><rect x="62" y="255" width="66" height="18" rx="2"/><rect x="132" y="255" width="66" height="18" rx="2"/></g>
<text x="216" y="268" font-size="13">beide gleich schnell</text>
<!-- 4 -->
<text x="56" y="323" font-size="15" font-weight="700">in die gleichfarbigen Plätze</text>
<g><rect x="56" y="336" width="14" height="24" fill="#3a6ed8"/><rect x="76" y="336" width="14" height="24" fill="#999"/><rect x="96" y="336" width="14" height="24" fill="#3a6ed8"/><rect x="116" y="336" width="14" height="24" fill="#999"/></g>
<text x="144" y="353" font-size="13">hier: blau · steht im Handbuch</text>
<!-- 5 -->
<text x="56" y="407" font-size="15" font-weight="700">Strom trennen, eindrücken</text>
<rect x="56" y="420" width="120" height="26" rx="2" fill="#2e7d4f"/>
<g fill="#D4607A"><rect x="48" y="416" width="8" height="34" rx="2"/><rect x="176" y="416" width="8" height="34" rx="2"/></g>
<text x="196" y="438" font-size="13">bis beide Klammern ganz zu</text>
</svg>
