<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Merkbild. 1 Reihe L1, L2, L3, RAM, Festplatte/SSD als Treppe: je näher an der CPU, desto schneller, kleiner und teurer. 2 Programm: Festplatte → RAM → Cache. 3 Cache und RAM flüchtig, Festplatte, SSD und Flash nichtflüchtig. 4 Cache = SRAM, schnell und teuer; RAM = DRAM, dichter und günstiger. 5 L1 je Kern (Daten und Befehle), L2 je Kern oder gemeinsam, L3 gemeinsam und am größten.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Das Wichtigste</text>
<rect x="10" y="42" width="380" height="112" rx="10" fill="#f4f5f7"/>
<g font-size="13" font-weight="700" text-anchor="middle">
<rect x="20" y="90" width="50" height="22" rx="3" fill="#E07B00"/><text x="45" y="106" fill="#fff">L1</text>
<rect x="76" y="84" width="56" height="28" rx="3" fill="#f0a24a"/><text x="104" y="103" fill="#fff">L2</text>
<rect x="138" y="76" width="62" height="36" rx="3" fill="#f6c58a"/><text x="169" y="99">L3</text>
<rect x="206" y="66" width="74" height="46" rx="3" fill="#3a6ed8"/><text x="243" y="94" fill="#fff">RAM</text>
<rect x="286" y="54" width="96" height="58" rx="3" fill="#5b6470"/><text x="334" y="88" fill="#fff">HDD/SSD</text>
</g>
<text x="24" y="136" font-size="14" font-weight="700" fill="#c25e00">← schneller, kleiner, teurer</text>
<text x="376" y="136" text-anchor="end" font-size="14" font-weight="700" fill="#555">größer →</text>
<rect x="10" y="160" width="380" height="62" rx="10" fill="#f4f5f7"/>
<text x="24" y="184" font-size="14" font-weight="700">Programm:</text>
<text x="24" y="208" font-size="15">Festplatte → RAM → Cache</text>
<rect x="10" y="228" width="380" height="80" rx="10" fill="#f4f5f7"/>
<text x="24" y="254" font-size="15"><tspan font-weight="700" fill="#c62828">flüchtig:</tspan> Cache, RAM</text>
<text x="24" y="282" font-size="15"><tspan font-weight="700" fill="#2f9e44">nichtflüchtig:</tspan> Festplatte, SSD, Flash</text>
<rect x="10" y="314" width="380" height="80" rx="10" fill="#e3ecfb"/>
<text x="24" y="340" font-size="15"><tspan font-weight="700">Cache = SRAM:</tspan> schnell, teuer</text>
<text x="24" y="368" font-size="15"><tspan font-weight="700">RAM = DRAM:</tspan> dichter, günstiger</text>
<rect x="10" y="400" width="380" height="90" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<text x="24" y="424" font-size="15"><tspan font-weight="700">L1</tspan> je Kern (Daten + Befehle)</text>
<text x="24" y="450" font-size="15"><tspan font-weight="700">L2</tspan> je Kern oder gemeinsam</text>
<text x="24" y="476" font-size="15"><tspan font-weight="700">L3</tspan> gemeinsam, am größten</text>
</svg>
