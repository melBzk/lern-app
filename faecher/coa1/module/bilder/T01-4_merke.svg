<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 448" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Fünf Merkzeilen: Schnittstelle ist ein Übergabepunkt, bei Geräten und Programmen. PS/2: grün Maus, lila Tastatur, seriell, kein Hot-Plugging. USB ist Standard, seriell, Hot-Plugging-fähig, bis 127 Geräte. Passiver Hub ohne Netzteil nur für Maus und Tastatur. Die praktische Übertragungsrate (kurzer Balken) ist kleiner als die theoretische (langer Balken).</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="448" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700" fill="#222">Das Wichtigste auf einen Blick</text>
<rect x="10" y="44" width="380" height="70" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<path d="M38,66 h22 v6 a5,5 0 0 1 0,10 v12 h-22 z" fill="#3a6ed8" stroke="#1f3f80" stroke-width="1.5"/><path d="M62,66 h24 v28 h-24 v-12 a5,5 0 0 0 0,-10 z" fill="#E07B00" stroke="#8a4b00" stroke-width="1.5"/>
<text x="128" y="74" font-size="15" font-weight="700" fill="#222">Schnittstelle</text>
<text x="128" y="96" font-size="13" fill="#444">Übergabepunkt: Geräte und Programme</text>
<rect x="10" y="124" width="380" height="70" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<circle cx="46" cy="160" r="15" fill="#2f6b4f" stroke="#333" stroke-width="1.5"/><circle cx="46" cy="160" r="9" fill="#fff" stroke="none" stroke-width="0"/><circle cx="41.5" cy="157.3" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="50.5" cy="157.3" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="40.6" cy="162.7" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="51.4" cy="162.7" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="44.2" cy="165.4" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="47.8" cy="165.4" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="86" cy="160" r="15" fill="#7b3fa0" stroke="#333" stroke-width="1.5"/><circle cx="86" cy="160" r="9" fill="#fff" stroke="none" stroke-width="0"/><circle cx="81.5" cy="157.3" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="90.5" cy="157.3" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="80.6" cy="162.7" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="91.4" cy="162.7" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="84.2" cy="165.4" r="1.6" fill="#333" stroke="none" stroke-width="0"/><circle cx="87.8" cy="165.4" r="1.6" fill="#333" stroke="none" stroke-width="0"/>
<text x="128" y="154" font-size="15" font-weight="700" fill="#222">PS/2: grün Maus, lila Tastatur</text>
<text x="128" y="176" font-size="13" fill="#444">seriell, kein Hot-Plugging</text>
<rect x="10" y="204" width="380" height="70" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<path d="M32,250 Q46,250 52,240" fill="none" stroke="#333" stroke-width="4"/><rect x="50" y="231" width="26" height="18" rx="3" fill="#555" stroke="#222" stroke-width="1.5"/><rect x="76" y="233" width="22" height="14" rx="1" fill="#d0d4d9" stroke="#555" stroke-width="1.5"/><rect x="81" y="236" width="4" height="3" rx="0" fill="#555" stroke="none" stroke-width="0"/><rect x="89" y="236" width="4" height="3" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="128" y="234" font-size="15" font-weight="700" fill="#222">USB = Standard</text>
<text x="128" y="256" font-size="13" fill="#444">seriell, Hot-Plugging, bis 127 Geräte</text>
<rect x="10" y="284" width="380" height="70" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<rect x="32" y="306" width="68" height="28" rx="6" fill="#dfe3e8" stroke="#333" stroke-width="1.5"/><rect x="39" y="316" width="10" height="8" rx="1" fill="#555" stroke="none" stroke-width="0"/><rect x="54" y="316" width="10" height="8" rx="1" fill="#555" stroke="none" stroke-width="0"/><rect x="69" y="316" width="10" height="8" rx="1" fill="#555" stroke="none" stroke-width="0"/><rect x="84" y="316" width="10" height="8" rx="1" fill="#555" stroke="none" stroke-width="0"/>
<text x="128" y="314" font-size="15" font-weight="700" fill="#222">passiver Hub</text>
<text x="128" y="336" font-size="13" fill="#444">kein Netzteil: nur Maus + Tastatur</text>
<rect x="10" y="364" width="380" height="70" rx="12" fill="#fff" stroke="#bbb" stroke-width="2.5"/>
<rect x="28" y="380" width="80" height="14" rx="3" fill="#dfe3e8" stroke="#999" stroke-width="1"/>
<rect x="28" y="404" width="40" height="14" rx="3" fill="#E07B00" stroke="none" stroke-width="0"/>
<text x="128" y="394" font-size="15" font-weight="700" fill="#222">praktisch &lt; theoretisch</text>
<text x="128" y="416" font-size="13" fill="#444">Übertragungsrate</text>
</svg>
