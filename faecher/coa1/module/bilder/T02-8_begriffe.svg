<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" font-family="system-ui, sans-serif" fill="#222">
<title>Die 7 neuen Wörter mit kleinen Symbolen: Von-Neumann-Architektur = Bauplan eines PCs. Steuerwerk = steuert und kontrolliert alle Abläufe, auch Leitwerk. Rechenwerk = führt die Rechnungen aus. ALU = Rechen- und Logik-Einheit für plus, minus, mal, geteilt und UND, ODER, NICHT. FPU = rechnet mit Kommazahlen. Register = winzige Ablagefächer für Zwischenergebnisse. Cache = sehr schneller, kleiner Speicher in der CPU, Stufen L1 bis L3.</title>
<rect width="400" height="460" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">7 Wörter auf einen Blick</text>
<g fill="#f4f1ee"><rect x="10" y="42" width="380" height="54" rx="10"/><rect x="10" y="102" width="380" height="54" rx="10"/><rect x="10" y="162" width="380" height="54" rx="10"/><rect x="10" y="222" width="380" height="54" rx="10"/><rect x="10" y="282" width="380" height="54" rx="10"/><rect x="10" y="342" width="380" height="54" rx="10"/><rect x="10" y="402" width="380" height="54" rx="10"/></g>
<!-- Von Neumann -->
<g fill="#fff" stroke="#555" stroke-width="1.5"><rect x="24" y="50" width="20" height="14"/><rect x="50" y="50" width="20" height="14"/><rect x="76" y="50" width="14" height="14"/></g>
<line x1="24" y1="76" x2="90" y2="76" stroke="#e0a54a" stroke-width="4"/>
<g stroke="#555" stroke-width="1.5"><line x1="34" y1="64" x2="34" y2="76"/><line x1="60" y1="64" x2="60" y2="76"/><line x1="83" y1="64" x2="83" y2="76"/><line x1="57" y1="76" x2="57" y2="86"/></g>
<text x="104" y="64" font-size="15" font-weight="700">Von-Neumann-Architektur</text>
<text x="104" y="84" font-size="13">der Bauplan eines PCs</text>
<!-- Steuerwerk -->
<rect x="30" y="110" width="52" height="38" rx="6" fill="#fbe3e8" stroke="#D4607A" stroke-width="2"/>
<path d="M44,136 L56,122 L68,136" fill="none" stroke="#b03a56" stroke-width="3"/>
<text x="104" y="124" font-size="15" font-weight="700">Steuerwerk (Leitwerk)</text>
<text x="104" y="144" font-size="13">steuert und kontrolliert alle Abläufe</text>
<!-- Rechenwerk -->
<rect x="30" y="170" width="52" height="38" rx="6" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="2"/>
<text x="56" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#2550a8">+ ×</text>
<text x="104" y="184" font-size="15" font-weight="700">Rechenwerk</text>
<text x="104" y="204" font-size="13">führt die Rechnungen aus</text>
<!-- ALU -->
<rect x="30" y="230" width="52" height="38" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="56" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#2550a8">7&gt;5</text>
<text x="104" y="244" font-size="15" font-weight="700">ALU</text>
<text x="104" y="264" font-size="13">+ − × ÷, UND/ODER/NICHT, vergleichen</text>
<!-- FPU -->
<rect x="30" y="290" width="52" height="38" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="56" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#2550a8">3,75</text>
<text x="104" y="304" font-size="15" font-weight="700">FPU</text>
<text x="104" y="324" font-size="13">rechnet mit Kommazahlen</text>
<!-- Register -->
<g fill="#fff" stroke="#555" stroke-width="1.5"><rect x="26" y="356" width="18" height="26"/><rect x="47" y="356" width="18" height="26"/><rect x="68" y="356" width="18" height="26"/></g>
<text x="104" y="364" font-size="15" font-weight="700">Register</text>
<text x="104" y="384" font-size="13">winzige Fächer für Zwischenergebnisse</text>
<!-- Cache -->
<g fill="#d4efd9" stroke="#2e9d5b" stroke-width="1.5"><rect x="26" y="430" width="18" height="16"/><rect x="47" y="422" width="18" height="24"/><rect x="68" y="412" width="18" height="34"/></g>
<text x="104" y="424" font-size="15" font-weight="700">Cache (L1 bis L3)</text>
<text x="104" y="444" font-size="13">schneller, kleiner Speicher in der CPU</text>
</svg>
