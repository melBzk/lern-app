<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif">
  <title>Drei Typen von Pixelfehlern, jeweils stark vergrößert. Fehlertyp 1: In einem dunklen Bild leuchtet ein Pixel immer hell. Fehlertyp 2: In einem weißen Bild bleibt ein Pixel immer dunkel. Bei Typ 1 und 2 ist das ganze Pixel kaputt. Fehlertyp 3: Nur ein Subpixel ist defekt, hier leuchtet der rote Streifen ständig. Genauso kann ein Subpixel ständig grün oder blau leuchten oder dunkel bleiben.</title>
  <rect width="400" height="440" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Drei Typen von Pixelfehlern</text>

