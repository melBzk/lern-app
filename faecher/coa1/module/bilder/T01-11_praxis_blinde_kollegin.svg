<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="system-ui, sans-serif" role="img">
  <title>Praxisfall, die Ausgangslage als Bild. Am PC steht ein Text. Eine neue Kollegin ist blind, sehen geht also nicht. Sie soll wie alle anderen mit Texten am PC arbeiten. Gesucht: Welche Ausgabegeräte bringen den Text zu ihr? Angedeutet durch ein Fragezeichen.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="400" height="330" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Eine blinde Kollegin fängt an</text>

  <!-- PC mit Text -->
  <rect x="16" y="60" width="120" height="84" rx="5" fill="#3a3f4a"/><rect x="22" y="66" width="108" height="72" fill="#fff"/>
  <g stroke="#333" stroke-width="2.5"><line x1="30" y1="80" x2="120" y2="80"/><line x1="30" y1="94" x2="116" y2="94"/><line x1="30" y1="108" x2="120" y2="108"/><line x1="30" y1="122" x2="100" y2="122"/></g>
  <rect x="66" y="144" width="20" height="12" fill="#555"/><rect x="50" y="156" width="52" height="6" rx="2" fill="#555"/>
  <text x="76" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Text am PC</text>

  <line x1="146" y1="104" x2="176" y2="104" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <rect x="182" y="72" width="64" height="64" rx="10" fill="#fff" stroke="#E07B00" stroke-width="3"/>
  <text x="214" y="117" text-anchor="middle" font-size="36" font-weight="700" fill="#E07B00">?</text>
  <line x1="256" y1="104" x2="286" y2="104" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

  <!-- Person -->
  <circle cx="338" cy="80" r="22" fill="#f1d3b5" stroke="#3a3f4a" stroke-width="2"/>
  <path d="M304,160 q34,-60 68,0 z" fill="#3a3f4a"/>
  <text x="338" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Kollegin</text>

  <rect x="8" y="206" width="384" height="112" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <path d="M30,250 q20,-20 40,0 q-20,20 -40,0 z" fill="#fff" stroke="#3a3f4a" stroke-width="2"/><circle cx="50" cy="250" r="6" fill="#3a3f4a"/>
  <line x1="28" y1="270" x2="72" y2="230" stroke="#d63c3c" stroke-width="4"/>
  <text x="90" y="246" font-size="15" font-weight="700" fill="#a32020">sehen geht nicht</text>
  <text x="90" y="268" font-size="14" fill="#333">Welche Ausgabegeräte bringen</text>
  <text x="90" y="288" font-size="14" fill="#333">den Text zu ihr?</text>
</svg>
