<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="system-ui, sans-serif" fill="#222">
<title>In der AP1 Hardware nach Datenblatt auswählen: Neben einem Datenblatt stehen die drei ersten Fragen: 1. Passt der Sockel? 2. Was sagen die Buchstaben K und T? 3. Reicht die Kühlung?</title>
<rect width="400" height="340" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Datenblatt lesen: 3 erste Fragen</text>
<rect x="20" y="48" width="104" height="146" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="72" y="72" text-anchor="middle" font-size="13" font-weight="700">Datenblatt</text>
<g stroke="#999" stroke-width="2"><line x1="32" y1="88" x2="112" y2="88"/><line x1="32" y1="104" x2="100" y2="104"/><line x1="32" y1="120" x2="112" y2="120"/><line x1="32" y1="136" x2="94" y2="136"/><line x1="32" y1="152" x2="112" y2="152"/><line x1="32" y1="168" x2="104" y2="168"/></g>
<g fill="#f4f1ee"><rect x="140" y="48" width="250" height="44" rx="10"/><rect x="140" y="100" width="250" height="44" rx="10"/><rect x="140" y="152" width="250" height="44" rx="10"/></g>
<g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="162" cy="70" r="13" fill="#D4607A"/><text x="162" y="75">1</text>
<circle cx="162" cy="122" r="13" fill="#D4607A"/><text x="162" y="127">2</text>
<circle cx="162" cy="174" r="13" fill="#D4607A"/><text x="162" y="179">3</text>
</g>
<g font-size="15" font-weight="700"><text x="184" y="75">Passt der Sockel?</text><text x="184" y="127">K oder T?</text><text x="184" y="179">Reicht die Kühlung?</text></g>
<rect x="10" y="216" width="380" height="110" rx="10" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="200" y="244" text-anchor="middle" font-size="14" fill="#666">später vertieft (Block 3/4):</text>
<g text-anchor="middle" font-size="15" font-weight="700">
<rect x="34" y="260" width="96" height="44" rx="8" fill="#e3ecfb"/><text x="82" y="288">Kerne</text>
<rect x="152" y="260" width="96" height="44" rx="8" fill="#e3ecfb"/><text x="200" y="288">Takt</text>
<rect x="270" y="260" width="96" height="44" rx="8" fill="#e3ecfb"/><text x="318" y="288">Leistung</text>
</g>
</svg>
