<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Elektronischer Chip oder Licht-Chip? Links ein Chip mit Blitz: elektronisch (CPU/GPU). Rechts ein Chip mit Lichtstrahl: photonisch (Co-Prozessor). Drei Vergleiche darunter: Schalter mit 0 oder 1, digital, gegenüber Dimmer, analog. Große Flamme, viel Wärme, gegenüber kleiner Flamme, kaum Wärme. Allrounder, kann alles, gegenüber Spezialist für bestimmte Rechnungen.</title>
<rect width="400" height="450" fill="#fff"/>

<!-- Köpfe -->
<rect x="75" y="20" width="60" height="60" rx="6" fill="#5b6470"/>
<path d="M110,30 L94,54 H106 L98,72 L118,46 H106 Z" fill="#ffd43b"/>
<text x="105" y="104" text-anchor="middle" font-size="15" font-weight="700">elektronisch</text>
<text x="105" y="122" text-anchor="middle" font-size="13" fill="#555">(CPU/GPU)</text>
<rect x="265" y="20" width="60" height="60" rx="6" fill="#cfe3f7" stroke="#3a6ed8" stroke-width="2.5"/>
<path d="M248,50 H342" stroke="#c62828" stroke-width="4"/>
<text x="295" y="104" text-anchor="middle" font-size="15" font-weight="700">photonisch</text>
<text x="295" y="122" text-anchor="middle" font-size="13" fill="#555">(Co-Prozessor)</text>

<!-- Zeile 1 -->
<rect x="10" y="138" width="380" height="94" rx="10" fill="#f4f5f7"/>
<rect x="90" y="150" width="30" height="46" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="92" y="152" width="26" height="21" rx="3" fill="#3a6ed8"/>
<text x="76" y="166" text-anchor="end" font-size="13" font-weight="700">1</text>
<text x="76" y="192" text-anchor="end" font-size="13" font-weight="700">0</text>
<text x="105" y="220" text-anchor="middle" font-size="14">digital: 0 oder 1</text>
<text x="200" y="182" text-anchor="middle" font-size="24" fill="#777">↔</text>
<g stroke-width="5" stroke-linecap="round" fill="none">
<path d="M280,190 A20,20 0 0 1 276,168" stroke="#343a40"/>
<path d="M281,158 A20,20 0 0 1 300,152" stroke="#a6a07a"/>
<path d="M309,155 A20,20 0 0 1 314,190" stroke="#ffd43b"/>
</g>
<circle cx="295" cy="174" r="12" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M295,174 V164" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="295" y="220" text-anchor="middle" font-size="14">analog: stufenlos</text>

<!-- Zeile 2 -->
<rect x="10" y="242" width="380" height="94" rx="10" fill="#f4f5f7"/>
<path d="M105,302 C80,292 84,268 105,248 C108,266 128,272 124,290 C122,298 114,302 105,302 Z" fill="#E07B00"/>
<path d="M106,302 C96,296 98,284 106,276 C108,286 116,290 114,296 C113,300 110,302 106,302 Z" fill="#ffd43b"/>
<text x="105" y="324" text-anchor="middle" font-size="14">viel Wärme</text>
<text x="200" y="286" text-anchor="middle" font-size="24" fill="#777">↔</text>
<path d="M295,302 C287,298 288,290 295,282 C297,290 303,292 302,297 C301,300 298,302 295,302 Z" fill="#E07B00"/>
<text x="295" y="324" text-anchor="middle" font-size="14">kaum Wärme beim Rechnen</text>

<!-- Zeile 3 -->
<rect x="10" y="346" width="380" height="94" rx="10" fill="#f4f5f7"/>
<text x="105" y="388" text-anchor="middle" font-size="16" font-weight="700">Allrounder</text>
<text x="105" y="410" text-anchor="middle" font-size="14">kann alles, genau</text>
<text x="200" y="392" text-anchor="middle" font-size="24" fill="#777">↔</text>
<text x="295" y="388" text-anchor="middle" font-size="16" font-weight="700" fill="#c25e00">Spezialist</text>
<text x="295" y="410" text-anchor="middle" font-size="14">nur bestimmte</text>
<text x="295" y="428" text-anchor="middle" font-size="14">Rechnungen, Helfer</text>
</svg>
