<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Szenen mit je vier Kernen. Oben: Ein Programm, das nur nacheinander arbeitet: Kern 1 ist zu 100 Prozent ausgelastet, Kern 2 bis 4 warten leer. Vier Kerne, trotzdem nicht schneller. Unten: Mehrere Programme gleichzeitig: Browser, Musik, Virenscanner und Textprogramm laufen je auf einem eigenen Kern. Hier spielt Multi-Core seine Stärke aus.</title>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Mehr Kerne = schneller?</text>

<!-- Szene 1 -->
<rect x="10" y="40" width="380" height="216" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="24" y="66" font-size="15" font-weight="700">1 Programm, das nur nacheinander arbeitet</text>
<text x="24" y="102" font-size="14" font-weight="700">Kern 1</text>
<rect x="90" y="82" width="286" height="30" rx="5" fill="#c62828"/>
<text x="233" y="103" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">100 %</text>
<text x="24" y="140" font-size="14" font-weight="700" fill="#777">Kern 2</text>
<rect x="90" y="120" width="286" height="30" rx="5" fill="#eee" stroke="#bbb" stroke-width="1.5"/>
<text x="233" y="141" font-size="14" text-anchor="middle" fill="#777">wartet</text>
<text x="24" y="178" font-size="14" font-weight="700" fill="#777">Kern 3</text>
<rect x="90" y="158" width="286" height="30" rx="5" fill="#eee" stroke="#bbb" stroke-width="1.5"/>
<text x="233" y="179" font-size="14" text-anchor="middle" fill="#777">wartet</text>
<text x="24" y="216" font-size="14" font-weight="700" fill="#777">Kern 4</text>
<rect x="90" y="196" width="286" height="30" rx="5" fill="#eee" stroke="#bbb" stroke-width="1.5"/>
<text x="233" y="217" font-size="14" text-anchor="middle" fill="#777">wartet</text>
<text x="200" y="247" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">4 Kerne – trotzdem nicht schneller</text>

<!-- Szene 2 -->
<rect x="10" y="268" width="380" height="222" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="24" y="294" font-size="15" font-weight="700">Mehrere Programme gleichzeitig</text>
<text x="24" y="330" font-size="14" font-weight="700">Kern 1</text>
<rect x="90" y="310" width="286" height="30" rx="5" fill="#eee"/>
<rect x="90" y="310" width="230" height="30" rx="5" fill="#2f9e44"/>
<text x="100" y="331" font-size="14" font-weight="700" fill="#fff">Browser</text>
<text x="24" y="368" font-size="14" font-weight="700">Kern 2</text>
<rect x="90" y="348" width="286" height="30" rx="5" fill="#eee"/>
<rect x="90" y="348" width="150" height="30" rx="5" fill="#2f9e44"/>
<text x="100" y="369" font-size="14" font-weight="700" fill="#fff">Musik</text>
<text x="24" y="406" font-size="14" font-weight="700">Kern 3</text>
<rect x="90" y="386" width="286" height="30" rx="5" fill="#eee"/>
<rect x="90" y="386" width="270" height="30" rx="5" fill="#2f9e44"/>
<text x="100" y="407" font-size="14" font-weight="700" fill="#fff">Virenscanner</text>
<text x="24" y="444" font-size="14" font-weight="700">Kern 4</text>
<rect x="90" y="424" width="286" height="30" rx="5" fill="#eee"/>
<rect x="90" y="424" width="180" height="30" rx="5" fill="#2f9e44"/>
<text x="100" y="445" font-size="14" font-weight="700" fill="#fff">Textprogramm</text>
<text x="200" y="477" font-size="15" text-anchor="middle" font-weight="700" fill="#2f9e44">Hier spielt Multi-Core seine Stärke aus</text>
</svg>
