<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif">
  <title>Wie viel Strom liefert USB? Eine USB-Buchse als Zapfsäule mit Anzeige 5 Volt. Kurzer Balken: USB 1.x und 2.0 höchstens 500 Milliampere, das sind 2,5 Watt. Längerer Balken: USB 3.0 höchstens 900 Milliampere. Unten links mit grünem Haken: Das reicht für Maus und USB-Stick. Unten rechts: Drucker, Scanner und Kamera brauchen mehr und bringen eine eigene Stromversorgung über die Steckdose mit.</title>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Wie viel Strom liefert USB?</text>

  <!-- Zapfsäule -->
  <rect x="30" y="44" width="340" height="186" rx="12" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
  <!-- USB-Buchse oben links -->
  <rect x="48" y="60" width="62" height="28" rx="3" fill="#fff" stroke="#3a6ed8" stroke-width="3"/>
  <rect x="54" y="65" width="50" height="9" fill="#3a6ed8"/>
  <text x="79" y="106" text-anchor="middle" font-size="13" fill="#3a6ed8">USB-Buchse</text>
  <!-- Anzeige -->
  <rect x="160" y="56" width="110" height="42" rx="6" fill="#222"/>
  <text x="215" y="86" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5 V</text>
  <text x="282" y="82" font-size="13" fill="#222">Spannung</text>

  <!-- Balken -->
  <text x="48" y="134" font-size="14" fill="#222"><tspan font-weight="700">USB 1.x/2.0:</tspan> max. 500 mA = <tspan font-weight="700" fill="#D4607A">2,5 W</tspan></text>
  <rect x="48" y="142" width="170" height="22" rx="4" fill="#D4607A"/>
  <text x="48" y="190" font-size="14" fill="#222"><tspan font-weight="700">USB 3.0:</tspan> max. 900 mA</text>
  <rect x="48" y="198" width="304" height="22" rx="4" fill="#3a6ed8"/>

  <!-- Trennlinie -->
  <line x1="200" y1="250" x2="200" y2="456" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Links: reicht -->
  <circle cx="40" cy="270" r="15" fill="#3fa34d"/>
  <path d="M32,270 L38,277 L49,263" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="276" font-size="15" font-weight="700" fill="#222">reicht für</text>
  <!-- Maus -->
  <ellipse cx="62" cy="336" rx="20" ry="28" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <line x1="62" y1="308" x2="62" y2="330" stroke="#555" stroke-width="2"/>
  <line x1="42" y1="330" x2="82" y2="330" stroke="#555" stroke-width="2"/>
  <text x="62" y="386" text-anchor="middle" font-size="14" fill="#222">Maus</text>
  <!-- USB-Stick -->
  <rect x="133" y="302" width="18" height="16" fill="#ccc" stroke="#555" stroke-width="1.5"/>
  <rect x="127" y="317" width="30" height="48" rx="5" fill="#3a6ed8"/>
  <text x="142" y="386" text-anchor="middle" font-size="14" fill="#222">USB-Stick</text>

  <!-- Rechts: brauchen mehr -->
  <text x="300" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#D4607A">brauchen mehr</text>
  <!-- Drucker -->
  <rect x="222" y="300" width="28" height="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="214" y="314" width="44" height="26" rx="4" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <text x="236" y="360" text-anchor="middle" font-size="13" fill="#222">Drucker</text>
  <!-- Scanner -->
  <rect x="274" y="316" width="48" height="8" rx="2" fill="#ddd" stroke="#555" stroke-width="1.5"/>
  <rect x="274" y="324" width="48" height="16" rx="3" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <text x="298" y="360" text-anchor="middle" font-size="13" fill="#222">Scanner</text>
  <!-- Kamera -->
  <rect x="346" y="308" width="14" height="8" fill="#666"/>
  <rect x="338" y="314" width="44" height="26" rx="4" fill="#666"/>
  <circle cx="360" cy="327" r="8" fill="#9cc0ef" stroke="#fff" stroke-width="2"/>
  <text x="360" y="360" text-anchor="middle" font-size="13" fill="#222">Kamera</text>
  <!-- Kabel zur Steckdose -->
  <g stroke="#555" stroke-width="2.5" fill="none">
    <line x1="236" y1="366" x2="236" y2="384"/>
    <line x1="298" y1="366" x2="298" y2="384"/>
    <line x1="360" y1="366" x2="360" y2="384"/>
    <line x1="222" y1="384" x2="360" y2="384"/>
    <line x1="222" y1="384" x2="222" y2="406"/>
  </g>
  <!-- Steckdose -->
  <circle cx="222" cy="424" r="18" fill="#f4f1ee" stroke="#555" stroke-width="2.5"/>
  <circle cx="215" cy="424" r="3" fill="#555"/>
  <circle cx="229" cy="424" r="3" fill="#555"/>
  <text x="248" y="420" font-size="13" fill="#222">eigene Strom-</text>
  <text x="248" y="437" font-size="13" fill="#222">versorgung</text>
</svg>
