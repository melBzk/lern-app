<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, sans-serif" fill="#222">
<title>Ausgangslage Praxisfall: Eine Arztpraxis hat einen kleinen Server. Zweimal im Jahr fällt kurz der Strom aus. Danach waren Daten beschädigt. Frage: Was empfiehlst du?</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Der Server in der Arztpraxis</text>
<!-- Praxis -->
<path d="M14,200 L14,96 L100,48 L186,96 L186,200 Z" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
<rect x="84" y="62" width="32" height="32" rx="3" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<rect x="96" y="67" width="8" height="22" fill="#3a6ed8"/><rect x="89" y="74" width="22" height="8" fill="#3a6ed8"/>
<rect x="74" y="116" width="52" height="70" rx="4" fill="#3a3f4a"/>
<g fill="#5b6270"><rect x="80" y="124" width="40" height="10"/><rect x="80" y="140" width="40" height="10"/></g>
<circle cx="112" cy="172" r="4" fill="#1f9d55"/>
<text x="100" y="222" text-anchor="middle" font-size="14" font-weight="700">kleiner Server</text>
<!-- Blitz / Ausfall -->
<path d="M262,56 l-22,44 h18 l-12,40 l36,-54 h-18 l14,-30 Z" fill="#E07B00"/>
<text x="290" y="160" text-anchor="middle" font-size="15" font-weight="700">Strom fällt</text>
<text x="290" y="180" text-anchor="middle" font-size="15" font-weight="700">kurz aus</text>
<text x="290" y="204" text-anchor="middle" font-size="14" fill="#555">2-mal im Jahr</text>
<!-- Folge -->
<rect x="10" y="244" width="380" height="54" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<path d="M30,256 h22 l8,8 v26 h-30 Z" fill="#fff" stroke="#c62828" stroke-width="2"/>
<path d="M36,270 l6,6 l-4,4 l8,6" fill="none" stroke="#c62828" stroke-width="2"/>
<text x="74" y="277" font-size="15" font-weight="700" fill="#c62828">Danach: Daten beschädigt</text>
<text x="200" y="334" text-anchor="middle" font-size="18" font-weight="700">Was empfiehlst du?</text>
</svg>
