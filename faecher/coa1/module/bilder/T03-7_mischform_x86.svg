<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ein PC-Prozessor als Haus. Schild an der Tür: x86/x64 – versteht CISC-Befehle. Drinnen ein Übersetzer mit Sprechblase: komplexer Befehl → einfache RISC-Befehle. Ein Pfeil führt zum RISC-Kern: rechnet intern RISC-artig. Darunter eine Waage mit CISC und RISC im Gleichgewicht: Mischform – Elemente aus beiden Welten.</title>
