<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Ausgangslage, ohne Lösung: Oben ein älteres Programm, das alles nacheinander rechnet: Schritt 1, 2, 3 in einer Reihe. Darunter zwei Prozessoren aus derselben Reihe und Generation: A mit 16 Kernen und niedrigem Takt (kurzer Taktbalken), B mit 6 Kernen und höherem Takt (langer Taktbalken).</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Viele Kerne oder schnelle Kerne?</text>
<rect x="10" y="44" width="380" height="96" rx="10" fill="#f4f5f7"/>
<text x="24" y="68" font-size="15" font-weight="700">Älteres Programm: alles nacheinander</text>
<rect x="40" y="86" width="60" height="36" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><text x="70" y="110" text-anchor="middle" font-size="15" font-weight="700">1</text>
<rect x="170" y="86" width="60" height="36" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><text x="200" y="110" text-anchor="middle" font-size="15" font-weight="700">2</text>
<rect x="300" y="86" width="60" height="36" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><text x="330" y="110" text-anchor="middle" font-size="15" font-weight="700">3</text>
<line x1="102" y1="104" x2="166" y2="104" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><line x1="232" y1="104" x2="296" y2="104" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
<text x="200" y="168" text-anchor="middle" font-size="14" fill="#555">gleiche Reihe und Generation</text>
<rect x="10" y="180" width="185" height="196" rx="10" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="2"/>
<text x="102" y="208" text-anchor="middle" font-size="20" font-weight="700">A</text>
<g fill="#3a6ed8"><rect x="38" y="222" width="26" height="26" rx="3"/><rect x="68" y="222" width="26" height="26" rx="3"/><rect x="98" y="222" width="26" height="26" rx="3"/><rect x="128" y="222" width="26" height="26" rx="3"/><rect x="38" y="252" width="26" height="26" rx="3"/><rect x="68" y="252" width="26" height="26" rx="3"/><rect x="98" y="252" width="26" height="26" rx="3"/><rect x="128" y="252" width="26" height="26" rx="3"/><rect x="38" y="282" width="26" height="26" rx="3"/><rect x="68" y="282" width="26" height="26" rx="3"/><rect x="98" y="282" width="26" height="26" rx="3"/><rect x="128" y="282" width="26" height="26" rx="3"/><rect x="38" y="312" width="26" height="26" rx="3"/><rect x="68" y="312" width="26" height="26" rx="3"/><rect x="98" y="312" width="26" height="26" rx="3"/><rect x="128" y="312" width="26" height="26" rx="3"/></g>
<text x="102" y="364" text-anchor="middle" font-size="15" font-weight="700">16 Kerne</text>
<rect x="205" y="180" width="185" height="196" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<text x="297" y="208" text-anchor="middle" font-size="20" font-weight="700">B</text>
<g fill="#E07B00"><rect x="248" y="232" width="26" height="26" rx="3"/><rect x="280" y="232" width="26" height="26" rx="3"/><rect x="312" y="232" width="26" height="26" rx="3"/><rect x="248" y="264" width="26" height="26" rx="3"/><rect x="280" y="264" width="26" height="26" rx="3"/><rect x="312" y="264" width="26" height="26" rx="3"/></g>
<text x="297" y="364" text-anchor="middle" font-size="15" font-weight="700">6 Kerne</text>
<text x="102" y="402" text-anchor="middle" font-size="14">Takt: niedrig</text>
<rect x="40" y="410" width="50" height="14" rx="3" fill="#3a6ed8"/>
<text x="297" y="402" text-anchor="middle" font-size="14">Takt: höher</text>
<rect x="235" y="410" width="120" height="14" rx="3" fill="#E07B00"/>
</svg>
