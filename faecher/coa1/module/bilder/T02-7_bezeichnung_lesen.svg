<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" role="img">
  <title>Prozessorbezeichnung Intel Core i9-10900K lesen: i9 ist die Reihe, von i3 für einfache Büroarbeit bis i9 für Highend. Die 10 vorne ist die Generation, hier die 10. Generation. Das K heißt übertaktbar. Vergleich darunter: Der i9-10900K hat 125 Watt Verlustleistung, der energieoptimierte i9-10900T nur 35 Watt.</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Den Prozessornamen lesen</text>

  <!-- Schriftzug -->
  <text x="200" y="60" text-anchor="middle" font-size="20" fill="#666">Intel Core</text>
  <text x="122" y="112" text-anchor="middle" font-size="42" font-weight="700" fill="#3a6ed8">i9</text>
  <text x="152" y="112" text-anchor="middle" font-size="42" font-weight="700" fill="#222">-</text>
  <text x="187" y="112" text-anchor="middle" font-size="42" font-weight="700" fill="#2f9e44">10</text>
  <text x="250" y="112" text-anchor="middle" font-size="42" font-weight="700" fill="#222">900</text>
  <text x="300" y="112" text-anchor="middle" font-size="42" font-weight="700" fill="#e8590c">K</text>

  <!-- Klammern -->
  <path d="M106,122 v8 h32 v-8" fill="none" stroke="#3a6ed8" stroke-width="3"/>
  <path d="M165,122 v8 h44 v-8" fill="none" stroke="#2f9e44" stroke-width="3"/>
  <path d="M286,122 v8 h28 v-8" fill="none" stroke="#e8590c" stroke-width="3"/>

  <!-- Pfeile -->
  <path d="M122,130 L70,176" fill="none" stroke="#3a6ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M187,130 L200,176" fill="none" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#ag)"/>
  <path d="M300,130 L330,176" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#as)"/>

  <!-- Kästen -->
  <rect x="10" y="180" width="122" height="96" rx="10" fill="#eef4ff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="71" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6ed8">Reihe</text>
  <text x="71" y="228" text-anchor="middle" font-size="14" fill="#222">i3 = einfach</text>
  <text x="71" y="246" text-anchor="middle" font-size="14" fill="#222">…</text>
  <text x="71" y="266" text-anchor="middle" font-size="14" fill="#222">i9 = Highend</text>

  <rect x="139" y="180" width="122" height="96" rx="10" fill="#ebf7ee" stroke="#2f9e44" stroke-width="2"/>
  <text x="200" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#2f9e44">Generation</text>
  <text x="200" y="244" text-anchor="middle" font-size="26" font-weight="700" fill="#222">10.</text>

  <rect x="268" y="180" width="122" height="96" rx="10" fill="#fff4ec" stroke="#e8590c" stroke-width="2.5"/>
  <text x="329" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#e8590c">K =</text>
  <text x="329" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#222">übertaktbar</text>
  <text x="329" y="254" text-anchor="middle" font-size="13" fill="#444">Multiplikator</text>
  <text x="329" y="270" text-anchor="middle" font-size="13" fill="#444">frei wählbar</text>

  <!-- Vergleich K / T -->
  <line x1="10" y1="300" x2="390" y2="300" stroke="#ddd" stroke-width="1.5"/>
  <text x="200" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#222">K oder T? Verlustleistung im Vergleich</text>
  <text x="18" y="364" font-size="16" font-weight="700" fill="#222">i9-10900<tspan fill="#e8590c">K</tspan></text>
  <rect x="122" y="346" width="200" height="26" rx="4" fill="#f0a777"/>
  <text x="330" y="365" font-size="16" font-weight="700" fill="#222">125 W</text>
  <text x="18" y="408" font-size="16" font-weight="700" fill="#222">i9-10900<tspan fill="#3a6ed8">T</tspan></text>
  <rect x="122" y="390" width="56" height="26" rx="4" fill="#7ea0e8"/>
  <text x="186" y="409" font-size="16" font-weight="700" fill="#222">35 W</text>
  <text x="122" y="440" font-size="14" fill="#3a6ed8">T = energieoptimiert</text>
</svg>
