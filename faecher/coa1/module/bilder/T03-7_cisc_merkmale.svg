<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>CISC, viele mächtige Befehle, vier Merkmale: 1 umfangreicher Befehlssatz, viele Befehle, nur wenige davon werden in der Praxis benutzt (grau). 2 Befehle unterschiedlich lang, als verschieden lange Balken. 3 Eine komplexe Aufgabe mit einem einzigen Befehl. 4 Direkter Speicherzugriff: ein Befehl rechnet direkt mit einer Zahl im Arbeitsspeicher. Unten Achtung: umfangreicher, nicht kompletter Befehlssatz.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">CISC: viele mächtige Befehle</text>
<rect x="10" y="44" width="380" height="96" rx="10" fill="#f4f5f7"/>
<text x="24" y="68" font-size="15" font-weight="700">umfangreicher Befehlssatz</text>
<g fill="#cfd6dd"><rect x="24" y="80" width="18" height="18" rx="2"/><rect x="46" y="80" width="18" height="18" rx="2"/><rect x="68" y="80" width="18" height="18" rx="2" fill="#E07B00"/><rect x="90" y="80" width="18" height="18" rx="2"/><rect x="112" y="80" width="18" height="18" rx="2"/><rect x="134" y="80" width="18" height="18" rx="2"/><rect x="156" y="80" width="18" height="18" rx="2" fill="#E07B00"/><rect x="178" y="80" width="18" height="18" rx="2"/><rect x="200" y="80" width="18" height="18" rx="2"/><rect x="222" y="80" width="18" height="18" rx="2"/><rect x="244" y="80" width="18" height="18" rx="2"/><rect x="266" y="80" width="18" height="18" rx="2"/><rect x="288" y="80" width="18" height="18" rx="2" fill="#E07B00"/><rect x="310" y="80" width="18" height="18" rx="2"/><rect x="332" y="80" width="18" height="18" rx="2"/><rect x="354" y="80" width="18" height="18" rx="2"/></g>
<text x="24" y="124" font-size="14">Nachteil: nur <tspan font-weight="700" fill="#c25e00">wenige</tspan> davon werden benutzt</text>
<rect x="10" y="148" width="380" height="96" rx="10" fill="#f4f5f7"/>
<text x="24" y="172" font-size="15" font-weight="700">unterschiedlich lang</text>
<rect x="24" y="184" width="70" height="14" rx="3" fill="#E07B00"/><rect x="24" y="204" width="160" height="14" rx="3" fill="#E07B00"/><rect x="24" y="224" width="110" height="14" rx="3" fill="#E07B00"/>
<text x="200" y="216" font-size="14" fill="#555">(im Unterricht auch:</text><text x="200" y="234" font-size="14" fill="#555">„teils mehrteilig“)</text>
<rect x="10" y="252" width="380" height="76" rx="10" fill="#f4f5f7"/>
<text x="24" y="278" font-size="15" font-weight="700">1 Befehl = komplexe Aufgabe</text>
<rect x="24" y="290" width="60" height="26" rx="5" fill="#E07B00"/><text x="54" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1 Befehl</text>
<text x="94" y="308" font-size="15">→ erledigt viel auf einmal</text>
<rect x="10" y="336" width="380" height="88" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<text x="24" y="362" font-size="15" font-weight="700">direkter Speicherzugriff</text>
<rect x="24" y="376" width="90" height="32" rx="5" fill="#E07B00"/><text x="69" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Befehl</text>
<line x1="118" y1="392" x2="238" y2="392" stroke="#E07B00" stroke-width="4" marker-end="url(#a)"/>
<rect x="246" y="370" width="130" height="44" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><text x="311" y="390" text-anchor="middle" font-size="13">Arbeitsspeicher</text><text x="311" y="406" text-anchor="middle" font-size="14" font-weight="700">Zahl</text>
<rect x="10" y="434" width="380" height="56" rx="10" fill="#fdecec" stroke="#c62828" stroke-width="2"/>
<text x="24" y="458" font-size="14" font-weight="700" fill="#c62828">⚠ „umfangreicher“ Befehlssatz –</text>
<text x="24" y="478" font-size="14" fill="#c62828">nicht „kompletter“</text>
</svg>
