<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Übertakten von Hand, nur bei Unlocked-Modellen (bei Intel mit K). Kleiner grüner Pfeil: Takt etwas höher. Großer roter Pfeil: Wärme viel höher. Folgen: Abstürze, kürzere Lebensdauer, bessere Kühlung nötig, zum Beispiel Wasserkühlung.</title>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Übertakten von Hand</text>

<rect x="60" y="40" width="280" height="38" rx="8" fill="#fdf0e0" stroke="#E07B00" stroke-width="2.5"/>
<text x="200" y="65" font-size="15" text-anchor="middle" font-weight="700">nur bei Unlocked-Modellen (K)</text>

<!-- Grundlinie -->
<line x1="30" y1="270" x2="370" y2="270" stroke="#888" stroke-width="2"/>
<!-- kleiner grüner Pfeil -->
<path d="M96,270 L96,236 L80,236 L110,206 L140,236 L124,236 L124,270 Z" fill="#2f9e44"/>
<text x="110" y="294" font-size="15" text-anchor="middle" font-weight="700" fill="#2f9e44">Takt</text>
<text x="110" y="313" font-size="15" text-anchor="middle" font-weight="700" fill="#2f9e44">etwas höher</text>
<!-- großer roter Pfeil -->
<path d="M262,270 L262,150 L232,150 L290,94 L348,150 L318,150 L318,270 Z" fill="#c62828"/>
<text x="290" y="294" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">Wärme</text>
<text x="290" y="313" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">viel höher</text>

<line x1="20" y1="334" x2="380" y2="334" stroke="#ccc" stroke-width="1.5"/>
<text x="20" y="358" font-size="15" font-weight="700">Folgen:</text>

<!-- Absturz -->
<rect x="40" y="372" width="56" height="42" rx="4" fill="#fff" stroke="#555" stroke-width="2.5"/>
<rect x="40" y="372" width="56" height="10" fill="#555"/>
<path d="M58,388 L78,406 M78,388 L58,406" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
<text x="68" y="440" font-size="14" text-anchor="middle" font-weight="700">Abstürze</text>

<!-- Sanduhr -->
<path d="M182,370 L218,370 L218,376 L204,394 L218,412 L218,418 L182,418 L182,412 L196,394 L182,376 Z" fill="#fff" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M190,412 L200,401 L210,412 Z" fill="#d4a017"/>
<path d="M190,378 L210,378 L200,388 Z" fill="#d4a017"/>
<text x="200" y="440" font-size="14" text-anchor="middle" font-weight="700">kürzere</text>
<text x="200" y="458" font-size="14" text-anchor="middle" font-weight="700">Lebensdauer</text>

<!-- Wassertropfen -->
<path d="M332,368 C344,384 352,394 352,404 A20,20 0 0,1 312,404 C312,394 320,384 332,368 Z" fill="#3a6ed8"/>
<text x="332" y="440" font-size="14" text-anchor="middle" font-weight="700">bessere Kühlung</text>
<text x="332" y="458" font-size="14" text-anchor="middle" font-weight="700">nötig, z. B.</text>
<text x="332" y="476" font-size="14" text-anchor="middle" font-weight="700">Wasserkühlung</text>
</svg>
