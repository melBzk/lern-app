<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="system-ui, sans-serif" role="img">
  <title>Zeichentabelle: Oben die Tastenfolge Alt halten und auf dem Ziffernblock 9 und 9 tippen, das ergibt das kleine c. Darunter eine Tabelle mit Zahl, Bitmuster und Zeichen: 64 ist 01000000 und das Zeichen @, 97 ist 01100001 und das Zeichen a, 99 ist 01100011 und das Zeichen c.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="350" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Zeichentabelle: Zahl → Zeichen</text>

  <!-- Tastenfolge -->
  <rect x="30" y="50" width="64" height="44" rx="7" fill="#f1f3f5" stroke="#555" stroke-width="2"/>
  <text x="62" y="79" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Alt</text>
  <text x="62" y="114" text-anchor="middle" font-size="13" fill="#666">halten</text>
  <text x="114" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#444">+</text>
  <rect x="134" y="50" width="44" height="44" rx="7" fill="#f1f3f5" stroke="#555" stroke-width="2"/>
  <text x="156" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#222">9</text>
  <rect x="186" y="50" width="44" height="44" rx="7" fill="#f1f3f5" stroke="#555" stroke-width="2"/>
  <text x="208" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#222">9</text>
  <text x="182" y="114" text-anchor="middle" font-size="13" fill="#666">Ziffernblock (Num an)</text>
  <line x1="244" y1="72" x2="290" y2="72" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="300" y="46" width="60" height="52" rx="8" fill="#fff4ec" stroke="#e8590c" stroke-width="2"/>
  <text x="330" y="84" text-anchor="middle" font-size="34" font-weight="700" fill="#e8590c">c</text>

  <!-- Tabelle -->
  <rect x="16" y="140" width="368" height="36" fill="#eef4ff" stroke="#7a8aa8" stroke-width="1.5"/>
  <text x="61" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Zahl</text>
  <text x="195" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Bitmuster</text>
  <text x="334" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Zeichen</text>
  <rect x="16" y="176" width="368" height="52" fill="#fff" stroke="#7a8aa8" stroke-width="1.5"/>
  <rect x="16" y="228" width="368" height="52" fill="#fff" stroke="#7a8aa8" stroke-width="1.5"/>
  <rect x="16" y="280" width="368" height="52" fill="#fff" stroke="#7a8aa8" stroke-width="1.5"/>
  <line x1="106" y1="140" x2="106" y2="332" stroke="#7a8aa8" stroke-width="1.5"/>
  <line x1="284" y1="140" x2="284" y2="332" stroke="#7a8aa8" stroke-width="1.5"/>

  <text x="61" y="209" text-anchor="middle" font-size="20" font-weight="700" fill="#222">64</text>
  <text x="195" y="209" text-anchor="middle" font-size="19" font-family="Consolas, monospace" fill="#222">01000000</text>
  <text x="334" y="214" text-anchor="middle" font-size="32" font-weight="700" fill="#e8590c">@</text>

  <text x="61" y="261" text-anchor="middle" font-size="20" font-weight="700" fill="#222">97</text>
  <text x="195" y="261" text-anchor="middle" font-size="19" font-family="Consolas, monospace" fill="#222">01100001</text>
  <text x="334" y="264" text-anchor="middle" font-size="32" font-weight="700" fill="#e8590c">a</text>

  <text x="61" y="313" text-anchor="middle" font-size="20" font-weight="700" fill="#222">99</text>
  <text x="195" y="313" text-anchor="middle" font-size="19" font-family="Consolas, monospace" fill="#222">01100011</text>
  <text x="334" y="316" text-anchor="middle" font-size="32" font-weight="700" fill="#e8590c">c</text>
</svg>
