<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die Idee ist alt: Zeitstrahl mit drei Stationen von links nach rechts. 1 SSD-Caching: eine kleine SSD plus eine große HDD, schnell und viel Platz. 2 SSHD: eine Festplatte mit eingebautem kleinem Flash-Chip, Hybrid, alles in einem Gerät; darunter das Schild Entwicklung aufgegeben. 3 günstige große SSD: eine SSD allein mit Krone, sie verdrängt beide.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
</defs>
<rect width="400" height="350" fill="#fff"/>
<text x="16" y="26" font-size="17" font-weight="700">Die Idee ist alt</text>
<line x1="12" y1="56" x2="388" y2="56" stroke="#555" stroke-width="3" marker-end="url(#k)"/>
<g font-weight="700" font-size="14" text-anchor="middle" fill="#fff">
<circle cx="67" cy="56" r="13" fill="#3a6ed8"/><text x="67" y="61">1</text>
<circle cx="200" cy="56" r="13" fill="#3a6ed8"/><text x="200" y="61">2</text>
<circle cx="333" cy="56" r="13" fill="#3a6ed8"/><text x="333" y="61">3</text>
</g>
<line x1="134" y1="76" x2="134" y2="340" stroke="#ddd" stroke-width="1.5"/>
<line x1="266" y1="76" x2="266" y2="340" stroke="#ddd" stroke-width="1.5"/>

<!-- 1 SSD-Caching -->
<text x="67" y="96" text-anchor="middle" font-size="15" font-weight="700">SSD-Caching</text>
<rect x="14" y="136" width="30" height="44" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="29" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">SSD</text>
<text x="52" y="166" text-anchor="middle" font-size="20" font-weight="700">+</text>
<rect x="62" y="114" width="64" height="88" rx="5" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="94" cy="150" r="22" fill="#fff" stroke="#9aa5b1" stroke-width="2"/>
<circle cx="94" cy="150" r="4" fill="#555"/>
<text x="94" y="194" text-anchor="middle" font-size="13" font-weight="700">HDD</text>
<text x="67" y="232" text-anchor="middle" font-weight="700" fill="#2e7d32">schnell +</text>
<text x="67" y="250" text-anchor="middle" font-weight="700" fill="#2e7d32">viel Platz</text>

<!-- 2 SSHD -->
<text x="200" y="96" text-anchor="middle" font-size="15" font-weight="700">SSHD</text>
<rect x="164" y="114" width="72" height="88" rx="5" fill="#eceff1" stroke="#555" stroke-width="2"/>
<circle cx="200" cy="148" r="22" fill="#fff" stroke="#9aa5b1" stroke-width="2"/>
<circle cx="200" cy="148" r="4" fill="#555"/>
<rect x="208" y="178" width="22" height="16" rx="2" fill="#E07B00"/>
<text x="186" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#b35c00">Flash</text>
<text x="200" y="232" text-anchor="middle" font-weight="700">Hybrid: alles</text>
<text x="200" y="250" text-anchor="middle" font-weight="700">in einem Gerät</text>
<rect x="146" y="278" width="108" height="50" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="200" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">Entwicklung</text>
<text x="200" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#c62828">aufgegeben</text>

<!-- 3 große SSD -->
<text x="333" y="96" text-anchor="middle" font-size="15" font-weight="700">günstige</text>
<text x="333" y="114" text-anchor="middle" font-size="15" font-weight="700">große SSD</text>
<path d="M309,142 L315,124 L325,136 L333,120 L341,136 L351,124 L357,142 Z" fill="#f2c200" stroke="#8a6d00" stroke-width="2" stroke-linejoin="round"/>
<rect x="303" y="148" width="60" height="56" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2.5"/>
<text x="333" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">SSD</text>
<text x="333" y="232" text-anchor="middle" font-weight="700" fill="#c62828">verdrängt</text>
<text x="333" y="250" text-anchor="middle" font-weight="700" fill="#c62828">beide</text>
</svg>
