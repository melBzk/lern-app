<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>PAN, Personal Area Network: Eine Person steht in der Mitte, ein gestrichelter Kreis mit ca. 10 m Durchmesser umgibt sie. Darin: Handy, Funk-Kopfhörer, Smartwatch, eine Zugangskarte vor einem Türleser und ein Kassenterminal. Funk zwischen Handy und Kopfhörer heißt Bluetooth, zwischen Karte und Türleser RFID, zwischen Handy und Kasse NFC.</title>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">PAN – Personal Area Network</text>

<!-- Reichweite -->
<circle cx="200" cy="250" r="172" fill="#fff8ef" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="9 6"/>
<rect x="105" y="66" width="190" height="26" rx="13" fill="#E07B00"/>
<text x="200" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ca. 10 m Durchmesser</text>

<!-- Tuer mit Leser -->
<rect x="44" y="172" width="50" height="104" fill="#c9a27a" stroke="#7a5a3a" stroke-width="2"/>
<circle cx="86" cy="228" r="3" fill="#7a5a3a"/>
<rect x="100" y="206" width="14" height="24" rx="2" fill="#555"/>
<circle cx="107" cy="213" r="3" fill="#1f9d55"/>
<text x="69" y="296" text-anchor="middle" font-size="13">Tür mit Leser</text>
<!-- Zugangskarte -->
<rect x="136" y="208" width="26" height="18" rx="2" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<rect x="140" y="213" width="8" height="6" fill="#E07B00"/>
<line x1="132" y1="218" x2="118" y2="218" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="124" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#a85a00">RFID</text>
<text x="150" y="244" text-anchor="middle" font-size="13">Karte</text>

<!-- Person -->
<circle cx="200" cy="198" r="17" fill="#f1c9a5"/>
<rect x="176" y="220" width="48" height="76" rx="20" fill="#3a6ed8"/>
<!-- Kopfhoerer -->
<path d="M181,198 A19,19 0 0 1 219,198" fill="none" stroke="#333" stroke-width="4"/>
<rect x="176" y="192" width="8" height="15" rx="3" fill="#333"/>
<rect x="216" y="192" width="8" height="15" rx="3" fill="#333"/>
<text x="200" y="164" text-anchor="middle" font-size="13">Kopfhörer</text>
<!-- Smartwatch -->
<rect x="164" y="270" width="16" height="20" rx="4" fill="#222"/>
<rect x="167" y="274" width="10" height="12" rx="2" fill="#9cc3f5"/>
<text x="168" y="318" text-anchor="middle" font-size="13">Smartwatch</text>
<!-- Handy -->
<rect x="234" y="236" width="22" height="38" rx="4" fill="#222"/>
<rect x="237" y="241" width="16" height="27" fill="#9cc3f5"/>
<text x="266" y="262" font-size="13">Handy</text>

<!-- Bluetooth: Handy - Kopfhoerer -->
<line x1="242" y1="232" x2="226" y2="208" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="240" y="210" font-size="15" font-weight="700" fill="#a85a00">Bluetooth</text>

<!-- Kasse -->
<rect x="282" y="322" width="44" height="60" rx="6" fill="#3a3f4a"/>
<rect x="288" y="328" width="32" height="18" fill="#c8f0d6"/>
<g fill="#ddd"><rect x="289" y="352" width="8" height="6"/><rect x="300" y="352" width="8" height="6"/><rect x="311" y="352" width="8" height="6"/><rect x="289" y="362" width="8" height="6"/><rect x="300" y="362" width="8" height="6"/><rect x="311" y="362" width="8" height="6"/></g>
<text x="304" y="400" text-anchor="middle" font-size="13">Kasse</text>
<!-- NFC: Handy - Kasse -->
<line x1="250" y1="278" x2="284" y2="318" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="280" y="300" font-size="15" font-weight="700" fill="#a85a00">NFC</text>

<text x="200" y="450" text-anchor="middle" font-size="13">Funk auf kurze Entfernung, rund um eine Person</text>
</svg>
