<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Festplattenspiegelung, RAID 1. Ein Pfeil Daten schreiben teilt sich in zwei Pfeile zu zwei gleich großen Laufwerken A und B. Auf A liegt der Ordner als Original, auf B derselbe Ordner als Kopie. Laufwerk A ist rot durchgestrichen: defekt. An Laufwerk B ein Häkchen: hat alle Daten, weiterarbeiten. Unten: mindestens 2 gleich große Laufwerke, kein Tempogewinn, mehr Ausfallsicherheit.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Festplattenspiegelung (RAID 1)</text>

<!-- Daten schreiben -->
<rect x="130" y="42" width="140" height="34" rx="8" fill="#3a6ed8"/>
<text x="200" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Daten schreiben</text>
<g stroke="#222" stroke-width="2.5" fill="none">
<path d="M200,76 V96 H105 V124" marker-end="url(#k)"/>
<path d="M200,96 H295 V124" marker-end="url(#k)"/>
</g>

<!-- Laufwerk A -->
<rect x="35" y="128" width="140" height="130" rx="8" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="105" y="152" text-anchor="middle" font-size="15" font-weight="700">Laufwerk A</text>
<path d="M78,172 h20 l6,7 h30 v40 h-56 z" fill="#f2c200" stroke="#555" stroke-width="1.5"/>
<text x="105" y="242" text-anchor="middle" font-size="13">Original</text>
<line x1="40" y1="254" x2="170" y2="132" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<line x1="40" y1="132" x2="170" y2="254" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
<text x="105" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">defekt</text>

<!-- Laufwerk B -->
<rect x="225" y="128" width="140" height="130" rx="8" fill="#eceff1" stroke="#555" stroke-width="2"/>
<text x="295" y="152" text-anchor="middle" font-size="15" font-weight="700">Laufwerk B</text>
<path d="M268,172 h20 l6,7 h30 v40 h-56 z" fill="#f2c200" stroke="#555" stroke-width="1.5"/>
<text x="295" y="242" text-anchor="middle" font-size="13">Kopie</text>
<circle cx="360" cy="132" r="15" fill="#2e7d32"/>
<path d="M352,132 l6,6 l10,-11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="295" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">hat alle Daten –</text>
<text x="295" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">weiterarbeiten</text>

<!-- Merkkasten -->
<rect x="14" y="328" width="372" height="126" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="2"/>
<text x="34" y="362" font-size="15">• mindestens <tspan font-weight="700">2 gleich große</tspan> Laufwerke</text>
<text x="34" y="396" font-size="15">• <tspan font-weight="700">kein</tspan> Tempogewinn</text>
<text x="34" y="430" font-size="15">• mehr <tspan font-weight="700" fill="#c62828">Ausfallsicherheit</tspan></text>
</svg>
