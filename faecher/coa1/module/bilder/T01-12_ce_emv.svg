<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" font-family="system-ui, sans-serif" role="img">
  <title>Zwei Szenen. Links ein PC ohne CE-Kennzeichen: Er sendet gezackte Störwellen, das Radio daneben rauscht, rotes Kreuz. Rechts ein PC mit dem Schild CE: keine Störwellen, das Radio spielt Musik, grüner Haken. Unten: CE heißt, das Gerät erfüllt die EU-Regeln zur EMV, also stören sich Geräte nicht.</title>
  <rect width="400" height="390" fill="#fff"/>
  <line x1="200" y1="20" x2="200" y2="300" stroke="#dee2e6" stroke-width="2"/>
  <text x="100" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#222">ohne CE</text>
  <text x="300" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#222">mit CE</text>

  <!-- links -->
  <rect x="20" y="70" width="50" height="110" rx="4" fill="#3a3f4a"/>
  <line x1="28" y1="84" x2="62" y2="84" stroke="#adb5bd" stroke-width="2"/>
  <g fill="none" stroke="#d63c3c" stroke-width="2.5" stroke-linejoin="round">
    <polyline points="76,104 84,94 92,112 100,96 108,110 116,100"/>
    <polyline points="76,130 84,120 92,138 100,122 108,136 116,126"/>
    <polyline points="76,156 84,146 92,164 100,148 108,162 116,152"/>
  </g>
  <text x="108" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#d63c3c">Störwellen</text>
  <rect x="120" y="110" width="66" height="50" rx="8" fill="#868e96" stroke="#555" stroke-width="1.5"/>
  <line x1="176" y1="110" x2="188" y2="84" stroke="#555" stroke-width="2"/>
  <circle cx="140" cy="135" r="13" fill="#495057"/>
  <rect x="160" y="124" width="18" height="8" fill="#dee2e6"/>
  <path d="M124,178 l6,-8 l6,8 l6,-8 l6,8 l6,-8 l6,8 l6,-8 l6,8 l6,-8 l6,8" fill="none" stroke="#d63c3c" stroke-width="2"/>
  <circle cx="100" cy="236" r="28" fill="none" stroke="#d63c3c" stroke-width="5"/>
  <path d="M88,224 L112,248 M112,224 L88,248" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/>
  <text x="100" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Radio rauscht</text>

  <!-- rechts -->
  <rect x="220" y="70" width="50" height="110" rx="4" fill="#3a3f4a"/>
  <line x1="228" y1="84" x2="262" y2="84" stroke="#adb5bd" stroke-width="2"/>
  <rect x="226" y="130" width="38" height="26" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="245" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#222">CE</text>
  <rect x="320" y="110" width="66" height="50" rx="8" fill="#868e96" stroke="#555" stroke-width="1.5"/>
  <line x1="376" y1="110" x2="388" y2="84" stroke="#555" stroke-width="2"/>
  <circle cx="340" cy="135" r="13" fill="#495057"/>
  <rect x="360" y="124" width="18" height="8" fill="#dee2e6"/>
  <g fill="#1f9d55" stroke="#1f9d55">
    <ellipse cx="292" cy="104" rx="6" ry="4.5" transform="rotate(-20 292 104)" stroke="none"/>
    <line x1="297" y1="102" x2="297" y2="82" stroke-width="2"/>
    <ellipse cx="314" cy="94" rx="6" ry="4.5" transform="rotate(-20 314 94)" stroke="none"/>
    <line x1="319" y1="92" x2="319" y2="72" stroke-width="2"/>
    <line x1="297" y1="82" x2="319" y2="72" stroke-width="3"/>
  </g>
  <circle cx="300" cy="236" r="28" fill="none" stroke="#1f9d55" stroke-width="5"/>
  <path d="M286,236 L297,248 L316,224" fill="none" stroke="#1f9d55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Radio spielt sauber</text>

  <!-- unten -->
  <rect x="10" y="312" width="380" height="64" rx="10" fill="#eef4ff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="200" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#222">CE = erfüllt EU-Regeln zur EMV</text>
  <text x="200" y="362" text-anchor="middle" font-size="14" fill="#333">(Geräte stören sich nicht)</text>
</svg>
