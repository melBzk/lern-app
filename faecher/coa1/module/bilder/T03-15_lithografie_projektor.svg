<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 656" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Belichten mit EUV, vereinfacht. 1 Die Lichtquelle schickt EUV-Licht schräg nach oben. 2 Das Licht trifft die Maske; sie ist ein Spiegel mit dem Schaltungsmuster und wirft das Licht zurück, es geht nicht hindurch. 3 Im Zickzack lenken drei weitere Spiegel das Licht nach unten; der Strahl wird dabei immer schmaler: die Spiegel-Optik verkleinert das Muster. 4 Unten liegt der lichtempfindlich beschichtete Wafer, auf ihm erscheint das Muster klein. Ein Pfeil: Wafer verschieben, nächster Chip. Unten der Vergleich: Ein Beamer macht ein kleines Bild groß, Licht geht durch Glas. Die Belichtungsmaschine macht das Muster klein und arbeitet nur mit Spiegeln.</title>
<rect width="400" height="656" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Belichten: ein Projektor rückwärts</text>
<g stroke="#9775fa" opacity="0.5" stroke-linecap="round">
<path d="M215,160 L120,74" stroke-width="26"/>
<path d="M120,74 L32,156" stroke-width="26"/>
<path d="M32,156 L200,256" stroke-width="20"/>
<path d="M200,256 L62,340" stroke-width="14"/>
<path d="M62,340 L125,436" stroke-width="9"/>
</g>
<path d="M161.6,111.6 L176.6,115.8 L167.3,126.2 Z" fill="#5f3dc4"/>
<path d="M70.1,120.5 L75.6,105.8 L85.2,116.0 Z" fill="#5f3dc4"/>
<path d="M122.9,210.1 L107.3,208.9 L114.4,196.9 Z" fill="#5f3dc4"/>
<path d="M124.2,302.2 L132.5,288.9 L139.8,300.9 Z" fill="#5f3dc4"/>
<path d="M97.9,394.7 L84.4,386.8 L96.1,379.1 Z" fill="#5f3dc4"/>
<!-- 2 Maske: Spiegel mit Muster, Spiegelseite unten -->
<rect x="70" y="58" width="100" height="14" rx="2" fill="#333"/>
<g fill="#cfd6dd"><rect x="80" y="70" width="12" height="4"/><rect x="98" y="70" width="20" height="4"/><rect x="124" y="70" width="8" height="4"/><rect x="138" y="70" width="22" height="4"/></g>
<path d="M31.2,186.3 Q20.1,157.3 24.8,126.6" stroke="#5b6470" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M203.9,232.0 Q212.0,255.9 204.1,280.0" stroke="#5b6470" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M53.9,357.7 Q50.3,337.4 62.3,320.6" stroke="#5b6470" stroke-width="7" fill="none" stroke-linecap="round"/>
<!-- 1 Quelle -->
<circle cx="215" cy="160" r="13" fill="#7b3fc4"/>
<circle cx="215" cy="160" r="18" fill="none" stroke="#7b3fc4" stroke-width="2" opacity="0.5"/>
<!-- 4 Wafer -->
<ellipse cx="125" cy="446" rx="96" ry="26" fill="#cfd6dd" stroke="#555" stroke-width="2"/>
<ellipse cx="125" cy="442" rx="96" ry="24" fill="none" stroke="#b8860b" stroke-width="3"/>
<g stroke="#fff" stroke-width="1.5"><path d="M40,446 H196 M62,432 H174 M62,460 H174 M78,422 V470 M98,420 V472 M138,420 V472 M158,422 V470"/></g>
<rect x="106" y="434" width="24" height="10" fill="#7b3fc4"/>
<path d="M60,490 H170" stroke="#E07B00" stroke-width="3"/>
<path d="M168,483 L182,490 L168,497 Z" fill="#E07B00"/>
<text x="118" y="514" text-anchor="middle" font-size="14" font-weight="700" fill="#c25e00">verschieben – nächster Chip</text>
<circle cx="252" cy="160" r="12" fill="#3a6ed8"/><text x="252" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="268" y="165" font-size="15" font-weight="700" fill="#7b3fc4">EUV-Licht</text>
<circle cx="250" cy="66" r="12" fill="#3a6ed8"/><text x="250" y="71" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="268" y="62" font-size="15" font-weight="700">Maske</text>
<text x="268" y="80" font-size="13" fill="#555">Spiegel mit Muster</text>
<path d="M174,66 H234" stroke="#999" stroke-width="1.5" stroke-dasharray="3 3"/>
<circle cx="252" cy="262" r="12" fill="#3a6ed8"/><text x="252" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="268" y="258" font-size="15" font-weight="700">Spiegel-Optik</text>
<text x="268" y="276" font-size="13">verkleinert</text>
<text x="268" y="292" font-size="13">das Muster</text>
<circle cx="252" cy="442" r="12" fill="#3a6ed8"/><text x="252" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
<text x="268" y="438" font-size="15" font-weight="700">Wafer</text>
<text x="268" y="456" font-size="13">lichtempfindlich</text>
<text x="268" y="472" font-size="13">beschichtet</text>
<!-- Vergleich -->
<rect x="10" y="532" width="185" height="114" rx="10" fill="#f4f5f7"/>
<rect x="24" y="568" width="14" height="14" fill="#7b3fc4"/>
<path d="M40,566 L132,546 V604 L40,584 Z" fill="#ffe8a3" opacity="0.9"/>
<rect x="134" y="546" width="46" height="58" fill="#7b3fc4" opacity="0.8"/>
<text x="102" y="622" text-anchor="middle" font-size="13" fill="#555">Beamer: macht groß</text>
<text x="102" y="639" text-anchor="middle" font-size="13" fill="#555">Licht geht durch Glas</text>
<rect x="205" y="532" width="185" height="114" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<rect x="219" y="546" width="46" height="58" fill="#7b3fc4" opacity="0.8"/>
<path d="M267,546 L359,566 V584 L267,604 Z" fill="#b197fc" opacity="0.6"/>
<rect x="361" y="568" width="14" height="14" fill="#7b3fc4"/>
<text x="297" y="622" text-anchor="middle" font-size="13" font-weight="700" fill="#c25e00">hier: macht klein</text>
<text x="297" y="639" text-anchor="middle" font-size="13" font-weight="700" fill="#c25e00">nur Spiegel</text>
</svg>
