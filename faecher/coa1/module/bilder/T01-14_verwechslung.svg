<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Fünf Verwechslungs-Paare, jeweils links und rechts mit Symbol. Router ist ein Gerät, das zwei Netze verbindet; WLAN ist eine Technik, Funk statt Kabel. Router findet den Weg zwischen Netzen; Modem übersetzt Daten in Signale für die Leitung. NAS steht bei dir im Netz; Cloud liegt beim Anbieter im Internet. Gastnetz: Fremde kommen nur ins Internet; VPN: du kommst von unterwegs in dein Netz. Kupfer ist günstig und reicht bis 100 m; Glasfaser ist teurer und nötig ab über 100 m.</title>
<defs>
<g id="rt"><line x1="-10" y1="-8" x2="-13" y2="-22" stroke="#333" stroke-width="2.5"/><line x1="10" y1="-8" x2="13" y2="-22" stroke="#333" stroke-width="2.5"/><rect x="-22" y="-9" width="44" height="18" rx="4" fill="#3a3f4a"/><circle cx="-10" cy="0" r="2.5" fill="#7fe08a"/><circle cx="-2" cy="0" r="2.5" fill="#7fe08a"/></g>
<g id="ne"><text x="0" y="8" text-anchor="middle" font-size="26" font-weight="700" fill="#c62828">≠</text></g>
</defs>
<rect width="400" height="640" fill="#fff"/>
<!-- 1 -->
<text x="200" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#555">Router oder WLAN?</text>
<use href="#rt" x="100" y="58"/>
<text x="100" y="96" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">Router</tspan> = Gerät</text>
<text x="100" y="114" text-anchor="middle" font-size="13">verbindet 2 Netze</text>
<use href="#ne" x="200" y="62"/>
<g transform="translate(300,66)" fill="none" stroke="#E07B00" stroke-width="3" stroke-linecap="round"><path d="M-6,-2 A8,8 0 0 1 6,-2"/><path d="M-13,-9 A17,17 0 0 1 13,-9"/><path d="M-20,-16 A26,26 0 0 1 20,-16"/><circle cx="0" cy="4" r="3" fill="#E07B00" stroke="none"/></g>
<text x="300" y="96" text-anchor="middle"><tspan font-weight="700" fill="#a85a00">WLAN</tspan> = Technik</text>
<text x="300" y="114" text-anchor="middle" font-size="13">Funk statt Kabel</text>
<line x1="15" y1="128" x2="385" y2="128" stroke="#ddd" stroke-width="1.5"/>
<!-- 2 -->
<text x="200" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#555">Router oder Modem?</text>
<g transform="translate(100,184)"><path d="M-30,10 H-4 V-10 H24" fill="none" stroke="#3a6ed8" stroke-width="3"/><path d="M-4,10 H24" fill="none" stroke="#ccc" stroke-width="3"/><path d="M18,-16 L28,-10 L18,-4 z" fill="#3a6ed8"/></g>
<text x="100" y="222" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">Router</tspan>: findet den Weg</text>
<text x="100" y="240" text-anchor="middle" font-size="13">zwischen Netzen</text>
<use href="#ne" x="200" y="190"/>
<g transform="translate(300,184)"><text x="-34" y="6" font-size="15" font-weight="700" fill="#1d3f8a">01</text><text x="-2" y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#555">↔</text><path d="M10,0 q4,-11 8,0 t8,0 t8,0" fill="none" stroke="#2e9d5b" stroke-width="2.5"/></g>
<text x="300" y="222" text-anchor="middle"><tspan font-weight="700" fill="#1e6e3e">Modem</tspan>: übersetzt</text>
<text x="300" y="240" text-anchor="middle" font-size="13">Daten ↔ Signale (Leitung)</text>
<line x1="15" y1="254" x2="385" y2="254" stroke="#ddd" stroke-width="1.5"/>
<!-- 3 -->
<text x="200" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#555">NAS oder Cloud?</text>
<g transform="translate(100,312)"><path d="M-30,-4 L0,-24 L30,-4 Z" fill="#c62828"/><rect x="-24" y="-4" width="48" height="28" fill="#fff" stroke="#333" stroke-width="2"/><rect x="-8" y="0" width="16" height="22" rx="2" fill="#3a3f4a"/><rect x="-5" y="4" width="10" height="4" fill="#9aa3ad"/><rect x="-5" y="11" width="10" height="4" fill="#9aa3ad"/></g>
<text x="100" y="356" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">NAS</tspan>: bei dir im Netz</text>
<use href="#ne" x="200" y="316"/>
<g transform="translate(300,314)"><path d="M-26,12 a11,11 0 0 1 2,-21 a15,15 0 0 1 28,-5 a12,12 0 0 1 19,11 a9,9 0 0 1 -2,15 z" fill="#dbe7fb" stroke="#3a6ed8" stroke-width="2"/></g>
<text x="300" y="356" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">Cloud</tspan>: beim Anbieter</text>
<text x="300" y="374" text-anchor="middle" font-size="13">im Internet</text>
<line x1="15" y1="388" x2="385" y2="388" stroke="#ddd" stroke-width="1.5"/>
<!-- 4 -->
<text x="200" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#555">Gastnetz oder VPN?</text>
<g transform="translate(100,446)"><circle cx="-26" cy="-8" r="6" fill="#555"/><path d="M-36,14 Q-36,0 -26,0 Q-16,0 -16,14 Z" fill="#555"/><line x1="-10" y1="2" x2="12" y2="2" stroke="#555" stroke-width="2.5"/><circle cx="24" cy="2" r="11" fill="#9cc3f5" stroke="#3a6ed8" stroke-width="1.5"/><ellipse cx="24" cy="2" rx="4" ry="11" fill="none" stroke="#3a6ed8" stroke-width="1.2"/></g>
<text x="100" y="486" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">Gastnetz</tspan>: Fremde</text>
<text x="100" y="504" text-anchor="middle" font-size="13">nur ins Internet</text>
<use href="#ne" x="200" y="450"/>
<g transform="translate(300,446)"><rect x="-40" y="-8" width="56" height="18" rx="9" fill="#eef4fd" stroke="#2f6b4f" stroke-width="2"/><circle cx="-30" cy="1" r="5" fill="#555"/><path d="M16,1 L22,1" stroke="#2f6b4f" stroke-width="2"/><path d="M18,-2 L31,-16 L44,-2 Z" fill="#c62828"/><rect x="21" y="-2" width="20" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/></g>
<text x="300" y="486" text-anchor="middle"><tspan font-weight="700" fill="#2f6b4f">VPN</tspan>: du von unterwegs</text>
<text x="300" y="504" text-anchor="middle" font-size="13">in dein Netz (Tunnel)</text>
<line x1="15" y1="518" x2="385" y2="518" stroke="#ddd" stroke-width="1.5"/>
<!-- 5 -->
<text x="200" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#555">Kupfer oder Glasfaser?</text>
<path d="M60,566 H140" stroke="#b5651d" stroke-width="7" stroke-linecap="round"/>
<text x="100" y="598" text-anchor="middle"><tspan font-weight="700" fill="#8a4a12">Kupfer</tspan>: günstig</text>
<text x="100" y="616" text-anchor="middle" font-size="13">bis 100 m</text>
<use href="#ne" x="200" y="574"/>
<path d="M260,566 H340" stroke="#2f8fd8" stroke-width="7" stroke-linecap="round"/><circle cx="340" cy="566" r="6" fill="#ffd54a"/>
<text x="300" y="598" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">Glasfaser</tspan>: teurer</text>
<text x="300" y="616" text-anchor="middle" font-size="13">nötig ab über 100 m</text>
</svg>
