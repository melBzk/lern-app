<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Prozessor von oben und unten: oben ein Metalldeckel (Heatspreader) über dem kleinen Chip (Die); unten ein Kunststoffträger mit vergoldeten Kontakten (bei PGA Stifte, bei LGA Flächen), dazu Kerben und ein goldenes Dreieck als Einbau-Markierung; auf der Unterseite liegt das Dreieck gespiegelt in der anderen Ecke.</title>
