<text x="16" y="58" font-size="14" font-weight="700">Länge (Version 1)</text>
<rect x="16" y="68" width="78" height="18" rx="9" fill="#c58a3a" stroke="#7a5320" stroke-width="1.5"/>
<text x="104" y="83" font-size="14" font-weight="700">Kupfer bis 3 m</text>
<rect x="16" y="98" width="260" height="18" rx="9" fill="#8fd0e8" stroke="#2a7a9a" stroke-width="1.5"/>
<text x="284" y="113" font-size="14" font-weight="700">Glas bis 10 m</text>
<text x="16" y="154" font-size="14" font-weight="700">Preis</text>
<text x="16" y="186" font-size="14" font-weight="700">USB 3.0</text>
