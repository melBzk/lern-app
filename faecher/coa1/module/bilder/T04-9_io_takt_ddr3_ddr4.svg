<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Balkendiagramm I/O-Takt laut Buchtabellen in MHz. DDR3: 400, 533, 666, 800, 933, 1066. DDR4: 800, 933, 1066, 1200, 1333, 1466, 1600. DDR4 erreicht einen höheren I/O-Takt. Darunter drei durchgestrichene Antworten, die nicht der Grund sind: schnellere Speicherzellen, Dual- oder Quad-Channel, mehr Kontakte. Zu den Kontakten: Sie machen den hohen Takt erst möglich.</title>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D4607A"/></marker></defs>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="24" text-anchor="middle" font-size="17" font-weight="700">I/O-Takt laut Buchtabellen (MHz)</text>

<line x1="70" y1="54" x2="70" y2="338" stroke="#555" stroke-width="2"/>
<text x="10" y="116" font-size="16" font-weight="700" fill="#3a6ed8">DDR3</text>
<text x="10" y="262" font-size="16" font-weight="700" fill="#2e7d32">DDR4</text>

<g fill="#3a6ed8">
<rect x="70" y="60" width="75" height="16"/><rect x="70" y="80" width="100" height="16"/><rect x="70" y="100" width="125" height="16"/>
<rect x="70" y="120" width="150" height="16"/><rect x="70" y="140" width="175" height="16"/><rect x="70" y="160" width="200" height="16"/>
</g>
<g fill="#2e7d32">
<rect x="70" y="196" width="150" height="16"/><rect x="70" y="216" width="175" height="16"/><rect x="70" y="236" width="200" height="16"/>
<rect x="70" y="256" width="225" height="16"/><rect x="70" y="276" width="250" height="16"/><rect x="70" y="296" width="275" height="16"/>
<rect x="70" y="316" width="300" height="16"/>
</g>
<g fill="#fff" font-size="13" font-weight="700" text-anchor="end">
<text x="139" y="73">400</text><text x="164" y="93">533</text><text x="189" y="113">666</text>
<text x="214" y="133">800</text><text x="239" y="153">933</text><text x="264" y="173">1066</text>
<text x="214" y="209">800</text><text x="239" y="229">933</text><text x="264" y="249">1066</text>
<text x="289" y="269">1200</text><text x="314" y="289">1333</text><text x="339" y="309">1466</text>
<text x="364" y="329">1600</text>
</g>

<!-- Hinweis -->
<text x="338" y="80" text-anchor="middle" font-weight="700" fill="#D4607A">DDR4 erreicht</text>
<text x="338" y="98" text-anchor="middle" font-weight="700" fill="#D4607A">höheren</text>
<text x="338" y="116" text-anchor="middle" font-weight="700" fill="#D4607A">I/O-Takt</text>
<line x1="338" y1="126" x2="338" y2="186" stroke="#D4607A" stroke-width="4" marker-end="url(#p)"/>

<!-- Falsche Gründe -->
<text x="10" y="372" font-size="15" font-weight="700">Nicht der Grund:</text>
<g fill="#eceff1"><rect x="10" y="382" width="118" height="54" rx="6"/><rect x="141" y="382" width="118" height="54" rx="6"/><rect x="272" y="382" width="118" height="54" rx="6"/></g>
<g text-anchor="middle" font-size="13">
<text x="69" y="404">schnellere</text><text x="69" y="422">Speicherzellen?</text>
<text x="200" y="404">Dual/Quad</text><text x="200" y="422">Channel?</text>
<text x="331" y="404">mehr</text><text x="331" y="422">Kontakte?</text>
</g>
<g stroke="#c62828" stroke-width="2" stroke-linecap="round" opacity="0.75"><line x1="16" y1="430" x2="122" y2="388"/><line x1="147" y1="430" x2="253" y2="388"/><line x1="278" y1="430" x2="384" y2="388"/></g>
<text x="331" y="456" text-anchor="middle" font-size="13" fill="#555">machen den hohen</text>
<text x="331" y="472" text-anchor="middle" font-size="13" fill="#555">Takt erst möglich</text>
</svg>
