<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Grenzen der Virtualisierung: Spielegrafik läuft auf virtuellen Grafikkarten schwer oder gar nicht. Ein schwacher Host macht alles langsamer, Virtualisierung braucht mehr RAM. Die VM sieht nur virtuelle Hardware, CPU-Z zeigt das Mainboard nur eingeschränkt. Abhilfe VT-d bei Intel: die VM bekommt ein echtes Gerät, z. B. eine Netzwerkkarte, das ist schneller.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="378" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Wo Virtualisierung an Grenzen stößt</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="22" y="74.0" width="52" height="26" rx="12" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><line x1="32" y1="87.0" x2="42" y2="87.0" stroke="#fff" stroke-width="3"/><line x1="37" y1="82.0" x2="37" y2="92.0" stroke="#fff" stroke-width="3"/><circle cx="60" cy="84.0" r="3" fill="#fff" stroke="none" stroke-width="2"/><circle cx="66" cy="90.0" r="3" fill="#fff" stroke="none" stroke-width="2"/><circle cx="72" cy="70.0" r="9" fill="#c62828" stroke="none" stroke-width="2"/><path d="M68.4,66.4 L75.6,73.6 M75.6,66.4 L68.4,73.6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="82.0" font-size="15" font-weight="700" fill="#c62828">Spielegrafik</text>
<text x="100" y="103.0" font-size="14">virtuelle Grafikkarte: schwer oder gar nicht</text>
<line x1="15" y1="126" x2="385" y2="126" stroke="#ddd" stroke-width="1"/>
<rect x="22.0" y="145.76" width="52" height="32.24" rx="4" fill="#333" stroke="#333" stroke-width="1"/><rect x="26.0" y="149.76" width="44" height="24.240000000000002" rx="2" fill="#eef2f7" stroke="none" stroke-width="0"/><path d="M14.0,186.0 L22.0,178.0 L74.0,178.0 L82.0,186.0 Z" fill="#9aa3ad" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M42,164.0 A8,8 0 1 1 54,164.0" fill="none" stroke="#E07B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M74,141.0 L83,157.2 L65,157.2 Z" fill="#E07B00" stroke="#E07B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="155.4" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">!</text>
<text x="100" y="154.0" font-size="15" font-weight="700" fill="#c62828">schwacher Host</text>
<text x="100" y="174.0" font-size="14">alles läuft langsamer;</text>
<text x="100" y="192.0" font-size="14">Virtualisierung braucht mehr RAM</text>
<line x1="15" y1="206" x2="385" y2="206" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="226.0" width="60" height="40" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><path d="M18,248.0 V231.0 Q18,226.0 23,226.0 H73 Q78,226.0 78,231.0 V248.0 Z" fill="#3a6ed8" stroke="#3a6ed8" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="242.0" font-size="13" font-weight="700" fill="#fff">VM</text><rect x="30" y="252.0" width="36" height="8" rx="2" fill="#ccc" stroke="none" stroke-width="0"/><text x="72" y="264.0" font-size="16" text-anchor="middle" font-weight="700" fill="#E07B00">?</text>
<text x="100" y="234.0" font-size="15" font-weight="700" fill="#c62828">nur virtuelle Hardware</text>
<text x="100" y="254.0" font-size="14">CPU-Z zeigt in der VM das</text>
<text x="100" y="272.0" font-size="14">Mainboard nur eingeschränkt</text>
<line x1="15" y1="286" x2="385" y2="286" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="304.0" width="28" height="20" rx="2" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/><line x1="30" y1="326.0" x2="30" y2="330.0" stroke="#2f6b4f" stroke-width="2" marker-end="url(#g)"/><rect x="46" y="322.0" width="34" height="22" rx="2" fill="#2f6b4f" stroke="#222" stroke-width="1.5"/><line x1="50" y1="344.0" x2="50" y2="350.0" stroke="#c9a227" stroke-width="3"/><line x1="76" y1="344.0" x2="76" y2="350.0" stroke="#c9a227" stroke-width="3"/><path d="M30,324.0 Q30,334.0 44,334.0" fill="none" stroke="#2f6b4f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="314.0" font-size="15" font-weight="700" fill="#2f6b4f">Abhilfe: VT-d (Intel)</text>
<text x="100" y="334.0" font-size="14">VM bekommt ein echtes Gerät,</text>
<text x="100" y="352.0" font-size="14">z. B. Netzwerkkarte – schneller</text>
<line x1="15" y1="366" x2="385" y2="366" stroke="#ddd" stroke-width="1"/>
</svg>
