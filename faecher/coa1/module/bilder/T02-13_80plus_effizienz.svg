<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <title>Oben: Treppe der 80-PLUS-Stufen von unten nach oben – 80 PLUS weiß, Bronze, Silber, Gold, Platinum; je höher, desto sparsamer. Unten: Tacho für die Last des Netzteils von 0 bis 100 Prozent; zwischen 40 und 80 Prozent arbeitet das Netzteil am effizientesten.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker>
  </defs>
  <rect width="400" height="540" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">80 PLUS – Stufen für sparsame Netzteile</text>

  <!-- Treppe: 5 Stufen, Breite 72 -->
  <g stroke="#555" stroke-width="1.5">
    <rect x="20" y="214" width="72" height="40" fill="#ffffff"/>
    <rect x="92" y="184" width="72" height="70" fill="#cd7f32"/>
    <rect x="164" y="154" width="72" height="100" fill="#c0c4c8"/>
    <rect x="236" y="124" width="72" height="130" fill="#d4af37"/>
    <rect x="308" y="94" width="72" height="160" fill="#e7e6e2"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="56" y="232">80 PLUS</text>
    <text x="56" y="248" font-weight="400">(weiß)</text>
    <text x="128" y="204" fill="#fff">Bronze</text>
    <text x="200" y="174">Silber</text>
    <text x="272" y="144">Gold</text>
    <text x="344" y="114">Platinum</text>
  </g>
  <line x1="40" y1="190" x2="300" y2="64" stroke="#2e9e5b" stroke-width="3" marker-end="url(#a)"/>
  <text x="250" y="60" font-size="16" font-weight="700" fill="#1c6b3c" text-anchor="end">sparsamer</text>

  <!-- Tacho -->
  <text x="200" y="300" text-anchor="middle" font-size="16" font-weight="700">Last des Netzteils</text>
  <path d="M100,440 A100,100 0 0 1 300,440" fill="none" stroke="#d6d9de" stroke-width="22"/>
  <path d="M169.1,344.9 A100,100 0 0 1 280.9,381.2" fill="none" stroke="#2e9e5b" stroke-width="22"/>
  <!-- Zeiger auf 60 % -->
  <line x1="200" y1="440" x2="224.7" y2="363.9" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="440" r="8" fill="#333"/>
  <g font-size="14" font-weight="700">
    <text x="100" y="462" text-anchor="middle">0 %</text>
    <text x="300" y="462" text-anchor="middle">100 %</text>
    <text x="160" y="326" text-anchor="end" fill="#1c6b3c">40 %</text>
    <text x="298" y="368" fill="#1c6b3c">80 %</text>
  </g>
  <text x="200" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#1c6b3c">grün: hier arbeitet das Netzteil</text>
  <text x="200" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#1c6b3c">am effizientesten (40–80 %)</text>
</svg>
