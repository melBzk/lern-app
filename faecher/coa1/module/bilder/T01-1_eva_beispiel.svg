<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 516" font-family="system-ui, sans-serif" role="img">
<title>Comic in drei Schritten: 1 Eingabe, du tippst 2 + 3 auf der Tastatur. 2 Verarbeitung, der Prozessor-Chip rechnet 2 + 3 = 5. 3 Ausgabe, der Monitor zeigt groß die 5.</title>

