<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Puzzle aus fünf Teilen, die zusammen die Leistung ergeben: das größte Teil ist der Takt in GHz, dazu Befehle pro Takt, Anzahl der Kerne, Cache-Größe und Anbindung an den Arbeitsspeicher. Darunter: Nur den Takt vergleichen geht nur bei gleicher Familie und Generation.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Takt ist nicht gleich Leistung</text>

<!-- Rahmen Leistung -->
<rect x="12" y="40" width="376" height="282" rx="12" fill="#f4f1ee" stroke="#222" stroke-width="2.5"/>
<text x="200" y="66" font-size="18" text-anchor="middle" font-weight="700">Leistung</text>

<!-- Teile (weiße Fugen) -->
<g stroke="#fff" stroke-width="4">
<rect x="22" y="78" width="200" height="150" fill="#E07B00"/>
<rect x="222" y="78" width="156" height="75" fill="#5b86e0"/>
<rect x="222" y="153" width="156" height="75" fill="#3a6ed8"/>
<rect x="22" y="228" width="180" height="84" fill="#7ea0e8"/>
<rect x="202" y="228" width="176" height="84" fill="#2f6b4f"/>
</g>
<!-- Puzzle-Nasen -->
<path d="M220,104 A11,11 0 0,1 220,126 Z" fill="#E07B00"/><rect x="214" y="104" width="8" height="22" fill="#E07B00"/>
<path d="M220,170 A11,11 0 0,1 220,192 Z" fill="#E07B00"/><rect x="214" y="170" width="8" height="22" fill="#E07B00"/>
<path d="M300,155 A11,11 0 0,1 278,155 Z" fill="#5b86e0"/><rect x="278" y="149" width="22" height="8" fill="#5b86e0"/>
<path d="M100,226 A11,11 0 0,1 122,226 Z" fill="#7ea0e8"/><rect x="100" y="224" width="22" height="8" fill="#7ea0e8"/>
<path d="M290,226 A11,11 0 0,1 312,226 Z" fill="#2f6b4f"/><rect x="290" y="224" width="22" height="8" fill="#2f6b4f"/>
<path d="M200,260 A11,11 0 0,1 200,282 Z" fill="#7ea0e8"/><rect x="194" y="260" width="8" height="22" fill="#7ea0e8"/>

<text x="118" y="152" font-size="22" text-anchor="middle" font-weight="700" fill="#fff">Takt (GHz)</text>
<text x="300" y="112" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">Befehle</text>
<text x="300" y="130" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">pro Takt</text>
<text x="300" y="188" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">Anzahl</text>
<text x="300" y="206" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">Kerne</text>
<text x="112" y="276" font-size="15" text-anchor="middle" font-weight="700" fill="#222">Cache-Größe</text>
<text x="292" y="258" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">Anbindung an den</text>
<text x="292" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">Arbeitsspeicher</text>

<rect x="12" y="338" width="376" height="70" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="200" y="365" font-size="15" text-anchor="middle" font-weight="700">Nur Takt vergleichen?</text>
<text x="200" y="391" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">Nur bei gleicher Familie und Generation!</text>
</svg>
