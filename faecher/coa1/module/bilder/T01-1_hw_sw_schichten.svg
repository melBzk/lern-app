<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Schichtbild von oben nach unten: du, darunter die Programme (z. B. Textprogramm), darunter das Betriebssystem (z. B. Windows), das vermittelt, ganz unten die Hardware mit Tastatur, Monitor, CPU und RAM. Programme und Betriebssystem zusammen sind Software. Ein oranger Pfeil zeigt: Die Befehle aus der Software arbeitet die CPU ab.</title>
