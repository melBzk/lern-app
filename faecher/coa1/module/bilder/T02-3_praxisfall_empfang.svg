<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="system-ui, sans-serif" fill="#222">
<title>Auftragszettel Arztpraxis, Empfang: Der PC soll sehr klein sein, nur Termine verwalten und braucht keine Grafikkarte. Darunter zwei offene Fragen mit Fragezeichen: Welcher Formfaktor? Welches Gehäuse?</title>
<rect width="400" height="330" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Auftrag: PC für den Empfang</text>
<rect x="30" y="46" width="340" height="150" rx="6" fill="#fffbe8" stroke="#c99a06" stroke-width="2"/>
<text x="50" y="74" font-size="15" font-weight="700">Arztpraxis · Empfang</text>
<line x1="50" y1="84" x2="350" y2="84" stroke="#c99a06" stroke-width="1"/>
<g font-size="15">
<path d="M52,104 L58,110 L68,98" fill="none" stroke="#2e9d5b" stroke-width="3" stroke-linecap="round"/><text x="80" y="110"><tspan font-weight="700">sehr klein</tspan></text>
<path d="M52,138 L58,144 L68,132" fill="none" stroke="#2e9d5b" stroke-width="3" stroke-linecap="round"/><text x="80" y="144">nur Termine verwalten</text>
<g stroke="#d43c3c" stroke-width="3" stroke-linecap="round"><line x1="53" y1="166" x2="66" y2="179"/><line x1="66" y1="166" x2="53" y2="179"/></g><text x="80" y="178">keine Grafikkarte</text>
</g>
<g text-anchor="middle">
<rect x="30" y="214" width="160" height="96" rx="10" fill="#f4f1ee"/>
<text x="110" y="262" font-size="34" font-weight="700" fill="#D4607A">?</text>
<text x="110" y="294" font-size="15" font-weight="700">Formfaktor</text>
<rect x="210" y="214" width="160" height="96" rx="10" fill="#f4f1ee"/>
<text x="290" y="262" font-size="34" font-weight="700" fill="#D4607A">?</text>
<text x="290" y="294" font-size="15" font-weight="700">Gehäuse</text>
</g>
</svg>
