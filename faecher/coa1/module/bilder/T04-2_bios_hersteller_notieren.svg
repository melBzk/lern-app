<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Oben: Der PC läuft. Im Fenster msinfo32 ist die Zeile BIOS-Version/-Datum markiert. Ein Pfeil führt zu einem gelben Notizzettel am Monitor: BIOS-Hersteller und Version eintragen. Unten: Der PC startet nicht, der Bildschirm bleibt dunkel, der Lautsprecher piept, ein Fragezeichen. Kein Start heißt: nichts mehr auslesbar. Der Notizzettel hilft, die richtige Code-Tabelle zu finden.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="600" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">BIOS-Hersteller notieren</text>

<!-- Teil 1: PC läuft -->
<circle cx="24" cy="58" r="11" fill="#2e7d32"/><text x="24" y="63" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
<text x="42" y="63" font-weight="700" fill="#2e7d32">solange der PC noch läuft</text>
<!-- Monitor -->
<rect x="14" y="78" width="250" height="150" rx="6" fill="#333"/>
<rect x="22" y="86" width="234" height="134" fill="#fff"/>
<rect x="22" y="86" width="234" height="22" fill="#3a6ed8"/>
<text x="30" y="102" fill="#fff" font-weight="700" font-size="13">msinfo32 – Systeminformationen</text>
<g font-size="13" fill="#555">
<text x="30" y="128">Betriebssystem …</text>
<text x="30" y="150">Prozessor …</text>
<text x="30" y="204">Installierter RAM …</text>
</g>
<rect x="26" y="158" width="226" height="28" rx="3" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="32" y="177" font-size="13" font-weight="700" fill="#c62828">BIOS-Version/-Datum</text>
<rect x="128" y="228" width="22" height="12" fill="#555"/><rect x="104" y="240" width="70" height="5" fill="#555"/>

<!-- Pfeil zum Zettel -->
<path d="M252,172 C276,172 280,160 290,150" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#k)"/>
<!-- Notizzettel -->
<g transform="rotate(4 334 160)">
<rect x="278" y="90" width="112" height="140" fill="#FFE97A" stroke="#C9A800" stroke-width="1.5"/>
<text x="334" y="118" text-anchor="middle" font-weight="700" font-size="14">BIOS-</text>
<text x="334" y="136" text-anchor="middle" font-weight="700" font-size="14">Hersteller:</text>
<line x1="290" y1="160" x2="378" y2="160" stroke="#555" stroke-width="1.5"/>
<text x="334" y="188" text-anchor="middle" font-weight="700" font-size="14">Version:</text>
<line x1="290" y1="212" x2="378" y2="212" stroke="#555" stroke-width="1.5"/>
</g>

<line x1="334" y1="246" x2="334" y2="332" stroke="#222" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#k)"/>
<text x="326" y="290" text-anchor="end" font-size="13" fill="#555">Zettel bleibt</text>

<!-- Teil 2: PC startet nicht -->
<circle cx="24" cy="300" r="11" fill="#c62828"/><text x="24" y="305" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
<text x="42" y="305" font-weight="700" fill="#c62828">später: PC startet nicht</text>
<rect x="14" y="322" width="200" height="130" rx="6" fill="#333"/>
<rect x="22" y="330" width="184" height="114" fill="#111"/>
<text x="114" y="402" text-anchor="middle" fill="#fff" font-weight="700" font-size="44">?</text>
<rect x="104" y="452" width="22" height="12" fill="#555"/><rect x="80" y="464" width="70" height="5" fill="#555"/>
<!-- Lautsprecher -->
<rect x="232" y="382" width="12" height="20" fill="#555"/>
<path d="M244,382 L260,370 L260,414 L244,402 Z" fill="#555"/>
<g fill="#c62828" stroke="#c62828" stroke-width="2.2">
<ellipse cx="272" cy="402" rx="5" ry="4" stroke="none"/><line x1="276.5" y1="402" x2="276.5" y2="380"/>
<ellipse cx="288" cy="394" rx="5" ry="4" stroke="none"/><line x1="292.5" y1="394" x2="292.5" y2="372"/>
<line x1="276.5" y1="380" x2="292.5" y2="372"/>
</g>
<!-- kleiner Zettel unten -->
<g transform="rotate(4 350 380)">
<rect x="314" y="340" width="72" height="80" fill="#FFE97A" stroke="#C9A800" stroke-width="1.5"/>
<line x1="324" y1="362" x2="376" y2="362" stroke="#555" stroke-width="1.5"/><line x1="324" y1="382" x2="376" y2="382" stroke="#555" stroke-width="1.5"/><line x1="324" y1="402" x2="376" y2="402" stroke="#555" stroke-width="1.5"/>
</g>

<rect x="10" y="488" width="380" height="102" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="200" y="516" text-anchor="middle" font-weight="700" font-size="15">Kein Start = nichts mehr auslesbar</text>
<text x="200" y="544" text-anchor="middle">Der Zettel sagt dir den Hersteller.</text>
<text x="200" y="566" text-anchor="middle">→ richtige Code-Tabelle im Handbuch</text>
</svg>
