<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Die 7 neuen Wörter mit kleinen Symbolen. USB: Universal Serial Bus, der Standard-Anschluss für externe Geräte. Hub: Verteiler, aus einer USB-Buchse werden mehrere. Hot-Plugging: Gerät im laufenden Betrieb ein- und ausstecken. USB-C: kleiner, ovaler Stecker, wird Standard. USB4: neueste USB-Version, aus Thunderbolt und USB. FireWire: alter, schneller Anschluss vor allem für Video-Kameras. eSATA: external SATA, der Festplatten-Anschluss nach außen geführt.</title>
<rect width="400" height="430" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">7 Wörter auf einen Blick</text>
<g fill="#f4f1ee"><rect x="8" y="38" width="384" height="50" rx="9"/><rect x="8" y="93" width="384" height="50" rx="9"/><rect x="8" y="148" width="384" height="50" rx="9"/><rect x="8" y="203" width="384" height="50" rx="9"/><rect x="8" y="258" width="384" height="50" rx="9"/><rect x="8" y="313" width="384" height="50" rx="9"/><rect x="8" y="368" width="384" height="50" rx="9"/></g>
<!-- USB -->
<rect x="24" y="52" width="60" height="22" rx="2" fill="#d0d0d0" stroke="#555" stroke-width="2"/><rect x="31" y="56" width="46" height="8" fill="#fafafa" stroke="#888"/>
<text x="100" y="60" font-size="15" font-weight="700">USB</text>
<text x="100" y="79" font-size="13">Standard-Anschluss für externe Geräte</text>
<!-- Hub -->
<rect x="26" y="106" width="56" height="24" rx="4" fill="#555"/>
<g fill="#fafafa"><rect x="31" y="113" width="10" height="6"/><rect x="45" y="113" width="10" height="6"/><rect x="59" y="113" width="10" height="6"/></g>
<line x1="78" y1="118" x2="90" y2="118" stroke="#555" stroke-width="3"/>
<text x="100" y="115" font-size="15" font-weight="700">Hub</text>
<text x="100" y="134" font-size="13">Verteiler: aus 1 Buchse werden mehrere</text>
<!-- Hot-Plugging -->
<circle cx="36" cy="173" r="12" fill="#2e9d5b"/><text x="36" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">an</text>
<path d="M52,173 H70" stroke="#333" stroke-width="2.5"/><path d="M66,167 L74,173 L66,179" fill="none" stroke="#333" stroke-width="2.5"/>
<rect x="76" y="166" width="14" height="14" rx="2" fill="#d0d0d0" stroke="#555" stroke-width="1.5"/>
<text x="100" y="170" font-size="15" font-weight="700">Hot-Plugging</text>
<text x="100" y="189" font-size="13">im laufenden Betrieb ein-/ausstecken</text>
<!-- USB-C -->
<rect x="26" y="217" width="56" height="20" rx="10" fill="#d0d0d0" stroke="#2e9d5b" stroke-width="2.5"/><rect x="38" y="223" width="32" height="7" rx="2" fill="#fafafa" stroke="#888"/>
<text x="100" y="225" font-size="15" font-weight="700" fill="#1f7a45">USB-C</text>
<text x="100" y="244" font-size="13">kleiner, ovaler <tspan font-weight="700">Stecker</tspan> – wird Standard</text>
<!-- USB4 -->
<rect x="24" y="270" width="62" height="28" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="55" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#2550a8">USB4</text>
<text x="100" y="280" font-size="15" font-weight="700">USB4</text>
<text x="100" y="299" font-size="13">neueste <tspan font-weight="700">Version</tspan>, aus Thunderbolt + USB</text>
<!-- FireWire -->
<path d="M26,327 H64 A12,12 0 0 1 64,351 H26 Z" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<rect x="33" y="333" width="34" height="11" fill="#fafafa" stroke="#888"/>
<text x="100" y="335" font-size="15" font-weight="700">FireWire</text>
<text x="100" y="354" font-size="13">alt, schnell, vor allem Video-Kameras</text>
<!-- eSATA -->
<path d="M22,384 H86 V396 H80 V400 H28 V396 H22 Z" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
<rect x="31" y="388" width="46" height="5" fill="#fafafa"/>
<text x="100" y="390" font-size="15" font-weight="700">eSATA</text>
<text x="100" y="409" font-size="13">external SATA: Festplatten-Anschluss außen</text>
</svg>
