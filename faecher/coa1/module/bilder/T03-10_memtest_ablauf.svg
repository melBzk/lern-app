<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 570" font-family="system-ui, sans-serif">
  <title>Ablauf mit MemTest86 in vier Schritten. 1: MemTest86 liegt auf einem USB-Stick. 2: Der PC startet vom Stick, ohne Windows. 3: Die Arbeitsspeicher-Module werden geprüft, drei Riegel haben einen grünen Haken, einer ein rotes Kreuz. 4: Das defekte Modul wird ausgetauscht. Unten ein Zeitstrahl, auf dem kleine Warnzeichen immer häufiger werden: Ein Ausfall kündigt sich meist schleichend an.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <g id="ok"><circle r="10" fill="#1f9d55"/><path d="M-5,0 L-1,4 L5,-4" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="no"><circle r="10" fill="#d63c3c"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>
    <g id="warn"><path d="M0,-11 L10,7 L-10,7 Z" fill="#f2b705" stroke="#8a6a00" stroke-width="1.5" stroke-linejoin="round"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#222">!</text></g>
  </defs>
  <rect width="400" height="570" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">MemTest86: RAM prüfen</text>

  <!-- 1 USB-Stick -->
  <circle cx="22" cy="72" r="12" fill="#3a6ed8"/><text x="22" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <rect x="44" y="62" width="18" height="20" fill="#ccc" stroke="#555" stroke-width="1.5"/>
  <rect x="62" y="52" width="110" height="40" rx="7" fill="#3a6ed8"/>
  <text x="117" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MemTest86</text>
  <text x="190" y="78" font-size="15" fill="#222">auf USB-Stick</text>
  <line x1="110" y1="98" x2="110" y2="120" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2 PC startet -->
  <circle cx="22" cy="158" r="12" fill="#3a6ed8"/><text x="22" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <rect x="50" y="124" width="120" height="70" rx="5" fill="#222"/>
  <rect x="56" y="130" width="108" height="58" rx="2" fill="#1a3a7a"/>
  <text x="66" y="152" font-size="13" font-family="monospace" fill="#fff">Test läuft</text>
  <rect x="66" y="164" width="88" height="10" fill="#fff" fill-opacity="0.3"/>
  <rect x="66" y="164" width="50" height="10" fill="#fff"/>
  <rect x="100" y="194" width="20" height="10" fill="#555"/>
  <text x="190" y="152" font-size="15" font-weight="700" fill="#222">PC startet vom Stick –</text>
  <text x="190" y="174" font-size="15" font-weight="700" fill="#d63c3c">ohne Windows</text>
  <line x1="110" y1="208" x2="110" y2="230" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3 vier Riegel -->
  <circle cx="22" cy="270" r="12" fill="#3a6ed8"/><text x="22" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <g stroke="#555" stroke-width="1.5">
    <rect x="44" y="240" width="26" height="70" rx="2" fill="#2f8f5b"/>
    <rect x="80" y="240" width="26" height="70" rx="2" fill="#2f8f5b"/>
    <rect x="116" y="240" width="26" height="70" rx="2" fill="#2f8f5b"/>
    <rect x="152" y="240" width="26" height="70" rx="2" fill="#2f8f5b"/>
  </g>
  <g fill="#222"><rect x="50" y="250" width="14" height="10"/><rect x="50" y="270" width="14" height="10"/><rect x="86" y="250" width="14" height="10"/><rect x="86" y="270" width="14" height="10"/><rect x="122" y="250" width="14" height="10"/><rect x="122" y="270" width="14" height="10"/><rect x="158" y="250" width="14" height="10"/><rect x="158" y="270" width="14" height="10"/></g>
  <use xlink:href="#ok" x="57" y="300"/><use xlink:href="#ok" x="93" y="300"/><use xlink:href="#no" x="129" y="300"/><use xlink:href="#ok" x="165" y="300"/>
  <text x="196" y="270" font-size="15" font-weight="700" fill="#222">jedes Modul</text>
  <text x="196" y="292" font-size="15" font-weight="700" fill="#222">wird geprüft</text>
  <line x1="110" y1="320" x2="110" y2="342" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- 4 austauschen -->
  <circle cx="22" cy="382" r="12" fill="#3a6ed8"/><text x="22" y="387" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <rect x="50" y="350" width="26" height="70" rx="2" fill="#2f8f5b" stroke="#555" stroke-width="1.5" opacity="0.5"/>
  <use xlink:href="#no" x="63" y="385"/>
  <path d="M84,372 L120,372" stroke="#d63c3c" stroke-width="3" marker-end="url(#a)" fill="none"/>
  <path d="M120,398 L84,398" stroke="#1f9d55" stroke-width="3" marker-end="url(#a)" fill="none"/>
  <rect x="128" y="350" width="26" height="70" rx="2" fill="#2f8f5b" stroke="#555" stroke-width="1.5"/>
  <use xlink:href="#ok" x="141" y="385"/>
  <text x="172" y="382" font-size="15" font-weight="700" fill="#222">defektes Modul</text>
  <text x="172" y="404" font-size="15" font-weight="700" fill="#222">austauschen</text>

  <!-- Zeitstrahl -->
  <rect x="8" y="444" width="384" height="116" rx="10" fill="#f3f4f6" stroke="#ddd"/>
  <line x1="24" y1="534" x2="372" y2="534" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
  <text x="372" y="554" text-anchor="end" font-size="13" fill="#555">Zeit</text>
  <use xlink:href="#warn" x="60" y="518"/>
  <use xlink:href="#warn" x="170" y="518"/>
  <use xlink:href="#warn" x="240" y="518"/>
  <use xlink:href="#warn" x="285" y="518"/>
  <use xlink:href="#warn" x="315" y="518"/>
  <use xlink:href="#warn" x="340" y="518"/>
  <text x="200" y="470" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Ausfall kündigt sich meist</text>
  <text x="200" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#222">schleichend an</text>
</svg>
