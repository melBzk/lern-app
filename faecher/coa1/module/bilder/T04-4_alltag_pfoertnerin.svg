<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich Büroflur: Links das Chefbüro, die Chefin ist die CPU und arbeitet ungestört am Schreibtisch weiter. Vor der Tür steht die Pförtnerin mit dem Schild PCI-Bridge und trägt einen Brief den Flur entlang. Der Flur ist der PCI-Bus, an ihm liegen vier Büros, die Karten 1 bis 4, zum Beispiel Netzwerkkarte und Soundkarte. Kasten unten: Wo der Vergleich hinkt – im Flur dürfen alle gleichzeitig reden, auf dem Bus sendet immer nur einer.</title>
<rect width="400" height="410" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Die Pförtnerin vor dem Chefbüro</text>

<!-- Chefbüro -->
<rect x="12" y="64" width="108" height="142" rx="4" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="66" y="86" text-anchor="middle" font-size="13">Chefbüro</text>
<text x="66" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6ed8">= CPU</text>
<circle cx="66" cy="136" r="11" fill="#f2c9a0" stroke="#555" stroke-width="1.5"/>
<path d="M48,172 Q66,146 84,172 Z" fill="#3a6ed8"/>
<rect x="28" y="170" width="76" height="8" fill="#555"/>
<line x1="34" y1="178" x2="34" y2="198" stroke="#555" stroke-width="3"/><line x1="98" y1="178" x2="98" y2="198" stroke="#555" stroke-width="3"/>
<text x="66" y="228" text-anchor="middle" font-size="13">arbeitet</text>
<text x="66" y="245" text-anchor="middle" font-size="13">ungestört weiter</text>

<!-- Pförtnerin -->
<circle cx="150" cy="148" r="11" fill="#f2c9a0" stroke="#555" stroke-width="1.5"/>
<path d="M138,202 L142,162 L158,162 L162,202 Z" fill="#c62828"/>
<rect x="164" y="166" width="20" height="14" fill="#fff" stroke="#555" stroke-width="1.5"/>
<path d="M164,166 L174,174 L184,166" fill="none" stroke="#555" stroke-width="1.5"/>
<rect x="104" y="212" width="94" height="26" rx="4" fill="#c62828"/>
<text x="151" y="230" text-anchor="middle" font-weight="700" fill="#fff">PCI-Bridge</text>
<text x="151" y="256" text-anchor="middle" font-size="13">Pförtnerin</text>

<!-- Flur und Türen -->
<text x="294" y="74" text-anchor="middle" font-weight="700">Büros = Karten</text>
<g fill="#fff" stroke="#555" stroke-width="2">
<rect x="200" y="84" width="38" height="66"/><rect x="246" y="84" width="38" height="66"/><rect x="292" y="84" width="38" height="66"/><rect x="338" y="84" width="38" height="66"/>
</g>
<g font-size="18" font-weight="700" text-anchor="middle"><text x="219" y="124">1</text><text x="265" y="124">2</text><text x="311" y="124">3</text><text x="357" y="124">4</text></g>
<rect x="188" y="150" width="200" height="54" fill="#eceff1" stroke="#9aa5b1" stroke-width="2"/>
<text x="288" y="172" text-anchor="middle" font-weight="700">Flur = PCI-Bus</text>
<line x1="192" y1="190" x2="300" y2="190" stroke="#c62828" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M298,183 L312,190 L298,197 Z" fill="#c62828"/>
<text x="208" y="226" font-size="13">z. B. 1 = Netzwerkkarte,</text>
<text x="208" y="244" font-size="13">2 = Soundkarte …</text>

<!-- hinkt -->
<rect x="12" y="282" width="376" height="104" rx="10" fill="#fff3e0" stroke="#E07B00" stroke-width="2"/>
<text x="28" y="310" font-weight="700" fill="#b85f00">Wo der Vergleich hinkt:</text>
<text x="28" y="336">Im Flur dürfen alle gleichzeitig reden –</text>
<text x="28" y="362" font-weight="700">auf dem Bus sendet immer nur einer.</text>
</svg>
