<text x="326" y="211" font-size="14" text-anchor="middle" font-weight="700" fill="#444">verbindet</text>
<rect x="24" y="266" width="352" height="92" rx="10" fill="#fff" stroke="#999" stroke-width="2"/>
<rect x="54" y="296" width="60" height="40" rx="4" fill="#4a4a4a" stroke="#222" stroke-width="1.5"/><text x="84" y="321" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">SSD</text>
<text x="160" y="302" font-size="17" font-weight="700" fill="#222">Speicher</text>
<text x="160" y="324" font-size="14" fill="#444">z. B. SSD</text>
