<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 388" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Die Gruppe Sonstiges in einem gestrichelten grauen Rahmen mit drei Untergruppen: Netz (z. B. Router) verbindet, Anschlüsse (z. B. USB) verbinden, Speicher (z. B. SSD) lagert Daten.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="388" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700" fill="#222">Sonstiges: verbindet oder lagert</text>
<rect x="10" y="44" width="380" height="330" rx="12" fill="#f1f3f5" stroke="#777" stroke-width="2.5" stroke-dasharray="7 5"/>
<rect x="24" y="58" width="352" height="92" rx="10" fill="#fff" stroke="#999" stroke-width="2"/>
<line x1="62" y1="106" x2="56" y2="84" stroke="#333" stroke-width="3"/><line x1="106" y1="106" x2="112" y2="84" stroke="#333" stroke-width="3"/><rect x="50" y="104" width="68" height="22" rx="5" fill="#6b7280" stroke="#333" stroke-width="1.5"/><circle cx="64" cy="115" r="2.5" fill="#7ee08a" stroke="none" stroke-width="0"/><circle cx="73" cy="115" r="2.5" fill="#7ee08a" stroke="none" stroke-width="0"/><circle cx="82" cy="115" r="2.5" fill="#7ee08a" stroke="none" stroke-width="0"/>
<text x="160" y="94" font-size="17" font-weight="700" fill="#222">Netz</text>
<text x="160" y="116" font-size="14" fill="#444">z. B. Router</text>
<rect x="286" y="88" width="80" height="28" rx="14" fill="#e5e7eb" stroke="none" stroke-width="0"/>
<text x="326" y="107" font-size="14" text-anchor="middle" font-weight="700" fill="#444">verbindet</text>
<rect x="24" y="162" width="352" height="92" rx="10" fill="#fff" stroke="#999" stroke-width="2"/>
<path d="M50,222 Q64,222 70,212" fill="none" stroke="#333" stroke-width="4"/><rect x="68" y="203" width="26" height="18" rx="3" fill="#555" stroke="#222" stroke-width="1.5"/><rect x="94" y="205" width="22" height="14" rx="1" fill="#d0d4d9" stroke="#555" stroke-width="1.5"/><rect x="99" y="208" width="4" height="3" rx="0" fill="#555" stroke="none" stroke-width="0"/><rect x="107" y="208" width="4" height="3" rx="0" fill="#555" stroke="none" stroke-width="0"/>
<text x="160" y="198" font-size="17" font-weight="700" fill="#222">Anschlüsse</text>
<text x="160" y="220" font-size="14" fill="#444">z. B. USB</text>
