<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>MAN, Metropolitan Area Network, Netz über eine Stadt oder Region. Vereinfachter Stadtplan mit vier Stadtteilen Nord, Ost, Süd und West. In jedem Stadtteil steht eine Bäckerei-Filiale mit Brezel-Schild. Alle vier Filialen sind miteinander zu einem Netz verbunden.</title>
<defs>
<g id="fil">
<rect x="-48" y="-54" width="96" height="84" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
<path d="M-11,6 C-24,-6 -12,-22 0,-10 C12,-22 24,-6 11,6 M-11,6 L6,-8 M11,6 L-6,-8" fill="none" stroke="#a0662a" stroke-width="4.5" stroke-linecap="round" transform="translate(0,-9)"/>
<rect x="-32" y="0" width="64" height="22" rx="4" fill="#fff4e5" stroke="#E07B00" stroke-width="1.5"/>
<text x="0" y="16" text-anchor="middle" font-size="13" font-weight="700">Filiale</text>
</g>
</defs>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="16" font-weight="700">MAN – Metropolitan Area Network</text>
<text x="200" y="46" text-anchor="middle" font-size="14">Netz über eine Stadt oder Region</text>

<!-- Stadt -->
<rect x="14" y="62" width="372" height="406" rx="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
<g stroke="#dcdcdc" stroke-width="12" fill="none">
<line x1="14" y1="265" x2="386" y2="265"/>
<line x1="200" y1="62" x2="200" y2="468"/>
<circle cx="200" cy="265" r="120"/>
</g>

<!-- Netz zwischen den Filialen -->
<g stroke="#E07B00" stroke-width="4.5" fill="none">
<path d="M200,146 L310,276 L200,406 L90,276 Z"/>
</g>

<use href="#fil" x="200" y="136"/>
<text x="200" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#555">Nord</text>
<use href="#fil" x="310" y="266"/>
<text x="310" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#555">Ost</text>
<use href="#fil" x="200" y="396"/>
<text x="200" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#555">Süd</text>
<use href="#fil" x="90" y="266"/>
<text x="90" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#555">West</text>
</svg>
