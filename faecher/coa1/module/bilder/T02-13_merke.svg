<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, sans-serif" fill="#222">
<title>Merkbild Netzteil und USV: Netzteil macht aus 230 V Wechselspannung 3,3 V, 5 V und 12 V Gleichspannung. Nie öffnen, lebensgefährlich, immer komplett tauschen. Am effizientesten bei 40 bis 80 Prozent Last, 80 PLUS ist das Siegel für sparsame Netzteile. USV überbrückt einen Stromausfall bis zum Notstrom oder zum sicheren Herunterfahren. Drei USV-Typen als Treppe: Online = VFI, am saubersten und teuersten; Line-Interactive = VI; Offline = VFD, am günstigsten mit der längsten Umschaltzeit. Je unabhängiger vom Netz, desto sauberer und teurer.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Netzteil und USV: das Wichtigste</text>
<!-- Netzteil -->
<rect x="10" y="40" width="380" height="74" rx="10" fill="#f4f1ee"/>
<text x="22" y="68" font-size="16" font-weight="700">230 V <tspan fill="#3a6ed8" font-size="20">~</tspan></text>
<line x1="96" y1="62" x2="116" y2="62" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="120" y="46" width="80" height="32" rx="4" fill="#3a3f4a"/><text x="160" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Netzteil</text>
<line x1="204" y1="62" x2="224" y2="62" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<text x="230" y="68" font-size="15" font-weight="700">3,3 / 5 / 12 V <tspan fill="#1c6b3c" font-size="18">=</tspan></text>
<text x="22" y="102" font-size="14" fill="#d63c3c"><tspan font-weight="700">Nie öffnen!</tspan> Lebensgefährlich – komplett tauschen</text>
<!-- Effizienz -->
<rect x="10" y="122" width="380" height="74" rx="10" fill="#fdf6dc"/>
<circle cx="44" cy="159" r="24" fill="#d4a000"/><text x="44" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">80</text><text x="44" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PLUS</text>
<text x="80" y="152" font-size="14"><tspan font-weight="700">Siegel</tspan> für sparsame Netzteile</text>
<text x="80" y="178" font-size="14">am effizientesten bei <tspan font-weight="700">40–80 % Last</tspan></text>
<!-- USV -->
<rect x="10" y="204" width="380" height="96" rx="10" fill="#e3f0e9"/>
<text x="22" y="228" font-size="16" font-weight="700" fill="#1c6b3c">USV überbrückt Stromausfall</text>
<text x="22" y="254" font-size="14">… bis der <tspan font-weight="700">Notstrom</tspan> anspringt, oder</text>
<text x="22" y="280" font-size="14">… bis zum <tspan font-weight="700">sicheren Herunterfahren</tspan></text>
<!-- Treppe -->
<text x="22" y="330" font-size="15" font-weight="700">Drei USV-Typen</text>
<g font-weight="700" text-anchor="middle">
<rect x="22" y="400" width="110" height="70" rx="6" fill="#7fbf96"/><text x="77" y="428" font-size="14">Offline</text><text x="77" y="452" font-size="16" fill="#fff">VFD</text>
<rect x="145" y="372" width="110" height="98" rx="6" fill="#1f9d55"/><text x="200" y="392" font-size="13" fill="#fff">Line-</text><text x="200" y="408" font-size="13" fill="#fff">Interactive</text><text x="200" y="436" font-size="16" fill="#fff">VI</text>
<rect x="268" y="344" width="110" height="126" rx="6" fill="#1c6b3c"/><text x="323" y="370" font-size="14" fill="#fff">Online</text><text x="323" y="396" font-size="16" fill="#fff">VFI</text>
</g>
<text x="77" y="488" text-anchor="middle" font-size="13">am günstigsten,</text><text x="77" y="504" text-anchor="middle" font-size="13">längste Umschaltung</text>
<text x="323" y="488" text-anchor="middle" font-size="13">am saubersten,</text><text x="323" y="504" text-anchor="middle" font-size="13">am teuersten</text>
<text x="22" y="356" font-size="13" fill="#555">je unabhängiger →</text>
</svg>
