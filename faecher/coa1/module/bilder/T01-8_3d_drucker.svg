<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" font-family="system-ui, sans-serif">
  <title>3D-Drucker. Oben läuft ein Kunststoffdraht (Filament) von einer Rolle in die Düse; die Düse schmilzt ihn und legt dünne Schichten auf die Bauplatte. Die Figur wächst Schicht für Schicht, nummeriert 1, 2, 3, 4. Unten der Vorteil: Ein aufgeschnittener Würfel zeigt ein Wabengitter im Inneren, auch innen sind komplexe Formen möglich. Eine Feile mit rotem X: Wer von außen bearbeitet, kommt nicht nach innen.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
  </defs>
  <rect width="400" height="494" fill="#fff"/>

  <text x="200" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#222">3D-Drucker</text>
  <!-- Rahmen -->
  <rect x="30" y="80" width="8" height="200" fill="#9aa3ae"/><rect x="250" y="80" width="8" height="200" fill="#9aa3ae"/>
  <rect x="30" y="80" width="228" height="10" fill="#9aa3ae"/>
  <!-- Filament-Rolle -->
  <circle cx="60" cy="54" r="24" fill="#7fb3e8" stroke="#3a6ed8" stroke-width="2"/>
  <circle cx="60" cy="54" r="15" fill="none" stroke="#3a6ed8" stroke-width="1.5"/>
  <circle cx="60" cy="54" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M60,30 C108,30 124,50 124,84" fill="none" stroke="#3a6ed8" stroke-width="3"/>
  <text x="160" y="48" font-size="13" font-weight="700" fill="#222">Kunststoffdraht (Filament)</text>
  <text x="160" y="64" font-size="13" fill="#222">von der Rolle</text>
  <rect x="112" y="84" width="24" height="40" fill="#3a3f4a"/>
  <path d="M112,124 h24 l-8,12 h-8 z" fill="#3a3f4a"/>
  <path transform="translate(96,126) scale(0.8)" d="M0,0 c-12,0 -16,-12 -10,-22 c2,6 6,8 8,6 c-4,-10 2,-20 10,-26 c-2,10 8,14 8,24 c0,10 -6,18 -16,18 z" fill="#e85d2a"/><path transform="translate(96,126) scale(0.8)" d="M0,-2 c-5,0 -7,-6 -4,-11 c1,3 3,4 4,3 c-1,-5 2,-9 5,-11 c0,5 4,7 4,11 c0,5 -4,8 -9,8 z" fill="#ffd54a"/>
  <text x="150" y="116" font-size="13" font-weight="700" fill="#a32020">Düse schmilzt</text>
  <!-- Figur in Schichten -->
  <g stroke="#3a6ed8" stroke-width="1.5" fill="#7fb3e8">
    <rect x="80" y="236" width="88" height="14"/>
    <rect x="88" y="222" width="72" height="14"/>
    <rect x="96" y="208" width="56" height="14"/>
    <rect x="104" y="194" width="40" height="14" fill="#E07B00" stroke="#b35f00"/>
  </g>
  <line x1="124" y1="140" x2="124" y2="190" stroke="#E07B00" stroke-width="2" stroke-dasharray="4 3"/>
  <g font-size="13" font-weight="700" fill="#222"><text x="176" y="248">1</text><text x="168" y="234">2</text><text x="160" y="220">3</text><text x="152" y="206">4 …</text></g>
  <rect x="50" y="250" width="200" height="10" fill="#555"/>
  <text x="150" y="278" text-anchor="middle" font-size="13" fill="#222">Bauplatte</text>
  <text x="268" y="210" font-size="14" font-weight="700" fill="#b35f00">Schicht für</text>
  <text x="268" y="228" font-size="14" font-weight="700" fill="#b35f00">Schicht</text>

  <!-- innen komplex -->
  <rect x="8" y="296" width="384" height="190" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <text x="22" y="322" font-size="15" font-weight="700" fill="#222">Vorteil</text>
  <!-- Feile -->
  <g transform="rotate(-30 90 400)">
    <rect x="40" y="394" width="80" height="12" rx="2" fill="#9aa3ae"/>
    <g stroke="#666" stroke-width="1"><line x1="46" y1="394" x2="42" y2="406"/><line x1="56" y1="394" x2="52" y2="406"/><line x1="66" y1="394" x2="62" y2="406"/><line x1="76" y1="394" x2="72" y2="406"/><line x1="86" y1="394" x2="82" y2="406"/><line x1="96" y1="394" x2="92" y2="406"/><line x1="106" y1="394" x2="102" y2="406"/></g>
    <rect x="120" y="392" width="34" height="16" rx="5" fill="#8a5a2b"/>
  </g>
  <path d="M74,368 l32,32 M106,368 l-32,32" stroke="#d63c3c" stroke-width="5" stroke-linecap="round"/>
  <text x="96" y="446" text-anchor="middle" font-size="13" fill="#a32020" font-weight="700">von außen bearbeiten:</text>
  <text x="96" y="462" text-anchor="middle" font-size="13" fill="#a32020" font-weight="700">kommt nicht nach innen</text>
  <!-- aufgeschnittener Würfel -->
  <rect x="254" y="356" width="104" height="80" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M254,356 l18,-18 h104 l-18,18 z" fill="#e5e7eb" stroke="#333" stroke-width="2"/>
  <path d="M358,356 l18,-18 v80 l-18,18 z" fill="#d1d5db" stroke="#333" stroke-width="2"/>
  <polygon points="275.8,376.5 268.0,381.0 260.2,376.5 260.2,367.5 268.0,363.0 275.8,367.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="297.8,376.5 290.0,381.0 282.2,376.5 282.2,367.5 290.0,363.0 297.8,367.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="319.8,376.5 312.0,381.0 304.2,376.5 304.2,367.5 312.0,363.0 319.8,367.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="341.8,376.5 334.0,381.0 326.2,376.5 326.2,367.5 334.0,363.0 341.8,367.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="286.8,395.5 279.0,400.0 271.2,395.5 271.2,386.5 279.0,382.0 286.8,386.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="308.8,395.5 301.0,400.0 293.2,395.5 293.2,386.5 301.0,382.0 308.8,386.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="330.8,395.5 323.0,400.0 315.2,395.5 315.2,386.5 323.0,382.0 330.8,386.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="352.8,395.5 345.0,400.0 337.2,395.5 337.2,386.5 345.0,382.0 352.8,386.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="275.8,414.5 268.0,419.0 260.2,414.5 260.2,405.5 268.0,401.0 275.8,405.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="297.8,414.5 290.0,419.0 282.2,414.5 282.2,405.5 290.0,401.0 297.8,405.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="319.8,414.5 312.0,419.0 304.2,414.5 304.2,405.5 312.0,401.0 319.8,405.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="341.8,414.5 334.0,419.0 326.2,414.5 326.2,405.5 334.0,401.0 341.8,405.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="286.8,433.5 279.0,438.0 271.2,433.5 271.2,424.5 279.0,420.0 286.8,424.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="308.8,433.5 301.0,438.0 293.2,433.5 293.2,424.5 301.0,420.0 308.8,424.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="330.8,433.5 323.0,438.0 315.2,433.5 315.2,424.5 323.0,420.0 330.8,424.5" fill="none" stroke="#E07B00" stroke-width="2"/><polygon points="352.8,433.5 345.0,438.0 337.2,433.5 337.2,424.5 345.0,420.0 352.8,424.5" fill="none" stroke="#E07B00" stroke-width="2"/>
  <text x="300" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#1c6b3c">auch innen</text>
  <text x="300" y="476" text-anchor="middle" font-size="13" font-weight="700" fill="#1c6b3c">komplexe Formen</text>
</svg>
