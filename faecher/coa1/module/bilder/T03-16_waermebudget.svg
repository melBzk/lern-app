<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ein Wärme-Budget für alle Kerne. Rechts eine senkrechte Skala wie ein Thermometer: Abwärme der CPU in Watt. Grün 0 bis 100 W: die meisten Standard-CPUs. Gelb 100 bis 140 W: Highend-CPUs rutschen leicht in den kritischen Bereich, ein Pfeil zeigt nach oben in die rote Zone. Rot über 140 W: schwer zu kühlen, Fehler bei Dauer-Volllast. Links ein Prozessor mit 4 Kernen: zwei schlafen (grau, Zzz), zwei laufen im Turbo (orange). Alle Kerne zusammen haben das gleiche Budget, nur anders verteilt.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Ein Wärme-Budget für alle Kerne</text>

<!-- Skala: 0 W = y440, 2 px pro W -->
<text x="396" y="62" font-size="14" font-weight="700" text-anchor="end">Abwärme der CPU in Watt</text>
<rect x="250" y="80" width="30" height="80" fill="#c62828"/>
<rect x="250" y="160" width="30" height="80" fill="#f2c200"/>
<rect x="250" y="240" width="30" height="200" fill="#2e7d32"/>
<rect x="250" y="80" width="30" height="360" fill="none" stroke="#555" stroke-width="2"/>
<circle cx="265" cy="458" r="20" fill="#2e7d32" stroke="#555" stroke-width="2"/>
<g font-size="13" text-anchor="end" font-weight="700">
<text x="244" y="164">140</text><text x="244" y="244">100</text><text x="244" y="444">0</text>
</g>
<line x1="246" y1="160" x2="284" y2="160" stroke="#222" stroke-width="2"/>
<line x1="246" y1="240" x2="284" y2="240" stroke="#222" stroke-width="2"/>
<!-- Pfeil gelb -> rot -->
<line x1="265" y1="230" x2="265" y2="140" stroke="#222" stroke-width="3" marker-end="url(#k)"/>

<g font-size="13">
<text x="290" y="100" font-weight="700" fill="#c62828">über 140 W</text>
<text x="290" y="116">schwer zu kühlen:</text>
<text x="290" y="132">Fehler bei</text>
<text x="290" y="148">Dauer-Volllast</text>
<text x="290" y="178" font-weight="700" fill="#8a6d00">100–140 W</text>
<text x="290" y="195">Highend-CPUs</text>
<text x="290" y="210">rutschen leicht</text>
<text x="290" y="225">in den kritischen</text>
<text x="290" y="240">Bereich</text>
<text x="290" y="262" font-weight="700" fill="#2e7d32">0–100 W</text>
<text x="290" y="278">die meisten</text>
<text x="290" y="294">Standard-CPUs</text>
</g>

<!-- CPU mit 4 Kernen -->
<text x="108" y="106" font-size="15" text-anchor="middle" font-weight="700">CPU mit 4 Kernen</text>
<rect x="16" y="116" width="184" height="190" rx="8" fill="#555"/>
<rect x="26" y="126" width="78" height="80" rx="6" fill="#E07B00"/>
<text x="65" y="160" text-anchor="middle" font-weight="700" fill="#fff">Kern 1</text>
<text x="65" y="182" text-anchor="middle" font-weight="700" fill="#fff">Turbo</text>
<rect x="112" y="126" width="78" height="80" rx="6" fill="#E07B00"/>
<text x="151" y="160" text-anchor="middle" font-weight="700" fill="#fff">Kern 2</text>
<text x="151" y="182" text-anchor="middle" font-weight="700" fill="#fff">Turbo</text>
<rect x="26" y="216" width="78" height="80" rx="6" fill="#d9d9d9"/>
<text x="65" y="250" text-anchor="middle" font-weight="700" fill="#555">Kern 3</text>
<text x="65" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#555">Zzz</text>
<rect x="112" y="216" width="78" height="80" rx="6" fill="#d9d9d9"/>
<text x="151" y="250" text-anchor="middle" font-weight="700" fill="#555">Kern 4</text>
<text x="151" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#555">Zzz</text>

<line x1="202" y1="330" x2="244" y2="330" stroke="#222" stroke-width="3" marker-end="url(#k)"/>
<path d="M108,310 L108,330 L202,330" fill="none" stroke="#222" stroke-width="3"/>
<text x="16" y="360" font-size="15" font-weight="700">zusammen:</text>
<text x="16" y="380" font-size="15" font-weight="700" fill="#E07B00">gleiches Budget,</text>
<text x="16" y="400" font-size="15" font-weight="700" fill="#E07B00">anders verteilt</text>
<text x="16" y="430" font-size="13" fill="#444">Schlafende Kerne machen</text>
<text x="16" y="447" font-size="13" fill="#444">Platz für den Turbo.</text>
</svg>
