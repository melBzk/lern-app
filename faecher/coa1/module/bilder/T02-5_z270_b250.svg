<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, sans-serif" fill="#222">
<title>Zwei Intel-Chipsätze im Vergleich, Beispiel aus dem Buch: Z270 erlaubt Übertakten (grüner Haken), B250 nicht (rotes X). Unten: Auch die Zahl der USB-, PCIe- und M.2-Anschlüsse hängt vom Chipsatz ab.</title>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">Der Chipsatz entscheidet mit</text>
<!-- Z270 -->
<rect x="10" y="46" width="186" height="170" rx="10" fill="#eef8f0" stroke="#2e9d5b" stroke-width="2"/>
<rect x="68" y="62" width="70" height="56" rx="4" fill="#333"/>
<text x="103" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Z270</text>
<path d="M84,150 L98,164 L122,136" fill="none" stroke="#2e9d5b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="103" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1f7a45">Übertakten: ja</text>
<!-- B250 -->
<rect x="204" y="46" width="186" height="170" rx="10" fill="#fdeeee" stroke="#d43c3c" stroke-width="2"/>
<rect x="262" y="62" width="70" height="56" rx="4" fill="#333"/>
<text x="297" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B250</text>
<g stroke="#d43c3c" stroke-width="6" stroke-linecap="round"><line x1="283" y1="136" x2="311" y2="164"/><line x1="311" y1="136" x2="283" y2="164"/></g>
<text x="297" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#d43c3c">Übertakten: nein</text>
<!-- Anschluesse -->
<rect x="10" y="230" width="380" height="118" rx="10" fill="#f4f1ee"/>
<text x="200" y="256" text-anchor="middle" font-size="15" font-weight="700">Auch die Zahl der Anschlüsse</text>
<g text-anchor="middle" font-size="15" font-weight="700">
<rect x="30" y="272" width="100" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><text x="80" y="298">USB</text>
<rect x="150" y="272" width="100" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><text x="200" y="298">PCIe</text>
<rect x="270" y="272" width="100" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2"/><text x="320" y="298">M.2</text>
</g>
<text x="200" y="334" text-anchor="middle" font-size="13">hängt vom Chipsatz ab</text>
</svg>
