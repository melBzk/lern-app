<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Stark vereinfachter Schnitt durch eine Flash-Speicherzelle, einen Transistor. Unten der Halbleiter mit zwei Anschlüssen. Darüber Isolierung, darin das Floating Gate, rundum von Isolierung eingeschlossen wie in einem Käfig. Darüber das Steuer-Gate. Darunter zwei Varianten: links viele Elektronen im Floating Gate, die Ladung ist eingesperrt; rechts keine Ladung. Beim Auslesen ergibt das 0 oder 1. Das bleibt auch ohne Strom erhalten, zum Beispiel wenn der Stecker gezogen ist.</title>
<rect width="400" height="620" fill="#fff"/>
<text x="200" y="28" font-size="17" font-weight="700" text-anchor="middle">Floating Gate – Elektronen im Käfig</text>
<text x="200" y="50" font-size="13" text-anchor="middle" fill="#555">eine Speicherzelle (Transistor), stark vereinfacht</text>

<!-- Grosse beschriftete Zelle -->
<!-- Anschluesse -->
<line x1="40" y1="200" x2="40" y2="176" stroke="#555" stroke-width="3"/><circle cx="40" cy="172" r="5" fill="#555"/>
<line x1="190" y1="200" x2="190" y2="176" stroke="#555" stroke-width="3"/><circle cx="190" cy="172" r="5" fill="#555"/>
<!-- Halbleiter -->
<rect x="20" y="200" width="190" height="56" rx="4" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<!-- Isolierung (Kaefig) -->
<rect x="60" y="114" width="110" height="86" fill="#fff3d6" stroke="#b8860b" stroke-width="2"/>
<!-- Floating Gate -->
<rect x="74" y="130" width="82" height="44" rx="3" fill="#fdecea" stroke="#c62828" stroke-width="3"/>
<g fill="#fff" stroke="#c62828" stroke-width="1.5">
<circle cx="90" cy="152" r="7"/><circle cx="115" cy="152" r="7"/><circle cx="140" cy="152" r="7"/>
</g>
<g stroke="#c62828" stroke-width="2"><line x1="86" y1="152" x2="94" y2="152"/><line x1="111" y1="152" x2="119" y2="152"/><line x1="136" y1="152" x2="144" y2="152"/></g>
<!-- Steuer-Gate -->
<rect x="60" y="78" width="110" height="36" rx="3" fill="#555"/>

<!-- Beschriftungen rechts -->
<line x1="172" y1="96" x2="226" y2="96" stroke="#222" stroke-width="1.2"/>
<text x="230" y="101">Steuer-Gate</text>
<line x1="158" y1="150" x2="226" y2="140" stroke="#c62828" stroke-width="1.5"/>
<text x="230" y="137" font-weight="700" fill="#c62828">Floating Gate</text>
<text x="230" y="154" font-size="13" fill="#c62828">„schwebend“</text>
<line x1="168" y1="190" x2="226" y2="184" stroke="#222" stroke-width="1.2"/>
<text x="230" y="182">Isolierung</text>
<text x="230" y="199" font-size="13" fill="#444">rundum = Käfig</text>
<line x1="210" y1="232" x2="226" y2="232" stroke="#222" stroke-width="1.2"/>
<text x="230" y="237">Halbleiter</text>
<text x="230" y="254" font-size="13" fill="#444">mit 2 Anschlüssen</text>

<line x1="10" y1="282" x2="390" y2="282" stroke="#ddd" stroke-width="1.5"/>

<!-- Zwei Varianten -->
<!-- links: geladen -->
<rect x="30" y="306" width="140" height="22" rx="3" fill="#555"/>
<rect x="30" y="328" width="140" height="70" fill="#fff3d6" stroke="#b8860b" stroke-width="2"/>
<rect x="44" y="340" width="112" height="46" rx="3" fill="#fdecea" stroke="#c62828" stroke-width="3"/>
<g fill="#fff" stroke="#c62828" stroke-width="1.5">
<circle cx="60" cy="353" r="6"/><circle cx="80" cy="353" r="6"/><circle cx="100" cy="353" r="6"/><circle cx="120" cy="353" r="6"/><circle cx="140" cy="353" r="6"/>
<circle cx="70" cy="373" r="6"/><circle cx="90" cy="373" r="6"/><circle cx="110" cy="373" r="6"/><circle cx="130" cy="373" r="6"/>
</g>
<g stroke="#c62828" stroke-width="2">
<line x1="57" y1="353" x2="63" y2="353"/><line x1="77" y1="353" x2="83" y2="353"/><line x1="97" y1="353" x2="103" y2="353"/><line x1="117" y1="353" x2="123" y2="353"/><line x1="137" y1="353" x2="143" y2="353"/>
<line x1="67" y1="373" x2="73" y2="373"/><line x1="87" y1="373" x2="93" y2="373"/><line x1="107" y1="373" x2="113" y2="373"/><line x1="127" y1="373" x2="133" y2="373"/>
</g>
<rect x="20" y="398" width="160" height="34" rx="4" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<text x="100" y="456" text-anchor="middle" font-weight="700" fill="#c62828">Ladung eingesperrt</text>
<text x="100" y="474" text-anchor="middle" font-size="13" fill="#444">viele Elektronen</text>

<!-- rechts: leer -->
<rect x="230" y="306" width="140" height="22" rx="3" fill="#555"/>
<rect x="230" y="328" width="140" height="70" fill="#fff3d6" stroke="#b8860b" stroke-width="2"/>
<rect x="244" y="340" width="112" height="46" rx="3" fill="#fff" stroke="#c62828" stroke-width="3"/>
<rect x="220" y="398" width="160" height="34" rx="4" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<text x="300" y="456" text-anchor="middle" font-weight="700">keine Ladung</text>
<text x="300" y="474" text-anchor="middle" font-size="13" fill="#444">leer</text>

<!-- Ergebnis -->
<rect x="10" y="494" width="380" height="114" rx="10" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="24" y="522" font-weight="700">ergibt beim Auslesen</text>
<text x="24" y="544" font-weight="700" fill="#3a6ed8" font-size="16">0 oder 1</text>
<text x="24" y="570">bleibt <tspan font-weight="700">ohne Strom</tspan> erhalten</text>
<text x="24" y="592" font-size="13" fill="#444">= nichtflüchtig</text>
<!-- Stecker gezogen mit Haekchen -->
<rect x="268" y="530" width="26" height="30" rx="4" fill="#555"/>
<line x1="275" y1="530" x2="275" y2="516" stroke="#555" stroke-width="4"/>
<line x1="287" y1="530" x2="287" y2="516" stroke="#555" stroke-width="4"/>
<path d="M281,560 C281,570 272,572 262,572" fill="none" stroke="#555" stroke-width="3"/>
<rect x="306" y="522" width="22" height="40" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<circle cx="317" cy="535" r="2.5" fill="#555"/><circle cx="317" cy="549" r="2.5" fill="#555"/>
<path d="M342,546 l9,9 l18,-20" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="318" y="590" text-anchor="middle" font-size="13" fill="#444">Stecker gezogen</text>
</svg>
