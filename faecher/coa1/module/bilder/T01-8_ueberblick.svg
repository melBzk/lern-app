  <rect x="314" y="236" width="32" height="12" fill="#7fb3e8" stroke="#3a6ed8"/>
  <rect x="318" y="224" width="24" height="12" fill="#7fb3e8" stroke="#3a6ed8"/>
  <rect x="322" y="212" width="16" height="12" fill="#7fb3e8" stroke="#3a6ed8"/>
  <rect x="300" y="248" width="60" height="8" fill="#555"/>
  <text x="330" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#222">3D-Drucker</text>
  <text x="330" y="296" text-anchor="middle" font-size="13" fill="#222">Schicht für</text>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#222">Schicht</text>
  <!-- Fußzeile -->
  <rect x="8" y="374" width="384" height="62" rx="10" fill="#fdecec" stroke="#d63c3c" stroke-width="2"/>
  <text x="200" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#a32020">Drucker-Einschränkungen:</text>
  <text x="200" y="422" text-anchor="middle" font-size="14" fill="#a32020">Banknoten: viele sperren · Waffen: verboten</text>
