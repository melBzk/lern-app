  <circle cx="91.2" cy="133.1" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="70.0" y1="111.9" x2="70.0" y2="140.0" stroke="#777" stroke-width="2"/>
  <circle cx="70.0" cy="140.0" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
