<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" font-family="system-ui, sans-serif">
  <title>Weitere Drucker aus dem Unterricht in drei Gruppen. Schlagen, also mechanisch: Typenrad und Kugelkopf, der Buchstabe schlägt durch ein Farbband. Hitze aufs Papier: der Thermodrucker für Kassenzettel. Schmelzen: der Wachsdrucker mit bunten Wachsblöcken, die zu Tropfen werden, und der 3D-Drucker, der eine Figur Schicht für Schicht aufbaut. Unten: Drucker-Einschränkungen – Banknoten: viele Drucker sperren den Druck; Waffen aus dem 3D-Drucker sind verboten.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
  </defs>
  <rect width="400" height="444" fill="#fff"/>

