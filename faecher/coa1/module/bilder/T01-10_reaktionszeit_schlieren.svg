<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif">
  <title>Zwei Monitore zeigen einen Ball, der schnell nach rechts fliegt. Links schnelle Reaktionszeit, zum Beispiel 2 Millisekunden: Der Ball ist scharf. Rechts langsame Reaktionszeit, zum Beispiel 16 Millisekunden: Hinter dem Ball zieht eine verwischte graue Spur, Schlieren und Nachleuchten. Unten: Die Reaktionszeit ist die Zeit, in der ein Pixel von Schwarz nach Weiß und zurück nach Schwarz schaltet. Kleiner ist besser.</title>
  <defs>
    <marker id="pg" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="400" height="400" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Reaktionszeit: scharf oder Schlieren</text>

  <!-- Koepfe -->
  <text x="102" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#2e9d5b">schnell</text>
  <text x="102" y="76" text-anchor="middle" font-size="14" fill="#222">z. B. 2 ms</text>
  <text x="298" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#E07B00">langsam</text>
  <text x="298" y="76" text-anchor="middle" font-size="14" fill="#222">z. B. 16 ms</text>

  <!-- Monitor links -->
  <rect x="12" y="86" width="180" height="110" rx="6" fill="#333"/>
  <rect x="20" y="94" width="164" height="94" fill="#1d2a3a"/>
  <rect x="92" y="196" width="20" height="10" fill="#555"/>
  <g stroke="#9fb4d6" stroke-width="2" stroke-linecap="round">
    <line x1="96" y1="134" x2="118" y2="134"/><line x1="102" y1="144" x2="120" y2="144"/><line x1="102" y1="124" x2="120" y2="124"/>
  </g>
  <circle cx="142" cy="134" r="16" fill="#ffd54f" stroke="#fff" stroke-width="2"/>
  <text x="102" y="226" text-anchor="middle" font-size="14" fill="#222">Ball scharf</text>

  <!-- Monitor rechts -->
  <rect x="208" y="86" width="180" height="110" rx="6" fill="#333"/>
  <rect x="216" y="94" width="164" height="94" fill="#1d2a3a"/>
  <rect x="288" y="196" width="20" height="10" fill="#555"/>
  <g fill="#c9c9c9">
    <circle cx="246" cy="134" r="16" opacity="0.12"/>
    <circle cx="264" cy="134" r="16" opacity="0.22"/>
    <circle cx="282" cy="134" r="16" opacity="0.34"/>
    <circle cx="300" cy="134" r="16" opacity="0.48"/>
    <circle cx="318" cy="134" r="16" opacity="0.62"/>
  </g>
  <circle cx="338" cy="134" r="16" fill="#ffd54f" stroke="#fff" stroke-width="2"/>
  <text x="298" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">Schlieren /</text>
  <text x="298" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#E07B00">Nachleuchten</text>
  <line x1="276" y1="212" x2="270" y2="156" stroke="#E07B00" stroke-width="2"/>

  <line x1="10" y1="262" x2="390" y2="262" stroke="#ddd" stroke-width="1"/>

  <!-- Zeitleiste -->
  <text x="200" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Reaktionszeit = ein Pixel schaltet</text>
  <rect x="62" y="302" width="44" height="44" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="178" y="302" width="44" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
  <rect x="294" y="302" width="44" height="44" fill="#111" stroke="#222" stroke-width="2"/>
  <g stroke="#333" stroke-width="2.5" marker-end="url(#pg)">
    <line x1="112" y1="324" x2="170" y2="324"/>
    <line x1="228" y1="324" x2="286" y2="324"/>
  </g>
  <text x="84" y="364" text-anchor="middle" font-size="13" fill="#222">schwarz</text>
  <text x="200" y="364" text-anchor="middle" font-size="13" fill="#222">weiß</text>
  <text x="316" y="364" text-anchor="middle" font-size="13" fill="#222">schwarz</text>
  <text x="200" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#c62828">in ms – kleiner ist besser</text>
</svg>
