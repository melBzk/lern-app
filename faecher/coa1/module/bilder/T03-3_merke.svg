<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Merkbild. Oben die acht Merkmale in drei Gruppen: Tempo (Kerne, Takt und Threads, Turbo und Energiesparen, Cache), Technik (Virtualisierung, Architektur und Busbreite, Befehlssatzerweiterungen), Schutz (Sicherheitsmechanismen). Darunter: Merkmale wirken zusammen, ein Schwachpunkt bremst alles, echte Leistung per Benchmark. Ablesen in Task-Manager, CPU-Z oder Datenblatt. 64 Bit ist Standard: mehr als 4 GB RAM, aber 64-Bit-Treiber nötig. TDP = Abwärme in Watt für die Kühlung.</title>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Das Wichtigste</text>
<text x="200" y="52" text-anchor="middle" font-size="14" fill="#555">8 Merkmale in 3 Gruppen</text>
<rect x="10" y="62" width="124" height="148" rx="10" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="2"/>
<text x="72" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">Tempo</text>
<g font-size="13" text-anchor="middle"><text x="72" y="110">Kerne</text><text x="72" y="132">Takt/Threads</text><text x="72" y="154">Turbo/Sparen</text><text x="72" y="176">Cache</text></g>
<rect x="140" y="62" width="124" height="148" rx="10" fill="#f4f5f7" stroke="#9aa3ad" stroke-width="2"/>
<text x="202" y="86" text-anchor="middle" font-size="15" font-weight="700">Technik</text>
<g font-size="13" text-anchor="middle"><text x="202" y="110">Virtualisierung</text><text x="202" y="132">Architektur/</text><text x="202" y="148">Busbreite</text><text x="202" y="170">Befehlssatz-</text><text x="202" y="186">erweiterungen</text></g>
<rect x="270" y="62" width="120" height="148" rx="10" fill="#e6f4ea" stroke="#2f9e44" stroke-width="2"/>
<text x="330" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#2f9e44">Schutz</text>
<path d="M330,104 l18,7 v13 c0,11 -9,18 -18,22 c-9,-4 -18,-11 -18,-22 v-13 z" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
<g font-size="13" text-anchor="middle"><text x="330" y="168">Sicherheits-</text><text x="330" y="184">mechanismen</text></g>
<rect x="10" y="220" width="380" height="64" rx="10" fill="#fff4e0" stroke="#E07B00" stroke-width="2"/>
<text x="24" y="246" font-size="15" font-weight="700">Wirken zusammen: Schwachpunkt</text>
<text x="24" y="268" font-size="15">bremst alles → <tspan font-weight="700" fill="#c25e00">Benchmark messen</tspan></text>
<rect x="10" y="290" width="380" height="64" rx="10" fill="#f4f5f7"/>
<text x="24" y="316" font-size="15" font-weight="700">Ablesen:</text>
<text x="24" y="338" font-size="15">Task-Manager · CPU-Z · Datenblatt</text>
<rect x="10" y="360" width="380" height="64" rx="10" fill="#f4f5f7"/>
<text x="24" y="386" font-size="15" font-weight="700">64 Bit = Standard</text>
<text x="24" y="408" font-size="15">mehr als 4 GB RAM · 64-Bit-Treiber nötig</text>
<rect x="10" y="430" width="380" height="64" rx="10" fill="#f4f5f7"/>
<path d="M30,482 q-6,-10 0,-20 q6,-10 0,-20 M44,482 q-6,-10 0,-20 q6,-10 0,-20" stroke="#c62828" stroke-width="2.5" fill="none"/>
<text x="64" y="456" font-size="15" font-weight="700">TDP = Abwärme in Watt</text>
<text x="64" y="478" font-size="15">die die Kühlung bewältigen muss</text>
</svg>
