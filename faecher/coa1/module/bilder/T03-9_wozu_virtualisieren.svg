<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Fünf Gründe für Virtualisierung mit Symbol: Testen ohne Risiko, ein Update erst in der VM ausprobieren, dann freigeben. Ausprobieren, z. B. Linux ohne neuen Rechner. Übungsnetz: ein Server und PCs als VMs, gleichzeitig. Sparen: viele Server auf einem echten Host sparen Hardware und Energie. Umziehen: eine VM zieht leicht auf einen stärkeren Rechner um.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="428" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Wozu virtualisieren?</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="63.0" width="60" height="40" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><path d="M18,85.0 V68.0 Q18,63.0 23,63.0 H73 Q78,63.0 78,68.0 V85.0 Z" fill="#3a6ed8" stroke="#3a6ed8" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="79.0" font-size="13" font-weight="700" fill="#fff">VM</text><rect x="38" y="89.0" width="20" height="10" rx="2" fill="#fdebd3" stroke="#E07B00" stroke-width="1.5"/><circle cx="74" cy="99.0" r="9" fill="#2f6b4f" stroke="none" stroke-width="2"/><path d="M69.95,99.0 l2.88,3.2399999999999998 l5.76,-6.4799999999999995" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="79.0" font-size="15" font-weight="700" fill="#1d3f8a">Testen ohne Risiko</text>
<text x="100" y="100.0" font-size="14">Update erst in der VM, dann freigeben</text>
<line x1="15" y1="120" x2="385" y2="120" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="137.0" width="64" height="40" rx="5" fill="#fff" stroke="#2f6b4f" stroke-width="2"/><path d="M16,159.0 V142.0 Q16,137.0 21,137.0 H75 Q80,137.0 80,142.0 V159.0 Z" fill="#2f6b4f" stroke="#2f6b4f" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="153.0" font-size="13" font-weight="700" fill="#fff">VM</text><text x="48" y="171.0" font-size="13" text-anchor="middle" font-weight="700">Linux</text>
<text x="100" y="153.0" font-size="15" font-weight="700" fill="#1d3f8a">Ausprobieren</text>
<text x="100" y="174.0" font-size="14">z. B. Linux – ohne neuen Rechner</text>
<line x1="15" y1="194" x2="385" y2="194" stroke="#ddd" stroke-width="1"/>
<rect x="39" y="207.0" width="18" height="26" rx="2" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><line x1="48" y1="233.0" x2="24" y2="243.0" stroke="#555" stroke-width="2"/><rect x="14" y="241.0" width="20" height="14" rx="2" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/><line x1="48" y1="233.0" x2="72" y2="243.0" stroke="#555" stroke-width="2"/><rect x="62" y="241.0" width="20" height="14" rx="2" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="100" y="227.0" font-size="15" font-weight="700" fill="#1d3f8a">Übungsnetz</text>
<text x="100" y="248.0" font-size="14">Server und PCs als VMs, gleichzeitig</text>
<line x1="15" y1="268" x2="385" y2="268" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="283.0" width="64" height="44" rx="4" fill="#f1f3f5" stroke="#333" stroke-width="2"/><rect x="22" y="291.0" width="15" height="28" rx="2" fill="#3a3f4a" stroke="none" stroke-width="0"/><circle cx="29.5" cy="313.0" r="2" fill="#7fe08a" stroke="none" stroke-width="2"/><rect x="40" y="291.0" width="15" height="28" rx="2" fill="#3a3f4a" stroke="none" stroke-width="0"/><circle cx="47.5" cy="313.0" r="2" fill="#7fe08a" stroke="none" stroke-width="2"/><rect x="58" y="291.0" width="15" height="28" rx="2" fill="#3a3f4a" stroke="none" stroke-width="0"/><circle cx="65.5" cy="313.0" r="2" fill="#7fe08a" stroke="none" stroke-width="2"/>
<text x="100" y="293.0" font-size="15" font-weight="700" fill="#1d3f8a">Sparen</text>
<text x="100" y="313.0" font-size="14">viele Server auf einem Host:</text>
<text x="100" y="331.0" font-size="14">spart Hardware und Energie</text>
<line x1="15" y1="342" x2="385" y2="342" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="373.0" width="20" height="16" rx="2" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/><line x1="40" y1="381.0" x2="54" y2="381.0" stroke="#E07B00" stroke-width="2.5" marker-end="url(#o)"/><rect x="56" y="361.0" width="26" height="36" rx="3" fill="#f1f3f5" stroke="#333" stroke-width="2"/><text x="69" y="385.0" font-size="16" text-anchor="middle" font-weight="700" fill="#2f6b4f">+</text>
<text x="100" y="375.0" font-size="15" font-weight="700" fill="#1d3f8a">Umziehen</text>
<text x="100" y="396.0" font-size="14">VM zieht leicht auf stärkeren Rechner um</text>
<line x1="15" y1="416" x2="385" y2="416" stroke="#ddd" stroke-width="1"/>
</svg>
