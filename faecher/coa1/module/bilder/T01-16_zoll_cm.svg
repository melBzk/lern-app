<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" font-family="system-ui, sans-serif" role="img">
  <title>Zwei Lineale übereinander, oben in Zentimeter von 0 bis 10, unten in Zoll von 0 bis 4. Eine Hilfslinie zeigt: 1 Zoll liegt genau bei 2,54 Zentimeter. Zoll in cm: mal 2,54. Zentimeter in Zoll: geteilt durch 2,54. Darunter ein A4-Blatt: Breite 21,0 cm gleich etwa 8,27 Zoll, Höhe 29,7 cm gleich etwa 11,69 Zoll.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="400" height="530" fill="#fff"/>
  <text x="116" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#e8590c">1 Zoll = 2,54 cm</text>

  <!-- cm-Lineal -->
  <rect x="30" y="74" width="320" height="40" fill="#f6e7b0" stroke="#a08a3a" stroke-width="1.5"/>
  <g stroke="#6b5b20" stroke-width="1.5">
    <line x1="40" y1="74" x2="40" y2="88"/><line x1="70" y1="74" x2="70" y2="88"/><line x1="100" y1="74" x2="100" y2="88"/>
    <line x1="130" y1="74" x2="130" y2="88"/><line x1="160" y1="74" x2="160" y2="88"/><line x1="190" y1="74" x2="190" y2="88"/>
    <line x1="220" y1="74" x2="220" y2="88"/><line x1="250" y1="74" x2="250" y2="88"/><line x1="280" y1="74" x2="280" y2="88"/>
    <line x1="310" y1="74" x2="310" y2="88"/><line x1="340" y1="74" x2="340" y2="88"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="40" y="106">0</text><text x="70" y="106">1</text><text x="100" y="106">2</text><text x="130" y="106">3</text>
    <text x="160" y="106">4</text><text x="190" y="106">5</text><text x="220" y="106">6</text><text x="250" y="106">7</text>
    <text x="280" y="106">8</text><text x="310" y="106">9</text><text x="340" y="106">10</text>
  </g>
  <text x="358" y="100" font-size="14" font-weight="700" fill="#222">cm</text>

  <!-- Zoll-Lineal -->
  <rect x="30" y="136" width="326" height="40" fill="#f6e7b0" stroke="#a08a3a" stroke-width="1.5"/>
  <g stroke="#6b5b20" stroke-width="1.5">
    <line x1="40" y1="176" x2="40" y2="162"/><line x1="116.2" y1="176" x2="116.2" y2="162"/>
    <line x1="192.4" y1="176" x2="192.4" y2="162"/><line x1="268.6" y1="176" x2="268.6" y2="162"/>
    <line x1="344.8" y1="176" x2="344.8" y2="162"/>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="40" y="156">0</text><text x="126" y="156">1</text><text x="192.4" y="156">2</text>
    <text x="268.6" y="156">3</text><text x="344.8" y="156">4</text>
  </g>
  <text x="362" y="161" font-size="14" font-weight="700" fill="#222">Zoll</text>

  <!-- Hilfslinie -->
  <line x1="116.2" y1="64" x2="116.2" y2="186" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Umrechnen -->
  <text x="200" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#222">Zoll → cm: <tspan fill="#3a6ed8">× 2,54</tspan></text>
  <line x1="90" y1="228" x2="310" y2="228" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="200" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#222">cm → Zoll: <tspan fill="#3a6ed8">÷ 2,54</tspan></text>
  <line x1="310" y1="268" x2="90" y2="268" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- A4-Blatt -->
  <text x="190" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#222">21,0 cm ≈ 8,27 Zoll</text>
  <line x1="120" y1="310" x2="260" y2="310" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="120" y="318" width="140" height="198" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="190" y="430" text-anchor="middle" font-size="36" font-weight="700" fill="#adb5bd">A4</text>
  <line x1="274" y1="318" x2="274" y2="516" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="284" y="410" font-size="14" font-weight="700" fill="#222">29,7 cm</text>
  <text x="284" y="428" font-size="14" font-weight="700" fill="#222">≈ 11,69 Zoll</text>
</svg>
