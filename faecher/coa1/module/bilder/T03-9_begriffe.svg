<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die acht neuen Wörter mit Symbol: Virtualisierung, ein Computer per Software nachgebildet. Virtuelle Maschine (VM), nachgebildeter PC mit eigenem Betriebssystem. Host und Gast: Host ist der echte Rechner, Gast die VM. Hypervisor verwaltet VMs, z. B. Hyper-V oder VirtualBox. Intel VT-x bzw. AMD-V: Hilfe für Virtualisierung im Prozessor. Prüfpunkt (Snapshot): gespeicherter Zustand, zurück möglich. Virtuelle Festplatte: eine Datei mit Endung .vhdx. ISO-Datei: ganze DVD in einer Datei.</title>
