<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, sans-serif">
  <title>Drei Tastaturen von oben mit Händen. Erstens die normale Tastatur: Sie ist gerade, die Handgelenke müssen abknicken, rotes Warnzeichen. Zweitens das Natural Keyboard: in der Mitte geteilt, beide Hälften V-förmig gedreht, die Hände bleiben gerade, grüner Haken. Drittens die Mischform: nicht geteilt, aber mit erhöhter Handballenauflage.</title>
  <defs>
    <g id="feld">
      <rect x="-50" y="-30" width="100" height="60" rx="6" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
      <g fill="#fff" stroke="#999">
        <rect x="-44" y="-24" width="12" height="11" rx="2"/><rect x="-29" y="-24" width="12" height="11" rx="2"/><rect x="-14" y="-24" width="12" height="11" rx="2"/><rect x="1" y="-24" width="12" height="11" rx="2"/><rect x="16" y="-24" width="12" height="11" rx="2"/><rect x="31" y="-24" width="12" height="11" rx="2"/>
        <rect x="-44" y="-10" width="12" height="11" rx="2"/><rect x="-29" y="-10" width="12" height="11" rx="2"/><rect x="-14" y="-10" width="12" height="11" rx="2"/><rect x="1" y="-10" width="12" height="11" rx="2"/><rect x="16" y="-10" width="12" height="11" rx="2"/><rect x="31" y="-10" width="12" height="11" rx="2"/>
        <rect x="-44" y="4" width="12" height="11" rx="2"/><rect x="-29" y="4" width="12" height="11" rx="2"/><rect x="-14" y="4" width="12" height="11" rx="2"/><rect x="1" y="4" width="12" height="11" rx="2"/><rect x="16" y="4" width="12" height="11" rx="2"/><rect x="31" y="4" width="12" height="11" rx="2"/>
        <rect x="-44" y="18" width="88" height="8" rx="2"/>
      </g>
    </g>
  </defs>
  <rect width="400" height="500" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Tastaturen, die Hände schonen</text>

  <!-- ===== 1 Normale Tastatur ===== -->
  <g transform="translate(0,40)">
    <rect x="8" y="0" width="384" height="146" rx="10" fill="#fdecec"/>
    <use href="#feld" transform="translate(100,52)"/>
    <use href="#feld" transform="translate(200,52)"/>
    <rect x="148" y="22" width="4" height="60" fill="#f3f4f6"/>
    <rect x="50" y="22" width="200" height="60" rx="6" fill="none" stroke="#555" stroke-width="2"/>
    <!-- Hände: Unterarm schräg, Hand gerade nach oben = Knick -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="78,146 100,112 100,62" stroke="#b57f5a" stroke-width="24"/>
      <polyline points="78,146 100,112 100,62" stroke="#f2c9a5" stroke-width="20"/>
      <polyline points="222,146 200,112 200,62" stroke="#b57f5a" stroke-width="24"/>
      <polyline points="222,146 200,112 200,62" stroke="#f2c9a5" stroke-width="20"/>
    </g>
    <circle cx="100" cy="112" r="15" fill="none" stroke="#d63c3c" stroke-width="3"/>
    <circle cx="200" cy="112" r="15" fill="none" stroke="#d63c3c" stroke-width="3"/>
    <text x="268" y="34" font-size="15" font-weight="700" fill="#222">Normale</text>
    <text x="268" y="52" font-size="15" font-weight="700" fill="#222">Tastatur</text>
    <path d="M282,72 L296,98 H268 Z" fill="#d63c3c"/>
    <text x="282" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">!</text>
    <text x="302" y="84" font-size="13" font-weight="700" fill="#a32020">Handgelenke</text>
    <text x="302" y="100" font-size="13" font-weight="700" fill="#a32020">knicken ab</text>
  </g>

  <!-- ===== 2 Natural Keyboard ===== -->
  <g transform="translate(0,196)">
    <rect x="8" y="0" width="384" height="146" rx="10" fill="#eaf6ee"/>
    <use href="#feld" transform="translate(98,52) rotate(22)"/>
    <use href="#feld" transform="translate(202,52) rotate(-22)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="86,146 100,112 120,62" stroke="#b57f5a" stroke-width="24"/>
      <polyline points="86,146 100,112 120,62" stroke="#f2c9a5" stroke-width="20"/>
      <polyline points="214,146 200,112 180,62" stroke="#b57f5a" stroke-width="24"/>
      <polyline points="214,146 200,112 180,62" stroke="#f2c9a5" stroke-width="20"/>
    </g>
    <text x="268" y="34" font-size="15" font-weight="700" fill="#222">Natural</text>
    <text x="268" y="52" font-size="15" font-weight="700" fill="#222">Keyboard</text>
    <text x="268" y="74" font-size="13" fill="#222">geteilt,</text>
    <text x="268" y="90" font-size="13" fill="#222">V-förmig</text>
    <circle cx="282" cy="114" r="12" fill="#1f9d55"/>
    <path d="M276,114 l4,5 l8,-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="300" y="112" font-size="13" font-weight="700" fill="#16703d">Hände</text>
    <text x="300" y="128" font-size="13" font-weight="700" fill="#16703d">gerade</text>
  </g>

  <!-- ===== 3 Mischform ===== -->
  <g transform="translate(0,352)">
    <rect x="8" y="0" width="384" height="140" rx="10" fill="#f3f4f6"/>
    <use href="#feld" transform="translate(100,48)"/>
    <use href="#feld" transform="translate(200,48)"/>
    <rect x="148" y="18" width="4" height="60" fill="#f3f4f6"/>
    <rect x="50" y="18" width="200" height="60" rx="6" fill="none" stroke="#555" stroke-width="2"/>
    <rect x="56" y="88" width="188" height="30" rx="14" fill="#c9b8a6" stroke="#8a7a60" stroke-width="2"/>
    <text x="268" y="34" font-size="15" font-weight="700" fill="#222">Mischform</text>
    <text x="268" y="54" font-size="13" fill="#222">nicht geteilt,</text>
    <text x="268" y="70" font-size="13" fill="#222">aber mit</text>
    <text x="268" y="98" font-size="13" font-weight="700" fill="#6b5a40">Handballen-</text>
    <text x="268" y="114" font-size="13" font-weight="700" fill="#6b5a40">auflage</text>
    <line x1="264" y1="103" x2="248" y2="103" stroke="#6b5a40" stroke-width="2"/>
  </g>
</svg>
