<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 448" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Fünf Merkzeilen: Der Scanner ist ein Eingabegerät und digitalisiert Papiervorlagen. Bücher scannt der Flachbettscanner, nicht der Einzugsscanner. Die Auflösung steht in dpi – immer die optische vergleichen. TWAIN: jedes TWAIN-Programm mit jedem Scanner. Für Dias und Negative leuchtet eine Durchlichteinheit von hinten.</title>
