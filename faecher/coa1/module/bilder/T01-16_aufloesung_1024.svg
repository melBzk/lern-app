<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Ein Monitor mit der Auflösung 1024 mal 768. Ein Pfeil oben quer: 1024 Punkte nebeneinander in einer Reihe. Ein Pfeil links nach unten: diese Reihe 768-mal untereinander. Darunter die Rechnung 1024 mal 768 gleich 786 432 Bildpunkte und die Regel: Bildpunkte gesamt gleich Breite mal Höhe.</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
</defs>
<rect width="400" height="350" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Auflösung 1024 × 768</text>
<text x="210" y="56" text-anchor="middle" font-size="15" font-weight="700">1024 Punkte nebeneinander</text>
<line x1="80" y1="66" x2="340" y2="66" stroke="#333" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="62" y1="80" x2="62" y2="270" stroke="#333" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="42" y="175" text-anchor="middle" font-size="15" font-weight="700" transform="rotate(-90 42 175)">768 Reihen</text>
<rect x="74" y="74" width="272" height="202" rx="8" fill="#333"/>
<rect x="80" y="80" width="260" height="190" fill="#fff"/>
<rect x="80" y="80" width="260" height="14" fill="#ffe8d6" stroke="#e8590c" stroke-width="2"/>
<g fill="#e8590c"><circle cx="88" cy="87" r="3"/><circle cx="98" cy="87" r="3"/><circle cx="108" cy="87" r="3"/><circle cx="118" cy="87" r="3"/><circle cx="128" cy="87" r="3"/><circle cx="312" cy="87" r="3"/><circle cx="322" cy="87" r="3"/><circle cx="332" cy="87" r="3"/></g>
<text x="220" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#e8590c">1 Reihe</text>
<g stroke="#dee2e6" stroke-width="1.5"><line x1="80" y1="108" x2="340" y2="108"/><line x1="80" y1="122" x2="340" y2="122"/><line x1="80" y1="136" x2="340" y2="136"/><line x1="80" y1="150" x2="340" y2="150"/><line x1="80" y1="242" x2="340" y2="242"/><line x1="80" y1="256" x2="340" y2="256"/></g>
<text x="210" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#999">⋮</text>
<rect x="190" y="276" width="40" height="12" fill="#555"/>
<text x="200" y="316" text-anchor="middle" font-size="21" font-weight="700">1024 × 768 = <tspan fill="#e8590c">786 432</tspan></text>
<text x="200" y="340" text-anchor="middle" font-size="14" fill="#444">Bildpunkte gesamt = Breite × Höhe</text>
</svg>
