<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Die 7 neuen Wörter mit Symbol: Prozessorkern = eigene Recheneinheit, mehrere in einem Gehäuse. Single-Core oder Multi-Core = ein Kern oder mehrere. Thread = Arbeitsstrang eines Programms. Multi-Threading = mehrere Threads gleichzeitig. Hyper-Threading = Intel-Technik, ein Kern meldet sich als zwei. Logischer Prozessor = Kern, wie das Betriebssystem ihn sieht. P-Kern und E-Kern = stark (Performance) und sparsam (Effizienz).</title>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">7 neue Wörter</text>
<g font-size="13">
<rect x="10" y="42" width="380" height="62" rx="10" fill="#f4f5f7"/>
<rect x="24" y="54" width="38" height="38" rx="4" fill="#fff" stroke="#555" stroke-width="2"/><rect x="32" y="62" width="22" height="22" rx="3" fill="#3a6ed8"/>
<text x="74" y="68" font-size="15" font-weight="700">Prozessorkern (Core)</text><text x="74" y="88">eigene Recheneinheit im Prozessor</text>
<rect x="10" y="110" width="380" height="62" rx="10" fill="#f4f5f7"/>
<rect x="24" y="122" width="38" height="38" rx="4" fill="#fff" stroke="#555" stroke-width="2"/><rect x="29" y="127" width="13" height="13" fill="#3a6ed8"/><rect x="44" y="127" width="13" height="13" fill="#3a6ed8"/><rect x="29" y="142" width="13" height="13" fill="#3a6ed8"/><rect x="44" y="142" width="13" height="13" fill="#3a6ed8"/>
<text x="74" y="136" font-size="15" font-weight="700">Single-Core / Multi-Core</text><text x="74" y="156">ein Kern / mehrere Kerne</text>
<rect x="10" y="178" width="380" height="62" rx="10" fill="#f4f5f7"/>
<path d="M24,210 q10,-14 20,0 t20,0" stroke="#E07B00" stroke-width="3" fill="none"/>
<text x="74" y="204" font-size="15" font-weight="700">Thread</text><text x="74" y="224">Arbeitsstrang, Teilaufgabe eines Programms</text>
<rect x="10" y="246" width="380" height="62" rx="10" fill="#f4f5f7"/>
<path d="M24,266 q10,-10 20,0 t20,0 M24,278 q10,-10 20,0 t20,0 M24,290 q10,-10 20,0 t20,0" stroke="#E07B00" stroke-width="2.5" fill="none"/>
<text x="74" y="272" font-size="15" font-weight="700">Multi-Threading</text><text x="74" y="292">mehrere Threads gleichzeitig</text>
<rect x="10" y="314" width="380" height="62" rx="10" fill="#f4f5f7"/>
<rect x="24" y="326" width="38" height="38" rx="4" fill="#3a6ed8"/><path d="M30,338 H56 M30,352 H56" stroke="#fff" stroke-width="3"/>
<text x="74" y="340" font-size="15" font-weight="700">Hyper-Threading (Intel)</text><text x="74" y="360">1 Kern meldet sich als 2</text>
<rect x="10" y="382" width="380" height="62" rx="10" fill="#f4f5f7"/>
<rect x="22" y="396" width="20" height="34" rx="3" fill="#fff" stroke="#3a6ed8" stroke-width="2" stroke-dasharray="4 2"/><rect x="44" y="396" width="20" height="34" rx="3" fill="#fff" stroke="#3a6ed8" stroke-width="2" stroke-dasharray="4 2"/>
<text x="74" y="408" font-size="15" font-weight="700">logischer Prozessor</text><text x="74" y="428">„Kern“, wie das Betriebssystem ihn sieht</text>
<rect x="10" y="450" width="380" height="62" rx="10" fill="#f4f5f7"/>
<rect x="22" y="462" width="22" height="38" rx="3" fill="#E07B00"/><text x="33" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">P</text>
<rect x="48" y="474" width="16" height="26" rx="3" fill="#2f9e44"/><text x="56" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">E</text>
<text x="74" y="476" font-size="15" font-weight="700">P-Kern / E-Kern</text><text x="74" y="496">P = Performance (stark), E = Effizienz (sparsam)</text>
</g>
</svg>
