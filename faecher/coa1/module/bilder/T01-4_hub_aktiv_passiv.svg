<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, sans-serif">
  <title>Aktiver und passiver USB-Hub. Oben der aktive Hub: Er hat ein eigenes Netzteil an der Steckdose. Daran laufen externe Festplatte, Drucker und Maus, alle mit grünem Haken. Unten der passive Hub: kein eigenes Netzteil, der Strom kommt nur über das Kabel vom PC. Maus und Tastatur laufen, grüner Haken. Die externe Festplatte bekommt zu wenig Strom, rotes Kreuz.</title>
  <defs>
    <g id="ok"><circle r="11" fill="#1f9d55"/><path d="M-5.5,0 l4,4.5 l7,-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="nein"><circle r="11" fill="#d63c3c"/><path d="M-5,-5 l10,10 M5,-5 l-10,10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
    <path id="blitz" d="M3,-12 L-6,2 H0 L-3,12 L7,-3 H1 Z" fill="#e0a800" stroke="#9a6b00" stroke-width="1"/>
    <g id="pc">
      <rect x="0" y="0" width="54" height="40" rx="3" fill="#3a3f4a"/>
      <rect x="5" y="5" width="44" height="26" fill="#9db7e8"/>
      <rect x="20" y="40" width="14" height="8" fill="#555"/>
      <rect x="12" y="48" width="30" height="4" rx="2" fill="#555"/>
    </g>
    <g id="hub">
      <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#fff" stroke="#3a6ed8" stroke-width="2.5"/>
      <g fill="#fff" stroke="#3a6ed8"><rect x="-30" y="6" width="12" height="6"/><rect x="-14" y="6" width="12" height="6"/><rect x="2" y="6" width="12" height="6"/><rect x="18" y="6" width="12" height="6"/></g>
    </g>
    <g id="platte"><rect x="-16" y="-12" width="32" height="24" rx="3" fill="#555"/><circle cx="0" cy="0" r="7" fill="#999"/><circle r="2" fill="#555"/></g>
    <g id="drucker"><rect x="-10" y="-16" width="20" height="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="-17" y="-7" width="34" height="18" rx="3" fill="#555"/><rect x="-10" y="5" width="20" height="9" fill="#fff" stroke="#555" stroke-width="1.5"/></g>
    <g id="maus"><rect x="-9" y="-13" width="18" height="26" rx="9" fill="#fff" stroke="#333" stroke-width="2"/><line x1="0" y1="-13" x2="0" y2="-3" stroke="#333" stroke-width="2"/></g>
    <g id="tast"><rect x="-18" y="-10" width="36" height="20" rx="3" fill="#fff" stroke="#333" stroke-width="2"/><g fill="#333"><rect x="-13" y="-6" width="5" height="4"/><rect x="-5" y="-6" width="5" height="4"/><rect x="3" y="-6" width="5" height="4"/><rect x="11" y="-6" width="3" height="4"/><rect x="-8" y="3" width="16" height="3"/></g></g>
  </defs>
  <rect width="400" height="520" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Aktiver oder passiver USB-Hub?</text>

  <!-- ===== Aktiv ===== -->
  <rect x="8" y="40" width="384" height="230" rx="10" fill="#eaf6ee"/>
  <text x="22" y="64" font-size="16" font-weight="700" fill="#16703d">Aktiver Hub</text>
  <!-- Steckdose + Netzteil -->
  <circle cx="160" cy="92" r="16" fill="#fff" stroke="#555" stroke-width="2"/>
  <circle cx="155" cy="92" r="2.5" fill="#333"/><circle cx="165" cy="92" r="2.5" fill="#333"/>
  <rect x="176" y="80" width="26" height="24" rx="4" fill="#3a3f4a"/>
  <use href="#blitz" x="189" y="92" transform="scale(1)"/>
  <path d="M202,92 C226,92 224,150 200,152" fill="none" stroke="#555" stroke-width="3"/>
  <text x="214" y="80" font-size="13" font-weight="700" fill="#16703d">eigenes Netzteil</text>
  <!-- PC -->
  <use href="#pc" x="18" y="140"/>
  <text x="45" y="210" text-anchor="middle" font-size="13" fill="#222">PC</text>
  <line x1="72" y1="160" x2="122" y2="170" stroke="#555" stroke-width="3"/>
  <use href="#hub" x="160" y="170"/>
  <!-- Geräte -->
  <g stroke="#555" stroke-width="2.5" fill="none">
    <path d="M200,170 C230,170 236,110 262,110"/>
    <path d="M200,170 H262"/>
    <path d="M200,170 C230,170 236,230 262,230"/>
  </g>
  <use href="#platte" x="282" y="110"/>
  <use href="#drucker" x="282" y="170"/>
  <use href="#maus" x="282" y="230"/>
  <text x="304" y="106" font-size="13" fill="#222">ext.</text>
  <text x="304" y="121" font-size="13" fill="#222">Festplatte</text>
  <text x="304" y="175" font-size="13" fill="#222">Drucker</text>
  <text x="304" y="235" font-size="13" fill="#222">Maus</text>
  <use href="#ok" x="378" y="114"/>
  <use href="#ok" x="378" y="170"/>
  <use href="#ok" x="378" y="230"/>

  <!-- ===== Passiv ===== -->
  <rect x="8" y="282" width="384" height="230" rx="10" fill="#f3f4f6"/>
  <text x="22" y="306" font-size="16" font-weight="700" fill="#222">Passiver Hub</text>
  <text x="200" y="306" font-size="13" fill="#555">kein eigenes Netzteil</text>
  <use href="#pc" x="18" y="382"/>
  <text x="45" y="452" text-anchor="middle" font-size="13" fill="#222">PC</text>
  <line x1="72" y1="402" x2="122" y2="412" stroke="#555" stroke-width="3"/>
  <use href="#blitz" x="97" y="388"/>
  <text x="96" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6b00">Strom nur</text>
  <text x="96" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6b00">vom PC</text>
  <use href="#hub" x="160" y="412"/>
  <g stroke="#555" stroke-width="2.5" fill="none">
    <path d="M200,412 C230,412 236,352 262,352"/>
    <path d="M200,412 H262"/>
    <path d="M200,412 C230,412 236,472 262,472" stroke-dasharray="5 4"/>
  </g>
  <use href="#maus" x="282" y="352"/>
  <use href="#tast" x="282" y="412"/>
  <use href="#platte" x="282" y="472"/>
  <text x="306" y="357" font-size="13" fill="#222">Maus</text>
  <text x="306" y="417" font-size="13" fill="#222">Tastatur</text>
  <use href="#ok" x="378" y="352"/>
  <use href="#ok" x="378" y="412"/>
  <use href="#nein" x="378" y="472"/>
  <text x="304" y="468" font-size="13" font-weight="700" fill="#a32020">zu wenig</text>
  <text x="304" y="484" font-size="13" font-weight="700" fill="#a32020">Strom</text>
</svg>
