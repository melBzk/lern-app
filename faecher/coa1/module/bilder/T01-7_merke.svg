<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" role="img">
  <title>Merkbild Drucker. Nadeldrucker: laut, kann Durchschlag und Endlospapier. Laserdrucker mit Xerografie: schnell, leise, günstig pro Seite, dokumentenecht, eigener Speicher für die ganze Seite. Tintenstrahldrucker: Kauf günstig, pro Seite teuer, nicht dokumentenecht. CMYK: Cyan, Magenta, Yellow, K gleich Schwarz. Thermosublimation: Fotos in höchster Qualität ohne Dithering, sehr hohe Druckkosten.</title>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Merke: 4 Drucker + CMYK</text>

  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="40" width="384" height="78" rx="10"/>
  <rect x="20" y="54" width="44" height="18" rx="3" fill="#3a3f4a"/>
  <g stroke="#333" stroke-width="3"><line x1="30" y1="72" x2="30" y2="86"/><line x1="42" y1="72" x2="42" y2="86"/><line x1="54" y1="72" x2="54" y2="86"/></g>
  <rect x="16" y="88" width="52" height="5" fill="#fff" stroke="#333"/><rect x="16" y="96" width="52" height="5" fill="#fff" stroke="#333"/>
  <text font-size="15" font-weight="700" fill="#222" x="82" y="64">Nadeldrucker</text>
  <text font-size="13" fill="#333" x="82" y="84">laut</text>
  <text x="82" y="104" font-size="14" font-weight="700" fill="#b35f00">Durchschlag + Endlospapier</text>

  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="126" width="384" height="78" rx="10"/>
  <circle cx="42" cy="165" r="20" fill="#d9dde3" stroke="#555" stroke-width="2"/>
  <line x1="74" y1="138" x2="56" y2="152" stroke="#d63c3c" stroke-width="3"/>
  <text font-size="15" font-weight="700" fill="#222" x="82" y="150">Laserdrucker (Xerografie)</text>
  <text font-size="13" fill="#333" x="82" y="170">schnell · leise · günstig pro Seite</text>
  <text x="82" y="190" font-size="14" font-weight="700" fill="#b35f00">dokumentenecht · eigener RAM</text>

  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="212" width="384" height="78" rx="10"/>
  <rect x="20" y="226" width="44" height="18" rx="3" fill="#3a3f4a"/>
  <circle cx="28" cy="254" r="3.5" fill="#1fa3c9"/><circle cx="38" cy="262" r="3.5" fill="#d6338a"/><circle cx="48" cy="254" r="3.5" fill="#f2c200"/><circle cx="58" cy="262" r="3.5" fill="#111"/>
  <text font-size="15" font-weight="700" fill="#222" x="82" y="236">Tintenstrahldrucker</text>
  <text font-size="13" fill="#333" x="82" y="256">Kauf günstig, aber teuer pro Seite</text>
  <text x="82" y="276" font-size="14" font-weight="700" fill="#a32020">nicht dokumentenecht</text>

  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="298" width="384" height="78" rx="10"/>
  <circle cx="24" cy="326" r="10" fill="#1fa3c9"/><circle cx="46" cy="326" r="10" fill="#d6338a"/><circle cx="24" cy="350" r="10" fill="#f2c200"/><circle cx="46" cy="350" r="10" fill="#111"/>
  <text font-size="15" font-weight="700" fill="#222" x="82" y="322">CMYK</text>
  <text font-size="13" fill="#333" x="82" y="342">Cyan · Magenta · Yellow</text>
  <text x="82" y="362" font-size="14" font-weight="700" fill="#b35f00">K = Schwarz</text>

  <rect fill="#f3f4f6" stroke="#bbb" x="8" y="384" width="384" height="78" rx="10"/>
  <rect x="20" y="396" width="44" height="14" rx="3" fill="#3a3f4a"/>
  <rect x="14" y="414" width="18" height="6" fill="#f2c200"/><rect x="32" y="414" width="18" height="6" fill="#d6338a"/><rect x="50" y="414" width="18" height="6" fill="#1fa3c9"/>
  <rect x="22" y="428" width="40" height="28" fill="#fff" stroke="#333"/><circle cx="42" cy="442" r="8" fill="#d6338a" fill-opacity="0.7"/>
  <text font-size="15" font-weight="700" fill="#222" x="82" y="408">Thermosublimation</text>
  <text font-size="13" fill="#333" x="82" y="428">Fotos in höchster Qualität, ohne Dithering</text>
  <text x="82" y="448" font-size="14" font-weight="700" fill="#a32020">sehr hohe Druckkosten</text>
</svg>
