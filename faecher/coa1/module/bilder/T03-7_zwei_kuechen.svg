<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Küchen als Vergleich. Oben die CISC-Küche: Der Zettel Lasagne ist 1 Befehl; die Chefin schlägt im Ordner Mikrocode nach und diktiert dem Koch viele kleine Schritte: 1. Nudeln, 2. Soße, 3. Schichten. Unten die RISC-Küche: Der Zettel enthält kurze Kommandos schneiden, rühren, backen; der Koch erledigt jedes sofort, es gibt keinen Ordner. Wenige, einfache Kommandos – jedes geht sofort.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker></defs>
<rect width="400" height="540" fill="#fff"/>
<rect x="6" y="36" width="388" height="238" rx="10" fill="#f6f6f6" stroke="#ddd" stroke-width="1.5"/>
<text x="200" y="24" font-size="17" text-anchor="middle" font-weight="700">Zwei Küchen</text>
<text x="200" y="62" font-size="17" text-anchor="middle" font-weight="700" fill="#3a6ed8">CISC-Küche</text>
<rect x="14" y="92" width="78" height="52" rx="0" fill="#fffbe6" stroke="#7a6a48" stroke-width="1.5" transform="rotate(-4 53 118)"/>
<text x="53" y="124" font-size="14" text-anchor="middle" font-weight="700">Lasagne!</text>
<text x="53" y="168" font-size="13" text-anchor="middle" font-weight="700" fill="#3a6ed8">1 Befehl</text>
<line x1="96" y1="114" x2="126" y2="114" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<text x="150" y="88" font-size="13" text-anchor="middle" font-weight="700">Chefin</text>
<circle cx="150" cy="110" r="15" fill="#f0c9a0"/><path d="M118,190 Q118,134 150,134 Q182,134 182,190 Z" fill="#7ea0e8"/>
<rect x="120" y="152" width="64" height="40" rx="3" fill="#b08455" stroke="#6b4f2a" stroke-width="2"/>
<line x1="126" y1="160" x2="178" y2="160" stroke="#fff" stroke-width="1.5"/><line x1="126" y1="168" x2="178" y2="168" stroke="#fff" stroke-width="1.5"/>
<text x="152" y="214" font-size="13" text-anchor="middle" font-weight="700">Ordner „Mikrocode“</text>
<path d="M206,78 H306 Q316,78 316,88 V160 Q316,170 306,170 H206 Q196,170 196,160 V132 L180,122 L196,116 V88 Q196,78 206,78 Z" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
<text x="206" y="104" font-size="14">1. Nudeln …</text>
<text x="206" y="128" font-size="14">2. Soße …</text>
<text x="206" y="152" font-size="14">3. Schichten …</text>
<rect x="342" y="74" width="28" height="16" rx="4" fill="#fff" stroke="#555" stroke-width="1.5"/><circle cx="356" cy="108" r="15" fill="#f0c9a0"/><path d="M324,188 Q324,132 356,132 Q388,132 388,188 Z" fill="#9aa0a6"/>
<text x="356" y="214" font-size="13" text-anchor="middle" font-weight="700">Koch</text>
<text x="200" y="252" font-size="14" text-anchor="middle" font-weight="700" fill="#3a6ed8">1 Auftrag → viele kleine Schritte</text>
<rect x="6" y="288" width="388" height="242" rx="10" fill="#f6f6f6" stroke="#ddd" stroke-width="1.5"/>
<text x="200" y="314" font-size="17" text-anchor="middle" font-weight="700" fill="#2f6b4f">RISC-Küche</text>
<rect x="14" y="334" width="98" height="92" rx="0" fill="#fffbe6" stroke="#7a6a48" stroke-width="1.5"/>
<text x="24" y="358" font-size="14" font-weight="700">schneiden</text>
<text x="24" y="384" font-size="14" font-weight="700">rühren</text>
<text x="24" y="410" font-size="14" font-weight="700">backen</text>
<line x1="116" y1="380" x2="140" y2="380" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="161" y="332" width="28" height="16" rx="4" fill="#fff" stroke="#555" stroke-width="1.5"/><circle cx="175" cy="366" r="15" fill="#f0c9a0"/><path d="M143,446 Q143,390 175,390 Q207,390 207,446 Z" fill="#9aa0a6"/>
<text x="175" y="468" font-size="13" text-anchor="middle" font-weight="700">Koch</text>
<rect x="230" y="352" width="16" height="7" rx="2" fill="#6b4f2a" stroke="none" stroke-width="0"/><path d="M246,352 L276,352 L270,360 L246,360 Z" fill="#aaa" stroke="#666" stroke-width="1"/>
<path d="M282,356 Q300,386 318,356 Z" fill="#bbb" stroke="#666" stroke-width="1.5"/><line x1="306" y1="338" x2="296" y2="364" stroke="#6b4f2a" stroke-width="3"/>
<rect x="334" y="338" width="40" height="34" rx="3" fill="#ddd" stroke="#555" stroke-width="2"/><rect x="340" y="348" width="28" height="16" rx="2" fill="#fff3bf" stroke="#555" stroke-width="1.5"/>
<path d="M245,392 l6,6 l11,-12" fill="none" stroke="#2f6b4f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M292,392 l6,6 l11,-12" fill="none" stroke="#2f6b4f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M346,392 l6,6 l11,-12" fill="none" stroke="#2f6b4f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="254" y="418" width="46" height="30" rx="3" fill="#d9a066" stroke="#6b4f2a" stroke-width="1.5"/>
<line x1="248" y1="412" x2="306" y2="454" stroke="#c62828" stroke-width="3.5"/><line x1="306" y1="412" x2="248" y2="454" stroke="#c62828" stroke-width="3.5"/>
<text x="312" y="440" font-size="13" font-weight="700" fill="#c62828">kein Ordner</text>
<text x="200" y="494" font-size="15" text-anchor="middle" font-weight="700" fill="#E07B00">wenige, einfache Kommandos –</text>
<text x="200" y="516" font-size="15" text-anchor="middle" font-weight="700" fill="#E07B00">jedes geht sofort</text>
</svg>
