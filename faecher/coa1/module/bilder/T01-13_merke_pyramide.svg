<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Merkbild: sechs Balken, von oben nach unten immer breiter, nicht maßstabsgetreu. PAN, ca. 10 m Durchmesser. LAN, ein Gebäude. CAN, Firmengelände. MAN, Stadt oder Region, zum Beispiel Bäckereikette. WAN, weit. GAN, weltweit. Daneben ein Pfeil von klein nach groß. Unten ein orange markierter Kasten: WLAN ist keine eigene Größe, sondern ein LAN per Funk statt Kabel.</title>
<defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker></defs>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Netzgrößen: klein → groß</text>
<line x1="22" y1="50" x2="22" y2="322" stroke="#3a6ed8" stroke-width="3" marker-end="url(#ad)"/>
<text x="30" y="60" font-size="13" font-weight="700" fill="#3a6ed8">klein</text>
<text x="8" y="342" font-size="13" font-weight="700" fill="#3a6ed8">groß</text>
<rect x="140" y="44" width="160" height="40" rx="6" fill="#fde3c3" stroke="#E07B00" stroke-width="2"/>
<text x="220" y="69" text-anchor="middle"><tspan font-weight="700" fill="#a85a00">PAN</tspan> · ca. 10 m</text>
<rect x="125" y="92" width="190" height="40" rx="6" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="220" y="117" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">LAN</tspan> · ein Gebäude</text>
<rect x="105" y="140" width="230" height="40" rx="6" fill="#dbe7fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="220" y="165" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">CAN</tspan> · Firmengelände</text>
<rect x="85" y="188" width="270" height="40" rx="6" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="220" y="213" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">MAN</tspan> · Stadt/Region (Bäckerei)</text>
<rect x="65" y="236" width="310" height="40" rx="6" fill="#dbe7fb" stroke="#3a6ed8" stroke-width="2"/>
<text x="220" y="261" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">WAN</tspan> · weit</text>
<rect x="45" y="284" width="350" height="40" rx="6" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="220" y="309" text-anchor="middle"><tspan font-weight="700" fill="#1d3f8a">GAN</tspan> · weltweit</text>
<rect x="15" y="356" width="370" height="96" rx="10" fill="#fff" stroke="#E07B00" stroke-width="3"/>
<text x="200" y="384" text-anchor="middle" font-size="17" font-weight="700" fill="#a85a00">WLAN = keine Größe!</text>
<text x="200" y="410" text-anchor="middle" font-size="15">sondern eine Technik:</text>
<text x="200" y="434" text-anchor="middle" font-size="15" font-weight="700">ein LAN per Funk statt Kabel</text>
</svg>
