<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, sans-serif" role="img">
<title>Zwei Ketten von links nach rechts. Oben: CPU, dann Grafikkarte mit GPU, dann Kabel, dann Monitor. Unten: CPU, dann Soundkarte, dann Kabel, dann Lautsprecher. CPU und beide Karten liegen im blauen Rahmen Verarbeitung im Gehäuse, Monitor und Lautsprecher im orangen Rahmen Ausgabe außen.</title>

