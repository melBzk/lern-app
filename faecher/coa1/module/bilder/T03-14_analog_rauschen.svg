<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Oben: digital, eine Treppe mit nur zwei Stufen, 0 und 1. Unten: analog, eine glatte Rampe, stufenlos. Auf der Rampe liegt eine leicht zittrige orange Linie, eine Lupe vergrößert sie: Rauschen sind kleine Störungen, dadurch wird das Ergebnis etwas ungenau.</title>
<rect width="400" height="440" fill="#fff"/>

<!-- digital -->
<rect x="10" y="12" width="380" height="172" rx="10" fill="#f4f5f7"/>
<text x="24" y="38" font-size="16" font-weight="700">digital: nur 0 oder 1</text>
<path d="M60,160 H200 V80 H360" stroke="#3a6ed8" stroke-width="5" fill="none" stroke-linejoin="round"/>
<text x="44" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#3a6ed8">0</text>
<text x="186" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="#3a6ed8">1</text>
<text x="280" y="140" text-anchor="middle" font-size="13" fill="#555">nichts dazwischen</text>

<!-- analog -->
<rect x="10" y="198" width="380" height="232" rx="10" fill="#f4f5f7"/>
<text x="24" y="224" font-size="16" font-weight="700">analog: stufenlos</text>
<path d="M60,370 L340,250 V370 Z" fill="#d0e0fb"/>
<path d="M60,370 L340,250" stroke="#3a6ed8" stroke-width="5" stroke-linecap="round"/>
<path d="M60,367 L67,367 L74,363 L81,362 L88,359 L95,351 L102,347 L109,352 L116,344 L123,340 L130,345 L137,337 L144,337 L151,331 L158,329 L165,322 L172,323 L179,323 L186,316 L193,315 L200,312 L207,303 L214,307 L221,302 L228,296 L235,290 L242,296 L249,289 L256,288 L263,287 L270,282 L277,281 L284,273 L291,274 L298,267 L305,269 L312,266 L319,255 L326,252 L333,250 L340,255" stroke="#E07B00" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
<circle cx="250" cy="290" r="28" fill="none" stroke="#222" stroke-width="3"/>
<path d="M270,310 L290,330" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<text x="24" y="398" font-size="14" font-weight="700" fill="#c25e00">Rauschen = kleine Störungen</text>
<text x="24" y="417" font-size="14" fill="#c25e00">→ Ergebnis etwas ungenau</text>
</svg>
