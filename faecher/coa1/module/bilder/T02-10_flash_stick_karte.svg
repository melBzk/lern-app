<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <title>USB-Stick und SD-Karten mit Röntgenblick: Im USB-Stick stecken Flash-Chip und USB-Stecker in einem, den Strom liefert das Gerät. SD-Karten gibt es als Standard, Mini und Micro, sie brauchen ein Lesegerät. In beiden steckt ein Flash-Chip ohne bewegliche Teile.</title>
  <defs>
    <g id="chip">
      <rect x="0" y="0" width="26" height="26" rx="2" fill="#333" stroke="#d63c3c" stroke-width="2.5"/>
      <path d="M-5,5 h5 M-5,13 h5 M-5,21 h5 M26,5 h5 M26,13 h5 M26,21 h5" stroke="#333" stroke-width="2"/>
    </g>
  </defs>
  <rect width="400" height="440" fill="#fff"/>

  <!-- USB-Stick (senkrecht) -->
  <rect x="55" y="20" width="44" height="46" fill="#c9ccd1" stroke="#777" stroke-width="1.5"/>
  <rect x="64" y="30" width="10" height="8" fill="#777"/>
  <rect x="80" y="30" width="10" height="8" fill="#777"/>
  <rect x="40" y="64" width="74" height="176" rx="12" fill="#2e9e5b"/>
  <rect x="52" y="104" width="50" height="66" rx="4" fill="#fff" stroke="#d63c3c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <use href="#chip" x="64" y="124"/>
  <text x="125" y="44" font-size="13" fill="#333">USB-Stecker</text>
  <line x1="123" y1="40" x2="102" y2="40" stroke="#333" stroke-width="1.2"/>

  <!-- SD-Karten -->
  <path d="M180,100 h48 l16,16 v80 h-64 z" fill="#3a3f4a"/>
  <rect x="190" y="126" width="44" height="50" rx="4" fill="#fff" stroke="#d63c3c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <use href="#chip" x="199" y="138"/>
  <path d="M268,138 h32 l10,10 v48 h-42 z" fill="#3a3f4a"/>
  <path d="M332,162 h22 l8,8 v26 h-30 z" fill="#3a3f4a"/>
  <text x="212" y="216" text-anchor="middle" font-size="13">Standard</text>
  <text x="289" y="216" text-anchor="middle" font-size="13">Mini</text>
  <text x="347" y="216" text-anchor="middle" font-size="13">Micro</text>

  <!-- Etiketten -->
  <text x="77" y="272" text-anchor="middle" font-size="16" font-weight="700">USB-Stick</text>
  <text x="77" y="292" text-anchor="middle" font-size="14">Chip + USB-Stecker</text>
  <text x="77" y="309" text-anchor="middle" font-size="14">in einem</text>
  <text x="77" y="332" text-anchor="middle" font-size="14" fill="#1c6b3c">Strom kommt</text>
  <text x="77" y="349" text-anchor="middle" font-size="14" fill="#1c6b3c">vom Gerät</text>

  <text x="280" y="272" text-anchor="middle" font-size="16" font-weight="700">SD-Karte</text>
  <text x="280" y="292" text-anchor="middle" font-size="14">Standard, Mini-SD,</text>
  <text x="280" y="309" text-anchor="middle" font-size="14">Micro-SD</text>
  <text x="280" y="332" text-anchor="middle" font-size="14" fill="#1c6b3c">braucht ein</text>
  <text x="280" y="349" text-anchor="middle" font-size="14" fill="#1c6b3c">Lesegerät</text>

  <!-- Hinweis Chip -->
  <rect x="20" y="372" width="360" height="56" rx="10" fill="#fdecec" stroke="#d63c3c" stroke-width="1.5"/>
  <use href="#chip" x="42" y="387"/>
  <text x="90" y="396" font-size="14" font-weight="700" fill="#a32020">Röntgenblick: Flash-Speicher</text>
  <text x="90" y="415" font-size="14">keine beweglichen Teile</text>
</svg>
