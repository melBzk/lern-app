<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" role="img">
  <title>5.1-Surround, Raum von oben gesehen. In der Mitte ein Sofa, auf dem du sitzt. Vier Lautsprecher stehen in den Raumecken: vorne links, vorne rechts, hinten links, hinten rechts. Ein fünfter Lautsprecher steht mittig vorne: Center. Dazu kommt ein Subwoofer für tiefe Töne. 5 Lautsprecher plus 1 Subwoofer ergibt 5.1. Bei 7.1 kommen 2 Lautsprecher dazu.</title>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#222">5.1-Surround – Raum von oben</text>

  <rect x="20" y="50" width="360" height="334" rx="6" fill="#f8f9fa" stroke="#555" stroke-width="2"/>

  <!-- Schallwege -->
  <g stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="47" y1="75" x2="200" y2="262"/>
    <line x1="353" y1="75" x2="200" y2="262"/>
    <line x1="200" y1="75" x2="200" y2="248"/>
    <line x1="47" y1="355" x2="190" y2="272"/>
    <line x1="353" y1="355" x2="210" y2="272"/>
  </g>

  <!-- Lautsprecher -->
  <g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="32" y="62" width="30" height="26" rx="4" fill="#3a3f4a"/><text x="47" y="80">1</text>
    <rect x="185" y="62" width="30" height="26" rx="4" fill="#3a3f4a"/><text x="200" y="80">2</text>
    <rect x="338" y="62" width="30" height="26" rx="4" fill="#3a3f4a"/><text x="353" y="80">3</text>
    <rect x="338" y="342" width="30" height="26" rx="4" fill="#3a3f4a"/><text x="353" y="360">4</text>
    <rect x="32" y="342" width="30" height="26" rx="4" fill="#3a3f4a"/><text x="47" y="360">5</text>
  </g>
  <g font-size="14" fill="#222">
    <text x="32" y="108">vorne links</text>
    <text x="200" y="108" text-anchor="middle" font-weight="700">Center</text>
    <text x="368" y="108" text-anchor="end">vorne rechts</text>
    <text x="32" y="334">hinten links</text>
    <text x="368" y="334" text-anchor="end">hinten rechts</text>
  </g>

  <!-- Subwoofer -->
  <rect x="270" y="138" width="40" height="40" rx="4" fill="#e8590c"/>
  <circle cx="290" cy="158" r="12" fill="#c2410c"/>
  <text x="290" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#e8590c">Subwoofer</text>
  <text x="290" y="215" text-anchor="middle" font-size="13" fill="#444">tiefe Töne</text>

  <!-- Sofa mit Person -->
  <rect x="136" y="256" width="12" height="46" rx="4" fill="#8d6e63"/>
  <rect x="252" y="256" width="12" height="46" rx="4" fill="#8d6e63"/>
  <rect x="146" y="260" width="108" height="28" rx="4" fill="#a1887f"/>
  <rect x="140" y="286" width="120" height="16" rx="6" fill="#8d6e63"/>
  <ellipse cx="200" cy="276" rx="22" ry="10" fill="#3a6ed8"/>
  <circle cx="200" cy="260" r="12" fill="#f2d4b7" stroke="#555" stroke-width="1.5"/>
  <text x="200" y="320" text-anchor="middle" font-size="13" fill="#444">du sitzt hier</text>

  <!-- Formel -->
  <text x="200" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#222">5 Lautsprecher + 1 Subwoofer</text>
  <text x="200" y="434" text-anchor="middle" font-size="20" font-weight="700" fill="#e8590c">= 5.1</text>
  <text x="200" y="460" text-anchor="middle" font-size="14" fill="#444">7.1 = noch 2 Lautsprecher mehr</text>
</svg>
