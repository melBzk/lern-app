<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 504" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Bereiche auf jedem Mainboard: Oben der schnelle Bereich mit Grafikkarte, CPU und Arbeitsspeicher, verbunden durch viele Leitungen. Unten der langsame Bereich mit Festplatte, DVD-Laufwerk, BIOS, USB und Schnittstellen sowie Steckkarten, angebunden mit wenigen Leitungen. Beide Bereiche sind miteinander verbunden. Egal ob Bridge- oder Hub-Architektur: immer zwei Bereiche.</title>
<rect width="400" height="504" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Zwei Bereiche auf dem Mainboard</text>
<rect x="6" y="38" width="388" height="414" rx="10" fill="#2f6b4f"/>

<!-- schneller Bereich -->
<rect x="16" y="48" width="368" height="170" rx="6" fill="#fdebd8" stroke="#e8892b" stroke-width="2"/>
<text x="28" y="74" font-size="15" font-weight="700" fill="#b45f06">SCHNELLER BEREICH</text>
<g fill="#b45f06" transform="translate(326,52)">
<ellipse cx="18" cy="22" rx="14" ry="8"/><circle cx="33" cy="14" r="6"/>
<ellipse cx="32" cy="3" rx="2.5" ry="8" transform="rotate(-12 32 3)"/><ellipse cx="37" cy="3" rx="2.5" ry="8" transform="rotate(10 37 3)"/>
<circle cx="4" cy="19" r="3.5"/><rect x="10" y="27" width="5" height="6" rx="2"/><rect x="24" y="27" width="5" height="6" rx="2"/>
</g>
<g stroke="#b45f06" stroke-width="2.5">
<line x1="120" y1="104" x2="152" y2="104"/><line x1="120" y1="111" x2="152" y2="111"/><line x1="120" y1="118" x2="152" y2="118"/><line x1="120" y1="125" x2="152" y2="125"/><line x1="120" y1="132" x2="152" y2="132"/><line x1="120" y1="139" x2="152" y2="139"/><line x1="120" y1="146" x2="152" y2="146"/><line x1="120" y1="153" x2="152" y2="153"/>
<line x1="248" y1="104" x2="280" y2="104"/><line x1="248" y1="111" x2="280" y2="111"/><line x1="248" y1="118" x2="280" y2="118"/><line x1="248" y1="125" x2="280" y2="125"/><line x1="248" y1="132" x2="280" y2="132"/><line x1="248" y1="139" x2="280" y2="139"/><line x1="248" y1="146" x2="280" y2="146"/><line x1="248" y1="153" x2="280" y2="153"/>
</g>
<rect x="24" y="96" width="96" height="64" rx="5" fill="#fff" stroke="#e8892b" stroke-width="2"/>
<text x="72" y="133" text-anchor="middle" font-size="14" font-weight="700">Grafikkarte</text>
<rect x="152" y="96" width="96" height="64" rx="5" fill="#fff" stroke="#e8892b" stroke-width="2"/>
<text x="200" y="124" text-anchor="middle" font-size="15" font-weight="700">CPU</text>
<text x="200" y="142" text-anchor="middle" font-size="13">(Prozessor)</text>
<rect x="280" y="96" width="96" height="64" rx="5" fill="#fff" stroke="#e8892b" stroke-width="2"/>
<text x="328" y="117" text-anchor="middle" font-size="15" font-weight="700">RAM</text>
<text x="328" y="134" text-anchor="middle" font-size="13">(Arbeits-</text>
<text x="328" y="150" text-anchor="middle" font-size="13">speicher)</text>
<text x="200" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#b45f06">viele Leitungen</text>

<!-- Verbindung -->
<g stroke="#333" stroke-width="2"><line x1="196" y1="160" x2="196" y2="186"/><line x1="204" y1="160" x2="204" y2="186"/><line x1="196" y1="206" x2="196" y2="272"/><line x1="204" y1="206" x2="204" y2="272"/></g>
<text x="212" y="250" font-size="13">Verbindung</text>

<!-- langsamer Bereich -->
<rect x="16" y="226" width="368" height="216" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="28" y="252" font-size="15" font-weight="700" fill="#3a6ed8">LANGSAMER BEREICH</text>
<g transform="translate(330,234)">
<path d="M0,26 H40 Q46,26 44,20" fill="none" stroke="#3a6ed8" stroke-width="4" stroke-linecap="round"/>
<circle cx="22" cy="14" r="12" fill="#3a6ed8"/>
<path d="M22,14 m-6,0 a6,6 0 1,1 6,6 a3,3 0 1,1 -3,-3" fill="none" stroke="#fff" stroke-width="1.8"/>
<line x1="42" y1="20" x2="44" y2="10" stroke="#3a6ed8" stroke-width="2"/><line x1="44" y1="20" x2="49" y2="12" stroke="#3a6ed8" stroke-width="2"/>
</g>
<g stroke="#3a6ed8" stroke-width="1.5" fill="none">
<line x1="79" y1="272" x2="321" y2="272"/>
<line x1="79" y1="272" x2="79" y2="296"/><line x1="200" y1="272" x2="200" y2="296"/><line x1="321" y1="272" x2="321" y2="296"/>
<line x1="139" y1="272" x2="139" y2="366"/><line x1="260" y1="272" x2="260" y2="366"/>
</g>
<g fill="#fff" stroke="#3a6ed8" stroke-width="2">
<rect x="24" y="296" width="110" height="40" rx="5"/><rect x="145" y="296" width="110" height="40" rx="5"/><rect x="266" y="296" width="110" height="40" rx="5"/>
<rect x="24" y="366" width="170" height="40" rx="5"/><rect x="206" y="366" width="170" height="40" rx="5"/>
</g>
<g font-size="13" font-weight="700" text-anchor="middle">
<text x="79" y="321">Festplatte</text><text x="200" y="321">DVD-Laufwerk</text><text x="321" y="321">BIOS</text>
<text x="109" y="391">USB / Schnittstellen</text><text x="291" y="391">Steckkarten</text>
</g>
<text x="200" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6ed8">wenige Leitungen</text>

<text x="200" y="474" text-anchor="middle" font-size="13">Egal ob Bridge- oder Hub-Architektur:</text>
<text x="200" y="494" text-anchor="middle" font-size="15" font-weight="700">immer zwei Bereiche</text>
</svg>
