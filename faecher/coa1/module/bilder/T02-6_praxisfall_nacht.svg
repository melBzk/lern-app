<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="system-ui, sans-serif" fill="#222">
<title>Szene in drei Bildern: 1. Abends wird die Steckerleiste ausgeschaltet. 2. Nachts ist der PC ganz ohne Strom. 3. Morgens zeigt er wieder Datum und Uhrzeit vom Werk, die BIOS-Einstellungen sind weg. Großes Fragezeichen: Warum?</title>
<rect width="400" height="340" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Jeden Morgen dasselbe</text>
<g fill="#f4f1ee"><rect x="10" y="44" width="122" height="200" rx="10"/><rect x="139" y="44" width="122" height="200" rx="10"/><rect x="268" y="44" width="122" height="200" rx="10"/></g>
<g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="30" cy="64" r="12" fill="#D4607A"/><text x="30" y="69">1</text>
<circle cx="159" cy="64" r="12" fill="#D4607A"/><text x="159" y="69">2</text>
<circle cx="288" cy="64" r="12" fill="#D4607A"/><text x="288" y="69">3</text>
</g>
<!-- 1 Steckerleiste aus -->
<rect x="24" y="120" width="94" height="28" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
<g fill="#333"><circle cx="40" cy="134" r="5"/><circle cx="60" cy="134" r="5"/><circle cx="80" cy="134" r="5"/></g>
<rect x="96" y="126" width="16" height="16" rx="2" fill="#d43c3c"/>
<text x="71" y="190" text-anchor="middle" font-size="14" font-weight="700">abends</text>
<text x="71" y="210" text-anchor="middle" font-size="14">Leiste aus</text>
<!-- 2 Nacht -->
<path d="M214,92 a24,24 0 1,0 18,38 a19,19 0 1,1 -18,-38 Z" fill="#3a4a7a"/>
<rect x="184" y="140" width="34" height="20" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="200" y="190" text-anchor="middle" font-size="14" font-weight="700">nachts</text>
<text x="200" y="210" text-anchor="middle" font-size="14">ohne Strom</text>
<!-- 3 Morgens -->
<rect x="284" y="92" width="90" height="62" rx="4" fill="#fff" stroke="#333" stroke-width="2.5"/>
<text x="329" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#d43c3c">Datum, Zeit</text>
<text x="329" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#d43c3c">vom Werk</text>
<text x="329" y="190" text-anchor="middle" font-size="14" font-weight="700">morgens</text>
<text x="329" y="210" text-anchor="middle" font-size="14">Einstellungen</text>
<text x="329" y="228" text-anchor="middle" font-size="14">weg</text>
<!-- Frage -->
<text x="200" y="298" text-anchor="middle" font-size="40" font-weight="700" fill="#D4607A">?</text>
<text x="200" y="326" text-anchor="middle" font-size="15" font-weight="700">Welches Bauteil ist schuld?</text>
</svg>
