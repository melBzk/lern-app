<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Router gleich Verbindung zwischen zwei Netzwerken. Links die Wolke Internet und Provider, verbunden mit dem WAN-Anschluss des Routers (nach außen). Rechts zwei PCs im Heimnetz, verbunden mit dem LAN-Anschluss (nach innen). Ein Doppelpfeil zeigt: Der Router bringt Daten zwischen den zwei Netzen hin und her.</title>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker>
<g id="pc"><rect x="-26" y="0" width="52" height="36" rx="3" fill="#3a3f4a"/><rect x="-22" y="4" width="44" height="28" fill="#dfe9fb"/><rect x="-5" y="36" width="10" height="7" fill="#555"/><rect x="-14" y="43" width="28" height="4" rx="2" fill="#555"/></g>
</defs>
<rect width="400" height="340" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Router = Verbindung</text>
<text x="200" y="47" text-anchor="middle" font-size="17" font-weight="700">zwischen zwei Netzwerken</text>

<!-- Netz 1: Internet -->
<g fill="#dfe9fb">
<circle cx="50" cy="150" r="30"/><circle cx="88" cy="136" r="34"/><circle cx="112" cy="162" r="22"/><circle cx="30" cy="170" r="18"/>
<rect x="30" y="160" width="84" height="28"/>
</g>
<text x="72" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3f8a">Internet /</text>
<text x="72" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1d3f8a">Provider</text>
<text x="72" y="216" text-anchor="middle" font-size="13" fill="#555">Netz 1</text>

<!-- Router -->
<line x1="128" y1="160" x2="146" y2="160" stroke="#333" stroke-width="4"/>
<rect x="154" y="124" width="92" height="72" rx="8" fill="#3a3f4a"/>
<text x="200" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Router</text>
<rect x="144" y="150" width="16" height="20" rx="2" fill="#3a6ed8"/>
<rect x="240" y="150" width="16" height="20" rx="2" fill="#1f9d55"/>
<text x="152" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6ed8">WAN</text>
<text x="248" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1f9d55">LAN</text>
<text x="152" y="216" text-anchor="middle" font-size="13">nach außen</text>
<text x="248" y="216" text-anchor="middle" font-size="13">nach innen</text>

<!-- Netz 2: Heimnetz -->
<g stroke="#333" stroke-width="3" fill="none">
<path d="M256,160 H284 V110 H310"/>
<path d="M284,160 V190 H310"/>
</g>
<use href="#pc" x="340" y="90"/>
<use href="#pc" x="340" y="170"/>
<text x="340" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#1c6b3c">Heimnetz</text>
<text x="340" y="262" text-anchor="middle" font-size="13" fill="#555">Netz 2</text>

<!-- Doppelpfeil -->
<line x1="40" y1="290" x2="360" y2="290" stroke="#E07B00" stroke-width="4.5" marker-start="url(#ao)" marker-end="url(#ao)"/>
<text x="200" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#a85a00">Daten zwischen zwei Netzen</text>
</svg>
