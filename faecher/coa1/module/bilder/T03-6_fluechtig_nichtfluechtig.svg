<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Zwei Spalten. Links flüchtig, mit durchgestrichenem Stecker: Cache (SRAM) und Arbeitsspeicher (DRAM) sind leer – Strom weg = Inhalt weg. Rechts nichtflüchtig, mit Schloss: SSD, USB-Stick oder Speicherkarte (Flash), Festplatte (HDD) und ROM behalten ihre Daten – Strom weg = Inhalt bleibt.</title>
<rect width="400" height="360" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Was passiert ohne Strom?</text>
<!-- linke Spalte: flüchtig -->
<rect x="10" y="40" width="185" height="44" rx="8" fill="#fdeaea" stroke="#c62828" stroke-width="2"/>
<g stroke="#444" stroke-width="2" fill="#bbb">
<rect x="28" y="54" width="18" height="16" rx="3"/>
<line x1="32" y1="54" x2="32" y2="46"/><line x1="42" y1="54" x2="42" y2="46"/>
<path d="M37,70 C37,76 30,78 24,78" fill="none"/>
</g>
<line x1="22" y1="76" x2="52" y2="46" stroke="#c62828" stroke-width="3"/>
<text x="64" y="68" font-size="18" font-weight="700" fill="#c62828">flüchtig</text>
<rect x="10" y="96" width="185" height="92" rx="8" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
<text x="102" y="118" font-size="15" text-anchor="middle" font-weight="700">Cache (SRAM)</text>
<rect x="24" y="128" width="157" height="48" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="102" y="157" font-size="13" text-anchor="middle" fill="#888">– leer –</text>
<rect x="10" y="200" width="185" height="92" rx="8" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
<text x="102" y="222" font-size="14" text-anchor="middle" font-weight="700">Arbeitsspeicher (DRAM)</text>
<rect x="24" y="232" width="157" height="48" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="102" y="261" font-size="13" text-anchor="middle" fill="#888">– leer –</text>
<text x="102" y="320" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">Strom weg =</text>
<text x="102" y="340" font-size="15" text-anchor="middle" font-weight="700" fill="#c62828">Inhalt weg</text>
<!-- rechte Spalte: nichtflüchtig -->
<rect x="205" y="40" width="185" height="44" rx="8" fill="#e3f0e9" stroke="#2f6b4f" stroke-width="2"/>
<path d="M223,58 v-6 a7,7 0 0 1 14,0 v6" fill="none" stroke="#2f6b4f" stroke-width="3"/>
<rect x="219" y="58" width="22" height="18" rx="3" fill="#2f6b4f"/>
<circle cx="230" cy="66" r="2.5" fill="#fff"/>
<text x="250" y="68" font-size="18" font-weight="700" fill="#2f6b4f">nichtflüchtig</text>
<g font-size="13" font-weight="700">
<rect x="205" y="96" width="185" height="40" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
<text x="217" y="121">SSD</text>
<rect x="205" y="144" width="185" height="52" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
<text x="217" y="165">USB-Stick /</text>
<text x="217" y="184">Speicherkarte (Flash)</text>
<rect x="205" y="204" width="185" height="40" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
<text x="217" y="229">Festplatte (HDD)</text>
<rect x="205" y="252" width="185" height="40" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
<text x="217" y="277">ROM</text>
</g>
<g font-size="13" font-weight="700" fill="#2f6b4f" text-anchor="end" font-family="ui-monospace, Consolas, monospace">
<text x="380" y="121">101</text>
<text x="380" y="165">101</text>
<text x="380" y="229">101</text>
<text x="380" y="277">101</text>
</g>
<text x="297" y="320" font-size="15" text-anchor="middle" font-weight="700" fill="#2f6b4f">Strom weg =</text>
<text x="297" y="340" font-size="15" text-anchor="middle" font-weight="700" fill="#2f6b4f">Inhalt bleibt</text>
</svg>
