<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 482" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Was verspricht der Hersteller? Gleiche Aufgabe 3 mal 5 für beide. Links: Die Rechnung 3 mal 5 braucht im normalen Chip einen Haufen kleiner Schalter, ca. 1200 Transistoren. Rechts: Dieselbe Rechnung schafft ein einziges optisches Element, ein kleiner Kristall mit Lichtstrahl. Darunter zwei Sprechblasen: bis 30-mal weniger Energie und bis 50-mal mehr Leistung. Großer Stempel: laut Hersteller, nicht unabhängig bestätigt.</title>
<rect width="400" height="482" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Was verspricht der Hersteller?</text>
<text x="200" y="48" text-anchor="middle" font-size="15" fill="#555">gleiche Aufgabe: 3 × 5</text>
<g transform="translate(0,22)">

<!-- links -->
