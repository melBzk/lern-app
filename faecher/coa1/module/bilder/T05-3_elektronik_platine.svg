<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Ablauf von oben nach unten: 1 Die Köpfe lesen die winzigen Magnete und liefern daraus elektrische Signale. Über ein flexibles Kabel gehen sie zu 2, der Elektronik-Platine (Controller). Sie macht aus den Signalen Daten. Die Platine bekommt Strom vom Netzteil. 3 Über die Schnittstelle gehen die Daten zum Computer. Kleines Bild: Festplatte von unten mit grüner Platine.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Die Platine übersetzt für den Computer</text>

<!-- 1 Köpfe -->
<circle cx="24" cy="70" r="11" fill="#222"/><text x="24" y="75" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
<rect x="44" y="46" width="236" height="52" rx="8" fill="#eceff1" stroke="#555" stroke-width="1.5"/>
<rect x="56" y="62" width="22" height="13" rx="2" fill="#555"/>
<rect x="52" y="80" width="30" height="5" fill="#9fb3cf"/>
<text x="92" y="68" font-weight="700">Köpfe</text>
<text x="92" y="86" font-size="13">lesen Magnete → Signale</text>

<!-- Kabel -->
<line x1="162" y1="98" x2="162" y2="146" stroke="#d9a441" stroke-width="7"/>
<line x1="162" y1="140" x2="162" y2="148" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<text x="176" y="128" font-size="13">flexibles Kabel</text>

<!-- 2 Platine -->
<circle cx="24" cy="176" r="11" fill="#2e7d32"/><text x="24" y="181" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
<rect x="44" y="152" width="236" height="124" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
<text x="162" y="176" text-anchor="middle" font-weight="700" fill="#2e7d32" font-size="15">Elektronik-Platine</text>
<text x="162" y="194" text-anchor="middle" font-weight="700" fill="#2e7d32">(Controller)</text>
<!-- Festplatte von unten -->
<rect x="58" y="206" width="74" height="60" rx="6" fill="#bbb" stroke="#555" stroke-width="1.5"/>
<rect x="64" y="216" width="62" height="40" rx="2" fill="#2e7d32"/>
<rect x="72" y="224" width="16" height="12" fill="#222"/><rect x="96" y="226" width="22" height="8" fill="#222"/>
<g stroke="#a5d6a7" stroke-width="1"><line x1="72" y1="246" x2="118" y2="246"/><line x1="88" y1="230" x2="96" y2="230"/></g>
<text x="142" y="228" font-size="13">macht aus den</text>
<text x="142" y="246" font-size="13" font-weight="700">Signalen Daten</text>

<!-- Strom vom Netzteil -->
<rect x="306" y="188" width="84" height="52" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="348" y="219" text-anchor="middle" font-weight="700">Netzteil</text>
<line x1="306" y1="214" x2="284" y2="214" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<text x="348" y="178" text-anchor="middle" font-weight="700">Strom</text>

<!-- Pfeil -->
<line x1="162" y1="276" x2="162" y2="314" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<text x="176" y="302" font-size="13">Daten</text>

<!-- 3 Schnittstelle -->
<circle cx="24" cy="344" r="11" fill="#222"/><text x="24" y="349" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">3</text>
<rect x="44" y="320" width="236" height="56" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="162" y="344" text-anchor="middle" font-weight="700" fill="#3a6ed8">Schnittstelle</text>
<text x="162" y="364" text-anchor="middle">zum Computer</text>
<!-- PC -->
<rect x="312" y="322" width="70" height="46" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="320" y="330" width="54" height="30" fill="#3a6ed8"/>
<rect x="340" y="368" width="14" height="8" fill="#555"/><rect x="330" y="376" width="34" height="4" fill="#555"/>
<line x1="280" y1="348" x2="306" y2="348" stroke="#222" stroke-width="2.5" marker-end="url(#k)"/>
<text x="347" y="400" text-anchor="middle" font-weight="700">PC</text>
</svg>
