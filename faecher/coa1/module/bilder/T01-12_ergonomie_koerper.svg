<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, sans-serif" role="img">
  <title>Ergonomie: Technik passt sich dem Menschen an. Eine Person sitzt von der Seite gesehen am Schreibtisch. Vier Nummern zeigen auf Körperstellen: 1 Augen und Curved Monitor, entlastet die Augen. 2 Handgelenk und Natural Keyboard, geteilt und V-förmig, schont die Sehnen. 3 Unterarm und Trackball, schont Unterarm und Handgelenk. 4 Rücken und Stuhl-Lehne, gesund sitzen.</title>
  <rect width="400" height="560" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Ergonomie = Technik passt sich</text>
  <text x="200" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="#222">dem Menschen an</text>

  <!-- Stuhl -->
  <path d="M84,150 Q76,200 86,250" fill="none" stroke="#495057" stroke-width="10" stroke-linecap="round"/>
  <rect x="84" y="248" width="92" height="10" rx="4" fill="#495057"/>
  <line x1="128" y1="258" x2="128" y2="304" stroke="#495057" stroke-width="6"/>
  <line x1="96" y1="306" x2="160" y2="306" stroke="#495057" stroke-width="6" stroke-linecap="round"/>
  <circle cx="98" cy="314" r="5" fill="#495057"/><circle cx="158" cy="314" r="5" fill="#495057"/>

  <!-- Tisch -->
  <rect x="200" y="212" width="176" height="10" fill="#c9a27e"/>
  <rect x="360" y="222" width="10" height="100" fill="#c9a27e"/>
  <line x1="190" y1="324" x2="390" y2="324" stroke="#dee2e6" stroke-width="2"/>

  <!-- Person -->
  <line x1="112" y1="244" x2="186" y2="244" stroke="#343a40" stroke-width="18" stroke-linecap="round"/>
  <line x1="186" y1="244" x2="190" y2="318" stroke="#343a40" stroke-width="15" stroke-linecap="round"/>
  <line x1="190" y1="322" x2="212" y2="324" stroke="#343a40" stroke-width="9" stroke-linecap="round"/>
  <line x1="120" y1="142" x2="110" y2="244" stroke="#3a6ed8" stroke-width="22" stroke-linecap="round"/>
  <line x1="124" y1="154" x2="150" y2="204" stroke="#3a6ed8" stroke-width="12" stroke-linecap="round"/>
  <line x1="150" y1="204" x2="218" y2="203" stroke="#3a6ed8" stroke-width="11" stroke-linecap="round"/>
  <circle cx="224" cy="203" r="7" fill="#f2d4b7" stroke="#555" stroke-width="1"/>
  <circle cx="128" cy="118" r="20" fill="#f2d4b7" stroke="#555" stroke-width="2"/>
  <circle cx="140" cy="114" r="2.5" fill="#333"/>

  <!-- Tastatur, Trackball, Monitor -->
  <rect x="214" y="206" width="40" height="6" fill="#868e96"/>
  <ellipse cx="282" cy="209" rx="14" ry="4" fill="#868e96"/>
  <circle cx="282" cy="202" r="7" fill="#3a6ed8"/>
  <path d="M340,112 Q330,150 340,188" fill="none" stroke="#343a40" stroke-width="8" stroke-linecap="round"/>
  <rect x="344" y="146" width="6" height="64" fill="#555"/>
  <rect x="330" y="208" width="36" height="4" fill="#555"/>
  <line x1="143" y1="114" x2="330" y2="150" stroke="#868e96" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Nummern -->
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="236" cy="130" r="11" fill="#e8590c"/><text x="236" y="135">1</text>
    <circle cx="226" cy="182" r="11" fill="#e8590c"/><text x="226" y="187">2</text>
    <circle cx="182" cy="186" r="11" fill="#e8590c"/><text x="182" y="191">3</text>
    <circle cx="58" cy="200" r="11" fill="#e8590c"/><text x="58" y="205">4</text>
  </g>

  <!-- Zeilen -->
  <line x1="10" y1="342" x2="390" y2="342" stroke="#dee2e6" stroke-width="1.5"/>
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="22" cy="372" r="11" fill="#e8590c"/><text x="22" y="377">1</text>
    <circle cx="22" cy="420" r="11" fill="#e8590c"/><text x="22" y="425">2</text>
    <circle cx="22" cy="468" r="11" fill="#e8590c"/><text x="22" y="473">3</text>
    <circle cx="22" cy="516" r="11" fill="#e8590c"/><text x="22" y="521">4</text>
  </g>
  <!-- Icons -->
  <path d="M46,360 Q69,368 92,360 L92,382 Q69,388 46,382 Z" fill="#3a3f4a"/>
  <polygon points="44,414 66,408 68,424 46,430" fill="#868e96"/>
  <polygon points="72,408 94,414 92,430 70,424" fill="#868e96"/>
  <ellipse cx="69" cy="476" rx="20" ry="6" fill="#868e96"/>
  <circle cx="69" cy="466" r="10" fill="#3a6ed8"/>
  <path d="M56,498 Q52,516 58,532 M58,532 H86" fill="none" stroke="#495057" stroke-width="6" stroke-linecap="round"/>
  <!-- Texte -->
  <g fill="#222">
    <text x="106" y="368" font-size="15" font-weight="700">Augen ↔ Curved Monitor</text>
    <text x="106" y="387" font-size="13">entlastet die Augen</text>
    <text x="106" y="416" font-size="15" font-weight="700">Handgelenk ↔ Natural Keyboard</text>
    <text x="106" y="435" font-size="13">geteilt, V-förmig · schont Sehnen</text>
    <text x="106" y="464" font-size="15" font-weight="700">Unterarm ↔ Trackball</text>
    <text x="106" y="483" font-size="13">schont Unterarm und Handgelenk</text>
    <text x="106" y="512" font-size="15" font-weight="700">Rücken ↔ Stuhl-Lehne</text>
    <text x="106" y="531" font-size="13">gesund sitzen</text>
  </g>
</svg>
