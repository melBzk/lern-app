<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" role="img">
  <title>Drei Arten, ein T-Shirt zu bedrucken, und welcher Drucker ähnlich arbeitet. Stempeln, also Farbe aufdrücken: wie der Nadeldrucker. Sprühen mit feiner Düse: wie der Tintenstrahldrucker. Bügelbild mit Hitze und Druck: so endet der Laserdruck. Wo der Vergleich hinkt: Beim Laser entsteht das Bild vorher durch Ladung auf der Trommel.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="400" height="420" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#222">T-Shirt bedrucken – wie ein Drucker</text>
  <g fill="#f3f4f6" stroke="#bbb"><rect x="8" y="42" width="384" height="94" rx="12"/><rect x="8" y="144" width="384" height="94" rx="12"/><rect x="8" y="246" width="384" height="94" rx="12"/></g>

  <rect x="36" y="54" width="20" height="24" rx="8" fill="#8a6a4a"/><rect x="26" y="78" width="40" height="14" rx="2" fill="#3a3f4a"/><rect x="28" y="92" width="36" height="6" fill="#d63c3c"/>
  <rect x="24" y="112" width="44" height="6" fill="#d63c3c" opacity="0.7"/>
  <text x="84" y="84" font-size="15" font-weight="700" fill="#222">Stempeln</text>
  <text x="84" y="104" font-size="13" fill="#333">Farbe aufdrücken</text>
  <line x1="204" y1="90" x2="242" y2="90" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <rect x="250" y="70" width="132" height="40" rx="20" fill="#fff" stroke="#E07B00" stroke-width="2"/>
  <text x="316" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#b35f00">Nadeldrucker</text>

  <rect x="30" y="166" width="26" height="50" rx="5" fill="#3a3f4a"/><rect x="38" y="156" width="10" height="10" fill="#555"/>
  <g fill="#1fa3c9"><circle cx="62" cy="160" r="2.5"/><circle cx="68" cy="155" r="2.5"/><circle cx="70" cy="164" r="2.5"/><circle cx="76" cy="159" r="2.5"/></g>
  <text x="84" y="186" font-size="15" font-weight="700" fill="#222">Sprühen</text>
  <text x="84" y="206" font-size="13" fill="#333">mit feiner Düse</text>
  <line x1="204" y1="192" x2="242" y2="192" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <rect x="250" y="172" width="132" height="40" rx="20" fill="#fff" stroke="#E07B00" stroke-width="2"/>
  <text x="316" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#b35f00">Tintenstrahl</text>

  <path d="M22,310 L72,310 L72,292 Q60,272 34,276 L22,300 z" fill="#3a3f4a"/><rect x="40" y="266" width="26" height="8" rx="4" fill="#555"/>
  <path d="M30,328 q4,-5 0,-10 M44,328 q4,-5 0,-10 M58,328 q4,-5 0,-10" fill="none" stroke="#d63c3c" stroke-width="2"/>
  <text x="84" y="288" font-size="15" font-weight="700" fill="#222">Bügelbild</text>
  <text x="84" y="308" font-size="13" fill="#333">Hitze + Druck</text>
  <line x1="204" y1="294" x2="242" y2="294" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <rect x="250" y="264" width="132" height="58" rx="20" fill="#fff" stroke="#E07B00" stroke-width="2"/>
  <text x="316" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#b35f00">so endet der</text>
  <text x="316" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#b35f00">Laserdruck</text>

  <rect x="8" y="352" width="384" height="60" rx="10" fill="#fdecec" stroke="#d63c3c" stroke-width="2"/>
  <text x="20" y="376" font-size="14" font-weight="700" fill="#a32020">Hinkt: Beim Laser entsteht das Bild vorher</text>
  <text x="20" y="398" font-size="14" fill="#a32020">durch Ladung auf der Trommel.</text>
</svg>
