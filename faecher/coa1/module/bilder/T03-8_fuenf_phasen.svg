<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 544" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die 5 Phasen eines Befehls, jede dauert 1 Takt: 1 Befehl laden, 2 Befehl decodieren (verstehen), 3 Operanden laden – die Zahlen 5 und 3, 4 Ausführen – die ALU rechnet 5 + 3 = 8, 5 Ergebnis zurückspeichern. Hinweis: T02-9 kannte 4 Schritte – hier wird Operanden laden als eigene Phase gezählt.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker></defs>
<rect width="400" height="544" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700">Die 5 Phasen eines Befehls</text>
<rect x="10" y="46" width="380" height="64" rx="10" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="34" cy="78" r="14" fill="#3a6ed8"/><text x="34" y="84" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<line x1="34" y1="96" x2="34" y2="122" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="70" y="60" width="24" height="30" rx="0" fill="#fff" stroke="#333" stroke-width="1.5"/><line x1="75" y1="68" x2="89" y2="68" stroke="#888" stroke-width="1.5"/><line x1="75" y1="75" x2="89" y2="75" stroke="#888" stroke-width="1.5"/><ellipse cx="97" cy="88" rx="11" ry="7" fill="#f0c9a0" stroke="#a0703c" stroke-width="1.5"/>
<text x="122" y="84" font-size="15" font-weight="700">Befehl laden</text>
<rect x="318" y="66" width="62" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="349" y="83" font-size="13" text-anchor="middle" font-weight="700">1 Takt</text>
<rect x="10" y="124" width="380" height="64" rx="10" fill="#ece0f5" stroke="#7b3fa0" stroke-width="2"/>
<circle cx="34" cy="156" r="14" fill="#7b3fa0"/><text x="34" y="162" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<line x1="34" y1="174" x2="34" y2="200" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<circle cx="80" cy="152" r="12" fill="#fff" stroke="#333" stroke-width="3"/><line x1="89" y1="161" x2="100" y2="172" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<text x="122" y="152" font-size="15" font-weight="700">Befehl decodieren</text>
<text x="122" y="172" font-size="13" fill="#444">(verstehen)</text>
<rect x="318" y="144" width="62" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="349" y="161" font-size="13" text-anchor="middle" font-weight="700">1 Takt</text>
<rect x="10" y="202" width="380" height="64" rx="10" fill="#fdebd3" stroke="#E07B00" stroke-width="2"/>
<circle cx="34" cy="234" r="14" fill="#E07B00"/><text x="34" y="240" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<line x1="34" y1="252" x2="34" y2="278" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="62" y="219" width="20" height="30" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="72" y="240" font-size="15" text-anchor="middle" font-weight="700">5</text><rect x="88" y="219" width="20" height="30" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="98" y="240" font-size="15" text-anchor="middle" font-weight="700">3</text>
<text x="122" y="230" font-size="15" font-weight="700">Operanden laden</text>
<text x="122" y="250" font-size="13" fill="#444">die Zahlen 5 und 3</text>
<rect x="318" y="222" width="62" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="349" y="239" font-size="13" text-anchor="middle" font-weight="700">1 Takt</text>
<rect x="10" y="280" width="380" height="64" rx="10" fill="#f9dcdc" stroke="#c62828" stroke-width="2"/>
<circle cx="34" cy="312" r="14" fill="#c62828"/><text x="34" y="318" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<line x1="34" y1="330" x2="34" y2="356" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<path d="M62,298 H80 L85,306 L90,298 H108 L98,326 H72 Z" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
<text x="122" y="308" font-size="15" font-weight="700">Ausführen</text>
<text x="122" y="328" font-size="13" fill="#444">ALU: 5 + 3 = 8</text>
<rect x="318" y="300" width="62" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="349" y="317" font-size="13" text-anchor="middle" font-weight="700">1 Takt</text>
<rect x="10" y="358" width="380" height="64" rx="10" fill="#dcefe4" stroke="#2f6b4f" stroke-width="2"/>
<circle cx="34" cy="390" r="14" fill="#2f6b4f"/><text x="34" y="396" font-size="16" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<rect x="74" y="366" width="20" height="20" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="84" y="382" font-size="14" text-anchor="middle" font-weight="700">8</text><rect x="64" y="388" width="42" height="20" rx="2" fill="#fff" stroke="#333" stroke-width="2"/><line x1="78" y1="398" x2="92" y2="398" stroke="#333" stroke-width="3"/>
<text x="122" y="386" font-size="15" font-weight="700">Ergebnis</text><text x="122" y="406" font-size="15" font-weight="700">zurückspeichern</text>
<rect x="318" y="378" width="62" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="349" y="395" font-size="13" text-anchor="middle" font-weight="700">1 Takt</text>
<rect x="10" y="446" width="380" height="84" rx="10" fill="#fff4ec" stroke="#e8590c" stroke-width="2"/>
<text x="200" y="472" font-size="14" text-anchor="middle">T02-9 kannte 4 Schritte –</text>
<text x="200" y="494" font-size="14" text-anchor="middle" font-weight="700" fill="#e8590c">hier wird ‚Operanden laden‘</text>
<text x="200" y="516" font-size="14" text-anchor="middle">als eigene Phase gezählt</text>
</svg>
