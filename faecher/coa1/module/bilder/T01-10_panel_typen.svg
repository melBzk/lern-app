<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 524" font-family="system-ui, sans-serif">
  <title>Steckbriefe der drei Panel-Typen. TN: günstig, schnell, wenig Strom; passt für Büro, Multimedia und einfache Spiele. IPS: sehr gute Farbtreue, großer Blickwinkel, aber mehr Strom und teurer; passt für Grafik, wenn Farben stimmen müssen. VA: bester Kontrast 3000 zu 1, aber oft langsam, weniger Strom als IPS; passt, wenn Kontrast zählt, weniger für schnelle Spiele. Grün sind die Stärken, orange die Schwächen.</title>
  <rect width="400" height="524" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Panel-Typen: TN, IPS, VA</text>
  <rect x="8" y="44" width="124" height="470" rx="10" fill="#f4f6fa"/>
  <rect x="8" y="44" width="124" height="36" rx="10" fill="#3a6ed8"/>
  <rect x="8" y="66" width="124" height="14" fill="#3a6ed8"/>
  <text x="70" y="69" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">TN</text>
  <circle cx="70" cy="110" r="13" fill="#f2c94c" stroke="#b08a1a" stroke-width="1.5"/><text x="70" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5310">€</text>
  <text x="70" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">günstig</text>
  <rect x="67" y="175" width="6" height="5" fill="#2e9d5b"/><circle cx="70" cy="194" r="13" fill="#fff" stroke="#2e9d5b" stroke-width="2.5"/><line x1="70" y1="194" x2="78" y2="188" stroke="#2e9d5b" stroke-width="2.5"/><g stroke="#2e9d5b" stroke-width="2" stroke-linecap="round"><line x1="40" y1="189" x2="52" y2="189"/><line x1="42" y1="197" x2="52" y2="197"/></g>
  <text x="70" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">schnell</text>
  <rect x="61" y="272" width="18" height="14" rx="3" fill="#2e9d5b"/><line x1="66" y1="272" x2="66" y2="264" stroke="#2e9d5b" stroke-width="3"/><line x1="74" y1="272" x2="74" y2="264" stroke="#2e9d5b" stroke-width="3"/><path d="M70,286 Q70,294 80,292" fill="none" stroke="#2e9d5b" stroke-width="2.5"/>
  <text x="70" y="312" text-anchor="middle" font-size="14" fill="#222">wenig Strom</text>
  <line x1="18" y1="444" x2="122" y2="444" stroke="#ccc" stroke-width="1"/>
  <text x="70" y="464" text-anchor="middle" font-size="13" fill="#555">passt für:</text>
  <text x="70" y="482" text-anchor="middle" font-size="13" fill="#222">Büro, Multimedia,</text><text x="70" y="499" text-anchor="middle" font-size="13" fill="#222">einfache Spiele</text>
  <rect x="138" y="44" width="124" height="470" rx="10" fill="#f4f6fa"/>
  <rect x="138" y="44" width="124" height="36" rx="10" fill="#7b3fa0"/>
  <rect x="138" y="66" width="124" height="14" fill="#7b3fa0"/>
  <text x="200" y="69" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">IPS</text>
  <ellipse cx="200" cy="110" rx="18" ry="13" fill="#f1e6d0" stroke="#8a7350" stroke-width="1.5"/><circle cx="192" cy="106" r="4" fill="#d93a3a"/><circle cx="202" cy="103" r="4" fill="#2e9d5b"/><circle cx="210" cy="109" r="4" fill="#3a6ed8"/><circle cx="197" cy="116" r="3" fill="#fff" stroke="#8a7350"/>
  <text x="200" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">sehr gute</text><text x="200" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">Farbtreue</text>
  <path d="M174,182 L188,194 L174,206" fill="none" stroke="#2e9d5b" stroke-width="2" stroke-dasharray="3 3"/><path d="M188,194 Q202,181 216,194 Q202,207 188,194 Z" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="202" cy="194" r="4" fill="#222"/>
  <text x="200" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">großer</text><text x="200" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">Blickwinkel</text>
  <rect x="191" y="272" width="18" height="14" rx="3" fill="#E07B00"/><line x1="196" y1="272" x2="196" y2="264" stroke="#E07B00" stroke-width="3"/><line x1="204" y1="272" x2="204" y2="264" stroke="#E07B00" stroke-width="3"/><path d="M200,286 Q200,294 210,292" fill="none" stroke="#E07B00" stroke-width="2.5"/>
  <text x="200" y="312" text-anchor="middle" font-size="14" fill="#E07B00">mehr Strom</text>
  <circle cx="191" cy="364" r="13" fill="#f2c94c" stroke="#b08a1a" stroke-width="1.5"/><text x="191" y="369" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5310">€</text><circle cx="209" cy="360" r="13" fill="#f2c94c" stroke="#b08a1a" stroke-width="1.5"/><text x="209" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5310">€</text>
  <text x="200" y="396" text-anchor="middle" font-size="14" fill="#E07B00">teurer</text>
  <line x1="148" y1="444" x2="252" y2="444" stroke="#ccc" stroke-width="1"/>
  <text x="200" y="464" text-anchor="middle" font-size="13" fill="#555">passt für:</text>
  <text x="200" y="482" text-anchor="middle" font-size="13" fill="#222">Grafik, Farben</text><text x="200" y="499" text-anchor="middle" font-size="13" fill="#222">müssen stimmen</text>
  <rect x="268" y="44" width="124" height="470" rx="10" fill="#f4f6fa"/>
  <rect x="268" y="44" width="124" height="36" rx="10" fill="#2f6b4f"/>
  <rect x="268" y="66" width="124" height="14" fill="#2f6b4f"/>
  <text x="330" y="69" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">VA</text>
  <rect x="316" y="96" width="28" height="28" fill="#000" stroke="#222" stroke-width="1.5"/><rect x="330" y="96" width="14" height="28" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="330" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">bester Kontrast</text><text x="330" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">3000:1</text>
  <rect x="327" y="175" width="6" height="5" fill="#E07B00"/><circle cx="330" cy="194" r="13" fill="#fff" stroke="#E07B00" stroke-width="2.5"/><line x1="330" y1="194" x2="323" y2="201" stroke="#E07B00" stroke-width="2.5"/>
  <text x="330" y="228" text-anchor="middle" font-size="14" fill="#E07B00">oft langsam:</text><text x="330" y="245" text-anchor="middle" font-size="14" fill="#E07B00">weniger für</text><text x="330" y="262" text-anchor="middle" font-size="14" fill="#E07B00">schnelle Spiele</text>
  <rect x="321" y="356" width="18" height="14" rx="3" fill="#222"/><line x1="326" y1="356" x2="326" y2="348" stroke="#222" stroke-width="3"/><line x1="334" y1="356" x2="334" y2="348" stroke="#222" stroke-width="3"/><path d="M330,370 Q330,378 340,376" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="330" y="396" text-anchor="middle" font-size="14" fill="#222">weniger Strom</text><text x="330" y="413" text-anchor="middle" font-size="14" fill="#222">als IPS</text>
  <line x1="278" y1="444" x2="382" y2="444" stroke="#ccc" stroke-width="1"/>
  <text x="330" y="464" text-anchor="middle" font-size="13" fill="#555">passt für:</text>
  <text x="330" y="482" text-anchor="middle" font-size="13" fill="#222">wenn Kontrast</text><text x="330" y="499" text-anchor="middle" font-size="13" fill="#222">zählt</text>
</svg>
