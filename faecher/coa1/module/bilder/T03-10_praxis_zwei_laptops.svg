<text x="296" y="280" font-size="17" text-anchor="middle" font-weight="700" fill="#E07B00">3,8 GHz</text>
<text x="296" y="304" font-size="13" text-anchor="middle" fill="#444">anderer Hersteller</text>
<circle cx="200" cy="350" r="18" fill="#E07B00" stroke="none" stroke-width="2"/><text x="200" y="358.1" font-size="23" text-anchor="middle" font-weight="700" fill="#fff">?</text>
