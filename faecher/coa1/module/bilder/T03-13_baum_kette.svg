<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 402" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich Aufbau: USB als Baum mit Hubs, max. 127 Geräte, bis 20 Gbit/s mit USB 3.2. FireWire als Kette, max. 63 Geräte, 400 oder 800 Mbit/s. Thunderbolt als Kette, max. 7 Geräte, bis 40 Gbit/s. USB4 als Baum mit Hubs, 40 Gbit/s. Kasten: USB-C ist nur die Steckerform, darüber kann USB 3.x, USB4 oder Thunderbolt laufen.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="402" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">Baum oder Kette?</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="40" y="58.0" width="16" height="12" rx="2" fill="#3a3f4a" stroke="none" stroke-width="0"/><line x1="48" y1="70.0" x2="26" y2="84.0" stroke="#555" stroke-width="2"/><rect x="19" y="84.0" width="14" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="48" y1="70.0" x2="48" y2="84.0" stroke="#555" stroke-width="2"/><rect x="41" y="84.0" width="14" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="48" y1="70.0" x2="70" y2="84.0" stroke="#555" stroke-width="2"/><rect x="63" y="84.0" width="14" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="100" y="76.0" font-size="15" font-weight="700" fill="#1d3f8a">USB: Baum mit Hubs</text>
<text x="100" y="97.0" font-size="14">max. 127 Geräte · bis 20 Gbit/s (USB 3.2)</text>
<line x1="15" y1="114" x2="385" y2="114" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="139.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="40" y="139.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="34" y1="148.0" x2="40" y2="148.0" stroke="#333" stroke-width="2"/><rect x="64" y="139.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="58" y1="148.0" x2="64" y2="148.0" stroke="#333" stroke-width="2"/>
<text x="100" y="144.0" font-size="15" font-weight="700" fill="#1d3f8a">FireWire: Kette</text>
<text x="100" y="165.0" font-size="14">max. 63 Geräte · 400 / 800 Mbit/s</text>
<line x1="15" y1="182" x2="385" y2="182" stroke="#ddd" stroke-width="1"/>
<rect x="16" y="207.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><rect x="40" y="207.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="34" y1="216.0" x2="40" y2="216.0" stroke="#333" stroke-width="2"/><rect x="64" y="207.0" width="18" height="18" rx="3" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="58" y1="216.0" x2="64" y2="216.0" stroke="#333" stroke-width="2"/>
<text x="100" y="212.0" font-size="15" font-weight="700" fill="#E07B00">Thunderbolt: Kette</text>
<text x="100" y="233.0" font-size="14">max. 7 Geräte · bis 40 Gbit/s</text>
<line x1="15" y1="250" x2="385" y2="250" stroke="#ddd" stroke-width="1"/>
<rect x="40" y="262.0" width="16" height="12" rx="2" fill="#3a3f4a" stroke="none" stroke-width="0"/><line x1="48" y1="274.0" x2="26" y2="288.0" stroke="#555" stroke-width="2"/><rect x="19" y="288.0" width="14" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="48" y1="274.0" x2="48" y2="288.0" stroke="#555" stroke-width="2"/><rect x="41" y="288.0" width="14" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/><line x1="48" y1="274.0" x2="70" y2="288.0" stroke="#555" stroke-width="2"/><rect x="63" y="288.0" width="14" height="12" rx="2" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="100" y="280.0" font-size="15" font-weight="700" fill="#1d3f8a">USB4: Baum mit Hubs</text>
<text x="100" y="301.0" font-size="14">40 Gbit/s</text>
<line x1="15" y1="318" x2="385" y2="318" stroke="#ddd" stroke-width="1"/>
<rect x="14" y="330" width="372" height="58" rx="8" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/>
<rect x="24" y="348" width="56" height="22" rx="11" fill="#cfd6de" stroke="#333" stroke-width="2"/><rect x="36" y="356" width="32" height="6" rx="3" fill="#555" stroke="none" stroke-width="0"/>
<text x="100" y="354" font-size="14" font-weight="700" fill="#1d3f8a">USB-C = nur die Steckerform</text>
<text x="100" y="374" font-size="13" fill="#333">darüber: USB 3.x, USB4 oder Thunderbolt</text>
</svg>
