<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" fill="#222">
<title>Merkbild Binärzahlen: 1 Bit = 0 oder 1, Strom aus oder an. 1 Byte = 8 Bit = 1 Zeichen. Stellenwerte 128, 64, 32, 16, 8, 4, 2, 1, ganz rechts ist Stelle 0. 1 Byte hat 256 Möglichkeiten, die Zahlen 0 bis 255. Binär nach dezimal: Werte der Einsen addieren. Dezimal nach binär: größten passenden Wert abziehen.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Binärzahlen: das Wichtigste</text>
<!-- Bit Byte -->
<rect x="10" y="40" width="120" height="74" rx="10" fill="#fdf0e0"/>
<text x="70" y="68" text-anchor="middle" font-size="16" font-weight="700">1 Bit</text>
<text x="70" y="94" text-anchor="middle" font-size="14">0 oder 1</text>
<rect x="140" y="40" width="250" height="74" rx="10" fill="#fdf0e0"/>
<text x="265" y="68" text-anchor="middle" font-size="16" font-weight="700">1 Byte = 8 Bit</text>
<text x="265" y="94" text-anchor="middle" font-size="14">= 1 Zeichen</text>
<!-- Stellenwerte -->
<rect x="10" y="124" width="380" height="110" rx="10" fill="#e8f0fe"/>
<text x="22" y="148" font-size="15" font-weight="700">Stellenwerte</text>
<g text-anchor="middle" font-weight="700">
<g font-size="16" fill="#3a6ed8"><text x="40" y="186">128</text><text x="85" y="186">64</text><text x="130" y="186">32</text><text x="175" y="186">16</text><text x="220" y="186">8</text><text x="265" y="186">4</text><text x="310" y="186">2</text><text x="355" y="186">1</text></g>
</g>
<rect x="336" y="166" width="38" height="28" rx="5" fill="none" stroke="#E07B00" stroke-width="2.5"/>
<text x="355" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#E07B00">Stelle 0</text>
<text x="22" y="220" font-size="13" fill="#555">← jede Stelle nach links × 2</text>
<!-- 256 -->
<rect x="10" y="244" width="380" height="74" rx="10" fill="#e3f0e9"/>
<text x="200" y="272" text-anchor="middle" font-size="16" font-weight="700">1 Byte: 256 Möglichkeiten</text>
<text x="200" y="300" text-anchor="middle" font-size="15">Zahlen <tspan font-weight="700">0 bis 255</tspan> (die 0 zählt mit)</text>
<!-- Regeln -->
<rect x="10" y="328" width="380" height="64" rx="10" fill="#f4f1ee"/>
<text x="22" y="352" font-size="15" font-weight="700">binär → dezimal</text>
<text x="22" y="378" font-size="14">Werte der Einsen addieren</text>
<rect x="10" y="400" width="380" height="64" rx="10" fill="#f4f1ee"/>
<text x="22" y="424" font-size="15" font-weight="700">dezimal → binär</text>
<text x="22" y="450" font-size="14">größten passenden Wert abziehen</text>
</svg>
