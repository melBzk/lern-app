<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Die neuen Wörter mit Symbol: Task-Manager zeigt laufende Programme und Auslastung. Ressourcenmonitor zeigt, wer CPU, RAM, Datenträger und Netz belegt. Leistungsüberwachung zeigt Messwerte als Kurve und zeichnet auf; ein Messwert heißt Leistungsindikator. Systeminformationen (msinfo32): Liste aller Komponenten. Datenträger: das Speichergerät selbst, z. B. eine SSD. Partition: abgeteilter Bereich eines Datenträgers. Laufwerk: Bereich mit Buchstabe wie C: oder E:. Wiederholung Netzlaufwerk: Buchstabe für Speicher im Netz, z. B. auf einem NAS.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="570" fill="#fff"/>
<text x="200.0" y="28" font-size="17" text-anchor="middle" font-weight="700">7 neue Wörter + 1 Wiederholung</text>
<line x1="15" y1="46" x2="385" y2="46" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="56.0" width="60" height="44" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><path d="M18,78.0 V61.0 Q18,56.0 23,56.0 H73 Q78,56.0 78,61.0 V78.0 Z" fill="#3a6ed8" stroke="#3a6ed8" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="72.0" font-size="13" font-weight="700" fill="#fff"></text><path d="M22,92.0 l8,-6 l8,4 l8,-10 l8,6 l8,-8 l6,4" fill="none" stroke="#3a6ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="74.0" font-size="15" font-weight="700" fill="#1d3f8a">Task-Manager</text>
<text x="100" y="95.0" font-size="14">laufende Programme und Auslastung</text>
<line x1="15" y1="110" x2="385" y2="110" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="120.0" width="60" height="44" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><path d="M18,142.0 V125.0 Q18,120.0 23,120.0 H73 Q78,120.0 78,125.0 V142.0 Z" fill="#3a6ed8" stroke="#3a6ed8" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="136.0" font-size="13" font-weight="700" fill="#fff"></text><rect x="22" y="146.0" width="18" height="12" rx="0" fill="#3fa34d" stroke="none" stroke-width="0"/><rect x="40" y="146.0" width="2" height="12" rx="0" fill="#e08a1e" stroke="none" stroke-width="0"/><rect x="42" y="146.0" width="20" height="12" rx="0" fill="#2f5fb3" stroke="none" stroke-width="0"/><rect x="62" y="146.0" width="12" height="12" rx="0" fill="#a9c8f0" stroke="none" stroke-width="0"/>
<text x="100" y="138.0" font-size="15" font-weight="700" fill="#1d3f8a">Ressourcenmonitor</text>
<text x="100" y="159.0" font-size="14">wer CPU, RAM, Datenträger, Netz belegt</text>
<line x1="15" y1="174" x2="385" y2="174" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="184.0" width="60" height="44" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><path d="M18,206.0 V189.0 Q18,184.0 23,184.0 H73 Q78,184.0 78,189.0 V206.0 Z" fill="#3a6ed8" stroke="#3a6ed8" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="200.0" font-size="13" font-weight="700" fill="#fff"></text><path d="M22,220.0 q10,-14 20,-4 t20,-6 t12,2" fill="none" stroke="#c62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22,214.0 q10,4 20,-2 t20,4 t12,-4" fill="none" stroke="#3fa34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="193.0" r="7" fill="#3fa34d" stroke="none" stroke-width="2"/><text x="70" y="198.0" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">+</text>
<text x="100" y="194.0" font-size="15" font-weight="700" fill="#1d3f8a">Leistungsüberwachung</text>
<text x="100" y="214.0" font-size="14">Messwerte als Kurve, aufzeichnen;</text>
<text x="100" y="232.0" font-size="14">1 Messwert = Leistungsindikator</text>
<line x1="15" y1="238" x2="385" y2="238" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="248.0" width="60" height="44" rx="5" fill="#fff" stroke="#3a6ed8" stroke-width="2"/><path d="M18,270.0 V253.0 Q18,248.0 23,248.0 H73 Q78,248.0 78,253.0 V270.0 Z" fill="#3a6ed8" stroke="#3a6ed8" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="264.0" font-size="13" font-weight="700" fill="#fff"></text><line x1="26" y1="272.0" x2="70" y2="272.0" stroke="#888" stroke-width="2"/><line x1="26" y1="279.0" x2="70" y2="279.0" stroke="#888" stroke-width="2"/><line x1="26" y1="286.0" x2="70" y2="286.0" stroke="#888" stroke-width="2"/>
<text x="100" y="266.0" font-size="15" font-weight="700" fill="#1d3f8a">Systeminformationen</text>
<text x="100" y="287.0" font-size="14">msinfo32: Liste aller Komponenten</text>
<line x1="15" y1="302" x2="385" y2="302" stroke="#ddd" stroke-width="1"/>
<rect x="23.0" y="318.0" width="50" height="32" rx="3" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><text x="48" y="339.0" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">SSD</text>
<text x="100" y="330.0" font-size="15" font-weight="700" fill="#1d3f8a">Datenträger</text>
<text x="100" y="351.0" font-size="14">das Speichergerät selbst, z. B. SSD</text>
<line x1="15" y1="366" x2="385" y2="366" stroke="#ddd" stroke-width="1"/>
<circle cx="48" cy="398.0" r="20" fill="#dbe6fb" stroke="#3a6ed8" stroke-width="2"/><path d="M48,398.0 L48,378.0 A20,20 0 0 1 68,398.0 Z" fill="#E07B00" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="394.0" font-size="15" font-weight="700" fill="#E07B00">Partition</text>
<text x="100" y="415.0" font-size="14">abgeteilter Bereich eines Datenträgers</text>
<line x1="15" y1="430" x2="385" y2="430" stroke="#ddd" stroke-width="1"/>
<rect x="26" y="446.0" width="44" height="32" rx="5" fill="#f1f3f5" stroke="#555" stroke-width="2"/><text x="48" y="468.0" font-size="16" text-anchor="middle" font-weight="700" fill="#1d3f8a">C:</text>
<text x="100" y="458.0" font-size="15" font-weight="700" fill="#1d3f8a">Laufwerk</text>
<text x="100" y="479.0" font-size="14">Bereich mit Buchstabe wie C: oder E:</text>
<line x1="15" y1="494" x2="385" y2="494" stroke="#ddd" stroke-width="1"/>
<rect x="18" y="508.0" width="26" height="34" rx="3" fill="#3a3f4a" stroke="#222" stroke-width="1.5"/><line x1="44" y1="526.0" x2="56" y2="526.0" stroke="#555" stroke-width="2" stroke-dasharray="3 2"/><rect x="56" y="514.0" width="26" height="24" rx="4" fill="#f1f3f5" stroke="#555" stroke-width="2"/><text x="69" y="531.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1d3f8a">Y:</text>
<text x="100" y="522.0" font-size="15" font-weight="700" fill="#555">Netzlaufwerk (Wiederholung)</text>
<text x="100" y="543.0" font-size="14">Buchstabe für Speicher im Netz, z. B. NAS</text>
<line x1="15" y1="558" x2="385" y2="558" stroke="#ddd" stroke-width="1"/>
</svg>
