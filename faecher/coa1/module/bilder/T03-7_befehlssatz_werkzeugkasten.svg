<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Befehlssatz = alle Befehle, die eine CPU versteht. Links ein großer, voller Werkzeugkasten: CISC – viele Befehle, darunter ein Multitool mit Schild 1 Befehl = komplexe Aufgabe. Rechts ein kleiner Kasten: RISC – wenige Befehle, nur vier gleich große Werkzeuge: laden, rechnen, vergleichen, speichern. Ein Doppelpfeil zwischen beiden: heute Mischform.</title>
