<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Links eine Platte von oben mit mehreren Kreisen. Ein Kreis ist blau hervorgehoben: die Spur. Ein Kuchenstück dieser Spur ist rot: der Sektor, meist 512 Byte. Rechts ein Stapel aus 3 Platten schräg von der Seite auf einer Spindel: Dieselbe Spur ist auf allen Platten blau, gestrichelte Linien verbinden sie zu einem Zylinder. Zylinder heißt: übereinanderliegende Spuren.</title>
<rect width="400" height="380" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">So wird eine Platte aufgeteilt</text>
<text x="100" y="56" text-anchor="middle" font-size="13" fill="#555">von oben</text>
<text x="300" y="56" text-anchor="middle" font-size="13" fill="#555">Stapel, schräg von der Seite</text>

<!-- Platte von oben -->
<circle cx="100" cy="160" r="85" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="2"/>
<g fill="none" stroke="#fff" stroke-opacity="0.7"><circle cx="100" cy="160" r="77"/><circle cx="100" cy="160" r="45"/><circle cx="100" cy="160" r="37"/><circle cx="100" cy="160" r="29"/></g>
<circle cx="100" cy="160" r="61" fill="none" stroke="#1f4fa8" stroke-width="16"/>
<g stroke="#fff" stroke-opacity="0.5" stroke-width="1"><line x1="116.0" y1="160.0" x2="185.0" y2="160.0"/><line x1="113.9" y1="168.0" x2="173.6" y2="202.5"/><line x1="108.0" y1="173.9" x2="142.5" y2="233.6"/><line x1="100.0" y1="176.0" x2="100.0" y2="245.0"/><line x1="92.0" y1="173.9" x2="57.5" y2="233.6"/><line x1="86.1" y1="168.0" x2="26.4" y2="202.5"/><line x1="84.0" y1="160.0" x2="15.0" y2="160.0"/><line x1="86.1" y1="152.0" x2="26.4" y2="117.5"/><line x1="92.0" y1="146.1" x2="57.5" y2="86.4"/><line x1="100.0" y1="144.0" x2="100.0" y2="75.0"/><line x1="108.0" y1="146.1" x2="142.5" y2="86.4"/><line x1="113.9" y1="152.0" x2="173.6" y2="117.5"/></g>
<path d="M100.0,91.0 A69,69 0 0 1 134.5,100.2 L126.5,114.1 A53,53 0 0 0 100.0,107.0 Z" fill="#c62828" stroke="#fff" stroke-width="1.5"/>
<circle cx="100" cy="160" r="14" fill="#555"/>

<!-- Stapel -->
<rect x="294" y="96" width="12" height="166" fill="#555"/>
<ellipse cx="300" cy="225" rx="85" ry="26" fill="#7d90ad"/><rect x="215" y="218" width="170" height="7" fill="#7d90ad"/><ellipse cx="300" cy="218" rx="85" ry="26" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/><ellipse cx="300" cy="218" rx="61" ry="18.7" fill="none" stroke="#1f4fa8" stroke-width="3.5"/><ellipse cx="300" cy="218" rx="8" ry="3" fill="#555"/><ellipse cx="300" cy="175" rx="85" ry="26" fill="#7d90ad"/><rect x="215" y="168" width="170" height="7" fill="#7d90ad"/><ellipse cx="300" cy="168" rx="85" ry="26" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/><ellipse cx="300" cy="168" rx="61" ry="18.7" fill="none" stroke="#1f4fa8" stroke-width="3.5"/><ellipse cx="300" cy="168" rx="8" ry="3" fill="#555"/><ellipse cx="300" cy="125" rx="85" ry="26" fill="#7d90ad"/><rect x="215" y="118" width="170" height="7" fill="#7d90ad"/><ellipse cx="300" cy="118" rx="85" ry="26" fill="#9fb3cf" stroke="#3a6ed8" stroke-width="1.5"/><ellipse cx="300" cy="118" rx="61" ry="18.7" fill="none" stroke="#1f4fa8" stroke-width="3.5"/><ellipse cx="300" cy="118" rx="8" ry="3" fill="#555"/>
<g stroke="#c62828" stroke-width="2" stroke-dasharray="5 4"><line x1="239" y1="118" x2="239" y2="218"/><line x1="361" y1="118" x2="361" y2="218"/></g>

<!-- Beschriftung -->
<g stroke="#333" stroke-width="1.2">
<line x1="42.7" y1="180.9" x2="30" y2="268"/>
<line x1="115.8" y1="101.1" x2="140" y2="62"/>
<line x1="294" y1="262" x2="280" y2="274"/>
<line x1="361" y1="318" x2="361" y2="234"/>
</g>
<text x="30" y="286" text-anchor="middle" font-weight="700" fill="#1f4fa8">Spur</text>
<text x="30" y="303" text-anchor="middle" font-size="13">(Kreis)</text>
<text x="146" y="70" font-weight="700" fill="#c62828">Sektor</text>
<text x="146" y="86" font-size="13" fill="#c62828">(meist 512 Byte)</text>
<text x="276" y="286" text-anchor="end" font-weight="700">Spindel</text>

<rect x="150" y="318" width="240" height="52" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="270" y="340" text-anchor="middle" font-weight="700" fill="#1f4fa8">Zylinder =</text>
<text x="270" y="359" text-anchor="middle" font-size="13">übereinanderliegende Spuren</text>
</svg>
