<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" role="img">
  <title>Rechenweg: Wie viele LCD-Zellen hat ein Full-HD-Monitor? Schritt 1: Pixel gleich Breite mal Höhe, 1920 mal 1080 gleich 2 073 600 Pixel. Schritt 2: Jedes Pixel hat 3 LCD-Zellen, Rot, Grün, Blau. 2 073 600 mal 3 gleich 6 220 800 Zellen. Schritt 3: etwa 6 Millionen Zellen. Folgerung: Bei so vielen Zellen kann leicht eine kaputt sein, das ist ein Pixelfehler.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="400" height="440" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Full HD: wie viele LCD-Zellen?</text>

  <rect x="8" y="42" width="384" height="86" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <circle cx="30" cy="66" r="11" fill="#E07B00"/><text x="30" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="50" y="71" font-size="15" fill="#222">Pixel = Breite × Höhe</text>
  <text x="200" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#222">1920 × 1080 = 2 073 600</text>
  <line x1="200" y1="132" x2="200" y2="152" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

  <rect x="8" y="158" width="384" height="118" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <circle cx="30" cy="182" r="11" fill="#E07B00"/><text x="30" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="50" y="187" font-size="15" fill="#222">1 Pixel = 3 Zellen</text>
  <rect x="236" y="170" width="20" height="36" fill="#e03131"/><rect x="258" y="170" width="20" height="36" fill="#2f9e44"/><rect x="280" y="170" width="20" height="36" fill="#1c7ed6"/>
  <rect x="234" y="168" width="68" height="40" fill="none" stroke="#3a3f4a" stroke-width="2"/>
  <text x="200" y="256" text-anchor="middle" font-size="19" font-weight="700" fill="#222">2 073 600 × 3 = 6 220 800</text>
  <line x1="200" y1="280" x2="200" y2="300" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

  <rect x="8" y="306" width="384" height="56" rx="12" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <circle cx="30" cy="334" r="11" fill="#E07B00"/><text x="30" y="339" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="210" y="341" text-anchor="middle" font-size="18" font-weight="700" fill="#b35f00">≈ 6 Millionen Zellen</text>

  <rect x="8" y="374" width="384" height="58" rx="12" fill="#fdecec" stroke="#d63c3c" stroke-width="2"/>
  <text x="200" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#a32020">So viele Zellen: leicht ist eine kaputt</text>
  <text x="200" y="420" text-anchor="middle" font-size="14" fill="#a32020">→ Pixelfehler kommen vor</text>
</svg>
