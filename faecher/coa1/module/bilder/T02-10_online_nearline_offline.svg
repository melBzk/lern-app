<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="-apple-system,'Segoe UI',system-ui,sans-serif">
  <title>Treppe mit drei Stufen: 1 Online – ständig aktiv, schnellster Zugriff (Arbeitsspeicher, Festplatte, eingesteckter USB-Stick). 2 Nearline – oft gebraucht, aber nicht gerade jetzt (Bandroboter). 3 Offline – selten gebraucht, von Hand einlegen (Installations-DVD, Band im Schrank). Nach unten wird der Zugriff langsamer.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63c3c"/></marker>
    <g id="k">
      <rect x="0" y="0" width="30" height="20" rx="2" fill="#555"/>
      <circle cx="10" cy="10" r="5" fill="#c9a36b"/>
      <rect x="20" y="4" width="7" height="12" fill="#888"/>
    </g>
  </defs>
  <rect width="400" height="500" fill="#fff"/>

  <!-- Pfeil links -->
  <line x1="32" y1="30" x2="32" y2="480" stroke="#d63c3c" stroke-width="3" marker-end="url(#a)"/>
  <text x="16" y="255" font-size="14" font-weight="700" fill="#d63c3c" text-anchor="middle" transform="rotate(-90 16 255)">Zugriff wird langsamer</text>

  <!-- Stufe 1 -->
  <rect x="44" y="20" width="290" height="140" rx="10" fill="#eaf6ee" stroke="#2e9e5b" stroke-width="1.5"/>
  <rect x="44" y="20" width="290" height="8" rx="4" fill="#2e9e5b"/>
  <text x="58" y="50" font-size="17" font-weight="700" fill="#1c6b3c">1 Online</text>
  <text x="58" y="70" font-size="14">ständig aktiv, schnellster Zugriff</text>
  <!-- RAM -->
  <rect x="62" y="92" width="76" height="22" rx="2" fill="#2e9e5b"/>
  <g fill="#1c3b2a"><rect x="68" y="97" width="12" height="12"/><rect x="85" y="97" width="12" height="12"/><rect x="102" y="97" width="12" height="12"/><rect x="119" y="97" width="12" height="12"/></g>
  <path d="M64,114 h72" stroke="#d4a53a" stroke-width="3"/>
  <text x="100" y="138" font-size="13" text-anchor="middle">Arbeitsspeicher</text>
  <!-- HDD -->
  <rect x="166" y="86" width="44" height="34" rx="4" fill="#d9dde3" stroke="#444"/>
  <circle cx="182" cy="103" r="12" fill="#9fb3cf"/><circle cx="182" cy="103" r="3" fill="#444"/>
  <text x="188" y="138" font-size="13" text-anchor="middle">Festplatte</text>
  <!-- USB-Stick eingesteckt -->
  <rect x="244" y="86" width="20" height="38" fill="#888"/>
  <rect x="260" y="96" width="44" height="18" rx="4" fill="#2e9e5b"/>
  <text x="280" y="138" font-size="13" text-anchor="middle">USB-Stick</text>
  <text x="280" y="153" font-size="13" text-anchor="middle">(eingesteckt)</text>

  <!-- Stufe 2 -->
  <rect x="70" y="180" width="290" height="140" rx="10" fill="#fdf2e6" stroke="#d9791f" stroke-width="1.5"/>
  <rect x="70" y="180" width="290" height="8" rx="4" fill="#d9791f"/>
  <text x="84" y="210" font-size="17" font-weight="700" fill="#8a4a0f">2 Nearline</text>
  <text x="84" y="230" font-size="14">oft gebraucht, aber nicht gerade jetzt</text>
  <!-- Regal -->
  <rect x="90" y="244" width="76" height="58" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <line x1="90" y1="273" x2="166" y2="273" stroke="#444" stroke-width="1.5"/>
  <use href="#k" x="94" y="249"/><use href="#k" x="130" y="249"/><use href="#k" x="94" y="278"/>
  <!-- Roboterarm -->
  <path d="M230,244 h70" stroke="#666" stroke-width="4"/>
  <path d="M240,244 v20 l-22,18 h-8" fill="none" stroke="#d9791f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#k" x="176" y="272"/>
  <text x="290" y="278" font-size="13" text-anchor="middle">Band im Roboter:</text>
  <text x="290" y="294" font-size="13" text-anchor="middle">holt es automatisch</text>

  <!-- Stufe 3 -->
  <rect x="96" y="340" width="294" height="140" rx="10" fill="#f0f1f4" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="96" y="340" width="294" height="8" rx="4" fill="#6b7280"/>
  <text x="110" y="370" font-size="17" font-weight="700" fill="#374151">3 Offline</text>
  <text x="110" y="390" font-size="14">selten gebraucht, von Hand einlegen</text>
  <!-- DVD -->
  <circle cx="154" cy="426" r="20" fill="#f2c48e" stroke="#b5651d"/><circle cx="154" cy="426" r="5" fill="#fff" stroke="#b5651d"/>
  <text x="154" y="466" font-size="13" text-anchor="middle">Installations-DVD</text>
  <!-- Band -->
  <g transform="translate(238 412) scale(1.3)"><use href="#k"/></g>
  <text x="264" y="466" font-size="13" text-anchor="middle">Band im Schrank</text>
  <!-- Hand -->
  <rect x="316" y="404" width="44" height="38" rx="14" fill="#f2c9a0" stroke="#a0704a" stroke-width="1.5"/>
  <rect x="308" y="424" width="26" height="12" rx="6" fill="#f2c9a0" stroke="#a0704a" stroke-width="1.5"/>
  <rect x="360" y="408" width="20" height="30" rx="3" fill="#6b7f99"/>
  <text x="346" y="466" font-size="13" text-anchor="middle">von Hand</text>
</svg>
