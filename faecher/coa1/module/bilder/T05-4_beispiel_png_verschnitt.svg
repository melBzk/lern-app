<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vereinfachtes, nachgezeichnetes Eigenschaften-Fenster der Datei bild.png: Größe 37,4 KB, Größe auf Datenträger 128 KB, rot markiert. Darunter ein Cluster von 128 KB: 37,4 KB grün gefüllt mit dem Bild, 90,6 KB grau, das ist Verschnitt. Unten: 1000 Bilder belegen 128 000 KB statt 37 400 KB.</title>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" font-size="17" font-weight="700" text-anchor="middle">Ein Bild auf dem USB-Stick</text>

<!-- Fenster (vereinfacht) -->
<rect x="20" y="44" width="360" height="150" rx="6" fill="#fafafa" stroke="#777" stroke-width="1.5"/>
<rect x="20" y="44" width="360" height="30" rx="6" fill="#e3e8ef"/><rect x="20" y="64" width="360" height="10" fill="#e3e8ef"/>
<text x="34" y="64" font-size="13">Eigenschaften von bild.png</text>
<text x="364" y="64" font-size="14" text-anchor="middle" fill="#555">×</text>
<rect x="34" y="88" width="26" height="30" rx="2" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
<path d="M38,112 l7,-9 l5,6 l3,-4 l4,7 z" fill="#2e7d32"/>
<text x="72" y="108" font-weight="700">bild.png</text>
<line x1="34" y1="128" x2="366" y2="128" stroke="#ddd"/>
<text x="34" y="152" font-size="14">Größe:</text>
<text x="210" y="152" font-size="14" font-weight="700" fill="#2e7d32">37,4 KB</text>
<rect x="28" y="162" width="344" height="26" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="34" y="180" font-size="14">Größe auf Datenträger:</text>
<text x="210" y="180" font-size="14" font-weight="700" fill="#c62828">128 KB</text>

<!-- Cluster -->
<text x="200" y="232" text-anchor="middle" font-weight="700">1 Cluster (Zuordnungseinheit) = 128 KB</text>
<path d="M20,248 v-8 h360 v8" fill="none" stroke="#222" stroke-width="2"/>
<rect x="20" y="254" width="105.2" height="54" fill="#2e7d32"/>
<rect x="125.2" y="254" width="254.8" height="54" fill="#e0e0e0"/>
<g stroke="#888" stroke-width="2"><line x1="135.2" y1="254.0" x2="125.2" y2="264.0"/><line x1="145.2" y1="254.0" x2="125.2" y2="274.0"/><line x1="155.2" y1="254.0" x2="125.2" y2="284.0"/><line x1="165.2" y1="254.0" x2="125.2" y2="294.0"/><line x1="175.2" y1="254.0" x2="125.2" y2="304.0"/><line x1="185.2" y1="254.0" x2="131.2" y2="308.0"/><line x1="195.2" y1="254.0" x2="141.2" y2="308.0"/><line x1="205.2" y1="254.0" x2="151.2" y2="308.0"/><line x1="215.2" y1="254.0" x2="161.2" y2="308.0"/><line x1="225.2" y1="254.0" x2="171.2" y2="308.0"/><line x1="235.2" y1="254.0" x2="181.2" y2="308.0"/><line x1="245.2" y1="254.0" x2="191.2" y2="308.0"/><line x1="255.2" y1="254.0" x2="201.2" y2="308.0"/><line x1="265.2" y1="254.0" x2="211.2" y2="308.0"/><line x1="275.2" y1="254.0" x2="221.2" y2="308.0"/><line x1="285.2" y1="254.0" x2="231.2" y2="308.0"/><line x1="295.2" y1="254.0" x2="241.2" y2="308.0"/><line x1="305.2" y1="254.0" x2="251.2" y2="308.0"/><line x1="315.2" y1="254.0" x2="261.2" y2="308.0"/><line x1="325.2" y1="254.0" x2="271.2" y2="308.0"/><line x1="335.2" y1="254.0" x2="281.2" y2="308.0"/><line x1="345.2" y1="254.0" x2="291.2" y2="308.0"/><line x1="355.2" y1="254.0" x2="301.2" y2="308.0"/><line x1="365.2" y1="254.0" x2="311.2" y2="308.0"/><line x1="375.2" y1="254.0" x2="321.2" y2="308.0"/><line x1="380.0" y1="259.2" x2="331.2" y2="308.0"/><line x1="380.0" y1="269.2" x2="341.2" y2="308.0"/><line x1="380.0" y1="279.2" x2="351.2" y2="308.0"/><line x1="380.0" y1="289.2" x2="361.2" y2="308.0"/><line x1="380.0" y1="299.2" x2="371.2" y2="308.0"/></g>
<rect x="20" y="254" width="360" height="54" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="72.6" y="286" text-anchor="middle" fill="#fff" font-weight="700">37,4 KB</text>
<rect x="182.6" y="267" width="140" height="28" rx="4" fill="#fff" stroke="#888"/>
<text x="252.6" y="286" text-anchor="middle" font-weight="700">90,6 KB Verschnitt</text>
<text x="72.6" y="328" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="700">das Bild</text>
<text x="252.6" y="328" text-anchor="middle" font-size="13" fill="#555">128 − 37,4 = 90,6 KB ungenutzt</text>

<!-- 1000 Bilder -->
<rect x="10" y="350" width="380" height="106" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="200" y="376" text-anchor="middle" font-weight="700" font-size="15">1000 solche Bilder:</text>
<text x="200" y="402" text-anchor="middle" font-weight="700" fill="#c62828">128 000 KB belegt</text>
<text x="200" y="424" text-anchor="middle" font-weight="700" fill="#2e7d32">statt 37 400 KB genutzt</text>
<text x="200" y="446" text-anchor="middle" font-size="13" fill="#555">Verschnitt: 90 600 KB</text>
</svg>
