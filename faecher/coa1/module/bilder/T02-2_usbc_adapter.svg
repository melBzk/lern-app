<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif">
  <title>Links drei USB-A-Buchsen: eine rote (USB 2.0, Farbe wie im Buchbild) und zwei blaue (USB 3.x). Ein Pfeil "wird vereinheitlicht" führt zu einem modernen Laptop, der an der Seite nur zwei ovale USB-C-Buchsen hat. Unten ein Adapter: USB-C-Stecker auf der einen Seite, USB-A-Buchse auf der anderen, darin steckt ein alter USB-Stick.</title>
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D4607A"/>
    </marker>
  </defs>
  <rect width="400" height="400" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Bald nur noch USB-C</text>

  <!-- USB-A Buchsen -->
  <rect x="14" y="62" width="50" height="20" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="20" y="66" width="38" height="7" fill="#d43c3c"/>
  <text x="72" y="77" font-size="13" fill="#222">USB 2.0</text>
  <rect x="14" y="98" width="50" height="20" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="20" y="102" width="38" height="7" fill="#3a6ed8"/>
  <text x="72" y="113" font-size="13" fill="#222">USB 3.x</text>
  <rect x="14" y="134" width="50" height="20" fill="#fff" stroke="#555" stroke-width="2"/>
  <rect x="20" y="138" width="38" height="7" fill="#3a6ed8"/>
  <text x="72" y="149" font-size="13" fill="#222">USB 3.x</text>
  <text x="14" y="178" font-size="13" fill="#666">Farben wie im Buchbild</text>

  <!-- Pfeil -->
  <line x1="140" y1="110" x2="214" y2="110" stroke="#D4607A" stroke-width="4" marker-end="url(#spitze)"/>
  <text x="178" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#D4607A">wird</text>
  <text x="178" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#D4607A">vereinheitlicht</text>

  <!-- Laptop -->
  <rect x="262" y="50" width="96" height="62" rx="4" fill="#f4f1ee" stroke="#555" stroke-width="2"/>
  <rect x="269" y="57" width="82" height="48" fill="#dde6f0"/>
  <path d="M250,112 H370 L376,122 H244 Z" fill="#d6d6d6" stroke="#555" stroke-width="2"/>
  <!-- Seitenansicht vergrößert -->
  <line x1="246" y1="122" x2="232" y2="140" stroke="#999" stroke-dasharray="3 3"/>
  <rect x="232" y="140" width="150" height="34" rx="6" fill="#d6d6d6" stroke="#555" stroke-width="2"/>
  <rect x="248" y="149" width="40" height="15" rx="7.5" fill="#333"/>
  <rect x="256" y="154" width="24" height="5" rx="2" fill="#bbb"/>
  <rect x="300" y="149" width="40" height="15" rx="7.5" fill="#333"/>
  <rect x="308" y="154" width="24" height="5" rx="2" fill="#bbb"/>
  <text x="307" y="194" text-anchor="middle" font-size="13" fill="#222">Laptop-Seite:</text>
  <text x="307" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#2e9d5b">nur USB-C</text>

  <!-- Adapter -->
  <line x1="10" y1="236" x2="390" y2="236" stroke="#ddd"/>
  <rect x="24" y="287" width="38" height="16" rx="8" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
  <rect x="60" y="276" width="110" height="38" rx="7" fill="#666"/>
  <rect x="158" y="283" width="14" height="24" fill="#333"/>
  <!-- USB-Stick -->
  <rect x="172" y="284" width="44" height="22" fill="#d0d0d0" stroke="#555" stroke-width="2"/>
  <rect x="216" y="274" width="100" height="42" rx="8" fill="#3a6ed8"/>
  <circle cx="300" cy="295" r="4" fill="#fff"/>
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="43" y="334">USB-C-</text>
    <text x="43" y="350">Stecker</text>
    <text x="115" y="334">Adapter</text>
    <text x="194" y="334">USB-A</text>
    <text x="266" y="334">alter USB-Stick</text>
  </g>
  <text x="200" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Adapter USB-C ↔ USB-A für alte Geräte</text>
</svg>
