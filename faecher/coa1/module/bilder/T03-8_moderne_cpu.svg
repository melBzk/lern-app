<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Oben ein Kern mit zwei Bändern aus den Einheiten L, D, O, A, S; die Befehle laufen versetzt (Pipelining) und die Bänder sind doppelt (superskalar). Unten zwei CPUs mit gleichem Takt, die Pipeline läuft schon voll (Anlaufphase vorbei), betrachtet werden je 4 weitere Takte: CPU A schafft 1 Befehl pro Takt, also 4 fertige Befehle; CPU B schafft 2 Befehle pro Takt, also 8 fertige Befehle. Im Idealfall doppelt so viele, der Takt allein sagt wenig.</title>
