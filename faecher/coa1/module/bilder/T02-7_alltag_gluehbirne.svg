<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222">
<title>Vergleich: Oben eine Glühbirne mit großem Gewinde vor einer kleinen Fassung, rotes X: passt nicht. Unten ein Prozessor, der nur in den passenden Sockel passt. Hinweis, wo der Vergleich hinkt: Es gibt sehr viele Sockel, und der Prozessor wird nicht eingeschraubt, sondern ohne Kraft eingelegt und festgeklemmt.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Glühbirne und Fassung</text>
<!-- Birne -->
<rect x="10" y="42" width="380" height="140" rx="10" fill="#f4f1ee"/>
<circle cx="80" cy="88" r="30" fill="#fff3c4" stroke="#c99a06" stroke-width="2"/>
<rect x="62" y="114" width="36" height="34" fill="#bdbdbd" stroke="#777" stroke-width="1.5"/>
<g stroke="#777" stroke-width="1.5"><line x1="62" y1="124" x2="98" y2="124"/><line x1="62" y1="134" x2="98" y2="134"/></g>
<text x="80" y="170" text-anchor="middle" font-size="13">großes Gewinde</text>
<rect x="190" y="104" width="22" height="40" fill="#fff" stroke="#333" stroke-width="2.5"/>
<text x="201" y="170" text-anchor="middle" font-size="13">kleine Fassung</text>
<g stroke="#d43c3c" stroke-width="6" stroke-linecap="round"><line x1="258" y1="98" x2="286" y2="126"/><line x1="286" y1="98" x2="258" y2="126"/></g>
<text x="300" y="118" font-size="15" font-weight="700" fill="#d43c3c">passt nicht</text>
<!-- CPU -->
<rect x="10" y="192" width="380" height="110" rx="10" fill="#f4f1ee"/>
<rect x="44" y="214" width="56" height="56" rx="3" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<text x="72" y="247" text-anchor="middle" font-size="14" font-weight="700">CPU</text>
<text x="124" y="248" font-size="20" font-weight="700" fill="#555">→</text>
<rect x="160" y="208" width="68" height="68" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
<rect x="166" y="214" width="56" height="56" fill="#eee"/>
<text x="194" y="294" text-anchor="middle" font-size="13">passender Sockel</text>
<path d="M258,244 L270,256 L292,230" fill="none" stroke="#2e9d5b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="304" y="250" font-size="15" font-weight="700" fill="#2e9d5b">passt</text>
<!-- hinkt -->
<rect x="10" y="314" width="380" height="76" rx="10" fill="#fff" stroke="#D4607A" stroke-width="2"/>
<text x="24" y="338" font-size="14" font-weight="700" fill="#D4607A">Wo es hinkt:</text>
<text x="24" y="358" font-size="13">sehr viele Sockel, neue CPU oft neuer Sockel;</text>
<text x="24" y="378" font-size="13">nicht schrauben – ohne Kraft einlegen, festklemmen</text>
</svg>
