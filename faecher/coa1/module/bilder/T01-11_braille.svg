<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, sans-serif" role="img">
  <title>Braille-Gerät. Oben ein Monitor mit dem Wort Hallo. Ein Pfeil führt zur Braille-Leiste vor der Tastatur: Der Text vom Bildschirm wird zu Tastpunkten. Die Leiste hat viele kleine Zellen mit je 2 Spalten mal 3 Punkten. Eine Zelle ist vergrößert: angehobene Punkte sind schwarz, abgesenkte hell. Eine Fingerspitze tastet über die Leiste. Unten: Braille-Zeilen am PC haben oft 2 mal 4 Punkte je Zelle.</title>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
    <pattern id="k" x="46" y="156" width="15" height="12" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="12" height="9" rx="1.5" fill="#fff" stroke="#adb5bd"/></pattern>
  </defs>
  <rect width="400" height="470" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Braille-Gerät: Text zum Fühlen</text>

  <!-- Monitor -->
  <rect x="110" y="44" width="180" height="84" rx="6" fill="#3a3f4a"/>
  <rect x="118" y="52" width="164" height="68" fill="#dfe8f6"/>
  <text x="200" y="97" text-anchor="middle" font-size="28" font-weight="700" fill="#222">Hallo</text>
  <rect x="192" y="128" width="16" height="12" fill="#555"/>
  <rect x="172" y="140" width="56" height="5" fill="#555"/>

  <!-- Pfeil -->
  <text x="300" y="64" font-size="13" font-weight="700" fill="#222">Text vom</text>
  <text x="300" y="80" font-size="13" font-weight="700" fill="#222">Bildschirm</text>
  <text x="300" y="96" font-size="13" font-weight="700" fill="#e8590c">→ Tastpunkte</text>
  <line x1="378" y1="104" x2="378" y2="208" stroke="#e8590c" stroke-width="3" marker-end="url(#ao)"/>

  <!-- Tastatur -->
  <rect x="40" y="152" width="270" height="40" rx="4" fill="#e9ecef" stroke="#555" stroke-width="1.5"/>
  <rect x="46" y="156" width="255" height="32" fill="url(#k)"/>
  <text x="316" y="178" font-size="13" fill="#444">Tastatur</text>

  <!-- Braille-Leiste: Zellen h a l l o, Rest leer -->
  <rect x="30" y="212" width="360" height="36" rx="6" fill="#ced4da" stroke="#555" stroke-width="1.5"/>
  <g fill="#e9ecef">
    <rect x="43" y="216" width="18" height="28" rx="2"/><rect x="73" y="216" width="18" height="28" rx="2"/>
    <rect x="103" y="216" width="18" height="28" rx="2"/><rect x="133" y="216" width="18" height="28" rx="2"/>
    <rect x="163" y="216" width="18" height="28" rx="2"/><rect x="193" y="216" width="18" height="28" rx="2"/>
    <rect x="223" y="216" width="18" height="28" rx="2"/><rect x="253" y="216" width="18" height="28" rx="2"/>
    <rect x="283" y="216" width="18" height="28" rx="2"/><rect x="313" y="216" width="18" height="28" rx="2"/>
    <rect x="343" y="216" width="18" height="28" rx="2"/>
  </g>
  <!-- abgesenkte Punkte (alle Positionen) -->
  <g fill="#fff" stroke="#adb5bd" stroke-width="0.8">
    <circle cx="48" cy="222" r="2.4"/><circle cx="48" cy="230" r="2.4"/><circle cx="48" cy="238" r="2.4"/><circle cx="56" cy="222" r="2.4"/><circle cx="56" cy="230" r="2.4"/><circle cx="56" cy="238" r="2.4"/>
    <circle cx="78" cy="222" r="2.4"/><circle cx="78" cy="230" r="2.4"/><circle cx="78" cy="238" r="2.4"/><circle cx="86" cy="222" r="2.4"/><circle cx="86" cy="230" r="2.4"/><circle cx="86" cy="238" r="2.4"/>
    <circle cx="108" cy="222" r="2.4"/><circle cx="108" cy="230" r="2.4"/><circle cx="108" cy="238" r="2.4"/><circle cx="116" cy="222" r="2.4"/><circle cx="116" cy="230" r="2.4"/><circle cx="116" cy="238" r="2.4"/>
    <circle cx="138" cy="222" r="2.4"/><circle cx="138" cy="230" r="2.4"/><circle cx="138" cy="238" r="2.4"/><circle cx="146" cy="222" r="2.4"/><circle cx="146" cy="230" r="2.4"/><circle cx="146" cy="238" r="2.4"/>
    <circle cx="168" cy="222" r="2.4"/><circle cx="168" cy="230" r="2.4"/><circle cx="168" cy="238" r="2.4"/><circle cx="176" cy="222" r="2.4"/><circle cx="176" cy="230" r="2.4"/><circle cx="176" cy="238" r="2.4"/>
  </g>
  <!-- angehobene Punkte: h(1,2,5) a(1) l(1,2,3) l(1,2,3) o(1,3,5) -->
  <g fill="#222">
    <circle cx="48" cy="222" r="3"/><circle cx="48" cy="230" r="3"/><circle cx="56" cy="230" r="3"/>
    <circle cx="78" cy="222" r="3"/>
    <circle cx="108" cy="222" r="3"/><circle cx="108" cy="230" r="3"/><circle cx="108" cy="238" r="3"/>
    <circle cx="138" cy="222" r="3"/><circle cx="138" cy="230" r="3"/><circle cx="138" cy="238" r="3"/>
    <circle cx="168" cy="222" r="3"/><circle cx="168" cy="238" r="3"/><circle cx="176" cy="230" r="3"/>
  </g>
  <text x="36" y="206" font-size="13" font-weight="700" fill="#222">Braille-Leiste</text>

  <!-- Fingerspitze -->
  <rect x="226" y="240" width="26" height="70" rx="13" fill="#f2d4b7" stroke="#8a5a00" stroke-width="1.5"/>
  <rect x="231" y="244" width="16" height="12" rx="5" fill="#fff"/>
  <text x="262" y="292" font-size="13" fill="#222">Fingerspitze</text>
  <text x="262" y="308" font-size="13" fill="#222">tastet</text>

  <!-- Vergrößerte Zelle -->
  <line x1="43" y1="244" x2="30" y2="280" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="61" y1="244" x2="190" y2="280" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="30" y="280" width="160" height="150" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="110" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#222">1 Zelle: 2 × 3 Punkte</text>
  <circle cx="90" cy="330" r="12" fill="#222"/>
  <circle cx="90" cy="365" r="12" fill="#222"/>
  <circle cx="90" cy="400" r="12" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <circle cx="130" cy="330" r="12" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <circle cx="130" cy="365" r="12" fill="#222"/>
  <circle cx="130" cy="400" r="12" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
  <line x1="144" y1="365" x2="204" y2="352" stroke="#555" stroke-width="1.5"/>
  <text x="208" y="356" font-size="14" font-weight="700" fill="#222">angehoben</text>
  <line x1="144" y1="400" x2="204" y2="404" stroke="#555" stroke-width="1.5"/>
  <text x="208" y="408" font-size="14" fill="#444">abgesenkt</text>
  <text x="200" y="456" text-anchor="middle" font-size="13" fill="#444">Braille-Zeilen am PC haben oft 2 × 4 Punkte je Zelle.</text>
</svg>
