<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui, sans-serif" font-size="14" fill="#222">
<title>Die sieben neuen Wörter als Bildliste. Oben: Alle Namen enden auf AN, das heißt Area Network, also Netz für ein Gebiet. Darunter je ein kleines Symbol mit Wort: Netzwerk, drei verbundene Computer. PAN, eine Person im Kreis, ca. 10 m. LAN, ein Haus, ein Gebäude. CAN, mehrere Gebäude auf einem Gelände. MAN, eine Stadt-Silhouette, Stadt oder Region. WAN, zwei weit entfernte Orte, weite Entfernungen. GAN, eine Weltkugel, weltweit.</title>
<rect width="400" height="520" fill="#fff"/>
<text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700">…AN = <tspan fill="#E07B00">A</tspan>rea <tspan fill="#E07B00">N</tspan>etwork</text>
<text x="200" y="52" text-anchor="middle" font-size="14" fill="#555">= Netz für ein Gebiet</text>
<g stroke="#ddd" stroke-width="1"><line x1="15" y1="70" x2="385" y2="70"/><line x1="15" y1="134" x2="385" y2="134"/><line x1="15" y1="196" x2="385" y2="196"/><line x1="15" y1="258" x2="385" y2="258"/><line x1="15" y1="320" x2="385" y2="320"/><line x1="15" y1="382" x2="385" y2="382"/><line x1="15" y1="444" x2="385" y2="444"/><line x1="15" y1="506" x2="385" y2="506"/></g>
<!-- Netzwerk -->
<g transform="translate(50,102)"><line x1="-20" y1="10" x2="20" y2="10" stroke="#3a6ed8" stroke-width="2.5"/><line x1="0" y1="-12" x2="0" y2="10" stroke="#3a6ed8" stroke-width="2.5"/><circle cx="-20" cy="10" r="7" fill="#3a6ed8"/><circle cx="20" cy="10" r="7" fill="#3a6ed8"/><circle cx="0" cy="-12" r="7" fill="#3a6ed8"/></g>
<text x="95" y="99" font-size="16" font-weight="700" fill="#1d3f8a">Netzwerk</text>
<text x="95" y="119" font-size="14">Computer verbunden, teilen etwas</text>
<!-- PAN -->
<g transform="translate(50,165)"><circle r="24" fill="#fde3c3" stroke="#E07B00" stroke-width="2" stroke-dasharray="4 3"/><circle cx="0" cy="-8" r="5" fill="#333"/><path d="M-8,12 Q-8,-1 0,-1 Q8,-1 8,12 Z" fill="#333"/></g>
<text x="95" y="161" font-size="16" font-weight="700" fill="#a85a00">PAN</text>
<text x="95" y="181" font-size="14">um eine Person, ca. 10 m</text>
<!-- LAN -->
<g transform="translate(50,229) scale(1.6)"><path d="M-11,-1 L0,-11 L11,-1 Z" fill="#c62828"/><rect x="-8" y="-1" width="16" height="12" fill="#fff" stroke="#333" stroke-width="1.5"/><rect x="-2" y="4" width="4" height="7" fill="#333"/></g>
<text x="95" y="223" font-size="16" font-weight="700" fill="#1d3f8a">LAN</text>
<text x="95" y="243" font-size="14">ein Gebäude</text>
<!-- CAN -->
<g transform="translate(50,289) scale(1.5)"><rect x="-16" y="-13" width="32" height="26" rx="3" fill="#f3f8ee" stroke="#2f6b4f" stroke-width="1.3" stroke-dasharray="3 2"/><rect x="-12" y="-4" width="7" height="13" fill="#fff" stroke="#333" stroke-width="1.2"/><rect x="-3" y="-9" width="7" height="18" fill="#fff" stroke="#333" stroke-width="1.2"/><rect x="6" y="-1" width="7" height="10" fill="#fff" stroke="#333" stroke-width="1.2"/></g>
<text x="95" y="285" font-size="16" font-weight="700" fill="#1d3f8a">CAN</text>
<text x="95" y="305" font-size="14">mehrere Gebäude, ein Firmengelände</text>
<!-- MAN -->
<g transform="translate(50,353) scale(1.5)"><rect x="-14" y="-2" width="6" height="12" fill="#555"/><rect x="-8" y="-10" width="6" height="20" fill="#555"/><rect x="-1" y="-4" width="6" height="14" fill="#555"/><rect x="5" y="-12" width="6" height="22" fill="#555"/></g>
<text x="95" y="347" font-size="16" font-weight="700" fill="#1d3f8a">MAN</text>
<text x="95" y="367" font-size="14">Stadt oder Region</text>
<!-- WAN -->
<g transform="translate(50,413) scale(1.5)"><path d="M-12,-8 L-4,-11 L4,-8 L12,-11 L12,9 L4,12 L-4,9 L-12,12 Z" fill="#e6efe0" stroke="#2f6b4f" stroke-width="1.3"/><circle cx="-6" cy="-2" r="2.5" fill="#c62828"/><circle cx="6" cy="4" r="2.5" fill="#c62828"/><line x1="-6" y1="-2" x2="6" y2="4" stroke="#c62828" stroke-width="1.5"/></g>
<text x="95" y="409" font-size="16" font-weight="700" fill="#1d3f8a">WAN</text>
<text x="95" y="429" font-size="14">weite Entfernungen</text>
<!-- GAN -->
<g transform="translate(50,475) scale(1.6)"><circle r="11" fill="#9cc3f5" stroke="#3a6ed8" stroke-width="1.3"/><ellipse rx="5" ry="11" fill="none" stroke="#3a6ed8" stroke-width="1.1"/><line x1="-11" x2="11" stroke="#3a6ed8" stroke-width="1.1"/><path d="M-7,-6 q4,-3 7,0 q-2,4 -6,3 z" fill="#2f6b4f"/><path d="M2,2 q5,-1 7,2 q-3,5 -6,4 z" fill="#2f6b4f"/></g>
<text x="95" y="471" font-size="16" font-weight="700" fill="#1d3f8a">GAN</text>
<text x="95" y="491" font-size="14">weltweit</text>
</svg>
