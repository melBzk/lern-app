<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, sans-serif" role="img">
  <title>So funktioniert eine VR-Brille, von oben gesehen. 1: Vor jedem Auge sitzt ein kleiner Bildschirm. 2: Jedes Auge sieht ein leicht anderes Bild, dadurch siehst du räumlich in 3D, genau wie deine zwei Augen im Alltag. 3: Drehst du den Kopf, dreht sich das Bild mit. Du fühlst dich mitten drin.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker></defs>
  <rect width="400" height="440" fill="#fff"/>
  <text x="200" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">VR-Brille von oben</text>

  <!-- zwei Bildschirme -->
  <rect x="100" y="52" width="80" height="58" rx="4" fill="#3a3f4a"/><rect x="106" y="58" width="68" height="46" fill="#dbeefc"/>
  <rect x="220" y="52" width="80" height="58" rx="4" fill="#3a3f4a"/><rect x="226" y="58" width="68" height="46" fill="#dbeefc"/>
  <!-- Wuerfel leicht versetzt -->
  <g fill="#E07B00" stroke="#8a4b00"><rect x="128" y="70" width="22" height="22"/><path d="M128,70 l8,-6 h22 l-8,6 z" fill="#f5a64a"/><path d="M150,70 l8,-6 v22 l-8,6 z" fill="#c46a00"/></g>
  <g fill="#E07B00" stroke="#8a4b00"><rect x="240" y="70" width="22" height="22"/><path d="M240,70 l8,-6 h22 l-8,6 z" fill="#f5a64a"/><path d="M262,70 l8,-6 v22 l-8,6 z" fill="#c46a00"/></g>
  <!-- Kopf -->
  <ellipse cx="200" cy="182" rx="64" ry="54" fill="#f1d3b5" stroke="#3a3f4a" stroke-width="2"/>
  <ellipse cx="140" cy="140" rx="14" ry="10" fill="#fff" stroke="#3a3f4a" stroke-width="2"/><circle cx="140" cy="138" r="5" fill="#3a3f4a"/>
  <ellipse cx="260" cy="140" rx="14" ry="10" fill="#fff" stroke="#3a3f4a" stroke-width="2"/><circle cx="260" cy="138" r="5" fill="#3a3f4a"/>
  <g stroke="#3a3f4a" stroke-width="1.5" stroke-dasharray="4 3"><line x1="140" y1="128" x2="140" y2="112"/><line x1="260" y1="128" x2="260" y2="112"/></g>

  <circle cx="30" cy="70" r="11" fill="#E07B00"/><text x="30" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="18" y="100" font-size="13" fill="#222">je Auge</text><text x="18" y="116" font-size="13" fill="#222">1 Bildschirm</text>
  <circle cx="370" cy="70" r="11" fill="#E07B00"/><text x="370" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="392" y="100" text-anchor="end" font-size="13" fill="#222">leicht anderes</text><text x="392" y="116" text-anchor="end" font-size="13" fill="#222">Bild je Auge</text>

  <rect x="96" y="250" width="208" height="40" rx="20" fill="#fff4e5" stroke="#E07B00" stroke-width="2"/>
  <text x="200" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#b35f00">→ räumlich (3D)</text>

  <!-- Kopf drehen -->
  <rect x="8" y="306" width="384" height="124" rx="12" fill="#f3f4f6" stroke="#bbb"/>
  <circle cx="30" cy="330" r="11" fill="#E07B00"/><text x="30" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <circle cx="90" cy="380" r="28" fill="#f1d3b5" stroke="#3a3f4a" stroke-width="2"/><rect x="66" y="348" width="48" height="12" rx="4" fill="#3a3f4a"/>
  <path d="M50,346 q40,-30 80,0" fill="none" stroke="#E07B00" stroke-width="3" marker-end="url(#a)"/>
  <text x="150" y="364" font-size="15" font-weight="700" fill="#222">Kopf dreht sich</text>
  <text x="150" y="388" font-size="15" font-weight="700" fill="#b35f00">→ Bild dreht mit</text>
  <text x="150" y="412" font-size="13" fill="#333">du fühlst dich „mitten drin“</text>
</svg>
