<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergrößerte microSD-Karte mit Aufdruck. 128 GB bedeutet die Kapazität. SDXC ist der Standard, bis 2 TB. Die 10 in einem offenen Kreis wie ein C ist die Geschwindigkeitsklasse Class 10: Die Karte schreibt mindestens 10 MB pro Sekunde.</title>
<defs>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="400" height="440" fill="#fff"/>
<text x="200" y="28" font-size="17" font-weight="700" text-anchor="middle">Was steht auf der Karte?</text>
<text x="102" y="52" font-size="13" text-anchor="middle" fill="#555">microSD, stark vergrößert</text>

<!-- Karte -->
<path d="M20,66 L185,66 L185,291 L20,291 L20,180 L36,164 L20,148 Z" fill="#333" stroke="#222" stroke-width="2"/>
<rect x="34" y="76" width="140" height="40" rx="4" fill="#3a6ed8"/>
<text x="104" y="104" text-anchor="middle" fill="#fff" font-weight="700" font-size="22">128 GB</text>
<text x="60" y="160" fill="#fff" font-weight="700" font-size="24" font-style="italic">SDXC</text>
<!-- Class 10: 10 in offenem Kreis (C-Form) -->
<path d="M126,212 A30,30 0 1 0 126,254" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<text x="102" y="244" text-anchor="middle" fill="#fff" font-weight="700" font-size="26">10</text>

<!-- Pfeile und Erklaerungen -->
<line x1="178" y1="96" x2="206" y2="96" stroke="#222" stroke-width="2" marker-end="url(#k)"/>
<text x="212" y="92" font-weight="700" font-size="15">128 GB</text>
<text x="212" y="112">→ Kapazität</text>

<line x1="146" y1="152" x2="206" y2="160" stroke="#222" stroke-width="2" marker-end="url(#k)"/>
<text x="212" y="156" font-weight="700" font-size="15">SDXC</text>
<text x="212" y="176">→ Standard</text>
<text x="212" y="194" fill="#444">(bis 2 TB)</text>

<line x1="138" y1="234" x2="206" y2="234" stroke="#c62828" stroke-width="2.5" marker-end="url(#k)"/>
<rect x="210" y="210" width="182" height="96" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="220" y="234" font-weight="700" font-size="15" fill="#c62828">10 im Kreis</text>
<text x="220" y="254">→ Class 10:</text>
<text x="220" y="274">schreibt mindestens</text>
<text x="220" y="294" font-weight="700">10 MB/s</text>

<!-- Merksatz -->
<rect x="10" y="330" width="380" height="96" rx="10" fill="#f3f3f3" stroke="#999" stroke-width="1.5"/>
<text x="200" y="356" text-anchor="middle" font-weight="700">Buchstaben = wie groß darf sie sein</text>
<text x="200" y="380" text-anchor="middle" font-weight="700" fill="#c62828">Zahl im Kreis = wie schnell schreibt sie</text>
<text x="200" y="404" text-anchor="middle" font-size="13" fill="#555">wichtig z. B. beim Filmen:</text>
<text x="200" y="420" text-anchor="middle" font-size="13" fill="#555">die Kamera schreibt ohne Pause</text>
</svg>
