<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Busbreite und Tricks für mehr Tempo. 1: Zwei Straßen, 32 Bit mit 32 dünnen Spuren gleich 4 Byte pro Transfer, 64 Bit mit 64 Spuren gleich 8 Byte pro Transfer; Schild: 64 Bit ist abwärtskompatibel. 2: Multiplex: Auf derselben Spur fahren abwechselnd Adresse und Daten, das kostet Zeit. 3: Burst: Ein Zug, nur die Lok trägt die Startadresse, dahinter folgen viele Waggons mit Daten.</title>
<rect width="400" height="560" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Busbreite und Tricks für mehr Tempo</text>

<text x="16" y="56" font-size="15" font-weight="700">1  Busbreite</text>
<text x="89" y="86" text-anchor="middle" font-size="17" font-weight="700">32 Bit</text>
<rect x="52" y="94" width="74" height="82" fill="#eceff1"/>
<g stroke="#3a6ed8" stroke-width="1"><line x1="58" y1="96" x2="58" y2="174"/><line x1="60" y1="96" x2="60" y2="174"/><line x1="62" y1="96" x2="62" y2="174"/><line x1="64" y1="96" x2="64" y2="174"/><line x1="66" y1="96" x2="66" y2="174"/><line x1="68" y1="96" x2="68" y2="174"/><line x1="70" y1="96" x2="70" y2="174"/><line x1="72" y1="96" x2="72" y2="174"/><line x1="74" y1="96" x2="74" y2="174"/><line x1="76" y1="96" x2="76" y2="174"/><line x1="78" y1="96" x2="78" y2="174"/><line x1="80" y1="96" x2="80" y2="174"/><line x1="82" y1="96" x2="82" y2="174"/><line x1="84" y1="96" x2="84" y2="174"/><line x1="86" y1="96" x2="86" y2="174"/><line x1="88" y1="96" x2="88" y2="174"/><line x1="90" y1="96" x2="90" y2="174"/><line x1="92" y1="96" x2="92" y2="174"/><line x1="94" y1="96" x2="94" y2="174"/><line x1="96" y1="96" x2="96" y2="174"/><line x1="98" y1="96" x2="98" y2="174"/><line x1="100" y1="96" x2="100" y2="174"/><line x1="102" y1="96" x2="102" y2="174"/><line x1="104" y1="96" x2="104" y2="174"/><line x1="106" y1="96" x2="106" y2="174"/><line x1="108" y1="96" x2="108" y2="174"/><line x1="110" y1="96" x2="110" y2="174"/><line x1="112" y1="96" x2="112" y2="174"/><line x1="114" y1="96" x2="114" y2="174"/><line x1="116" y1="96" x2="116" y2="174"/><line x1="118" y1="96" x2="118" y2="174"/><line x1="120" y1="96" x2="120" y2="174"/></g>
<text x="89" y="198" text-anchor="middle" font-weight="700">4 Byte</text>
<text x="89" y="216" text-anchor="middle" font-size="13">pro Transfer</text>
<text x="279" y="86" text-anchor="middle" font-size="17" font-weight="700">64 Bit</text>
<rect x="210" y="94" width="138" height="82" fill="#eceff1"/>
<g stroke="#3a6ed8" stroke-width="1"><line x1="216" y1="96" x2="216" y2="174"/><line x1="218" y1="96" x2="218" y2="174"/><line x1="220" y1="96" x2="220" y2="174"/><line x1="222" y1="96" x2="222" y2="174"/><line x1="224" y1="96" x2="224" y2="174"/><line x1="226" y1="96" x2="226" y2="174"/><line x1="228" y1="96" x2="228" y2="174"/><line x1="230" y1="96" x2="230" y2="174"/><line x1="232" y1="96" x2="232" y2="174"/><line x1="234" y1="96" x2="234" y2="174"/><line x1="236" y1="96" x2="236" y2="174"/><line x1="238" y1="96" x2="238" y2="174"/><line x1="240" y1="96" x2="240" y2="174"/><line x1="242" y1="96" x2="242" y2="174"/><line x1="244" y1="96" x2="244" y2="174"/><line x1="246" y1="96" x2="246" y2="174"/><line x1="248" y1="96" x2="248" y2="174"/><line x1="250" y1="96" x2="250" y2="174"/><line x1="252" y1="96" x2="252" y2="174"/><line x1="254" y1="96" x2="254" y2="174"/><line x1="256" y1="96" x2="256" y2="174"/><line x1="258" y1="96" x2="258" y2="174"/><line x1="260" y1="96" x2="260" y2="174"/><line x1="262" y1="96" x2="262" y2="174"/><line x1="264" y1="96" x2="264" y2="174"/><line x1="266" y1="96" x2="266" y2="174"/><line x1="268" y1="96" x2="268" y2="174"/><line x1="270" y1="96" x2="270" y2="174"/><line x1="272" y1="96" x2="272" y2="174"/><line x1="274" y1="96" x2="274" y2="174"/><line x1="276" y1="96" x2="276" y2="174"/><line x1="278" y1="96" x2="278" y2="174"/><line x1="280" y1="96" x2="280" y2="174"/><line x1="282" y1="96" x2="282" y2="174"/><line x1="284" y1="96" x2="284" y2="174"/><line x1="286" y1="96" x2="286" y2="174"/><line x1="288" y1="96" x2="288" y2="174"/><line x1="290" y1="96" x2="290" y2="174"/><line x1="292" y1="96" x2="292" y2="174"/><line x1="294" y1="96" x2="294" y2="174"/><line x1="296" y1="96" x2="296" y2="174"/><line x1="298" y1="96" x2="298" y2="174"/><line x1="300" y1="96" x2="300" y2="174"/><line x1="302" y1="96" x2="302" y2="174"/><line x1="304" y1="96" x2="304" y2="174"/><line x1="306" y1="96" x2="306" y2="174"/><line x1="308" y1="96" x2="308" y2="174"/><line x1="310" y1="96" x2="310" y2="174"/><line x1="312" y1="96" x2="312" y2="174"/><line x1="314" y1="96" x2="314" y2="174"/><line x1="316" y1="96" x2="316" y2="174"/><line x1="318" y1="96" x2="318" y2="174"/><line x1="320" y1="96" x2="320" y2="174"/><line x1="322" y1="96" x2="322" y2="174"/><line x1="324" y1="96" x2="324" y2="174"/><line x1="326" y1="96" x2="326" y2="174"/><line x1="328" y1="96" x2="328" y2="174"/><line x1="330" y1="96" x2="330" y2="174"/><line x1="332" y1="96" x2="332" y2="174"/><line x1="334" y1="96" x2="334" y2="174"/><line x1="336" y1="96" x2="336" y2="174"/><line x1="338" y1="96" x2="338" y2="174"/><line x1="340" y1="96" x2="340" y2="174"/><line x1="342" y1="96" x2="342" y2="174"/></g>
<text x="279" y="198" text-anchor="middle" font-weight="700">8 Byte</text>
<text x="279" y="216" text-anchor="middle" font-size="13">pro Transfer</text>
<rect x="30" y="230" width="340" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="200" y="251" text-anchor="middle" font-weight="700" fill="#1b5e20">64 Bit ist abwärtskompatibel:</text>
<text x="200" y="270" text-anchor="middle" font-size="13">32 und 64 Bit laufen nebeneinander</text>

<text x="16" y="316" font-size="15" font-weight="700">2  Multiplex: dieselben Leitungen</text>
<rect x="12" y="328" width="376" height="40" rx="4" fill="#eceff1"/>
<rect x="20" y="334" width="72" height="28" rx="4" fill="#E07B00"/><text x="56" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Adresse</text>
<rect x="100" y="334" width="60" height="28" rx="4" fill="#3a6ed8"/><text x="130" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Daten</text>
<rect x="168" y="334" width="72" height="28" rx="4" fill="#E07B00"/><text x="204" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Adresse</text>
<rect x="248" y="334" width="60" height="28" rx="4" fill="#3a6ed8"/><text x="278" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Daten</text>
<line x1="318" y1="348" x2="366" y2="348" stroke="#555" stroke-width="3.5"/><path d="M364,341 L378,348 L364,355 Z" fill="#555"/>
<text x="16" y="390" font-size="13">Adresse und Daten wechseln sich ab – kostet Zeit.</text>
<text x="16" y="408" font-size="13">Hoher Takt und breiter Bus gleichen das aus.</text>

<text x="16" y="444" font-size="15" font-weight="700">3  Burst: Adresse nur einmal</text>
<rect x="12" y="458" width="92" height="44" rx="6" fill="#E07B00"/>
<text x="58" y="477" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Start-</text>
<text x="58" y="494" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">adresse</text>
<g fill="#3a6ed8"><rect x="112" y="466" width="62" height="36" rx="4"/><rect x="180" y="466" width="62" height="36" rx="4"/><rect x="248" y="466" width="62" height="36" rx="4"/><rect x="316" y="466" width="62" height="36" rx="4"/></g>
<g font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><text x="143" y="489">Daten</text><text x="211" y="489">Daten</text><text x="279" y="489">Daten</text><text x="347" y="489">Daten</text></g>
<g fill="#555"><circle cx="34" cy="508" r="6"/><circle cx="82" cy="508" r="6"/><circle cx="128" cy="508" r="6"/><circle cx="158" cy="508" r="6"/><circle cx="196" cy="508" r="6"/><circle cx="226" cy="508" r="6"/><circle cx="264" cy="508" r="6"/><circle cx="294" cy="508" r="6"/><circle cx="332" cy="508" r="6"/><circle cx="362" cy="508" r="6"/></g>
<text x="16" y="540" font-size="13">Danach fließen nur noch Daten – ohne neue Adresse.</text>
</svg>
