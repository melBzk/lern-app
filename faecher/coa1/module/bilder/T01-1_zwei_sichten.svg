<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" font-family="system-ui, sans-serif" font-size="14" fill="#222" role="img">
<title>Zwei Sichten auf den PC. Oben Sicht 1, kleinster Computer: CPU plus RAM, orange umrahmt. Unten Sicht 2, Bauplan nach von Neumann: CPU mit Steuerwerk und Rechenwerk, daneben der Speicher, im PC der Arbeitsspeicher. Diese beiden sind orange gestrichelt als Kern markiert. Darunter verbindet das Bussystem alles mit der Ein-/Ausgabe. Merksatz: Der Kern von Sicht 2 ist Sicht 1.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a6ed8"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<rect width="400" height="488" fill="#fff"/>
<text x="200" y="28" font-size="17" text-anchor="middle" font-weight="700" fill="#222">Zwei Sichten, ein PC</text>
<text x="20" y="60" font-size="16" font-weight="700" fill="#222">Sicht 1: kleinster Computer</text>
<rect x="20" y="70" width="360" height="80" rx="12" fill="#fff" stroke="#E07B00" stroke-width="3"/>
<line x1="106.0" y1="84.0" x2="106.0" y2="90.0" stroke="#555" stroke-width="2"/><line x1="106.0" y1="130.0" x2="106.0" y2="136.0" stroke="#555" stroke-width="2"/><line x1="94.0" y1="96.0" x2="100.0" y2="96.0" stroke="#555" stroke-width="2"/><line x1="140.0" y1="96.0" x2="146.0" y2="96.0" stroke="#555" stroke-width="2"/><line x1="115.3" y1="84.0" x2="115.3" y2="90.0" stroke="#555" stroke-width="2"/><line x1="115.3" y1="130.0" x2="115.3" y2="136.0" stroke="#555" stroke-width="2"/><line x1="94.0" y1="105.3" x2="100.0" y2="105.3" stroke="#555" stroke-width="2"/><line x1="140.0" y1="105.3" x2="146.0" y2="105.3" stroke="#555" stroke-width="2"/><line x1="124.7" y1="84.0" x2="124.7" y2="90.0" stroke="#555" stroke-width="2"/><line x1="124.7" y1="130.0" x2="124.7" y2="136.0" stroke="#555" stroke-width="2"/><line x1="94.0" y1="114.7" x2="100.0" y2="114.7" stroke="#555" stroke-width="2"/><line x1="140.0" y1="114.7" x2="146.0" y2="114.7" stroke="#555" stroke-width="2"/><line x1="134.0" y1="84.0" x2="134.0" y2="90.0" stroke="#555" stroke-width="2"/><line x1="134.0" y1="130.0" x2="134.0" y2="136.0" stroke="#555" stroke-width="2"/><line x1="94.0" y1="124.0" x2="100.0" y2="124.0" stroke="#555" stroke-width="2"/><line x1="140.0" y1="124.0" x2="146.0" y2="124.0" stroke="#555" stroke-width="2"/><rect x="100.0" y="90.0" width="40" height="40" rx="3" fill="#3a6ed8" stroke="#1f3f80" stroke-width="1.5"/><text x="120" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">CPU</text>
<text x="200" y="116" font-size="24" text-anchor="middle" font-weight="700" fill="#222">+</text>
<rect x="238.0" y="100" width="84" height="20" rx="2" fill="#f3e8fa" stroke="#7b3fa0" stroke-width="1.5"/><rect x="243.0" y="104" width="14.5" height="10" rx="1" fill="#333" stroke="none" stroke-width="0"/><rect x="261.5" y="104" width="14.5" height="10" rx="1" fill="#333" stroke="none" stroke-width="0"/><rect x="280.0" y="104" width="14.5" height="10" rx="1" fill="#333" stroke="none" stroke-width="0"/><rect x="298.5" y="104" width="14.5" height="10" rx="1" fill="#333" stroke="none" stroke-width="0"/><line x1="241.0" y1="118" x2="319.0" y2="118" stroke="#c9a227" stroke-width="2"/>
<text x="280" y="140" font-size="13" text-anchor="middle" font-weight="700" fill="#7b3fa0">RAM</text>
<text x="20" y="186" font-size="16" font-weight="700" fill="#222">Sicht 2: Bauplan nach von Neumann</text>
<rect x="20" y="196" width="360" height="250" rx="12" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<rect x="32" y="206" width="336" height="134" rx="10" fill="none" stroke="#E07B00" stroke-width="3" stroke-dasharray="8 5"/>
<rect x="44" y="222" width="170" height="86" rx="8" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<text x="129" y="242" font-size="14" text-anchor="middle" font-weight="700" fill="#3a6ed8">CPU</text>
<rect x="54" y="250" width="70" height="46" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/><text x="89" y="278" font-size="13" text-anchor="middle" fill="#222">Steuer-</text>
<text x="89" y="292" font-size="13" text-anchor="middle" fill="#222">werk</text>
<rect x="134" y="250" width="70" height="46" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/><text x="169" y="278" font-size="13" text-anchor="middle" fill="#222">Rechen-</text>
<text x="169" y="292" font-size="13" text-anchor="middle" fill="#222">werk</text>
<rect x="232" y="222" width="124" height="86" rx="8" fill="#f3e8fa" stroke="#7b3fa0" stroke-width="2"/>
<text x="294" y="254" font-size="14" text-anchor="middle" font-weight="700" fill="#7b3fa0">Speicher</text>
<text x="294" y="274" font-size="13" text-anchor="middle" fill="#222">= Arbeits-</text>
<text x="294" y="290" font-size="13" text-anchor="middle" fill="#222">speicher</text>
<text x="200" y="330" font-size="14" text-anchor="middle" font-weight="700" fill="#a85400">Kern</text>
<rect x="44" y="356" width="312" height="18" rx="4" fill="#ccc" stroke="#777" stroke-width="1.5"/>
<text x="200" y="370" font-size="13" text-anchor="middle" font-weight="700" fill="#222">Bussystem</text>
<line x1="129" y1="340" x2="129" y2="356" stroke="#777" stroke-width="3"/><line x1="294" y1="340" x2="294" y2="356" stroke="#777" stroke-width="3"/><line x1="200" y1="374" x2="200" y2="390" stroke="#777" stroke-width="3"/>
<rect x="110" y="390" width="180" height="44" rx="8" fill="#f1f3f5" stroke="#777" stroke-width="2"/>
<text x="200" y="418" font-size="14" text-anchor="middle" font-weight="700" fill="#222">Ein-/Ausgabe</text>
<text x="200" y="470" font-size="15" text-anchor="middle" font-weight="700" fill="#a85400">Kern von Sicht 2 = Sicht 1</text>
</svg>
