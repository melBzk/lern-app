<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Den richtigen Anschluss erkennen. Oben ein Ausschnitt aus einem Festplatten-Datenblatt, markiert ist die Zeile Schnittstelle: SAS, 1200 MB/s. Daneben zwei Prüffragen: Server hat SAS-Controller? Ja, passt. PC mit nur SATA? Nein, passt nicht. Unten ein Mainboard-Handbuch mit dem Hinweis, zum Beispiel: M.2 belegt, dann sind SATA 5 und 6 aus.</title>
<rect width="400" height="470" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Passt der Anschluss?</text>

<!-- Datenblatt -->
<rect x="14" y="44" width="372" height="120" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="14" y="44" width="372" height="28" rx="6" fill="#e8f0fe" stroke="#555" stroke-width="2"/>
<text x="28" y="63" font-size="14" font-weight="700">Datenblatt Festplatte</text>
<text x="28" y="94" font-size="13" fill="#444">Kapazität: …</text>
<rect x="22" y="106" width="356" height="30" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="2.5"/>
<text x="32" y="127" font-size="15" font-weight="700">Schnittstelle: <tspan fill="#c62828">SAS, 1200 MB/s</tspan></text>
<text x="28" y="154" font-size="13" fill="#444">…</text>

<!-- Prüffragen -->
<rect x="14" y="180" width="180" height="110" rx="10" fill="#eceff1"/>
<text x="104" y="210" text-anchor="middle" font-size="14" font-weight="700">Server hat</text>
<text x="104" y="228" text-anchor="middle" font-size="14" font-weight="700">SAS-Controller?</text>
<circle cx="104" cy="258" r="18" fill="#2e7d32"/>
<path d="M95,258 l6,6 l12,-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="206" y="180" width="180" height="110" rx="10" fill="#eceff1"/>
<text x="296" y="210" text-anchor="middle" font-size="14" font-weight="700">PC mit</text>
<text x="296" y="228" text-anchor="middle" font-size="14" font-weight="700">nur SATA?</text>
<circle cx="296" cy="258" r="18" fill="#c62828"/>
<path d="M288,250 l16,16 M304,250 l-16,16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

<!-- Mainboard-Handbuch -->
<rect x="14" y="306" width="372" height="150" rx="10" fill="#eceff1"/>
<path d="M30,330 q40,-10 70,4 v96 q-30,-14 -70,-4 z" fill="#fff" stroke="#555" stroke-width="2"/>
<path d="M170,330 q-40,-10 -70,4 v96 q30,-14 70,-4 z" fill="#fff" stroke="#555" stroke-width="2"/>
<g stroke="#9aa5b1" stroke-width="2"><line x1="40" y1="352" x2="90" y2="356"/><line x1="40" y1="368" x2="90" y2="372"/><line x1="40" y1="384" x2="90" y2="388"/><line x1="110" y1="356" x2="160" y2="352"/><line x1="110" y1="372" x2="160" y2="368"/><line x1="110" y1="388" x2="160" y2="384"/></g>
<text x="100" y="448" text-anchor="middle" font-size="13" fill="#444">Mainboard-Handbuch</text>
<text x="280" y="346" text-anchor="middle" font-size="13" fill="#444">z. B.:</text>
<text x="280" y="372" text-anchor="middle" font-size="15" font-weight="700">M.2 belegt</text>
<text x="280" y="396" text-anchor="middle" font-size="18" font-weight="700">↓</text>
<text x="280" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">SATA 5/6 aus</text>
</svg>
