<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Mainboard-Ausschnitt mit vier DIMM-Steckplätzen: zwei blaue für die ältere Generation, zwei schwarze für die neue Generation. Die Stege in den Steckplätzen (rot) sitzen bei beiden Paaren an anderer Stelle. Darüber ein Riegel, dessen Kerbe nur zum Steg der neuen Generation passt (grüner Haken). Bei der älteren Generation stößt die Kerbe auf den Steg (rotes X). Notizzettel: Beide gleichzeitig nutzen? Ins Handbuch schauen. Positionen schematisch.</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="24" text-anchor="middle" font-size="17" font-weight="700">Welcher Steckplatz passt?</text>

<!-- Riegel -->
<text x="50" y="50" font-weight="700">Riegel (neue Generation)</text>
<path d="M50,58 H350 V128 H217 V116 H205 V128 H50 Z" fill="#2e7d32"/>
<g fill="#1a1a1a"><rect x="64" y="66" width="30" height="30"/><rect x="106" y="66" width="30" height="30"/><rect x="148" y="66" width="30" height="30"/><rect x="222" y="66" width="30" height="30"/><rect x="264" y="66" width="30" height="30"/><rect x="306" y="66" width="30" height="30"/></g>
<line x1="56" y1="120" x2="203" y2="120" stroke="#c9a227" stroke-width="14" stroke-dasharray="4 2"/>
<line x1="219" y1="120" x2="344" y2="120" stroke="#c9a227" stroke-width="14" stroke-dasharray="4 2"/>
<text x="211" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#D4607A">Kerbe</text>
<line x1="211" y1="152" x2="211" y2="290" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>

<!-- Mainboard -->
<rect x="10" y="160" width="380" height="146" rx="8" fill="#eef3ee" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="50" y="180" font-size="13" font-weight="700" fill="#3a6ed8">ältere Generation</text>
<g fill="#3a6ed8"><rect x="50" y="186" width="300" height="16" rx="3"/><rect x="50" y="208" width="300" height="16" rx="3"/></g>
<text x="50" y="248" font-size="13" font-weight="700">neue Generation</text>
<g fill="#111"><rect x="50" y="254" width="300" height="16" rx="3"/><rect x="50" y="276" width="300" height="16" rx="3"/></g>
<g fill="#c62828"><rect x="262" y="186" width="10" height="16"/><rect x="262" y="208" width="10" height="16"/><rect x="206" y="254" width="10" height="16"/><rect x="206" y="276" width="10" height="16"/></g>
<text x="267" y="180" text-anchor="middle" font-size="13" fill="#c62828">Steg</text>
<text x="226" y="248" font-size="13" fill="#c62828">Steg</text>
<g fill="none" stroke-width="4" stroke-linecap="round">
<path d="M360,198 l16,16 M376,198 l-16,16" stroke="#c62828"/>
<path d="M358,273 l7,7 l13,-15" stroke="#2e7d32"/>
</g>

<!-- Notizzettel -->
<path d="M70,326 H330 V384 L316,398 H70 Z" fill="#fff8d6" stroke="#c9a227" stroke-width="1.5"/>
<text x="200" y="352" text-anchor="middle" font-size="15" font-weight="700">Beide gleichzeitig nutzen?</text>
<text x="200" y="376" text-anchor="middle" font-size="15">→ Handbuch</text>
<text x="390" y="414" text-anchor="end" font-size="13" fill="#555">Positionen schematisch</text>
</svg>
