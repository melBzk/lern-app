<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 448" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>TDP – wie viel Wärme weg muss. Ein Prozessor mit dem Schild TDP 45 W; rote Wärmepfeile steigen nach oben in einen Kühlkörper mit Lüfter: Die Kühlung muss 45 W Wärme abführen. Darunter drei Balken zum Vergleich: 15 W beim Ryzen 7 PRO 4750U, 45 W beim Laptop aus dem Unterricht, 125 W beim Core i9-10900K.</title>
<defs>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="400" height="448" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">TDP – wie viel Wärme weg muss</text>

<!-- Lüfter -->
<rect x="40" y="44" width="150" height="34" rx="6" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2"/>
<circle cx="115" cy="61" r="13" fill="none" stroke="#3a6ed8" stroke-width="2.5"/>
<path d="M115,61 L115,50 M115,61 L125,67 M115,61 L105,67" stroke="#3a6ed8" stroke-width="3" stroke-linecap="round"/>
<!-- Kühlkörper -->
<g fill="#9aa5b1">
<rect x="44" y="82" width="8" height="38"/><rect x="60" y="82" width="8" height="38"/><rect x="76" y="82" width="8" height="38"/><rect x="92" y="82" width="8" height="38"/><rect x="108" y="82" width="8" height="38"/><rect x="124" y="82" width="8" height="38"/><rect x="140" y="82" width="8" height="38"/><rect x="156" y="82" width="8" height="38"/><rect x="172" y="82" width="8" height="38"/>
<rect x="40" y="120" width="150" height="10"/>
</g>

<!-- Wärmepfeile -->
<path d="M75,196 C65,180 85,168 75,150 L75,136" fill="none" stroke="#c62828" stroke-width="3.5" marker-end="url(#r)"/>
<path d="M115,196 C105,180 125,168 115,150 L115,136" fill="none" stroke="#c62828" stroke-width="3.5" marker-end="url(#r)"/>
<path d="M155,196 C145,180 165,168 155,150 L155,136" fill="none" stroke="#c62828" stroke-width="3.5" marker-end="url(#r)"/>

<!-- Prozessor -->
<rect x="50" y="200" width="130" height="44" rx="5" fill="#555"/>
<rect x="68" y="208" width="94" height="28" rx="4" fill="#fff"/>
<text x="115" y="228" font-size="16" text-anchor="middle" font-weight="700" fill="#c62828">TDP 45 W</text>

<!-- Beschriftung -->
<text x="206" y="146" font-size="15" font-weight="700">Kühlung muss</text>
<text x="206" y="166" font-size="15" font-weight="700" fill="#c62828">45 W Wärme</text>
<text x="206" y="186" font-size="15" font-weight="700">abführen</text>

<line x1="10" y1="266" x2="390" y2="266" stroke="#ccc" stroke-width="1.5"/>
<text x="20" y="290" font-size="15" font-weight="700">Zum Vergleich</text>

<!-- Balken: 125 W = 360 px -->
<text x="20" y="316" font-size="14"><tspan font-weight="700">15 W</tspan> – Ryzen 7 PRO 4750U</text>
<rect x="20" y="322" width="43" height="20" rx="3" fill="#9aa5b1"/>
<text x="20" y="362" font-size="14"><tspan font-weight="700">45 W</tspan> – Laptop aus dem Unterricht</text>
<rect x="20" y="368" width="130" height="20" rx="3" fill="#c62828"/>
<text x="20" y="408" font-size="14"><tspan font-weight="700">125 W</tspan> – Core i9-10900K</text>
<rect x="20" y="414" width="360" height="20" rx="3" fill="#9aa5b1"/>
</svg>
