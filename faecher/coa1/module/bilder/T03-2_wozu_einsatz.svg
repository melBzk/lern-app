<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Wozu: Hardware passend zum Einsatz auswählen. Schritt 1, erste Frage: Wofür wird das Gerät gebraucht? Drei Wege mit Symbolen: Büro, Server, Kleingerät. Schritt 2: Daraus folgt die Reihe. Schritt 3: einzelne Modelle nach Datenblatt vergleichen, das kommt in Block 4. Am Ende: Auswahl begründen (AP1).</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">AP1: passend zum Einsatz wählen</text>
<circle cx="30" cy="66" r="14" fill="#3a6ed8"/><text x="30" y="71" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<rect x="54" y="46" width="300" height="40" rx="20" fill="#fff4e0" stroke="#E07B00" stroke-width="2.5"/>
<text x="204" y="72" text-anchor="middle" font-size="16" font-weight="700">Wofür wird es gebraucht?</text>
<path d="M150,88 L80,122 M204,88 V122 M258,88 L328,122" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="128" width="100" height="78" rx="10" fill="#f4f5f7"/>
<rect x="62" y="140" width="36" height="24" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><rect x="74" y="164" width="12" height="6" fill="#555"/>
<text x="80" y="194" text-anchor="middle" font-size="15" font-weight="700">Büro</text>
<rect x="150" y="128" width="100" height="78" rx="10" fill="#f4f5f7"/>
<rect x="186" y="136" width="28" height="38" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M190,146 H210 M190,156 H210 M190,166 H210" stroke="#555" stroke-width="2"/>
<text x="200" y="194" text-anchor="middle" font-size="15" font-weight="700">Server</text>
<rect x="270" y="128" width="100" height="78" rx="10" fill="#f4f5f7"/>
<rect x="306" y="144" width="20" height="20" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M332,146 q6,8 0,16 M338,142 q9,12 0,24" stroke="#2f9e44" stroke-width="2.5" fill="none"/>
<text x="320" y="194" text-anchor="middle" font-size="15" font-weight="700">Kleingerät</text>
<path d="M80,208 L180,240 M200,208 V240 M320,208 L220,240" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<circle cx="30" cy="266" r="14" fill="#3a6ed8"/><text x="30" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<rect x="54" y="246" width="300" height="40" rx="10" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="2"/>
<text x="204" y="272" text-anchor="middle" font-size="16" font-weight="700">daraus folgt die Reihe</text>
<line x1="204" y1="288" x2="204" y2="310" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<circle cx="30" cy="336" r="14" fill="#3a6ed8"/><text x="30" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
<rect x="54" y="316" width="300" height="40" rx="10" fill="#f4f5f7" stroke="#9aa3ad" stroke-width="1.5"/>
<text x="204" y="342" text-anchor="middle" font-size="15">Modelle nach Datenblatt (Block 4)</text>
<text x="200" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#c25e00">… und die Auswahl begründen</text>
</svg>
