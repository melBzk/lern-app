<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Ausgangslage, ohne Lösung: Auftragszettel einer kleinen Firma mit drei Wünschen. a: fünf Büro-PCs für Mail und Texte. b: ein Server für die Firmendaten. c: ein vernetzter Sensor im Lager, der die Temperatur meldet. Neben jedem Wunsch ein leeres Feld: Reihe?</title>
<rect width="400" height="420" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">Drei Wünsche – welche Reihe?</text>
<rect x="10" y="44" width="380" height="110" rx="10" fill="#f4f5f7"/>
<text x="24" y="70" font-size="16" font-weight="700" fill="#3a6ed8">a</text>
<g><rect x="44" y="60" width="24" height="18" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="72" y="60" width="24" height="18" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="100" y="60" width="24" height="18" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="128" y="60" width="24" height="18" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="156" y="60" width="24" height="18" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/></g>
<text x="44" y="106" font-size="15" font-weight="700">5 Büro-PCs</text>
<text x="44" y="128" font-size="14">für Mail und Texte</text>
<rect x="250" y="84" width="124" height="40" rx="8" fill="#fff" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="6 4"/><text x="312" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#c25e00">Reihe?</text>
<rect x="10" y="162" width="380" height="110" rx="10" fill="#f4f5f7"/>
<text x="24" y="188" font-size="16" font-weight="700" fill="#3a6ed8">b</text>
<rect x="46" y="176" width="30" height="50" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M51,188 H71 M51,200 H71 M51,212 H71" stroke="#555" stroke-width="2"/>
<text x="90" y="206" font-size="15" font-weight="700">1 Server</text>
<text x="44" y="250" font-size="14">für die Firmendaten</text>
<rect x="250" y="202" width="124" height="40" rx="8" fill="#fff" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="6 4"/><text x="312" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#c25e00">Reihe?</text>
<rect x="10" y="280" width="380" height="126" rx="10" fill="#f4f5f7"/>
<text x="24" y="306" font-size="16" font-weight="700" fill="#3a6ed8">c</text>
<rect x="48" y="296" width="22" height="22" rx="3" fill="#fff" stroke="#555" stroke-width="2"/><path d="M76,298 q6,8 0,16 M82,294 q9,12 0,24" stroke="#2f9e44" stroke-width="2.5" fill="none"/>
<rect x="104" y="294" width="10" height="28" rx="5" fill="#fff" stroke="#555" stroke-width="1.5"/><circle cx="109" cy="324" r="6" fill="#c62828"/>
<text x="44" y="350" font-size="15" font-weight="700">Sensor im Lager</text>
<text x="44" y="372" font-size="14">vernetzt, meldet</text>
<text x="44" y="390" font-size="14">die Temperatur</text>
<rect x="250" y="330" width="124" height="40" rx="8" fill="#fff" stroke="#E07B00" stroke-width="2.5" stroke-dasharray="6 4"/><text x="312" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#c25e00">Reihe?</text>
</svg>
