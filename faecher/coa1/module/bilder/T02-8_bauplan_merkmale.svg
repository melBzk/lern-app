<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, sans-serif" fill="#222">
<title>Fünf Merkmale des Von-Neumann-Bauplans: 1. Eine Maschine für alle Aufgaben, universell. 2. Arbeitet nach dem EVA-Prinzip: Eingabe, Verarbeitung, Ausgabe. 3. Daten und Programme liegen im selben Speicher. 4. Befehle nacheinander, sequenziell. 5. Steuerwerk und Rechenwerk stecken in einem Baustein, der CPU.</title>
<rect width="400" height="400" fill="#fff"/>
<text x="200" y="28" text-anchor="middle" font-size="17" font-weight="700">5 Merkmale des Bauplans</text>
<g fill="#f4f1ee"><rect x="10" y="42" width="380" height="66" rx="10"/><rect x="10" y="114" width="380" height="66" rx="10"/><rect x="10" y="186" width="380" height="66" rx="10"/><rect x="10" y="258" width="380" height="66" rx="10"/><rect x="10" y="330" width="380" height="66" rx="10"/></g>
<!-- 1 universell -->
<rect x="34" y="52" width="46" height="34" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
<g fill="#3a6ed8"><rect x="40" y="58" width="10" height="8"/><rect x="54" y="58" width="10" height="8"/><rect x="68" y="58" width="6" height="8"/><rect x="40" y="70" width="34" height="8"/></g>
<text x="104" y="70" font-size="15" font-weight="700">eine Maschine für alles</text>
<text x="104" y="92" font-size="13">universell</text>
<!-- 2 EVA -->
<g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
<rect x="18" y="130" width="22" height="30" rx="3" fill="#3a6ed8"/><text x="29" y="150">E</text>
<rect x="46" y="130" width="22" height="30" rx="3" fill="#D4607A"/><text x="57" y="150">V</text>
<rect x="74" y="130" width="22" height="30" rx="3" fill="#2e9d5b"/><text x="85" y="150">A</text>
</g>
<text x="104" y="142" font-size="15" font-weight="700">EVA-Prinzip</text>
<text x="104" y="164" font-size="13">Eingabe – Verarbeitung – Ausgabe</text>
<!-- 3 Speicher -->
<rect x="24" y="196" width="66" height="46" rx="3" fill="#fff" stroke="#555" stroke-width="2"/>
<rect x="30" y="202" width="54" height="15" fill="#fff3c4"/><rect x="30" y="221" width="54" height="15" fill="#e3ecfb"/>
<text x="104" y="214" font-size="15" font-weight="700">ein Speicher für beides</text>
<text x="104" y="236" font-size="13">Daten und Programme zusammen</text>
<!-- 4 nacheinander -->
<g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="30" cy="291" r="11" fill="#777"/><text x="30" y="296">1</text>
<circle cx="57" cy="291" r="11" fill="#777"/><text x="57" y="296">2</text>
<circle cx="84" cy="291" r="11" fill="#777"/><text x="84" y="296">3</text>
</g>
<text x="104" y="286" font-size="15" font-weight="700">nacheinander</text>
<text x="104" y="308" font-size="13">Fachwort: sequenziell</text>
<!-- 5 CPU -->
<rect x="22" y="338" width="70" height="50" rx="4" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="28" y="348" width="27" height="30" rx="3" fill="#fbe3e8" stroke="#D4607A" stroke-width="1.5"/>
<rect x="59" y="348" width="27" height="30" rx="3" fill="#e3ecfb" stroke="#3a6ed8" stroke-width="1.5"/>
<text x="104" y="358" font-size="15" font-weight="700">Steuer- + Rechenwerk</text>
<text x="104" y="380" font-size="13">zusammen in einem Baustein: CPU</text>
</svg>
