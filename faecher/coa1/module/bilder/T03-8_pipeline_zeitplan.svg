<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 382" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Pipeline-Zeitplan, Takt 1 bis 7. Befehl 1 belegt Takt 1 bis 5 mit L laden, D decodieren, O Operanden laden, A ausführen, S zurückspeichern. Befehl 2 ist um 1 Takt versetzt (Takt 2 bis 6), Befehl 3 um 2 Takte (Takt 3 bis 7). Rahmen um Takt 3: hier arbeiten 3 Einheiten gleichzeitig. Ab Takt 5 wird in jedem Takt ein Befehl fertig.</title>
