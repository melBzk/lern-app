<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Vergleich PCI und PCI Express. Oben PCI, alt: parallel, ein gemeinsamer Bus aus mehreren Leitungen, an dem drei Karten hängen; alle teilen sich den Weg. Unten PCI Express, neu: seriell und Punkt-zu-Punkt. In der Mitte ein Switch im Chipsatz, von dort führt zu jeder der drei Karten eine eigene Verbindung mit zwei Pfeilen in Gegenrichtung: vollduplex, hin und zurück gleichzeitig.</title>
<rect width="400" height="570" fill="#fff"/>

<!-- PCI alt -->
<text x="16" y="30" font-size="17" font-weight="700">PCI (alt)</text>
<text x="16" y="52">parallel, ein gemeinsamer Bus</text>
<g stroke="#9aa5b1" stroke-width="4">
<line x1="16" y1="82" x2="384" y2="82"/><line x1="16" y1="91" x2="384" y2="91"/><line x1="16" y1="100" x2="384" y2="100"/><line x1="16" y1="109" x2="384" y2="109"/>
<line x1="85" y1="109" x2="85" y2="150"/><line x1="200" y1="109" x2="200" y2="150"/><line x1="315" y1="109" x2="315" y2="150"/>
</g>
<g fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2">
<rect x="40" y="150" width="90" height="48" rx="5"/><rect x="155" y="150" width="90" height="48" rx="5"/><rect x="270" y="150" width="90" height="48" rx="5"/>
</g>
<g text-anchor="middle" font-weight="700"><text x="85" y="179">Karte</text><text x="200" y="179">Karte</text><text x="315" y="179">Karte</text></g>
<text x="200" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#c62828">alle teilen sich den Weg</text>

<line x1="10" y1="256" x2="390" y2="256" stroke="#ccc" stroke-width="1.5"/>

<!-- PCIe neu -->
<text x="16" y="286" font-size="17" font-weight="700">PCI Express (neu)</text>
<text x="16" y="308">seriell, Punkt-zu-Punkt</text>

<!-- Verbindungen (hinter den Kästen) -->
<g stroke="#3a6ed8" stroke-width="3">
<line x1="203.5" y1="368.6" x2="78.5" y2="488.6"/><line x1="196.5" y1="361.4" x2="71.5" y2="481.4"/>
<line x1="205" y1="365" x2="205" y2="485"/><line x1="195" y1="365" x2="195" y2="485"/>
<line x1="196.5" y1="368.6" x2="321.5" y2="488.6"/><line x1="203.5" y1="361.4" x2="328.5" y2="481.4"/>
</g>
<rect x="120" y="330" width="160" height="60" rx="8" fill="#fff3e0" stroke="#E07B00" stroke-width="2.5"/>
<text x="200" y="356" text-anchor="middle" font-size="16" font-weight="700">Switch</text>
<text x="200" y="377" text-anchor="middle">im Chipsatz</text>
<g fill="#e8f0fe" stroke="#3a6ed8" stroke-width="2">
<rect x="30" y="460" width="90" height="48" rx="5"/><rect x="155" y="460" width="90" height="48" rx="5"/><rect x="280" y="460" width="90" height="48" rx="5"/>
</g>
<g text-anchor="middle" font-weight="700"><text x="75" y="489">Karte</text><text x="200" y="489">Karte</text><text x="325" y="489">Karte</text></g>
<!-- Pfeilspitzen: hin (zur Karte) und zurück (zum Switch) -->
<g fill="#3a6ed8">
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(122,446.6) rotate(136.2)"/>
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(159,397.4) rotate(-43.8)"/>
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(205,456) rotate(90)"/>
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(195,394) rotate(-90)"/>
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(278,446.6) rotate(43.8)"/>
<path d="M0,0 l-12,-7 l0,14 z" transform="translate(241,397.4) rotate(-136.2)"/>
</g>
<text x="200" y="526" text-anchor="middle" font-size="13" fill="#444">jede Karte hat ihre eigene Leitung</text>
<text x="200" y="554" text-anchor="middle" font-size="16" font-weight="700" fill="#3a6ed8">vollduplex: hin und zurück gleichzeitig</text>
</svg>
