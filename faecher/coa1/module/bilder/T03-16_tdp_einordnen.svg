<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Welche CPU ist wie leicht zu kühlen? Waagerechte Watt-Skala von 0 bis 300 W mit drei Marken: 100 W, Standard-CPUs meist darunter; 120 W, Grenze für lüfterlos; 140 W, ab hier schwer zu kühlen. Darunter vier Kärtchen an ihrer Stelle: Ryzen 7 4800U mit 15 W, Core i3-10100 mit 65 W, Core i9-10850K mit 125 W, Threadripper 3970X mit 280 W. Stand Buch 2020.</title>
<rect width="400" height="480" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">TDP einordnen</text>

<!-- Skala -->
<rect x="30.0" y="292" width="113.3" height="16" fill="#2e7d32"/>
<rect x="143.3" y="292" width="45.3" height="16" fill="#f2c200"/>
<rect x="188.7" y="292" width="181.3" height="16" fill="#c62828"/>
<rect x="30.0" y="292" width="340" height="16" fill="none" stroke="#555" stroke-width="1.5"/>
<text x="30.0" y="284" text-anchor="middle" font-size="13">0</text>
<text x="370.0" y="284" text-anchor="middle" font-size="13">300 W</text>

<!-- Marken -->
<line x1="143.3" y1="292" x2="143.3" y2="222" stroke="#222" stroke-width="2"/>
<text x="137.3" y="236" text-anchor="end" font-weight="700" fill="#2e7d32">100 W</text>
<text x="137.3" y="254" text-anchor="end" font-size="13">Standard-CPUs</text>
<text x="137.3" y="270" text-anchor="end" font-size="13">meist darunter</text>
<line x1="166.0" y1="292" x2="166.0" y2="140" stroke="#222" stroke-width="2"/>
<text x="160.0" y="154" text-anchor="end" font-weight="700" fill="#3a6ed8">120 W</text>
<text x="160.0" y="172" text-anchor="end" font-size="13">Grenze für</text>
<text x="160.0" y="188" text-anchor="end" font-size="13">lüfterlos</text>
<line x1="188.7" y1="292" x2="188.7" y2="62" stroke="#222" stroke-width="2"/>
<text x="194.7" y="76" font-weight="700" fill="#c62828">140 W</text>
<text x="194.7" y="94" font-size="13">ab hier schwer</text>
<text x="194.7" y="110" font-size="13">zu kühlen</text>

<line x1="47.0" y1="306" x2="47.0" y2="336" stroke="#555" stroke-width="2"/>
<circle cx="47.0" cy="300" r="6" fill="#222"/>
<rect x="6" y="336" width="70" height="72" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="41.0" y="356" text-anchor="middle" font-size="13" font-weight="700">Ryzen 7</text>
<text x="41.0" y="373" text-anchor="middle" font-size="13" font-weight="700">4800U</text>
<text x="41.0" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">15 W</text>

<line x1="103.7" y1="306" x2="103.7" y2="336" stroke="#555" stroke-width="2"/>
<circle cx="103.7" cy="300" r="6" fill="#222"/>
<rect x="80" y="336" width="80" height="72" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
<text x="120.0" y="356" text-anchor="middle" font-size="13" font-weight="700">Core i3-</text>
<text x="120.0" y="373" text-anchor="middle" font-size="13" font-weight="700">10100</text>
<text x="120.0" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">65 W</text>

<line x1="171.7" y1="306" x2="171.7" y2="336" stroke="#555" stroke-width="2"/>
<circle cx="171.7" cy="300" r="6" fill="#222"/>
<rect x="166" y="336" width="96" height="72" rx="6" fill="#fff" stroke="#8a6d00" stroke-width="2.5"/>
<text x="214.0" y="356" text-anchor="middle" font-size="13" font-weight="700">Core i9-</text>
<text x="214.0" y="373" text-anchor="middle" font-size="13" font-weight="700">10850K</text>
<text x="214.0" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#8a6d00">125 W</text>

<line x1="347.3" y1="306" x2="347.3" y2="336" stroke="#555" stroke-width="2"/>
<circle cx="347.3" cy="300" r="6" fill="#222"/>
<rect x="272" y="336" width="122" height="72" rx="6" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
<text x="333.0" y="356" text-anchor="middle" font-size="13" font-weight="700">Threadripper</text>
<text x="333.0" y="373" text-anchor="middle" font-size="13" font-weight="700">3970X</text>
<text x="333.0" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">280 W</text>


<g transform="rotate(-6 300 446)">
<rect x="236" y="428" width="128" height="32" rx="4" fill="none" stroke="#666" stroke-width="2"/>
<text x="300" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#666">Stand Buch 2020</text>
</g>
</svg>
