<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="system-ui, sans-serif" fill="#222" role="img">
<title>Zwei Wege zu rechnen. Links: heute ein elektronischer Chip (GPU) mit Milliarden Transistoren, die nur 0 oder 1 kennen; darüber drei große orange Wärmewellen und die Angabe bis ca. 1000 Watt. Rechts: neu ein photonischer Co-Prozessor; ein Laser schickt roten Lichtstrahl in geschwungene Lichtkanäle (Wellenleiter), die Wellen treffen sich in der Mitte und überlagern sich, rechts liest ein Sensor das Ergebnis ab; darüber nur eine kleine Wärmewelle: kaum Wärme beim Rechnen. Unten: Licht ergänzt Strom, ersetzt ihn nicht.</title>
<rect width="400" height="450" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">Zwei Wege zu rechnen</text>

<!-- links: elektronisch -->
