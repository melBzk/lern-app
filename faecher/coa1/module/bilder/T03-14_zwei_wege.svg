<text x="102" y="74" text-anchor="middle" font-size="15" font-weight="700">elektronischer Chip</text>
<text x="102" y="92" text-anchor="middle" font-size="15" font-weight="700">(GPU)</text>
<text x="102" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#E07B00">bis ca. 1000 W</text>
