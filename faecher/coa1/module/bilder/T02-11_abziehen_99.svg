  <rect x="30" y="104" width="210" height="32" rx="6" fill="#f1f3f5" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="42" y="126" font-size="15" fill="#777">128 passt nicht in 99</text>
  <path d="M46,136 V162 H58" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="60" y="146" width="140" height="32" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="130.0" y="169" text-anchor="middle" font-size="18" font-weight="700" fill="#222">− 64 → 35</text>
  <path d="M76,178 V204 H88" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="90" y="188" width="140" height="32" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="160.0" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#222">− 32 → 3</text>
  <path d="M106,220 V246 H118" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="230" width="210" height="32" rx="6" fill="#f1f3f5" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="132" y="252" font-size="15" fill="#777">16, 8, 4 passen nicht in 3</text>
  <path d="M136,262 V288 H148" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="150" y="272" width="140" height="32" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="220.0" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#222">− 2 → 1</text>
  <path d="M166,304 V330 H178" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="314" width="140" height="32" rx="6" fill="#fff" stroke="#3a6ed8" stroke-width="2"/>
  <text x="250.0" y="337" text-anchor="middle" font-size="18" font-weight="700" fill="#222">− 1 → 0</text>
  <text x="200" y="380" text-anchor="middle" font-size="13" fill="#666">Passt → 1 · passt nicht → 0</text>
  <text x="46" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">128</text>
  <rect x="24" y="410" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <text x="46" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#444">0</text>
  <text x="90" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">64</text>
  <rect x="68" y="410" width="44" height="44" fill="#fff4ec" stroke="#e8590c" stroke-width="1.5"/>
  <text x="90" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#e8590c">1</text>
  <text x="134" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">32</text>
  <rect x="112" y="410" width="44" height="44" fill="#fff4ec" stroke="#e8590c" stroke-width="1.5"/>
  <text x="134" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#e8590c">1</text>
  <text x="178" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">16</text>
  <rect x="156" y="410" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <text x="178" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#444">0</text>
  <text x="222" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">8</text>
  <rect x="200" y="410" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <text x="222" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#444">0</text>
  <text x="266" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">4</text>
  <rect x="244" y="410" width="44" height="44" fill="#f6ecd2" stroke="#7a6a48" stroke-width="1.5"/>
  <text x="266" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#444">0</text>
  <text x="310" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">2</text>
  <rect x="288" y="410" width="44" height="44" fill="#fff4ec" stroke="#e8590c" stroke-width="1.5"/>
  <text x="310" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#e8590c">1</text>
  <text x="354" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#444">1</text>
  <rect x="332" y="410" width="44" height="44" fill="#fff4ec" stroke="#e8590c" stroke-width="1.5"/>
  <text x="354" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#e8590c">1</text>
  <text x="200" y="494" text-anchor="middle" font-size="26" font-weight="700" fill="#222">99 = <tspan fill="#e8590c">01100011</tspan></text>
  <text x="200" y="520" text-anchor="middle" font-size="14" fill="#444">Probe: 64 + 32 + 2 + 1 = 99</text>
</svg>
