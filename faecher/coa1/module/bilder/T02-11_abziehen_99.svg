<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 534" font-family="system-ui, sans-serif" role="img">
  <title>Abzieh-Treppe für 99: Oben steht 99. Die 128 passt nicht. Minus 64 bleibt 35. Minus 32 bleibt 3. 16, 8 und 4 passen nicht in 3. Minus 2 bleibt 1. Minus 1 bleibt 0. Unten die Stellenwerte 128 64 32 16 8 4 2 1 mit den Ziffern 0 1 1 0 0 0 1 1. Ergebnis: 99 ist binär 01100011.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="400" height="534" fill="#fff"/>
  <text x="200" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">99 in Binär: Schritt für Schritt abziehen</text>
  <rect x="20" y="46" width="76" height="42" rx="8" fill="#eef4ff" stroke="#3a6ed8" stroke-width="2.5"/>
  <text x="58" y="75" text-anchor="middle" font-size="22" font-weight="700" fill="#222">99</text>
  <text x="108" y="73" font-size="13" fill="#666">Von links fragen: passt der Wert?</text>
