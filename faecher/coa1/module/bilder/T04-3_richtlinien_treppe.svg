<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Treppe mit sechs Richtlinien zum PC-Zusammenstellen, von unten nach oben. 1 Wofür? Anforderungen klären, Symbol Zielscheibe mit Gamepad und Dokument. 2 Budget festlegen, Symbol Geldbörse. 3 Mainboard-Handbuch lesen, Symbol aufgeschlagenes Heft. 4 CPU und RAM passen? Symbol Chip und Speicherriegel mit Häkchen. 5 Vergleichen, optimieren, Symbol Waage. 6 Zusammenspiel: vier Puzzleteile CPU, Mainboard, RAM und Grafik greifen ineinander. Oben über der Treppe: keine feste Bauanleitung.</title>
<rect width="400" height="500" fill="#fff"/>
<text x="200" y="26" text-anchor="middle" font-size="17" font-weight="700">So gehst du vor</text>
<text x="390" y="58" text-anchor="end" font-size="15" font-weight="700" fill="#c62828">keine feste Bauanleitung</text>

<!-- Stufen (unten 1, oben 6) -->
<g fill="#eceff1">
<rect x="10" y="430" width="380" height="58" rx="8"/>
<rect x="22" y="366" width="368" height="58" rx="8"/>
<rect x="34" y="302" width="356" height="58" rx="8"/>
<rect x="46" y="238" width="344" height="58" rx="8"/>
<rect x="58" y="174" width="332" height="58" rx="8"/>
<rect x="70" y="72" width="320" height="96" rx="8"/>
</g>

<!-- Nummern -->
<g fill="#222"><circle cx="28" cy="459" r="11"/><circle cx="40" cy="395" r="11"/><circle cx="52" cy="331" r="11"/><circle cx="64" cy="267" r="11"/><circle cx="76" cy="203" r="11"/><circle cx="88" cy="90" r="11"/></g>
<g fill="#fff" font-size="13" font-weight="700" text-anchor="middle"><text x="28" y="464">1</text><text x="40" y="400">2</text><text x="52" y="336">3</text><text x="64" y="272">4</text><text x="76" y="208">5</text><text x="88" y="95">6</text></g>

<!-- 1 Wofür: Zielscheibe + Gamepad + Dokument -->
<g fill="none" stroke="#c62828" stroke-width="2.5"><circle cx="64" cy="459" r="16"/><circle cx="64" cy="459" r="8"/></g>
<circle cx="64" cy="459" r="3" fill="#c62828"/>
<rect x="88" y="448" width="26" height="14" rx="7" fill="#555"/>
<g fill="#fff"><rect x="93" y="454" width="6" height="2"/><rect x="95" y="452" width="2" height="6"/><circle cx="108" cy="455" r="1.8"/></g>
<rect x="90" y="465" width="12" height="16" fill="#fff" stroke="#3a6ed8" stroke-width="1.5"/>
<g stroke="#3a6ed8" stroke-width="1"><line x1="93" y1="470" x2="99" y2="470"/><line x1="93" y1="474" x2="99" y2="474"/></g>
<text x="128" y="455" font-size="15" font-weight="700">Wofür?</text>
<text x="128" y="474" font-size="13" fill="#444">Anforderungen klären</text>

<!-- 2 Budget: Geldbörse -->
<rect x="58" y="384" width="40" height="26" rx="5" fill="#3a6ed8"/>
<rect x="82" y="391" width="18" height="12" rx="3" fill="#e8f0fe" stroke="#3a6ed8" stroke-width="1.5"/>
<circle cx="89" cy="397" r="2.5" fill="#3a6ed8"/>
<text x="128" y="391" font-size="15" font-weight="700">Budget</text>
<text x="128" y="410" font-size="13" fill="#444">Geld ist Kaufkriterium</text>

<!-- 3 Handbuch: aufgeschlagenes Heft -->
<path d="M70,320 q12,-4 20,2 v24 q-8,-6 -20,-2 z" fill="#fff" stroke="#555" stroke-width="1.8"/>
<path d="M110,320 q-12,-4 -20,2 v24 q8,-6 20,-2 z" fill="#fff" stroke="#555" stroke-width="1.8"/>
<text x="128" y="327" font-size="15" font-weight="700">Mainboard-Handbuch lesen</text>
<text x="128" y="346" font-size="13" fill="#444">CPU? RAM? Laufwerke? Tempo?</text>

<!-- 4 CPU + RAM -->
<rect x="74" y="256" width="20" height="20" rx="2" fill="#555"/>
<g stroke="#555" stroke-width="1.5"><line x1="78" y1="252" x2="78" y2="280"/><line x1="84" y1="252" x2="84" y2="280"/><line x1="90" y1="252" x2="90" y2="280"/></g>
<rect x="98" y="258" width="20" height="10" fill="#2e7d32"/>
<path d="M100,278 l4,4 l9,-9" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="263" font-size="15" font-weight="700">CPU + RAM passen?</text>
<text x="128" y="282" font-size="13" fill="#444">aufs Board? Tempo?</text>

<!-- 5 Waage -->
<g stroke="#555" stroke-width="2" fill="none">
<line x1="104" y1="188" x2="104" y2="218"/><line x1="94" y1="218" x2="114" y2="218"/>
<line x1="88" y1="192" x2="120" y2="192"/>
<path d="M88,192 l-6,12 h12 z"/><path d="M120,192 l-6,12 h12 z"/>
</g>
<text x="134" y="199" font-size="15" font-weight="700">Vergleichen, optimieren</text>
<text x="134" y="218" font-size="13" fill="#444">Tempo, Grenzen</text>

<!-- 6 Zusammenspiel: 4 Puzzleteile -->
<text x="108" y="95" font-size="15" font-weight="700">Zusammenspiel</text>
<text x="228" y="95" font-size="13" fill="#c62828" font-weight="700">das Wichtigste</text>
<g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
<path d="M80,112 h66 v10 a6,6 0 0 1 0,12 v12 h-66 z" fill="#3a6ed8"/>
<path d="M146,112 h76 v10 a6,6 0 0 1 0,12 v12 h-76 v-12 a6,6 0 0 0 0,-12 z" fill="#2e7d32"/>
<path d="M222,112 h70 v10 a6,6 0 0 1 0,12 v12 h-70 v-12 a6,6 0 0 0 0,-12 z" fill="#555"/>
<path d="M292,112 h86 v34 h-86 v-12 a6,6 0 0 0 0,-12 z" fill="#c62828"/>
<text x="112" y="134">CPU</text>
<text x="186" y="134">Mainboard</text>
<text x="258" y="134">RAM</text>
<text x="337" y="134">Grafik</text>
</g>
</svg>
