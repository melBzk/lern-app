<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>LAN und CAN im Vergleich. Oben LAN: ein einzelnes Gebäude, darin drei PCs und ein Drucker, verbunden. Unten CAN: ein umzäuntes Firmengelände, der Campus, mit drei Gebäuden Verwaltung, Halle und Lager. Jedes Gebäude hat ein eigenes kleines Netz, und die Gebäude sind untereinander verbunden.</title>
<defs>
<g id="mpc"><rect x="-14" y="0" width="28" height="20" rx="2" fill="#3a3f4a"/><rect x="-11" y="3" width="22" height="14" fill="#dfe9fb"/><rect x="-3" y="20" width="6" height="5" fill="#555"/></g>
</defs>
<rect width="400" height="560" fill="#fff"/>

<!-- LAN -->
<text x="20" y="32" font-size="17" font-weight="700" fill="#1d3f8a">LAN – ein Gebäude</text>
<path d="M100,90 L200,52 L300,90 Z" fill="#9aa3ad"/>
<rect x="100" y="90" width="200" height="120" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<use href="#mpc" x="135" y="112"/>
<use href="#mpc" x="180" y="112"/>
<use href="#mpc" x="225" y="112"/>
<!-- Drucker -->
<rect x="256" y="106" width="20" height="8" fill="#fff" stroke="#333"/>
<rect x="250" y="113" width="32" height="18" rx="3" fill="#3a3f4a"/>
<rect x="256" y="127" width="20" height="10" fill="#fff" stroke="#333"/>
<g stroke="#3a6ed8" stroke-width="3">
<line x1="120" y1="175" x2="282" y2="175"/>
<line x1="135" y1="137" x2="135" y2="175"/>
<line x1="180" y1="137" x2="180" y2="175"/>
<line x1="225" y1="137" x2="225" y2="175"/>
<line x1="266" y1="137" x2="266" y2="175"/>
</g>
<text x="200" y="200" text-anchor="middle" font-size="13">3 PCs und ein Drucker</text>

<line x1="10" y1="232" x2="390" y2="232" stroke="#ccc" stroke-width="1.5"/>

<!-- CAN -->
<text x="20" y="262" font-size="17" font-weight="700" fill="#1d3f8a">CAN – mehrere Gebäude</text>
<rect x="14" y="276" width="372" height="272" rx="12" fill="#f3f8ee" stroke="#2f6b4f" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="30" y="300" font-size="15" font-weight="700" fill="#2f6b4f">Campus (Firmengelände)</text>

<!-- Verbindungen zwischen Gebaeuden -->
<g stroke="#E07B00" stroke-width="5" fill="none">
<line x1="170" y1="360" x2="230" y2="360"/>
<path d="M100,400 V480 H134"/>
<path d="M300,400 V480 H266"/>
</g>
<text x="200" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#a85a00">verbunden</text>

<!-- Verwaltung -->
<rect x="30" y="318" width="140" height="82" rx="4" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="100" y="342" text-anchor="middle" font-weight="700">Verwaltung</text>
<g fill="#3a6ed8"><line x1="62" y1="374" x2="138" y2="374" stroke="#3a6ed8" stroke-width="2"/><circle cx="62" cy="374" r="6"/><circle cx="100" cy="374" r="6"/><circle cx="138" cy="374" r="6"/></g>
<!-- Halle -->
<rect x="230" y="318" width="140" height="82" rx="4" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="300" y="342" text-anchor="middle" font-weight="700">Halle</text>
<g fill="#3a6ed8"><line x1="262" y1="374" x2="338" y2="374" stroke="#3a6ed8" stroke-width="2"/><circle cx="262" cy="374" r="6"/><circle cx="300" cy="374" r="6"/><circle cx="338" cy="374" r="6"/></g>
<!-- Lager -->
<rect x="134" y="450" width="132" height="82" rx="4" fill="#eef4fd" stroke="#3a6ed8" stroke-width="2"/>
<text x="200" y="474" text-anchor="middle" font-weight="700">Lager</text>
<g fill="#3a6ed8"><line x1="164" y1="506" x2="236" y2="506" stroke="#3a6ed8" stroke-width="2"/><circle cx="164" cy="506" r="6"/><circle cx="200" cy="506" r="6"/><circle cx="236" cy="506" r="6"/></g>
</svg>
