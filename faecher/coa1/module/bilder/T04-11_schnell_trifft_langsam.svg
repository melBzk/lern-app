<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#222">
<title>Schneller Riegel trifft langsamen, dargestellt als Dreibeinlauf. Zwei Läufer sind an einem Bein zusammengebunden. Der linke trägt das Trikot DDR4-3200, 25,6 GB pro Sekunde, 8 GB, und will sprinten. Der rechte trägt DDR4-1600, 12,8 GB pro Sekunde, 8 GB, und läuft langsam. Darüber ein Tacho, der bei 12,8 GB pro Sekunde je Riegel steht, für beide. Bilanz unten: Platz 8 GB plus 8 GB gleich 16 GB, gut. Tempo je Riegel von 25,6 auf 12,8 GB pro Sekunde halbiert, schlecht.</title>
<rect width="400" height="580" fill="#fff"/>
<text x="200" y="26" font-size="17" text-anchor="middle" font-weight="700">Zusammengebunden: Tempo des Langsamen</text>

<!-- Tacho -->
<path d="M110,150 A90,90 0 0 1 290,150" fill="none" stroke="#eceff1" stroke-width="22"/>
<path d="M110,150 A90,90 0 0 1 200,60" fill="none" stroke="#E07B00" stroke-width="22"/>
<line x1="200" y1="150" x2="200" y2="78" stroke="#222" stroke-width="5" stroke-linecap="round"/>
<circle cx="200" cy="150" r="9" fill="#222"/>
<text x="110" y="176" font-size="13" text-anchor="middle" fill="#444">0</text>
<text x="290" y="176" font-size="13" text-anchor="middle" fill="#444">25,6</text>
<text x="200" y="186" font-size="20" text-anchor="middle" font-weight="700" fill="#E07B00">12,8 GB/s</text>
<text x="200" y="206" font-size="13" text-anchor="middle" fill="#444">je Riegel – für beide</text>

<!-- Läufer links (schnell) -->
<text x="105" y="236" font-size="14" text-anchor="middle" font-weight="700" fill="#3a6ed8">will sprinten!</text>
<circle cx="105" cy="268" r="20" fill="#d9d9d9" stroke="#222" stroke-width="2.5"/>
<rect x="42" y="294" width="126" height="76" rx="10" fill="#3a6ed8"/>
<text x="105" y="318" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">DDR4-3200</text>
<text x="105" y="338" font-size="14" text-anchor="middle" fill="#fff">25,6 GB/s</text>
<text x="105" y="358" font-size="14" text-anchor="middle" fill="#fff">8 GB</text>
<line x1="44" y1="304" x2="22" y2="344" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<line x1="166" y1="304" x2="182" y2="270" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<line x1="80" y1="370" x2="56" y2="440" stroke="#222" stroke-width="7" stroke-linecap="round"/>
<line x1="140" y1="370" x2="190" y2="440" stroke="#222" stroke-width="7" stroke-linecap="round"/>

<!-- Läufer rechts (langsam) -->
<text x="295" y="236" font-size="14" text-anchor="middle" font-weight="700" fill="#666">langsam …</text>
<circle cx="295" cy="268" r="20" fill="#d9d9d9" stroke="#222" stroke-width="2.5"/>
<rect x="232" y="294" width="126" height="76" rx="10" fill="#888"/>
<text x="295" y="318" font-size="15" text-anchor="middle" font-weight="700" fill="#fff">DDR4-1600</text>
<text x="295" y="338" font-size="14" text-anchor="middle" fill="#fff">12,8 GB/s</text>
<text x="295" y="358" font-size="14" text-anchor="middle" fill="#fff">8 GB</text>
<line x1="234" y1="304" x2="216" y2="344" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<line x1="356" y1="304" x2="376" y2="344" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<line x1="260" y1="370" x2="210" y2="440" stroke="#222" stroke-width="7" stroke-linecap="round"/>
<line x1="320" y1="370" x2="338" y2="440" stroke="#222" stroke-width="7" stroke-linecap="round"/>

<!-- Band -->
<rect x="176" y="414" width="48" height="16" rx="4" fill="#E07B00"/>
<text x="200" y="460" font-size="13" text-anchor="middle" fill="#444">zusammengebunden</text>

<!-- Bilanz -->
<rect x="10" y="476" width="380" height="94" rx="10" fill="#eceff1"/>
<text x="24" y="508" font-size="16"><tspan font-weight="700">Platz:</tspan> 8 GB + 8 GB = 16 GB</text>
<text x="370" y="508" font-size="20" text-anchor="end" font-weight="700" fill="#2e7d32">✓</text>
<text x="24" y="546" font-size="16"><tspan font-weight="700">Tempo je Riegel:</tspan> 25,6 → 12,8</text>
<text x="370" y="546" font-size="20" text-anchor="end" font-weight="700" fill="#c62828">✗</text>
</svg>
